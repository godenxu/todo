// 合并后的"人员"分面：按姓名拼音排序（不是按数量），未指派/空值固定放最后
function personFacet(entity, rows) {
  const cnt = new Map();
  let empty = 0;
  rows.forEach(r => {
    const people = personUnion(entity, r);
    if (!people.length) { empty++; return; }
    people.forEach(p => cnt.set(p, (cnt.get(p) || 0) + 1));
  });
  const items = [...cnt.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], 'zh'))
    .map(([v, n]) => ({ value: v, label: v, count: n }));
  items.push({ value: '__empty__', label: '（空）', count: empty, isEmpty: true });
  return items;
}
function personFacetBlock(entity, rows, filters, act) {
  const items = personFacet(entity, rows).filter(i => i.count > 0 || filters._person === i.value);
  if (!items.length) return '';
  let h = `<div class="sb-section-title">◆ 人员</div>`;
  h += `<div class="sb-item${!filters._person ? ' active' : ''}" data-act="${act}" data-field="_person" data-val=""><span class="sb-label">全部</span></div>`;
  h += items.map(i =>
    `<div class="sb-item indent${filters._person === i.value ? ' active' : ''}" data-act="${act}" data-field="_person" data-val="${esc(i.value)}">
       <span class="sb-label${i.isEmpty ? ' is-empty-val' : ''}">${esc(i.label)}</span>
       <span class="cnt">${i.count || ''}</span></div>`).join('');
  return h + '<hr class="sb-divider">';
}
function facetBlock(entity, f, rows, filters, act) {
  const items = facet(entity, f, rows).filter(i => i.count > 0 || filters[f.key] === i.value);
  if (!items.length) return '';
  let h = `<div class="sb-section-title">◆ ${esc(f.label)}</div>`;
  h += `<div class="sb-item${!filters[f.key] ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val=""><span class="sb-label">全部</span></div>`;
  // 筛选框里统一用普通文字颜色，不借用该选项在徽章/图表里的专属颜色（保持所有筛选框外观一致）
  h += items.map(i =>
    `<div class="sb-item indent${filters[f.key] === i.value ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val="${esc(i.value)}">
       <span class="sb-label${i.isEmpty ? ' is-empty-val' : ''}">${esc(i.label)}</span>
       <span class="cnt">${i.count || ''}</span></div>`).join('');
  return h + '<hr class="sb-divider">';
}

    html += facetBlock('duty', fieldDef('duty', 'category'), rows, st.filters, 'duty-filter');
  } else {
    sb.classList.add('hidden'); sb.innerHTML = ''; return;
  }
  sb.classList.remove('hidden');
  sb.innerHTML = html + foot;
}

/* 两级树筛选：职责 → 工作。
   计数按当前视图统计；选中某工作时自动展开其所属职责。
   点职责 = 按职责筛选（含其下全部工作），点工作 = 按单个工作筛选。 */
function renderTaskTree(rows) {
  const st = UI.tasks;
  const byWork = new Map();
  let noWork = 0;
  rows.forEach(t => {
    if (!t.work) noWork++;
    else byWork.set(t.work, (byWork.get(t.work) || 0) + 1);
  });

  const dutyMap = new Map();
  visibleWorks().forEach(w => {
    const c = byWork.get(w.id) || 0;
    if (!dutyMap.has(w.duty)) dutyMap.set(w.duty, { count: 0, works: [] });
    const e = dutyMap.get(w.duty);
    e.count += c;
    if (c > 0 || st.filters.work === w.id) e.works.push({ w, c });
  });

  const selWork = st.filters.work && st.filters.work !== '__empty__' ? byId('work', st.filters.work) : null;
  const noneSelected = !st.filters._duty && !st.filters.work;

  let h = `<div class="sb-section-title">◆ 职责 / 工作</div>`;
  h += `<div class="sb-item${noneSelected ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="">
          <span class="sb-label">全部</span><span class="cnt">${rows.length || ''}</span></div>`;

  DB.duties.filter(d => !d.deleted_at).forEach(d => {
    const e = dutyMap.get(d.code);
    if (!e || (!e.count && st.filters._duty !== d.code)) return;
    const open = st.expanded.has(d.code) || (selWork && selWork.duty === d.code);
    h += `<div class="sb-item tree-duty${st.filters._duty === d.code ? ' active' : ''}" data-act="tree-pick" data-duty="${esc(d.code)}" data-work="" title="${esc(d.code + ' ' + d.name)}">
            <span class="sb-caret" data-act="tree-toggle" data-duty="${esc(d.code)}">${open ? '▾' : '▸'}</span>
            <span class="sb-label">${esc(d.code + ' ' + d.name)}</span>
            <span class="cnt">${e.count || ''}</span></div>`;
    if (open) h += e.works.map(({ w, c }) =>
      `<div class="sb-item indent2${st.filters.work === w.id ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="${esc(w.id)}" title="${esc(w.code + ' ' + w.name)}">
         <span class="sb-label">${esc(w.name)}</span><span class="cnt">${c || ''}</span></div>`).join('');
  });

  if (noWork || st.filters.work === '__empty__') {
    h += `<div class="sb-item${st.filters.work === '__empty__' ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="__empty__">
            <span class="sb-label is-empty-val">未归属工作</span><span class="cnt">${noWork || ''}</span></div>`;
  }
  return h + '<hr class="sb-divider">';
}

function renderToolbar() {
  const tb = $('#toolbar');
  if (currentPage === 'tasks') {
    const st = UI.tasks;
    const chips = Object.entries(st.filters).filter(([, v]) => v).map(([k, v]) => {
      if (k === '_person') {
        const txt = v === '__empty__' ? '空' : v;
        return `<span class="filter-chip" data-act="task-filter" data-field="_person" data-val="">人员:${esc(txt)} ×</span>`;
      }
      const f = fieldDef('task', k);
      if (!f) return '';
      const txt = v === '__empty__' ? '空' : label('task', f, v);
      return `<span class="filter-chip" data-act="task-filter" data-field="${k}" data-val="">${esc(f.label)}:${esc(txt)} ×</span>`;
    }).join('');
    const searchChip = st.search ? `<span class="filter-chip" data-act="clear-search" data-page="tasks">搜索:${esc(st.search)} ×</span>` : '';
    tb.innerHTML = `<span id="view-label">${esc(TASK_VIEW_MAP[st.view].label)}</span>${chips}${searchChip}` +
      `<input id="quick-input" type="text" placeholder="新建任务… 标题 $0101 @参与人 !1 ~2026-08-31  回车提交">` +
      `<button class="btn" data-act="col-config" title="选择显示哪些列">▦ 列</button>` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else if (currentPage === 'works' || currentPage === 'duties') {
    const st = UI[currentPage];
    const searchChip = st.search ? `<span class="filter-chip" data-act="clear-search" data-page="${currentPage}">搜索:${esc(st.search)} ×</span>` : '';
    tb.innerHTML = `<span id="view-label">${currentPage === 'works' ? '工作管理' : '职责管理'}</span>` +
      `<button class="btn primary" data-act="${currentPage === 'works' ? 'work-new' : 'duty-new'}">+ 新建${currentPage === 'works' ? '工作' : '职责'}</button>` +
      `<span class="hint">双击单元格编辑</span>${searchChip}` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else {
    const p = PAGES.find(x => x.key === currentPage);
    tb.innerHTML = `<span id="view-label">${esc(p ? p.label : '')}</span>`;
    return;
  }
  bindToolbarInputs(currentPage);
}

function bindToolbarInputs(page) {
  const si = $('#search-input');
  if (si) {
    let timer = null;
    si.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => { UI[page].search = si.value; renderPage(); si.focus(); }, 150);
    });
  }
  const qi = $('#quick-input');
  if (qi) qi.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.stopPropagation();
    const raw = qi.value.trim();
    if (!raw) return;
    snapshot();
    const t = parseQuickInput(raw);
    await Repo.upsert('task', t);
    qi.value = '';
    if (UI.tasks.view === 'deleted') UI.tasks.view = 'all';
    renderShell(); renderPage();
    showSnack(`已添加：${t.title}`);
  });
}

/* =============================================================
   11. 页面分发 / 年度过滤
   ============================================================= */
function inYear(w) { return !DB.settings.year || !w.year || w.year === DB.settings.year; }
function visibleWorks() { return DB.works.filter(w => !w.deleted_at && inYear(w)); }
function visibleTasks() {
  const ok = new Set(visibleWorks().map(w => w.id));
  return DB.tasks.filter(t => !t.work || ok.has(t.work));
}

function renderPage() {
  switch (currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'tasks':     renderTasks();     break;
    case 'works':     renderWorks();     break;
    case 'duties':    renderDuties();    break;
    case 'charts':    renderCharts();    break;
    case 'report':    renderReport();    break;
    case 'data':      renderData();      break;
    case 'permissions': renderPermissions(); break;
  }
  renderSidebar();   // 非任务/工作/职责页会在内部自行隐藏侧栏
}

/* =============================================================
   12. 通用表头 / 单元格
   ============================================================= */
function renderHead(hostSel, entity, cols, st, extra) {
  const all = [...((extra && extra.lead) || []), ...cols, ...((extra && extra.tail) || [])];
  const lastKey = typeof all[all.length - 1] === 'string' ? all[all.length - 1] : all[all.length - 1].key;
  $(hostSel).innerHTML = all.map(c => {
    const isField = typeof c === 'string';
    const f = isField ? fieldDef(entity, c) : null;
    const key = isField ? c : c.key;
    const cls = [];
    const attrs = [`data-key="${key}"`, `style="width:${st.widths[key] || 90}px"`];
    let inner = esc(isField ? f.label : c.label);
    if (key === 'sel') cls.push('col-sel');
    if (!isField && c.act) { attrs.push(`data-act="${c.act}"`, 'style="cursor:pointer"', `title="${esc(c.title || '')}"`); }
    if (isField && f.sortable) {
      cls.push('sortable');
      attrs.push(`data-sort="${key}"`);
      inner += `<span class="sort-icon">${st.sortKey === key ? (st.sortDir === 1 ? '▲' : '▼') : '⇅'}</span>`;
    }
    if (isField) attrs.push('data-draggable="1"');   // 长按可拖动调整字段顺序，固定列（勾选/操作等）不参与
    if (cls.length) attrs.push(`class="${cls.join(' ')}"`);
    const handle = key !== lastKey ? `<div class="col-resize" data-resize="${key}"></div>` : '';
    return `<th ${attrs.join(' ')}>${inner}${handle}</th>`;
  }).join('');
}

function renderCellValue(entity, rec, f, editable) {
  const id = rec[schema(entity).pk];
  const can = editable && !f.readonly;
  const editAttr = can ? ` data-dblact="edit" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';

  switch (f.type) {
    case 'enum': {
      const o = (f.options || []).find(x => x.v === String(rec[f.key])) || {};
      // picker 字段走双击下拉选择（如里程碑引用），不用单击循环切换
      if (f.picker) return `<td class="cell-center"${editAttr}><span class="badge badge-plain ${o.cls || ''}">${esc(o.label || '')}</span></td>`;
      // 任务的"状态"字段改成单击直接下拉选择（跟双击的效果一样），不再是单击循环切换——
      // 状态改成"已完成"时还要检查里程碑，循环切换没法在中途插入这个确认
      const isTaskStatus = entity === 'task' && f.key === 'status';
      const clk = can ? ` data-act="${isTaskStatus ? 'edit' : 'cycle'}" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';
      return `<td class="cell-center"><span class="badge ${o.cls || ''}${clk ? '' : ' ro'}"${clk}>${esc(o.label || '')}</span></td>`;
    }
    case 'date':
      return `<td class="cell-center"${editAttr}><span class="${dateClass(rec[f.key])}">${esc(fmtDate(rec[f.key]))}</span></td>`;
    case 'num': {
      if (f.key === 'progress') {
        const n = Math.max(0, Math.min(100, Number(rec[f.key]) || 0));
        // 有检查点时进度是自动算出来的，不给双击编辑
        const locked = entity === 'task' && hasCheckpoints(rec);
        const pAttr = locked ? ' title="由检查点自动计算"' : editAttr;
        return `<td${pAttr}><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${n}%"></div></div><span class="progress-num">${n}%</span></div></td>`;
      }
      return `<td class="cell-center"${editAttr}>${esc(rec[f.key] === '' ? '' : rec[f.key])}</td>`;
    }
    case 'checkpoints': {
      const cps = DB.milestones.filter(m => m.task === rec.id && !m.deleted_at);
      if (!cps.length) return `<td class="cell-center"${editAttr}><span style="color:var(--text3)">—</span></td>`;
      const doneN = cps.filter(m => m.done === '1').length;
      const sorted = [...cps].sort((a, b) => (a.plan_date || '9999-99-99').localeCompare(b.plan_date || '9999-99-99'));
      const next = sorted.find(m => m.done !== '1') || sorted[sorted.length - 1];
      const tip = cps.map(m => `${m.plan_date || '无日期'} ${m.deliverable || ''}${m.report_level ? `（${(REPORT_LEVELS.find(r => r.v === m.report_level) || {}).label || ''}）` : ''}${m.done === '1' ? ' ✓' : ''}`).join('\n');
      return `<td${editAttr} title="${esc(tip)}"><span class="cp-chip">${doneN}/${cps.length}</span>${next ? `<span class="cell-sub"> ${esc(fmtDate(next.plan_date))} ${esc(next.deliverable || '')}</span>` : ''}</td>`;
    }
    case 'lines': {
      const arr = rec[f.key] || [];
      const txt = arr.map((l, i) => `${i + 1}、${l}`).join('  ');
      return `<td${editAttr} title="${esc(arr.map((l, i) => (i + 1) + '、' + l).join('\n'))}"><span class="lines-preview">${esc(txt)}</span></td>`;
    }
    case 'persons': case 'multi':
      return `<td class="cell-center"${editAttr}>${(rec[f.key] || []).map(v =>
        `<span class="tag-chip${f.type === 'persons' ? ' tag-person' : ''}">${esc(v)}</span>`).join('')}</td>`;
    case 'person':
      return `<td class="cell-center"${editAttr}>${rec[f.key] ? `<span class="tag-chip tag-person">${esc(rec[f.key])}</span>` : ''}</td>`;
    case 'ref': {
      const v = rec[f.key];
      if (!v) return `<td class="cell-center"${editAttr}></td>`;
      const r = byId(f.ref, v);
      if (!r) return `<td class="cell-center"${editAttr}><span style="color:var(--text3)">${esc(v)}?</span></td>`;
      const rs = schema(f.ref);
      const full = (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '');
      return `<td${editAttr} title="${esc(full)}"><span class="cell-title">${r.code ? `<span class="code-chip">${esc(r.code)}</span>` : ''}${esc(r[rs.titleField] || '')}</span></td>`;
    }
    default:
      if (entity === 'task' && f.key === 'code') {
        return `<td class="cell-center" data-act="task-detail" data-id="${esc(id)}" style="cursor:pointer" title="点击查看任务详情"><span class="cell-title">${esc(rec[f.key])}</span></td>`;
      }
      return `<td class="${f.align === 'center' ? 'cell-center' : ''}"${editAttr}><span class="cell-title">${esc(rec[f.key])}</span></td>`;
  }
}

/* =============================================================
   13. 任务页（虚拟滚动）
   ============================================================= */
const ROW_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) || 36;
const VS_BUFFER = 12;
let _taskRows = [];

function renderTasks() {
  const st = UI.tasks;
  renderHead('#tasks-head', 'task', st.cols, st, {
    lead: [{ key: 'sel', label: st.sel.size && st.sel.size === _taskRows.length ? '☑' : '☐', act: 'sel-all', title: '全选 / 取消全选' }],
    tail: [{ key: 'action', label: '✕' }],
  });
  _taskRows = query('task', {
    pool: visibleTasks().filter(TASK_VIEW_MAP[st.view].match),
    filters: st.filters, search: st.search, sortKey: st.sortKey, sortDir: st.sortDir,
  });
  // 选中项可能因筛选/视图变化而不在当前结果里，清掉避免"看不见却被批量改"
  const visible = new Set(_taskRows.map(t => t.id));
  [...st.sel].forEach(id => { if (!visible.has(id)) st.sel.delete(id); });

  $('#status-left').textContent = `${_taskRows.length} 条任务` + (st.sel.size ? ` · 已选 ${st.sel.size}` : '');
  renderBatchBar();
  const empty = $('#empty-state');
  if (!_taskRows.length) { $('#tasks-body').innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  renderTaskViewport();
}

/* 批量操作条：选中任意行后出现 */
function renderBatchBar() {
  const st = UI.tasks, bar = $('#batch-bar');
  if (!st.sel.size) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
  bar.classList.add('show');
  // 已经在「已删除」视图里了，批量操作只剩"彻底删除"这一件事有意义——
  // 再点一次普通"删除"只是给已经软删除的记录再盖一次时间戳，跟单条那行的按钮（🗑 彻底删除）不一致，容易让人以为删除没生效
  const deleteBtn = st.view === 'deleted'
    ? `<button class="btn" data-act="batch-purge" style="color:var(--overdue)">彻底删除</button>`
    : `<button class="btn" data-act="batch-delete" style="color:var(--p1)">删除</button>`;
  bar.innerHTML =
    `<span class="n">已选 ${st.sel.size} 项</span>` +
    (st.view === 'deleted' ? '' : `<button class="btn" data-act="batch" data-field="status">改状态</button>` +
    `<button class="btn" data-act="batch" data-field="owner">改牵头人</button>` +
    `<button class="btn" data-act="batch" data-field="assignees">改参与人</button>` +
    `<button class="btn" data-act="batch" data-field="work">改所属工作</button>` +
    `<button class="btn" data-act="batch" data-field="plan_date">改计划完成</button>` +
    `<button class="btn" data-act="batch" data-field="priority">改优先级</button>`) +
    deleteBtn +
    `<button class="btn" data-act="sel-clear" style="margin-left:auto">取消选择</button>`;
}

function renderTaskViewport() {
  const wrap = $('#tasks-scroll');
  const total = _taskRows.length;
  const colCount = UI.tasks.cols.length + 2;   // 选择列 + 操作列
  const theadH = ($('#page-tasks thead') || {}).offsetHeight || 0;
  const top = Math.max(0, wrap.scrollTop - theadH);
  const start = Math.max(0, Math.floor(top / ROW_H) - VS_BUFFER);
  let end = Math.min(total, Math.ceil((top + wrap.clientHeight) / ROW_H) + VS_BUFFER);
  if (end <= start) end = Math.min(total, start + 1);
  const pad = h => h > 0 ? `<tr class="vs-pad" style="height:${h}px"><td colspan="${colCount}"></td></tr>` : '';
  $('#tasks-body').innerHTML =
    pad(start * ROW_H) + _taskRows.slice(start, end).map(renderTaskRow).join('') + pad((total - end) * ROW_H);
}

function renderTaskRow(t) {
  const del = !!t.deleted_at;
  const selected = UI.tasks.sel.has(t.id);
  const cls = [t.status === 'done' ? 'done-row' : '', t.status === 'hold' ? 'hold-row' : '',
               del ? 'deleted-row' : '', selected ? 'sel-row' : ''].filter(Boolean).join(' ');
  const sel = `<td class="col-sel"><input type="checkbox" class="cb-sel" data-act="sel-row" data-id="${t.id}"${selected ? ' checked' : ''}></td>`;
  // 状态字段现在可以直接点开下拉选择"已完成"，不再需要单独一列一键打勾；已删除视图的恢复按钮挪到操作列里，
  // 跟"彻底删除"放一起，不再单独占一整列
  const tail = del
    ? `<td class="cell-center"><button class="action-btn restore" data-act="task-restore" data-id="${t.id}" title="恢复">↩</button><button class="action-btn del" data-act="task-purge" data-id="${t.id}" title="彻底删除">🗑</button></td>`
    : `<td class="cell-center"><button class="action-btn ms" data-act="task-detail" data-id="${t.id}" title="详情（全部字段）">☰</button><button class="action-btn copy" data-act="task-dup" data-id="${t.id}" title="复制">⧉</button><button class="action-btn del" data-act="task-del" data-id="${t.id}" title="删除">×</button></td>`;
  const cells = UI.tasks.cols.map(k => renderCellValue('task', t, fieldDef('task', k), !del)).join('');
  return `<tr data-id="${t.id}" class="${cls}">${sel}${cells}${tail}</tr>`;
}

function refreshTaskRow(id) {
  const tr = $(`#tasks-body tr[data-id="${id}"]`);
  const t = byId('task', id);
  if (!tr || !t) { renderTasks(); return; }
  const i = _taskRows.findIndex(x => x.id === id);
  if (i >= 0) _taskRows[i] = t;
  tr.outerHTML = renderTaskRow(t);
}

/* =============================================================
   14. 工作页
   ============================================================= */
function renderWorks() {
  const st = UI.works;
  const cols = st.cols;
  renderHead('#works-head', 'work', cols, st, {
    tail: [{ key: 'stat', label: '任务进度' }, { key: 'action', label: '✕' }],
  });
  const rows = query('work', { pool: visibleWorks(), filters: st.filters, search: st.search, sortKey: st.sortKey, sortDir: st.sortDir });
  $('#status-left').textContent = `${rows.length} 项工作`;

  $('#works-body').innerHTML = rows.map(w => {
    const cells = cols.map(k => renderCellValue('work', w, fieldDef('work', k), true)).join('');
    const ts = DB.tasks.filter(t => t.work === w.id && !t.deleted_at);
    const done = ts.filter(t => t.status === 'done').length;
    const doing = ts.filter(t => t.status === 'doing').length;
    const over = ts.filter(isOverdue).length;
    const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
    const statCell = `<td class="cell-center" data-act="work-drill" data-id="${esc(w.id)}" style="cursor:pointer" title="查看该工作下的任务">
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-num">${ts.length ? done + '/' + ts.length : '—'}</span></div>
        ${over ? `<div style="font-size:10px;color:var(--overdue);line-height:1">逾期 ${over}</div>`
               : (doing ? `<div style="font-size:10px;color:var(--text3);line-height:1">进行 ${doing}</div>` : '')}</td>`;
    const act = `<td class="cell-center"><button class="action-btn del" data-act="work-del" data-id="${esc(w.id)}" title="停用">×</button></td>`;
    return `<tr data-id="${esc(w.id)}">${cells}${statCell}${act}</tr>`;
  }).join('');
}

   15. 职责页
   ============================================================= */
function renderDuties() {
  const st = UI.duties;
  const cols = st.cols;
  renderHead('#duties-head', 'duty', cols, st, {
    tail: [{ key: 'stat', label: '工作 / 任务' }, { key: 'action', label: '✕' }],

  const rows = query('duty', {
    pool: DB.duties.filter(d => !d.deleted_at),

  $('#status-left').textContent = `${rows.length} 项职责`;

  $('#duties-body').innerHTML = rows.map(d => {

    const codes = new Set(ws.map(w => w.id));
    const ts = DB.tasks.filter(t => !t.deleted_at && codes.has(t.work));
    const done = ts.filter(t => t.status === 'done').length;
    const stat = `<td class="cell-center" data-act="duty-drill" data-code="${esc(d.code)}" style="cursor:pointer" title="查看该职责下的工作">
       <span style="color:var(--text2)">${ws.length} 项工作</span><span class="cell-sub"> · ${ts.length ? done + '/' + ts.length + ' 任务' : '无任务'}</span></td>`;
    const act = `<td class="cell-center"><button class="action-btn del" data-act="duty-del" data-code="${esc(d.code)}" title="删除">×</button></td>`;
    return `<tr data-id="${esc(d.code)}">${cells}${stat}${act}</tr>`;
  }).join('');
}

function daysFromToday(d) {
  return Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}
function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return iso.slice(0, 10);
}

const CHART_TABS = [
  { key: 'person',   label: '按人' },
  { key: 'task',     label: '按任务' },
  { key: 'work',     label: '按工作' },
  { key: 'category', label: '按职责' },

  { key: 'gantt',    label: '按里程碑' },
];
const chartTableView = {};      // 每个图表是否切到表格视图

/* ---------- 统计 ---------- */
function bucketOf(t) {          // 任务归入哪一段
  if (isOverdue(t)) return 'late';
  if (t.status === 'done') return 'done';
  if (t.status === 'doing') return 'doing';
  if (t.status === 'hold') return 'hold';
  return 'todo';
}
function tally(list) {
  const c = { total: list.length, done: 0, doing: 0, late: 0, todo: 0, hold: 0 };
  list.forEach(t => { c[bucketOf(t)]++; });
  c.rate = c.total ? Math.round(c.done / c.total * 100) : 0;
  return c;
}
// 每个人的"相关任务"= 牵头 ∪ 参与（同一条任务只算一次），这样条长才能反映一个人到底跟多少任务相关，
// 而不是只看他牵头了多少条；牵头数/参与数各自的原始计数额外保留，作为细分参考
function statsByPerson(tasks) {
  const rel = new Map(), leadCount = new Map(), joinCount = new Map();
  tasks.forEach(t => {
    const people = personUnion('task', t);
    const names = people.length ? people : ['（未指派）'];
    names.forEach(nm => { if (!rel.has(nm)) rel.set(nm, []); rel.get(nm).push(t); });
    const o = t.owner || '（未指派）';
    leadCount.set(o, (leadCount.get(o) || 0) + 1);
    (t.assignees || []).forEach(a => joinCount.set(a, (joinCount.get(a) || 0) + 1));
  });
  const names = [...rel.keys()];
  return names.map(nm => ({ name: nm, ...tally(rel.get(nm) || []), lead: leadCount.get(nm) || 0, join: joinCount.get(nm) || 0 }))
    .sort((a, b) => {
      if (a.name === '（未指派）') return 1;
      if (b.name === '（未指派）') return -1;
      return a.name.localeCompare(b.name, 'zh');
    });
}
function tasksOfDuty(tasks, code) {
  const codes = new Set(visibleWorks().filter(w => w.duty === code).map(w => w.id));
  return tasks.filter(t => codes.has(t.work));
}
function statsByDuty(tasks) {
  return DB.duties.filter(d => !d.deleted_at)
    .map(d => ({ code: d.code, name: d.code + ' ' + d.name, category: d.category, ...tally(tasksOfDuty(tasks, d.code)) }))
    .filter(x => x.total > 0);
}
// 报告页"职责下展开工作"用：同一批 tasks，按工作分组统计，带上 duty 编号方便按职责归组
function statsByWork(tasks) {
  return DB.works.filter(w => !w.deleted_at)
    .map(w => ({ id: w.id, code: w.code, name: w.code + ' ' + w.name, duty: w.duty, ...tally(tasks.filter(t => t.work === w.id)) }))
    .filter(x => x.total > 0);
}
function statsByCategory(tasks) {
  return CATEGORIES.map(c => {
    const codes = DB.duties.filter(d => !d.deleted_at && d.category === c.v).map(d => d.code);
    const list = [];
    codes.forEach(code => list.push(...tasksOfDuty(tasks, code)));
    return { key: c.v, name: c.label, color: c.color, ...tally(list) };
  }).filter(x => x.total > 0);
}
// 图表页"按工作"用：按年度、按职责分别统计工作项数量（数的是工作本身，不是工作下面的任务）
function worksByYear() {
  const map = new Map();
  visibleWorks().forEach(w => { if (w.year) map.set(w.year, (map.get(w.year) || 0) + 1); });
  return [...map.entries()].sort((a, b) => a[0] - b[0]).map(([y, n]) => ({ label: y + '年度', n, cls: 'bar-norm' }));
}
function worksByDutyCount() {
  return DB.duties.filter(d => !d.deleted_at)
    .map(d => ({ label: `${d.code} ${d.name}`, n: visibleWorks().filter(w => w.duty === d.code).length }))
    .filter(x => x.n > 0)
    .sort((a, b) => a.label.localeCompare(b.label));
}
// 图表页"按任务"用：某个字段（来源/标签）在当前任务里的取值分布——这两个字段是自由文本，
// 没有固定选项，直接复用侧栏筛选用的 facet() 按出现次数统计，过滤掉计数为 0 的
function taskFieldBars(fieldKey, tasks) {
  return facet('task', fieldDef('task', fieldKey), tasks)
    .filter(i => i.count > 0)
    .map(i => ({ label: i.label, n: i.count }));
}
// SPI（进度绩效指数）= 全部任务"实际进度"之和 ÷ "计划进度"之和，是一个围绕 1 的比值，不是百分比——
// 大于 1 说明整体比计划快，小于 1 说明落后于计划。图表页"按任务/按工作"总览用。
// 单条任务的"计划进度"按 创建时间→计划完成时间 这段时间里、今天已经走过的比例估算；
// 今天已经过了计划完成时间就按 100% 算；没有计划完成时间的任务没法估算"计划进度"，不参与统计。
function computeSPI(tasks) {
  const today = todayStr();
  let sumActual = 0, sumPlanned = 0;
  tasks.forEach(t => {
    if (!t.plan_date) return;
    const actual = Math.max(0, Math.min(100, Number(t.progress) || 0));
    const created = (t.created_at || '').slice(0, 10);
    let planned;
    if (!created || t.plan_date <= created) planned = 100;
    else {
      const total = (new Date(t.plan_date + 'T00:00:00') - new Date(created + 'T00:00:00')) / 86400000;
      const elapsed = (new Date(today + 'T00:00:00') - new Date(created + 'T00:00:00')) / 86400000;
      planned = Math.max(0, Math.min(1, elapsed / total)) * 100;
    }
    sumActual += actual;
    sumPlanned += planned;
  });
  return sumPlanned ? sumActual / sumPlanned : null;
}
// 图表页"按任务"用：不分任务，把当前这批任务名下所有里程碑放一起看完成情况
// （已完成 / 未完成且已逾期 / 未完成且未逾期），是里程碑层面的统计，不是任务层面的
function msCompletionPie(tasks) {
  const ids = new Set(tasks.map(t => t.id));
  const ms = DB.milestones.filter(m => !m.deleted_at && ids.has(m.task));
  const done = ms.filter(m => m.done === '1').length;
  const overdue = ms.filter(m => m.done !== '1' && m.plan_date && m.plan_date < todayStr()).length;
  const pending = ms.length - done - overdue;
  return [
    { label: '已完成', n: done, color: 'var(--c-done)' },
    { label: '逾期未完成', n: overdue, color: 'var(--c-late)' },
    { label: '未完成（未逾期）', n: pending, color: 'var(--c-todo)' },
  ];
}
// 按交付物的"最高呈报层级"分类统计（跟完成情况是两个不同维度，颜色特意不跟状态色/优先级色重复，避免混淆）
const REPORT_LEVEL_COLORS = ['#c9b8e8', '#8f6bc4', '#5b3a8e'];
function msReportLevelStats(tasks) {
  const ids = new Set(tasks.map(t => t.id));
  const ms = DB.milestones.filter(m => !m.deleted_at && ids.has(m.task));
  return REPORT_LEVELS.map((rl, i) => ({
    label: rl.label,
    n: ms.filter(m => (m.report_level || 'section') === rl.v).length,
    color: REPORT_LEVEL_COLORS[i],
  }));
}
function monthKey(iso) { return (iso || '').slice(0, 7); }
/* 待办总量趋势："新增/完成"是流量，看不出积压是否在变大；这里换成存量口径——
   每个时间点"当天为止，还没完成的任务有多少条"，用同一批任务在历史各个快照点重新数一遍。
   granularity: 'month'(近12个月) / 'week'(近12周，周一到周日) / 'day'(近15个自然日)。 */
function backlogAsOf(tasks, dateStr) {
  return tasks.filter(t => {
    const created = (t.created_at || '').slice(0, 10);
    if (created && created > dateStr) return false;   // 那天还没建这条任务
    if (t.status === 'hold') return false;   // 挂起不计入待办，跟 isOpen() 的口径保持一致
    if (t.status !== 'done') return true;
    return !t.actual_date || t.actual_date > dateStr;   // 完成日期在那天之后，那天它还算待办
  }).length;
}
function backlogSeries(tasks, granularity) {
  const today = todayStr();
  let buckets;
  if (granularity === 'day') {
    buckets = [];
    for (let i = 14; i >= 0; i--) {
      const ds = offsetDate(-i);
      buckets.push({ m: ds, label: `${+ds.slice(5, 7)}/${+ds.slice(8, 10)}`, end: ds });
    }
  } else if (granularity === 'week') {
    const dow = new Date().getDay();
    const mondayOff = dow === 0 ? -6 : 1 - dow;
    buckets = [];
    for (let i = 11; i >= 0; i--) {
      const start = offsetDate(mondayOff - i * 7), end = offsetDate(mondayOff - i * 7 + 6);
      buckets.push({ m: start, label: `${+start.slice(5, 7)}/${+start.slice(8, 10)}`, end: end < today ? end : today });
    }
  } else {
    const d = new Date();
    d.setDate(1);
    buckets = [];
    for (let i = 11; i >= 0; i--) {
      const dm = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const m = `${dm.getFullYear()}-${String(dm.getMonth() + 1).padStart(2, '0')}`;
      const monthEnd = fmtLocal(new Date(dm.getFullYear(), dm.getMonth() + 1, 0));
      buckets.push({ m, label: (+m.slice(5) === 1 ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月', end: monthEnd < today ? monthEnd : today });
    }
  }
  return buckets.map(b => ({ m: b.m, label: b.label, backlog: backlogAsOf(tasks, b.end) }));
}
/* 近 n 个月，每月计划完成的任务数（按任务 plan_date）+ 每月计划完成的里程碑数（按里程碑 plan_date） */
/* 从当月开始，往后覆盖到最晚一个还有计划完成任务/里程碑的月份（按需延伸，不是固定窗口） */
function planDueSeries(tasks, milestones) {
  const d = new Date();
  d.setDate(1);
  const startM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const futureMonths = [...tasks.map(t => t.plan_date), ...milestones.map(m => m.plan_date)]
    .map(monthKey).filter(m => m >= startM);
  const endM = futureMonths.length ? futureMonths.reduce((a, b) => a > b ? a : b) : startM;

  const months = [];
  const cur = new Date(d);
  while (true) {
    const m = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`;
    months.push(m);
    if (m >= endM || months.length >= 120) break;   // 120 个月封顶，防止脏数据里的超远日期把这里拖成死循环
    cur.setMonth(cur.getMonth() + 1);
  }
  return months.map(m => ({
    m,
    label: (+m.slice(5) === 1 ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月',
    tasks: tasks.filter(t => monthKey(t.plan_date) === m).length,
    milestones: milestones.filter(ms => monthKey(ms.plan_date) === m).length,
  }));
}
/* 到期分布：已逾期 + 未来 6 周 + 更远，按周聚合比按天更好读 */
function dueBuckets(tasks) {
  const open = tasks.filter(isOpen);
  const b = [{ label: '已逾期', cls: 'bar-late', n: open.filter(isOverdue).length }];
  for (let w = 0; w < 6; w++) {
    const from = offsetDate(w * 7), to = offsetDate(w * 7 + 6);
    b.push({
      label: w === 0 ? '本周内' : `${w * 7 + 1}-${w * 7 + 7}天`,
      cls: w === 0 ? 'bar-soon' : 'bar-norm',
      n: open.filter(t => t.plan_date && t.plan_date >= from && t.plan_date <= to).length,
    });
  }
  const far = offsetDate(42);
  b.push({ label: '更远', cls: 'bar-norm', n: open.filter(t => t.plan_date && t.plan_date > far).length });
  b.push({ label: '无日期', cls: 'bar-norm', n: open.filter(t => !t.plan_date).length });
  return b;
}
/* 到期分布的粗粒度占比（供饼图用，切太多小段不好看）：逾期 / 本周内 / 更远 / 无日期 */
function dueSummary(tasks) {
  const open = tasks.filter(isOpen);
  const late = open.filter(isOverdue).length;
  const soon = open.filter(t => !isOverdue(t) && t.plan_date && t.plan_date >= todayStr() && t.plan_date <= offsetDate(6)).length;
  const none = open.filter(t => !t.plan_date).length;
  const later = open.length - late - soon - none;
  return [
    { key: 'late', label: '已逾期', n: late, color: 'var(--c-late)' },
    { key: 'soon', label: '本周内', n: soon, color: 'var(--c-soon)' },
    { key: 'later', label: '更远', n: later, color: 'var(--c-doing)' },
    { key: 'none', label: '无日期', n: none, color: 'var(--c-track)' },
  ].filter(x => x.n > 0);
}

/* ---------- 通用绘制件 ---------- */
// 横向堆叠条（HTML 实现：文字是真实文本，天然响应式）
function hBar(name, c, max, attrs, muted) {
  const p = n => (n / max * 100).toFixed(2) + '%';
  const tip = `${name}：共 ${c.total} 条 · 已完成 ${c.done} · 进行中 ${c.doing} · 逾期 ${c.late} · 未开始 ${c.todo}${c.hold ? ' · 挂起 ' + c.hold : ''}`;
  // track 是 flex 布局、段与段之间有 gap；数量为 0 的段如果还渲染成一个 width:0 的 flex item，
  // gap 照样会占位，看起来就像最左边缺了一块颜色没铺满——干脆不渲染这种空段
  const todoN = (c.todo || 0) + (c.hold || 0);   // 未开始和挂起视觉上合并成一段，跟图例"未开始/挂起"对应
  const segs = [
    c.done > 0 ? `<span class="seg seg-done" style="width:${p(c.done)}"></span>` : '',
    c.doing > 0 ? `<span class="seg seg-doing" style="width:${p(c.doing)}"></span>` : '',
    c.late > 0 ? `<span class="seg seg-late" style="width:${p(c.late)}"></span>` : '',
    todoN > 0 ? `<span class="seg seg-todo" style="width:${p(todoN)}"></span>` : '',
  ].join('');
  return `<div class="bar-row${attrs ? ' clickable' : ''}${muted ? ' bar-row-muted' : ''}"${attrs || ''} title="${esc(tip)}">
    <span class="nm">${esc(name)}</span>
    <span class="track">${segs}</span>
    <span class="num">${c.done}/${c.total} · ${c.rate}%</span></div>`;
}
// 职责推进条：点箭头能展开看这个职责下面各工作各自的推进情况——工作台和报告页共用同一份渲染逻辑，
// 各自传自己的展开状态（Set）和切换用的 data-act 名字，互不影响
function dutyTreeRowsHTML(dutyStat, workStat, expandedSet, toggleAct) {
  const dutyMax = Math.max(1, ...dutyStat.map(x => x.total));
  if (!dutyStat.length) return '<div class="empty-mini">暂无数据</div>';
  return dutyStat.map(x => {
    const dutyWorks = workStat.filter(w => w.duty === x.code).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
    const isOpen = expandedSet.has(x.code);
    const caret = dutyWorks.length
      ? `<span class="sb-caret" data-act="${toggleAct}" data-code="${esc(x.code)}">${isOpen ? '▾' : '▸'}</span>`
      : `<span class="sb-caret"></span>`;
    const bar = hBar(x.name, x, dutyMax, ` data-act="duty-drill" data-code="${esc(x.code)}"`);
    let workRows = '';
    if (isOpen && dutyWorks.length) {
      const workMax = Math.max(1, ...dutyWorks.map(w => w.total));
      workRows = dutyWorks.map(w => `<div class="report-work-row">${hBar(w.name, w, workMax, ` data-act="work-drill" data-id="${esc(w.id)}"`, true)}</div>`).join('');
    }
    return `<div class="report-duty-row">${caret}<div style="flex:1">${bar}</div></div>${workRows}`;
  }).join('');
}

/* ---------- 折线图（月度趋势） ---------- */
function lineChart(data, w, ariaLabel, keys) {
  const { aKey = 'added', bKey = 'done', aLabel = '新增', bLabel = '完成' } = keys || {};
  // bKey 传 null 表示只画一条线（比如"待办总量趋势"这种单指标图）
  const single = !bKey;
  const h = 210, padL = 34, padR = 12, padT = 12, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...data.map(d => single ? d[aKey] : Math.max(d[aKey], d[bKey])));
  const niceMax = Math.ceil(maxV / 5) * 5 || 5;
  const x = i => padL + (data.length === 1 ? iw / 2 : i / (data.length - 1) * iw);
  const y = v => padT + ih - v / niceMax * ih;
  const path = key => data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(' ');

  let g = '';
  for (let i = 0; i <= 5; i++) {
    const v = niceMax / 5 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const xlab = data.map((d, i) =>
    (data.length <= 12 || i % 2 === 0)
      ? `<text class="ax-text" x="${x(i)}" y="${h - 8}" text-anchor="middle">${esc(d.label)}</text>` : '').join('');
  // 圆点 = 第一条线，方块 = 第二条线（二次编码，蓝绿在蓝黄色盲下接近）
  const mkA = data.map((d, i) => `<circle class="mk mk-new" cx="${x(i).toFixed(1)}" cy="${y(d[aKey]).toFixed(1)}" r="3.5"><title>${esc(d.label)} ${esc(aLabel)} ${d[aKey]}</title></circle>`).join('');
  const mkB = single ? '' : data.map((d, i) => `<rect class="mk mk-done" x="${(x(i) - 3.5).toFixed(1)}" y="${(y(d[bKey]) - 3.5).toFixed(1)}" width="7" height="7"><title>${esc(d.label)} ${esc(bLabel)} ${d[bKey]}</title></rect>`).join('');
  const hit = data.map((d, i) => `<rect x="${(x(i) - iw / data.length / 2).toFixed(1)}" y="${padT}" width="${(iw / data.length).toFixed(1)}" height="${ih}" fill="transparent"
      data-tip="${esc(d.label)}|${d[aKey]}|${single ? '' : d[bKey]}" data-cx="${x(i).toFixed(1)}"/>`).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(ariaLabel || '月度新增与完成任务数趋势')}">
    ${g}
    <line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>
    ${xlab}
    <path class="ln ln-new" d="${path(aKey)}"/>
    ${single ? '' : `<path class="ln ln-done" d="${path(bKey)}"/>`}
    ${mkA}${mkB}
    <line class="crosshair" id="ch-line" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" style="display:none"/>
    <g id="ch-hits">${hit}</g>
  </svg>`;
}

/* ---------- 柱状图（到期分布） ---------- */
function barChart(buckets, w) {
  const h = 190, padL = 30, padR = 10, padT = 12, padB = 40;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...buckets.map(b => b.n));
  const niceMax = Math.ceil(maxV / 4) * 4 || 4;
  const bw = iw / buckets.length;
  const y = v => padT + ih - v / niceMax * ih;

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax / 4 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const bars = buckets.map((b, i) => {
    const bx = padL + i * bw + bw * 0.18, bwid = bw * 0.64;
    const bh = Math.max(b.n ? 2 : 0, ih - (y(b.n) - padT));
    return `<g><rect class="${b.cls}" x="${bx.toFixed(1)}" y="${(padT + ih - bh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${bh.toFixed(1)}" rx="3">
        <title>${esc(b.label)}：${b.n} 条</title></rect>
      ${b.n ? `<text class="ax-text val" x="${(bx + bwid / 2).toFixed(1)}" y="${(padT + ih - bh - 4).toFixed(1)}" text-anchor="middle">${b.n}</text>` : ''}
      <text class="ax-text" x="${(bx + bwid / 2).toFixed(1)}" y="${h - 22}" text-anchor="middle">${esc(b.label)}</text></g>`;
  }).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="未完成任务的到期分布">
    ${g}<line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>${bars}</svg>`;
}
/* 分组柱状图：每个类别并排两根柱子，用来对比两个系列（比如按月计划完成的任务数 vs 里程碑数） */
function groupedBarChart(data, w, keys) {
  const { aKey = 'a', bKey = 'b', aLabel = 'A', bLabel = 'B', aCls = 'bar-norm', bCls = 'bar-done', ariaLabel = '' } = keys || {};
  const h = 190, padL = 30, padR = 10, padT = 12, padB = 40;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...data.map(d => Math.max(d[aKey], d[bKey])));
  const niceMax = Math.ceil(maxV / 4) * 4 || 4;
  const bw = iw / data.length;
  const y = v => padT + ih - v / niceMax * ih;

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax / 4 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const groupW = bw * 0.72, barW = groupW / 2 - 2;
  const bars = data.map((d, i) => {
    const gx = padL + i * bw + (bw - groupW) / 2;
    const aH = Math.max(d[aKey] ? 2 : 0, ih - (y(d[aKey]) - padT));
    const bH = Math.max(d[bKey] ? 2 : 0, ih - (y(d[bKey]) - padT));
    const bx = gx + barW + 4;
    const lbl = (data.length <= 12 || i % 2 === 0)
      ? `<text class="ax-text" x="${(gx + groupW / 2).toFixed(1)}" y="${h - 22}" text-anchor="middle">${esc(d.label)}</text>` : '';
    return `<g>
      <rect class="${aCls}" x="${gx.toFixed(1)}" y="${(padT + ih - aH).toFixed(1)}" width="${barW.toFixed(1)}" height="${aH.toFixed(1)}" rx="2">
        <title>${esc(d.label)} ${esc(aLabel)} ${d[aKey]}</title></rect>
      ${d[aKey] ? `<text class="ax-text val" x="${(gx + barW / 2).toFixed(1)}" y="${(padT + ih - aH - 4).toFixed(1)}" text-anchor="middle">${d[aKey]}</text>` : ''}
      <rect class="${bCls}" x="${bx.toFixed(1)}" y="${(padT + ih - bH).toFixed(1)}" width="${barW.toFixed(1)}" height="${bH.toFixed(1)}" rx="2">
        <title>${esc(d.label)} ${esc(bLabel)} ${d[bKey]}</title></rect>
      ${d[bKey] ? `<text class="ax-text val" x="${(bx + barW / 2).toFixed(1)}" y="${(padT + ih - bH - 4).toFixed(1)}" text-anchor="middle">${d[bKey]}</text>` : ''}
      ${lbl}</g>`;
  }).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(ariaLabel || '分组柱状图')}">
    ${g}<line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>${bars}</svg>`;
}
// 横向列表式条形图：标签在左（太长会自动省略号截断，完整内容看 title）、条在中间、数字在右，
// 复用 .bar-row/.track/.nm/.num 这套现成样式。barChart 那种纵向柱状图标签挤在下面，
// 类别一多、名字一长就会重叠看不清，这种情况（各职责工作数量、来源/标签分布）改用这个
function hBarList(buckets, max) {

/* ---------- 饼图（占比，配合柱状/横条图的绝对量互补） ---------- */
// data: [{label, n, color}]；color 可以是十六进制或 var(--x)，统一走 style 而非 fill 属性
function pieChart(data, size, ariaLabel) {
  const list = data.filter(d => d.n > 0);
  const r = size / 2 - 3, cx = size / 2, cy = size / 2;
  const total = list.reduce((a, d) => a + d.n, 0) || 1;
  let angle = -Math.PI / 2;
  const slices = list.map(d => {
    const frac = d.n / total;
    const a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const mid = (a0 + a1) / 2;
    const mx = cx + r * 0.66 * Math.cos(mid), my = cy + r * 0.66 * Math.sin(mid);
    const pct = Math.round(frac * 100);
    const path = frac >= 0.999
      ? `M${cx},${(cy - r).toFixed(2)} A${r},${r} 0 1 1 ${(cx - 0.01).toFixed(2)},${(cy - r).toFixed(2)} Z`
      : `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    return { d, path, pct, mx, my };
  });

  const paths = slices.map(s =>
    `<path d="${s.path}" style="fill:${s.d.color}"><title>${esc(s.d.label)}：${s.d.n} 条（${s.pct}%）</title></path>`).join('');
  // 占比标签直接写百分比：太窄的扇区（<6%）省略，避免文字互相重叠
  const labels = slices.filter(s => s.pct >= 6).map(s =>
    `<text class="pie-label" x="${s.mx.toFixed(1)}" y="${s.my.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${s.pct}%</text>`).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(ariaLabel || '占比饼图')}">
    ${paths}${labels}
  </svg>`;
}
function pieLegend(data) {
  return `<div class="legend pie-legend">${data.filter(d => d.n > 0).map(d =>
    `<span><i style="background:${d.color}"></i>${esc(d.label)} ${d.n}</span>`).join('')}</div>`;
}

/* ---------- 按里程碑：职责→工作→任务 三级树，叶子节点（任务）才是真正的甘特时间线 ----------
   里程碑本来就是挂在任务下的，之前这里按"工作"合并展示，一个工作下所有任务的里程碑全糊在一行看不出
   是哪条任务的；现在改成跟"各职责/工作推进情况"一样能逐级展开，展开到工作再展开才看到具体任务的时间线。 */
// 按 职责 -> 工作 -> 任务 分组当前这批任务名下的里程碑（只收有计划日期的）
function msTreeGroups(tasks) {
  const msByTask = new Map();
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    if (!msByTask.has(m.task)) msByTask.set(m.task, []);
    msByTask.get(m.task).push(m);
  });
  msByTask.forEach(list => list.sort((a, b) => a.plan_date.localeCompare(b.plan_date)));
  const taskIds = new Set(tasks.map(t => t.id));
  const byDutyWork = new Map();   // dutyCode -> Map(workId -> task[])
  msByTask.forEach((ms, taskId) => {
    if (!taskIds.has(taskId)) return;
    const t = byId('task', taskId);
    if (!t) return;
    const w = byId('work', t.work);
    const dutyCode = w ? w.duty : '';
    if (!byDutyWork.has(dutyCode)) byDutyWork.set(dutyCode, new Map());
    const wm = byDutyWork.get(dutyCode);
    if (!wm.has(t.work)) wm.set(t.work, []);
    wm.get(t.work).push(t);
  });
  return { msByTask, byDutyWork };
}
function milestoneTreeHTML(tasks, dutyExpandedSet, workExpandedSet, dutyToggleAct, workToggleAct) {
  dutyToggleAct = dutyToggleAct || 'ms-duty-toggle';
  workToggleAct = workToggleAct || 'ms-work-toggle';
  const { msByTask, byDutyWork } = msTreeGroups(tasks);
  if (!byDutyWork.size) return `<div class="empty-mini">还没有里程碑。到「任务」页双击某条任务的「里程碑/交付物」列即可添加。</div>`;

  const allOffs = [...msByTask.values()].flat().map(m => daysFromToday(m.plan_date));
  let lo = Math.min(0, ...allOffs) - 5, hi = Math.max(...allOffs) + 5;
  if (hi - lo < 60) hi = lo + 60;
  const pct = d => ((d - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const ticks = [];
  for (let d = lo; d <= hi; d++) {
    const ds = offsetDate(d);
    if (ds.endsWith('-01')) ticks.push({ d, label: (+ds.slice(5, 7)) + '月' });
  }

  // 给定一组里程碑（可能是单条任务的，也可能是折叠层级下合并了多条任务的），画出跨度条+圆点
  const ganttTrackHTML = msList => {
    const ms = [...msList].sort((a, b) => a.plan_date.localeCompare(b.plan_date));
    const a = daysFromToday(ms[0].plan_date), b = daysFromToday(ms[ms.length - 1].plan_date);
    const pts = ms.map(m => {
      const off = daysFromToday(m.plan_date);
      const cls = m.done === '1' ? 'done' : off < 0 ? 'late' : off <= 7 ? 'soon' : 'norm';
      const state = m.done === '1' ? '已完成' : off < 0 ? `逾期 ${-off} 天` : off === 0 ? '今天' : `还有 ${off} 天`;
      return `<span class="gantt-pt ${cls}" style="left:${pct(off)}" title="${esc((m.deliverable || '') + ' · ' + m.plan_date + ' · ' + state)}"></span>`;
    }).join('');
    return `<span class="gantt-track" style="--today:${pct(0)}">
      <span class="gantt-span" style="left:${pct(a)};width:${(((b - a) / (hi - lo)) * 100).toFixed(2)}%"></span>${pts}</span>`;
  };

  // 叶子节点：单条任务自己的甘特时间线，名称前带任务编号
  const taskGanttRow = t => {
    const ms = msByTask.get(t.id);
    const done = ms.filter(m => m.done === '1').length;
    const label = `${t.code ? t.code + ' ' : ''}${t.title}`;
    return `<div class="gantt-row gantt-row-task" data-act="task-detail" data-id="${esc(t.id)}">
      <span class="sb-caret"></span>
      <span class="gantt-name" title="${esc(label)}">${esc(label)}</span>
      ${ganttTrackHTML(ms)}
      <span class="gantt-cnt">${done}/${ms.length}</span></div>`;
  };

  const dutyRows = [...byDutyWork.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([dutyCode, workMap]) => {
    const duty = byId('duty', dutyCode);
    const dutyName = duty ? `${duty.code} ${duty.name}` : '未归属职责';
    const tasksUnderDuty = [...workMap.values()].flat();
    const msUnderDuty = tasksUnderDuty.flatMap(t => msByTask.get(t.id));
    const totalMs = msUnderDuty.length;
    const doneMs = msUnderDuty.filter(m => m.done === '1').length;
    const dOpen = dutyExpandedSet.has(dutyCode);
    const caret = `<span class="sb-caret" data-act="${dutyToggleAct}" data-code="${esc(dutyCode)}">${dOpen ? '▾' : '▸'}</span>`;

    // 职责折叠时，这一行自己聚合展示其下所有工作/任务的里程碑甘特点；展开后交给下面的工作行各自展示
    if (!dOpen) {
      return `<div class="gantt-row gantt-row-duty" data-act="duty-drill" data-code="${esc(dutyCode)}">${caret}
        <span class="gantt-name" title="${esc(dutyName)}">${esc(dutyName)}</span>
        ${ganttTrackHTML(msUnderDuty)}
        <span class="gantt-cnt">${doneMs}/${totalMs}</span></div>`;
    }
    const headerRow = `<div class="gantt-row gantt-row-duty" data-act="duty-drill" data-code="${esc(dutyCode)}">${caret}
      <span class="gantt-name" title="${esc(dutyName)}">${esc(dutyName)}</span>
      <span class="gantt-track" style="--today:${pct(0)}"></span>
      <span class="gantt-cnt">${doneMs}/${totalMs}</span></div>`;

    const workRows = [...workMap.entries()].sort((wa, wb) => {
      const a = byId('work', wa[0]), b = byId('work', wb[0]);
      return ((a && a.code) || '').localeCompare((b && b.code) || '');
    }).map(([workId, taskList]) => {
      const w = byId('work', workId);
      const wName = w ? `${w.code} ${w.name}` : '未归属工作';
      const wOpen = workExpandedSet.has(workId);
      const msUnderWork = taskList.flatMap(t => msByTask.get(t.id));
      const wTotalMs = msUnderWork.length;
      const wDoneMs = msUnderWork.filter(m => m.done === '1').length;
      const wCaret = `<span class="sb-caret" data-act="${workToggleAct}" data-id="${esc(workId)}">${wOpen ? '▾' : '▸'}</span>`;

      // 工作折叠时，这一行自己聚合展示其下所有任务的里程碑甘特点；展开后交给各条任务行自己展示
      if (!wOpen) {
        return `<div class="gantt-row gantt-row-work" data-act="work-drill" data-id="${esc(workId)}">${wCaret}
          <span class="gantt-name" title="${esc(wName)}">${esc(wName)}</span>
          ${ganttTrackHTML(msUnderWork)}
          <span class="gantt-cnt">${wDoneMs}/${wTotalMs}</span></div>`;
      }
      const wHeaderRow = `<div class="gantt-row gantt-row-work" data-act="work-drill" data-id="${esc(workId)}">${wCaret}
        <span class="gantt-name" title="${esc(wName)}">${esc(wName)}</span>
        <span class="gantt-track" style="--today:${pct(0)}"></span>
        <span class="gantt-cnt">${wDoneMs}/${wTotalMs}</span></div>`;
      const taskRows = taskList.sort((a, b) => (a.code || '').localeCompare(b.code || '')).map(taskGanttRow).join('');
      return wHeaderRow + taskRows;
    }).join('');

    return headerRow + workRows;
  }).join('');

  return `<div class="tl">
    <div class="tl-axis"><span class="gantt-name" style="font-size:10px;color:var(--text3)">职责 / 工作 / 任务</span>
      <span class="tl-ticks">${ticks.map(t => `<span class="tk" style="left:${pct(t.d)}">${esc(t.label)}</span>`).join('')}</span>
      <span class="gantt-cnt" style="font-size:10px">完成</span></div>
    ${dutyRows}
    <div class="legend">
      <span><i style="background:var(--c-late)"></i>逾期</span>
      <span><i style="background:var(--c-soon)"></i>7天内</span>
      <span><i style="background:var(--c-doing)"></i>后续</span>
      <span><i style="background:var(--c-done)"></i>已完成</span>
      <span style="color:var(--accent)">│ 竖线为今天</span></div></div>`;
}
// 甘特图的「看数据表」备选视图：按工作展开其下所有任务的里程碑，表头可点击排序（默认按里程碑计划日期）
const GANTT_TABLE_COLS = [
  { key: 'work', label: '工作' },
  { key: 'task', label: '任务' },
  { key: 'deliverable', label: '交付物' },
  { key: 'plan_date', label: '计划日期' },
  { key: 'doneLabel', label: '状态' },
];
let ganttSort = { key: 'plan_date', dir: 1 };
function ganttTableRows() {
  return visibleWorks().flatMap(w => {
    const taskIds = new Set(DB.tasks.filter(t => t.work === w.id && !t.deleted_at).map(t => t.id));
    return DB.milestones.filter(m => taskIds.has(m.task) && !m.deleted_at && m.plan_date).map(m => ({
      work: w.code + ' ' + w.name,
      task: (byId('task', m.task) || {}).title || '',
      deliverable: m.deliverable || '',
      plan_date: m.plan_date,
      doneLabel: m.done === '1' ? '已完成' : '未完成',
    }));
  });
}
function ganttDataTable() {
  const rows = ganttTableRows();
  if (!rows.length) return '<div class="empty-mini">还没有里程碑。到「任务」页双击某条任务的「里程碑/交付物」列即可添加。</div>';
  const { key, dir } = ganttSort;
  rows.sort((a, b) => (a[key] < b[key] ? -dir : a[key] > b[key] ? dir : 0));
  const head = GANTT_TABLE_COLS.map(c => {
    const on = key === c.key;
    return `<th class="sortable" data-act="gantt-sort" data-key="${c.key}">${esc(c.label)}${on ? (dir === 1 ? ' ▲' : ' ▼') : ''}</th>`;
  }).join('');
  const body = rows.map(r => `<tr>${GANTT_TABLE_COLS.map(c => `<td>${esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<table class="dtable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/* 折线图十字准线与浮动提示（各张线图共用同一套逻辑，各自按 wrap id 区分；
   labelA/labelB 是提示框里两条线各自的文字，默认"新增"/"完成"；labelB 传 null 表示单线图，只显示一行提示） */
function bindTrendHover(wrapId, labelA, labelB) {
  const wrap = $('#' + wrapId);
  if (!wrap) return;
  const svg = wrap.querySelector('svg'), line = wrap.querySelector('#ch-line'), tip = wrap.querySelector('#chart-tip');
  if (!svg || !line || !tip) return;
  const la = labelA || '新增', lb = labelB === null ? null : (labelB || '完成');
  svg.addEventListener('mousemove', e => {
    const hit = e.target.closest('[data-tip]');
    if (!hit) return;
    const [label, a, b] = hit.dataset.tip.split('|');
    const cx = +hit.dataset.cx;
    line.setAttribute('x1', cx); line.setAttribute('x2', cx);
    line.style.display = '';
    tip.innerHTML = `<b>${esc(label)}</b><br><i style="background:var(--c-doing);border-radius:50%"></i>${esc(la)} ${esc(a)}` +
      (lb === null ? '' : `<br><i style="background:var(--c-done)"></i>${esc(lb)} ${esc(b)}`);
    tip.classList.add('show');
    const r = wrap.getBoundingClientRect();
    tip.style.left = Math.min(cx + 10, r.width - tip.offsetWidth - 6) + 'px';
    tip.style.top = '14px';
  });
  svg.addEventListener('mouseleave', () => { line.style.display = 'none'; tip.classList.remove('show'); });
}

/* =============================================================
   17b. 报告页：把工作台已有的统计数据整理成一份可读的简报，统计周期可选
   本周/本月/本季/本年；导出支持打印成 PDF、或一键存成图片，不再是纯文本
   ============================================================= */
let reportPeriod = 'week';
const REPORT_PERIODS = [
  { key: 'week',    label: '本周' },
  { key: 'month',   label: '本月' },
  { key: 'quarter', label: '本季' },
  { key: 'year',    label: '本年' },
];
let reportExpanded = new Set();   // 报告页里展开了哪些职责（要看它下面的工作明细）
function periodRange(period) {
  const d = new Date();
  if (period === 'month') {
    return { start: fmtLocal(new Date(d.getFullYear(), d.getMonth(), 1)), end: fmtLocal(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  if (period === 'quarter') {
    const q = Math.floor(d.getMonth() / 3);
    return { start: fmtLocal(new Date(d.getFullYear(), q * 3, 1)), end: fmtLocal(new Date(d.getFullYear(), q * 3 + 3, 0)) };
  }
  if (period === 'year') {
    return { start: fmtLocal(new Date(d.getFullYear(), 0, 1)), end: fmtLocal(new Date(d.getFullYear(), 11, 31)) };
  }
  return { start: startOfWeek(), end: endOfWeek() };   // 默认：本周
}
function buildReportData(period) {
  period = period || 'week';
  const periodLabel = (REPORT_PERIODS.find(p => p.key === period) || REPORT_PERIODS[0]).label;
  const { start: rangeStart, end: rangeEnd } = periodRange(period);
  const tasks = visibleTasks().filter(t => !t.deleted_at);
  const works = visibleWorks();
  const today = todayStr();
  const open = tasks.filter(isOpen);
  const overdue = tasks.filter(isOverdue).sort((a, b) => (a.plan_date || '').localeCompare(b.plan_date || ''));
  // 本期完成的任务：成果导向，落在所选周期内的实际完成日
  const doneInRange = tasks.filter(t => t.status === 'done' && t.actual_date && t.actual_date >= rangeStart && t.actual_date <= rangeEnd)
    .sort((a, b) => (b.actual_date || '').localeCompare(a.actual_date || ''));
  // 职责/工作推进情况：反映当前整体状态，不随周期变化——问的是"现在整体怎么样"，不是"这段时间怎么样"
  const dutyStat = statsByDuty(tasks).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
  const workStat = statsByWork(tasks);
  const taskIds = new Set(tasks.map(t => t.id));
  // 本期已交付的里程碑：成果导向，展示这段时间实际交出的东西
  const deliveredInRange = DB.milestones.filter(m => !m.deleted_at && taskIds.has(m.task) && m.done === '1' && m.actual_date && m.actual_date >= rangeStart && m.actual_date <= rangeEnd)
    .sort((a, b) => (b.actual_date || '').localeCompare(a.actual_date || ''));
  // 本期及逾期、还没交付的里程碑：留到"需要关注"里
  const msAttention = DB.milestones.filter(m => !m.deleted_at && taskIds.has(m.task) && m.done !== '1' && m.plan_date && m.plan_date <= rangeEnd)
    .sort((a, b) => a.plan_date.localeCompare(b.plan_date));
  return { tasks, works, today, period, periodLabel, rangeStart, rangeEnd, open, overdue, doneInRange, dutyStat, workStat, deliveredInRange, msAttention };
}
// 职责推进条：可以点箭头展开，看这个职责下面各工作各自的推进情况

function buildReportText() {

  lines.push(`未完成任务 ${d.open.length}（工作量）· ${d.periodLabel}完成 ${d.doneInRange.length} · ${d.periodLabel}交付里程碑 ${d.deliveredInRange.length}`, '');
  lines.push(`【${d.periodLabel}已完成任务】，共 ${d.doneInRange.length} 条`);
  if (d.doneInRange.length) d.doneInRange.forEach(t => lines.push(`- ${fmtDate(t.actual_date)}　${t.title}（${t.owner || '未指派'}）`));
  else lines.push('- 无');
  lines.push('', `【${d.periodLabel}已交付里程碑】，共 ${d.deliveredInRange.length} 条`);
  if (d.deliveredInRange.length) d.deliveredInRange.forEach(m => { const mt = byId('task', m.task); lines.push(`- ${fmtDate(m.actual_date)}　${m.deliverable || '（未填写交付物）'}（${mt ? mt.title : ''}）`); });
  else lines.push('- 无');
  lines.push('', '【各职责/工作推进情况】');
  if (d.dutyStat.length) {
    d.dutyStat.forEach(x => {
      lines.push(`- ${x.name}：完成 ${x.done}/${x.total}（${x.rate}%），逾期 ${x.late} 条`);
      d.workStat.filter(w => w.duty === x.code).forEach(w => lines.push(`　　· ${w.name}：完成 ${w.done}/${w.total}（${w.rate}%），逾期 ${w.late} 条`));
    });
  } else lines.push('- 暂无数据');
  lines.push('', `【需要关注】逾期任务，共 ${d.overdue.length} 条${d.overdue.length > 15 ? '（仅列前 15 条）' : ''}`);
  if (d.overdue.length) d.overdue.slice(0, 15).forEach(t => lines.push(`- ${fmtDate(t.plan_date)}　${t.title}（${t.owner || '未指派'}）`));
  else lines.push('- 无');
  lines.push('', `【需要关注】即将到期/逾期未交付的里程碑，共 ${d.msAttention.length} 条`);
  if (d.msAttention.length) d.msAttention.forEach(m => { const mt = byId('task', m.task); lines.push(`- ${fmtDate(m.plan_date)}　${m.deliverable || '（未填写交付物）'}（${mt ? mt.title : ''}）`); });
  else lines.push('- 无');
  return lines.join('\n');
}
/* 报告页导出成图片：之前用 SVG foreignObject 把 HTML 塞进图里再画到 canvas 上（"穷人版 html2canvas"），
   实测在真实浏览器里会失败——常见原因是 foreignObject 里塞真实页面 HTML 常常不是合法的 XHTML（比如
   没自闭合的标签），浏览器直接拒绝把它当图片加载；就算加载成功，很多浏览器出于安全考虑，只要 <image>
   画进 canvas 的内容来自"不透明"的外部资源（data: URI 里嵌了任意 HTML 也算），canvas 就会被标记为
   "tainted"，之后再调用 toBlob/toDataURL 会直接抛 SecurityError。
   改成完全不依赖 HTML/CSS 渲染，直接用 canvas 2D 的矩形/文字/测量 API 手工画出报告内容——
   没有任何"外部资源"参与，canvas 不会被污染，toBlob 一定能正常导出。代价是排版逻辑要自己写，
   不能偷懒直接照抄页面的 HTML/CSS。 */
async function exportReportImage() {
  try {
    const d = buildReportData(reportPeriod);
    const W = 860, PAD = 24, LH = 22, GAP = 14;
    const COL = { text: '#2a2a2a', sub: '#6b6b6b', head: '#12466b', overdue: '#c0392b', done: '#1e7d45',
      track: '#e2ded8', bar: ['#1e7d45', '#1a6aa8', '#c0392b', '#b0a99c'], barMuted: ['#8fcda8', '#7fb3d9', '#e2a49b', '#c9c0ae'] };
    const truncate = (ctx, text, maxW) => {
      let t = String(text == null ? '' : text);
      if (ctx.measureText(t).width <= maxW) return t;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    };
    // 跑两遍：第一遍只算总高度不真的画，第二遍按算出来的高度建立正式画布再画——
    // 这样不用提前手动预测内容会有多长
    function layout(ctx, draw) {
      let y = PAD;
      const heading = (text) => {
        if (draw) { ctx.fillStyle = COL.head; ctx.font = 'bold 15px sans-serif'; ctx.fillText(text, PAD, y); }
        y += LH + 4;
      };
      const line = (text, opts = {}) => {
        if (draw) {
          ctx.font = opts.bold ? 'bold 13px sans-serif' : '13px sans-serif';
          ctx.fillStyle = opts.color || COL.text;
          ctx.fillText(truncate(ctx, text, W - PAD * 2 - (opts.indent || 0)), PAD + (opts.indent || 0), y);
        }
        y += opts.gap || LH;
      };
      const rowLine = (dateText, dateColor, title, sub) => {
        if (draw) {
          ctx.font = '12.5px sans-serif';
          ctx.fillStyle = dateColor || COL.sub;
          ctx.fillText(dateText, PAD, y);
          ctx.fillStyle = COL.text;
          ctx.fillText(truncate(ctx, title, W - PAD * 2 - 90 - 170), PAD + 90, y);
          ctx.fillStyle = COL.sub;
          ctx.font = '11.5px sans-serif';
          ctx.fillText(truncate(ctx, sub, 160), W - PAD - 160, y);
        }
        y += LH - 2;
      };
      const bar = (label, c, max, indent, muted) => {
        const nameW = 190 - indent;
        const barX = PAD + 200, barW = W - PAD * 2 - 200, barH = 13;
        if (draw) {
          ctx.font = '12px sans-serif';
          ctx.fillStyle = muted ? COL.sub : COL.text;
          ctx.fillText(truncate(ctx, label, nameW), PAD + indent, y + 10);
          ctx.fillStyle = COL.track;
          ctx.fillRect(barX, y, barW, barH);
          const colors = muted ? COL.barMuted : COL.bar;
          let cx = barX;
          [c.done, c.doing, c.late, (c.todo || 0) + (c.hold || 0)].forEach((n, i) => {
            const w = max ? n / max * barW : 0;
            if (w > 0) { ctx.fillStyle = colors[i]; ctx.fillRect(cx, y, w, barH); cx += w; }
          });
          ctx.fillStyle = COL.sub; ctx.font = '11px sans-serif';
          ctx.fillText(`${c.done}/${c.total} · ${c.rate}%`, barX + barW + 8, y + 10);
        }
        y += LH - 4;
      };
      const empty = (text) => line(text, { color: COL.sub });

      line(`处室工作简报`, { bold: true, gap: LH + 2 });
      line(`统计周期：${d.periodLabel}　${d.rangeStart} ～ ${d.rangeEnd}`, { color: COL.sub, gap: LH + GAP });

      heading('本期总览');
      line(`未完成任务 ${d.open.length}（工作量）　·　${d.periodLabel}完成 ${d.doneInRange.length}　·　${d.periodLabel}交付里程碑 ${d.deliveredInRange.length}`, { gap: LH + GAP });

      heading(`✅ ${d.periodLabel}已完成任务`);
      if (d.doneInRange.length) d.doneInRange.slice(0, 10).forEach(t => rowLine(fmtDate(t.actual_date), COL.done, t.title, `${workName(t.work)} · ${t.owner || '未指派'}`));
      else empty('（无）');
      y += GAP;

      heading(`🎯 ${d.periodLabel}已交付里程碑`);
      if (d.deliveredInRange.length) d.deliveredInRange.slice(0, 10).forEach(m => { const mt = byId('task', m.task); rowLine(fmtDate(m.actual_date), COL.done, m.deliverable || '（未填写交付物）', mt ? mt.title : ''); });
      else empty('（无）');
      y += GAP;

      heading('▤ 各职责/工作推进情况');
      const dutyMax = Math.max(1, ...d.dutyStat.map(x => x.total));
      d.dutyStat.forEach(x => {
        bar(x.name, x, dutyMax, 0, false);
        const dutyWorks = d.workStat.filter(w => w.duty === x.code);
        if (reportExpanded.has(x.code) && dutyWorks.length) {
          const workMax = Math.max(1, ...dutyWorks.map(w => w.total));
          dutyWorks.forEach(w => bar(w.name, w, workMax, 16, true));
        }
      });
      y += GAP;

      heading('⚠ 需要关注：逾期任务');
      if (d.overdue.length) d.overdue.slice(0, 10).forEach(t => rowLine(fmtDate(t.plan_date), COL.overdue, t.title, `${workName(t.work)} · ${t.owner || '未指派'}`));
      else empty('没有逾期任务 👍');
      if (d.overdue.length > 10) line(`还有 ${d.overdue.length - 10} 条…`, { color: COL.sub });
      y += GAP;

      heading('⚠ 需要关注：即将到期/逾期未交付的里程碑');
      if (d.msAttention.length) d.msAttention.slice(0, 10).forEach(m => { const mt = byId('task', m.task); rowLine(fmtDate(m.plan_date), m.plan_date < d.today ? COL.overdue : COL.sub, m.deliverable || '（未填写交付物）', mt ? mt.title : ''); });
      else empty('近期没有未交付的里程碑 👍');

      return y + PAD;
    }

    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    const totalH = layout(mctx, false);

    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = totalH * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, totalH);
    layout(ctx, true);

    canvas.toBlob(blob => {
      if (!blob) { showSnack('生成图片失败，建议改用"打印/导出 PDF"'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `处室工作简报_${todayStr()}.png`;
      a.click();
      showSnack('图片已生成，请留意浏览器的下载提示');
    });
  } catch (e) {
    showSnack('生成图片失败：' + (e && e.message ? e.message : e) + '，建议改用"打印/导出 PDF"');
  }
}

/* =============================================================
   19. 快捷输入
   ============================================================= */
// Excel 会把 0101 存成数字 101，输入/导入时统一补齐为 4 位
function padCode(s) {
  const v = String(s == null ? '' : s).trim();
  return /^\d{3}$/.test(v) ? '0' + v : v;
}
function parseQuickInput(raw) {
  const t = blank('task', { status: 'todo', priority: '2', progress: 0 });
  const parts = [];
  for (const tok of raw.trim().split(/\s+/)) {
    if (tok.startsWith('$') && tok.length > 1) {
      const key = tok.slice(1), code = padCode(key);
      // 先按编号在当前年度内匹配，再退回按名称模糊匹配
      const byCode = visibleWorks().find(x => x.code === code);
      if (byCode) { t.work = byCode.id; continue; }
      const w = visibleWorks().find(x => x.name.includes(key));
      if (w) { t.work = w.id; continue; }
      continue;
    }
    if (tok.startsWith('@') && tok.length > 1) { t.assignees.push(tok.slice(1)); continue; }
    if (tok.startsWith('~') && tok.length > 1) { const d = parseDue(tok.slice(1)); if (d) { t.plan_date = d; continue; } }
    if (/^!([123])$/.test(tok)) { t.priority = tok[1]; continue; }
    const d = parseDue(tok);
    if (d && !t.plan_date) { t.plan_date = d; continue; }
    parts.push(tok);
  }
  t.title = parts.join(' ') || '未命名任务';
  // 只有"员工"角色建任务才默认自己是牵头人（这样才有编辑权限）；其它角色照旧退回工作牵头人兜底，
  // 不强行把任务都算到操作者自己头上——组长/处室领导/部门领导/管理员经常是替别人建任务，不该被默认牵头
  if (!t.owner) {
    const iAmStaff = !!myUser() && myUser().role === 'staff';
    if (iAmStaff) t.owner = DB.settings.me;
    else if (t.work) { const w = byId('work', t.work); if (w) t.owner = w.owner; }
  }
  if (t.work) t.code = nextTaskCode(t.work);
  return t;
}

// 这些 data-act 只认 change 事件、不认 click：
// - perm-toggle 是 checkbox——click 时 el.checked 虽已是新值，但会跟 change 重复触发一次
// - account-role-change 是 select——点开下拉框本身就会先发一个 click（这时用户还没选完！），
//   之前就是因为点击分发器把这次"打开下拉框"的 click 也当成了"确认选择"，选都没选就提交了
const CHANGE_ONLY_ACTS = ['account-role-change', 'perm-toggle', 'account-jobno-change'];
document.addEventListener('click', e => {
  if (e.target.closest('.col-resize')) return;
  const el = e.target.closest('[data-act]');
  if (el) {
    if (!CHANGE_ONLY_ACTS.includes(el.dataset.act)) {
      const fn = ACTIONS[el.dataset.act];
      if (fn) { fn(el.dataset, el, e); return; }
    } else return;
  }
  const th = e.target.closest('th[data-sort]');
  if (th && UI[currentPage]) {
    const st = UI[currentPage], key = th.dataset.sort;
    if (st.sortKey === key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
    renderPage();
  }
});
document.addEventListener('change', e => {
  const rc = e.target.closest('[data-act="account-role-change"]');
  if (rc) ACTIONS['account-role-change'](rc.dataset, rc, e);
  const pt = e.target.closest('[data-act="perm-toggle"]');
  if (pt) ACTIONS['perm-toggle'](pt.dataset, pt, e);
  const jn = e.target.closest('[data-act="account-jobno-change"]');
  if (jn) ACTIONS['account-jobno-change'](jn.dataset, jn, e);
  if (e.target.classList.contains('cp-chk')) updateCpProgressPreview();   // 勾选/取消里程碑完成状态，实时刷新进度预览
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-dblact]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.dblact];
  if (fn) fn(el.dataset, el, e);
});
// 里程碑行拖动排序：按住行首的 ⠿ 才能拖，拖到别的行上方/下方就把这一行搬过去，标准的可排序列表写法
let _cpDragRow = null;
document.addEventListener('dragstart', e => {
  const handle = e.target.closest('.cp-drag-handle');
  if (!handle) return;
  _cpDragRow = handle.closest('[data-cp-row]');
  if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => {
  if (!_cpDragRow) return;
  const overRow = e.target.closest('[data-cp-row]');
  if (!overRow || overRow === _cpDragRow || !overRow.closest('#cp-list')) return;
  e.preventDefault();
  const rect = overRow.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  overRow.parentNode.insertBefore(_cpDragRow, before ? overRow : overRow.nextSibling);
});
document.addEventListener('dragend', () => { _cpDragRow = null; });
document.addEventListener('mousedown', e => {
  const h = e.target.closest('.col-resize');
  if (h) { startResize(e, h.dataset.resize, h); return; }
  const th = e.target.closest('th[data-draggable]');
  if (th) armColDrag(e, th);
});

/* ---- 长按表头拖动，调整字段显示顺序（任务/工作/职责三张表通用） ---- */
function reorderCols(cols, key, targetKey, before) {
  const arr = [...cols];
  const from = arr.indexOf(key);
  if (from === -1) return cols;
  arr.splice(from, 1);
  let to = arr.indexOf(targetKey);
  if (to === -1) return cols;
  if (!before) to += 1;
  arr.splice(to, 0, key);
  return arr;
}
function armColDrag(e, th) {
  if (e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY;
  const timer = setTimeout(() => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    beginColDrag(th);
  }, 350);
  const onMove = ev => {
    // 计时未到就移动太多：不算长按，交还给普通点击（比如排序）
    if (Math.abs(ev.clientX - startX) > 6 || Math.abs(ev.clientY - startY) > 6) {
      clearTimeout(timer);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
  };
  const onUp = () => {
    clearTimeout(timer);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function beginColDrag(th) {
  th.classList.add('col-dragging');
  const st = UI[currentPage];
  const key = th.dataset.key;
  const row = th.parentElement;
  let drop = null;
  // 长按拖动结束后紧跟的那次 click 要吞掉，否则会被当成表头排序点击
  const swallowClick = ev => { ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', swallowClick, true); };
  document.addEventListener('click', swallowClick, true);

  const onMove = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const overTh = el && el.closest && el.closest('th[data-draggable]');
    row.querySelectorAll('th').forEach(t => t.classList.remove('col-drop-before', 'col-drop-after'));
    if (overTh && overTh !== th) {
      const r = overTh.getBoundingClientRect();
      const before = ev.clientX < r.left + r.width / 2;
      overTh.classList.add(before ? 'col-drop-before' : 'col-drop-after');
      drop = { key: overTh.dataset.key, before };
    } else drop = null;
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    th.classList.remove('col-dragging');
    row.querySelectorAll('th').forEach(t => t.classList.remove('col-drop-before', 'col-drop-after'));
    if (drop && drop.key !== key && st) {
      st.cols = reorderCols(st.cols, key, drop.key, drop.before);
      persistUI();
      renderPage();
    }
    setTimeout(() => document.removeEventListener('click', swallowClick, true), 0);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, key, handle) {
  e.preventDefault(); e.stopPropagation();
  const st = UI[currentPage]; if (!st) return;
  const startX = e.clientX, startW = st.widths[key] || 90;
  handle.classList.add('resizing');
  const th = handle.closest('th');
  const onMove = ev => {
    const w = Math.max(40, startW + (ev.clientX - startX));
    st.widths[key] = w;
    if (th) th.style.width = w + 'px';
  };
  const onUp = () => {
    handle.classList.remove('resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    persistUI();
    renderPage();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* =============================================================
   21. 编辑器
   ============================================================= */
let _activeEdit = null;

function openEditor(entity, id, fieldKey, td) {
  const f = fieldDef(entity, fieldKey);
  if (!f || f.readonly) return;
  const rec = byId(entity, id);
  if (entity === 'duty' && !hasPermission('manage_duty_work')) { showSnack('为了防止误操作，编辑职责需要"新建/编辑/删除职责与工作"权限'); return; }
  if ((entity === 'task' || entity === 'work') && !canEditRecord(entity, rec)) {
    showSnack(`为了防止误操作，只能编辑自己负责或参与的${entity === 'task' ? '任务' : '工作'}`);
    return;
  }
  if (entity === 'task' && fieldKey === 'work') return openWorkPicker(entity, id, f, td);
  if (f.type === 'checkpoints') return openTaskDetail(id);
  if (['single', 'multi', 'person', 'persons', 'enum', 'ref'].includes(f.type)) return openSelectPopup(entity, id, f, td);
  if (f.type === 'lines') return openLinesEditor(entity, id, fieldKey);
  if (f.type === 'date') return openDatePicker(entity, id, fieldKey, td);
  openInlineEdit(entity, id, f, td);
}

function openInlineEdit(entity, id, f, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const original = (r[f.key] === '' || r[f.key] == null) ? '' : String(r[f.key]);
  const input = document.createElement('input');
  input.className = 'inline-input';
  input.value = original;
  td.innerHTML = ''; td.appendChild(input);
  input.focus(); input.select();

  let done = false;
  const finish = async cancel => {
    if (done) return; done = true; _activeEdit = null;
    let val = input.value.trim();
    if (cancel || val === original) { rerenderRow(entity, id); return; }
    if (f.type === 'num') {
      val = val === '' ? '' : Math.max(0, Number(val) || 0);
      if (f.key === 'progress') val = Math.min(100, val);
    }
    snapshot();
    const before = entity === 'task' ? clone(r) : null;
    r[f.key] = val;
    if (before) pushLog(id, diffTask(before, r, [f.key]));
    await Repo.upsert(entity, r);
    afterEdit(entity, id, f.key);
  };
  _activeEdit = { commit: () => finish(false) };
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); finish(false); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(true); }
  });
  input.addEventListener('blur', () => setTimeout(() => finish(false), 80));
}
function commitActiveEdit() { if (_activeEdit) { const c = _activeEdit; _activeEdit = null; c.commit(); } }
function rerenderRow(entity, id) {
  if (entity === 'task' && currentPage === 'tasks') refreshTaskRow(id); else renderPage();
}

/* ---- 选择弹层（single/multi/person/persons/enum/ref 通用） ---- */
let _sp = null, spCloseListener = null;

function openSelectPopup(entity, id, f, td) {
  commitActiveEdit();
  closeWorkSub();
  const r = byId(entity, id); if (!r) return;
  const multi = f.type === 'multi' || f.type === 'persons';
  const allowNew = !['enum', 'ref'].includes(f.type);
  const cur = values(entity, r, f);
