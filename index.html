<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- © 科技规划处 徐捷 版权所有 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 别缓存这个页面。整个程序就这一个文件，一旦被缓存住，同事打开的就是旧代码——
     旧代码可能带着已经修好的、会写坏共享数据的问题（里程碑被存成好几套重复的那次就是这么来的）。
     说明白：这几行只对"通过 HTTP 打开"的情况有效；直接双击本地文件（file://）时浏览器基本不理会，
     操作系统对网络盘的文件缓存更管不着。所以它们只是第一道便宜的防线，
     真正兜底的是程序自己的版本自检（见 checkAppVersion）——认出自己是旧版就停止写入。 -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>科技规划处工作管理系统</title>
<style>
/* ===== RESET & VARS ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0ede8;
  --surface: #faf8f5;
  --border: #ddd9d3;
  --border2: #ccc8c2;
  --text: #1a1815;
  --text2: #5a5550;
  --text3: #9a9590;
  --accent: #2c5f8a;
  --accent-light: #e8f0f7;
  --p1: #c0392b; --p1-bg: #fdecea; --p1-border: #f5c6c2;
  --p2: #d4600a; --p2-bg: #fef3e8; --p2-border: #f8d9b8;
  --p3: #4a7fa5; --p3-bg: #eaf2f8; --p3-border: #c0d9eb;
  --done: #27ae60;
  --overdue: #c0392b;
  --deleted-bg: #fff8f8;
  --snack-bg: #1a1815;
  --sidebar-w: 190px;
  --row-h: 36px;
  /* 图表专用色板（经 CVD / 对比度校验，最差相邻对 ΔE 17.2）。
     与徽章用的 --done/--overdue 分开：那些是文字色，标准不同。
     琥珀 --c-soon 对比度 2.43，故凡使用处必须同时有可见文字标签。 */
  --c-late:  #c0392b;
  --c-soon:  #e0900a;
  --c-doing: #1a6aa8;
  --c-done:  #1e7d45;
  --c-track: #e2ded8;
  --c-todo:  #b0a99c;   /* 未开始（含挂起）：比 --c-track 更深一档，避免跟条形图自己的底色混在一起分不清 */
  --font: "Noto Sans CJK SC","Source Han Sans CN","Microsoft YaHei",sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); font-size: 13px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; user-select: none; }

/* ===== TOPBAR ===== */
#topbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 42px; }
.logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .03em; white-space: nowrap; flex-shrink: 0; margin-right: 6px; }
#nav { display: flex; gap: 2px; height: 100%; }
.nav-item { display: flex; align-items: center; padding: 0 13px; font-size: 12.5px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav-item:hover { background: var(--bg); }
.nav-item.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
#topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#year-select { height: 26px; border: 1px solid var(--border2); border-radius: 4px; background: var(--bg); font-family: var(--font); font-size: 12px; color: var(--text2); padding: 0 4px; }
.me-tag { font-size: 12px; color: var(--text2); background: var(--accent-light); border-radius: 10px; padding: 2px 9px; cursor: pointer; }
.me-tag:hover { background: var(--border2); }
.share-connect-btn { font-size: 12px; color: #fff; background: var(--overdue); border-radius: 10px; padding: 2px 9px; cursor: pointer; margin-right: 6px; }
.share-connect-btn:hover { opacity: .85; }
/* "有改动还没同步给大家"——这条比其它几种状态严重得多（别人根本看不到你的活儿），
   用加粗 + 呼吸闪烁，确保不会被当成可以忽略的小提示 */
.share-connect-btn.urgent { font-weight: 700; animation: unsynced-pulse 1.6s ease-in-out infinite; }
@keyframes unsynced-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
/* "立即同步"是一切正常时的常驻按钮，不是警告——不能跟上面那些红底的挤在一个视觉层级，
   否则天天红着，真出问题时反而没人当回事 */
.share-connect-btn.calm { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
.share-connect-btn.calm:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
.share-connect-btn .sync-age { opacity: .7; }
.demo-data-badge { font-size: 12px; color: #fff; background: var(--p2); border-radius: 10px; padding: 2px 9px; }
.btn { height: 26px; padding: 0 10px; border: 1px solid var(--border2); border-radius: 4px; background: var(--surface); font-family: var(--font); font-size: 12px; color: var(--text2); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg); border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { opacity: .88; color: #fff; }
.btn.danger { color: var(--overdue); border-color: var(--overdue); }
.btn.danger:hover { background: var(--overdue); color: #fff; }

/* ===== LAYOUT ===== */
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border2); }
#sidebar.hidden { display: none; }
.sb-section-title { padding: 5px 10px 4px; font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: .05em; text-align: center; flex-shrink: 0; background: var(--border); border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
.sb-item { display: flex; align-items: center; justify-content: space-between; padding: 3px 10px; cursor: pointer; color: var(--text2); font-size: 12.5px; line-height: 1.25; transition: background .1s; border-left: 3px solid transparent; }
.sb-item:hover { background: var(--bg); }
.sb-item.active { background: var(--accent-light); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.sb-item .cnt { font-size: 10px; color: var(--text3); background: var(--border); border-radius: 8px; padding: 0 5px; min-width: 18px; text-align: center; flex-shrink: 0; margin-left: 4px; }
.sb-item.active .cnt { background: var(--accent); color: #fff; }
.sb-item .sb-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .sb-label.is-empty-val { color: var(--text3); font-style: italic; }
.sb-item.indent { padding-left: 20px; font-size: 12px; }
.sb-item.indent2 { padding-left: 28px; font-size: 12px; }
.sb-divider { border: none; border-top: 1px solid var(--border); margin: 5px 0; }
/* 树形筛选：职责 → 工作 */
.sb-caret { width: 12px; flex-shrink: 0; font-size: 9px; color: var(--text3); text-align: center; cursor: pointer; }
.sb-caret:hover { color: var(--accent); }
.sb-item.tree-duty { padding-left: 4px; gap: 2px; }
.sb-copyright { padding: 10px 12px 8px; font-size: 10px; color: var(--text3); line-height: 1.6; margin-top: auto; border-top: 1px solid var(--border); }

#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#toolbar { display: flex; align-items: center; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 34px; gap: 8px; }
#view-label { font-size: 12px; color: var(--text2); font-weight: 600; }
.filter-chip { font-size: 11px; background: var(--accent-light); color: var(--accent); border-radius: 10px; padding: 1px 8px; cursor: pointer; }
.filter-chip:hover { background: var(--border2); }
#search-input { margin-left: auto; width: 170px; height: 24px; padding: 0 8px; border: 1px solid var(--border2); border-radius: 3px; background: var(--bg); font-family: var(--font); font-size: 12px; color: var(--text); outline: none; }
#search-input:focus { border-color: var(--accent); }

/* ===== 页面容器 ===== */
.page { flex: 1; overflow: auto; display: none; }
.page.active { display: block; }
#page-tasks.active, #page-works.active, #page-duties.active { display: flex; flex-direction: column; overflow: hidden; }
.scroll-body { flex: 1; overflow: auto; position: relative; }
.scroll-body::-webkit-scrollbar, .page::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll-body::-webkit-scrollbar-thumb, .page::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ===== 表格 ===== */
table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 640px; }
thead tr { background: var(--surface); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
th { padding: 5px 8px; font-size: 11px; font-weight: 600; color: var(--text3); text-align: center; letter-spacing: .04em;
     border-right: 1px solid var(--border); white-space: nowrap; overflow: hidden; position: relative; cursor: pointer; user-select: none; }
th:last-child { border-right: none; cursor: default; }
th.sortable:hover { background: var(--bg); color: var(--text2); }
th .sort-icon { margin-left: 3px; font-size: 9px; }
.col-resize { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 11; }
.col-resize:hover, .col-resize.resizing { background: var(--accent); opacity: .4; }
/* 长按表头拖动调整字段顺序 */
th[data-draggable] { position: relative; }
th.col-dragging { background: var(--accent-light); color: var(--accent); opacity: .85; }
th.col-drop-before::before, th.col-drop-after::after {
  content: ''; position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); z-index: 12; }
th.col-drop-before::before { left: 0; }
th.col-drop-after::after { right: 0; }

/* 行高必须严格等于 --row-h：虚拟滚动按固定行高换算可视区间 */
tbody tr { border-bottom: 1px solid var(--border); height: var(--row-h); transition: background .08s; }
tbody tr:hover { background: var(--surface); }
tbody tr.done-row { opacity: .6; }
tbody tr.done-row .cell-title { text-decoration: line-through; color: var(--text3); }
tbody tr.hold-row { opacity: .55; }
tbody tr.deleted-row { background: var(--deleted-bg); opacity: .7; }
tbody tr.vs-pad, tbody tr.vs-pad:hover { border: none; background: none; transition: none; }
tbody tr.vs-pad td { border: none; padding: 0; }
td { padding: 0 8px; font-size: 12.5px; color: var(--text); vertical-align: middle; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
td:last-child { border-right: none; }
td.cell-center { text-align: center; }
.cell-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.cell-sub { color: var(--text3); font-size: 11px; }

/* 徽章 */
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; border: 1px solid transparent; cursor: pointer; }
.badge.badge-plain { font-weight: 400; }
.badge:hover { opacity: .75; }
.badge.ro, .badge.ro:hover { cursor: default; opacity: 1; }
.pri-1 { background: var(--p1-bg); color: var(--p1); border-color: var(--p1-border); }
.pri-2 { background: var(--p2-bg); color: var(--p2); border-color: var(--p2-border); }
.pri-3 { background: var(--p3-bg); color: var(--p3); border-color: var(--p3-border); }
.st-todo  { background: #f0eeea; color: #6b6660; border-color: #ddd9d3; }
.st-doing { background: var(--accent-light); color: var(--accent); border-color: #c0d9eb; }
.st-done  { background: #e8f5e9; color: #2e7d32; border-color: #c3e6c5; }
.st-hold  { background: #f3f1ee; color: #9a9590; border-color: #ddd9d3; }
.tag-chip { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 0 5px; border-radius: 3px; margin-right: 2px; }
.tag-person { background: #eef3f8; color: #2c5f8a; }
.due-overdue { color: var(--overdue); font-weight: 600; }
.due-today { color: var(--p2); font-weight: 600; }
.code-chip { font-family: Consolas, Menlo, monospace; font-size: 11px; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.cp-chip { display: inline-block; font-size: 11px; background: #fff5e6; color: #b5651d; border: 1px solid #f0d5b0; border-radius: 3px; padding: 0 5px; }
.lines-preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.action-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 2px 4px; border-radius: 3px; font-family: var(--font); }
.action-btn.del:hover { color: var(--p1); background: var(--p1-bg); }
.action-btn.restore:hover { color: var(--done); background: #e8f5e9; }
.action-btn.copy:hover, .action-btn.ms:hover { color: var(--accent); background: var(--accent-light); }
.inline-input { width: 100%; height: 26px; padding: 0 4px; border: 1px solid var(--accent); border-radius: 3px; font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.progress-wrap { display: flex; align-items: center; gap: 4px; }
.progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); }
.progress-num { font-size: 11px; color: var(--text3); width: 32px; text-align: right; flex-shrink: 0; }

/* ===== 卡片 / 仪表板 ===== */
.pad { padding: 14px 16px; }
/* 同一组卡片里的每一张永远等宽平分容器宽度、绝不折行——原来是 grid + auto-fill/minmax，
   宽度不够时会自动挤到下一行，同一组卡片就会高矮不齐、很难看。改成 flex + flex:1 1 0，
   每张卡永远按可用宽度平分，页面越窄卡越窄，但不会跳到第二行；配 min-width:0 让 flex 子项
   能缩到比内容还窄，文字用 .k/.v 上的 ellipsis 兜底，不会把行撑爆 */
.cards { display: flex; flex-wrap: nowrap; gap: 10px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 11px 13px; text-align: center; flex: 1 1 0; min-width: 0; }
.card .k { font-size: 11px; color: var(--text3); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .v { font-size: 22px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .v.warn { color: var(--overdue); }
.card .v.ok { color: var(--done); }
.card .v .frac-den { font-size: 13px; font-weight: 500; color: var(--text2); }
.stat-group .card .v .frac-den { font-size: 11px; }
/* 工作台顶部：任务维度/里程碑维度两组卡片并排放在同一行。外观跟报告页"本期总览"那种面板保持一致——
   白底 + 常规描边，不再各自刷一层彩色底；靠上面那行小标题区分口径就够了 */
.stat-groups { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.stat-group { flex: 1 1 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px 10px; }
.stat-group-label { font-size: 12.5px; font-weight: 700; color: var(--text2); margin-bottom: 7px; }
.stat-group .cards { margin-bottom: 0; gap: 7px; }
.stat-group .card { padding: 6px 8px; background: var(--bg); }
.stat-group .card .k { font-size: 11px; margin-bottom: 2px; line-height: 1.3; white-space: nowrap; }
.stat-group .card .v { font-size: 16px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
.panel-h { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 700; color: var(--text2); display: flex; align-items: center; justify-content: space-between; }
.panel-b { padding: 10px 12px; }
.hint { font-size: 12px; color: var(--text3); line-height: 1.8; }
.hint code { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 11px; }
/* min-height 保证没有 .nm（比如按人视图右侧的牵头/参与比例条）的行，跟左边有 .nm 的行行高一致，
   否则每行差 1-2px，累积到十几行之后就会跟左边名字对不上 */
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; min-height: 16px; }
.bar-row .nm { width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); flex-shrink: 0; }
/* 堆叠条：段间留 2px 表面色缝隙，避免相邻色块糊成一片 */
.bar-row .track { flex: 1; height: 14px; background: var(--c-track); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.bar-row .seg, .load-row .seg { height: 100%; }
.bar-row .seg-done, .load-row .seg-done   { background: var(--c-done); }
.bar-row .seg-doing, .load-row .seg-doing { background: var(--c-doing); }
.bar-row .seg-late, .load-row .seg-late   { background: var(--c-late); }
.bar-row .seg-todo, .load-row .seg-todo  { background: var(--c-todo); }
/* 牵头/参与比例条专用色，跟状态色（done/doing/late/todo）、优先级色都不重叠，避免同一张图里颜色语义混着看 */
.bar-row .seg-lead { background: #6a4c93; }
.bar-row .seg-join { background: #c9a227; }
/* 展开的工作条：跟它归属的职责条区分开，颜色统一调浅一点，避免两层看起来一样重 */
.bar-row-muted .seg-done  { background: #8fcda8; }
.bar-row-muted .seg-doing { background: #7fb3d9; }
.bar-row-muted .seg-late  { background: #e2a49b; }
.bar-row-muted .seg-todo  { background: #c9c0ae; }
.bar-row .num { width: 82px; text-align: right; color: var(--text3); font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
/* 图表页"按人"：状态条和牵头/参与条合并进同一行（而不是分左右两栏），这样悬浮高亮天然会盖住整行，
   也不用再费劲让两栏的行高对齐；人名列比其它地方（170px，要容纳职责/工作这种长名字）窄很多，
   因为人名一般就 2-4 个字，不用留那么宽 */
.bar-row-person .nm { width: 80px; }
.bar-row-person .track-role { flex: 0 0 90px; }
.bar-row-person .num-role { width: 44px; }
.bar-row.clickable { cursor: pointer; border-radius: 3px; }
.bar-row.clickable:hover { background: var(--bg); }
.legend { margin-top: 9px; font-size: 11px; color: var(--text3); display: flex; gap: 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* ===== 工作台布局 ===== */
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1080px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
.dash-col { min-width: 0; }
.card.clickable { cursor: pointer; transition: border-color .12s, background .12s; }
.card.clickable:hover { border-color: var(--accent); background: #fff; }

/* 分段控件 */
.seg-ctrl { display: flex; gap: 2px; }
.seg-ctrl .s { font-size: 11.5px; padding: 2px 9px; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); background: var(--surface); white-space: nowrap; }
.seg-ctrl .s:hover { border-color: var(--accent); color: var(--accent); }
.seg-ctrl .s.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg-ctrl .s .c { opacity: .75; margin-left: 3px; }

/* ===== 里程碑甘特图共用的时间轴框架（.tl / .tl-axis / .tl-ticks），行内容用 .gantt-* ===== */
.tl { font-size: 12px; }
.tl-axis { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tl-ticks { flex: 1; position: relative; height: 14px; border-bottom: 1px solid var(--border); }
.tl-ticks .tk { position: absolute; top: 0; font-size: 10px; color: var(--text3); transform: translateX(-50%); white-space: nowrap; }
.tl-ticks .tk::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 1px; height: 4px; background: var(--border2); }

/* ===== 人员负荷 ===== */
.load-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; cursor: pointer; border-radius: 3px; }
.load-row:hover { background: var(--bg); }
.load-row .nm { width: 62px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.load-row .track { flex: 1; height: 13px; background: var(--c-track); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.load-row .num { width: 62px; text-align: right; font-size: 11px; color: var(--text3); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ===== 图表页 ===== */
.chart-tabs { display: flex; gap: 2px; margin-bottom: 12px; }
.chart-tabs .t { font-size: 12.5px; padding: 5px 14px; border: 1px solid var(--border2); border-radius: 4px; cursor: pointer; color: var(--text2); background: var(--surface); }
.chart-tabs .t:hover { border-color: var(--accent); color: var(--accent); }
.chart-tabs .t.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.chart-note { font-size: 11px; color: var(--text3); margin-top: 8px; line-height: 1.7; }
.svg-wrap { position: relative; }
.svg-wrap svg { display: block; }
/* 横条/柱状图 + 占比饼图并排：饼图作补充视图，不单独提供表格切换（跟随所在面板） */
.chart-flex { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
.chart-flex-bars { flex: 1 1 260px; min-width: 220px; overflow: hidden; }
.chart-flex-bars svg { max-width: 100%; }
.chart-flex-pie { flex-shrink: 0; width: 168px; text-align: center; }
.chart-flex-pie .pie-legend { justify-content: center; margin-top: 10px; }
.chart-flex-col { flex: 1 1 200px; min-width: 180px; text-align: center; }
.chart-flex-col-title { font-size: 12px; color: var(--text2); font-weight: 600; margin-bottom: 8px; }
.pie-label { font-size: 10.5px; font-weight: 700; fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 2.5px; stroke-linejoin: round; pointer-events: none; }
.pie-slice-clickable { cursor: pointer; }
.pie-slice-clickable:hover { opacity: .82; }
.pie-slice-active { stroke: var(--accent); stroke-width: 2px; stroke-linejoin: round; }
.pie-legend span.clickable { cursor: pointer; border-radius: 3px; padding: 1px 4px; margin: -1px -4px; transition: background .1s; }
.pie-legend span.clickable:hover { background: var(--bg); }
.pie-legend span.clickable.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.ax-line { stroke: var(--border); stroke-width: 1; }
.ax-grid { stroke: var(--border); stroke-width: 1; opacity: .55; }
.ax-text { font-family: var(--font); font-size: 10px; fill: var(--text3); }
.ax-text.val { font-size: 10.5px; fill: var(--text2); }
.ln { fill: none; stroke-width: 2; }
.ln-new { stroke: var(--c-doing); }
.ln-done { stroke: var(--c-done); stroke-dasharray: 5 3; }   /* 二次编码：不靠颜色也能区分 */
.mk { stroke: var(--surface); stroke-width: 2; }
.mk-new { fill: var(--c-doing); }
.mk-done { fill: var(--c-done); }
.bar-late { fill: var(--c-late); }
.bar-norm { fill: var(--c-doing); }
.bar-soon { fill: var(--c-soon); }
.bar-done { fill: var(--c-done); }
.crosshair { stroke: var(--accent); stroke-width: 1; opacity: .5; }
#chart-tip { position: absolute; display: none; background: var(--snack-bg); color: #fff; font-size: 11.5px;
  padding: 5px 9px; border-radius: 4px; pointer-events: none; white-space: nowrap; z-index: 50; line-height: 1.6; }
#chart-tip.show { display: block; }
#chart-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* 图表内嵌表格（无障碍：图形之外始终有一份可读数据） */
/* ★ 真正的溢出元凶，比 nowrap 更底层 ★ 全局 table 选择器（给任务/工作这类多列数据表用的）
   带了 min-width:640px，防止那些表格在窄屏上被挤得认不出来——但 .dtable 是完全不同的
   用途（图表/报告面板里内嵌的小型统计表，常常只有 2-3 列），沿用这个 640px 底线毫无道理，
   不管列宽怎么调整、文字换不换行，表格永远量出来至少 640px 宽，这才是窄列面板里
   "调列宽也没用、非滚动不可"的真正原因。这里显式解除，让它能真正缩到跟容器一样窄。 */
.dtable { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; min-width: 0; }
.dtable th { background: var(--bg); font-size: 11px; padding: 4px 8px; text-align: right; color: var(--text3);
  border-bottom: 1px solid var(--border); cursor: default; position: static; white-space: nowrap; }
.dtable th:first-child, .dtable td:first-child { text-align: left; }
/* 单元格允许换行——数字/百分比这类内容本来就短，允许换行也不会真的被拆断，
   不像"职责/来源/标签/交付物"这类自由文本列，长了必须能换行，否则配合上面的
   table-layout:fixed，多出来的宽度没地方去，只能把整张表撑宽到需要横向滚动
   （见 dataTable() 顶上的说明）；word-break 兜底处理没有天然断点的英文长词/长数字串 */
.dtable td { padding: 3px 8px; border-bottom: 1px solid var(--border); text-align: right;
  border-right: none; font-variant-numeric: tabular-nums; white-space: normal; word-break: break-word; }
.dtable tr:hover { background: var(--bg); }
.dtable th.sortable { cursor: pointer; }
.dtable th.sortable:hover { color: var(--accent); }
/* ===== 图表页"人员工作矩阵" ===== */
.matrix-wrap { overflow-x: auto; }
/* ★ table-layout: fixed 是列宽的关键 ★ 默认 auto 布局下，浏览器按内容自动摊算列宽，
   每个 <td>/<th> 自己声明的 width 只是个建议，长职责名照样能把列撑开；fixed 布局下
   列宽完全交给 <colgroup> 里的 <col>（见 personMatrixHTML）决定，才是真正稳定生效的。
   ★ 字号/行高/内边距不生效的另一个根因 ★ 全局有一条 `td { padding:0 8px; font-size:12.5px;
   border-right:1px solid ...}` 的表格重置（给别处的数据表用的），这些声明是"直接写在 td 上"
   的，就算 .matrix-cell/.matrix-row-label 是 class 选择器、优先级按理更高，只要它们自己
   没显式声明同一个属性，浏览器就会用这条全局 td 规则、而不是从 <table> 继承下来的字号——
   直接声明永远赢过继承，跟选择器优先级高低无关。这就是"工作行字体比职责行小一号"（职责行
   一直在悄悄用全局的 12.5px，工作行自己单独声明了 11px）、"内边距/行高怎么调都没用"的真正
   原因。这里把 font-size/line-height/padding/border-right 在每一条规则里都显式重新声明一遍，
   不再留任何一个属性给全局 td/th 重置去趁虚而入。
   字号定为 11px，20 个汉字大约 220px 宽（中文字符的字宽近似等于字号），加上箭头和内边距，
   职责/工作名称列给到 230px；行高不额外加行距，就是这个字号本该占的高度（line-height:1）。 */
.matrix-table { border-collapse: separate; border-spacing: 2px 1px; font-size: 11px; table-layout: fixed; }
.matrix-table col.col-label { width: 230px; }
.matrix-table col.col-person { width: 46px; }
.matrix-table th { font-weight: 600; color: var(--text2); padding: 0 2px; white-space: nowrap; text-align: center;
  font-size: 11px; line-height: 1; overflow: hidden; text-overflow: ellipsis; border-right: none; }
.matrix-row-label { font-size: 11px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  padding: 0 10px 0 2px; color: var(--text2); text-align: left; border-right: none; }
.matrix-row-label .sb-caret { margin-right: 2px; }
/* 字号不在这里单独声明——跟 .matrix-row-label 共用同一份 11px，避免两处各写一次、
   日后改一处忘了改另一处，又变回"工作行字体对不上职责行"这个老问题 */
.matrix-row-work { padding-left: 22px; color: var(--text3); }
.matrix-cell { font-size: 11px; line-height: 1; padding: 0; text-align: center; border-radius: 3px; overflow: hidden;
  font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; border-right: none; }
.matrix-cell-empty { background: var(--bg); }
.matrix-cell.clickable { cursor: pointer; }
.matrix-cell.clickable:hover { outline: 1.5px solid var(--accent); outline-offset: -1.5px; }
.role-select { height: 26px; padding: 0 6px; border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--font); font-size: 12px; color: var(--text); background: #fff; outline: none; cursor: pointer; }
.role-select:focus { border-color: var(--accent); }
.role-select:hover { border-color: var(--accent); }
/* ===== 日志页 ===== */
.log-filters { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
#logs-text { height: 26px; width: 200px; padding: 0 8px; border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
#logs-text:focus { border-color: var(--accent); }
.log-filters select { height: 26px; padding: 0 6px; border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--font); font-size: 12px; color: var(--text); background: #fff; outline: none; cursor: pointer; }
.log-filters select:focus, .log-filters select:hover { border-color: var(--accent); }
/* 内容列可能很长（逐字段的"从A改成B"），这一列必须允许折行，否则整张表被撑到横向滚动 */
.log-table td:last-child { white-space: normal; word-break: break-all; line-height: 1.5; }
.log-table .log-time { font-size: 11.5px; color: var(--text2); }
.log-row { cursor: pointer; }
.log-row:hover { background: var(--bg); }
.log-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10.5px; white-space: nowrap; }
.log-tag-login { background: #e8f0fe; color: #1a56b8; }
.log-tag-edit { background: var(--bg); color: var(--text2); border: 1px solid var(--border2); }
.log-tag-admin { background: #fff3e0; color: #a35a00; }
.log-tag-alert { background: #fdecea; color: #b3261e; font-weight: 700; }
/* 安全告警条：整块用醒目的红边，跟普通面板明确区分开 */
.sec-panel { border: 1px solid #f0b4ae; }
.sec-panel .panel-h { background: #fdecea; color: #b3261e; font-weight: 700; }
.sec-item { display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--border); }
.sec-item:last-child { border-bottom: none; }
.sec-txt { flex: 1; font-size: 12.5px; line-height: 1.6; }
.nav-badge { display: inline-block; min-width: 16px; height: 16px; line-height: 16px; padding: 0 4px; margin-left: 5px;
  border-radius: 8px; background: #b3261e; color: #fff; font-size: 10.5px; text-align: center; vertical-align: middle; }
.log-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
.log-pager .btn[disabled] { opacity: .45; cursor: default; }
/* ===== 报告页：区域(section) + 模块(module) 编排 ===== */
/* 区域标题横贯整行，把下面几个模块面板视觉上收成汇报稿的一个段落 */
.rep-region { margin-bottom: 18px; }
.rep-region-title { font-size: 13.5px; font-weight: 700; color: var(--text); padding: 2px 0 6px;
  border-bottom: 2px solid var(--accent); margin-bottom: 8px; }
/* 同一行里并排的几个模块。flex-wrap + flex-basis 让它按窗口宽度自己折行：
   宽屏并排，窄屏（笔记本分屏、投影）自动堆成一列，不需要 JS 监听尺寸变化。
   min-width:0 是必须的——flex 子项默认 min-width:auto，里面一张定宽 SVG 就能把整行撑破 */
.rep-row { display: flex; flex-wrap: wrap; gap: 0 12px; align-items: flex-start; }
.rep-row > .rep-col { flex: 1 1 320px; min-width: 0; }
/* 配置面板里的一个区域块 */
.rep-sec { border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg); }
.rep-sec-h { display: flex; align-items: center; gap: 10px; font-size: 12.5px; margin-bottom: 6px; }
/* 已选模块：一行一个，看得出顺序，右边挂着排序/同行/移除 */
.rep-pick { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 6px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 3px; margin-bottom: 3px; }
.rep-pick-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep-width-sel { height: 22px; padding: 0 4px; border: 1px solid var(--border2); border-radius: 3px;
  font-family: var(--font); font-size: 11px; color: var(--text2); background: #fff; flex-shrink: 0; }
/* 可添加的模块：按分类分组的一片"＋ 模块名" */
.rep-picker { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
.rep-grp { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-bottom: 4px; }
.rep-grp-t { font-size: 11px; color: var(--text3); width: 68px; flex-shrink: 0; text-align: right; }
.rep-add { font-size: 11.5px; color: var(--accent); cursor: pointer; padding: 1px 6px;
  border: 1px dashed var(--border2); border-radius: 3px; white-space: nowrap; }
.rep-add:hover { border-color: var(--accent); background: var(--bg); }
@media print { .rep-region-title { border-bottom-color: #888; } }
.perm-matrix th { text-align: center; }
.perm-matrix td.cell-center input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
.perm-matrix td.cell-center input[type="checkbox"]:disabled { cursor: not-allowed; opacity: .6; }
.perm-matrix .perm-group-row td { background: var(--bg); color: var(--text2); font-weight: 700; font-size: 11px;
  letter-spacing: .04em; padding: 4px 8px; border-right: none; }
.toggle-view { font-size: 11px; padding: 1px 8px; border: 1px solid var(--border2); border-radius: 3px;
  cursor: pointer; color: var(--text2); background: var(--surface); }
.toggle-view:hover { border-color: var(--accent); color: var(--accent); }
.toggle-view.on { background: var(--accent); color: #fff; border-color: var(--accent); }

/* 甘特 */
.gantt-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-radius: 3px; cursor: pointer; }
/* 职责/工作/任务三级逐级缩进，但 .gantt-name 同步按缩进量收窄，让职责/工作/任务三级的时间轴（含今天竖线）
   始终从同一个像素点开始，不会因为缩进不同而错位；任务行没有展开箭头，用一个空的 .sb-caret 占位补齐宽度 */
.gantt-row-work { padding-left: 20px; }
.gantt-row-work .gantt-name { width: 180px; }
.gantt-row-task { padding-left: 40px; }
.gantt-row-task .gantt-name { width: 160px; }
.gantt-row:hover { background: var(--bg); }
.gantt-name { width: 200px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text2); cursor: pointer; }
.gantt-name .code { font-family: Consolas, monospace; font-size: 10.5px; color: var(--text3); margin-right: 4px; }
.gantt-track { flex: 1; position: relative; height: 18px; }
.gantt-track::before { content: ''; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--accent); opacity: .45; left: var(--today, 0%); }
.gantt-span { position: absolute; top: 7px; height: 4px; background: var(--c-track); border-radius: 2px; }
.gantt-pt { position: absolute; top: 4px; width: 9px; height: 9px; border-radius: 50%; transform: translateX(-50%);
  border: 2px solid var(--surface); box-sizing: content-box; cursor: pointer; }
.gantt-pt.late { background: var(--c-late); }
.gantt-pt.soon { background: var(--c-soon); }
.gantt-pt.norm { background: var(--c-doing); }
.gantt-pt.done { background: var(--c-done); }
.gantt-cnt { width: 56px; flex-shrink: 0; text-align: right; font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }

/* ===== 最近动态 ===== */
.feed .li { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 12px; align-items: baseline; cursor: pointer; }
.feed .li:last-child { border-bottom: none; }
.feed .li:hover { background: var(--bg); }
.feed .who { color: var(--accent); flex-shrink: 0; }
.feed .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.feed .when { color: var(--text3); font-size: 10.5px; flex-shrink: 0; }
.mini-list { font-size: 12.5px; }
.mini-list .li { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); cursor: pointer; align-items: center; }
.mini-list .li:last-child { border-bottom: none; }
.mini-list .li:hover { background: var(--bg); }
.mini-list .d { width: 62px; flex-shrink: 0; font-size: 11px; }
.mini-list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list .p { flex-shrink: 0; color: var(--text3); font-size: 11px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list .lvl { flex-shrink: 0; width: 54px; text-align: center; font-size: 10.5px; color: var(--text2); background: var(--bg); border-radius: 3px; padding: 1px 3px; }
.empty-mini { color: var(--text3); font-size: 12px; padding: 6px 0; }
/* ===== 数据体检明细 ===== */
.health-row { border-bottom: 1px dashed var(--border); }
.health-row:last-child { border-bottom: none; }
.health-detail { margin: 0 0 6px 20px; padding: 4px 8px; background: var(--bg); border-radius: 4px; max-height: 180px; overflow-y: auto; }
.health-detail-item { font-size: 11.5px; color: var(--text2); padding: 2px 0; }
.health-detail-item.clickable { cursor: pointer; }
.health-detail-item.clickable:hover { color: var(--accent); text-decoration: underline; }

/* ===== 弹窗 ===== */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 3000; align-items: center; justify-content: center; }
#modal-overlay.show { display: flex; }
#modal-box { background: var(--surface); border-radius: 6px; padding: 20px 22px; max-width: 620px; width: 92%; box-shadow: 0 8px 32px rgba(0,0,0,.22); max-height: 86vh; display: flex; flex-direction: column; }
#modal-box.wide { max-width: 920px; }
#modal-box h3 { font-size: 14px; color: var(--text); margin-bottom: 10px; flex-shrink: 0; }
#modal-body { font-size: 12.5px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; overflow-y: auto; }
#modal-body p { word-break: break-all; }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
.btn-cancel { height: 28px; padding: 0 14px; border: 1px solid var(--border2); border-radius: 4px; background: var(--surface); font-family: var(--font); font-size: 12px; cursor: pointer; }
.btn-confirm { height: 28px; padding: 0 14px; border: none; border-radius: 4px; background: var(--accent); color: #fff; font-family: var(--font); font-size: 12px; cursor: pointer; }
.btn-confirm.danger { background: var(--p1); }
.btn-confirm:hover { opacity: .85; }
.modal-textarea { width: 100%; min-height: 170px; padding: 7px 9px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font); font-size: 12.5px; line-height: 1.7; color: var(--text); background: #fff; outline: none; resize: vertical; }
.modal-textarea:focus { border-color: var(--accent); }

/* 身份门禁：独立于普通弹窗，没有取消/点外面关闭的路径——身份没确认之前就是不能进 */
#login-gate { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 4000; align-items: center; justify-content: center; }
#login-gate.show { display: flex; }
#login-box { background: var(--surface); border-radius: 6px; padding: 20px 22px; width: 320px; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
#login-box h3 { font-size: 14px; margin-bottom: 12px; }
#login-box .form-row label { width: 56px; }
#login-box .err { color: var(--p1); font-size: 12px; margin: 4px 0 8px; }
#login-box .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.form-row label { width: 78px; flex-shrink: 0; color: var(--text2); font-size: 12px; text-align: right; }

/* 日期数字文本框 + 旁边📅按钮的组合：文本框负责手动敲数字，按钮负责弹出日历点选，两种输入方式并存 */
.date-mask-wrap { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.date-mask-wrap .date-pick-btn { flex-shrink: 0; width: 26px; height: 27px; padding: 0; border: 1px solid var(--border2); border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
.date-mask-wrap .date-pick-btn:hover { border-color: var(--accent); background: var(--bg); }
.cp-row .cp-deliv { flex: 1; height: 27px; padding: 0 7px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.cp-row .cp-report-level { width: 100px; flex-shrink: 0; height: 27px; padding: 0 5px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font); font-size: 12px; color: var(--text); background: #fff; outline: none; }
.cp-row input:focus, .cp-row select:focus { border-color: var(--accent); }
/* 逾期的里程碑不能只靠一处文字变红就完事——整行给个浅红底 + 左边一道红条，编辑状态下扫一眼就找得到 */
.cp-row-overdue { background: color-mix(in srgb, var(--overdue) 8%, transparent); border-radius: 4px; padding: 3px 4px 3px 6px; margin-left: -6px; border-left: 3px solid var(--overdue); }
.cp-overdue-badge { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: var(--overdue); border-radius: 8px; padding: 2px 7px; white-space: nowrap; }
.cp-done-lbl { display: flex; align-items: center; gap: 3px; font-size: 11.5px; color: var(--text2); white-space: nowrap; flex-shrink: 0; }
.cp-done-lbl input { accent-color: var(--accent); }
.cp-drag-handle { flex-shrink: 0; cursor: grab; color: var(--text3); font-size: 14px; padding: 0 2px; user-select: none; }
.cp-drag-handle:active { cursor: grabbing; }


/* ===== 浮层 ===== */
#select-popup { display: none; position: fixed; z-index: 5000; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 6px; min-width: 170px; max-width: 300px; max-height: 420px; overflow-y: auto; }
#select-popup.show { display: block; }
.sp-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; }
.sp-item:hover { background: var(--accent-light); color: var(--accent); }
.sp-item.selected { color: var(--accent); font-weight: 600; background: var(--accent-light); }
.sp-item input[type=checkbox] { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.sp-item label { cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.sp-header { padding: 3px 8px 5px; font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .06em; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.sp-addnew { color: var(--accent); font-weight: 600; }
.sp-confirm { width: 100%; margin-top: 5px; height: 24px; border: none; border-radius: 3px; background: var(--accent); color: #fff; font-family: var(--font); font-size: 11px; cursor: pointer; }
/* 二级级联选择（所属工作：先选职责，划过展开该职责下的工作） */

.sp-arrow { color: var(--text3); font-size: 10px; flex-shrink: 0; }
.sp-sub { display: none; position: fixed; z-index: 5001; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 6px; min-width: 170px; max-width: 260px; max-height: 340px; overflow-y: auto; }
.sp-sub.show { display: block; }
#date-picker-wrap { display: none; position: fixed; z-index: 4000; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px; width: 210px; }
#date-picker-wrap.show { display: block; }
.dp-shortcuts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.dp-sc { font-size: 11px; padding: 2px 7px; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); background: var(--bg); }
.dp-sc:hover { border-color: var(--accent); color: var(--accent); }
.dp-clear-sc { color: var(--text3) !important; }
.dp-clear-sc:hover { color: var(--p1) !important; border-color: var(--p1) !important; }
.dp-cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px 5px; }
.dp-cal-nav-btn { background: none; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); font-size: 14px; line-height: 1; padding: 1px 6px; }
.dp-cal-title { font-size: 12px; font-weight: 600; color: var(--text); }
.dp-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.dp-cal-dow { text-align: center; font-size: 10px; color: var(--text3); padding: 2px 0; font-weight: 600; }
.dp-cal-day { text-align: center; font-size: 12px; padding: 3px 2px; cursor: pointer; border-radius: 3px; color: var(--text2); }
.dp-cal-day:hover { background: var(--accent-light); color: var(--accent); }
.dp-cal-day.is-today { color: var(--accent); font-weight: 700; }
.dp-cal-day.is-selected { background: var(--accent); color: #fff !important; }
.dp-cal-day.is-empty { cursor: default; pointer-events: none; }

#snackbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--snack-bg); color: #fff; padding: 8px 16px; border-radius: 5px; font-size: 12.5px; display: flex; align-items: center; gap: 10px; z-index: 6000; transition: transform .22s ease; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.28); }
#snackbar.show { transform: translateX(-50%) translateY(0); }
.undo-btn { background: none; border: none; color: #7ec8f7; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 0; font-family: var(--font); }
.undo-btn.hidden { display: none; }
#statusbar { display: flex; align-items: center; justify-content: space-between; padding: 3px 12px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; font-size: 11px; color: var(--text3); }
#empty-state { display: none; padding: 40px; text-align: center; color: var(--text3); font-size: 13px; }

/* ===== 批量操作条 ===== */
#batch-bar { display: none; align-items: center; gap: 8px; padding: 5px 12px; background: var(--accent-light); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#batch-bar.show { display: flex; }
#batch-bar .n { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
#batch-bar .btn { height: 24px; font-size: 11.5px; }
tbody tr.sel-row { background: #eaf2f8; }
tbody tr.sel-row:hover { background: #e0ecf5; }
td.col-sel, th.col-sel { text-align: center; padding: 0; }
.cb-sel { width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); }

/* ===== 任务详情表单 ===== */
.detail-grid { display: grid; grid-template-columns: 84px 1fr 84px 1fr; gap: 7px 8px; align-items: center; }
.detail-grid label { font-size: 12px; color: var(--text2); text-align: right; }
.detail-grid .full { grid-column: 2 / 5; }
.detail-grid .full-row { grid-column: 1 / 5; }
/* .detail-grid label 是 class+元素选择器(特异性更高)，光有 .cp-section-label 这一个类盖不过它的
   text-align:right，得用 .detail-grid .cp-section-label 两个类才能真正盖过去，这里之前一直没生效 */
.detail-grid .cp-section-label { display: block; text-align: left; width: auto; }
/* 状态/优先级/计划完成时间三个字段等宽平分整行，而不是各自挤一个固定 96px——
   这样计划完成时间（原生日期控件）才有足够宽度，三项的输入框起始位置也对得齐 */
.inline-fields-row { display: flex; gap: 20px; }
.inline-field { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.inline-field label { font-size: 12px; color: var(--text2); flex-shrink: 0; width: 56px; text-align: right; }
.inline-field > div { flex: 1; min-width: 0; }
.detail-grid input, .detail-grid select, .detail-grid textarea {
  width: 100%; height: 27px; padding: 0 7px; border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.detail-grid textarea { height: auto; min-height: 54px; padding: 5px 7px; line-height: 1.6; resize: vertical; }
.detail-grid input:focus, .detail-grid select:focus, .detail-grid textarea:focus { border-color: var(--accent); }
.progress-edit-row { display: flex; align-items: center; gap: 6px; }
.progress-edit-row input { width: 60px; flex: none; }
.unit-suffix { color: var(--text2); font-size: 12px; }
.detail-meta { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text3); }
.detail-ro { display: inline-block; padding: 5px 0; font-size: 12.5px; color: var(--text2); }
.ms-list { margin-bottom: 4px; }
.ms-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12.5px; border-bottom: 1px dashed var(--border); }
.ms-item:last-child { border-bottom: none; }
.ms-item-overdue { background: color-mix(in srgb, var(--overdue) 8%, transparent); border-radius: 4px; padding-left: 6px; border-left: 3px solid var(--overdue); }
.ms-item .ms-date { width: 80px; flex-shrink: 0; color: var(--text2); }
.ms-item .ms-deliv { flex: 1; }
.ms-item .ms-level { flex-shrink: 0; font-size: 11px; color: var(--text3); }
.ms-item .ms-status { flex-shrink: 0; font-size: 11px; color: var(--text3); white-space: nowrap; }

/* ===== 列配置 ===== */
.col-cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; }
.col-cfg .it { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); padding: 3px 4px; border-radius: 3px; }
.col-cfg .it:hover { background: var(--bg); }
.col-cfg input { accent-color: var(--accent); cursor: pointer; }
.col-cfg label { cursor: pointer; }

/* ===== 报告页：职责下按工作展开的树状条 ===== */
.report-duty-row { display: flex; align-items: center; gap: 2px; }
.report-duty-row .bar-row { flex: 1; }
.report-work-row { padding-left: 20px; }
.report-work-row .bar-row .nm { color: var(--text3); }

/* ===== 报告页：打印/导出 PDF 时只显示报告内容，按钮和其它页面都隐藏 ===== */
@media print {
  body * { visibility: hidden; }
  #report-print-area, #report-print-area * { visibility: visible; }
  #report-print-area { position: absolute; left: 0; top: 0; width: 100%; }
  .no-print { display: none !important; }
  /* ★ 人员工作矩阵打印/导出 PDF 还是不对，这才是真正的根因 ★
     矩阵格子的热力颜色是靠 `style="background:rgba(...)"` 画出来的（见 matrixHeatCellHTML），
     数字本身不带任何深浅信息，颜色才是这个模块唯一的信息载体。但 Chrome 打印/导出 PDF
     默认不打印背景色/背景图（用户得自己去打印对话框里勾"背景图形"，几乎没人知道要勾这个），
     这是浏览器级别的默认行为，跟上一轮修的"列宽超出被截断"是两个完全不同的问题——上一轮
     修完之后列不再丢了，但矩阵打印出来是一整片没有颜色的空白格子，只剩数字，等于看不出
     热力分布，这就是用户说"还不对"的真正原因。柱状图/饼图那些用 SVG 的 fill 画色块，不受
     这条默认行为影响，所以“大部分图表都正常了”——只有矩阵这种靠 CSS background 画色的
     栽在这上面。用 print-color-adjust: exact 强制打印背景色，一次性解决，顺带保住职责/工作
     推进条、人员负荷条这些同样靠 background 画色段的模块（当时没人反馈是因为它们还有色块
     本身的边界/文字撑着，不像矩阵那样整格全靠颜色，没那么容易被人一眼看出"缺了颜色"，但
     原理上是同一个坑，不该只修矩阵这一个）。 */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /* ★ 人员工作矩阵打印/导出 PDF 时右侧列被截掉，根因在这里 ★
     屏幕上 .matrix-wrap 是 overflow-x:auto，人多的时候超出面板宽度就横向滚动，这没问题；
     但打印时浏览器不会把这种"横向可滚动"的容器展开或分页，只会照着它渲染出来的实际宽度
     原样截断——表格本身又是 table-layout:fixed + 每个人固定 46px 列宽，人越多表格越宽，
     超出打印页面可用宽度的部分就直接消失了，屏幕上滚动能看到、打印出来就没了。
     打印时把这套"固定列宽 + 横向滚动"换成"总宽度锁定 100%、列宽自动摊分"：
     table-layout:fixed 下，没写 width 的列会把剩余空间平分掉，人越多每列自动越窄，
     表格永远不会超出这一页能用的宽度，代价是人特别多时格子会变挤——但至少不会整列消失。 */
  .matrix-wrap { overflow-x: visible; }
  .matrix-table { width: 100%; font-size: 9px; }
  .matrix-table col.col-label { width: 130px; }
  .matrix-table col.col-person { width: auto; }
  .matrix-table th, .matrix-row-label, .matrix-cell { font-size: 9px; padding-left: 1px; padding-right: 1px; }
  .matrix-row-label { padding-right: 4px; }
}
</style>

<script>
'use strict';
/* =============================================================
   0. 基础工具
   ============================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ★ 可迁移性设计 1：随机串主键。
   多人各自新建记录时自增整数必然撞号，合并数据将无法区分。
   前缀便于肉眼识别实体类型，时间戳保证大致有序。 */
function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uniq(a) { return [...new Set(a)]; }

/* 版本号：v + 本次生成/编辑该 html 时的 8 位日期 + 6 位时间，纯手动标记，无构建流程可自动生成 */
const APP_VERSION = 'v20260818184829';

/* ★ 共享数据文件的格式版本号 ★
   只有"同步进共享文件的数据长什么样"发生了不兼容变化（新增/改名/改含义了会同步的字段）时，
   才把这个数字 +1；纯界面调整、纯本机功能不用动它。

   为什么需要它：大家手上的 html 是各自拷贝的，必然有人用着旧版本。旧版本不认识新版本写进去的字段，
   它一保存就会把那些字段整个抹掉（合并是按整条记录替换的），等于悄悄把别人的数据改坏。
   所以规则是：文件里记着的版本号比我手上这份 html 还新 → 我这份是旧版本，一律不许写，
   并且直接挡住界面要求先换新版 html（见 checkDataVersion / showUpgradeGate）。
   反过来（文件比我旧）没问题，我写回去时顺手把文件升到新版本。 */
const DATA_SCHEMA_VERSION = 2;

/* =============================================================
   1. 枚举与常量
   ============================================================= */
const CATEGORIES = [
  { v: '一、前瞻研判', label: '一、前瞻研判', color: '#2c5f8a' },
  { v: '二、集团治理', label: '二、集团治理', color: '#7d5ba6' },
  { v: '三、价值共创', label: '三、价值共创', color: '#2e8b57' },
  { v: '四、其它工作', label: '四、其它工作', color: '#8a7f70' },
];
const TASK_STATUS = [
  { v: 'todo',  label: '未开始', color: '#6b6660', cls: 'st-todo' },
  { v: 'doing', label: '进行中', color: '#2c5f8a', cls: 'st-doing' },
  { v: 'done',  label: '已完成', color: '#2e7d32', cls: 'st-done' },
  { v: 'hold',  label: '已挂起', color: '#9a9590', cls: 'st-hold' },
];
const WORK_STATUS = [
  { v: 'doing', label: '进行中', color: '#2c5f8a', cls: 'st-doing' },
  { v: 'done',  label: '已完成', color: '#2e7d32', cls: 'st-done' },
  { v: 'hold',  label: '暂停',   color: '#9a9590', cls: 'st-hold' },
];
const DONE_OPTS = [
  { v: '0', label: '未完成', color: '#6b6660', cls: 'st-todo' },
  { v: '1', label: '已完成', color: '#2e7d32', cls: 'st-done' },
];
// 里程碑交付物最高呈报层级

/* 权限判断：角色现在挂在账号（DB.users，随共享文件同步）上，不再是本机随便选的 settings.role，
   否则员工把自己设成管理员，这道门槛就是摆设。 */
function myUser() { return DB.users.find(u => u.name === DB.settings.me && !u.deleted_at) || null; }
/* 心跳节流的计时点。声明放在这里而不是跟 touchPresence 摆一起，是因为 markUserSeen 也要写它——
   而 markUserSeen 定义在文件很靠前的位置，用 let 声明的变量在执行到声明语句之前是不能碰的（TDZ）。
   实际调用都发生在 boot() 之后、早就过了声明那一行，但把声明提到使用者之前更省心，
   免得以后谁在初始化阶段加一处调用就踩坑。 */
let _lastPresenceAt = 0;
// 这个账号最近一次"人在用"的时间——不进 changelog、不带 rev（见调用处），
// 纯粹是给权限页"最近连接"这一列用的展示信息。
// 两个调用点：真的往共享文件写东西的时候（syncToFile），以及人激活页面的时候（touchPresence）
function markUserSeen(name) {
  const u = DB.users.find(x => x.name === name && !x.deleted_at);
  if (!u) return;
  u.lastSeenAt = new Date().toISOString();
  // 顺手记下这个人当时用的是哪一版 html。排查"谁还在用旧版"全靠它——
  // 陈旧的 html 是这套分发方式（每人一份文件拷贝）绕不开的风险，光靠嘴说"大家换新版"没法核实
  u.lastAppVersion = APP_VERSION;
  // 心跳节流的计时从"最后一次真的盖了戳"算起。写文件那条路径也会走到这里，
  // 不一起更新的话，刚写完没多久 touchPresence 又会盖一次，白白多一次写入
  _lastPresenceAt = Date.now();
}
function myRole() { const u = myUser(); return u ? u.role : 'staff'; }
function roleAtLeast(minRole) { return (ROLE_RANK[myRole()] ?? 0) >= ROLE_RANK[minRole]; }
function isRecordOwnerOrParticipant(entity, rec) {
  const me = DB.settings.me;
  if (!me || !rec) return false;
  if (entity === 'task') return rec.owner === me || (rec.assignees || []).includes(me);
  if (entity === 'work') return rec.owner === me || (rec.collaborators || []).includes(me);
  return false;
}
// 逐项（不是逐行）退回内置默认：管理员之前保存过的自定义矩阵可能是在新增权限项之前存的，
// 缺哪一项就单独退回那一项的默认值，不会因为矩阵是老版本存的、少几个新权限键，就把同一行其它没缺的配置也搭进去变成 undefined
function getPermissionMatrix() {
  const m = DB.permissionMatrix || {};
  const merge = role => ({ ...DEFAULT_PERMISSION_MATRIX[role], ...(m[role] || {}) });
  return { staff: merge('staff'), comanager: merge('comanager'), director: merge('director'), gm: merge('gm') };
}
// 具体某一项权限当前角色是否拥有：管理员恒真（不读矩阵，避免管理员配置失手把自己锁死）
function hasPermission(key) {
  if (roleAtLeast('admin')) return true;
  const row = getPermissionMatrix()[myRole()];
  return !!(row && row[key]);
}
function requirePermission(key, msg) {
  if (hasPermission(key)) return true;
  showSnack(msg || `为了防止误操作，这个动作需要「${(PERMISSIONS.find(p => p.key === key) || {}).label}」权限，暂时帮你拦下了`);
  return false;
}
// 员工只能改自己是负责人/参与人的任务、工作；有 edit_others_task 权限的不受此限
function canEditRecord(entity, rec) {
  return hasPermission('edit_others_task') || isRecordOwnerOrParticipant(entity, rec);
}
function requireRole(minRole, msg) {
  if (roleAtLeast(minRole)) return true;
  showSnack(msg || `为了防止误操作，这个动作需要「${(ROLES.find(r => r.v === minRole) || {}).label}」及以上角色，暂时帮你拦下了`);
  return false;
}
// 管理"员工/组长"账号靠 manage_staff_accounts 权限；管理"处室领导/部门领导/管理员"账号靠 manage_director_accounts；
// 管理员自己恒有全部权限
function canManageAccount(target) {
  if (roleAtLeast('admin')) return true;
  if (['staff', 'comanager'].includes(target.role)) return hasPermission('manage_staff_accounts');
  return hasPermission('manage_director_accounts');
}
function assignableRoles() {
  if (roleAtLeast('admin') || hasPermission('manage_director_accounts')) return ROLES;
  if (hasPermission('manage_staff_accounts')) return ROLES.filter(r => ['staff', 'comanager'].includes(r.v));
  return [];
}

/* PIN 校验：没有服务器，做不到真正的账号安全，这只是"防同事随手用别人名字"的门槛，
   不是防蓄意破解——用浏览器自带 Web Crypto 的 PBKDF2 加盐哈希，比明文/裸 SHA256 强，仅此而已。
   （中间那一段改成按共享文件夹路径里的工号识别身份的方案已经废弃——浏览器出于隐私限制，
   网页永远拿不到系统里的完整路径，只能反解文件夹名字，在不同操作系统/挂载方式下太不可靠，
   这次改回姓名 + PIN。） */
const PIN_ITERATIONS = 100000;
function bytesToHex(bytes) { return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function hexToBytes(hex) {
  const out = new Uint8Array(hex.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}
async function hashPin(pin, saltHex) {
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: PIN_ITERATIONS, hash: 'SHA-256' }, key, 256);
  return { salt: bytesToHex(salt), hash: bytesToHex(bits), iterations: PIN_ITERATIONS };
}
async function verifyPin(pin, user) {
  if (!user || !user.salt || !user.hash) return false;
  const { hash } = await hashPin(pin, user.salt);
  return hash === user.hash;
}

/* ---- 版本门禁：共享文件是更新版本的 html 写的，这份太旧，只能停在这里等换新版 ----
   为什么必须挡死：合并是"整条记录换成更新的那一条"，旧版本不认识新版本加的字段，
   它一保存就会把那些字段连同记录一起写回去，等于悄悄把别人的数据改坏。
   所以这个门禁没有任何关闭/继续的路径，也不给"只读浏览"——只读看着没事，但用户一编辑就写了。 */
function checkDataVersion(remote) {
  if (payloadSchemaVersion(remote) <= DATA_SCHEMA_VERSION) return true;
  if (!_versionBlocked) {
    _versionBlocked = true;
    stopAutoReload();
    showUpgradeGate(remote);
  }
  return false;
}

/* ★ 陈旧 html 门禁 ★  ——  跟上面那道 checkDataVersion 是两回事，别搞混：
   上面那道只在「共享数据的格式」发生不兼容变化时才拦（DATA_SCHEMA_VERSION 变了）。
   但真正伤人的往往是另一种情况：数据格式一个字段都没改，只是旧版代码里有个会写坏数据的 bug。
   里程碑被存成好几套重复的那次事故就是这样——数据格式没变，所以那道门禁完全没反应，
   用着旧 html 的同事照样把重复数据一遍遍写进共享文件，谁也不知道。

   而"手上这份 html 是旧的"在这套分发方式下几乎无法避免，原因还不止一种：
     · 浏览器把 file:// 的页面缓存住了，双击打开还是老的；
     · 页面在标签页里开了好几天没关过，代码是那天加载的那一份；
     · 操作系统/网络盘对共享目录里的文件有自己的缓存，读到的还是旧内容；
     · 干脆就是本机那份拷贝没更新。
   这些没有一个是网页代码能从源头堵住的（没有服务器，就没有 Cache-Control 可发）。
   所以换个思路：不去堵"为什么旧"，而是让程序自己认出"我旧了"，并且立刻停手别再写。

   做法：把"这台设备见过的最高 html 版本"记在本机（settings.maxSeenAppVersion，只存本地、不进共享文件）。
   每次读共享文件都拿 lastWriteApp 抬一次这个水位。只要本机版本低于水位，就判定这份 html 是旧的：
   只读不写，并且弹门禁说清楚怎么办。
   之所以要"记在本机且只升不降"：这样旧版客户端没有任何办法把这个判断抹掉——
   哪怕它自己写文件时把 lastWriteApp 又写回成旧版本号，本机水位也已经抬上去了，它照样被拦住。 */
let _staleAppBlocked = false;
function noteRemoteAppVersion(remote) {
  const seen = (remote && remote.lastWriteApp) || '';
  // 版本号是 v+年月日时分秒，定长且纯数字，直接字符串比大小就是时间先后
  if (seen && seen > (DB.settings.maxSeenAppVersion || '')) {
    DB.settings.maxSeenAppVersion = seen;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) {}
  }
}
// 本机这份 html 是不是已经落后于"见过的最高版本"
function isStaleApp() {
  const hi = DB.settings.maxSeenAppVersion || '';
  return !!hi && hi > APP_VERSION;
}
function checkAppVersion(remote) {
  noteRemoteAppVersion(remote);
  if (!isStaleApp()) return true;
  if (!_staleAppBlocked) {
    _staleAppBlocked = true;
    stopAutoReload();
    showStaleAppGate();
  }
  return false;
}
function showStaleAppGate() {
  $('#login-gate').classList.add('show');
  $('#login-body').innerHTML = `<h3>你打开的是旧版本，已暂停写入</h3>
    <p class="hint" style="margin-bottom:10px">共享文件里出现过比你这份更新的程序版本。旧版本可能带着已经修好的问题
      （比如把里程碑存成好几份重复的），继续用会把大家的数据改坏，所以先停在这里——
      <b>你仍然可以查看数据，只是不会再往共享文件里写。</b></p>
    <table class="dtable" style="margin-bottom:10px"><tbody>
      <tr><td>你打开的这份</td><td>${esc(APP_VERSION)}</td></tr>
      <tr><td>已知最新版本</td><td>${esc(DB.settings.maxSeenAppVersion || '')}</td></tr>
    </tbody></table>
    <p class="hint" style="margin-bottom:6px">按顺序试这三步，通常第一步就够了：</p>
    <ol class="hint" style="margin:0 0 10px 18px;line-height:1.9">
      <li><b>按住 Ctrl 再点刷新</b>（或 Ctrl+F5）强制重新加载，绕开浏览器缓存</li>
      <li>把这个程序的<b>所有标签页全部关掉</b>，重新从共享文件夹里双击打开——
        开着不动的标签页跑的还是当初加载的那份代码，刷新别人的不管用</li>
      <li>还是不行，就重新从共享文件夹<b>复制一份新的 html</b> 覆盖本机这份</li>
    </ol>
    <div id="stale-app-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn primary" data-act="force-reload">强制刷新试试</button>
      <button class="btn" data-act="ignore-stale-app">我确认要继续用这一份</button>
    </div>
    <p class="hint" style="margin-top:8px">最后那个按钮只在"管理员有意退回旧版本"时才用，平时请不要点。</p>`;
}
function showUpgradeGate(remote) {
  $('#login-gate').classList.add('show');
  $('#login-body').innerHTML = `<h3>请先升级到最新版再使用</h3>
    <p class="hint" style="margin-bottom:10px">共享数据文件已经被更新版本的程序写入过。你手上这份 html 是旧版本，
      认不全新版本存进去的内容，继续用会把大家的数据改坏，所以先停在这里。</p>
    <table class="dtable" style="margin-bottom:10px"><tbody>
      <tr><td>你手上这份</td><td>${esc(APP_VERSION)}（数据格式 v${DATA_SCHEMA_VERSION}）</td></tr>

/* ---- 身份门禁：跟普通弹窗（#modal-overlay）分开一套，没身份之前没有取消/点外面关闭的路径 ---- */
let _loginResolve = null;
function showLoginGate() {
  return new Promise(resolve => {
    _loginResolve = resolve;
    $('#login-gate').classList.add('show');
    renderLoginGate();   // 由 loginGateStage() 决定先认身份还是先接数据
  });
}
function hideLoginGate() {
  $('#login-gate').classList.remove('show');
  if (_loginResolve) { const r = _loginResolve; _loginResolve = null; r(); }
}
/* 这个 html 自己所在的文件夹（从 location 反推）。
   程序是放在共享文件夹里分发的、数据文件就在同一个目录下，所以"该选哪个文件夹"其实是已知的——
   直接显示出来让用户照着选，不用他自己找。

   ★ 为什么只能显示、不能自动去读旁边那个数据文件 ★
   浏览器不允许 file:// 页面读取自己旁边的任何文件：用 fetch / XMLHttpRequest 取 file:// 会被同源策略
   直接挡掉（本地文件的来源是"不透明"的，永远不同源）；而文件系统访问接口按规范必须由真实用户手势触发、
   且必须由用户亲自在系统选择框里选中目录才会授权。这是平台级的安全设计，网页代码没有任何绕过办法
   （除非用命令行参数启动浏览器关掉这道保护，那样等于让所有网页都能翻本地文件，绝不能这么干）。
   所以"打开就自动读取同目录的数据文件"做不到；能做到的是把它压缩成"点一次、选一下"，
   并且明确告诉用户要选哪个文件夹——而且这一步每台电脑只需要做一次。 */
function ownFolderPath() {
  try {
    if (!location.href.startsWith('file:')) return '';
    let p = decodeURIComponent(location.pathname || '');
    const i = p.lastIndexOf('/');
    if (i < 0) return '';
    p = p.slice(0, i);
    // Windows 盘符形式是 /Z:/xxx，去掉最前面那个斜杠、换成反斜杠，贴近用户在资源管理器里看到的样子
    if (/^\/[A-Za-z]:/.test(p)) return p.slice(1).replace(/\//g, '\\');
    return p;   // Linux（统信OS）的挂载路径保持原样
  } catch (e) { return ''; }
}
/* 身份门禁分三种情况，由"本机手上有没有账号数据"决定停在哪一屏：
     · 有账号 → 直接认身份（绝大多数情况；刷新后授权失效也走这里，账号还在本机缓存里）
     · 没账号、也还没连过共享文件夹 → 先把数据接进来（新同事拿到 html 第一次打开就是这一步）
     · 没账号、但已经连上了 → 共享文件里确实一个账号都没有，这才是真·首次搭建系统
   以前这三种情况全挤在同一屏：姓名输入框 + "连接共享文件夹"按钮 + "我是管理员"链接堆在一起。
   新同事第一次打开时本机根本没有账号数据，输了姓名只会得到"找不到这个账号"，
   而真正该做的第一件事（把共享数据接进来）反倒只是并排的一个按钮，旁边还杵着一个跟他完全无关的
   "我是负责搭建系统的管理员"入口——三件事对应三种人，摆在一起只会让人不知道该点哪个。 */
function loginGateStage() {
  if (DB.users.some(u => !u.deleted_at)) return 'pick';
  if (!('showDirectoryPicker' in window)) return 'create';   // 浏览器不支持共享文件，只能单机建号
  if (_fileHandle) return 'create';                          // 已连上、里面确实是空的 = 真·首次搭建
  return 'connect';                                          // 先接数据
}
function renderLoginGate(err) {
  const stage = loginGateStage();
  if (stage === 'pick') renderLoginPick(err);
  else if (stage === 'connect') renderLoginConnectFirst(err);
  else renderLoginCreate(err);
}
/* 第一步：本机还没有任何账号数据，先把共享文件夹接进来。这一屏只有一个主按钮，
   不该再摆别的选择去分散注意力——这里以前还挂过一行"我是负责搭建系统的管理员"的链接，
   点开是跳过连接、直接本机建号，是留给管理员第一次从零搭建时用的。
   但它会出现在【每一个】第一次打开这份 html 的人面前，不管是不是管理员——
   对普通同事来说这是一句毫不相干、只会让人犹豫"我要不要点这个"的提示。
   而它其实是多余的：管理员照样点"选择共享数据文件夹"这一个按钮就行——
   连的文件夹里如果确实一个账号都没有（真·从零搭建），loginGateStage() 会自动判定成
   'create' 阶段，直接进创建管理员账号的表单（见下面 renderLoginGate），完全不需要这条近路。
   所以直接去掉，不给普通同事任何需要多想一秒的选项。 */
function renderLoginConnectFirst(err) {
  const folder = ownFolderPath();
  $('#login-body').innerHTML = `<h3>先连接共享数据</h3>
    <p class="hint" style="margin-bottom:10px">这台电脑上还没有本系统的数据。点下面的按钮，在弹出的系统文件夹选择框里
      选中<b>本程序所在的这个文件夹</b>（数据文件就和这个网页放在一起），之后就能用自己的姓名登录了。</p>
    ${folder ? `<div class="form-row"><label>要选的文件夹</label><span><code>${esc(folder)}</code></span></div>
      <p class="hint" style="margin-bottom:10px">这就是本程序当前所在的位置，照着选它即可。</p>` : ''}
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="btns"><button class="btn primary" data-act="login-connect-share">选择共享数据文件夹</button></div>
    <p class="hint" style="margin-top:12px">浏览器的安全限制不允许网页自己去读旁边的文件，所以这一下必须由你亲自点、亲自选。
      <b>每台电脑只需要做这一次</b>，以后再打开会自动接上。</p>`;
}
function renderLoginPick(err) {
  // 姓名手动输入，不做成下拉框——下拉框等于把全处的账号名单摆出来给人挑，
  // 谁都能翻着选别人的名字去试 PIN；手动输入至少不会主动暴露"都有谁"
  const needShare = !_fileHandle && ('showDirectoryPicker' in window);
  $('#login-body').innerHTML = `<h3>请确认你的身份</h3>
    <div class="form-row"><label>姓名</label><input id="login-pick" placeholder="真实姓名"></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="btns"><button class="btn primary" data-act="login-pick-next">下一步</button></div>
    ${needShare ? `<p class="hint" style="margin-top:14px">名单来自本机上次缓存的数据。如果这里查不到你的姓名，
      多半是名单还没更新——<a href="javascript:void(0)" data-act="login-connect-share">连接共享文件夹</a>取一份最新的。</p>` : ''}`;
  setTimeout(() => { const el = $('#login-pick'); if (el) el.focus(); }, 30);

function renderLoginVerify(name, err) {

// 账号是管理员事先建好的，但 PIN 从来不是管理员帮忙设的——第一次登录时自己设，管理员也看不到。

/* 走到这一屏只有两条路（见 loginGateStage）：
     · 已经连上共享文件夹，但里面确实一个账号都没有 —— 真·首次搭建系统，这是唯一的入口；
     · 浏览器压根不支持文件系统访问接口，没法共享，只能单机建号。
   注意它不会出现在普通同事的登录路径上：普通同事本机没有账号时看到的是"先连接共享数据"，
   点"选择共享数据文件夹"连上以后，账号名单就有了，直接进认身份，全程碰不到这个创建表单——
   这也是"先连接共享数据"那一屏不再需要一条"我是管理员"的手动近路的原因：
   管理员照样点那一个按钮，选中确实是空的共享文件夹，就会自动落到这一屏来。 */
function renderLoginCreate(err) {
  $('#login-body').innerHTML = `<h3>创建首个（管理员）账号</h3>
    <p class="hint" style="margin-bottom:10px">只有系统里一个账号都没有时才能从这里创建，
      而且姓名必须在管理员名单里，防止随便谁连上一个空的共享文件夹就把自己设成管理员。</p>
    <div class="form-row"><label>姓名</label><input id="login-new-name" placeholder="真实姓名"></div>
    <div class="form-row"><label>PIN</label><input id="login-new-pin" type="password" placeholder="至少 4 位"></div>
    <div class="form-row"><label>确认 PIN</label><input id="login-new-pin2" type="password" placeholder="再输一遍"></div>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <div class="btns"><button class="btn" data-act="login-back">‹ 返回</button>
      <button class="btn primary" data-act="login-create">创建</button></div>`;
  setTimeout(() => { const el = $('#login-new-name'); if (el) el.focus(); }, 30);
}
/* 身份识别：姓名 + PIN。没有服务器，做不到真正防冒充，只是"防同事随手用别人名字"的门槛——
   见前面 hashPin/verifyPin 的注释。识别不是自动的，必须显式走一遍门禁选姓名、输 PIN。 */
async function ensureIdentity() {
  if (DB.settings.me && DB.users.some(u => u.name === DB.settings.me && !u.deleted_at)) return;
  // 门禁已经开着了（比如正是在门禁里点"连接共享文件夹"，连完又回到这里）：
  // 只把内容重画一次就行。再 showLoginGate 一次会把 _loginResolve 换成新的，
  // 原来那个 await 就永远等不到了，开机流程会卡死在这儿
  if (_loginResolve) { renderLoginGate(); return; }
  await showLoginGate();
}
$('#login-gate').addEventListener('click', function (e) {
  if (e.target !== this) return;
  if (_versionBlocked) return;   // 版本门禁没有任何关闭路径，点外面也不行
  // 已经有身份时，点外面视为取消这次"切换身份"；首次强制登录时没有这条监听生效的余地（这时点了也不会关）
  if (DB.settings.me && DB.users.some(u => u.name === DB.settings.me && !u.deleted_at)) hideLoginGate();
});

  { key: 'report',    label: '报告', viewPermission: 'view_report' },
  { key: 'data',      label: '数据', viewPermission: 'view_data' },
  { key: 'logs',      label: '日志', viewPermission: 'view_logs' },

/* =============================================================
   3. 数据层
   ============================================================= */
const STORAGE_KEY = 'todo_v4';

let DB = {
  duties: [], works: [], milestones: [], tasks: [], changelog: [], users: [], permissionMatrix: null, shareConfig: null,
  // 报告页的区域/模块编排，跟权限矩阵一样是"整体对象"，见 reportSections()。老数据里没有这个字段，
  // 为 null 时一律回落到内置的默认编排，所以旧版本写出来的共享文件照样能用
  reportConfig: null,
  purged: [],   // 彻底删除的墓碑，见 recordPurge()
  settings: { me: '', year: new Date().getFullYear() },
};

// 主键索引，避免每次 find 线性扫描
const IDX = { duty: new Map(), work: new Map(), milestone: new Map(), task: new Map() };
const COLL = { duty: 'duties', work: 'works', milestone: 'milestones', task: 'tasks' };
function coll(e) { return DB[COLL[e]]; }
function rebuildIndex() {
  for (const e of Object.keys(IDX)) {

}
function byId(e, id) { return id ? (IDX[e].get(id) || null) : null; }

/* ★ 共享文件同步：没有服务器、内网又不给用 HTTP，就退而求其次——
   把职责/工作/里程碑/任务/变更日志同步到共享文件夹里的一个 JSON 文件，
   靠"每次保存时跟文件当前内容比对合并"应付多人同时改，靠"定时软同步"（不整页刷新）应付看不到别人刚存的东西。
   使用者/列宽这些是本机个人偏好，永远只留在本地，不进共享文件，否则会把"我是谁""我的列宽"也同步给别人。 */
function newerRecord(a, b) {          // a 是否比 b「更新」：先比版本号，版本号一样再比时间
  const ra = a.rev || 0, rb = b.rev || 0;
  if (ra !== rb) return ra > rb;
  const ta = a.updated_at || '', tb = b.updated_at || '';
  if (ta !== tb) return ta > tb;
  /* ★ 版本号和修改时间完全相同、只有"删没删"不一样时，采纳已删除的那一份 ★
     这种平局在正常情况下不该出现：任何一次编辑都会 stampMeta 把版本号顶高。
     它只可能来自一个已经修掉的老问题——那时 softDelete 不 stampMeta，删除不改版本号，
     于是删除永远传不到别人那里（见 softDelete 的注释）。
     光把 softDelete 修好只能保证"以后的删除"传得出去；那些已经卡住的记录（一台删了、
     另一台还留着，两边版本号一样）还是会一直卡着。加上这一条，它们下次同步就自动对齐了。
     万一真的误删：到「已删除」视图点恢复即可——恢复现在会正经 stampMeta，版本号更高，
     能干净地盖过这条平局规则，不会被它锁死。
     权限矩阵/共享文件夹配置也走这个函数，但它们没有 deleted_at，两边都是 false，走不到这里。 */
  if (!!a.deleted_at !== !!b.deleted_at) return !!a.deleted_at;
  return false;
}
function mergeByPk(pk, localList, remoteList) {
  const map = new Map((localList || []).map(r => [r[pk], r]));
  (remoteList || []).forEach(rec => {
    const cur = map.get(rec[pk]);
    if (!cur || newerRecord(rec, cur)) map.set(rec[pk], rec);   // 对方新增的收进来；对方版本更新的换成对方的；否则保留本地
  });
  return [...map.values()];
}
function mergeEntityList(entity, localList, remoteList) { return mergeByPk(schema(entity).pk, localList, remoteList); }
/* 彻底删除的墓碑（DB.purged）。
   软删除靠 deleted_at + rev 就够了：删除动作本身是一次"更新"，rev 更高，合并时压得住对方手上的旧版本。
   但彻底删除是把记录从数组里抠掉，合并规则里"我有你没有的记录就收进来"是双向的，
   于是这条记录会从任何一台还没同步的设备上原样飘回来，等于删不掉。所以彻底删除必须单独留一条墓碑。 */
/* 上限从 500 提到 4000。原因是"批量清理"这类操作会一次生成几百上千个墓碑
   （比如数据体检里一次清掉全部无主里程碑），500 条的时候，同一次操作产生的墓碑
   就足以把自己最早的那批挤掉——被挤掉的记录会从任何一台还没同步的机器上原样飘回来，
   于是清理完第二天又冒出来一批，谁也搞不清是怎么回事。
   一条墓碑约 80 字节，4000 条也就 300KB 上下；而它换掉的是成百上千条完整记录，
   净下来共享文件是小了不是大了。 */
const PURGED_LIMIT = 4000;
function mergePurged(local, remote) {
  const map = new Map();
  [...(local || []), ...(remote || [])].forEach(p => {
    if (!p || !p.entity || !p.id) return;
    const k = p.entity + '␀' + p.id;
    const cur = map.get(k);
    if (!cur || (p.at || '') > (cur.at || '')) map.set(k, p);
  });
  // 按时间排序后只留最近的若干条：墓碑是只增不减的，不封顶迟早把共享文件撑爆。
  // 被挤掉的都是很久以前删的，那时候的记录早就在所有设备上消失了，不会再复活
  return [...map.values()].sort((a, b) => (a.at || '').localeCompare(b.at || '')).slice(-PURGED_LIMIT);
}
// 按墓碑把记录从合并结果里剔掉。
// 只有"墓碑时间晚于这条记录最后一次改动"才剔——否则说明这条是墓碑之后重新建的同编号记录
// （职责/工作的主键是人填的编号，删掉之后完全可能再建一个一样的），不能连新的一起误杀
function applyPurged(entity, pk, list, purged) {
  if (!purged || !purged.length) return list;
  const dead = new Map();
  purged.forEach(p => { if (p.entity === entity) dead.set(p.id, p.at || ''); });
  if (!dead.size) return list;
  return list.filter(r => {
    const at = dead.get(r[pk]);
    if (at === undefined) return true;
    return (r.updated_at || r.created_at || '') > at;

function mergeChangelog(local, remote) {
  const map = new Map((local || []).map(e => [e.id, e]));
  (remote || []).forEach(e => { if (!map.has(e.id)) map.set(e.id, e); });
  return [...map.values()].sort((a, b) => (a.at || '').localeCompare(b.at || '')).slice(-CHANGELOG_LIMIT);
}
function syncPayload(db) {
  return {
    duties: db.duties, works: db.works, milestones: db.milestones, tasks: db.tasks,
    changelog: db.changelog, users: db.users, permissionMatrix: db.permissionMatrix, shareConfig: db.shareConfig,
    reportConfig: db.reportConfig || null,
    purged: db.purged || [],
  };
}
// 文件里的格式版本号（没有这个字段的是版本门禁上线之前写的老文件，按第 1 版算）
function payloadSchemaVersion(obj) {
  const v = obj && obj.schemaVersion;
  return typeof v === 'number' ? v : 1;
}
// 真正落到文件里的内容 = 业务数据 + 一层"文件自述"信息（谁、用哪个版本的 html、哪一次写的）。
// 这几个字段刻意不进 syncPayload：它们不是业务数据，不该被合并、也不该被 Object.assign 灌回内存里的 DB。
// writeId 是每次写入随机生成的一次性标记，用来在写完之后确认"文件里现在这份确实是我刚写的那一份"
function filePayload(businessPayload, db, writeId) {
  return Object.assign({}, businessPayload, {
    schemaVersion: DATA_SCHEMA_VERSION,
    writeId,
    lastWriteBy: db.settings.me || '未署名',
    lastWriteApp: APP_VERSION,
    lastWriteAt: new Date().toISOString(),

}
// 权限矩阵是一整个对象，不是逐条记录的列表，没法按 pk 合并——谁的版本号/时间更新就整体采用谁的；
// 共享文件夹配置（shareConfig）跟权限矩阵是同一种"整体对象"形状，合并规则复用这一个函数
function mergePermissionMatrix(local, remote) {
  if (!remote) return local;
  if (!local) return remote;
  return newerRecord(remote, local) ? remote : local;
}
/* 「最近连接」时间（users[].lastSeenAt）必须单独按"取较晚的那个"合并，不能跟着整条记录走。
   它是 markUserSeen 直接写上去的心跳，刻意不走 stampMeta——否则每台设备每同步一次
   就把所有账号的 rev 顶高一级，真正的账号修改（改角色、设 PIN）反而会被心跳压过去。
   代价是 newerRecord 看不出这条记录变过：rev 和 updated_at 都没动，于是合并时
   整条被判成"不比本地新"而保留本地版本。后果实测确认过：每个人都只看得到自己的最近连接时间，
   同事的心跳一到本地就被丢掉，还会在自己写回文件时被一起抹掉——
   而这一列恰恰是排查"同事到底连没连上"最直接的依据，坏在这里等于把排查手段也一起弄没了。 */
function mergeUserPresence(list, local, remote) {
  // lastSeenAt 和 lastAppVersion 是同一次心跳一起写上去的，合并时也要一起走：
  // 取"心跳时间最晚的那一次"，把它带的版本号一并采纳，否则会出现
  // "时间是新的、版本号却是上一次的"这种自相矛盾的组合
  const latest = new Map();
  [...(local || []), ...(remote || [])].forEach(u => {
    if (!u || !u.name || !u.lastSeenAt) return;
    const cur = latest.get(u.name);
    if (!cur || u.lastSeenAt > cur.lastSeenAt) latest.set(u.name, { lastSeenAt: u.lastSeenAt, lastAppVersion: u.lastAppVersion || '' });
  });
  if (!latest.size) return list;
  return list.map(u => {
    const t = latest.get(u.name);
    return (t && t.lastSeenAt > (u.lastSeenAt || ''))
      ? Object.assign({}, u, { lastSeenAt: t.lastSeenAt, lastAppVersion: t.lastAppVersion })
      : u;
  });
}
/* ★ 本机手上有没有"文件里还没有"的东西 ★
   在此之前，只要 Repo.persist 被调用就一定会把整个文件重写一遍——包括 5 分钟一轮的定时同步。
   也就是说，十个人开着这个页面什么都不干，共享文件也会每 5 分钟被完整重写十次。
   在挂载盘上这是纯粹的浪费：每一次写入都要穿过网盘驱动，都会刷掉它的缓存、
   都在跟别人的写入抢同一个文件，而这些写入里绝大多数一个字节的新内容都没有。

   判断方法刻意不用"把两边序列化出来比字符串"：那样会被字段顺序、数组顺序这些跟内容无关的
   差异干扰，动不动就误判成"有改动"，白写照旧。这里直接复用合并时那套逐条判断——
   问的就是合并算法自己会问的问题：我这边有没有哪条记录是文件里没有的、或者比文件里那条更新的？
   有 → 必须写；一条都没有 → 文件里已经包含了我全部的东西，这次写入没有任何意义。

   changelog / purged 这两个是封顶的（超出条数会丢掉最旧的），所以要跳过"比文件里最旧那条还老"的
   条目：那些是对方已经淘汰掉的历史，我这边碰巧还留着，不该因此判定成"我有新东西"——
   否则会变成我推上去、对方合并时又淘汰掉、下一轮我再推，永远停不下来。 */
function hasLocalContribution(local, remote) {
  const anyNewer = (pk, mine, theirs) => {
    const m = new Map((theirs || []).map(r => [r[pk], r]));
    return (mine || []).some(r => { const o = m.get(r[pk]); return !o || newerRecord(r, o); });
  };
  if (anyNewer('code', local.duties, remote.duties)) return true;
  if (anyNewer('id', local.works, remote.works)) return true;
  if (anyNewer('id', local.milestones, remote.milestones)) return true;
  if (anyNewer('id', local.tasks, remote.tasks)) return true;
  if (anyNewer('name', local.users, remote.users)) return true;

  const oldestOf = (list, key) => (list || []).reduce((mx, e) => {
    const v = (e && e[key]) || '';
    return (mx === null || v < mx) ? v : mx;
  }, null);
  const theirLog = new Set((remote.changelog || []).map(e => e.id));
  const oldestLogAt = oldestOf(remote.changelog, 'at');
  if ((local.changelog || []).some(e => !theirLog.has(e.id) && (oldestLogAt === null || (e.at || '') >= oldestLogAt))) return true;

  /* ★ 心跳（users[].lastSeenAt）必须单独比一次 ★
     它刻意不走 stampMeta（理由见 mergeUserPresence 上面那段），所以 rev 和 updated_at 都没变，
     上面那个 anyNewer 完全看不见它——结果就是"只看不改"的同事，最近连接时间永远推不上共享文件，
     权限页那一列一直显示成很久以前甚至"从未连接"。这里按 lastSeenAt 本身比一次，
     心跳比文件里新就判定成"有东西要推"。
     不会写起来没完：写上去之后文件里那份就跟本机一样新了，下一轮比较自然不成立。 */
  const theirSeen = new Map((remote.users || []).map(u => [u.name, u.lastSeenAt || '']));
  if ((local.users || []).some(u => u && u.name && (u.lastSeenAt || '') > (theirSeen.get(u.name) || ''))) return true;

  const theirPurged = new Set((remote.purged || []).map(p => p.entity + ' ' + p.id));
  const oldestPurgeAt = oldestOf(remote.purged, 'at');
  if ((local.purged || []).some(p => !theirPurged.has(p.entity + ' ' + p.id) && (oldestPurgeAt === null || (p.at || '') >= oldestPurgeAt))) return true;

  // 权限矩阵/共享文件夹配置是整个对象比版本，跟 mergePermissionMatrix 的规则保持一致
  if (local.permissionMatrix && (!remote.permissionMatrix || newerRecord(local.permissionMatrix, remote.permissionMatrix))) return true;
  if (local.shareConfig && (!remote.shareConfig || newerRecord(local.shareConfig, remote.shareConfig))) return true;
  if (local.reportConfig && (!remote.reportConfig || newerRecord(local.reportConfig, remote.reportConfig))) return true;
  return false;
}
/* =============================================================
   ★ 安全：越权提权检测 ★

   共享的 JSON 是明文放在网盘上的，处里每个人在操作系统层面都能改它——
   拿记事本把自己那条的 "role":"staff" 改成 "admin"，下次同步就成了管理员。
   而且每个人手上都有一份自己的 index.html，也能随手把校验代码删掉。
   这两件事决定了：没有服务器就不可能"阻止"篡改，这个目标本身达不到。

   能达到的是另外两件事，这一节做的就是这两件：
   1) 让篡改的结果在别人机器上不生效——本机不采纳来路不明的提权，
      每个人的客户端各自独立地把它挡掉，篡改者只能骗到他自己那一台；
   2) 让它藏不住——记进日志、弹告警、在导航栏亮红点。

   判断依据：一次合法的角色提升，一定伴随一条由有权限的人写下的变更记录
   （见 pushAdminLog 的几个调用点，它跟角色改动是同一批写进共享文件的）。
   拿记事本改 role 的人不会同时伪造那条记录；就算他照葫芦画瓢补一条，
   记录里也白纸黑字写着是谁把谁提成了什么——等于实名举报。

   刻意只查"提升"不查"降级/平级"：
   · 真实威胁就是提权，降级没人会拿来害自己；
   · 更重要的是避免误伤——变更日志是有条数上限的（CHANGELOG_LIMIT），
     一台离线很久的设备重新连上时，那条授权记录可能早就被挤掉了。
     只查提升的话，这种误判最坏的后果是"某人的升职暂时没同步过来"，
     而不是把整个角色体系判成非法。 */
const ADMIN_LOG_KIND = 'admin';   // 账号/角色/权限矩阵的变更记录
const ALERT_LOG_KIND = 'alert';   // 检测到的异常，同样进日志让所有人都看得见
let _integrityAlerts = [];        // 最近一次合并里挡下来的提权，供导航栏红点和日志页告警条用
function roleOfIn(users, name) {
  const u = (users || []).find(x => x && x.name === name && !x.deleted_at);
  return u ? u.role : '';
}
// 这次提权有没有"条子"：得有一条指名道姓的变更记录，且签这条子的人当时确实有这个身份
function roleUpgradeAuthorized(name, toRole, changelog, users) {
  return (changelog || []).some(e =>
    e && e.kind === ADMIN_LOG_KIND && e.target === name && e.roleTo === toRole
    // 自己给自己签的条子不算数——这正是要防的那个动作
    && (e.by || '') !== name
    // 签字人得真的是处室领导及以上。攻击者当然也可以顺手捧一个傀儡上去，
    // 但那次"捧"本身同样是一次提权，会在这里被同一套规则挡下来
    && (ROLE_RANK[roleOfIn(users, e.by)] ?? -1) >= ROLE_RANK.director);
}
function guardRoleIntegrity(localUsers, mergedUsers, mergedChangelog) {
  const alerts = [];
  const localMap = new Map((localUsers || []).map(u => [u.name, u]));
  const users = (mergedUsers || []).map(m => {
    const l = localMap.get(m.name);
    if (!l) return m;                    // 本机第一次见到这个账号，没有基准可比，只能接受
    if (l.role === m.role) return m;
    if ((ROLE_RANK[m.role] ?? 0) <= (ROLE_RANK[l.role] ?? 0)) return m;   // 降级/平级不管
    if (roleUpgradeAuthorized(m.name, m.role, mergedChangelog, mergedUsers)) return m;
    alerts.push({ name: m.name, from: l.role, to: m.role, by: m.updated_by || '未知', at: m.updated_at || '' });
    /* 不采纳，保留本机这份（连版本号一起保留，不顶高）。
       故意不把"改正后的值"推回文件：一是普通同事的机器不该悄悄改写别人的账号数据；
       二是留在文件里的那条脏数据正好是证据，等管理员来处理。
       每台机器每次合并都会独立地再挡一次，所以在管理员处理之前，

    return l;
  });
