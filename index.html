      // 宽度倍数：跟同行是各自独立的两件事——不同行也可以设宽度（比如单独占一行时没意义，
      // 但配起来不冲突），所以不像"同行"那样对第一个模块做特殊限制
      const widthSel = `<select class="rep-width-sel" data-act="report-mod-width" data-sec="${esc(s.id)}" data-mod="${m.key}" title="在同一行里，这个模块相对其他模块的宽度倍数">
        <option value="1"${width === 1 ? ' selected' : ''}>1 倍宽度</option>
        <option value="2"${width === 2 ? ' selected' : ''}>2 倍宽度</option>
        <option value="3"${width === 3 ? ' selected' : ''}>3 倍宽度</option>
      </select>`;
      return `<div class="rep-pick">
        <span class="rep-pick-nm" title="${esc(m.desc)}">${esc(m.label)}${m.scope === 'all' ? '<span class="hint"> 全量</span>' : ''}</span>
        <span style="flex:1"></span>
        ${widthSel}
        <span class="toggle-view${inline ? ' on' : ''}" data-act="report-mod-inline" data-sec="${esc(s.id)}" data-mod="${m.key}"
              title="${j === 0 ? '第一个模块只能自己占一行' : '跟上一个模块并排放在同一行'}"
              ${j === 0 ? 'style="opacity:.3;pointer-events:none"' : ''}>⇥ 同行</span>
        <span class="toggle-view" data-act="report-mod-move" data-sec="${esc(s.id)}" data-mod="${m.key}" data-step="-1"${j === 0 ? ' style="opacity:.3;pointer-events:none"' : ''}>↑</span>
        <span class="toggle-view" data-act="report-mod-move" data-sec="${esc(s.id)}" data-mod="${m.key}" data-step="1"${j === s.modules.length - 1 ? ' style="opacity:.3;pointer-events:none"' : ''}>↓</span>
        <span class="toggle-view" data-act="report-mod-remove" data-sec="${esc(s.id)}" data-mod="${m.key}" style="color:var(--overdue)">移除</span>
      </div>`;
    }).join('');
    const picker = REPORT_GROUPS.map(g => {
      const avail = REPORT_MODULES.filter(m => m.group === g.key && !usedElsewhere.has(m.key));
      if (!avail.length) return '';
      return `<div class="rep-grp"><span class="rep-grp-t">${esc(g.label)}</span>${avail.map(m =>
        `<span class="rep-add" data-act="report-mod-add" data-sec="${esc(s.id)}" data-mod="${m.key}"
               title="${esc(m.desc)}${m.scope === 'all' ? '（全量，不随统计周期变化）' : ''}">＋ ${esc(m.label)}</span>`).join('')}</div>`;
    }).join('');
    return `<div class="rep-sec">
      <div class="rep-sec-h">
        <b>${esc(s.title)}</b>
        <span style="flex:1"></span>
        <span class="toggle-view" data-act="report-sec-rename" data-id="${esc(s.id)}">改名</span>
        <span class="toggle-view" data-act="report-sec-move" data-id="${esc(s.id)}" data-step="-1"${i === 0 ? ' style="opacity:.3;pointer-events:none"' : ''}>上移</span>
        <span class="toggle-view" data-act="report-sec-move" data-id="${esc(s.id)}" data-step="1"${i === sections.length - 1 ? ' style="opacity:.3;pointer-events:none"' : ''}>下移</span>
        <span class="toggle-view" data-act="report-sec-del" data-id="${esc(s.id)}" style="color:var(--overdue)">删除</span>
      </div>
      ${chosen || '<div class="empty-mini">这个区域还没有模块，从下面挑</div>'}
      <div class="rep-picker">${picker || '<span class="hint">没有更多可加的模块了——要么已经在这个区域，要么已经用在这份报表的其它区域</span>'}</div>
    </div>`;
  }).join('');
  return `<div class="panel no-print"><div class="panel-h"><span>⚙ 报告编排</span>
      <span class="toggle-view" data-act="report-config-toggle">${reportConfigOpen ? '收起' : '展开配置'}</span></div>
    ${reportConfigOpen ? `<div class="panel-b">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <span class="hint">当前存档</span>
        <select id="report-preset" data-act="report-preset-switch">${presetOpts}</select>
        <button class="btn" data-act="report-preset-new">另存为新存档…</button>
        <button class="btn" data-act="report-preset-rename">重命名</button>
        <button class="btn" data-act="report-preset-del"${presets.length < 2 ? ' disabled title="至少要留一套编排"' : ''}>删除存档</button>
        <button class="btn" data-act="report-config-reset" style="margin-left:auto">恢复默认编排</button>
      </div>
      ${secRows || '<div class="empty-mini">还没有任何区域，先添加一个</div>'}
      <button class="btn primary" style="margin-top:8px" data-act="report-sec-add">＋ 添加区域</button>
      <div class="chart-note">区域是你自己定义的汇报段落（标题 + 区块），模块是系统现有的数据块，勾上就出现在这个区域里，同一个模块可以放进多个区域。
        编排随共享文件同步，改完全处看到的报告都会变；${cfg && cfg.updated_by ? `最后一次由 ${esc(cfg.updated_by)} 于 ${esc(fmtLocalDateTime(cfg.updated_at))} 修改。` : ''}</div>
    </div>` : ''}</div>`;
}

/* PDF 打印/图片导出用的标题+文件名：处室名+"工作简报"+汇报周期，不能再是笼统的应用名
   "科技规划处工作管理系统"（那是给整个系统起的名字，不是这份报告的名字，浏览器打印默认会拿
   document.title 当页眉和另存 PDF 时建议的文件名，不改的话导出来的东西全叫这个名）。
   正文里已经把完整的统计周期写清楚了（"处室工作简报　·　统计周期：本周（2026-08-04～2026-08-10）"），
   标题/文件名不需要把那串完整的起止日期再重复一遍——periodLabel（本周/本月…）+ 区间起始日
   已经够区分"这是哪一次导出"，没必要把两个日期都堆进文件名里。 */
function reportExportTitle(d) {
  return `科技规划处工作简报_${d.periodLabel}_${d.rangeStart}`;
}
function renderReport() {
  const d = buildReportData(reportPeriod, reportOffset);
  const sections = reportSections();

  const periodBtns = REPORT_PERIODS.map(p =>
    `<span class="s${reportPeriod === p.key ? ' on' : ''}" data-act="report-period" data-period="${p.key}">${esc(p.label)}</span>`).join('');
  // 前后翻期：一次只挪一整期，跟粒度联动（按周就一周一周挪，按年就一年一年挪）。
  // 粒度和翻期这两组按钮包在同一个容器里，让它们紧挨着——.panel-h 是 space-between，
  // 直接摆两个兄弟节点的话会被拉到标题两边，中间隔一大片空白，看着像互不相干的两件事
  const navBtns = `<span class="seg-ctrl" style="margin-left:8px">
      <span class="s" data-act="report-period-nav" data-step="-1" title="往前一期">‹</span>
      ${reportOffset ? `<span class="s" data-act="report-period-nav" data-step="0" title="回到当前这一期">回到本期</span>` : ''}
      <span class="s" data-act="report-period-nav" data-step="1" title="往后一期">›</span>
    </span>`;

  /* 一行可以摆多个模块（见 reportSections 的 rows），每个模块还能单独设"宽度倍数"（1/2/3 倍，
     见 s.widths）。宽度分两层管，而且这两层★不能混在一起★——这是上一版真正的 bug 所在：
     · 传给模块的 ctx.width（colW）只是"这一列大概能用多少像素"，给模块里的定宽 SVG 图表画图用，
       本来就只是估算，容器实际宽度、字体渲染这些都会让它跟真实值有出入；
     · 真正决定"同一行内这几个模块各占多宽"的，必须是纯 CSS 的 flex-grow 比例分配
       （flex:<倍数> 1 0——flex-basis 定成 0，把这一行的全部空间都当"可分配的量"，
       完全交给浏览器按倍数实时算，不依赖任何 JS 测出来的像素数）。
       上一版偷懒把 colW 这个估算值直接拿去当 flex-basis 用，一旦 pageW 测不准（页面刚渲染、
       容器还没定型时很常见），几个模块的 flex-basis 加起来就可能超出容器实际宽度，
       flex-wrap 一generate 就把后面的模块顶到下一行——这正是"大部分模块同行按钮失效，
       变成一个模块一行"的真正原因：不是"同行"这个开关坏了，是给同行的模块们分配的
       "基准宽度"之和比容器本身还宽，浏览器只能按 wrap 规则把它们拆开。 */
  const pageW = (($('#page-report') || {}).clientWidth) || 900;
  const body = sections.map(s => {
    const rowsHTML = s.rows.map(row => {
      const weights = row.map(k => (s.widths && s.widths[k]) || 1);
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      const rowW = pageW - 24 * (row.length - 1);
      const panels = row.map((k, i) => {
        const m = REPORT_MODULE_MAP[k];
        const w = weights[i];
        const colW = Math.max(200, Math.floor(rowW * w / totalWeight));   // 只喂给模块自己画图用
        const flexStyle = row.length > 1 ? ` style="flex:${w} 1 0"` : '';   // 真实布局靠这个，不靠 colW
        return `<div class="panel rep-col"${flexStyle}>${reportModHead(m, m.note ? m.note(d) : '', m.titleCount ? m.titleCount(d) : null)}
          <div class="panel-b">${m.html(d, { width: colW })}</div></div>`;
      }).join('');
      return row.length > 1 ? `<div class="rep-row">${panels}</div>` : panels;
    }).join('');
    return `<div class="rep-region">
      <div class="rep-region-title">${esc(s.title)}</div>
      ${rowsHTML || '<div class="panel"><div class="panel-b"><div class="empty-mini">这个区域还没有勾选任何模块</div></div></div>'}
    </div>`;
  }).join('');

  /* 之前这里是两块"处室工作简报"：上面一块管交互（周期按钮/翻期/导出按钮，标了 no-print，
     打印和导出图片时不出现），下面 #report-print-area 里单独摆了一块只有标题+统计周期的
     纯展示版，专门给打印/导出的成品当页头用。两块内容重叠、位置又隔着"报告编排"面板，
     看着像两个不相关的区域。
     合并成一块：标题和统计周期文字放进 panel-h，跟周期/翻期按钮同一行（面板本身不再是
     no-print，所以打印/导出图片时这行标题+统计周期照样在）；周期/翻期按钮和下面的两个
     导出按钮各自单独标 no-print——按钮本来就是给屏幕上点的，纸上/图片里留着一排点不动的
     按钮没有意义，只留标题和统计周期当页头。 */
  $('#page-report').innerHTML = `<div class="pad">
    ${hasPermission('config_report') ? reportConfigPanelHTML() : ''}

    <div id="report-print-area">
    <div class="panel"><div class="panel-h">
        <span>📋 科技规划处　处室工作简报　·　统计周期：${esc(d.periodLabel)}（${esc(d.rangeStart)} ～ ${esc(d.rangeEnd)}）</span>
        <span class="no-print" style="display:flex;align-items:center"><span class="seg-ctrl">${periodBtns}</span>${navBtns}</span>
      </div>
      <div class="panel-b no-print">
        <button class="btn primary" data-act="report-print">🖨 打印 / 导出 PDF</button>
        <button class="btn" style="margin-left:6px" data-act="report-image">🖼 导出为图片</button>
      </div></div>
    ${body || '<div class="panel"><div class="panel-b"><div class="empty-mini">报告编排是空的，请让管理员在「报告编排」里添加区域和模块</div></div></div>'}
    </div>
  </div>`;
  // 到期分布同图表页一样，柱状图跟饼图并排时真实列宽要插入 DOM 之后才量得出来（见 fitFlexBarChart 的注释）
  if (!reportIsTable('taskDueDist')) {
    const dueEl = $('#page-report').querySelector('[data-due-fit]');
    if (dueEl) fitFlexBarChart(dueEl, dueBuckets(d.periodTasks));
  }
  /* ★ 待办总量趋势/各月计划完成量打印出来还是有横向滚动条 ★
     跟到期分布同一类问题、但这两个模块之前没有 fitFlexBarChart 那样"插入 DOM 后按真实宽度
     重画一遍"的补救——它们喂给 lineChart()/groupedBarChart() 的宽度全程只有 reportChartWidth(ctx)
     这一个估算值（ctx.width 来自 renderReport 顶部按 flex 权重"算"出来的 colW，不是真的量出来
     的 DOM 宽度），跟真实渲染出来的容器宽度免不了会有几像素的出入。屏幕上看不出来（
     overflow-x:auto 稍微一滚就补上了），但 Chrome 打印 overflow:auto 的容器时，只要哪怕真的
     溢出一丁点，就会把这个容器的滚动条也当成页面内容的一部分印出来——这才是"还有横向滚动条
     出现"的真正原因，不是没重排，是重排完还差那么几像素没对上。
     用跟到期分布同一个 fitFlexChart() 补上：插入 DOM 之后量一次这一列真实的宽度，差距明显
     就照实际宽度重新画一遍换上去，各年度工作数量顺带也补一份（同样的根因，只是还没被反馈到）。 */
  if (!reportIsTable('worksByYearBars')) {
    const el = $('#page-report').querySelector('[data-yearbars-fit]');
    if (el) fitFlexChart(el, w => barChart(worksByYear(), w));
  }
  if (!reportIsTable('backlogTrend')) {
    const el = $('#page-report').querySelector('[data-backlogtrend-fit]');
    if (el) fitFlexChart(el, w => lineChart(backlogSeries(d.tasks, trendGranularity), w, '待办任务总量趋势', { aKey: 'backlog', bKey: null, aLabel: '待办总量' }));
  }
  if (!reportIsTable('planDueTrend')) {
    const el = $('#page-report').querySelector('[data-plandue-fit]');
    if (el) {
      const ids = new Set(d.tasks.map(t => t.id));
      const ms = DB.milestones.filter(m => !m.deleted_at && m.plan_date && ids.has(m.task));
      fitFlexChart(el, w => groupedBarChart(planDueSeries(d.tasks, ms), w,
        { aKey: 'tasks', bKey: 'milestones', aLabel: '计划完成任务数', bLabel: '计划完成里程碑数', ariaLabel: '按月计划完成的任务数与里程碑数' }));
    }
  }
  $('#status-left').textContent = '报告';
}
/* ★ 打印/导出 PDF 时"很多图表显示不完整"的真正根因 ★
   到期分布/各年度工作数量/待办总量趋势/各月计划完成量这几个模块，图表本体是没有 viewBox 的
   定宽 SVG（见 reportChartWidth 上面那条注释：“折线/柱状图是定宽 SVG，缩不了”），外面套了层
   svgScroll()（就是个 overflow-x:auto 的 div）——这是给"窄屏时与其撑破版面，不如自己滚动"用的
   安全阀，屏幕上没问题，人可以滚动看完；但打印页面没有滚动这回事，浏览器打印时不会展开或
   分页这类可滚动容器，只按它渲染出来的宽度原样截断，滚动条能看到的那部分打印出来直接消失——
   这跟人员工作矩阵那次是同一类根因（矩阵那边是表格列宽固定，这边是 SVG 像素宽度固定），
   只是矩阵表格可以靠"改用不写死列宽、交给浏览器按比例分"这种纯 CSS 手段解决，没有 viewBox
   的 SVG 做不到——CSS 硬把它塞进更窄的框只会把图裁掉一块，不会等比缩小。
   真正的病根是这些图表的像素宽度（w / ctx.width / colW，一路往上追都来自 renderReport 里
   `$('#page-report').clientWidth`）是按屏幕上的宽度量出来的，从来没有为打印页面重新量过、
   重新画过。用浏览器打印时机制里的 beforeprint/afterprint 这对事件解决：Chrome 在触发
   beforeprint 之前就已经把打印样式表应用、把布局按打印页面的实际宽度重排过一遍了，这时候
   再调一次 renderReport()，`$('#page-report').clientWidth` 量到的就是打印页面能用的宽度，
   所有喂了这个宽度画图的模块（不只到期分布，全部）会照着打印页面的真实尺寸重新画一遍再
   插进 DOM，打印引擎抓的就是已经画对了尺寸的版本，不会再有内容超出页面被截掉。afterprint
   时机得再调一次换回来，不然打印对话框关掉之后屏幕上看到的图表宽度会一直停在打印那个窄尺寸上。
   只在报告页触发——"打印/导出 PDF"这个按钮本来就只长在报告页里，其它页面按 Ctrl+P
   打印自己的内容，不该被这里的逻辑顺带影响。 */
/* 打印/导出 PDF 时把浏览器标签页标题临时换成这份报告自己的标题——Chrome 打印页眉、
   另存 PDF 时弹出的"文件名"输入框，用的都是这一刻的 document.title，不换的话导出来的
   PDF 页眉和默认文件名会一直是"科技规划处工作管理系统"这个笼统的系统名。打印结束（不管
   是真的打印了还是取消了，afterprint 都会触发）要马上换回来，不然浏览器标签页会一直
   显示成"科技规划处工作简报_本周_2026-08-04"，容易让人以为自己点错了页面。 */
let _reportPrintTitleBak = null;
window.addEventListener('beforeprint', () => {
  if (currentPage !== 'report') return;
  _reportPrintTitleBak = document.title;
  document.title = reportExportTitle(buildReportData(reportPeriod, reportOffset));
  renderReport();
});
window.addEventListener('afterprint', () => {
  if (currentPage !== 'report') return;
  if (_reportPrintTitleBak !== null) { document.title = _reportPrintTitleBak; _reportPrintTitleBak = null; }
  renderReport();
});
// 纯文本简报：跟页面走同一份编排、同一批模块，不再另外维护一份写死的顺序
function buildReportText() {
  const d = buildReportData(reportPeriod, reportOffset);
  const lines = [`科技规划处　处室工作简报（统计周期：${d.periodLabel}　${d.rangeStart} ～ ${d.rangeEnd}）`, ''];
  const push = s => lines.push(s);
  reportSections().forEach(s => {
    lines.push(`${s.title}`);
    s.modules.forEach(k => {
      const m = REPORT_MODULE_MAP[k];
      lines.push(`【${m.label}】`);
      m.text(d, push);
      lines.push('');
    });
  });
  return lines.join('\n').replace(/\n{3,}/g, '\n\n');
}
/* 报告页导出成图片：之前用 SVG foreignObject 把 HTML 塞进图里再画到 canvas 上（"穷人版 html2canvas"），
   实测在真实浏览器里会失败——常见原因是 foreignObject 里塞真实页面 HTML 常常不是合法的 XHTML（比如
   没自闭合的标签），浏览器直接拒绝把它当图片加载；就算加载成功，很多浏览器出于安全考虑，只要 <image>
   画进 canvas 的内容来自"不透明"的外部资源（data: URI 里嵌了任意 HTML 也算），canvas 就会被标记为
   "tainted"，之后再调用 toBlob/toDataURL 会直接抛 SecurityError。
   改成完全不依赖 HTML/CSS 渲染，直接用 canvas 2D 的矩形/文字/测量 API 手工画出报告内容——
   没有任何"外部资源"参与，canvas 不会被污染，toBlob 一定能正常导出。代价是排版逻辑要自己写，
   不能偷懒直接照抄页面的 HTML/CSS。
   ★ 用户反馈"导出图片的排版和效果要和导出 PDF 完全一致"——上面这条"手工画"的路子解决了
   "内容画不画得出来"，但排版是完全另起的一套：所有模块从上到下摊成一整列纯文字/图表，
   没有面板边框、没有底色，本该并排的模块（reportSections() 算出来的同一行）到了图片里
   全部拆成一个模块一整行，页头/区域标题也是另一套配色——跟"打印/导出 PDF"（renderReport()
   真实生成的 DOM，浏览器按 .panel/.rep-row/.rep-region-title 这些样式排出来的版面）基本是
   两种东西。canvas 手工绘制没法逐像素克隆浏览器排版引擎，但排版"逻辑"可以照抄：
   ① 每个模块外面画一个跟 .panel 视觉一致的卡片——边框 var(--border)、底色 var(--surface)、
      圆角，头部一行照 reportModHead() 的样子摆"标题（计数）"在左、note 提示在右，用的是
      同一套配色（var(--text2)/var(--text3)）；
   ② 同一行要并排的模块严格按 renderReport() 里那套"flex 权重分宽度"算法（colW = 行可用宽度
      按 s.widths 的倍数分摊）算出列宽，真的画成并排两列，不再拆成上下两条整行；
   ③ 区域标题照 .rep-region-title 的画法——文字 + 下面一条 accent 色分隔线；
   ④ 清单类模块的截断上限从图片自己单独定的 10 条改成跟页面/PDF 共用同一个
      REPORT_LIST_LIMIT（20），不会出现"PDF 能看 20 条、图片只给看 10 条"这种同一份数据
      两种口径的错觉。 */
async function exportReportImage() {
  try {
    const d = buildReportData(reportPeriod, reportOffset);
    const W = 1290, PAD = 24, LH = 22; // 原来 860，用户反馈人员工作矩阵模块的姓名挤到要竖着写，加宽 50%（860*1.5）留出横排的空间
    // 面板相关的几个尺寸/颜色都是直接抄 CSS 里 .panel/.panel-h/.rep-row/.rep-region 那几条
    // 规则的字面值（见 :root 里的 --border/--surface/--text2/--text3/--accent），这样面板
    // 卡片、标题配色才能跟屏幕上/PDF 里看到的对上，不是另起一套顺眼但对不上号的配色
    const PANEL_PAD = 10, PANEL_HEAD_H = 28, COL_GAP = 12, ROW_GAP = 12, REGION_GAP = 18;
    const COL = {
      text: '#1a1815', text2: '#5a5550', text3: '#9a9590', accent: '#2c5f8a',
      border: '#ddd9d3', surface: '#faf8f5', pageBg: '#f0ede8',
      overdue: '#c0392b', done: '#1e7d45', track: '#e2ded8',
      bar: ['#1e7d45', '#1a6aa8', '#c0392b', '#b0a99c'], barMuted: ['#8fcda8', '#7fb3d9', '#e2a49b', '#c9c0ae'],
    };
    const truncate = (ctx, text, maxW) => {
      let t = String(text == null ? '' : text);
      if (ctx.measureText(t).width <= maxW) return t;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      return t + '…';
    };
    // 模块头部的 note 里常带着"全部展开/全部折叠"这类 <span class="toggle-view">…</span>
    // 控件——图片是静态的，点不了，但页面/PDF 上这行提示原样都在，canvas 里去掉标签只留
    // 文字，保留同一句提示，不装作它是可点的
    const stripTags = s => String(s == null ? '' : s).replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
    // 面板高度要在画边框之前就知道，但内容多高只有真的跑一遍模块的画法才算得出来——
    // 测量遍（draw=false）先把每个面板的内容空跑一次，把量出来的高度按调用顺序记下来，
    // 绘制遍（draw=true）直接按同样的顺序取出来用，边框/底色能在内容之前先画好
    let panelHeightLog = [];

    // 跑两遍：第一遍只算总高度不真的画，第二遍按算出来的高度建立正式画布再画——
    // 这样不用提前手动预测内容会有多长
    function layout(ctx, draw) {
      let cur = { x0: PAD, y: PAD, w: W - PAD * 2 };
      let panelIdx = 0;

      /* ★ 面板内容区第一行文字上方被切掉几个像素：line()/rowLine() 以前是直接把 cur.y
         当基线（fillText 的 y 参数）用——cur.y 这时候是"这一行的槽位顶部"，字符的上升部分
         （尤其是数字、大写字母、中文汉字）会往基线上方冒出去，正常情况下这段冒出来的高度
         落在上一行槽位的下半截空白里，肉眼看不出来；可偏偏第一行没有"上一行"能接住它，
         直接怼进面板头部那条分隔线里，看着就像文字顶部被切了一刀。bar()/hbars()/statBoxes()
         这些原语其实都早就在基线前加了 +8/+9/+10 的偏移量，唯独 line() 和 rowLine() 一直是个
         例外，这次给它们也补上同一个量级的偏移，跟其它原语的画法统一。 */
      const line = (text, opts = {}) => {
        if (draw) {
          ctx.font = opts.bold ? 'bold 13px sans-serif' : '13px sans-serif';
          ctx.fillStyle = opts.color || COL.text;
          ctx.fillText(truncate(ctx, text, cur.w - (opts.indent || 0)), cur.x0 + (opts.indent || 0), cur.y + 9);
        }
        cur.y += opts.gap || LH;
      };
      const rowLine = (dateText, dateColor, title, sub) => {
        if (draw) {
          ctx.font = '12.5px sans-serif';
          ctx.fillStyle = dateColor || COL.text3;
          ctx.fillText(dateText, cur.x0, cur.y + 9);
          ctx.fillStyle = COL.text;
          ctx.fillText(truncate(ctx, title, cur.w - 90 - 170), cur.x0 + 90, cur.y + 9);
          ctx.fillStyle = COL.text3;
          ctx.font = '11.5px sans-serif';
          ctx.fillText(truncate(ctx, sub, 160), cur.x0 + cur.w - 160, cur.y + 9);
        }
        cur.y += LH - 2;
      };
      /* ★ barW 顶格算到这一列最右边的话，右边那截"12/34 · 88%"文字就只能从这条线往外画，
         画到列边界之外——页面上的 HTML 版本（见 hBar）没这个问题：那边是 flex 布局，
         track 和数字标签是两个独立元素，浏览器会自动把 track 让出空间。canvas 是手工排版，
         没有自动让位这回事，得自己预留出 NUM_W 这块地方。 */
      const NUM_W = 92;
      const bar = (label, c, max, indent, muted) => {
        const nameW = 190 - indent;
        const barX = cur.x0 + 200, barW = cur.w - 200 - NUM_W - 8, barH = 13;
        if (draw) {
          ctx.font = '12px sans-serif';
          ctx.fillStyle = muted ? COL.text3 : COL.text;
          ctx.fillText(truncate(ctx, label, nameW), cur.x0 + indent, cur.y + 10);
          ctx.fillStyle = COL.track;
          ctx.fillRect(barX, cur.y, barW, barH);
          const colors = muted ? COL.barMuted : COL.bar;
          let cx = barX;
          [c.done, c.doing, c.late, (c.todo || 0) + (c.hold || 0)].forEach((n, i) => {
            const w = max ? n / max * barW : 0;
            if (w > 0) { ctx.fillStyle = colors[i]; ctx.fillRect(cx, cur.y, w, barH); cx += w; }
          });
          ctx.fillStyle = COL.text3; ctx.font = '11px sans-serif';
          ctx.fillText(truncate(ctx, `${c.done}/${c.total} · ${c.rate}%`, NUM_W), barX + barW + 8, cur.y + 10);
        }
        cur.y += LH - 4;
      };
      const empty = (text) => line(text, { color: COL.text3 });
      // 清单截断上限跟页面/PDF 共用同一个 REPORT_LIST_LIMIT（见 reportTaskRows/reportMsRows），
      // 不再是图片自己单独定的一个更小的数字
      const taskRows = (list, emptyText, overdueColor, dateKey, colorKey) => {
        if (!list.length) { empty(emptyText); return; }
        const color = colorKey === 'done' ? COL.done : (overdueColor ? COL.overdue : COL.text3);
        list.slice(0, REPORT_LIST_LIMIT).forEach(t =>
          rowLine(fmtDate(t[dateKey || 'plan_date']), color, t.title, `${workName(t.work)} · ${t.owner || '未指派'}`));
        if (list.length > REPORT_LIST_LIMIT) line(`还有 ${list.length - REPORT_LIST_LIMIT} 条…`, { color: COL.text3 });
      };
      const msRows = (list, emptyText, overdueColor, dateKey, colorKey) => {
        if (!list.length) { empty(emptyText); return; }
        const color = colorKey === 'done' ? COL.done : (overdueColor ? COL.overdue : COL.text3);
        list.slice(0, REPORT_LIST_LIMIT).forEach(m => {
          const mt = byId('task', m.task);
          rowLine(fmtDate(m[dateKey || 'plan_date']), color, m.deliverable || '（未填写交付物）', mt ? mt.title : '');
        });
        if (list.length > REPORT_LIST_LIMIT) line(`还有 ${list.length - REPORT_LIST_LIMIT} 个…`, { color: COL.text3 });
      };
      /* 人员工作矩阵：格子颜色用跟屏幕上完全一样的算法算（weight = 牵头×3 + 参与），
         列宽按人数自动摊分（这跟 PDF 那次"列宽不写死、交给浏览器按比例分"是同一个思路，
         只是这里没有浏览器布局引擎可用，只能自己算），人员名字竖着画——横着写人一多
         根本排不下，这也是打印那次矩阵的同一类问题，画布上正好用旋转文字的办法解决。
         职责展开/折叠状态跟屏幕上、PDF 里保持一致（拿的是同一个 expandedSet）。 */
      const matrix = (dutyStat, workStat, people, heat, expandedSet) => {
        if (!dutyStat.length) { empty('暂无数据'); return; }
        if (!people.length) { empty('还没有任何人员'); return; }
        // headH 原来是 46（给竖排姓名留的高度），图片导出宽度这一轮加大了 50%（见 exportReportImage
        // 里的 W），每一列能分到的宽度也跟着宽了不少，姓名不用再竖着写才能塞下，改成横排、
        // headH 缩回一行文字的高度就够
        const labelW = 130, headH = 22, rowH = 15;
        const availW = cur.w - labelW;
        const colW = Math.max(9, availW / people.length);
        const cellOf = (pm, person) => {
          const v = (pm && pm.get(person)) || { lead: 0, join: 0 };
          const n = v.lead + v.join;
          if (!n) return null;
          const weight = v.lead * 3 + v.join;
          const ratio = Math.min(1, weight / heat.maxWeight);
          return { n, color: `rgba(44,95,138,${(0.16 + ratio * 0.74).toFixed(2)})` };
        };
        const drawCells = (pm, rowY) => {
          people.forEach((p, i) => {
            const cell = cellOf(pm, p);
            if (!cell) return;
            const cx = cur.x0 + labelW + i * colW;
            ctx.fillStyle = cell.color;
            ctx.fillRect(cx + 1, rowY + 1, colW - 2, rowH - 2);
            ctx.fillStyle = COL.text;
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(String(cell.n), cx + colW / 2, rowY + rowH - 5);
            ctx.textAlign = 'left';
          });
        };
        if (draw) {
          ctx.font = '9px sans-serif';
          ctx.fillStyle = COL.text;
          ctx.textAlign = 'center';
          people.forEach((p, i) => {
            const cx = cur.x0 + labelW + i * colW + colW / 2;
            ctx.fillText(truncate(ctx, p, colW - 2), cx, cur.y + headH - 8);
          });
          ctx.textAlign = 'left';
        }
        cur.y += headH;
        dutyStat.forEach(x => {
          const dutyWorks = workStat.filter(w => w.duty === x.code).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
          const isOpen = expandedSet.has(x.code);
          if (draw) {
            ctx.font = '10px sans-serif';
            ctx.fillStyle = COL.text;
            ctx.fillText(truncate(ctx, x.name, labelW - 6), cur.x0, cur.y + rowH - 4);
            drawCells(heat.dutyMap.get(x.code), cur.y);
          }
          cur.y += rowH;
          if (isOpen) {
            dutyWorks.forEach(w => {
              if (draw) {
                ctx.font = '9.5px sans-serif';
                ctx.fillStyle = COL.text3;
                ctx.fillText(truncate(ctx, w.name, labelW - 16), cur.x0 + 12, cur.y + rowH - 4);
                drawCells(heat.workMap.get(w.id), cur.y);
              }
              cur.y += rowH;
            });
          }
        });
      };
      // 折线图（待办总量趋势）：画法照抄 lineChart() 的坐标算法（网格线/坐标轴/折线/点一一
      // 对应），只是把 SVG 元素换成 ctx 的绘图调用
      const trendLine = (series, aKey, aLabel) => {
        if (!series.length) { empty('无'); return; }
        const h = 130, padL = 34, padR = 10, padT = 8, padB = 20;
        const w = cur.w, iw = w - padL - padR, ih = h - padT - padB;
        const maxV = Math.max(1, ...series.map(s => s[aKey]));
        const niceMax = Math.ceil(maxV / 5) * 5 || 5;
        const x = i => padL + (series.length === 1 ? iw / 2 : i / (series.length - 1) * iw);
        const yv = v => padT + ih - v / niceMax * ih;
        if (draw) {
          ctx.save();
          ctx.translate(cur.x0, cur.y);
          ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.font = '9px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'right';
          for (let i = 0; i <= 5; i++) {
            const v = niceMax / 5 * i, yy = yv(v);
            ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + iw, yy); ctx.stroke();
            ctx.fillText(String(v), padL - 6, yy + 3);
          }
          const step = series.length > 12 ? Math.ceil(series.length / 12) : 1;
          ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
          series.forEach((s, i) => { if (i % step === 0) ctx.fillText(truncate(ctx, s.label, iw / Math.min(series.length, 12)), x(i), h - 4); });
          ctx.strokeStyle = COL.bar[1]; ctx.lineWidth = 1.5;
          ctx.beginPath();
          series.forEach((s, i) => { const px = x(i), py = yv(s[aKey]); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
          ctx.stroke();
          ctx.fillStyle = COL.bar[1];
          series.forEach((s, i) => { ctx.beginPath(); ctx.arc(x(i), yv(s[aKey]), 2, 0, Math.PI * 2); ctx.fill(); });
          // 标了时间的那些点上方顺带标出数值，跟屏幕上 lineChart() 的 valLab 是同一个道理——
          // 图片导出要跟屏幕看到的一致
          ctx.fillStyle = COL.text3;
          series.forEach((s, i) => { if (i % step === 0) ctx.fillText(String(s[aKey]), x(i), yv(s[aKey]) - 6); });
          ctx.textAlign = 'left';
          ctx.restore();
        }
        cur.y += h;
      };
      // 分组柱状图（各月计划完成量）：照抄 groupedBarChart() 的两组柱子并排算法
      const groupedBar = (series, aKey, bKey, aLabel, bLabel) => {
        if (!series.length) { empty('无'); return; }
        const h = 130, padL = 30, padR = 10, padT = 8, padB = 20;
        const w = cur.w, iw = w - padL - padR, ih = h - padT - padB;
        const maxV = Math.max(1, ...series.map(s => Math.max(s[aKey], s[bKey])));
        const niceMax = Math.ceil(maxV / 4) * 4 || 4;
        const bw = iw / series.length;
        const yv = v => padT + ih - v / niceMax * ih;
        if (draw) {
          ctx.save();
          ctx.translate(cur.x0, cur.y);
          ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.font = '9px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'right';
          for (let i = 0; i <= 4; i++) {
            const v = niceMax / 4 * i, yy = yv(v);
            ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + iw, yy); ctx.stroke();
            ctx.fillText(String(v), padL - 6, yy + 3);
          }
          const groupW = bw * 0.7, barW = groupW / 2 - 2;
          ctx.textAlign = 'center';
          series.forEach((s, i) => {
            const gx = padL + i * bw + (bw - groupW) / 2;
            const aH = Math.max(s[aKey] ? 1 : 0, ih - (yv(s[aKey]) - padT));
            const bH = Math.max(s[bKey] ? 1 : 0, ih - (yv(s[bKey]) - padT));
            ctx.fillStyle = COL.bar[1];
            ctx.fillRect(gx, padT + ih - aH, barW, aH);
            ctx.fillStyle = COL.bar[0];
            ctx.fillRect(gx + barW + 3, padT + ih - bH, barW, bH);
            ctx.fillStyle = COL.text3; ctx.font = '8px sans-serif';
            if (series.length <= 12 || i % 2 === 0) ctx.fillText(truncate(ctx, s.label, groupW + 8), gx + groupW / 2, h - 4);
          });
          ctx.textAlign = 'left';
          ctx.restore();
        }
        cur.y += h;
      };
      /* 里程碑甘特图：第一版（msTreeOutline）只画了一份职责→工作→任务的纯文字缩进大纲，
         没有 viewBox 的 SVG 甘特图确实没法直接照抄，但"甘特图"本来就该是"时间轴 + 跨度条 +
         节点"这种图形，光靠缩进列表看不出"哪条快到期、哪条已经逾期"，用户反馈"都是文字"
         说的正是这个——内容没丢，但图形没了。这次真的画一条时间轴：坐标算法照抄
         milestoneTreeHTML()（同一套 lo/hi 边界、同一个 pct() 换算），每一行是"名称 + 跨度条
         + 节点圆点（按逾期/7天内/后续/已完成分色）+ 完成数"，职责/工作展开折叠状态用的也是
         同一个 reportMsDutyExpanded/reportMsWorkExpanded，跟屏幕上/PDF 里折叠成什么样、
         图片里就是什么样，不会出现"页面上折叠着、图片里却全展开"这种三处不一致。
         今天这条竖线贯穿整个甘特区域——要提前算好总行数才能一次性画完整条竖线，所以先把
         要画的行摊平成一个数组，而不是像原来那样边遍历树边画。 */
      const ganttChart = tasks => {
        const { msByTask, byDutyWork } = msTreeGroups(tasks);
        if (!byDutyWork.size) { empty('还没有里程碑'); return; }
        const allOffs = [...msByTask.values()].flat().map(m => daysFromToday(m.plan_date));
        let lo = Math.max(Math.min(0, ...allOffs) - 5, twoMonthsAgoOffset()), hi = Math.max(...allOffs) + 5;
        if (hi - lo < 60) hi = lo + 60;

        const nameW = 170, cntW = 42, rowH = 15, axisH = 16;
        const trackX0 = cur.x0 + nameW, trackW = Math.max(40, cur.w - nameW - cntW);
        const xOf = off => trackX0 + Math.min(1, Math.max(0, (off - lo) / (hi - lo))) * trackW;
        const STATUS_COLOR = { late: '#c0392b', soon: '#e0900a', norm: '#1a6aa8', done: '#1e7d45' };
        const statusOf = m => m.done === '1' ? 'done' : daysFromToday(m.plan_date) < 0 ? 'late' : daysFromToday(m.plan_date) <= 7 ? 'soon' : 'norm';

        // 按 职责→工作→任务 摊平成一份行列表，展开/折叠规则跟 milestoneTreeHTML() 一致：
        // 折叠的那一级自己聚合展示（有跨度条+节点），展开之后交给下一级，自己只剩表头（无跨度条）
        const rows = [];
        [...byDutyWork.keys()].sort((c1, c2) => (c1 || '').localeCompare(c2 || '')).forEach(code => {
          const duty = byId('duty', code);
          const wm = byDutyWork.get(code);
          const tasksUnderDuty = [...wm.values()].flat();
          const msUnderDuty = tasksUnderDuty.flatMap(t => msByTask.get(t.id) || []);
          const dOpen = reportMsDutyExpanded.has(code);
          rows.push({ level: 0, name: duty ? duty.name : '（未归属职责）', trackMs: dOpen ? [] : msUnderDuty, countMs: msUnderDuty });
          if (dOpen) {
            [...wm.keys()].sort((wa, wb) => {
              const a = byId('work', wa), b = byId('work', wb);
              return ((a && a.code) || '').localeCompare((b && b.code) || '');
            }).forEach(workId => {
              const w = byId('work', workId);
              const taskList = wm.get(workId);
              const msUnderWork = taskList.flatMap(t => msByTask.get(t.id) || []);
              const wOpen = reportMsWorkExpanded.has(workId);
              rows.push({ level: 1, name: w ? w.name : '（未归属工作）', trackMs: wOpen ? [] : msUnderWork, countMs: msUnderWork });
              if (wOpen) {
                taskList.slice().sort((a, b) => (a.code || '').localeCompare(b.code || '')).forEach(t => {
                  const ms = msByTask.get(t.id) || [];
                  rows.push({ level: 2, name: t.title, trackMs: ms, countMs: ms });
                });
              }
            });
          }
        });

        if (draw) {
          const ticks = [];
          for (let d = lo; d <= hi; d++) { const ds = offsetDate(d); if (ds.endsWith('-01')) ticks.push({ d, label: (+ds.slice(5, 7)) + '月' }); }
          ctx.font = '9px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'center';
          ticks.forEach(t => ctx.fillText(t.label, xOf(t.d), cur.y + 11));
          ctx.textAlign = 'left';
          // 今天竖线：贯穿轴下面所有行，跟屏幕上"│竖线为今天"是同一件事
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(xOf(0), cur.y + axisH); ctx.lineTo(xOf(0), cur.y + axisH + rows.length * rowH); ctx.stroke();
        }
        cur.y += axisH;

        rows.forEach(r => {
          const indent = r.level * 12;
          if (draw) {
            ctx.font = r.level === 0 ? 'bold 10px sans-serif' : (r.level === 2 ? '9px sans-serif' : '9.5px sans-serif');
            ctx.fillStyle = r.level === 2 ? COL.text3 : COL.text;
            ctx.fillText(truncate(ctx, r.name, nameW - indent - 4), cur.x0 + indent, cur.y + 10);
            const trackY = cur.y + 7;
            ctx.strokeStyle = COL.border; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(trackX0, trackY); ctx.lineTo(trackX0 + trackW, trackY); ctx.stroke();
            const visible = r.trackMs.filter(m => daysFromToday(m.plan_date) >= lo);
            if (visible.length) {
              const offs = visible.map(m => daysFromToday(m.plan_date));
              ctx.strokeStyle = COL.text3; ctx.lineWidth = 2;
              ctx.beginPath(); ctx.moveTo(xOf(Math.min(...offs)), trackY); ctx.lineTo(xOf(Math.max(...offs)), trackY); ctx.stroke();
              visible.forEach(m => {
                ctx.fillStyle = STATUS_COLOR[statusOf(m)];
                ctx.beginPath(); ctx.arc(xOf(daysFromToday(m.plan_date)), trackY, 3, 0, Math.PI * 2); ctx.fill();
              });
            }
            ctx.font = '9px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'right';
            ctx.fillText(`${r.countMs.filter(m => m.done === '1').length}/${r.countMs.length}`, cur.x0 + cur.w, cur.y + 10);
            ctx.textAlign = 'left';
          }
          cur.y += rowH;
        });

        if (draw) {
          const legend = [['已完成', STATUS_COLOR.done], ['7天内', STATUS_COLOR.soon], ['逾期', STATUS_COLOR.late], ['后续', STATUS_COLOR.norm]];
          ctx.font = '9px sans-serif';
          let lx = cur.x0;
          legend.forEach(([label, color]) => {
            ctx.fillStyle = color; ctx.beginPath(); ctx.arc(lx + 4, cur.y + 6, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = COL.text3; ctx.fillText(label, lx + 10, cur.y + 9);
            lx += 10 + ctx.measureText(label).width + 14;
          });
        }
        cur.y += 16;
      };
      /* 报告页/图表页里不少模块用的是"占比饼图"（pieChart()+pieLegend()）或者纯色横条列表
         （hBarList()）——之前这两类模块统统没配 canvas()，图片导出退回 text() 之后，饼图变成
         几行"标签：数字"，横条列表也一样，看不出占比、看不出谁多谁少，跟屏幕上/PDF 里明明
         画着图的样子完全对不上，这是用户反馈"有的模块连图表都没有了，都是排列混乱的文字"
         的真正原因。这里补齐这两类通用画法，尽量让能复用的模块都配上 canvas()。
         data 项里的颜色可能是 var(--c-done) 这种 CSS 变量引用（msCompletionPie/dueSummary
         就是），canvas 的 fillStyle 认不出 var()，先转成字面色值。 */
      const CSS_VAR_COLORS = { '--c-late': '#c0392b', '--c-soon': '#e0900a', '--c-doing': '#1a6aa8', '--c-done': '#1e7d45', '--c-track': '#e2ded8', '--c-todo': '#b0a99c', '--done': '#27ae60', '--overdue': '#c0392b' };
      const resolveColor = c => {
        const m = /^var\((--[\w-]+)\)$/.exec(String(c || ''));
        return m ? (CSS_VAR_COLORS[m[1]] || '#999') : c;
      };
      // 占比饼图：坐标算法照抄 pieChart()（同一个圆心角计算，同一批扇区），图例照抄 pieLegend()
      // （色块 + 文字 + 数量），只是从 SVG 换成 ctx 的圆弧填色
      const pie = data => {
        const list = data.map(x => ({ label: x.label, n: x.n, color: resolveColor(x.color) })).filter(x => x.n > 0);
        if (!list.length) { empty('暂无数据'); return; }
        const size = Math.max(70, Math.min(130, cur.w - 6));
        const cx = cur.x0 + cur.w / 2, cy0 = cur.y + size / 2, r = size / 2 - 2;
        const total = list.reduce((a, x) => a + x.n, 0) || 1;
        if (draw) {
          let angle = -Math.PI / 2;
          list.forEach(x => {
            const frac = x.n / total, a0 = angle, a1 = angle + frac * Math.PI * 2; angle = a1;
            ctx.beginPath(); ctx.moveTo(cx, cy0); ctx.arc(cx, cy0, r, a0, a1); ctx.closePath();
            ctx.fillStyle = x.color; ctx.fill();
          });
          // 占比标签：跟 pieChart() 一样，太窄的扇区（<6%）不标，避免文字互相压住
          angle = -Math.PI / 2;
          ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
          list.forEach(x => {
            const frac = x.n / total, a0 = angle, a1 = angle + frac * Math.PI * 2; angle = a1;
            const pct = Math.round(frac * 100);
            if (pct >= 6) { const mid = (a0 + a1) / 2; ctx.fillText(pct + '%', cx + r * 0.62 * Math.cos(mid), cy0 + r * 0.62 * Math.sin(mid) + 3); }
          });
          ctx.textAlign = 'left';
        }
        cur.y += size + 10;
        list.forEach(x => {
          if (draw) {
            ctx.fillStyle = x.color; ctx.fillRect(cur.x0, cur.y - 8, 9, 9);
            ctx.font = '10.5px sans-serif'; ctx.fillStyle = COL.text;
            ctx.fillText(truncate(ctx, `${x.label} ${x.n}`, cur.w - 14), cur.x0 + 13, cur.y);
          }
          cur.y += 14;
        });
      };
      // 单色纵向柱状图：坐标算法照抄 barChart()（网格线/柱子/柱顶数字/底部标签一一对应），
      // 支持每根柱子按 cls（bar-late/bar-soon/bar-norm/bar-done）取不同颜色，
      // 跟页面上到期分布那种"逾期红、本周内橙、其它蓝"的分色一致
      const BAR_CLS_COLOR = { 'bar-late': '#c0392b', 'bar-soon': '#e0900a', 'bar-norm': '#1a6aa8', 'bar-done': '#1e7d45' };
      const singleBar = items => {
        if (!items.length) { empty('暂无数据'); return; }
        const h = 130, padL = 30, padR = 10, padT = 10, padB = 22;
        const w = cur.w, iw = w - padL - padR, ih = h - padT - padB;
        const maxV = Math.max(1, ...items.map(b => b.n));
        const niceMax = Math.ceil(maxV / 4) * 4 || 4;
        const bw = iw / items.length;
        const yv = v => padT + ih - v / niceMax * ih;
        if (draw) {
          ctx.save();
          ctx.translate(cur.x0, cur.y);
          ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.font = '9px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'right';
          for (let i = 0; i <= 4; i++) {
            const v = niceMax / 4 * i, yy = yv(v);
            ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(padL + iw, yy); ctx.stroke();
            ctx.fillText(String(v), padL - 6, yy + 3);
          }
          ctx.textAlign = 'center';
          items.forEach((b, i) => {
            const bx = padL + i * bw + bw * 0.18, bwid = bw * 0.64;
            const bh = Math.max(b.n ? 2 : 0, ih - (yv(b.n) - padT));
            ctx.fillStyle = BAR_CLS_COLOR[b.cls] || BAR_CLS_COLOR['bar-norm'];
            ctx.fillRect(bx, padT + ih - bh, bwid, bh);
            if (b.n) { ctx.fillStyle = COL.text3; ctx.font = '9px sans-serif'; ctx.fillText(String(b.n), bx + bwid / 2, padT + ih - bh - 3); }
            ctx.fillStyle = COL.text3; ctx.font = '8.5px sans-serif';
            ctx.fillText(truncate(ctx, b.label, bw), bx + bwid / 2, h - 6);
          });
          ctx.textAlign = 'left';
          ctx.restore();
        }
        cur.y += h;
      };
      // 横向列表式条形图：照抄 hBarList()——标签在左，条在中间（单色，不分状态），数字在右
      const hbars = bars => {
        if (!bars.length) { empty('暂无数据'); return; }
        const max = Math.max(1, ...bars.map(b => b.n));
        const nameW = 150, numW = 40, barX = cur.x0 + nameW, barW = cur.w - nameW - numW - 8, barH = 11;
        bars.forEach(b => {
          if (draw) {
            ctx.font = '11.5px sans-serif'; ctx.fillStyle = COL.text;
            ctx.fillText(truncate(ctx, b.label, nameW - 6), cur.x0, cur.y + 9);
            ctx.fillStyle = COL.track; ctx.fillRect(barX, cur.y + 1, barW, barH);
            const bw = max ? b.n / max * barW : 0;
            if (bw > 0) { ctx.fillStyle = '#1a6aa8'; ctx.fillRect(barX, cur.y + 1, bw, barH); }
            ctx.fillStyle = COL.text3; ctx.font = '10.5px sans-serif';
            ctx.fillText(String(b.n), barX + barW + 6, cur.y + 10);
          }
          cur.y += 16;
        });
      };
      // 卡片网格：照抄 statCard() 那种"边框卡片，上面小字标签、下面大字数值"的样子，
      // groups: [{label, cards:[{k,v,warn}]}]——dashCards 是"两组、每组四张"，workOverview
      // 那种只有一张卡（SPI）也走这条路，列数按这一组实际卡片数来，不写死 4 列，
      // 不然卡少的时候会有一堆空着的列宽白白占地方
      const statBoxes = groups => {
        const boxGap = 8;
        groups.forEach(g => {
          if (g.label && draw) { ctx.font = '10.5px sans-serif'; ctx.fillStyle = COL.text3; ctx.fillText(g.label, cur.x0, cur.y + 8); }
          if (g.label) cur.y += 16;
          // 这里不能像别的地方一样封顶列数——boxW 是拿 cols 算的，封顶了但下面 forEach 还是
          // 照 g.cards 实际个数一张张画，列数封顶、卡片没封顶，多出来的卡片会画到面板宽度外面去
          // （dashMyCards"本期"那组、periodStatus/periodOverallStatus 都是 5 张卡，之前没人传过
          // 超过 4 张才把这条隐患露出来）
          const cols = Math.max(1, g.cards.length);
          const boxW = (cur.w - boxGap * (cols - 1)) / cols, boxH = 44;
          g.cards.forEach((c, i) => {
            const bx = cur.x0 + i * (boxW + boxGap);
            if (draw) {
              ctx.fillStyle = COL.surface; ctx.fillRect(bx, cur.y, boxW, boxH);
              ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.strokeRect(bx, cur.y, boxW, boxH);
              ctx.font = '9.5px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'center';
              ctx.fillText(truncate(ctx, c.k, boxW - 6), bx + boxW / 2, cur.y + 16);
              const vColor = c.ok ? COL.done : (c.warn ? COL.overdue : COL.text);
              const vStr = String(c.v);
              // 屏幕/PDF 上 statCard()+fracStr() 拼出来的"12/34"是分子大、分母小两种字号——
              // 这里认同一种"整数/整数"形状的字符串，拆成两段用不同字号画，视觉上才跟屏幕对得上，
              // 不是简单地整串用同一个字号画出来
              const fracMatch = /^(\d+)\/(\d+)$/.exec(vStr);
              if (fracMatch) {
                const [, num, den] = fracMatch;
                ctx.font = 'bold 15px sans-serif';
                const numW = ctx.measureText(num).width;
                ctx.font = '11px sans-serif';
                const denW = ctx.measureText('/' + den).width;
                const startX = bx + boxW / 2 - (numW + denW) / 2;
                ctx.textAlign = 'left';
                ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = vColor;
                ctx.fillText(num, startX, cur.y + 34);
                ctx.font = '11px sans-serif'; ctx.fillStyle = COL.text2;
                ctx.fillText('/' + den, startX + numW, cur.y + 34);
                ctx.textAlign = 'center';
              } else {
                ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = vColor;
                ctx.fillText(truncate(ctx, vStr, boxW - 6), bx + boxW / 2, cur.y + 34);
              }
              ctx.textAlign = 'left';
            }
          });
          cur.y += boxH + 10;
        });
      };
      /* 两栏并排：照抄 .chart-flex 那种"柱状/横条在一边、饼图在另一边"的布局，用的还是
         P77 面板里那套"临时把 cur 换成子区域、跑完再换回来"的手法。leftW/rightW 传其中一个
         固定宽度、另一个传 null 表示"用剩下的空间"——dutyCategoryBars/taskDueDist 是"柱状图
         灵活宽、饼图固定 150"，workOverview 是反过来"饼图固定 150、卡片灵活宽"，两种都要支持。 */
      const twoCol = (leftFn, leftW, rightFn, rightW) => {
        const gap = 16;
        if (leftW == null) leftW = cur.w - rightW - gap;
        if (rightW == null) rightW = cur.w - leftW - gap;
        const startY = cur.y, x0 = cur.x0, w0 = cur.w;
        cur = { x0, y: startY, w: leftW };
        leftFn();
        const leftBottom = cur.y;
        cur = { x0: x0 + leftW + gap, y: startY, w: rightW };
        rightFn();
        const rightBottom = cur.y;
        cur = { x0, y: Math.max(leftBottom, rightBottom), w: w0 };
      };
      const api = { line, empty, bar, rowLine, taskRows, msRows, matrix, trendLine, groupedBar, ganttChart, pie, singleBar, hbars, statBoxes, twoCol };

      const roundRectPath = (x, y, w, h, r) => {
        if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      };
      /* 面板：跟页面上 .panel 视觉一致——边框+底色+圆角，头部一行（标题/计数靠左、note 靠右）
         跟正文之间隔一条分隔线。headerFn/contentFn 传 null 表示"没有这部分"（比如页头那块
         按钮是 no-print，图片/PDF 里本来就没有 panel-b；区域为空时那块占位没有头部）。
         contentFn 在自己的一块子区域里跑——子区域的 x0/y/w 通过临时换掉外层 cur 来实现，
         模块自己调用的 a.line/a.taskRows/a.matrix 等等完全不用感知这一层，还是老样子调用。 */
      function panel(x, y, w, headerFn, contentFn) {
        const hasHeader = !!headerFn, headH = hasHeader ? PANEL_HEAD_H : 0;
        const contentX = x + PANEL_PAD, contentW = w - PANEL_PAD * 2;
        if (!contentFn) {
          const panelH = headH || PANEL_PAD * 2;
          if (draw) {
            ctx.fillStyle = COL.surface; roundRectPath(x, y, w, panelH, 6); ctx.fill();
            ctx.strokeStyle = COL.border; ctx.lineWidth = 1; roundRectPath(x, y, w, panelH, 6); ctx.stroke();
            if (hasHeader) headerFn(contentX, y + PANEL_PAD, contentW);
          }
          return y + panelH;
        }
        const contentStartY = y + headH + PANEL_PAD;
        let panelH;
        if (!draw) {
          const saved = cur;
          cur = { x0: contentX, y: contentStartY, w: contentW };
          contentFn();
          panelH = (cur.y - y) + PANEL_PAD;
          cur = saved;
          panelHeightLog.push(panelH);
        } else {
          panelH = panelHeightLog[panelIdx++];
          ctx.fillStyle = COL.surface; roundRectPath(x, y, w, panelH, 6); ctx.fill();
          ctx.strokeStyle = COL.border; ctx.lineWidth = 1; roundRectPath(x, y, w, panelH, 6); ctx.stroke();
          if (hasHeader) {
            headerFn(contentX, y + PANEL_PAD, contentW);
            ctx.strokeStyle = COL.border; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(x, y + headH); ctx.lineTo(x + w, y + headH); ctx.stroke();
          }
          const saved = cur;
          cur = { x0: contentX, y: contentStartY, w: contentW };
          contentFn();
          cur = saved;
        }
        return y + panelH;
      }
      // 模块面板头部：标题（计数）靠左、note（全量提示 + 模块自己的 note，去掉链接标签只留
      // 文字）靠右——跟 reportModHead() 摆的是同一批信息，只是从 HTML 换成手工画两段文字
      const moduleHeaderFn = m => (hx, hy, hw) => {
        const count = m.titleCount ? m.titleCount(d) : null;
        const label = m.label + (count != null ? `（${count}）` : '');
        ctx.font = 'bold 12.5px sans-serif';
        ctx.fillStyle = COL.text2;
        const labelText = truncate(ctx, label, hw);
        ctx.fillText(labelText, hx, hy + 9);
        const noteParts = [];
        if (m.scope === 'all') noteParts.push('全量 · 不随周期变化');
        if (m.note) noteParts.push(stripTags(m.note(d)));
        const noteRaw = noteParts.join(' · ');
        if (noteRaw) {
          const labelW = ctx.measureText(labelText).width;
          const noteMaxW = hw - labelW - 12;
          if (noteMaxW > 30) {
            ctx.font = '10.5px sans-serif'; ctx.fillStyle = COL.text3; ctx.textAlign = 'right';
            ctx.fillText(truncate(ctx, noteRaw, noteMaxW), hx + hw, hy + 8);
            ctx.textAlign = 'left';
          }
        }
      };
      /* canvas 出口是可选的：饼图这类用不上 bar/rowLine 那几个原语，硬要为每个模块各写一遍
         canvas 排版既啰嗦又容易跟页面版本走偏。没写 canvas 的一律退回"把 text() 那几行画出来"——
         图形没了，但数字一条不少，而且永远跟纯文本简报保持一致，不会出现三个出口各说各话。 */
      const moduleContentFn = m => () => {
        if (m.canvas) m.canvas(d, api);
        else m.text(d, t => line(String(t), { color: COL.text }));
      };

      // 页头面板：跟屏幕/PDF 上"处室工作简报"那块面板视觉一致，只有一行标题——周期切换/翻期
      // 按钮和下面的导出按钮都是 no-print，图片/PDF 里本来就不出现，这里也不画
      const headerText = `📋 科技规划处　处室工作简报　·　统计周期：${d.periodLabel}（${d.rangeStart} ～ ${d.rangeEnd}）`;
      cur.y = panel(cur.x0, cur.y, cur.w, (hx, hy, hw) => {
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = COL.text2;
        ctx.fillText(truncate(ctx, headerText, hw), hx, hy + 9);
      }, null) + REGION_GAP;

      /* 图片导出跟页面走同一份编排、同一批模块（见 REPORT_MODULES 的 canvas 出口），连"同一行
         并排几个模块"这件事也照抄 reportSections() 算出来的 s.rows/s.widths，不再拆成一个
         模块一整行——三个出口（页面/文本/图片）不仅数据一致，版面结构也一致。 */
      reportSections().forEach(s => {
        if (draw) {
          ctx.font = 'bold 14px sans-serif';
          ctx.fillStyle = COL.text;
          ctx.fillText(truncate(ctx, s.title, cur.w), cur.x0, cur.y + 11);
          ctx.strokeStyle = COL.accent; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(cur.x0, cur.y + 18); ctx.lineTo(cur.x0 + cur.w, cur.y + 18); ctx.stroke();
        }
        cur.y += 26;

        if (!s.rows.length) {
          cur.y = panel(cur.x0, cur.y, cur.w, null, () => line('这个区域还没有勾选任何模块', { color: COL.text3 })) + ROW_GAP;
        } else {
          s.rows.forEach(row => {
            const weights = row.map(k => (s.widths && s.widths[k]) || 1);
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            const rowW = cur.w - COL_GAP * (row.length - 1);
            const rowY = cur.y;
            let colX = cur.x0, rowBottom = rowY;
            row.forEach((k, i) => {
              const m = REPORT_MODULE_MAP[k];
              const w = weights[i];
              const colW = Math.max(180, Math.floor(rowW * w / totalWeight));
              const bottom = panel(colX, rowY, colW, moduleHeaderFn(m), moduleContentFn(m));
              rowBottom = Math.max(rowBottom, bottom);
              colX += colW + COL_GAP;
            });
            cur.y = rowBottom + ROW_GAP;
          });
        }
        cur.y += REGION_GAP - ROW_GAP;
      });

      return cur.y + PAD;
    }

    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    const totalH = layout(mctx, false);

    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = W * scale;
    canvas.height = totalH * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = COL.pageBg;
    ctx.fillRect(0, 0, W, totalH);
    layout(ctx, true);

    canvas.toBlob(blob => {
      if (!blob) { showSnack('生成图片失败，建议改用"打印/导出 PDF"'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${reportExportTitle(d)}.png`;
      a.click();
      showSnack('图片已生成，请留意浏览器的下载提示');
    });
  } catch (e) {
    showSnack('生成图片失败：' + (e && e.message ? e.message : e) + '，建议改用"打印/导出 PDF"');
  }
}

/* =============================================================
   18. 数据页
   ============================================================= */
// 连接状态是从"最近一次真的把改动推到共享文件"这个时间点反推出来的（见 markUserSeen），
// 不是真实的在线心跳——没有服务器，做不到那个。10 分钟是掐着 5 分钟一轮的定时软同步来定的，
// 正常在用的人，这个窗口里怎么都该有一次同步；超过这个窗口就不算"在线"，只显示上次是什么时候
function connectionStatusHTML(u) {
  if (!u.lastSeenAt) return '<span class="hint">从未连接</span>';
  const mins = (Date.now() - Date.parse(u.lastSeenAt)) / 60000;
  return mins <= 10 ? '<span style="color:var(--done)">🟢 在线</span>' : '<span class="hint">⚪ 离线</span>';
}
/* 这个人最近一次同步时用的是哪一版 html。
   分发方式是"每人自己存一份 html 拷贝"，所以"有人还在用旧版"是这套方案的固有风险，
   而旧版可能带着已经修好的、会写坏数据的问题。光靠通知大家换新版没法核实，
   这一列就是用来核实的：谁的版本号落后，一眼就看得见。 */
function appVersionCellHTML(u) {
  if (!u.lastAppVersion) return '<span class="hint">—</span>';
  if (u.lastAppVersion === APP_VERSION) return `<span class="hint">${esc(u.lastAppVersion)}</span>`;
  const older = u.lastAppVersion < APP_VERSION;
  return `<span style="color:var(--overdue);font-weight:700"
    title="${older ? '这个人用的 html 比你手上这份旧，请让他强制刷新或重新复制一份新的' : '这个人用的 html 比你手上这份新，该更新的是你自己'}"
    >${esc(u.lastAppVersion)} ${older ? '⚠ 旧版' : '↑ 比你新'}</span>`;
}
function accountsPanelHTML() {
  const users = DB.users.filter(u => !u.deleted_at).sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  return `<div class="panel"><div class="panel-h">账号与角色管理</div><div class="panel-b">
    <table class="dtable"><thead><tr><th style="text-align:left">姓名</th><th>角色</th><th>登录状态</th><th>连接状态</th><th>最近连接</th><th>程序版本</th><th></th></tr></thead><tbody>
      ${users.map(u => {
        const editable = canManageAccount(u);
        const curRoleLabel = roleLabel(u.role);   // 同名的全局函数已经有了，局部变量换个名字免得遮蔽它
        return `<tr><td style="text-align:left">${esc(u.name)}</td><td>${editable
          ? `<select class="role-select" data-act="account-role-change" data-name="${esc(u.name)}">${assignableRoles().map(r =>
              `<option value="${r.v}"${u.role === r.v ? ' selected' : ''}>${esc(r.label)}</option>`).join('')}</select>`
          : esc(curRoleLabel)}</td>
          <td class="cell-center">${u.hash ? '已设置 PIN' : '<span class="hint">待首次登录设置</span>'}</td>
          <td class="cell-center">${connectionStatusHTML(u)}</td>
          <td class="cell-center">${u.lastSeenAt ? esc(fmtLocalDateTime(u.lastSeenAt)) + `（${relTime(u.lastSeenAt)}）` : '<span class="hint">—</span>'}</td>
          <td class="cell-center">${appVersionCellHTML(u)}</td>
          <td class="cell-center">${editable ? `${u.hash
            ? `<button class="btn" data-act="admin-reset-pin" data-name="${esc(u.name)}" title="清掉他现在的 PIN，下次登录会让他自己重新设一个">重置 PIN</button>`
            : ''}
            <button class="btn danger" data-act="admin-delete-user" data-name="${esc(u.name)}" style="margin-left:6px">删除</button>` : ''}</td></tr>`;
      }).join('')}
    </tbody></table>
    <div class="hint" style="margin-top:8px">处室领导可以调整"员工/组长"两级账号的角色；"处室领导/部门领导/管理员"这三级只有管理员能改，且不能通过这里把别人改成处室领导、部门领导或管理员。
    "连接状态/最近连接"是这个账号最近一次真的把改动同步到共享文件的时间，不是网页开没开着的实时心跳——没有服务器，做不到真正的实时在线。

/* =============================================================
   日志页：把 changelog 摊开给管理员看（登录 + 变更）
   ============================================================= */
const LOG_PAGE_SIZE = 50;
const LOG_RANGES = [
  { key: 'today',     label: '今天' },
  { key: 'yesterday', label: '昨天' },
  { key: 'week',      label: '本周' },
  { key: 'month',     label: '本月' },
  { key: 'all',       label: '全部' },
];
const LOG_KINDS = [
  { key: 'all',   label: '全部' },
  { key: 'login', label: '登录' },
  { key: 'edit',  label: '数据变更' },
  { key: ADMIN_LOG_KIND, label: '账号与权限' },
  { key: ALERT_LOG_KIND, label: '⚠ 安全告警' },
];
const LOG_KIND_LABEL = { login: '登录', edit: '变更', [ADMIN_LOG_KIND]: '账号权限', [ALERT_LOG_KIND]: '⚠ 告警' };
/* 还没被处理掉的越权告警。
   判定"已处理"的方式是：这条告警之后，针对同一个人又出现过一条正规的账号变更记录——
   不管管理员是把角色改回去了、还是确认无误正式给他提了权，都会留下这么一条。
   这样不用额外存"已读"状态（存了还得考虑怎么在多台设备之间同步），
   而且它天生是跟着共享文件走的：谁处理的、什么时候处理的，全处都看得到。 */
function unresolvedRoleAlerts() {
  const logs = DB.changelog || [];
  return logs.filter(e => e && e.kind === ALERT_LOG_KIND && e.target)
    /* 时间用 >= 而不是 >：管理员点「确认」时，那条正规记录跟这条告警很可能落在同一毫秒
       （告警本来就是这一次合并里刚记下的），用严格大于会让告警永远消不掉，红点一直挂着。
       反方向的误判——同一毫秒里先有正规变更、后有告警——要发生得两件事精确撞在一起，
       而且真出问题的话下一轮合并会重新报警，代价小得多。 */
    .filter(a => !logs.some(e => e && e.kind === ADMIN_LOG_KIND && e.target === a.target && (e.at || '') >= (a.at || '')))
    .sort((a, b) => (b.at || '').localeCompare(a.at || ''));
}
// 导航栏「日志」上那个红点该不该亮：越权告警 + 大批量删除留底，都算待处理
function securityAlertCount() { return unresolvedRoleAlerts().length + (loadMergeAlert() ? 1 : 0); }
/* 时间分类的边界，返回 [from, to) 两个 ISO 时刻，直接拿去跟条目的 at 比大小。
   两边都是 UTC 的 ISO 串，比较的是绝对时刻，本地时区怎么设都不影响结果。
   "昨天"刻意做成一段闭区间（昨天零点到今天零点），而不是"从昨天到现在"——
   用户点"昨天"想看的就是昨天那一天，不是最近两天。
   now 从外面传进来而不是函数里取：不这样测试没法固定"今天"是哪天。 */
function logRangeBounds(range, now) {
  const base = new Date(now);
  const midnight = offsetDays => {
    const x = new Date(base);
    x.setHours(0, 0, 0, 0);
    x.setDate(x.getDate() + offsetDays);
    return x.toISOString();
  };
  switch (range) {
    case 'today':     return { from: midnight(0), to: null };
    case 'yesterday': return { from: midnight(-1), to: midnight(0) };
    // 一周从周一算起（getDay 里周日是 0，先挪成"周一=0"再回退）
    case 'week':      return { from: midnight(-((base.getDay() + 6) % 7)), to: null };
    case 'month':     return { from: new Date(base.getFullYear(), base.getMonth(), 1).toISOString(), to: null };
    default:          return { from: null, to: null };   // 全部
  }
}
// 按时间段 / 类型 / 人员筛选，并且按时间从近到远排好（页面就是这个顺序展示的）
function filterLogs(list, opts) {
  const o = opts || {};
  const { from, to } = logRangeBounds(o.range || 'all', o.now || Date.now());
  // 文本搜索刻意只匹配"人能看到的东西"：变更摘要本身 + 操作人姓名，不去搜内部才有的
  // taskId/entity 之类的字段——那些用户压根不知道，搜了也匹配不到任何直觉上"该有"的结果
  const text = (o.text || '').trim().toLowerCase();
  return (list || []).filter(e => {
    if (o.kind && o.kind !== 'all' && logKind(e) !== o.kind) return false;
    if (o.who && (e.by || '') !== o.who) return false;
    if (text && !((e.summary || '').toLowerCase().includes(text) || (e.by || '').toLowerCase().includes(text))) return false;
    const at = e.at || '';
    if (from && at < from) return false;
    if (to && at >= to) return false;
    return true;
  }).sort((a, b) => (b.at || '').localeCompare(a.at || ''));
}
/* 安全告警条：越权提权、以及"这次同步删掉了一大片"的留底，都在日志页顶上摊开，并且给出可以直接点的处置动作。
   刻意不做成一个只能"知道了"的提示——没有处置入口的告警，几次之后就没人看了。 */
function securityAlertPanelHTML() {
  const roleAlerts = unresolvedRoleAlerts();
  const merge = loadMergeAlert();
  if (!roleAlerts.length && !merge) return '';
  const rows = roleAlerts.map(a => {
    const cur = DB.users.find(u => u.name === a.target && !u.deleted_at);
    return `<div class="sec-item">
      <div class="sec-txt">${esc(a.summary)}
        <div class="hint">发现时间：${esc(fmtLocalDateTime(a.at))}　当前本机认定的角色：<b>${esc(cur ? roleLabel(cur.role) : '（账号已不存在）')}</b></div></div>
      ${cur ? `<button class="btn danger" data-act="seal-role" data-name="${esc(a.target)}">确认为「${esc(roleLabel(cur.role))}」并写回共享文件</button>` : ''}
    </div>`;
  }).join('');
  const mergeRow = merge ? `<div class="sec-item">
    <div class="sec-txt">${esc(fmtLocalDateTime(merge.at))} 的一次同步删除了 <b>${merge.damage.total}</b> 条记录：
      任务 ${merge.damage.tasks}、里程碑 ${merge.damage.milestones}、工作 ${merge.damage.works}、职责 ${merge.damage.duties}、账号 ${merge.damage.users}。
      <div class="hint">合并前的数据已在本机留了一份底。如果这是正常的批量整理，点"确认无误"消掉这条；
      如果是误删或者文件出了问题，点"回滚"把这些记录恢复回来（恢复会同步给所有人）。</div></div>
    <div style="white-space:nowrap">
      <button class="btn danger" data-act="merge-damage-rollback">回滚这次删除</button>
      <button class="btn" data-act="merge-damage-dismiss" style="margin-left:6px">确认无误</button>
    </div></div>` : '';
  return `<div class="panel sec-panel"><div class="panel-h">⚠ 安全告警（${roleAlerts.length + (merge ? 1 : 0)}）</div>
    <div class="panel-b">${rows}${mergeRow}</div></div>`;
}
async function restoreMergeDamage() {
  const a = loadMergeAlert();
  if (!a || !a.payload) { showSnack('留底已经不在了，没法回滚'); return; }
  const p = a.payload;
  /* 这里刻意用不带 ctx 的 undoRestoreList——也就是不做"同事动过就跳过"的保护。
     那个保护是给 Ctrl+Z 用的：撤销是个随手的动作，不该越界去动别人的东西。
     这里不一样，是管理员看着告警明确决定"把这批删除撤回来"，
     真正的意图就是覆盖掉造成这次删除的那些改动，跳过反而办不成事。 */
  DB.duties = undoRestoreList('code', p.duties, DB.duties);
  DB.works = undoRestoreList('id', p.works, DB.works);
  DB.milestones = undoRestoreList('id', p.milestones, DB.milestones);
  DB.tasks = undoRestoreList('id', p.tasks, DB.tasks);
  if (p.users) DB.users = undoRestoreList('name', p.users, DB.users);
  pushAdminLog(`回滚了 ${fmtLocalDateTime(a.at)} 那次异常同步，恢复了被删掉的 ${a.damage.total} 条记录`);
  clearMergeAlert();
  rebuildIndex();
  await Repo.persist(DB);
  renderShell(); renderPage();
  showSnack(`已回滚，恢复了 ${a.damage.total} 条记录`, { priority: true });
}

function renderLogs() {
  // hasPermission 对管理员恒真，这里换成权限判断，跟 PAGES 里 view_logs 的口径保持一致
  if (!hasPermission('view_logs')) { goto('dashboard'); return; }
  const st = UI.logs;
  const now = Date.now();
  const all = filterLogs(DB.changelog, { range: st.range, kind: st.kind, who: st.who, text: st.text, now });
  const pages = Math.max(1, Math.ceil(all.length / LOG_PAGE_SIZE));
  // 换筛选条件之后页码可能已经越界（比如原来在第 5 页，切到"今天"只剩 1 页），这里夹回合法范围
  st.page = Math.min(Math.max(1, st.page), pages);
  const rows = all.slice((st.page - 1) * LOG_PAGE_SIZE, st.page * LOG_PAGE_SIZE);

  // 时间段/类型按钮上带的条数要跟着文本搜索联动，否则搜着搜着会发现按钮上的数字和实际看到的对不上
  const rangeBtns = LOG_RANGES.map(r => {
    const n = filterLogs(DB.changelog, { range: r.key, kind: st.kind, who: st.who, text: st.text, now }).length;
    return `<span class="s${st.range === r.key ? ' on' : ''}" data-act="logs-range" data-range="${r.key}">${esc(r.label)} ${n}</span>`;
  }).join('');
  const kindBtns = LOG_KINDS.map(k =>
    `<span class="s${st.kind === k.key ? ' on' : ''}" data-act="logs-kind" data-kind="${k.key}">${esc(k.label)}</span>`).join('');
  // 人员下拉的名单 = 现有账号 ∪ 日志里出现过的人名（离职删号之后，他过去的记录还得查得到）
  const people = uniq([...DB.users.filter(u => !u.deleted_at).map(u => u.name), ...DB.changelog.map(e => e.by || '')])
    .filter(Boolean).sort((a, b) => a.localeCompare(b, 'zh'));

  const rowsHTML = rows.length ? rows.map(e => {
    const kind = logKind(e);
    const ent = logEntity(e), ref = logRefId(e);
    // 变更条目挂着一条具体记录。任务能直接跳过去看；工作/职责跳到各自的页面并定位到那一条
    const rec = (kind === 'edit' && ref) ? byId(ent, ref) : null;
    const jump = rec ? (ent === 'task'
      ? ` class="log-row" data-act="focus-task" data-id="${esc(ref)}"`
      : ` class="log-row" data-act="focus-record" data-entity="${ent}" data-id="${esc(ref)}"`) : '';
    const name = rec ? (ent === 'task' ? rec.title : `${rec.code || ''} ${rec.name || ''}`.trim()) : '';
    const label = { task: '任务', work: '工作', duty: '职责' }[ent] || '';
    return `<tr${jump}>
      <td class="log-time">${esc(fmtLocalDateTime(e.at))}<span class="hint"> ${esc(relTime(e.at))}</span></td>
      <td>${esc(e.by || '未署名')}</td>
      <td class="cell-center"><span class="log-tag log-tag-${kind}">${esc(LOG_KIND_LABEL[kind] || '变更')}</span></td>
      <td style="text-align:left">${rec
        ? `<span class="hint">${esc(label)}</span> <b>${esc(name)}</b>${rec.deleted_at ? '（已删除）' : ''}　`
        : (kind === 'edit' && ref ? `<span class="hint">（${esc(label)}已不存在）</span>　` : '')}${esc(e.summary || '')}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="4" class="hint" style="padding:18px;text-align:center">这个范围内没有记录</td></tr>`;

  $('#page-logs').innerHTML = `<div class="pad">
    ${securityAlertPanelHTML()}
    <div class="panel"><div class="panel-h"><span>📜 操作日志</span><span class="seg-ctrl">${rangeBtns}</span></div>
      <div class="panel-b">
        <div class="log-filters">
          <span class="seg-ctrl">${kindBtns}</span>
          <select id="logs-who" data-act="logs-who">
            <option value="">全部人员</option>
            ${people.map(p => `<option value="${esc(p)}"${st.who === p ? ' selected' : ''}>${esc(p)}</option>`).join('')}
          </select>
          <span class="hint">共 ${all.length} 条${all.length > LOG_PAGE_SIZE ? `，每页 ${LOG_PAGE_SIZE} 条` : ''}</span>
          <input id="logs-text" type="text" placeholder="搜索日志内容…" value="${esc(st.text)}" style="margin-left:auto">
        </div>
        <table class="dtable log-table"><thead><tr>
          <th style="text-align:left;width:190px">时间</th><th style="width:90px">人员</th><th style="width:64px">类型</th><th style="text-align:left">内容</th>
        </tr></thead><tbody>${rowsHTML}</tbody></table>
        ${pages > 1 ? `<div class="log-pager">
          <button class="btn" data-act="logs-page" data-step="-1"${st.page <= 1 ? ' disabled' : ''}>← 上一页</button>
          <span class="hint">第 ${st.page} / ${pages} 页</span>
          <button class="btn" data-act="logs-page" data-step="1"${st.page >= pages ? ' disabled' : ''}>下一页 →</button>
        </div>` : ''}
        <div class="hint" style="margin-top:10px">这里记的是<b>登录</b>和<b>任务/里程碑的数据变更</b>，跟着共享文件一起同步，所以能看到全处同事的操作，不只是这台机器上的。
        点变更记录那一行可以直接跳到对应任务。
        <br>日志总共只保留最近 ${CHANGELOG_LIMIT} 条，超出的会自动丢掉最旧的——它是给日常排查用的，不是长期审计档案；要长期留存请在数据页导出备份。
        <br>另外它记不到"谁看过什么"：没有服务器，页面上的浏览行为不会留下任何痕迹。</div>
      </div></div>
  </div>`;
  $('#status-left').textContent = `操作日志 · ${all.length} 条`;
  bindLogsTextSearch();
}
// 日志文本搜索：跟任务/工作页那个搜索框同一套写法——防抖 + 重渲染后把焦点和光标位置还回去，
// 不然每敲一个字就重画一次整页，输入框会丢焦点，字打到一半光标跳没了
function bindLogsTextSearch() {
  const el = $('#logs-text');
  bindComposableSearch(el, () => {
    // 光标位置在真正要重绘的这一刻取，才是用户当下的位置
    const pos = el.selectionStart;
    UI.logs.text = el.value;
    UI.logs.page = 1;
    renderLogs();
    const again = $('#logs-text');
    if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  });
}

/* ★ 换版本之后本机还留着旧缓存的提示 ★
   这份 html 是一人一份拷贝、手工分发的，换新版就是换一个文件；
   但浏览器里那份 localStorage 的 key 是固定的，新旧版本读写的是同一份缓存。
   于是"我换了新版"这件事，对本机缓存来说什么都没发生——旧数据原样留着，
   开机照样读进来、照样往共享文件里合。绝大多数时候没事（记录 id 稳定，版本号高的赢），
   但只要旧缓存里存着共享文件里已经没有的记录，它们就会被当成"本机独有的新内容"重新推上去，
   表现出来就是"删掉的东西又回来了""数据莫名其妙变多了"。

   这里只做提示和提供出口，不自动清：本机缓存也可能正是唯一一份还没推上去的改动，
   二话不说清掉是会真丢数据的。 */
function localCachePanelHTML() {
  if (!_localCacheStale) return '';
  const from = _localCacheAppVersion ? `由 <code>${esc(_localCacheAppVersion)}</code> 写入` : '版本未知（这次改动之前留下的）';
  return `<div class="panel sec-panel"><div class="panel-h">⚠ 本机缓存不是当前这一版写的</div><div class="panel-b">
    <div class="sec-item">
      <div class="sec-txt">这台机器上的浏览器缓存${from}，当前程序版本是 <code>${esc(APP_VERSION)}</code>。
        <div class="hint">换新版 html 不会清掉浏览器里的旧数据，两者用的是同一份缓存。
        通常没问题，但如果旧缓存里存着共享文件里已经没有的记录（别人删掉的、或者以前测试留下的），
        它们会被当成"本机独有的新内容"重新推上共享文件——看起来就像删掉的东西又回来了、数据莫名变多。
        <br><b>建议：</b>先确认这台机器上没有还没同步出去的改动（顶栏同步状态显示正常即可），
        再点右边按钮，用共享文件里的内容整个替换本机缓存。</div></div>
      ${roleAtLeast('admin') ? `<div style="white-space:nowrap">
        <button class="btn danger" data-act="reset-local-cache">以共享文件为准，重置本机缓存</button>
        <button class="btn" data-act="dismiss-cache-warn" style="margin-left:6px">我确认没问题</button>
      </div>` : '<span class="hint">请联系管理员处理</span>'}
    </div></div></div>`;
}

function renderData() {
  /* ★ 每个数字都必须点得进去看到对应的清单 ★
     以前"已删除任务"直接数 DB.tasks，而任务页的「已删除」视图数的是过滤后的池子，两边口径不同，
     结果就是"数据概况说有 166 条、点进去一条没有"——数字对不上清单，比数字本身不准更难排查。
     现在统一走 taskPoolFor + 视图自己的 match，跟任务页那几个视图用的是同一套判据，
     从机制上杜绝这类分叉再次出现。 */
  const countTaskView = k => taskPoolFor(k).filter(TASK_VIEW_MAP[k].match).length;
  const counts = {
    职责: DB.duties.filter(d => !d.deleted_at).length,
    工作: DB.works.filter(w => !w.deleted_at).length,
    里程碑: DB.milestones.filter(m => !m.deleted_at).length,
    任务: countTaskView('all'),
    已删除任务: countTaskView('deleted'),
  };
  const testN = DB.tasks.filter(t => t.custom === '测试').length;
  let size = 0;
  try { size = (localStorage.getItem(STORAGE_KEY) || '').length; } catch (e) {}
  const bk = backupState();
  const hc = healthCheck();
  const yearMap = new Map();
  DB.works.filter(w => !w.deleted_at && w.year).forEach(w => yearMap.set(w.year, (yearMap.get(w.year) || 0) + 1));
  const yearRows = [...yearMap.entries()].sort((a, b) => b[0] - a[0]);
  const shareCfg = effectiveShareCfg();
  const bcfg = backupCfg();
  const canConfigShare = hasPermission('system_admin');
  const me = myUser();

  $('#page-data').innerHTML = `<div class="pad">
    ${localCachePanelHTML()}
    <div class="panel"><div class="panel-h">数据概况</div><div class="panel-b hint">
      ${Object.entries(counts).map(([k, v]) => `${k}：<b>${v}</b>`).join(' &nbsp;·&nbsp; ')}<br>
      本地存储占用：约 <b>${(size / 1024).toFixed(0)} KB</b>（localStorage 上限通常 5 MB）<br>
      存储实现：<code>${esc(Repo.name)}</code>　接入内网服务端后此处会变为 <code>http</code>，页面代码无需改动。
    </div></div>

    <div class="panel"><div class="panel-h">备份</div><div class="panel-b">
      <div class="hint" style="margin-bottom:8px">
        ${bk.last
          ? `上次手动导出：<b${bk.stale ? ' style="color:var(--overdue)"' : ''}>${esc(fmtLocalDateTime(bk.last))}</b>（${bk.days} 天前）`
          : '<b style="color:var(--overdue)">从未手动导出过</b>'}
        ${bk.stale ? '<br><span style="color:var(--overdue)">⚠ 备份之后数据有改动，建议重新导出。</span>' : '<br>✅ 备份已是最新。'}
        <br>数据只存在这台机器的浏览器里，<b>清理浏览器数据会全部丢失</b>，请定期导出，或用下面的定期自动备份。
      </div>
      <button class="btn primary" data-act="export-all">立即导出全部（JSON）</button>
      <button class="btn" data-act="import-backup" style="margin-left:8px">从备份恢复…</button>

      ${canConfigShare ? `<div style="margin:14px 0 4px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:8px">定期自动备份（仅管理员）</div>
        <div class="form-row"><label>开启</label>
          <input type="checkbox" data-act="backup-toggle"${bcfg.enabled ? ' checked' : ''}>
          <span class="hint" style="margin-left:6px">开启后，每隔一段时间自动把当前全部数据另存一份到你指定的文件夹</span></div>
        <div class="form-row"><label>间隔（小时）</label>
          <input type="number" min="${BACKUP_MIN_HOURS}" step="1" style="width:80px" data-act="backup-interval-change" value="${bcfg.hours}"></div>
        <div class="form-row"><label>备份文件夹</label>
          <span>${bcfg.dirName ? `已选择：<b>${esc(bcfg.dirName)}</b>` : '<span class="hint">还没指定</span>'}</span>
          <button class="btn" style="margin-left:8px" data-act="backup-pick-dir">选择备份文件夹…</button></div>
        ${bcfg.dirName ? `<div class="hint" style="margin:-4px 0 8px">浏览器出于隐私限制不允许网页读取系统里的完整路径，
          这里只能显示文件夹自己的名字（不含它上层的路径）——如果这台电脑上有同名的文件夹，选的时候留意一下选对了没有。</div>` : ''}
        <div class="form-row"><label>上次自动备份</label>
          <span>${bcfg.lastAt ? esc(fmtLocalDateTime(bcfg.lastAt)) + `（${relTime(bcfg.lastAt)}）` : '<span class="hint">还没备过</span>'}</span>
          <button class="btn" style="margin-left:8px" data-act="backup-now">立即备份一次</button></div>
        <div class="hint">备份文件名形如 <code>工作管理备份_20260728_020000.json</code>，只增不覆盖，需要时可在上面"从备份恢复"里选回来。
        开关和间隔会记到共享数据文件里，换台电脑、换个管理员看到的都是同一份设置；只有"备份文件夹"这一项没法跨设备用
        （文件夹句柄这东西天生只认得本机），<b>只存在你这台电脑</b>上，换台电脑要重新选一次。
        浏览器的文件写入授权刷新页面后会失效，届时自动备份会先跳过一轮——不过不用特意去点"立即备份一次"，
        跳过之后你在页面上随便点一下（点哪里都行），授权会自动要回来，下一轮就接着正常跑。</div>
      </div>` : ''}
    </div></div>

    <div class="panel"><div class="panel-h">共享文件夹同步（多人协作）</div><div class="panel-b">
      ${_fileHandle
        ? `<div class="hint">已连接：<b>${esc(DB.settings.sharedFolderName || '')}</b>（内部同步文件：${esc(DB.settings.sharedFileName || '')}）　·
            上次同步：${esc(DB.settings.lastSyncAt ? relTime(DB.settings.lastSyncAt) : '刚刚')}</div>
           <div style="margin-top:8px"><button class="btn" data-act="disconnect-shared">断开连接</button></div>`
        : `<div style="margin-top:2px"><button class="btn primary" data-act="connect-shared">连接共享文件夹…</button></div>`}
      ${DB.settings.lastKnownWriteAt ? `<div class="hint" style="margin-top:8px">共享文件里目前那份数据，最后是
        <b>${esc(DB.settings.lastKnownWriteBy || '未署名')}</b> 在 ${esc(fmtLocalDateTime(DB.settings.lastKnownWriteAt))}（${relTime(DB.settings.lastKnownWriteAt)}）写的，
        用的版本是 <code>${esc(DB.settings.lastKnownWriteApp || '未知')}</code>${DB.settings.lastKnownWriteApp && DB.settings.lastKnownWriteApp !== APP_VERSION
          ? `<br>⚠ 跟你这份（<code>${esc(APP_VERSION)}</code>）不是同一个版本——如果你觉得某个同事的改动没同步上来，
             先确认一下他手上那份 html 是不是最新的，旧版本可能还没有最新的同步修复。` : ''}
        <br>排查"某人的改动怎么没同步上来"时，这一行是最直接的证据：如果它一直不是那个人的名字/时间，
        说明问题出在他那台设备（没连上、授权失效了、或者用的还是旧版 html），不是这份代码本身没同步。</div>` : ''}
      <div class="hint" style="margin-top:8px">连接后，职责/工作/里程碑/任务/变更日志会和共享文件夹里的那份 JSON 文件同步；
      每次保存都会先跟文件当前内容按"版本号/更新时间"逐条合并，不会互相覆盖，但两人几乎同时改同一条记录仍可能有一边被冲掉。
      使用者姓名、列宽这些个人设置不会同步，只留在本机。因为没有服务器推送，页面每 5 分钟会自动跟共享文件同步一次来看别人存的新内容
      （不会整页刷新，浏览器缩放、滚动位置都不受影响；有弹窗或正在编辑单元格时会跳过那一次）。
      连接时选中处里共享的那个文件夹即可，文件夹里同步用的文件名是固定的（下面"共享文件夹设置"里配置，
      默认 <code>${DEFAULT_SHARE_FILE_NAME}</code>）。第一次用需要每台电脑各自点一次"连接"；
      需要 Chrome / 360 等 Chromium 内核浏览器，Firefox 等不支持；这个动作本身也只有管理员能点。</div>
    </div></div>

    ${canConfigShare ? `<div class="panel"><div class="panel-h">共享文件夹设置（仅管理员）</div><div class="panel-b">
      <div class="form-row"><label>文件名</label><input id="share-file-name" placeholder="${DEFAULT_SHARE_FILE_NAME}" value="${esc(shareCfg.fileName)}"></div>
      <div class="form-row"><label></label><button class="btn primary" data-act="share-config-save">保存</button></div>
      <div class="hint">文件夹里用来同步数据的那个文件叫什么名字。留空则用默认的
      <code>${DEFAULT_SHARE_FILE_NAME}</code>。保存后所有人下次连接都按这份新规则来（已经连上的人不受影响，除非重新连接）。</div>
    </div></div>` : ''}

    <div class="panel"><div class="panel-h">导入 / 导出</div><div class="panel-b">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn" data-act="export" data-entity="duty">导出职责</button>
        <button class="btn" data-act="export" data-entity="work">导出工作</button>
        <button class="btn" data-act="export" data-entity="milestone">导出里程碑</button>
        <button class="btn" data-act="export" data-entity="task">导出任务</button>
        <button class="btn primary" data-act="export-all">导出全部（JSON 备份）</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        <button class="btn" data-act="import" data-entity="duty">导入职责 CSV</button>
        <button class="btn" data-act="import" data-entity="work">导入工作 CSV</button>
        <button class="btn" data-act="import" data-entity="milestone">导入里程碑 CSV</button>
        <button class="btn" data-act="import" data-entity="task">导入任务 CSV</button>
      </div>
      <div class="hint">导入前会让你选择<b>覆盖模式</b>（按职责/工作/任务编号匹配已有记录并覆盖）还是<b>增量模式</b>
      （全部当新增项，编号自动接续）。<b>导出的文件即导入模板</b>——先导出一份，
      按其列名整理 Excel 后再导入。工作编号请保持 <code>0101</code> 四位；Excel 会吃掉前导零，导入时会自动把
      <code>101</code> 补成 <code>0101</code>。多值字段（参与人）用顿号、逗号或换行分隔，
      值内若含英文逗号会自动转义。</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px;padding-top:10px;border-top:1px solid var(--border)">
        <button class="btn" data-act="import-wide">导入任务 + 里程碑（宽表）</button>
        <button class="btn" data-act="wide-template">下载宽表模板</button>
      </div>
      <div class="hint">给线下已经整理好的 Excel 用的：一行一个任务，最多带 6 组里程碑（时间/交付物/最高呈报层级），
      不用先拆成任务和里程碑两份表分开导入。"所属工作项"按工作名称或工作编号匹配现有工作，列头名称必须跟模板完全一致——
      先点"下载宽表模板"核对一遍列名再整理数据。</div>
    </div></div>

    <div class="panel"><div class="panel-h"><span>年度管理</span></div><div class="panel-b">
      <div class="hint" style="margin-bottom:8px">当前年度：<b>${DB.settings.year || '全部'}</b>　·
        ${yearRows.map(([y, n]) => `${y}：${n} 项工作`).join(' · ') || '暂无年度数据'}</div>
      <button class="btn primary" data-act="year-copy">复制工作到新年度…</button>
      <span class="hint" style="margin-left:8px">编号沿用，里程碑日期顺延一年，任务不复制</span>
    </div></div>

    <div class="panel"><div class="panel-h"><span>数据体检</span>
      <span class="hint">${hc.issues.length
        ? ['error', 'warn', 'info'].filter(l => hc.counts[l]).map(l => `${HEALTH_LEVELS[l].icon} ${hc.counts[l]}`).join(' &nbsp; ')
        : '✅ 全部正常'}</span></div><div class="panel-b">
      ${hc.issues.length
        ? ['error', 'warn', 'info'].filter(lv => hc.issues.some(i => i.level === lv)).map(lv => {
            const L = HEALTH_LEVELS[lv];
            return `<div style="margin-bottom:6px">
              <div class="hint" style="margin:6px 0 2px">${L.icon} <b>${L.label}</b> · ${esc(L.desc)}</div>
              ${hc.issues.filter(i => i.level === lv).map(i => {
                const open = _healthExpanded.has(i.k);
                const items = i.items || [];
                return `<div class="health-row">
                  <div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px">
                    <span style="flex:1">${esc(i.msg)}</span>
                    ${items.length ? `<span class="toggle-view" data-act="health-toggle-detail" data-k="${i.k}">${open ? '收起' : '查看明细'}（${items.length}）</span>` : ''}
                    ${i.k === 'noWork' ? `<button class="btn" data-act="orphan-assign">批量指派…</button>` : ''}
                    ${i.k === 'noDate' ? `<button class="btn" data-act="health-nav-nodate">去补上…</button>` : ''}
                    ${i.fix ? `<button class="btn" data-act="health-fix" data-k="${i.k}" title="${i.undoable ? '修复后 Ctrl+Z 可撤销' : '不可撤销'}">${esc(i.fix)}${i.undoable ? '' : ' ⚠'}</button>` : ''}
                    ${i.purgeFix ? `<button class="btn" data-act="health-purge" data-k="${i.k}" style="color:var(--overdue)" title="不可撤销，需先连共享文件夹并备份">${esc(i.purgeFix)} ⚠</button>` : ''}
                  </div>
                  ${open ? `<div class="health-detail">${items.map(it =>
                    it.act ? `<div class="health-detail-item clickable" data-act="${it.act}" data-id="${esc(it.id)}">${esc(it.label)}</div>`
                           : `<div class="health-detail-item">${esc(it.label)}</div>`).join('')}</div>` : ''}
                </div>`;
              }).join('')}</div>`;
          }).join('')
        : '<div class="hint">✅ 未发现引用断裂或编号冲突。</div>'}
      <div class="chart-note">体检只做两件事：<b>查</b>出引用断裂、状态不一致这类客观错误，以及把它们<b>指</b>给你看。
      它永远不会自己动数据——每一项都要你亲手点一次，点之前还会先弹出"将要处理哪些记录"的清单让你核对。
      带 ⚠ 的按钮表示这一步<b>不可撤销</b>，其余修复完都能 Ctrl+Z 退回来。
      <br>另外：体检<b>不碰回收站</b>。那些是你自己删掉的东西，该不该真清掉由你在上面的回收站里决定，
      体检不替你做主——这条边界就是"体检不会误删有效数据"的根本保证。</div>
    </div></div>

    ${recycleBinPanelHTML()}

    <div class="panel"><div class="panel-h">清理</div><div class="panel-b">
      <div class="hint">当前有 <b>${testN}</b> 条标记为「测试」的任务（标签字段 = 测试）——本程序自己不会生成任何测试数据，
        有的话通常是从别处导入进来的，正式使用前可一键清除。</div>
      <div style="margin-top:8px">
        <button class="btn" data-act="clear-test">清除全部测试任务</button>
        <button class="btn" data-act="reset-all" style="margin-left:8px;color:var(--p1)">清空全部数据</button></div>
    </div></div>
  </div>`;
  $('#status-left').textContent = '数据管理';
}

/* =============================================================
   19. 快捷输入
   ============================================================= */
// Excel 会把 0101 存成数字 101，输入/导入时统一补齐为 4 位
function padCode(s) {
  const v = String(s == null ? '' : s).trim();
  return /^\d{3}$/.test(v) ? '0' + v : v;
}
// 新建任务时默认谁牵头：只有"员工"角色建任务才默认自己（这样他才有权限编辑自己刚建的任务）；
// 其它角色退回所属工作的牵头人兜底——组长/处室领导/部门领导/管理员经常是替别人建任务，
// 不该把任务都算到操作者自己头上
function defaultTaskOwner(workId) {
  const me = myUser();
  if (me && me.role === 'staff') return DB.settings.me;
  const w = workId ? byId('work', workId) : null;
  return w ? (w.owner || '') : '';
}

/* =============================================================
   20. 动作表 + 事件委托
   ============================================================= */
const ACTIONS = {
  goto: d => {
    // 从别的页面切进任务页，按角色给个更有用的默认视图；已经在任务页时再点导航栏不应该把手动选的视图冲掉
    if (d.page === 'tasks' && currentPage !== 'tasks') UI.tasks.view = defaultTaskView();
    goto(d.page);
  },
  'goto-view': d => { UI.tasks.view = d.view; UI.tasks.filters = {}; UI.tasks.search = ''; goto(d.page); },
  undo: () => undoLast(),

  'task-view': d => { UI.tasks.view = d.view; UI.tasks.sel.clear(); $('#tasks-scroll').scrollTop = 0; renderShell(); renderPage(); },
  // 工作/职责的"已停用/已删除"恢复入口视图（切视图要清筛选：停用清单里的分面跟正常清单不是一回事）
  'work-view': d => { UI.works.view = d.view; UI.works.filters = {}; renderShell(); renderPage(); },
  'duty-view': d => { UI.duties.view = d.view; UI.duties.filters = {}; renderShell(); renderPage(); },
  'task-filter': d => { UI.tasks.filters[d.field] = d.val; UI.tasks.sel.clear(); $('#tasks-scroll').scrollTop = 0; renderShell(); renderPage(); },

  /* --- 两级树筛选 --- */
  'tree-pick': d => {
    const st = UI.tasks;
    st.filters._duty = d.duty || '';
    st.filters.work = d.work || '';
    if (d.duty) st.expanded.add(d.duty);
    st.sel.clear();
    $('#tasks-scroll').scrollTop = 0;
    renderShell(); renderPage();
  },
  'tree-toggle': (d, el, e) => {
    e.stopPropagation();
    const st = UI.tasks;
    if (st.expanded.has(d.duty)) st.expanded.delete(d.duty); else st.expanded.add(d.duty);
    renderSidebar();
  },

  /* --- 批量选择 --- */

      for (let i = a; i <= b; i++) st.sel.add(_taskRows[i].id);

  /* ---- 工作台编排（区域 + 模块）——跟报告页那套 report-sec-x / report-mod-x / report-preset-x
