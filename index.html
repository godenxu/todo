function mergeSyncPayload(local, remote) {
  // 先把两边的墓碑并起来，再拿并集去筛每一类记录——
  // 只要有任何一台设备记得"这条被彻底删过"，它就不该在合并结果里重新出现
  const purged = mergePurged(local.purged, remote.purged);
  const changelog = mergeChangelog(local.changelog, remote.changelog);
  const mergedUsers = mergeUserPresence(
    applyPurged('user', 'name', mergeByPk('name', local.users, remote.users), purged),
    local.users, remote.users);
  // 角色提升要过一遍授权检查（见上面那段注释）；挡下来的记在 _integrityAlerts 里等着报警
  const guard = guardRoleIntegrity(local.users, mergedUsers, changelog);
  _integrityAlerts = guard.alerts;
  return {
    duties: applyPurged('duty', 'code', mergeEntityList('duty', local.duties, remote.duties), purged),
    works: applyPurged('work', 'id', mergeEntityList('work', local.works, remote.works), purged),
    milestones: applyPurged('milestone', 'id', mergeEntityList('milestone', local.milestones, remote.milestones), purged),
    tasks: applyPurged('task', 'id', mergeEntityList('task', local.tasks, remote.tasks), purged),
    changelog,
    users: guard.users,
    permissionMatrix: mergePermissionMatrix(local.permissionMatrix, remote.permissionMatrix),
    shareConfig: mergePermissionMatrix(local.shareConfig, remote.shareConfig),
    reportConfig: mergePermissionMatrix(local.reportConfig, remote.reportConfig),
    purged,
  };
}

/* ★ 合并熔断：一次同步不该悄悄删掉一大片 ★
   正常协作里没人会一次删掉十几条记录。真出现，八成是三种情况之一：
   谁误点了批量删除 / 谁导入了一份残缺的表把数据覆盖了 / 文件在网盘上损坏了。
   这三种都属于"发生时没人察觉，几天后才发现"的事故——而那时候本地缓存也早被覆盖了。
   所以在应用这次合并之前，先把合并前的本机数据整份留一份，再醒目地告诉用户，
   给一个一键回滚。不做硬阻断：网盘延迟大、离线再上线是常态，
   动不动就卡住同步只会让人乱点，反而更危险。 */
const MERGE_DAMAGE_LIMIT = 15;
const MERGE_ALERT_KEY = 'todo_v4_merge_alert';
/* ★ 熔断只看"新鲜的"删除 ★（这一段是踩过坑之后加的，改之前请读完）

   原来的判断是：合并前本机还活着、合并后变成已删除的记录，超过 15 条就报警。
   听上去合理，实际误报得非常厉害，真实事故是这样的——
   处里换了新版本之后，有 4 位同事第一次打开就撞上"这批改动删除了 XXX 条记录"的红色告警。
   他们谁都没删过东西，别人也没有。

   原因在于这个比较的基准选错了：它拿的是【本机浏览器缓存】。这几位同事的缓存停留在很久以前
   （中间那段时间他们没打开过页面，或者一直用的是另一台机器），共享文件里这几个月正常的删除
   ——有人删了过期任务、管理员清理过重复数据——对他们的缓存来说全都是"合并后才消失的"。
   一次追平就把几个月的删除攒在一起报了出来。这不是事故，恰恰是同步在正常工作。

   区分方法：真正的事故（误点批量删除、导入了残缺的表、文件损坏）一定是一次爆发，
   删除时间就是刚刚；而追平进来的历史删除，deleted_at 分散在过去几周几个月。
   所以只统计"删除时间晚于基准线"的那些：
   · 基准线优先取本机上次跟共享文件对上账的时间（settings.lastSyncAt）——
     天天在用的人这个窗口只有几分钟，任何爆发都逃不掉，历史删除一条都不会误算；
   · 但基准线最多往回追 24 小时（MERGE_DAMAGE_MAX_WINDOW_MS）。久违重连的人
     lastSyncAt 可能是三个月前，不封顶的话又退回原来那个误报。
   代价是：如果一场事故发生后 24 小时内没有任何人在线，之后再连上的人不会收到告警。
   这个取舍是划算的——真出事时处里必然有人当天就在用，而误报的代价（所有人被吓一跳、
   还可能真去点回滚，把别人的正常改动滚掉）比漏报大得多。 */
const MERGE_DAMAGE_MAX_WINDOW_MS = 24 * 60 * 60 * 1000;
/* 换版本之后的第一次合并，跳过一次熔断告警（只跳这一次，用完即清）。
   在 boot() 里发现本机缓存是别的版本写的时置为 true，详见 noteMergeAlerts 里那段说明。 */
let _skipDamageAlertOnce = false;
// 算出这次合并的"新鲜"基准线：本机上次对账时间与 24 小时前，取更晚的那个
function mergeDamageSince(db, nowMs) {
  const now = nowMs || Date.now();
  const cap = new Date(now - MERGE_DAMAGE_MAX_WINDOW_MS).toISOString();
  const last = (db && db.settings && db.settings.lastSyncAt) || '';
  return last > cap ? last : cap;
}
// 合并前还活着、合并后变成已删除（或整条消失）的记录有多少条——只算 since 之后发生的删除
function mergeDamageReport(localPayload, mergedPayload, since) {
  since = since || '';
  // 整条从数组里消失 = 被彻底删除，它的时间只能去墓碑里查（见 recordPurge）；
  // 查不到墓碑属于说不清来路的消失，宁可报出来让人看一眼，不静悄悄放过
  const purgeAt = new Map((mergedPayload.purged || []).map(p => [p.entity + ' ' + p.id, p.at || '']));
  const fresh = at => !since || (at || '') >= since;
  const gone = (entity, pk, before, after) => {
    const m = new Map((after || []).map(r => [r[pk], r]));
    return (before || []).filter(r => !r.deleted_at).filter(r => {
      const o = m.get(r[pk]), key = entity + ' ' + r[pk];
      if (!o) return purgeAt.has(key) ? fresh(purgeAt.get(key)) : true;
      return !!o.deleted_at && fresh(o.deleted_at);
    }).length;
  };
  const r = {
    tasks: gone('task', 'id', localPayload.tasks, mergedPayload.tasks),
    milestones: gone('milestone', 'id', localPayload.milestones, mergedPayload.milestones),
    works: gone('work', 'id', localPayload.works, mergedPayload.works),
    duties: gone('duty', 'code', localPayload.duties, mergedPayload.duties),
    users: gone('user', 'name', localPayload.users, mergedPayload.users),
  };
  r.total = r.tasks + r.milestones + r.works + r.duties + r.users;
  return r;
}
/* 合并之后集中报警。syncToFile 和 pullFromFile 两条路径都要调——
   只挂在其中一条上的话，另一条就成了绕过检测的后门（历史上这类"只改了一半"的问题出过好几次）。
   必须在 Object.assign(db, merged) 之前拿到 localPayload，它是"合并前"的那份基准。 */
function noteMergeAlerts(localPayload, merged) {
  // 基准线要在 Object.assign 之前取的那份 settings 上算——settings 不进合并，
  // 这里从 DB 上读没问题，但语义上它代表"本机上次对账时间"，跟 localPayload 是同一时刻的东西
  const damage = mergeDamageReport(localPayload, merged, mergeDamageSince(DB));
  if (damage.total > MERGE_DAMAGE_LIMIT) {
    /* ★ 换版本之后第一次合并，不报警 ★（这是第二次针对同一类误报做的收敛，跟前面 24 小时
       基准线那段是配套的，改之前请把两段一起读完）
       处里每次发新版 html，同事打开的那一刻会发生一件必然的事：他本机浏览器里存着一份
       旧缓存，而这段时间共享文件里正常发生过的删除（有人清理过期任务、管理员清了回收站……）
       对这份旧缓存来说全都是"合并之后才消失的"。于是一次追平就把这些删除攒在一起报出来，
       同事看到一句"同步进来的这批改动删除了 XXX 条记录"，谁都没删过东西，却被吓一跳——
       更糟的是他可能真去点"回滚"，把别人正常的清理成果又倒回来。
       24 小时基准线挡不住这一类：如果这批清理恰好就发生在最近一天（发版前刚整理过数据，
       这恰恰是最常见的节奏），删除时间就是新鲜的，照样越过阈值。

       真正的区分点不是时间，而是【这次合并的性质】：换版本后的第一次合并是"拿旧缓存跟
       共享文件对账"，本来就应该以共享文件为准，不是事故；之后的每一次才是正常协作，
       那时候突然少掉一大片才值得警惕。所以只对这第一次放行，而且只放行一次
       （_skipDamageAlertOnce 用完即清），本次会话里后面真出事照样报。
       放行不等于不留痕：照样写一条普通日志说明这次追平了多少条，只是不再当成事故告警、
       也不留那个会误导人的"回滚"入口。 */
    if (_skipDamageAlertOnce) {
      _skipDamageAlertOnce = false;
      pushChangeLog('task', '', `换用新版本后首次同步：从共享文件追平了 ${damage.total} 条此前已删除的记录`
        + `（任务 ${damage.tasks}、里程碑 ${damage.milestones}、工作 ${damage.works}、职责 ${damage.duties}、账号 ${damage.users}）。`
        + `这是本机旧缓存跟共享文件对账的正常结果，不是误删。`);
    } else {
      armMergeDamageAlert(localPayload, damage);
      pushAlertLog(`同步进来的这批改动删除了 ${damage.total} 条记录（任务 ${damage.tasks}、里程碑 ${damage.milestones}、工作 ${damage.works}、职责 ${damage.duties}、账号 ${damage.users}），已在本机留底，可回滚`);
      showSnack(`⚠ 这次同步删掉了 ${damage.total} 条记录，已自动留底。请到「日志」页确认，不对可以一键回滚`, { priority: true });
    }
  }
  _integrityAlerts.forEach(a => {
    // 同一起提权只记一条：不去重的话，每 5 分钟一轮同步就刷一条，正经日志会被淹掉
    const dup = (DB.changelog || []).some(e => e && e.kind === ALERT_LOG_KIND && e.target === a.name && e.roleTo === a.to);
    if (!dup) {
      pushAlertLog(`检测到未经授权的角色提升：${a.name} 被改成了「${roleLabel(a.to)}」（原本是「${roleLabel(a.from)}」），`
        + `但没有找到任何有权限的人做过这次调整的记录。本机已拒绝采纳，仍按「${roleLabel(a.from)}」对待。`,
        { target: a.name, roleTo: a.to });
    }
  });
  if (_integrityAlerts.length) {
    showSnack(`⚠ 挡下 ${_integrityAlerts.length} 处未经授权的角色改动，详见「日志」页`, { priority: true });
  }
}
function loadMergeAlert() {
  try { const raw = localStorage.getItem(MERGE_ALERT_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function clearMergeAlert() { try { localStorage.removeItem(MERGE_ALERT_KEY); } catch (e) {} }
// 留底必须落到 localStorage，不能只放内存：刷新一次页面就没了的"可回滚"等于没有
function armMergeDamageAlert(localPayload, damage) {
  try {
    localStorage.setItem(MERGE_ALERT_KEY, JSON.stringify({
      at: new Date().toISOString(), damage, payload: localPayload,
    }));
  } catch (e) { return; }   // localStorage 满了就只报警不留底，总比整个同步崩掉强
}

// 开机时读到的本机缓存是哪一版 html 写的，以及它跟当前这一版对不对得上（见 boot / Repo.persist）
let _localCacheAppVersion = '', _localCacheStale = false;
let _fileHandle = null, _dirHandle = null, _lastSyncedMtime = 0;
let _offlineMode = false;   // 这台设备之前连过共享文件夹，但这次开机连不上——先用本机缓存顶着，不阻塞使用
let _versionBlocked = false;   // 共享文件是更新版本的 html 写的，我这份太旧——只读不写，并且挡住界面要求升级
let _needPermissionRestore = false;   // 连过、句柄也还在，只是刷新页面后读写授权失效了，点一下就能恢复（见 tryReconnectSharedFile）
/* 这台设备历史上有没有成功连过共享文件夹。开机时查一次 IndexedDB 缓存到这里，
   之后 connect/disconnect 顺手维护——因为 Repo.persist 每次保存都要用它做判断，
   不能每存一次就去开一遍 IndexedDB。
   它存在的意义：区分"本来就是单机用"和"应该同步但这会儿没连上"。后者必须报警，前者不该打扰。 */
let _everConnected = false;
let _lastUnsyncedWarnAt = 0;   // "改动没同步"的提示做节流，不然连着改十条就弹十次
let _lastBackupAuthWarnAt = 0;   // 自动备份因为授权失效而跳过时的提示节流（见 runBackup）
let _backupPermLapsed = false;   // 备份文件夹的写入授权失效了，等下一次用户点一下页面就静默要回来（见 armBackupPermAutoRestore）
let _backupPermRestoring = false;
const IDB_NAME = 'todoapp_fsa', IDB_STORE = 'handles', IDB_KEY = 'sharedFile';
const IDB_BACKUP_KEY = 'backupDir';   // 管理员定期备份的目标文件夹句柄，跟共享文件夹分开存
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_KEY);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
// 备份文件夹句柄单独一条记录。文件夹句柄没法序列化进 localStorage，只能放 IndexedDB
async function idbSetBackupDir(handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(handle, IDB_BACKUP_KEY);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}
async function idbGetBackupDir() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(IDB_BACKUP_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetHandle() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
// 这台设备是否连接过共享文件夹——不管现在的读写权限还有没有效，只要存过句柄就算连过；
// 用来在开机时区分"全新设备，必须先连接"和"连过、这次连不上，先离线用着"这两种情况
async function hasEverConnectedShare() {
  try { return !!(await idbGetHandle()); } catch (e) { return false; }
}
async function idbClearHandle() {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = () => resolve(); tx.onerror = () => reject(tx.error);
  });
}

function emptyRemotePayload() {
  return { duties: [], works: [], milestones: [], tasks: [], changelog: [], users: [], permissionMatrix: null, shareConfig: null, reportConfig: null, purged: [] };
}
/* 读共享文件当前内容。返回 null 表示"这个文件的内容没法用"（不是合法 JSON，或者不是本应用的数据格式），
   调用方遇到 null 一律放弃本次写入——宁可这次不同步，也不能拿一份看不懂的文件当"空数据"覆盖掉。
   完全空白的新文件是正常情况（刚建好还没人写过），按空数据处理。 */
async function readSharedFile() {
  /* ★ "同事改的东西死活同步不出来，关掉 html 重新打开就有了"——大概率就是这里 ★
     关掉重开为什么管用：boot() 每次都会用 _dirHandle.getFileHandle() 向目录重新要一个全新的
     文件句柄；而长时间开着的会话里，我们一直复用连接那一刻拿到的同一个句柄反复读。
     共享文件夹通常是 SMB/网络盘挂载的（见前面 syncToFile 的注释），复用同一个句柄反复读，
     不能保证每次都穿透到磁盘/网络盘的最新内容——某些浏览器实现或者操作系统底层的文件 API，
     对"同一个已经打开的句柄"可能带一层只在句柄生命周期内生效的缓存，尤其是内容是被
     另一台设备写入的情况下。每次读之前都重新问目录要一个新句柄，相当于每次都当成"刚打开这个文件"，
     绕开这层可能存在的句柄级缓存——这也是用户要求的"强制刷新、不要读缓存"最直接的落地方式。
     没有目录句柄（老式单文件句柄，或者拿不到）就用现有的 _fileHandle 兜底，行为跟以前一样。 */
  if (_dirHandle) {
    try {
      const fileName = effectiveShareCfg().fileName;
      _fileHandle = await _dirHandle.getFileHandle(fileName, { create: true });
    } catch (e) { /* 拿不到新句柄就沿用现有的 _fileHandle，读不动的话下面自然会报错/返回 null */ }
  }
  const file = await _fileHandle.getFile();
  const text = await file.text();
  if (!text.trim()) return { remote: emptyRemotePayload(), mtime: file.lastModified };
  let parsed = null;
  try { parsed = JSON.parse(text); } catch (e) { return null; }
  if (!isValidShareData(parsed)) return null;
  return { remote: parsed, mtime: file.lastModified };
}
// 缓存"读到的这份文件是谁、什么时候、用哪个版本的 html 写的"——纯本机展示用（不进共享文件），
// 帮着排查"某个同事的改动好像没同步上来"：如果这里显示的最后写入人/时间一直不是那位同事，
// 大概率是他那边的连接/授权/html 版本有问题，不是这份代码本身没写进去
function cacheRemoteWriteInfo(remote) {
  if (!remote) return;
  DB.settings.lastKnownWriteBy = remote.lastWriteBy || '';
  DB.settings.lastKnownWriteAt = remote.lastWriteAt || '';
  DB.settings.lastKnownWriteApp = remote.lastWriteApp || '';
}
/* 把当前数据同步进共享文件。

   ★ 这里刻意"每次都先读出来合并再写"，不做任何"文件时间戳没变就直接覆盖"的优化 ★
   曾经有过那条快路径，但它在这个部署场景下会真丢数据：共享盘是 SMB / 统信OS 挂载的网络目录，
   文件时间戳的精度往往只到秒（不是毫秒），别人的保存只要跟我们上次同步落在同一个时间刻度里，
   时间戳看上去就是没变的，于是我们会把对方刚存的内容整个抹掉。每次多读一次文件（十几万字符，几毫秒）
   换掉这个隐患是非常划算的。

   写完之后再读一遍确认文件里是不是我们刚写的那一份：如果正好有人在这几毫秒里也写了，我们的内容会被盖掉，
   这时重新合并重写一次。只重试一次就够了——本机内存里的数据一条没少，就算这次还是没推上去，
   下一次保存、或者 5 分钟一轮的定时同步都会自然把它再推上去。 */
async function syncToFile(db) {
  if (!_fileHandle) return;
  if (_versionBlocked) return;   // 数据格式太旧，只准读不准写，免得把新版本的字段抹掉
  if (_staleAppBlocked) return;  // 这份 html 是旧版（缓存/没关标签页/旧拷贝），只准读不准写，见 checkAppVersion
  for (let attempt = 0; attempt < 2; attempt++) {
    const cur = await readSharedFile();
    if (!cur) { showSnack('共享文件内容不是本应用的数据格式，本次没有写入，请确认共享文件夹没选错'); return; }
    if (!checkDataVersion(cur.remote)) return;
    if (!checkAppVersion(cur.remote)) return;   // 刚发现自己是旧版：这次写入就地取消
    cacheRemoteWriteInfo(cur.remote);   // 记一下"我这次写之前，文件里是谁写的"，供排查同步问题用
    // 先把合并前的本机数据留一份引用，下面判断"有没有东西要推"要用它跟文件里的内容比，
    // 不能等 Object.assign 之后再比——那时候本机数据已经包含对方的内容了，永远比得出"没差别"
    const localPayload = syncPayload(db);
    const merged = mergeSyncPayload(localPayload, cur.remote);
    Object.assign(db, merged);
    rebuildIndex();
    /* ★ 必须放在 Object.assign 之后 ★
       这个函数会往 DB.changelog 里追加告警记录。放在 assign 之前的话，
       紧接着的 Object.assign 会把 DB.changelog 整个换成 merged.changelog，
       刚写进去的告警当场就没了——本机确实挡住了篡改，但日志里一个字都不留，
       等于"挡住了却没人知道"，把这套机制最重要的一半（藏不住）废掉了。
       放在后面还顺带解决另一件事：此时 db.changelog 和 merged.changelog 是同一个数组，
       下面那次写入用的正是 merged，于是告警会跟着这次同步一起推给所有人。
       localPayload 仍然是合并前那份——syncPayload 拿的是数组引用，
       Object.assign 换掉的是 db 上的指向，不影响它。 */
    noteMergeAlerts(localPayload, merged);
    /* ★ 本机没有任何文件里还没有的东西，就不写 ★（见 hasLocalContribution 的注释）
       读—合并这一步已经做完了，对方的新内容已经进到本机了，该看到的都看到了；
       缺的只是"把我的推上去"，而我根本没有要推的。这种情况下写入不但没意义，
       还会在挂载盘上白白刷一次缓存、跟别人抢一次文件。 */
    if (!hasLocalContribution(localPayload, cur.remote)) {
      db.settings.lastSyncAt = new Date().toISOString();   // 确实跟文件对过账了，新鲜度要更新
      return;
    }
    /* 「最近连接」心跳只在真的要写的时候搭顺风车，绝不为它单独写一次文件。
       代价是这一列的含义变成"最近一次真正保存过改动"，而不是"最近一次打开着页面"——
       但这恰恰是排查"同事改了东西我这边没看到"时真正想知道的那个时间点，
       而且原来那个也从来不是实时在线心跳（没有服务器，做不到）。 */
    if (db.settings.me) markUserSeen(db.settings.me);
    const writeId = uid('w');
    const w = await _fileHandle.createWritable();
    await w.write(JSON.stringify(filePayload(merged, db, writeId)));
    await w.close();
    const after = await _fileHandle.getFile();
    _lastSyncedMtime = after.lastModified;
    db.settings.lastSyncAt = new Date().toISOString();
    const verify = await readSharedFile();
    if (!verify || verify.remote.writeId === writeId) return;   // 文件里就是我们刚写的那份，收工
  }
}

/* 只把共享文件里的最新内容读进来合并，不写回去。
   为什么要单独有这么一个函数：原来"看看别人改了什么"和"把我的改动推上去"是同一个动作
   （syncToFile 每次都是读—合并—写），这带来三个真问题：
   1) 我什么都没改的时候也要把整份数据重写一遍共享文件。网络盘上 N 台设备各自定时重写，
      互相覆盖的时间窗白白变大，纯属自找麻烦；
   2) 版本门禁挡住写入时（_versionBlocked）连读也一起被挡掉了，界面就永远停在旧数据上；
   3) 写入要请求写权限、要重试校验，比读贵得多，导致我们不敢做得太频繁——
      而"看别人改了啥"恰恰应该做得很频繁。
   拉取是只读的，没有这些顾虑，可以放心多拉几次。 */
async function pullFromFile() {
  if (!_fileHandle) return false;
  const cur = await readSharedFile();
  if (!cur) return false;
  cacheRemoteWriteInfo(cur.remote);
  if (!checkDataVersion(cur.remote)) return false;
  // 拉取本身是只读的，就算判定成旧版也照样把数据读进来给人看——被拦掉的只有写入
  checkAppVersion(cur.remote);
  const localPayload = syncPayload(DB);
  const merged = mergeSyncPayload(localPayload, cur.remote);
  Object.assign(DB, merged);
  rebuildIndex();
  // 只读拉取同样要查：越权和误删不会因为"我这次没写"就不存在。
  // 同样必须放在 Object.assign 之后，理由见 syncToFile 里那段注释
  noteMergeAlerts(localPayload, merged);
  // lastSyncAt 的含义是"最后一次跟共享文件对上账的时间"，只读拉取同样对上了账，
  // 所以这里也要更新——否则顶栏那个新鲜度会一直显示成上一次写入的时间，比实际情况悲观
  DB.settings.lastPullAt = DB.settings.lastSyncAt = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); } catch (e) {}
  return true;
}

/* ★ 可迁移性设计 2：存储层抽象为异步接口。
   localStorage 只是其中一个实现；将来换成内网服务端，只需替换本对象，
   上层页面与交互代码一行不改。 */
const Repo = {
  name: 'localStorage',
  async load() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  /* ★ 这里曾经有个很隐蔽、后果很严重的坑，改的时候务必看完这段注释 ★
     以前是：写完 localStorage，然后 `if (_fileHandle) syncToFile(db)`，没有句柄就直接 return true。
     问题在于——浏览器的文件读写授权【不跨页面存活】，每次刷新/重开页面 _fileHandle 都是 null，
     要等用户点一下"恢复共享连接"才接得回来。也就是说，从打开页面到点中那个按钮之间的每一次保存，
     都只落在本机 localStorage 里，而且静默返回"成功"，界面上一个字都不提示。
     实际后果：同事设完 PIN、改了一天的任务，自己看着都好好的，但共享文件里什么都没有，
     管理员那边完全看不到。这不是同步慢，是压根没同步，而且没人知道。

     所以现在：没能真正写进共享文件的保存，一律记一个持久化的"未同步"标记（settings.pendingSync，
     它跟 me/列宽一样只存本机、不进共享文件），顶栏会一直红着提醒，恢复连接时再把积压的改动整批推上去。 */
  async persist(db) {
    // ★ 保存本身就是一次真实的用户手势，顺手用它把授权要回来 ★ 见 ensureFileHandleFresh 的注释：
    // 这是"任何正式保存都要真正触发一次同步尝试"的关键一步，不能指望用户自己另外去点别的地方
    if (!_fileHandle) await ensureFileHandleFresh();
    /* 在本机缓存上盖一个"这份缓存是哪一版 html 写的"的戳。
       换了新版 html 之后，浏览器里那份 localStorage 还是老的（STORAGE_KEY 是固定的，
       新旧版本读写的是同一份），开机时它会照常被读进来、再合并进共享文件。
       多数情况下这没问题（记录 id 是稳定的，谁的版本号高谁赢），但一旦老缓存里存着
       共享文件里已经没有的记录（别人删掉的、或者当初本机测试留下的），它们会被当成
       "本机独有的新内容"重新推上去。有了这个戳，开机时就能发现"缓存不是这一版写的"，
       进而在数据页给管理员一个明确的提示和"以共享文件为准"的入口。 */
    db.settings.localAppVersion = APP_VERSION;
    const flush = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return true; } catch (e) { return false; } };
    if (!flush()) { showSnack('保存失败：本地存储可能已满，请到「数据」页导出备份', { priority: true }); return false; }
    if (_fileHandle) {
      try {
        // 心跳（markUserSeen）已经挪进 syncToFile 里、只在真的要写文件时才记——
        // 放在这里会让每次 persist 都改到 users，于是"本机有没有新东西要推"永远判定为有，
        // 那个"没改动就别写"的优化会被自己人废掉
        await syncToFile(db);
        if (db.settings.pendingSync) { db.settings.pendingSync = false; flush(); }   // 积压的改动这次一起推上去了
      } catch (e) {
        db.settings.pendingSync = true; flush();
        showSnack('共享文件同步失败：' + (e && e.message ? e.message : e) + '（本机已存，恢复连接后会自动补推）', { priority: true });
      }
    } else if (_everConnected) {
      // 连过共享文件夹、但这会儿没连上：这次改动只在本机，别人看不到——必须说出来，不能装作存好了
      db.settings.pendingSync = true; flush();
      const now = Date.now();
      if (now - _lastUnsyncedWarnAt > 20000) {
        _lastUnsyncedWarnAt = now;
        showSnack('⚠ 改动只存在本机，还没同步给大家——请点顶栏那个红色提示恢复共享连接', { priority: true });
      }
    }
    return true;
  },
  async upsert(entity, rec) {              // 单条写入；HTTP 实现时只发这一条
    stampMeta(rec);
    const list = coll(entity), pk = schema(entity).pk;
    const i = list.findIndex(r => r[pk] === rec[pk]);
    if (i === -1) list.push(rec); else list[i] = rec;
    IDX[entity].set(rec[pk], rec);
    await this.persist(DB);
    return rec;
  },
  async removeHard(entity, id) {
    const list = coll(entity), pk = schema(entity).pk;
    const i = list.findIndex(r => r[pk] === id);
    if (i !== -1) list.splice(i, 1);
    IDX[entity].delete(id);
    recordPurge(entity, id);   // 留墓碑，否则这条会从别人还没同步的设备上飘回来
    await this.persist(DB);
  },
  async bulk(fn) {                          // 批量操作只持久化一次
    fn(); rebuildIndex(); await this.persist(DB);
  },
};

/* ★ 可迁移性设计 3：每条记录带 updated_by / updated_at / rev。
   rev 是冲突检测的最小前提，updated_by 支撑「谁改的」。 */
function stampMeta(rec) {
  const now = new Date().toISOString();
  if (!rec.created_at) rec.created_at = now;
  rec.updated_at = now;
  rec.updated_by = DB.settings.me || '未署名';
  rec.rev = (rec.rev || 0) + 1;
  return rec;
}

/* 变更日志：记录"谁在什么时候把什么字段从A改成了B"，供工作台「最近动态」和日志页用。
   只在值真的变了才记一条，数组封顶避免无限增长；这不是完整审计系统——
   不追踪谁读过、不做冲突历史，只覆盖任务和里程碑这两类编辑，外加登录事件。

   条数上限从 300 提到 800 是为了日志页：300 条在十来个人同时用的时候撑不住几天，
   管理员翻"上周谁改了什么"会直接翻空。每条约 150 字节，800 条也就 120KB 上下，
   相对共享文件本身的体量可以接受。 */
const CHANGELOG_LIMIT = 800;
function trimChangelog() {
  if (DB.changelog.length > CHANGELOG_LIMIT) DB.changelog.splice(0, DB.changelog.length - CHANGELOG_LIMIT);
}
// 日志条目的类型。老数据没有 kind 字段（登录记录是后加的），一律按"变更"算，不能当成未知类型丢掉
function logKind(e) { return (e && e.kind) || 'edit'; }
/* 任务的变更记录。taskId 这个字段名是历史遗留（一开始只有任务会被记），
   现在工作/职责也要记了，统一走 pushChangeLog；这个函数保留下来是因为调用点很多，
   而且工作台「最近动态」正是按 taskId 过滤的，改名反而要动一大片。 */
function pushLog(taskId, summary) { pushChangeLog('task', taskId, summary); }
/* 通用变更记录：任务 / 工作 / 职责都走这里。
   entity + refId 是新加的，日志页靠它们显示"改的是哪一条"；
   taskId 只在实体确实是任务时才填——工作台「最近动态」按 taskId 过滤，
   如果工作/职责的记录也占着这个字段，那个面板会去 byId('task', 工作id) 查，
   查不到就显示成"（任务已不存在）"，等于把最近动态污染成一堆无效条目。 */
function pushChangeLog(entity, refId, summary) {
  if (!summary) return;
  DB.changelog.push({
    id: uid('log'), at: new Date().toISOString(), by: DB.settings.me || '未署名',
    kind: 'edit', entity, refId, taskId: entity === 'task' ? refId : '', summary,
  });
  trimChangelog();
}
// 老记录没有 entity 字段（那时候只记任务），一律按任务算
function logEntity(e) { return (e && e.entity) || 'task'; }
function logRefId(e) { return (e && (e.refId || e.taskId)) || ''; }
/* 登录事件也塞进 changelog，而不是另开一个数组：它天然要按 id 合并、要封顶、要随共享文件同步，
   这几件事 changelog 全都现成有了（见 mergeChangelog / hasLocalContribution），
   另起一套就得把这些规则再抄一遍，还得记得在同步 payload、撤销快照、清空数据等七八个地方都带上它。
   taskId 刻意留空——工作台「最近动态」是按 taskId 过滤的（见 renderDashboard），
   登录记录因此不会混进那个面板，只在日志页出现。 */
function pushLoginLog(name, how) {
  DB.changelog.push({ id: uid('log'), at: new Date().toISOString(), by: name || '未署名', kind: 'login', taskId: '', summary: how || '登录' });
  trimChangelog();
}
/* 账号 / 角色 / 权限矩阵的变更记录。除了给人看，它还是一份"授权凭证"：
   合并时靠它判断一次角色提升是不是真的有人批准过（见 roleUpgradeAuthorized）。
   所以 target / roleTo 这两个结构化字段不能省——光有给人看的 summary，程序没法校验。
   调用点必须在 Repo.persist 之前，让记录和角色改动同批写进共享文件；
   分两次写的话，别人可能先收到改动、后收到凭证，中间那一轮会被误判成越权。 */
function pushAdminLog(summary, extra) {
  if (!summary) return;
  DB.changelog.push(Object.assign({
    id: uid('log'), at: new Date().toISOString(), by: DB.settings.me || '未署名',
    kind: ADMIN_LOG_KIND, taskId: '', summary,
  }, extra || {}));
  trimChangelog();
}
// 检测到的异常。同样进 changelog，于是它会随共享文件同步给所有人——想瞒也瞒不住
function pushAlertLog(summary, extra) {
  if (!summary) return;
  DB.changelog.push(Object.assign({
    id: uid('log'), at: new Date().toISOString(), by: DB.settings.me || '未署名',
    kind: ALERT_LOG_KIND, taskId: '', summary,
  }, extra || {}));
  trimChangelog();
}
function roleLabel(v) { return (ROLES.find(r => r.v === v) || {}).label || v || '（未知角色）'; }
/* 比较一条记录编辑前后的字段差异，拼成人话描述；keys 缺省时比较全部非虚拟字段。
   原来这个函数写死了 'task'，所以工作页、职责页上的任何修改都不进日志——
   管理员翻日志只看得到任务的改动，工作和职责改了什么完全没有痕迹。
   现在按 entity 参数走，三类记录共用同一套差异描述。 */
function diffRecord(entity, before, after, keys) {
  const ks = keys || schema(entity).fields.filter(f => !f.virtual).map(f => f.key);
  const parts = [];
  ks.forEach(k => {
    const f = fieldDef(entity, k);
    if (!f) return;
    const a = JSON.stringify(before[k] == null ? '' : before[k]);
    const b = JSON.stringify(after[k] == null ? '' : after[k]);
    if (a === b) return;
    const fromTxt = displayText(entity, before, f) || '空';
    const toTxt = displayText(entity, after, f) || '空';
    parts.push(`${f.label}：${fromTxt}→${toTxt}`);
  });
  return parts.join('；');
}
// 老名字保留：调用点很多，而且"任务"这一类的调用读起来更直白
function diffTask(before, after, keys) {
  return diffRecord('task', before, after, keys);
}

/* ★ 可迁移性设计 4：软删除保留墓碑，合并多人数据时不会"复活"已删记录 */
/* ★ 删除/恢复必须 stampMeta，否则这次操作根本传不到别人那里 ★
   合并是按"版本号(rev)更高的赢，版本号一样再比修改时间"来的（见 newerRecord）。
   以前这两个函数只改 deleted_at，不动 rev / updated_at——于是对别的设备来说，
   这条记录"看起来跟我手上那条一模一样新"，合并时就保留本地那份（没删的），删除被直接丢掉。

   真实事故：同事在任务详情里删掉一条里程碑，别人工作台的「最近动态」看得到这个动作
   （动态是按 id 取并集的新纪录，一定传得过去），但打开任务详情那条里程碑还在。
   一个删除动作，"说明"传过去了、"事实"没传过去，非常难查。

   为什么以前没暴露：单条删除（任务/工作/职责的 × 按钮）走的是 Repo.upsert，而 upsert 自己会
   stampMeta，等于顺手补上了；只有走 Repo.bulk 的那几条路径（任务详情里删里程碑、批量删除任务、
   宽表导入替换里程碑）没人补，才会中招。把 stampMeta 放进这两个函数本身，所有调用点就都对了——
   已经过 upsert 的那几条会被 stamp 两次，只是 rev 多加 1，对合并没有任何影响。 */
function softDelete(entity, id) {
  const r = byId(entity, id);
  if (r) { r.deleted_at = new Date().toISOString(); stampMeta(r); }
  return r;
}
function undelete(entity, id) {
  const r = byId(entity, id);
  if (r) { delete r.deleted_at; stampMeta(r); }
  return r;
}
// 记一条"这条被彻底删了"的墓碑。没有它的话，这条记录会从任何一台还没同步的设备上原样飘回来
// （合并规则里"我有你没有的记录就收进来"是双向的），等于永远删不干净。见 mergePurged / applyPurged。
function recordPurge(entity, id) {
  if (!Array.isArray(DB.purged)) DB.purged = [];
  DB.purged = DB.purged.filter(p => !(p.entity === entity && p.id === id));   // 同一条重复删就只留最后一次
  DB.purged.push({ entity, id, at: new Date().toISOString(), by: DB.settings.me || '未署名' });
  if (DB.purged.length > PURGED_LIMIT) DB.purged.splice(0, DB.purged.length - PURGED_LIMIT);
}
// 跟 softDelete/undelete 一样，是给 Repo.bulk(fn) 回调里用的同步版本——只改数组和索引，不落盘，
// 落盘交给 bulk 自己最后统一做一次；跟 Repo.removeHard 那个"单条、自己持久化"的版本是两回事
function removeHard(entity, id) {
  const list = coll(entity), pk = schema(entity).pk;
  const i = list.findIndex(r => r[pk] === id);
  if (i !== -1) list.splice(i, 1);
  recordPurge(entity, id);
}

/* ★ 删任务必须连它名下的里程碑一起删 ★
   以前删任务只动任务本身，里程碑原封不动留着，于是产生了一批"没有任务的里程碑"：
   数量照样算进数据页的「里程碑」统计、照样进甘特图和各种图表，但界面上再也点不到它们
   （所属任务已经不在列表里了）。数据体检也发现不了这一类——它判断"孤儿里程碑"用的是
   byId 查不到所属任务，而软删除的任务仍然查得到，正好从缝里漏过去。 */
function cascadeSoftDeleteTask(id) {
  softDelete('task', id);
  DB.milestones.filter(m => m.task === id && !m.deleted_at).forEach(m => softDelete('milestone', m.id));
}
/* 恢复任务时把它名下已删除的里程碑一并恢复。
   已知取舍：如果之前单独删过其中某几条里程碑，这次会跟着一起回来。
   之所以还是这么做——"恢复一条任务，打开一看里程碑全空了"更让人措手不及，
   而多回来的那几条在任务详情里再删一次就行，不会造成任何数据损失。 */
function cascadeRestoreTask(id) {
  const t = undelete('task', id);
  DB.milestones.filter(m => m.task === id && m.deleted_at).forEach(m => undelete('milestone', m.id));
  return t;
}
// 彻底删除同理：里程碑也要连墓碑一起彻底删掉，否则它们会永远留在库里，而且再也没有任何入口能碰到
function cascadeRemoveHardTask(id) {
  DB.milestones.filter(m => m.task === id).forEach(m => removeHard('milestone', m.id));
  removeHard('task', id);
}

/* 人员池：所有 person / persons 字段的取值汇总 */
function allPeople() {
  const s = new Set();
  for (const e of Object.keys(SCHEMAS)) {
    for (const f of schema(e).fields) {
      if (f.type !== 'person' && f.type !== 'persons') continue;
      coll(e).forEach(r => {
        const v = r[f.key];
        if (Array.isArray(v)) v.forEach(x => x && s.add(x));
        else if (v) s.add(v);
      });
    }
  }
  return [...s].sort((a, b) => a.localeCompare(b, 'zh'));
}

/* =============================================================
   4. 记录归一化
   ============================================================= */
function normalize(entity, r) {
  schema(entity).fields.forEach(f => {
    if (f.virtual) return;
    const v = r[f.key];
    switch (f.type) {
      case 'lines':
        if (typeof v === 'string') r[f.key] = parseLines(v);
        else if (!Array.isArray(v)) r[f.key] = [];
        break;
      case 'multi': case 'persons':
        if (typeof v === 'string') r[f.key] = v ? v.split('\n').map(s => s.trim()).filter(Boolean) : [];
        else if (!Array.isArray(v)) r[f.key] = [];
        break;
      case 'num':
        r[f.key] = (v === '' || v == null) ? (f.key === 'progress' ? 0 : '') : Number(v);
        break;
      case 'enum':
        r[f.key] = (v == null || v === '') ? f.options[0].v : String(v);
        break;
      default:
        if (v == null) r[f.key] = '';
    }
  });
  if (!r.rev) r.rev = 1;
  return r;
}
/* 迁移：早期版本用 work.code 当主键，任务与里程碑也用 code 引用工作。
   现在工作主键改为随机 id（好让同一编号能跨年度共存），
   故需给老工作补 id，并把所有引用从 code 重写为 id。
   幂等：已迁移过的数据再跑一次不会有副作用。 */
function migrateWorkIds() {
  const codeToId = new Map();
  let changed = false;
  DB.works.forEach(w => {
    if (!w.id) { w.id = uid('w'); changed = true; }
    if (w.code && !codeToId.has(w.code)) codeToId.set(w.code, w.id);
  });
  if (!codeToId.size) return false;
  const remap = (rec, key) => {
    const v = rec[key];
    if (!v) return;
    if (DB.works.some(w => w.id === v)) return;      // 已经是 id
    const id = codeToId.get(v);
    if (id) { rec[key] = id; changed = true; }
  };
  DB.tasks.forEach(t => remap(t, 'work'));
  return changed;
}

/* 任务编号：职责号(2) + 工作号(2) + 年度后两位(2) + 当年序号(2)，共 8 位。
   序号按「所属工作 + 年度」递增，换年（工作年度不同）自然重新计数。
   换工作会改变前 6 位，故编号跟着工作重新生成，不当作永久不变的主键使用。 */
function nextTaskCode(workId) {
  const w = byId('work', workId);
  if (!w || !w.code) return '';
  const yy = String((w.year || new Date().getFullYear()) % 100).padStart(2, '0');
  const prefix = w.code + yy;
  const used = DB.tasks.filter(t => t.code && t.code.startsWith(prefix) && t.code.length === 8)
    .map(t => parseInt(t.code.slice(6), 10) || 0);
  return prefix + String((used.length ? Math.max(...used) : 0) + 1).padStart(2, '0');
}
/* 迁移：老任务没有编号字段，按所属工作分组、创建时间排序后统一补上。幂等。 */
function migrateTaskCodes() {
  let changed = false;
  const groups = new Map();
  DB.tasks.forEach(t => {
    if (t.code || !t.work) return;
    if (!groups.has(t.work)) groups.set(t.work, []);
    groups.get(t.work).push(t);
  });
  groups.forEach((list, workId) => {
    list.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
    list.forEach(t => { t.code = nextTaskCode(workId); changed = true; });
  });
  return changed;
}
/* 一次性迁移：数据页默认改成只对管理员开放之前，perm-toggle 每次都会把"当前合并生效的整份矩阵"整体存死，
   哪怕只调整过一个不相关的权限，也会把当时"员工/组长/处室领导默认能看数据页"这个旧默认值一起快照进去。
   升级后新默认值是关闭，但这些账号里显式存的 view_data:true 会一直盖过新默认值，必须手动清一次；
   只清这一个键，不动别的已经手动配置过的权限；用 _viewDataMigratedV1 标记只跑一次——
   跑过之后，管理员在权限页里重新手动打开 view_data 不会被这里再次强行关掉。 */
function migrateViewDataDefault() {
  if (!DB.permissionMatrix || DB.permissionMatrix._viewDataMigratedV1) return false;
  ['staff', 'comanager', 'director'].forEach(role => {
    if (DB.permissionMatrix[role] && DB.permissionMatrix[role].view_data === true) delete DB.permissionMatrix[role].view_data;
  });
  DB.permissionMatrix._viewDataMigratedV1 = true;
  stampMeta(DB.permissionMatrix);   // 版本号/时间要跟着涨，不然跟共享文件同步合并时可能被对方还没迁移的旧版本盖回去
  return true;
}
/* 迁移：里程碑从挂在「工作」下改为挂在「任务」下。
   老数据用 task.milestone（单选老里程碑）+ task.deliverable（单文本）表达同样的意思：
   能对上具体任务的迁移过去（同一老里程碑被多个任务引用时，各自拆成一条独立检查点）；
   有交付物但没选里程碑的任务，用任务自己的计划完成日期顶替生成一条；
   完全没有任何任务引用过的老里程碑（纯工作级标记）没有 task 可归属，只能丢弃。
   幂等：老属性迁移完就删掉，第二次跑时已无老数据可迁移。 */
function migrateMilestonesToTasks() {
  let changed = false;
  const oldMsIndex = new Map(DB.milestones.filter(m => !m.task).map(m => [m.id, m]));
  DB.tasks.forEach(t => {
    const oldMsId = t.milestone;
    const oldDeliv = (t.deliverable || '').trim();
    if (oldMsId && oldMsIndex.has(oldMsId)) {
      const old = oldMsIndex.get(oldMsId);
      DB.milestones.push(stampMeta(blank('milestone', {
        task: t.id,
        plan_date: old.plan_date || '',
        deliverable: oldDeliv || old.name || '',
        done: old.status === 'done' ? '1' : '0',
        actual_date: old.actual_date || '',
      })));
      changed = true;
    } else if (oldDeliv) {
      DB.milestones.push(stampMeta(blank('milestone', {
        task: t.id, plan_date: t.plan_date || '', deliverable: oldDeliv,
        done: t.status === 'done' ? '1' : '0', actual_date: t.status === 'done' ? (t.actual_date || '') : '',
      })));
      changed = true;
    }
    if ('milestone' in t) { delete t.milestone; changed = true; }
    if ('deliverable' in t) { delete t.deliverable; changed = true; }
  });
  if (oldMsIndex.size) {
    DB.milestones = DB.milestones.filter(m => m.task || !oldMsIndex.has(m.id));
    changed = true;
  }
  if (changed) DB.tasks.forEach(t => { if (hasCheckpoints(t)) recalcProgress(t); });
  return changed;
}

function blank(entity, over) {
  const sc = schema(entity), r = {};
  sc.fields.forEach(f => { if (!f.virtual) r[f.key] = ''; });
  Object.assign(r, over || {});
  if (sc.pk === 'id' && !r.id) r.id = uid(entity[0]);
  return normalize(entity, r);
}

/* =============================================================
   5. 日期工具
   ============================================================= */
function fmtLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayStr() { return fmtLocal(new Date()); }
/* 把存下来的时间戳（created_at/updated_at 这些，都是 new Date().toISOString() 存的 UTC 串）
   换算成"本地日期"再跟 todayStr()/plan_date 这类本地日期比。
   直接 .slice(0,10) 拿的是 UTC 那一天，跟本地日期能差一天：
   在 UTC-7 的机器上，本地傍晚 18 点存的记录，ISO 串里已经是第二天了——这样比出来
   "今天刚建的任务"会被判成"明天才建"，从当天的统计里整个漏掉。 */
function localDay(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return isNaN(d.getTime()) ? String(ts).slice(0, 10) : fmtLocal(d);
}
// 同上，但连时分也换算成本地时间——created_at/updated_at/lastSyncAt 这些存的都是
// new Date().toISOString()（UTC），直接 .slice(0,16).replace('T',' ') 显示的是 UTC 时刻，
// 不是用户电脑所在时区的时间。界面上给人看的时间，一律要走这个函数，不能直接切 ISO 字符串。
function fmtLocalDateTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d.getTime())) return String(ts).slice(0, 16).replace('T', ' ');
  const p2 = n => String(n).padStart(2, '0');
  return `${fmtLocal(d)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
function offsetDate(n) { const d = new Date(); d.setDate(d.getDate() + n); return fmtLocal(d); }
function weekdayDate(wd) {
  const t = new Date(); let diff = wd - t.getDay(); if (diff <= 0) diff += 7;
  const d = new Date(t); d.setDate(t.getDate() + diff); return fmtLocal(d);
}
function endOfWeek() {
  const t = new Date(), day = t.getDay(), diff = day === 0 ? 0 : 7 - day;
  const d = new Date(t); d.setDate(t.getDate() + diff); return fmtLocal(d);
}
function startOfWeek() {   // 本周周一（供报告页统计"本周完成/交付"用）
  const t = new Date(), day = t.getDay(), diff = day === 0 ? 6 : day - 1;
  const d = new Date(t); d.setDate(t.getDate() - diff); return fmtLocal(d);
}
function parseDue(tok) {
  const t = String(tok || '').toLowerCase();
  if (t === 'today') return todayStr();
  if (t === 'tomorrow') return offsetDate(1);
  if (t === 'next-mon') return weekdayDate(1);
  const dm = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 0 };
  if (dm[t] !== undefined) return weekdayDate(dm[t]);
  const m = t.match(/^\+(\d+)d?$/); if (m) return offsetDate(parseInt(m[1]));
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(t)) {
    const [y, mo, d] = t.split('-').map(Number);
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  return null;
}
// CSV/宽表导入用的日期归一化：比 parseDue 宽容得多——parseDue 是给用户手打快捷输入用的
// （today/+3d 这种关键字加严格的 YYYY-M-D），但表格里的日期是从 Excel 导出来的，格式五花八门
// （斜杠、点、中文"年月日"，甚至单元格没设成日期格式时会导出成 Excel 内部的日期序列号）。
// 认不出来就返回空字符串，不要把一个格式不对的原始字符串硬存进 plan_date——
// 那样字段"看起来有值"，实际上后续所有日期比较（是否逾期、排序）都会因为格式不对而整体错乱，
// 比留空更难发现问题。
function parseCSVDate(raw) {
  const t = String(raw == null ? '' : raw).trim();
  if (!t) return '';
  const viaParseDue = parseDue(t);
  if (viaParseDue) return viaParseDue;
  let m = t.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = t.match(/^(\d{4})年(\d{1,2})月(\d{1,2})[日号]?$/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  // Excel"1900 日期系统"序列号：单元格没设成日期格式时，导出的 CSV 里日期会变成这种整数。
  // 限定在约 1954~2146 年对应的范围内，避免把普通的编号之类的数字误判成日期。
  if (/^\d{4,6}$/.test(t)) {
    const serial = parseInt(t, 10);
    if (serial > 20000 && serial < 90000) {
      const epoch = new Date(Date.UTC(1899, 11, 30));   // Excel 序列号 1 对应 1900-01-01，起点要减去这个偏移
      return fmtLocal(new Date(epoch.getTime() + serial * 86400000));
    }
  }
  return '';
}
/* ★ 日期输入框：连续敲数字要能自动按 4/2/2 位分成年/月/日 ★
   原来这些框都是原生 <input type="date">，敲数字之后怎么分段（先年后月、还是先月后日）
   是浏览器按当前系统/浏览器的地区设置自己决定的，网页本身设了 <html lang="zh-CN"> 也不保证生效——
   同一份 html 在不同人的电脑上，敲同样的数字可能被分出完全不一样的日期。这是原生控件的固有毛病，
   没有 JS 能保证把它锁死成"先年后月后日"。所以这几处改用一个只认连续数字的文本框：
   不管敲到第几位，永远按"前 4 位是年、接下来 2 位是月、最后 2 位是日"分段并自动点上"-"，
   跟系统/浏览器的地区设置完全无关，谁的电脑上都是同一个结果。
   用户如果就是想直接敲 "2027-07-15" 带着"-"敲也一样认——反正这里统统先把非数字字符去掉再重新分段。 */
function dateStrToDigits(s) { return String(s || '').replace(/\D/g, ''); }
function digitsToDateStr(digits) {
  digits = digits.slice(0, 8);
  if (digits.length <= 4) return digits;
  if (digits.length <= 6) return digits.slice(0, 4) + '-' + digits.slice(4);
  return digits.slice(0, 4) + '-' + digits.slice(4, 6) + '-' + digits.slice(6);
}
// 8 位数字凑齐了也不代表就是个真实存在的日子（比如 2 月 30 号）——不能让 new Date 自己"进位"到 3 月，
// 那样表面上存进去一个东西，实际日期已经悄悄变了，比直接判定无效更容易埋雷
function isValidDateStr(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if (!m) return false;
  const y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12 || d < 1 || d > 31) return false;
  const dt = new Date(y, mo - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d;
}
// 日期文本框的输入实时格式化——每敲一个字符都重新按数字重排一次，用在 document 级委托监听里，
// 不需要每次渲染完再挨个绑定（见下面 document.addEventListener('input', ...)）
function maskDateInputLive(el) {
  const digits = dateStrToDigits(el.value);
  el.value = digitsToDateStr(digits);
}
// 敲完离开这个框时才真正校验：没敲完整、或者敲出来的根本不是真实日期，就清空，
// 不留一个看着像日期、实际上是错的半成品在框里
function normalizeMaskedDateOnBlur(el) {
  const digits = dateStrToDigits(el.value);
  if (!digits.length) { el.value = ''; return; }
  const formatted = digitsToDateStr(digits);
  el.value = (digits.length === 8 && isValidDateStr(formatted)) ? formatted : '';
}
// 供 readControl / cpData 收集这些"读值时才校验一次"的地方统一调用：合法就转成标准 YYYY-MM-DD，
// 不合法或没敲完整一律按空处理——双保险，不完全依赖 blur 事件一定会先于读值触发
function normalizeMaskedDateValue(raw) {
  const digits = dateStrToDigits(raw);
  if (!digits.length) return '';
  const formatted = digitsToDateStr(digits);
  return (digits.length === 8 && isValidDateStr(formatted)) ? formatted : '';
}
document.addEventListener('input', e => {
  if (e.target.matches && e.target.matches('.date-mask')) maskDateInputLive(e.target);
});
document.addEventListener('focusout', e => {
  if (e.target.matches && e.target.matches('.date-mask')) normalizeMaskedDateOnBlur(e.target);
});
function fmtDate(str) {
  if (!str) return '';
  const today = todayStr();
  if (str === today) return '今天';
  if (str === offsetDate(1)) return '明天';
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d)) return str;
  if (str >= today && str <= endOfWeek()) return '周' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return d.getFullYear() === new Date().getFullYear()
    ? `${d.getMonth() + 1}/${d.getDate()}`
    : `${String(d.getFullYear()).slice(2)}/${d.getMonth() + 1}/${d.getDate()}`;
}
function dateClass(str) {
  if (!str) return '';
  const today = todayStr();
  if (str < today) return 'due-overdue';
  if (str === today) return 'due-today';
  return '';
}

/* 任务语义 */
function isOpen(t) { return t.status === 'todo' || t.status === 'doing'; }
// 里程碑是任务下面的检查点：任务自己的计划完成时间可能还没到，但某个中间节点已经拖了——
// 只要有一个没完成、且计划日期已过的里程碑，这条任务本身就该算逾期，不能只看任务自己的日期
function hasOverdueMilestone(t) {
  return DB.milestones.some(m => m.task === t.id && !m.deleted_at && m.done !== '1' && m.plan_date && m.plan_date < todayStr());
}
function isOverdue(t) { return isOpen(t) && ((!!t.plan_date && t.plan_date < todayStr()) || hasOverdueMilestone(t)); }   // 挂起不计逾期
function isMine(t) {
  const me = DB.settings.me;
  return me ? (t.owner === me || (t.assignees || []).includes(me)) : false;
}
/* 登录/切换身份后的轻提醒：只在名下确实有逾期或本周到期任务时才提一句，没有就不多嘴，
   免得每次都弹一样的话变成噪音。挂在 login-verify/login-create 成功之后，不额外弹窗、不打断操作，
   只是把这句话拼进已经会出现的"已切换为 xxx"提示里。 */
function personalReminderMsg() {
  const mine = DB.tasks.filter(t => !t.deleted_at && isOpen(t) && isMine(t));
  const late = mine.filter(isOverdue).length;
  const week = mine.filter(t => t.plan_date && t.plan_date >= todayStr() && t.plan_date <= endOfWeek()).length;
  if (!late && !week) return '';
  const parts = [];
  if (late) parts.push(`${late} 条逾期`);
  if (week) parts.push(`${week} 条本周到期`);
  return `，你名下有 ${parts.join('、')}`;
}
/* 里程碑挂在任务下：有检查点时任务进度由完成比例自动算，没有检查点时还是手动填 */
function hasCheckpoints(t) { return DB.milestones.some(m => m.task === t.id && !m.deleted_at); }
function recalcProgress(t) {
  const cps = DB.milestones.filter(m => m.task === t.id && !m.deleted_at);
  if (cps.length) t.progress = Math.round(cps.filter(m => m.done === '1').length / cps.length * 100);
}
/* ★ 进度和状态谁听谁的 ★
   以前改进度只改进度，状态字段完全不联动——一条任务进度都推到 80% 了，状态还能停在"未开始"，
   看板上这种矛盾状态很容易被忽略掉，也会让统计（比如"未开始任务数"）失真。
   规则很简单：
   · 如果这次保存里用户自己也动了状态下拉框（选的跟原来不一样），尊重这个显式选择——
     选"已完成"就把进度顺带补到 100%（没有检查点的任务），从"已完成"改回别的状态就清掉实际完成时间；
   · 否则（用户只碰了进度，没碰状态），状态跟着进度自动纠正：进度到了 100% 就该算完成，
     进度掉下来了就不该再挂着"已完成"，进度从 0 推进了就不该还停在"未开始"。
   "已挂起"是使用者主动选的暂停状态，两个方向都不去碰它——不能因为进度变了就把这个决定悄悄抹掉。
   进度为 0 时不会把"进行中"打回"未开始"：进度归零很可能是重新规划，不代表这活儿真的没人碰过，
   属于合理的中间状态，只往"更符合当前进度"的方向纠正，不做没把握的反向猜测。 */
function reconcileStatusAndProgress(t, before) {
  if (t.status === 'hold') return;
  const statusExplicitlyChanged = !!before && t.status !== before.status;
  if (statusExplicitlyChanged) {
    if (t.status === 'done') {
      t.actual_date = t.actual_date || todayStr();
      if (!hasCheckpoints(t)) t.progress = 100;
    } else if (before.status === 'done') {
      t.actual_date = '';
    }
    return;
  }
  const p = Number(t.progress) || 0;
  if (p >= 100) {
    if (t.status !== 'done') { t.status = 'done'; t.actual_date = t.actual_date || todayStr(); }
  } else if (t.status === 'done') {
    t.status = 'doing'; t.actual_date = '';
  } else if (p > 0 && t.status === 'todo') {
    t.status = 'doing';
  }
}

/* =============================================================
   6. 字段取值 / 展示
   ============================================================= */
function values(entity, rec, f) {
  if (f.derive) { const v = f.derive(rec); return v ? [String(v)] : []; }
  const v = rec[f.key];
  if (Array.isArray(v)) return v.filter(Boolean).map(String);
  if (v === '' || v == null) return [];
  return [String(v)];
}
function label(entity, f, v) {
  if (f.options) { const o = f.options.find(x => x.v === String(v)); return o ? o.label : String(v); }
  if (f.type === 'ref') {
    const r = byId(f.ref, v);
    if (!r) return String(v);
    const rs = schema(f.ref);
    return (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '');
  }
  return String(v);
}
function displayText(entity, rec, f) {
  return values(entity, rec, f).map(v => label(entity, f, v)).join(' / ');
}
function searchText(entity, rec) {
  return schema(entity).fields.map(f => displayText(entity, rec, f)).join(' ').toLowerCase();
}
function sortValue(entity, rec, key) {
  const f = fieldDef(entity, key);
  if (!f) return '';
  if (f.type === 'num') return Number(rec[key]) || 0;
  if (f.type === 'enum') {
    const i = f.options.findIndex(o => o.v === String(rec[key]));
    return i < 0 ? 99 : i;
  }
  if (f.type === 'date') return rec[key] || '';
  if (f.type === 'checkpoints') {
    // 按最近一个未完成检查点的日期排序，全部完成或没有检查点的排到最后
    const cps = DB.milestones.filter(m => m.task === rec.id && !m.deleted_at && m.done !== '1' && m.plan_date);
    return cps.length ? cps.map(m => m.plan_date).sort()[0] : '9999-99-99';
  }
  return values(entity, rec, f).map(v => label(entity, f, v)).join(',');
}

/* =============================================================
   7. 撤销：整库快照
   ============================================================= */
const UNDO_LIMIT = 20;
/* ★ 撤销快照的有效期 ★
   撤销的实现是"把记录改回旧内容"，它没法只作用于自己那一份——数据是全处共用的一份。
   隔的时间越久，同事在这批记录上继续往前做的工作就越多，一次 Ctrl+Z 顺手把别人的成果
   一起抹掉的概率也越高。10 分钟足够覆盖"手抖点错了马上撤回"这个真实用途；
   超过这个范围的回退应该是人和人商量着改，而不是由一个快捷键悄悄完成。 */
const UNDO_MAX_AGE_MS = 10 * 60 * 1000;
let undoStack = [];
/* 最近一次拍快照的时刻。用途只有一个：让底部提示条判断"这一条提示是不是真的对应
   一次刚刚发生的、可撤销的改动"——详见 showSnack 里那段注释。 */
let _lastSnapshotAt = 0;
function snapshot() {
  _lastSnapshotAt = Date.now();
  undoStack.push({
    // 快照时刻有两个用途：判有没有过期；以及判某条记录是不是"我拍完快照之后才被别人动过"
    at: new Date().toISOString(),
    // 取值方式必须跟 stampMeta 写进 updated_by 的那一套完全一致（含"未署名"这个兜底），
    // 否则后面拿它跟 updated_by 比对会永远不相等，等于把每条记录都当成别人改的
    by: DB.settings.me || '未署名',
    data: JSON.stringify({
      duties: DB.duties, works: DB.works, milestones: DB.milestones, tasks: DB.tasks, changelog: DB.changelog,
      users: DB.users, permissionMatrix: DB.permissionMatrix,
      // 墓碑必须一起存：撤销"彻底删除"时如果只把记录放回数组、墓碑还留着，
      // 下一次合并会照着墓碑再把它筛掉一遍，撤销就成了假的
      purged: DB.purged || [],
    }),
  });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
}
/* 这条记录在我拍下快照之后，有没有被"别人"改过。
   两个条件缺一不可：改动时间晚于快照时刻（说明确实发生在这段窗口里），
   且最后修改人不是当初做这次操作的人（说明不是我自己后续又存了一次）。
   只要成立，这条记录就整条保持现状、不参与回退——宁可少撤一点，也不能把同事的改动吞掉。 */
function touchedByOthersSince(rec, ctx) {
  if (!rec) return false;
  return (rec.updated_at || '') > ctx.at && (rec.updated_by || '') !== ctx.by;
}
/* ★ 撤销必须表现成"一次新的修改"，不能只是把内存里的数据拨回旧版本 ★
   合并规则是"版本号(rev)高的赢"。如果直接把快照里那份旧记录塞回 DB，它的版本号比共享文件里
   那条低——而共享文件里那条恰恰是刚才那次操作自己推上去的——于是紧接着的 Repo.persist 一读一合并，
   立刻又被盖回来了。也就是说撤销在同一个函数里就被自己撤销掉了，用户看到的是"Ctrl+Z 完全没反应"。
   这不是最近才坏的：只要连着共享文件夹，撤销就一直是假的，只有单机不连的时候才真能用。

   所以逐条比对快照和当前状态，把撤销落成一次正常的向前编辑：
   · 内容真的变了的 → 用快照里的内容，但版本号取"两边较大者 +1"，这样它一定盖得过文件里那条；
   · 没变过的 → 原样留着，不白白顶版本号（否则每次撤销都会把整个文件重写一遍）；
   · 被撤销的那个动作新建出来的记录 → 补一条软删除（同样顶高版本号），
     直接从数组里抠掉是没用的，它会从共享文件里原样飘回来。
   彻底删除的撤销也能一并解决：墓碑是按"墓碑时间晚于记录最后修改时间"才生效的（见 applyPurged），
   我们把记录的 updated_at 刷成现在，就自然盖过了那条墓碑。 */
// pk 直接传进来，不从 schema 查：账号（users）没有对应的 schema 定义，
// 它在合并时也是直接按 'name' 走的（见 mergeSyncPayload），这里保持一致
function undoRestoreList(pk, snapList, curList, ctx) {
  const now = new Date().toISOString();
  const by = DB.settings.me || '未署名';
  const curMap = new Map((curList || []).map(r => [r[pk], r]));
  const skip = who => { if (ctx) ctx.skipped.push(who || '同事'); };
  const out = (snapList || []).map(r => {
    const cur = curMap.get(r[pk]);
    if (!cur) return Object.assign({}, r);
    if (JSON.stringify(r) === JSON.stringify(cur)) return cur;   // 这条压根没被那次操作动过
    /* ★ 同事在这条记录上接着改过 → 整条保持现状，不回退 ★
       这里的比对是整条记录级别的，没法分辨"标题是我改的、牵头人是他改的"——
       快照里只有"我动手之前"那一份，没有"我动完手那一刻"那一份，缺了这个中间态就无从归属到字段。
       所以取保守解：只要这条记录在窗口里被别人碰过，就整条不动。
       代价是我自己那部分改动也撤不掉了，但反过来（把同事的改动一起抹掉、他还毫不知情）要严重得多。 */
    if (ctx && touchedByOthersSince(cur, ctx)) { skip(cur.updated_by); return cur; }
    return Object.assign({}, r, {
      rev: Math.max(r.rev || 0, cur.rev || 0) + 1, updated_at: now, updated_by: by,
    });
  });
  const snapIds = new Set((snapList || []).map(r => r[pk]));
  (curList || []).forEach(cur => {
    if (snapIds.has(cur[pk])) return;
    if (cur.deleted_at) { out.push(cur); return; }
    /* 快照里没有、现在有——有两种可能：被撤销的那次操作新建的，或者同事在这段时间里新建、
       刚同步进来的。光看"快照里没有"分不出这两者，必须再看最后修改人是不是我：
       不是我 → 那是别人的东西，跟这次撤销毫无关系，删了就是事故。 */
    if (ctx && (cur.updated_by || '') !== ctx.by) { skip(cur.updated_by); out.push(cur); return; }
    // 确认是被撤销的那次操作新建的 → 撤销就该把它删掉
    out.push(Object.assign({}, cur, {
      deleted_at: now, rev: (cur.rev || 0) + 1, updated_at: now, updated_by: by,
    }));
  });
  return out;
}
async function undoLast() {
  const s = undoStack.pop();
  if (!s) { showSnack('没有可撤销的操作了'); return; }
  /* 过期就整栈作废，不只是丢掉这一条：比它更早的快照只会更旧，留着也是等着被拒绝，
     一次清干净还能顺手让顶栏那个"撤销"按钮收起来（showSnack 里按栈长决定显隐），
     免得给用户一个点了必然失败的按钮 */
  if (Date.now() - Date.parse(s.at) > UNDO_MAX_AGE_MS) {
    undoStack.length = 0;
    showSnack(`这次操作已经过去 ${Math.round(UNDO_MAX_AGE_MS / 60000)} 分钟以上，期间同事可能已经在这个基础上继续做了，不再提供撤销`, { priority: true });
    return;
  }
  const d = JSON.parse(s.data);
  // skipped 收集"因为别人动过而没敢回退"的那些，最后要如实告诉用户，不能默默跳过
  const ctx = { at: s.at, by: s.by, skipped: [] };
  DB.duties = undoRestoreList('code', d.duties, DB.duties, ctx);
  DB.works = undoRestoreList('id', d.works, DB.works, ctx);
  DB.milestones = undoRestoreList('id', d.milestones, DB.milestones, ctx);
  DB.tasks = undoRestoreList('id', d.tasks, DB.tasks, ctx);
  /* 变更日志不能整个拨回快照那一份：这段窗口里同步进来的、同事产生的动态也在里面，
     整体覆盖等于把别人的动态记录一起抹掉（工作台"最近动态"会凭空少几条）。
     只去掉"快照里没有、且是我自己产生"的那些——也就是被撤销的这次操作留下的痕迹。 */
  const snapLogIds = new Set((d.changelog || []).map(e => e.id));
  DB.changelog = (d.changelog || [])
    .concat((DB.changelog || []).filter(e => !snapLogIds.has(e.id) && (e.by || '') !== ctx.by))
    .sort((a, b) => (a.at || '').localeCompare(b.at || ''))
    .slice(-CHANGELOG_LIMIT);
  // 账号也按同一套规则回退（主键是姓名），否则"撤销删除账号"同样会被文件里那份盖回来
  if (d.users) DB.users = undoRestoreList('name', d.users, DB.users, ctx);
  if (d.permissionMatrix !== undefined) {
    const cur = DB.permissionMatrix;
    // 权限矩阵是整个对象比版本，同理要顶过文件里那一份；但同事刚改过就一律不碰
    if (cur && touchedByOthersSince(cur, ctx)) {
      ctx.skipped.push(cur.updated_by || '同事');
    } else {
      DB.permissionMatrix = (d.permissionMatrix && cur && JSON.stringify(d.permissionMatrix) !== JSON.stringify(cur))
        ? Object.assign({}, d.permissionMatrix, {
            rev: Math.max(d.permissionMatrix.rev || 0, cur.rev || 0) + 1,
            updated_at: new Date().toISOString(), updated_by: DB.settings.me || '未署名',
          })
        : d.permissionMatrix;
    }
  }
  /* 墓碑同理：快照那一份 + 这段窗口里别人新增的墓碑。整个拨回快照的话，
     同事"彻底删除"掉的记录会在下一次合并时原样复活 */
  const snapPurgedKeys = new Set((d.purged || []).map(p => p.entity + ' ' + p.id));
  DB.purged = (d.purged || []).concat((DB.purged || []).filter(p =>
    !snapPurgedKeys.has(p.entity + ' ' + p.id) && (p.by || '') !== ctx.by));
  rebuildIndex();
  await Repo.persist(DB);
  if ($('#modal-overlay').classList.contains('show')) closeModal();
  renderShell(); renderPage();
  if (ctx.skipped.length) {
    const who = uniq(ctx.skipped.filter(Boolean));
    showSnack(`已撤销；其中 ${ctx.skipped.length} 处因为 ${who.join('、')} 随后也改过，保留了他们的版本没有回退`, { priority: true });
  } else {
    hideSnack();
  }
}

/* =============================================================
   8. 查询：过滤 / 排序 / 分面
   ============================================================= */
// 负责人/牵头人 与 参与人/协同人员 合并成一个"人员"筛选：谁负责或参与这条，都算这个人的
const PERSON_FIELDS = { task: ['owner', 'assignees'], work: ['owner', 'collaborators'] };
function personUnion(entity, rec) {
  const keys = PERSON_FIELDS[entity]; if (!keys) return [];
  const out = [];
  keys.forEach(k => { const v = rec[k]; if (Array.isArray(v)) out.push(...v.filter(Boolean)); else if (v) out.push(v); });
  return uniq(out);
}
function matchFilters(entity, rec, filters) {
  for (const [k, sel] of Object.entries(filters || {})) {
    if (!sel) continue;
    if (k === '_person') {
      const people = personUnion(entity, rec);
      if (sel === '__empty__') { if (people.length) return false; }
      else if (!people.includes(sel)) return false;
      continue;
    }
    const f = fieldDef(entity, k);
    if (!f) continue;
    const vals = values(entity, rec, f);
    if (sel === '__empty__') { if (vals.length) return false; }
    else if (!vals.includes(sel)) return false;
  }
  return true;
}
function query(entity, opt) {
  const q = (opt.search || '').trim().toLowerCase();
  const rows = (opt.pool || coll(entity)).filter(r => {
    if (!matchFilters(entity, r, opt.filters)) return false;
    if (q && !searchText(entity, r).includes(q)) return false;
    return true;
  });
  if (opt.sortKey) {
    const dir = opt.sortDir || 1;
    const f = fieldDef(entity, opt.sortKey);
    rows.sort((a, b) => {
      const va = sortValue(entity, a, opt.sortKey), vb = sortValue(entity, b, opt.sortKey);
      if (f && f.type === 'date') {           // 无日期的排最前，便于补录
        if (!va && !vb) return (b.created_at || '').localeCompare(a.created_at || '');
        if (!va) return -1;
        if (!vb) return 1;
      }
      if (va < vb) return -dir;
      if (va > vb) return dir;
      return 0;
    });
  }
  return rows;
}
/* 分面统计口径与当前视图一致，但不受其它分面影响 */
function facet(entity, f, rows) {
  const cnt = new Map();
  let empty = 0;
  rows.forEach(r => {
    const vals = values(entity, r, f);
    if (!vals.length) { empty++; return; }
    vals.forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1));
  });
  let items;
  if (f.options) items = f.options.map(o => ({ value: o.v, label: o.label, color: o.color, count: cnt.get(o.v) || 0 }));
  else if (f.type === 'ref' && f.ref === 'duty') // 所属职责按职责编号顺序排列，不按数量
    items = [...cnt.entries()]
      .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
      .map(([v, n]) => ({ value: v, label: label(entity, f, v), count: n }));
  else items = [...cnt.entries()]
    .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh'))
    .map(([v, n]) => ({ value: v, label: label(entity, f, v), count: n }));
  items.push({ value: '__empty__', label: '（空）', count: empty, isEmpty: true });
  return items;
}
function optionsOf(entity, f, rec) {
  if (f.type === 'ref') {
    let list = f.refScope && rec ? f.refScope(rec) : coll(f.ref).filter(r => !r.deleted_at);
    if (f.ref === 'work') list = list.filter(w => inYear(w));
    const rs = schema(f.ref);
    return list.map(r => ({ v: r[rs.pk], label: (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '') }));
  }
  if (f.type === 'person' || f.type === 'persons') return allPeople().map(p => ({ v: p, label: p }));
  if (f.options) return f.options.map(o => ({ v: o.v, label: o.label }));
  const cnt = new Map();
  coll(entity).forEach(r => values(entity, r, f).forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1)));
  return [...cnt.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh'))
    .map(([v]) => ({ v, label: v }));
}
