/* =============================================================
   16. 工作台
   ============================================================= */
let dashFocus = 'overdue';           // 「需要关注」面板当前分段

function daysFromToday(d) {
  return Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}
function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return iso.slice(0, 10);
}

function renderDashboard() {
  const tasks = visibleTasks().filter(t => !t.deleted_at);
  const works = visibleWorks();
  const me = DB.settings.me;
  const today = todayStr();

  const open    = tasks.filter(isOpen);
  const overdue = tasks.filter(isOverdue).sort((a, b) => (a.plan_date || '').localeCompare(b.plan_date || ''));
  const dueToday= tasks.filter(t => isOpen(t) && t.plan_date === today);
  const week    = tasks.filter(t => isOpen(t) && t.plan_date && t.plan_date >= today && t.plan_date <= endOfWeek());
  const noOwner = tasks.filter(t => isOpen(t) && !t.owner);
  const monthDone = tasks.filter(t => t.status === 'done' && (t.actual_date || '').slice(0, 7) === today.slice(0, 7));
  const mineOpen = tasks.filter(t => isMine(t) && isOpen(t));

  const card = (k, v, cls, view) =>
    `<div class="card${view ? ' clickable' : ''}"${view ? ` data-act="goto-view" data-page="tasks" data-view="${view}"` : ''}>
       <div class="k">${k}</div><div class="v ${cls || ''}">${v}</div></div>`;

  /* ---------- ① 需要关注：分段列表 ---------- */
  const FOCUS = {
    overdue: { label: '逾期',     rows: overdue,  view: 'overdue' },
    today:   { label: '今日到期', rows: dueToday, view: 'today' },
    week:    { label: '本周到期', rows: week,     view: 'week' },
    noowner: { label: '未指派',   rows: noOwner,  view: 'all' },
  };
  if (!FOCUS[dashFocus] || !FOCUS[dashFocus].rows.length) {
    dashFocus = Object.keys(FOCUS).find(k => FOCUS[k].rows.length) || 'overdue';
  }
  const focus = FOCUS[dashFocus];
  const seg = Object.entries(FOCUS).map(([k, v]) =>
    `<span class="s${dashFocus === k ? ' on' : ''}" data-act="dash-focus" data-k="${k}">${v.label}<span class="c">${v.rows.length}</span></span>`).join('');

  const focusList = focus.rows.length
    ? `<div class="mini-list">${focus.rows.slice(0, 10).map(t => `
        <div class="li" data-act="focus-task" data-id="${t.id}" title="${esc(t.title)}">
          <span class="d ${dateClass(t.plan_date)}">${esc(t.plan_date ? fmtDate(t.plan_date) : '无日期')}</span>
          <span class="t">${esc(t.title)}</span>
          <span class="p">${esc(workName(t.work))} · ${esc(t.owner || '未指派')}</span></div>`).join('')}
       ${focus.rows.length > 10 ? `<div class="empty-mini">还有 ${focus.rows.length - 10} 条…</div>` : ''}</div>`
    : `<div class="empty-mini">没有${focus.label}的任务 👍</div>`;

  /* ---------- ② 里程碑时间线 ---------- */
  const msAll = DB.milestones.filter(m => !m.deleted_at && m.plan_date &&
                                          works.some(w => w.id === m.work));
  const msShow = msAll.filter(m => m.status !== 'done' || daysFromToday(m.plan_date) >= -14)
    .sort((a, b) => a.plan_date.localeCompare(b.plan_date)).slice(0, 10);

  let timeline = '<div class="empty-mini">暂无里程碑，可在「工作」页为工作添加</div>';
  if (msShow.length) {
    // 时间轴范围：覆盖全部待显示里程碑并留边距，最短 30 天
    const offs = msShow.map(m => daysFromToday(m.plan_date));
    let lo = Math.min(0, ...offs) - 3, hi = Math.max(...offs) + 3;
    if (hi - lo < 30) hi = lo + 30;
    const pct = d => ((d - lo) / (hi - lo) * 100).toFixed(2) + '%';

    // 刻度：起止 + 每月 1 号
    const ticks = [];
    for (let d = lo; d <= hi; d++) {
      const ds = offsetDate(d);
      if (ds.endsWith('-01') || d === lo || d === hi) ticks.push({ d, label: fmtDate(ds).replace('今天', '今天') });
    }
    const rows = msShow.map(m => {
      const off = daysFromToday(m.plan_date);
      const cls = m.status === 'done' ? 'done' : off < 0 ? 'late' : off <= 7 ? 'soon' : 'norm';
      const state = m.status === 'done' ? '已完成' : off < 0 ? `逾期 ${-off} 天` : off === 0 ? '今天' : `还有 ${off} 天`;
      return `<div class="tl-row" data-act="ms-panel" data-id="${esc(m.work)}" title="${esc(m.name + ' · ' + workName(m.work) + ' · ' + m.plan_date + ' · ' + state)}">
        <span class="tl-name">${esc(m.name)} <span class="sub">${esc(workName(m.work))}</span></span>
        <span class="tl-track" style="--today:${pct(0)}"><span class="tl-dot ${cls}" style="left:${pct(off)}"></span></span>
        <span class="tl-date ${off < 0 && m.status !== 'done' ? 'due-overdue' : ''}">${esc(state)}</span></div>`;
    }).join('');
    timeline = `<div class="tl">
      <div class="tl-axis"><span class="tl-name" style="font-size:10px">里程碑</span>
        <span class="tl-ticks">${ticks.map(t => `<span class="tk" style="left:${pct(t.d)}">${esc(t.label)}</span>`).join('')}</span>
        <span class="tl-date" style="font-size:10px;color:var(--text3)">状态</span></div>
      ${rows}
      <div class="legend">
        <span><i style="background:var(--c-late)"></i>逾期</span>
        <span><i style="background:var(--c-soon)"></i>7天内</span>
        <span><i style="background:var(--c-doing)"></i>后续</span>
        <span><i style="background:var(--c-done)"></i>已完成</span>
        <span style="color:var(--accent)">│ 竖线为今天</span>
      </div></div>`;
  }

  /* ---------- ③ 各职责推进 ---------- */
  const dutyStat = DB.duties.filter(d => !d.deleted_at).map(d => {
    const codes = new Set(works.filter(w => w.duty === d.code).map(w => w.id));
    const ts = tasks.filter(t => codes.has(t.work));
    return {
      code: d.code, name: d.code + ' ' + d.name, total: ts.length,
      done: ts.filter(t => t.status === 'done').length,
      doing: ts.filter(t => t.status === 'doing' && !isOverdue(t)).length,
      late: ts.filter(isOverdue).length,
    };
  }).filter(x => x.total > 0).sort((a, b) => b.late - a.late || b.total - a.total);

  const bar = x => {
    const p = n => (n / x.total * 100).toFixed(1) + '%';
    return `<div class="bar-row clickable" data-act="duty-drill" data-code="${esc(x.code)}" title="${esc(x.name)}：共 ${x.total} 条，已完成 ${x.done}，进行中 ${x.doing}，逾期 ${x.late}">
      <span class="nm">${esc(x.name)}</span>
      <span class="track">
        <span class="seg seg-done" style="width:${p(x.done)}"></span>
        <span class="seg seg-doing" style="width:${p(x.doing)}"></span>
        <span class="seg seg-late" style="width:${p(x.late)}"></span>
      </span>
      <span class="num">${x.done}/${x.total}${x.late ? ` · 逾${x.late}` : ''}</span></div>`;
  };

  /* ---------- ④ 我的工作台 ---------- */
  const myPanel = me ? (() => {
    const myWorks = works.filter(w => w.owner === me);
    const myTasks = mineOpen.slice().sort((a, b) => (a.plan_date || '9999').localeCompare(b.plan_date || '9999'));
    return `<div class="hint" style="margin-bottom:6px">牵头 <b>${myWorks.length}</b> 项工作 · 在办 <b>${mineOpen.length}</b> 条任务 · 逾期 <b style="color:var(--overdue)">${mineOpen.filter(isOverdue).length}</b> 条</div>
      ${myTasks.length ? `<div class="mini-list">${myTasks.slice(0, 7).map(t => `
        <div class="li" data-act="focus-task" data-id="${t.id}" title="${esc(t.title)}">
          <span class="d ${dateClass(t.plan_date)}">${esc(t.plan_date ? fmtDate(t.plan_date) : '—')}</span>
          <span class="t">${esc(t.title)}</span></div>`).join('')}</div>` : '<div class="empty-mini">暂无在办任务</div>'}`;
  })() : `<div class="empty-mini">尚未设置本机使用者。<a href="#/data" style="color:var(--accent)">去「数据」页设置</a>后，这里会显示你牵头的工作和在办任务。</div>`;

  /* ---------- ⑤ 人员负荷 ---------- */
  const loadMap = new Map();
  tasks.forEach(t => {
    const who = t.owner || '（未指派）';
    if (!loadMap.has(who)) loadMap.set(who, { open: 0, late: 0, done: 0 });
    const e = loadMap.get(who);
    if (isOverdue(t)) e.late++;
    else if (isOpen(t)) e.open++;
    else if (t.status === 'done') e.done++;
  });
  const loads = [...loadMap.entries()].map(([nm, v]) => ({ nm, ...v, total: v.open + v.late + v.done }))
    .sort((a, b) => (b.open + b.late) - (a.open + a.late)).slice(0, 9);
  const maxLoad = Math.max(1, ...loads.map(l => l.total));
  const loadRows = loads.map(l => `
    <div class="load-row" data-act="filter-owner" data-owner="${esc(l.nm === '（未指派）' ? '__empty__' : l.nm)}"
         title="${esc(l.nm)}：在办 ${l.open}，逾期 ${l.late}，已完成 ${l.done}">
      <span class="nm">${esc(l.nm)}</span>
      <span class="track">
        <span class="seg seg-late" style="width:${l.late / maxLoad * 100}%"></span>
        <span class="seg seg-doing" style="width:${l.open / maxLoad * 100}%"></span>
        <span class="seg seg-done" style="width:${l.done / maxLoad * 100}%"></span>
      </span>
      <span class="num">${l.open + l.late} 在办</span></div>`).join('');

  /* ---------- ⑥ 最近动态 ---------- */
  const feed = tasks.slice().filter(t => t.updated_at)
    .sort((a, b) => b.updated_at.localeCompare(a.updated_at)).slice(0, 8);

  $('#page-dashboard').innerHTML = `<div class="pad">
    <div class="cards">
      ${card('未完成任务', open.length, '', 'all')}
      ${card('逾期', overdue.length, overdue.length ? 'warn' : '', 'overdue')}
      ${card('今日到期', dueToday.length, '', 'today')}
      ${card('本周到期', week.length, '', 'week')}
      ${card('本月完成', monthDone.length, 'ok', 'done')}
      ${card('我的在办', me ? mineOpen.length : '—', '', me ? 'mine' : '')}
    </div>

    <div class="dash-grid">
      <div class="dash-col">
        <div class="panel"><div class="panel-h"><span>⚠ 需要关注</span><span class="seg-ctrl">${seg}</span></div>
          <div class="panel-b">${focusList}</div></div>

        <div class="panel"><div class="panel-h"><span>◈ 里程碑时间线</span>
          <span class="hint">${msShow.length ? `显示 ${msShow.length} / ${msAll.length} 个` : ''}</span></div>
          <div class="panel-b">${timeline}</div></div>

        <div class="panel"><div class="panel-h"><span>▤ 各职责推进情况</span>
          <span class="hint">按逾期数排序 · 点击下钻</span></div>
          <div class="panel-b">
            ${dutyStat.length ? dutyStat.map(bar).join('') : '<div class="empty-mini">暂无数据</div>'}
            <div class="legend">
              <span><i style="background:var(--c-done)"></i>已完成</span>
              <span><i style="background:var(--c-doing)"></i>进行中</span>
              <span><i style="background:var(--c-late)"></i>逾期</span>
              <span><i style="background:var(--c-track)"></i>未开始</span>
            </div></div></div>
      </div>

      <div class="dash-col">
        <div class="panel"><div class="panel-h"><span>👤 我的工作台</span></div>
          <div class="panel-b">${myPanel}</div></div>

        <div class="panel"><div class="panel-h"><span>▥ 人员负荷</span>
          <span class="hint">点击筛选</span></div>
          <div class="panel-b">${loads.length ? loadRows : '<div class="empty-mini">暂无数据</div>'}
            <div class="legend">
              <span><i style="background:var(--c-late)"></i>逾期</span>
              <span><i style="background:var(--c-doing)"></i>在办</span>
              <span><i style="background:var(--c-done)"></i>已完成</span>
            </div></div></div>

        <div class="panel"><div class="panel-h"><span>🕘 最近动态</span></div>
          <div class="panel-b feed">${feed.length ? feed.map(t => `
            <div class="li" data-act="focus-task" data-id="${t.id}" title="${esc(t.title)}">
              <span class="who">${esc(t.updated_by || '—')}</span>
              <span class="what">${esc(t.title)}</span>
              <span class="when">${esc(relTime(t.updated_at))}</span></div>`).join('') : '<div class="empty-mini">暂无</div>'}</div></div>
      </div>
    </div>
  </div>`;
  $('#status-left').textContent = `${tasks.length} 条任务 · ${works.length} 项工作 · ${DB.duties.filter(d => !d.deleted_at).length} 项职责`;
}
function workName(code) { const w = byId('work', code); return w ? w.name : (code ? code + '?' : '未归属'); }

/* =============================================================
   17. 图表页（P4）
   ============================================================= */
let chartTab = 'person';
const CHART_TABS = [
  { key: 'person',   label: '按人' },
  { key: 'category', label: '按分类' },
  { key: 'time',     label: '按时间' },
  { key: 'gantt',    label: '里程碑甘特' },
];
const chartTableView = {};      // 每个图表是否切到表格视图

/* ---------- 统计 ---------- */
function bucketOf(t) {          // 任务归入哪一段
  if (isOverdue(t)) return 'late';
  if (t.status === 'done') return 'done';
  if (t.status === 'doing') return 'doing';
  if (t.status === 'hold') return 'hold';
  return 'todo';
}
function tally(list) {
  const c = { total: list.length, done: 0, doing: 0, late: 0, todo: 0, hold: 0 };
  list.forEach(t => { c[bucketOf(t)]++; });
  c.rate = c.total ? Math.round(c.done / c.total * 100) : 0;
  return c;
}
function statsByPerson(tasks) {
  const own = new Map(), join = new Map();
  tasks.forEach(t => {
    const o = t.owner || '（未指派）';
    if (!own.has(o)) own.set(o, []);
    own.get(o).push(t);
    (t.assignees || []).forEach(a => { if (!join.has(a)) join.set(a, []); join.get(a).push(t); });
  });
  const names = uniq([...own.keys(), ...join.keys()]);
  return names.map(nm => ({ name: nm, ...tally(own.get(nm) || []), join: (join.get(nm) || []).length }))
    .sort((a, b) => (b.late + b.doing + b.todo) - (a.late + a.doing + a.todo) || b.total - a.total);
}
function tasksOfDuty(tasks, code) {
  const codes = new Set(visibleWorks().filter(w => w.duty === code).map(w => w.id));
  return tasks.filter(t => codes.has(t.work));
}
function statsByDuty(tasks) {
  return DB.duties.filter(d => !d.deleted_at)
    .map(d => ({ code: d.code, name: d.code + ' ' + d.name, category: d.category, ...tally(tasksOfDuty(tasks, d.code)) }))
    .filter(x => x.total > 0);
}
function statsByCategory(tasks) {
  return CATEGORIES.map(c => {
    const codes = DB.duties.filter(d => !d.deleted_at && d.category === c.v).map(d => d.code);
    const list = [];
    codes.forEach(code => list.push(...tasksOfDuty(tasks, code)));
    return { key: c.v, name: c.label, color: c.color, ...tally(list) };
  }).filter(x => x.total > 0);
}
function monthKey(iso) { return (iso || '').slice(0, 7); }
function monthlySeries(tasks, n) {
  const months = [];
  const d = new Date();
  d.setDate(1);
  for (let i = n - 1; i >= 0; i--) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    months.push(`${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`);
  }
  return months.map(m => ({
    m,
    label: (+m.slice(5) === 1 ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月',
    added: tasks.filter(t => monthKey(t.created_at) === m).length,
    done: tasks.filter(t => t.status === 'done' && monthKey(t.actual_date) === m).length,
  }));
}
/* 到期分布：已逾期 + 未来 6 周 + 更远，按周聚合比按天更好读 */
function dueBuckets(tasks) {
  const open = tasks.filter(isOpen);
  const b = [{ label: '已逾期', cls: 'bar-late', n: open.filter(isOverdue).length }];
  for (let w = 0; w < 6; w++) {
    const from = offsetDate(w * 7), to = offsetDate(w * 7 + 6);
    b.push({
      label: w === 0 ? '本周内' : `${w * 7 + 1}-${w * 7 + 7}天`,
      cls: w === 0 ? 'bar-soon' : 'bar-norm',
      n: open.filter(t => t.plan_date && t.plan_date >= from && t.plan_date <= to).length,
    });
  }
  const far = offsetDate(42);
  b.push({ label: '更远', cls: 'bar-norm', n: open.filter(t => t.plan_date && t.plan_date > far).length });
  b.push({ label: '无日期', cls: 'bar-norm', n: open.filter(t => !t.plan_date).length });
  return b;
}

/* ---------- 通用绘制件 ---------- */
// 横向堆叠条（HTML 实现：文字是真实文本，天然响应式）
function hBar(name, c, max, attrs) {
  const p = n => (n / max * 100).toFixed(2) + '%';
  const tip = `${name}：共 ${c.total} 条 · 已完成 ${c.done} · 进行中 ${c.doing} · 逾期 ${c.late} · 未开始 ${c.todo}${c.hold ? ' · 挂起 ' + c.hold : ''}`;
  return `<div class="bar-row${attrs ? ' clickable' : ''}"${attrs || ''} title="${esc(tip)}">
    <span class="nm">${esc(name)}</span>
    <span class="track">
      <span class="seg seg-done" style="width:${p(c.done)}"></span>
      <span class="seg seg-doing" style="width:${p(c.doing)}"></span>
      <span class="seg seg-late" style="width:${p(c.late)}"></span>
    </span>
    <span class="num">${c.done}/${c.total} · ${c.rate}%</span></div>`;
}
const statusLegend = `<div class="legend">
  <span><i style="background:var(--c-done)"></i>已完成</span>
  <span><i style="background:var(--c-doing)"></i>进行中</span>
  <span><i style="background:var(--c-late)"></i>逾期</span>
  <span><i style="background:var(--c-track)"></i>未开始/挂起</span></div>`;

// 图表/表格切换头
function panelHead(title, id, note) {
  const isTable = chartTableView[id];
  return `<div class="panel-h"><span>${title}</span><span>
    ${note ? `<span class="hint" style="margin-right:8px">${note}</span>` : ''}
    <span class="toggle-view" data-act="chart-view" data-id="${id}">${isTable ? '看图表' : '看数据表'}</span></span></div>`;
}
function dataTable(headers, rows) {
  return `<table class="dtable"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
function chartWidth(fallback) {
  const el = $('#page-charts');
  const w = el ? el.clientWidth : 0;
  return Math.max(360, (w || fallback || 900) - 66);
}

/* ---------- 折线图（月度趋势） ---------- */
function lineChart(data, w) {
  const h = 210, padL = 34, padR = 12, padT = 12, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...data.map(d => Math.max(d.added, d.done)));
  const niceMax = Math.ceil(maxV / 5) * 5 || 5;
  const x = i => padL + (data.length === 1 ? iw / 2 : i / (data.length - 1) * iw);
  const y = v => padT + ih - v / niceMax * ih;
  const path = key => data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(' ');

  let g = '';
  for (let i = 0; i <= 5; i++) {
    const v = niceMax / 5 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const xlab = data.map((d, i) =>
    (data.length <= 12 || i % 2 === 0)
      ? `<text class="ax-text" x="${x(i)}" y="${h - 8}" text-anchor="middle">${esc(d.label)}</text>` : '').join('');
  // 圆点 = 新增，方块 = 完成（二次编码，蓝绿在蓝黄色盲下接近）
  const mkNew = data.map((d, i) => `<circle class="mk mk-new" cx="${x(i).toFixed(1)}" cy="${y(d.added).toFixed(1)}" r="3.5"><title>${esc(d.label)} 新增 ${d.added}</title></circle>`).join('');
  const mkDone = data.map((d, i) => `<rect class="mk mk-done" x="${(x(i) - 3.5).toFixed(1)}" y="${(y(d.done) - 3.5).toFixed(1)}" width="7" height="7"><title>${esc(d.label)} 完成 ${d.done}</title></rect>`).join('');
  const hit = data.map((d, i) => `<rect x="${(x(i) - iw / data.length / 2).toFixed(1)}" y="${padT}" width="${(iw / data.length).toFixed(1)}" height="${ih}" fill="transparent"
      data-tip="${esc(d.label)}|${d.added}|${d.done}" data-cx="${x(i).toFixed(1)}"/>`).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="月度新增与完成任务数趋势">
    ${g}
    <line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>
    ${xlab}
    <path class="ln ln-new" d="${path('added')}"/>
    <path class="ln ln-done" d="${path('done')}"/>
    ${mkNew}${mkDone}
    <line class="crosshair" id="ch-line" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" style="display:none"/>
    <g id="ch-hits">${hit}</g>
  </svg>`;
}

/* ---------- 柱状图（到期分布） ---------- */
function barChart(buckets, w) {
  const h = 190, padL = 30, padR = 10, padT = 12, padB = 40;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...buckets.map(b => b.n));
  const niceMax = Math.ceil(maxV / 4) * 4 || 4;
  const bw = iw / buckets.length;
  const y = v => padT + ih - v / niceMax * ih;

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax / 4 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const bars = buckets.map((b, i) => {
    const bx = padL + i * bw + bw * 0.18, bwid = bw * 0.64;
    const bh = Math.max(b.n ? 2 : 0, ih - (y(b.n) - padT));
    return `<g><rect class="${b.cls}" x="${bx.toFixed(1)}" y="${(padT + ih - bh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${bh.toFixed(1)}" rx="3">
        <title>${esc(b.label)}：${b.n} 条</title></rect>
      ${b.n ? `<text class="ax-text val" x="${(bx + bwid / 2).toFixed(1)}" y="${(padT + ih - bh - 4).toFixed(1)}" text-anchor="middle">${b.n}</text>` : ''}
      <text class="ax-text" x="${(bx + bwid / 2).toFixed(1)}" y="${h - 22}" text-anchor="middle">${esc(b.label)}</text></g>`;
  }).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="未完成任务的到期分布">
    ${g}<line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>${bars}</svg>`;
}

/* ---------- 甘特 ---------- */
function ganttPanel(tasks) {
  const works = visibleWorks();
  const rows = works.map(w => ({
    w, ms: DB.milestones.filter(m => m.work === w.id && !m.deleted_at && m.plan_date)
      .sort((a, b) => a.plan_date.localeCompare(b.plan_date)),
  })).filter(r => r.ms.length);

  if (!rows.length) return `<div class="empty-mini">还没有里程碑。到「工作」页点某项工作的 ◈ 按钮即可添加。</div>`;

  const offs = rows.flatMap(r => r.ms.map(m => daysFromToday(m.plan_date)));
  let lo = Math.min(0, ...offs) - 5, hi = Math.max(...offs) + 5;
  if (hi - lo < 60) hi = lo + 60;
  const pct = d => ((d - lo) / (hi - lo) * 100).toFixed(2) + '%';

  const ticks = [];
  for (let d = lo; d <= hi; d++) {
    const ds = offsetDate(d);
    if (ds.endsWith('-01')) ticks.push({ d, label: (+ds.slice(5, 7)) + '月' });
  }

  const body = rows.map(({ w, ms }) => {
    const a = daysFromToday(ms[0].plan_date), b = daysFromToday(ms[ms.length - 1].plan_date);
    const done = ms.filter(m => m.status === 'done').length;
    const pts = ms.map(m => {
      const off = daysFromToday(m.plan_date);
      const cls = m.status === 'done' ? 'done' : off < 0 ? 'late' : off <= 7 ? 'soon' : 'norm';
      const state = m.status === 'done' ? '已完成' : off < 0 ? `逾期 ${-off} 天` : off === 0 ? '今天' : `还有 ${off} 天`;
      return `<span class="gantt-pt ${cls}" style="left:${pct(off)}" title="${esc(m.name + ' · ' + m.plan_date + ' · ' + state)}"></span>`;
    }).join('');
    return `<div class="gantt-row">
      <span class="gantt-name" data-act="ms-panel" data-id="${esc(w.id)}" title="${esc(w.code + ' ' + w.name)}">
        <span class="code">${esc(w.code)}</span>${esc(w.name)}</span>
      <span class="gantt-track" style="--today:${pct(0)}">
        <span class="gantt-span" style="left:${pct(a)};width:${(((b - a) / (hi - lo)) * 100).toFixed(2)}%"></span>${pts}</span>
      <span class="gantt-cnt">${done}/${ms.length}</span></div>`;
  }).join('');

  return `<div class="tl">

/* 折线图十字准线与浮动提示 */
function bindTrendHover() {
  const wrap = $('#trend-wrap');
  if (!wrap) return;
  const svg = wrap.querySelector('svg'), line = wrap.querySelector('#ch-line'), tip = wrap.querySelector('#chart-tip');
  if (!svg || !line || !tip) return;
  svg.addEventListener('mousemove', e => {
    const hit = e.target.closest('[data-tip]');
    if (!hit) return;
    const [label, added, done] = hit.dataset.tip.split('|');
    const cx = +hit.dataset.cx;
    line.setAttribute('x1', cx); line.setAttribute('x2', cx);
    line.style.display = '';
    tip.innerHTML = `<b>${esc(label)}</b><br><i style="background:var(--c-doing);border-radius:50%"></i>新增 ${esc(added)}<br><i style="background:var(--c-done)"></i>完成 ${esc(done)}`;
    tip.classList.add('show');
    const r = wrap.getBoundingClientRect();
    tip.style.left = Math.min(cx + 10, r.width - tip.offsetWidth - 6) + 'px';
    tip.style.top = '14px';
  });
  svg.addEventListener('mouseleave', () => { line.style.display = 'none'; tip.classList.remove('show'); });
}

// Excel 会把 0101 存成数字 101，输入/导入时统一补齐为 4 位
function padCode(s) {
  const v = String(s == null ? '' : s).trim();
  return /^\d{3}$/.test(v) ? '0' + v : v;
}
function parseQuickInput(raw) {
  const t = blank('task', { status: 'todo', priority: '2', progress: 0 });
  const parts = [];
  for (const tok of raw.trim().split(/\s+/)) {
    if (tok.startsWith('$') && tok.length > 1) {
      const key = tok.slice(1), code = padCode(key);
      // 先按编号在当前年度内匹配，再退回按名称模糊匹配
      const byCode = visibleWorks().find(x => x.code === code);
      if (byCode) { t.work = byCode.id; continue; }
      const w = visibleWorks().find(x => x.name.includes(key));
      if (w) { t.work = w.id; continue; }
      continue;
    }
    if (tok.startsWith('@') && tok.length > 1) { t.assignees.push(tok.slice(1)); continue; }
    if (tok.startsWith('~') && tok.length > 1) { const d = parseDue(tok.slice(1)); if (d) { t.plan_date = d; continue; } }
    if (/^!([123])$/.test(tok)) { t.priority = tok[1]; continue; }
    const d = parseDue(tok);
    if (d && !t.plan_date) { t.plan_date = d; continue; }
    parts.push(tok);
  }
  t.title = parts.join(' ') || '未命名任务';
  if (!t.owner && t.work) { const w = byId('work', t.work); if (w) t.owner = w.owner; }   // 负责人默认取工作牵头人
  return t;
}

  undo: () => undoLast(),

  'task-view': d => { UI.tasks.view = d.view; UI.tasks.sel.clear(); $('#tasks-scroll').scrollTop = 0; renderShell(); renderPage(); },
  'task-filter': d => { UI.tasks.filters[d.field] = d.val; UI.tasks.sel.clear(); $('#tasks-scroll').scrollTop = 0; renderShell(); renderPage(); },

  /* --- 两级树筛选 --- */
  'tree-pick': d => {
    const st = UI.tasks;
    st.filters._duty = d.duty || '';
    st.filters.work = d.work || '';
    if (d.duty) st.expanded.add(d.duty);
    st.sel.clear();
    $('#tasks-scroll').scrollTop = 0;
    renderShell(); renderPage();
  },
  'tree-toggle': (d, el, e) => {
    e.stopPropagation();
    const st = UI.tasks;
    if (st.expanded.has(d.duty)) st.expanded.delete(d.duty); else st.expanded.add(d.duty);
    renderSidebar();
  },

  /* --- 批量选择 --- */
  'sel-row': (d, el, e) => {
    const st = UI.tasks;
    const idx = _taskRows.findIndex(t => t.id === d.id);
    if (e && e.shiftKey && st.lastSelIdx >= 0 && idx >= 0) {   // Shift 范围选择
      const [a, b] = [Math.min(st.lastSelIdx, idx), Math.max(st.lastSelIdx, idx)];
      for (let i = a; i <= b; i++) st.sel.add(_taskRows[i].id);
    } else {
      if (st.sel.has(d.id)) st.sel.delete(d.id); else st.sel.add(d.id);
    }
    st.lastSelIdx = idx;
    renderTaskViewport(); renderBatchBar();
    $('#status-left').textContent = `${_taskRows.length} 条任务` + (st.sel.size ? ` · 已选 ${st.sel.size}` : '');
  },
  'sel-all': () => {
    const st = UI.tasks;
    if (st.sel.size === _taskRows.length) st.sel.clear();
    else _taskRows.forEach(t => st.sel.add(t.id));
    renderTasks();
  },
  'sel-clear': () => { UI.tasks.sel.clear(); renderTasks(); },
  batch: d => openBatchEdit(d.field),
  'batch-delete': () => {
    const ids = [...UI.tasks.sel];
    confirmModal('批量删除', `将删除选中的 ${ids.length} 条任务，可在「已删除」视图中恢复。`, '删除', async () => {
      snapshot();
      await Repo.bulk(() => { ids.forEach(id => softDelete('task', id)); });
      UI.tasks.sel.clear();
      renderShell(); renderPage();
      showSnack(`已删除 ${ids.length} 条`);
    }, true);
  },

  'col-config': () => openColConfig(),
  'task-detail': d => openTaskDetail(d.id),

  /* --- 图表页 --- */
  'chart-tab': d => { chartTab = d.k; renderCharts(); },
  'chart-view': d => { chartTableView[d.id] = !chartTableView[d.id]; renderCharts(); },

  /* --- 工作台 --- */
  'dash-focus': d => { dashFocus = d.k; renderDashboard(); },
  'filter-owner': d => {
    UI.tasks.view = 'all';
    UI.tasks.filters = { owner: d.owner };
    UI.tasks.search = '';
    goto('tasks');
  },

  'work-filter': d => { UI.works.filters[d.field] = d.val; renderPage(); },
  'duty-filter': d => { UI.duties.filters[d.field] = d.val; renderPage(); },

  'work-drill': d => { UI.tasks.view = 'all'; UI.tasks.filters = { work: d.id }; UI.tasks.search = ''; goto('tasks'); },
  'duty-drill': d => { UI.works.filters = { duty: d.code }; goto('works'); },
  'focus-task': d => {
    const t = byId('task', d.id); if (!t) return;
    UI.tasks.view = 'all'; UI.tasks.filters = {}; UI.tasks.search = t.title; goto('tasks');
  },

  'task-done': async (d, el) => {
    const t = byId('task', d.id); if (!t) return;
    snapshot();
    t.status = el.checked ? 'done' : 'todo';
    t.actual_date = el.checked ? todayStr() : '';
    if (el.checked) t.progress = 100;
    await Repo.upsert('task', t);
    renderTasks(); renderSidebar();
    if (el.checked) showSnack(`已完成：${t.title}`);
  },
  cycle: async d => {
    const f = fieldDef(d.entity, d.field), r = byId(d.entity, d.id);
    if (!f || !r) return;
    snapshot();
    const vals = f.options.map(o => o.v);
    r[d.field] = vals[(vals.indexOf(String(r[d.field])) + 1) % vals.length];
    if (d.entity === 'task' && d.field === 'status') {
      if (r.status === 'done') { r.actual_date = r.actual_date || todayStr(); r.progress = 100; }
      else r.actual_date = '';
    }
    if (d.entity === 'milestone' && d.field === 'status' && r.status === 'done' && !r.actual_date) r.actual_date = todayStr();
    await Repo.upsert(d.entity, r);
    afterEdit(d.entity, d.id, d.field);
  },
  'task-dup': async d => {
    const t = byId('task', d.id); if (!t) return;
    snapshot();
    const c = clone(t);
    c.id = uid('t'); c.status = 'todo'; c.actual_date = ''; c.progress = 0;
    delete c.created_at; delete c.rev; delete c.deleted_at;
    await Repo.upsert('task', c);

    showSnack(`已复制：${c.title}`);

  'task-del': d => {
    const t = byId('task', d.id); if (!t) return;

      renderTasks(); renderSidebar(); showSnack('已删除');
    }, true);
  },
  'task-restore': async d => {
    const t = undelete('task', d.id); if (!t) return;
    snapshot(); await Repo.upsert('task', t);
    renderTasks(); renderSidebar(); showSnack('已恢复');
  },
  'task-purge': d => {
    const t = byId('task', d.id); if (!t) return;
    confirmModal('彻底删除', `彻底删除「${t.title}」？（Ctrl+Z 仍可撤销）`, '彻底删除', async () => {
      snapshot(); await Repo.removeHard('task', d.id);

    }, true);
  },

  'work-new': () => openWorkForm(),

// 编辑后：判断只刷一行还是整页重绘
function afterEdit(entity, id, fieldKey) {
  if (entity === 'task' && currentPage === 'tasks') {
    const st = UI.tasks;
    const full = fieldKey === st.sortKey || fieldKey === 'status' || st.filters[fieldKey] || fieldKey === 'work';
    if (full) renderTasks(); else refreshTaskRow(id);
    renderSidebar();
  } else {
    renderPage();
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('.col-resize')) return;
  const el = e.target.closest('[data-act]');
  if (el) {
    if (el.dataset.act !== 'task-done') {
      const fn = ACTIONS[el.dataset.act];
      if (fn) { fn(el.dataset, el, e); return; }
    } else return;
  }
  const th = e.target.closest('th[data-sort]');
  if (th && UI[currentPage]) {
    const st = UI[currentPage], key = th.dataset.sort;
    if (st.sortKey === key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
    renderPage();
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act="task-done"]');
  if (el) ACTIONS['task-done'](el.dataset, el, e);
});
document.addEventListener('dblclick', e => {
  const el = e.target.closest('[data-dblact]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.dblact];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('mousedown', e => {
  const h = e.target.closest('.col-resize');
  if (h) startResize(e, h.dataset.resize, h);
});

function startResize(e, key, handle) {
  e.preventDefault(); e.stopPropagation();
  const st = UI[currentPage]; if (!st) return;
  const startX = e.clientX, startW = st.widths[key] || 90;
  handle.classList.add('resizing');
  const th = handle.closest('th');
  const onMove = ev => {
    const w = Math.max(40, startW + (ev.clientX - startX));
    st.widths[key] = w;
    if (th) th.style.width = w + 'px';
  };
  const onUp = () => {
    handle.classList.remove('resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    persistUI();
    renderPage();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* =============================================================
   21. 编辑器
   ============================================================= */
let _activeEdit = null;

function openEditor(entity, id, fieldKey, td) {
  const f = fieldDef(entity, fieldKey);
  if (!f || f.readonly) return;
  if (['single', 'multi', 'person', 'persons', 'enum', 'ref'].includes(f.type)) return openSelectPopup(entity, id, f, td);
  if (f.type === 'lines') return openLinesEditor(entity, id, fieldKey);
  if (f.type === 'date') return openDatePicker(entity, id, fieldKey, td);
  openInlineEdit(entity, id, f, td);
}

function openInlineEdit(entity, id, f, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const original = (r[f.key] === '' || r[f.key] == null) ? '' : String(r[f.key]);
  const input = document.createElement('input');
  input.className = 'inline-input';
  input.value = original;
  td.innerHTML = ''; td.appendChild(input);
  input.focus(); input.select();

  let done = false;
  const finish = async cancel => {
    if (done) return; done = true; _activeEdit = null;
    let val = input.value.trim();
    if (cancel || val === original) { rerenderRow(entity, id); return; }
    if (f.type === 'num') {
      val = val === '' ? '' : Math.max(0, Number(val) || 0);
      if (f.key === 'progress') val = Math.min(100, val);
    }
    snapshot();
    r[f.key] = val;
    await Repo.upsert(entity, r);
    afterEdit(entity, id, f.key);
  };
  _activeEdit = { commit: () => finish(false) };
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); finish(false); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(true); }
  });
  input.addEventListener('blur', () => setTimeout(() => finish(false), 80));
}
function commitActiveEdit() { if (_activeEdit) { const c = _activeEdit; _activeEdit = null; c.commit(); } }
function rerenderRow(entity, id) {
  if (entity === 'task' && currentPage === 'tasks') refreshTaskRow(id); else renderPage();
}

/* ---- 选择弹层（single/multi/person/persons/enum/ref 通用） ---- */
let _sp = null, spCloseListener = null;

function openSelectPopup(entity, id, f, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const multi = f.type === 'multi' || f.type === 'persons';
  const allowNew = !['enum', 'ref'].includes(f.type);
  const cur = values(entity, r, f);
  _sp = { entity, id, field: f.key, order: [...cur], multi, allowNew };

  const opts = optionsOf(entity, f, r);
  const popup = $('#select-popup');
  let html = `<div class="sp-header">${esc(f.label)}${multi ? '（可多选）' : ''}</div>`;
  if (allowNew || opts.length > 8) {
    html += `<div style="padding:0 2px 5px"><input id="sp-manual-input" type="text" class="inline-input" style="height:24px;font-size:12px" placeholder="${allowNew ? '筛选或输入新值…' : '筛选…'}" autocomplete="off"></div>`;
  }
  html += `<div id="sp-list">`;
  if (!multi) {
    if (allowNew) html += `<div class="sp-item sp-addnew" id="sp-addnew" data-act="sp-add" style="display:none"></div>`;
    if (!f.options) html += `<div class="sp-item${!cur.length ? ' selected' : ''}" data-act="sp-pick" data-val="">（无）</div>`;
    opts.forEach(o => {
      html += `<div class="sp-item${cur[0] === o.v ? ' selected' : ''}" data-act="sp-pick" data-val="${esc(o.v)}" data-opt="${esc(o.label)}" title="${esc(o.label)}">${esc(o.label)}</div>`;
    });
    if (f.type === 'ref' && !opts.length) html += `<div class="sp-item" style="color:var(--text3);cursor:default">（无可选项${f.ref === 'milestone' ? '，请先在工作页添加里程碑' : ''}）</div>`;
  } else {
    html += `<div class="sp-item"><input type="checkbox" id="sp-none"${!cur.length ? ' checked' : ''}><label for="sp-none">（无）</label></div>`;
    opts.forEach((o, i) => {
      html += `<div class="sp-item" data-opt="${esc(o.label)}"><input type="checkbox" class="sp-cb" id="sp-o${i}" value="${esc(o.v)}"${cur.includes(o.v) ? ' checked' : ''}><label for="sp-o${i}">${esc(o.label)}</label></div>`;
    });
  }
  html += `</div>`;
  if (multi) html += `<button class="sp-confirm" data-act="sp-commit">确定</button>`;
  popup.innerHTML = html;

  const rect = td.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.classList.add('show');
  requestAnimationFrame(() => {
    const h = popup.offsetHeight;
    if (rect.bottom + 2 + h > window.innerHeight - 8) popup.style.top = Math.max(8, rect.top - h - 2) + 'px';
  });

  const inp = $('#sp-manual-input');
  if (inp) {
    inp.addEventListener('input', () => spFilterList());
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); spAddFromInput(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeSelectPopup(); }
    });
    setTimeout(() => inp.focus(), 50);
  }
  popup.addEventListener('change', ev => {
    if (ev.target.classList.contains('sp-cb')) {
      if (ev.target.checked) {
        const n = $('#sp-none'); if (n) n.checked = false;
        if (!_sp.order.includes(ev.target.value)) _sp.order.push(ev.target.value);
      } else _sp.order = _sp.order.filter(v => v !== ev.target.value);
    } else if (ev.target.id === 'sp-none' && ev.target.checked) {
      popup.querySelectorAll('.sp-cb').forEach(cb => { cb.checked = false; });
      _sp.order = [];
    }
  });

  if (spCloseListener) document.removeEventListener('mousedown', spCloseListener);
  spCloseListener = ev => { if (!popup.contains(ev.target) && !td.contains(ev.target)) closeSelectPopup(); };
  setTimeout(() => document.addEventListener('mousedown', spCloseListener), 0);
}

function spFilterList() {
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(), q = raw.toLowerCase();
  $$('#sp-list [data-opt]').forEach(el => {
    el.style.display = (!q || (el.dataset.opt || '').toLowerCase().includes(q)) ? '' : 'none';
  });
  const add = $('#sp-addnew');
  if (add && _sp && _sp.allowNew) {
    const exists = $$('#sp-list [data-opt]').some(el => el.dataset.opt === raw);
    if (raw && !exists) { add.textContent = `+ 新增「${raw}」`; add.style.display = ''; }
    else add.style.display = 'none';
  }
}
function splitNames(raw) { return raw.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean); }

function spAddFromInput() {
  if (!_sp) return;
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(); if (!raw) return;
  if (!_sp.allowNew) {                       // enum / ref 不允许新增：回车选中首个可见项
    const first = $$('#sp-list [data-act="sp-pick"]').find(el => el.style.display !== 'none' && el.dataset.opt);
    if (first) spCommitSingle(first.dataset.val);
    return;
  }
  if (_sp.multi) {
    splitNames(raw).forEach(n => { if (!_sp.order.includes(n)) _sp.order.push(n); });
    inp.value = '';
    spCommitMulti();
  } else spCommitSingle(raw);
}

async function spCommitSingle(val) {
  if (!_sp) return;
  const { entity, id, field } = _sp;
  closeSelectPopup();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  r[field] = val;
  if (entity === 'task' && field === 'work') {
    // 换了所属工作，原里程碑可能不属于新工作，清掉避免脏引用
    const ms = byId('milestone', r.milestone);
    if (ms && ms.work !== val) r.milestone = '';
    if (!r.owner) { const w = byId('work', val); if (w) r.owner = w.owner; }
  }
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}

async function spCommitMulti() {
  if (!_sp) return;
  const { entity, id, field, order } = _sp;
  const popup = $('#select-popup');
  const checked = new Set([...popup.querySelectorAll('.sp-cb:checked')].map(cb => cb.value));
  const inDom = new Set([...popup.querySelectorAll('.sp-cb')].map(cb => cb.value));
  // order 里既有勾选框中的项，也有刚输入新增、尚未在列表中的项，后者一律保留
  const vals = order.filter(v => checked.has(v) || !inDom.has(v));
  closeSelectPopup();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  r[field] = vals;
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}

function closeSelectPopup() {
  const p = $('#select-popup');
  p.classList.remove('show'); p.innerHTML = ''; _sp = null;
  if (spCloseListener) { document.removeEventListener('mousedown', spCloseListener); spCloseListener = null; }
}

/* ---- 日期选择器 ---- */
let _dp = null, dpCloseListener = null;

function openDatePicker(entity, id, fieldKey, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const ref = r[fieldKey] ? new Date(r[fieldKey] + 'T00:00:00') : new Date();
  _dp = { entity, id, field: fieldKey, year: ref.getFullYear(), month: ref.getMonth() };
  renderDpCalendar();
  const wrap = $('#date-picker-wrap');
  const rect = td.getBoundingClientRect();
  wrap.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
  wrap.style.top = (rect.bottom + 4) + 'px';
  wrap.classList.add('show');
  requestAnimationFrame(() => {
    const h = wrap.offsetHeight;
    if (rect.bottom + 4 + h > window.innerHeight - 8) wrap.style.top = Math.max(8, rect.top - h - 4) + 'px';
  });
  if (dpCloseListener) document.removeEventListener('mousedown', dpCloseListener);
  dpCloseListener = ev => { if (!wrap.contains(ev.target) && !td.contains(ev.target)) dpClose(); };
  setTimeout(() => document.addEventListener('mousedown', dpCloseListener), 0);
}
function renderDpCalendar() {
  if (!_dp) return;
  const r = byId(_dp.entity, _dp.id);
  const sel = r ? (r[_dp.field] || '') : '';
  const today = todayStr();
  const firstDow = new Date(_dp.year, _dp.month, 1).getDay();
  const days = new Date(_dp.year, _dp.month + 1, 0).getDate();
  let html = `<div class="dp-cal-nav">
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="-1">&#8249;</button>
      <span class="dp-cal-title">${_dp.year}年${_dp.month + 1}月</span>
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="1">&#8250;</button>
    </div><div class="dp-cal-grid">
    ${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="dp-cal-dow">${d}</div>`).join('')}`;
  for (let i = 0; i < firstDow; i++) html += '<div class="dp-cal-day is-empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${_dp.year}-${String(_dp.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    let cls = 'dp-cal-day';
    if (ds === today) cls += ' is-today';
    if (ds === sel) cls += ' is-selected';
    html += `<div class="${cls}" data-act="dp-pick" data-date="${ds}">${d}</div>`;
  }
  $('#dp-calendar').innerHTML = html + '</div>';
}
function dpNav(dir) {
  if (!_dp) return;
  _dp.month += dir;
  if (_dp.month > 11) { _dp.month = 0; _dp.year++; }
  if (_dp.month < 0) { _dp.month = 11; _dp.year--; }
  renderDpCalendar();
}
async function dpCommit(date) {
  if (!_dp) return;
  const { entity, id, field } = _dp;
  dpClose();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  r[field] = date;
  if (entity === 'task' && field === 'actual_date' && date && r.status !== 'done') { r.status = 'done'; r.progress = 100; }
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}
function dpClose() {
  $('#date-picker-wrap').classList.remove('show'); _dp = null;
  if (dpCloseListener) { document.removeEventListener('mousedown', dpCloseListener); dpCloseListener = null; }
}
function closeFloating() { dpClose(); if ($('#select-popup').classList.contains('show')) closeSelectPopup(); }

/* ---- 多行文本编辑器 ---- */
function openLinesEditor(entity, id, fieldKey) {

    <textarea class="modal-textarea" id="lines-ta">${esc((r[fieldKey] || []).join('\n'))}</textarea>`, '保存', async () => {

    r[fieldKey] = $('#lines-ta').value.split('\n').map(s => s.trim()).filter(Boolean);
    await Repo.upsert(entity, r);

}

/* =============================================================
   21b. 批量编辑 / 列配置 / 任务详情
   ============================================================= */
// 按字段类型生成一个录入控件（批量编辑与任务详情共用）
function fieldControl(f, val, idPrefix) {
  const id = idPrefix + f.key;
  switch (f.type) {
    case 'enum':
      return `<select id="${id}">${f.options.map(o => `<option value="${o.v}"${String(val) === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    case 'ref': {
      const opts = optionsOf('task', f, null);
      return `<select id="${id}"><option value="">（无）</option>${opts.map(o =>
        `<option value="${esc(o.v)}"${val === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    case 'person':
      return `<input id="${id}" list="dl-people" value="${esc(val || '')}" placeholder="姓名，可留空">`;
    case 'persons':
      return `<input id="${id}" value="${esc((val || []).join('、'))}" placeholder="多人用顿号或逗号分隔">`;
    case 'date':
      return `<input id="${id}" value="${esc(val || '')}" placeholder="YYYY-MM-DD / today / +7">`;
    case 'num':
      return `<input id="${id}" type="number" value="${esc(val === '' || val == null ? '' : val)}"${f.key === 'progress' ? ' min="0" max="100"' : ''}>`;
    case 'lines':
      return `<textarea id="${id}" placeholder="每行一条">${esc((val || []).join('\n'))}</textarea>`;
    default:
      return `<input id="${id}" value="${esc(val || '')}">`;
  }
}
// 从控件读回符合字段类型的值
function readControl(f, idPrefix) {
  const el = $('#' + idPrefix + f.key);
  if (!el) return undefined;
  const raw = el.value.trim();
  switch (f.type) {
    case 'persons': return splitNames(raw);
    case 'lines':   return el.value.split('\n').map(s => s.trim()).filter(Boolean);
    case 'date':    return raw ? (parseDue(raw) || raw) : '';
    case 'num': {
      if (raw === '') return f.key === 'progress' ? 0 : '';
      let n = Math.max(0, Number(raw) || 0);
      if (f.key === 'progress') n = Math.min(100, n);
      return n;
    }
    default: return raw;
  }
}
function peopleDatalist() {
  return `<datalist id="dl-people">${allPeople().map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
}

/* 批量修改选中任务的某一个字段 */
function openBatchEdit(fieldKey) {
  const st = UI.tasks;
  const ids = [...st.sel];
  if (!ids.length) return;
  const f = fieldDef('task', fieldKey);
  openModal(`批量修改 · ${f.label}`,
    `<div class="hint" style="margin-bottom:8px">将对选中的 <b>${ids.length}</b> 条任务统一设置「${esc(f.label)}」，其余字段不变。</div>
     <div class="form-row"><label>${esc(f.label)}</label>${fieldControl(f, f.type === 'persons' ? [] : '', 'be-')}</div>
     ${peopleDatalist()}`,
    '应用', async () => {
      const val = readControl(f, 'be-');
      closeModal();
      snapshot();
      await Repo.bulk(() => {
        ids.forEach(id => {
          const t = byId('task', id);
          if (!t) return;
          t[fieldKey] = val;
          if (fieldKey === 'status') {
            if (val === 'done') { t.actual_date = t.actual_date || todayStr(); t.progress = 100; }
            else t.actual_date = '';
          }
          if (fieldKey === 'work') {                    // 换工作后清理跨工作的脏里程碑引用
            const ms = byId('milestone', t.milestone);
            if (ms && ms.work !== val) t.milestone = '';
          }
          stampMeta(t);
        });
      });
      renderShell(); renderPage();
      showSnack(`已修改 ${ids.length} 条任务的${f.label}`);
    });
  setTimeout(() => { const el = $('#be-' + fieldKey); if (el) el.focus(); }, 60);
}

/* 选择任务表格显示哪些列（顺序沿用 schema 定义顺序） */
function openColConfig() {

function openYearCopy() {

    <div class="form-row"><label>目标年度</label><input id="yc-dst" type="number" value="${src + 1}"></div>
    <div class="form-row"><label>源年度处理</label>
      <select id="yc-arch"><option value="keep">保持不变</option><option value="done">标记为已完成</option></select></div>
    <div style="margin:6px 0 4px;font-size:12px;color:var(--text2)">选择要沿用的工作
      <span class="toggle-view" id="yc-all" style="margin-left:8px">全选 / 全不选</span></div>
    <div class="col-cfg" style="grid-template-columns:1fr;max-height:240px;overflow:auto">
      ${list.map(w => `<div class="it"><input type="checkbox" class="yc-cb" id="yc-${w.id}" value="${esc(w.id)}" checked>
        <label for="yc-${w.id}">${esc(w.code)} ${esc(w.name)}${w.owner ? ` <span style="color:var(--text3)">· ${esc(w.owner)}</span>` : ''}</label></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:8px">编号沿用不变（同一编号可在不同年度并存）。
    工作内容、牵头人、协同人员、里程碑名称会一并复制；<b>里程碑日期顺延一年，任务不复制</b>。</div>`,
    '复制', async () => {
      const dst = Number($('#yc-dst').value);
      const srcY = Number($('#yc-src').value);
      if (!dst || dst === srcY) { showSnack('目标年度不能为空或与源年度相同'); return; }
      const ids = [...document.querySelectorAll('.yc-cb:checked')].map(cb => cb.value);
      if (!ids.length) { showSnack('请至少选择一项工作'); return; }
      const arch = $('#yc-arch').value;
      closeModal();
      snapshot();
      let nw = 0, nm = 0;
      await Repo.bulk(() => {
        ids.forEach(id => {
          const w = byId('work', id);
          if (!w) return;
          const copy = blank('work', {
            code: w.code, duty: w.duty, name: w.name, content: [...(w.content || [])],
            owner: w.owner, collaborators: [...(w.collaborators || [])],
            year: dst, status: 'doing',
          });
          stampMeta(copy);
          DB.works.push(copy);
          nw++;
          DB.milestones.filter(m => m.work === w.id && !m.deleted_at).forEach(m => {
            const md = blank('milestone', {
              work: copy.id, name: m.name, status: 'todo', actual_date: '',
              plan_date: m.plan_date ? shiftYear(m.plan_date, dst - srcY) : '',
            });
            stampMeta(md);
            DB.milestones.push(md);
            nm++;
          });
          if (arch === 'done') { w.status = 'done'; stampMeta(w); }
        });
      });
      DB.settings.year = dst;
      await Repo.persist(DB);
      renderShell(); renderPage();
      showSnack(`已复制 ${nw} 项工作、${nm} 个里程碑到 ${dst} 年度（Ctrl+Z 可撤销）`);
    });
  setTimeout(() => {
    const all = $('#yc-all');
    if (all) all.addEventListener('click', () => {
      const cbs = [...document.querySelectorAll('.yc-cb')];
      const on = cbs.some(c => !c.checked);
      cbs.forEach(c => { c.checked = on; });
    });
  }, 40);
}
// 日期加 n 年，2/29 落到平年时退到 2/28
function shiftYear(ds, n) {
  const [y, m, d] = ds.split('-').map(Number);
  const days = new Date(y + n, m, 0).getDate();
  return `${y + n}-${String(m).padStart(2, '0')}-${String(Math.min(d, days)).padStart(2, '0')}`;
}

/* ---- 数据体检：找出引用断裂与明显异常 ---- */
function healthCheck() {
  const issues = [];
  const orphanTasks = DB.tasks.filter(t => !t.deleted_at && t.work && !byId('work', t.work));
  if (orphanTasks.length) issues.push({ k: 'orphanTask', n: orphanTasks.length, msg: `${orphanTasks.length} 条任务指向了不存在的工作`, fix: '清空这些任务的所属工作' });

  const noWork = DB.tasks.filter(t => !t.deleted_at && !t.work);
  if (noWork.length) issues.push({ k: 'noWork', n: noWork.length, msg: `${noWork.length} 条任务未归属任何工作`, fix: null });

  const badMs = DB.tasks.filter(t => {
    if (t.deleted_at || !t.milestone) return false;
    const m = byId('milestone', t.milestone);
    return !m || m.deleted_at || m.work !== t.work;
  });
  if (badMs.length) issues.push({ k: 'badMs', n: badMs.length, msg: `${badMs.length} 条任务的里程碑已失效或不属于其工作`, fix: '清空这些任务的里程碑' });

  const orphanMs = DB.milestones.filter(m => !m.deleted_at && (!m.work || !byId('work', m.work)));
  if (orphanMs.length) issues.push({ k: 'orphanMs', n: orphanMs.length, msg: `${orphanMs.length} 个里程碑指向了不存在的工作`, fix: '删除这些里程碑' });

  const badDuty = DB.works.filter(w => !w.deleted_at && (!w.duty || !byId('duty', w.duty)));
  if (badDuty.length) issues.push({ k: 'badDuty', n: badDuty.length, msg: `${badDuty.length} 项工作指向了不存在的职责`, fix: null });

  const seen = new Map(), dup = [];
  DB.works.filter(w => !w.deleted_at).forEach(w => {
    const k = w.year + '/' + w.code;
    if (seen.has(k)) dup.push(w); else seen.set(k, w);
  });
  if (dup.length) issues.push({ k: 'dupCode', n: dup.length, msg: `${dup.length} 项工作在同一年度内编号重复`, fix: null });

  const noDate = DB.tasks.filter(t => !t.deleted_at && isOpen(t) && !t.plan_date);
  if (noDate.length) issues.push({ k: 'noDate', n: noDate.length, msg: `${noDate.length} 条未完成任务没有计划完成时间`, fix: null });

  return { issues, orphanTasks, badMs, orphanMs };
}

async function fixHealth(kind) {
  const r = healthCheck();
  snapshot();
  await Repo.bulk(() => {
    if (kind === 'orphanTask') r.orphanTasks.forEach(t => { t.work = ''; t.milestone = ''; stampMeta(t); });
    if (kind === 'badMs') r.badMs.forEach(t => { t.milestone = ''; stampMeta(t); });
    if (kind === 'orphanMs') r.orphanMs.forEach(m => { m.deleted_at = new Date().toISOString(); stampMeta(m); });
  });
  renderPage();
  showSnack('已修复（Ctrl+Z 可撤销）');
}

/* ---- 备份状态 ---- */
function lastChangeAt() {
  let mx = '';
  ['duty', 'work', 'milestone', 'task'].forEach(e => coll(e).forEach(r => {
    if (r.updated_at && r.updated_at > mx) mx = r.updated_at;
  }));
  return mx;
}
function backupState() {
  const last = DB.settings.lastBackupAt || '';
  const change = lastChangeAt();
  const stale = !last || (change && change > last);
  const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
  return { last, stale, days };
}

/* ---- 从 JSON 备份恢复 ---- */
function importBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { showSnack('文件不是合法的 JSON'); return; }
  if (!d || !Array.isArray(d.duties) || !Array.isArray(d.tasks)) { showSnack('这不是本系统导出的备份文件'); return; }
  const cur = { 职责: DB.duties.length, 工作: DB.works.length, 里程碑: DB.milestones.length, 任务: DB.tasks.length };
  const inc = { 职责: d.duties.length, 工作: (d.works || []).length, 里程碑: (d.milestones || []).length, 任务: d.tasks.length };
  openModal('从备份恢复', `
    <p style="color:var(--p1);font-weight:600;margin-bottom:8px">这会用备份内容<b>整体替换</b>当前数据。</p>
    <table class="dtable"><thead><tr><th>实体</th><th>当前</th><th>备份</th></tr></thead><tbody>
      ${Object.keys(cur).map(k => `<tr><td>${k}</td><td>${cur[k]}</td><td>${inc[k]}</td></tr>`).join('')}
    </tbody></table>
    <div class="hint" style="margin-top:8px">恢复后可用 Ctrl+Z 撤销一次。建议先「导出全部」留一份当前数据。</div>`,
    '确认恢复', async () => {
      closeModal();
      snapshot();
      DB.duties = d.duties.map(r => normalize('duty', r));
      DB.works = (d.works || []).map(r => normalize('work', r));
      DB.milestones = (d.milestones || []).map(r => normalize('milestone', r));
      DB.tasks = d.tasks.map(r => normalize('task', r));
      if (d.settings) DB.settings = Object.assign(DB.settings, d.settings);
      migrateWorkIds();
      rebuildIndex();
      restoreUI();
      await Repo.persist(DB);
      renderShell(); renderPage();
      showSnack('已从备份恢复');
    }, true);
}

/* 里程碑面板：一个工作下的全部里程碑，行内增删改，即时保存 */
let _msWork = null;
function openMilestonePanel(workId) {
  const w = byId('work', workId);
  if (!w) { showSnack('工作不存在'); return; }
  _msWork = workId;
  openModal(`里程碑 · ${w.code} ${w.name}`, msPanelHTML(workId), '完成', () => { closeModal(); renderPage(); });
  bindMsPanel();
}
function msList(workId) {
  return DB.milestones.filter(m => m.work === workId && !m.deleted_at)
    .sort((a, b) => (a.plan_date || '9999').localeCompare(b.plan_date || '9999'));
}
function msPanelHTML(workId) {
  const list = msList(workId);
  const rows = list.map(m => `
    <tr data-ms="${m.id}">
      <td><input data-msf="name" value="${esc(m.name)}" placeholder="里程碑名称"></td>
      <td style="width:112px"><input data-msf="plan_date" value="${esc(m.plan_date)}" placeholder="YYYY-MM-DD"></td>
      <td style="width:112px"><input data-msf="actual_date" value="${esc(m.actual_date)}" placeholder="实际日期"></td>
      <td style="width:86px"><select data-msf="status">${MS_STATUS.map(s => `<option value="${s.v}"${m.status === s.v ? ' selected' : ''}>${s.label}</option>`).join('')}</select></td>
      <td style="width:28px"><button class="action-btn del" data-msdel="${m.id}" title="删除">×</button></td>
    </tr>`).join('');
  const ids = new Set(list.map(m => m.id));
  const n = DB.tasks.filter(t => !t.deleted_at && ids.has(t.milestone)).length;
  return `<table class="ms-table">
      <thead><tr><th>里程碑</th><th>计划日期</th><th>实际日期</th><th>状态</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="color:var(--text3);padding:8px 6px">暂无里程碑</td></tr>'}</tbody>
    </table>
    <div style="margin-top:8px"><button class="btn" id="ms-add">+ 添加里程碑</button>
    <span class="hint" style="margin-left:8px">共 ${list.length} 个，已关联 ${n} 条任务。修改即时保存。</span></div>`;
}
function bindMsPanel() {
  const body = $('#modal-body');
  body.addEventListener('input', async e => {
    const f = e.target.dataset.msf; if (!f) return;
    const m = byId('milestone', e.target.closest('tr').dataset.ms); if (!m) return;
    let v = e.target.value.trim();
    if ((f === 'plan_date' || f === 'actual_date') && v) { const p = parseDue(v); if (p) v = p; }
    m[f] = v;
    await Repo.upsert('milestone', m);
  });
  body.addEventListener('change', async e => {
    if (e.target.dataset.msf !== 'status') return;
    const m = byId('milestone', e.target.closest('tr').dataset.ms); if (!m) return;
    m.status = e.target.value;
    if (m.status === 'done' && !m.actual_date) m.actual_date = todayStr();
    await Repo.upsert('milestone', m);
    body.innerHTML = msPanelHTML(_msWork);
  });
  body.addEventListener('click', async e => {
    if (e.target.id === 'ms-add') {
      snapshot();
      await Repo.upsert('milestone', blank('milestone', { work: _msWork, name: '新里程碑', plan_date: '', status: 'todo' }));
      body.innerHTML = msPanelHTML(_msWork);
      return;
    }
    const del = e.target.dataset.msdel;
    if (del) {
      snapshot();
      const m = byId('milestone', del);
      if (m) { softDelete('milestone', del); await Repo.upsert('milestone', m); }
      await Repo.bulk(() => { DB.tasks.forEach(t => { if (t.milestone === del) t.milestone = ''; }); });
      body.innerHTML = msPanelHTML(_msWork);
    }
  });
}

/* =============================================================
   24. CSV / JSON 导入导出
   ============================================================= */
// 多值字段用逗号拼接；值内含逗号或反斜杠时转义，保证往返无损
function joinMulti(arr) {
  return (arr || []).map(v => String(v).replace(/\\/g, '\\\\').replace(/,/g, '\\,')).join(',');
}
function splitMulti(raw) {
  if (!raw) return [];
  const out = []; let cur = '', escd = false;
  for (const c of String(raw)) {
    if (escd) { cur += c; escd = false; }
    else if (c === '\\') escd = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}
function toCSVField(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* 由 \n 收行 */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
function csvHeaders(entity) {
  const sc = schema(entity);
  const keys = sc.fields.filter(f => !f.virtual).map(f => f.key);
  return [...(sc.pk === 'id' ? ['id'] : []), ...keys, 'created_at', 'updated_at', 'updated_by', 'rev', 'deleted_at'];
}
function csvCell(entity, r, key) {
  const f = fieldDef(entity, key);
  if (!f) return r[key];
  if (f.type === 'lines') return (r[key] || []).join('\n');
  if (f.type === 'multi' || f.type === 'persons') return joinMulti(r[key]);
  return r[key];
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function stamp() { return new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 15); }

function exportCSV(entity) {
  const h = csvHeaders(entity);
  const rows = [h.join(',')];
  coll(entity).forEach(r => rows.push(h.map(k => toCSVField(csvCell(entity, r, k))).join(',')));
  download(`${entity}_${stamp()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8;');
  showSnack(`已导出 ${coll(entity).length} 条${schema(entity).label}`);
}
async function exportJSON() {
  download(`工作管理备份_${stamp()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  DB.settings.lastBackupAt = new Date().toISOString();
  await Repo.persist(DB);
  if (currentPage === 'data') renderPage();
  showSnack('已导出 JSON 全量备份');
}

let _importEntity = 'task';
$('#file-input').addEventListener('change', evt => {
  const file = evt.target.files[0]; if (!file) return;
  const entity = _importEntity;
  if (entity === '__backup__') {                 // JSON 全量恢复走另一条路径
    const r = new FileReader();
    r.onload = e => importBackup(e.target.result);
    r.readAsText(file, 'UTF-8');
    evt.target.value = '';
    return;
  }
  const sc = schema(entity);
  const reader = new FileReader();
  reader.onload = async e => {
    let text = e.target.result;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = parseCSV(text);
    if (rows.length < 2) { showSnack('CSV 内容为空'); return; }
    const head = rows[0].map(s => s.trim());
    const get = (cols, k) => { const i = head.indexOf(k); return i >= 0 ? (cols[i] || '') : ''; };
    let n = 0;
    snapshot();
    await Repo.bulk(() => {
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i], rec = {};
        sc.fields.filter(f => !f.virtual).forEach(f => {
          const raw = get(cols, f.key);
          if (f.type === 'lines') rec[f.key] = raw ? raw.split('\n').map(s => s.trim()).filter(Boolean) : [];
          else if (f.type === 'multi' || f.type === 'persons') rec[f.key] = splitMulti(raw);
          else if (['code', 'work', 'duty'].includes(f.key)) rec[f.key] = padCode(raw);
          else rec[f.key] = raw;
        });
        if (sc.pk === 'id') {
          // 工作没带 id 时按「编号 + 年度」认领已有记录，否则新建。
          // 这样用户直接拿 Excel 按编号整理也能正确 upsert。
          let id = get(cols, 'id');
          if (!id && entity === 'work' && rec.code) {
            const hit = DB.works.find(w => w.code === rec.code && String(w.year) === String(rec.year));
            if (hit) id = hit.id;
          }
          rec.id = id || uid(entity[0]);
        } else if (!rec[sc.pk]) continue;
        ['created_at', 'updated_at', 'updated_by', 'deleted_at'].forEach(k => { const v = get(cols, k); if (v) rec[k] = v; });
        rec.rev = Number(get(cols, 'rev')) || 1;
        normalize(entity, rec);
        const list = coll(entity);
        const j = list.findIndex(x => x[sc.pk] === rec[sc.pk]);
        if (j === -1) list.push(rec); else list[j] = rec;
        n++;
      }
    });
    renderShell(); renderPage();
    showSnack(`已导入 ${n} 条${sc.label}（Ctrl+Z 可撤销）`);
  };
  reader.readAsText(file, 'UTF-8');
  evt.target.value = '';
});

document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;

  if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); exportJSON(); return; }
  if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); undoLast(); return; }
  if (e.key === 'Escape') {
    if ($('#modal-overlay').classList.contains('show')) { closeModal(); return; }
    closeFloating();
    if (editing) document.activeElement.blur();
    return;
  }
  if (editing) return;
  if (e.key === '/') { const s = $('#search-input'); if (s) { e.preventDefault(); s.focus(); } }
  if (e.key === 'n' || e.key === 'N') { const q = $('#quick-input'); if (q) { e.preventDefault(); q.focus(); } }
});

/* 可重现的伪随机：每次生成的测试数据一致，便于比对与复现问题 */
function makeRng(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
const TASK_TPL = [
  ['编制{n}初稿', '初稿文档'], ['{n}内部评审', '评审纪要'], ['{n}数据收集与整理', '数据台账'],
  ['{n}材料报送', '报送回执'], ['{n}方案定稿与发布', '正式文本'], ['{n}进度跟踪与督办', '跟踪表'],
  ['{n}季度汇报', '汇报材料'], ['与相关部门沟通{n}事项', '会议纪要'], ['{n}问题整改', '整改清单'],
  ['{n}年度总结', '总结报告'],
];

function seedAll() {
  const year = DB.settings.year || new Date().getFullYear();
  DB.duties = SEED_DUTIES.map(([code, category, name, ref]) => stampMeta(blank('duty', { code, category, name, ref })));
  DB.works = SEED_WORKS.map(([code, duty, name, content, owner, collaborators]) =>
    stampMeta(blank('work', { code, duty, name, content, owner, collaborators, year, status: 'doing' })));
  DB.milestones = [];
  DB.tasks = [];
  rebuildIndex();

  const rng = makeRng(20260720);
  const pick = a => a[Math.floor(rng() * a.length)];
  const people = uniq(SEED_WORKS.flatMap(w => [w[4], ...w[5]]));
  const MS_NAMES = ['一期启动', '中期检查', '初稿完成', '评审通过', '正式发布', '年度验收'];

  // 里程碑：给一半工作各配 1–3 个
  DB.works.forEach((w, wi) => {
    if (wi % 2) return;
    const n = 1 + Math.floor(rng() * 3);
    for (let i = 0; i < n; i++) {
      const off = -30 + Math.floor(rng() * 150);
      const plan = offsetDate(off);
      const passed = off < 0;
      DB.milestones.push(stampMeta(blank('milestone', {
        work: w.id, name: MS_NAMES[(wi + i) % MS_NAMES.length], plan_date: plan,
        actual_date: passed && rng() > 0.4 ? plan : '',
        status: passed ? (rng() > 0.4 ? 'done' : 'doing') : 'todo',
      })));
    }
  });
  rebuildIndex();

  // 任务：每项工作 4–7 条，覆盖各种状态与日期边界
  DB.works.forEach(w => {
    const n = 4 + Math.floor(rng() * 4);
    const ms = DB.milestones.filter(m => m.work === w.id);
    const short = w.name.length > 12 ? w.name.slice(0, 10) + '…' : w.name;
    for (let i = 0; i < n; i++) {
      const tpl = TASK_TPL[Math.floor(rng() * TASK_TPL.length)];
      const r = rng();
      let status, plan, actual = '', progress = 0;
      if (r < 0.30)      { status = 'done';  plan = offsetDate(-150 + Math.floor(rng() * 150)); actual = plan; progress = 100; }
      else if (r < 0.48) { status = 'doing'; plan = offsetDate(2 + Math.floor(rng() * 40));   progress = 10 + Math.floor(rng() * 80); }
      else if (r < 0.62) { status = 'doing'; plan = offsetDate(-25 + Math.floor(rng() * 20)); progress = 20 + Math.floor(rng() * 50); } // 含逾期
      else if (r < 0.72) { status = 'hold';  plan = offsetDate(-20 + Math.floor(rng() * 60)); }
      else if (r < 0.80) { status = 'todo';  plan = ''; }                                        // 无计划日期
      else               { status = 'todo';  plan = offsetDate(Math.floor(rng() * 60)); }
      if (rng() > 0.88 && status !== 'done') plan = todayStr();                                   // 今日到期

      const others = people.filter(p => p !== w.owner);
      const assignees = rng() > 0.45 ? [pick(others)] : (rng() > 0.6 ? [pick(others), pick(others)] : []);
      // 创建时间铺开到过去 ~6 个月，让「按时间」的月度趋势图有真实形状
      const createdAt = new Date(Date.now() - Math.floor(rng() * 190) * 86400000).toISOString();
      DB.tasks.push(stampMeta(blank('task', {
        created_at: createdAt,
        work: w.id,
        title: tpl[0].replace('{n}', short),
        owner: rng() > 0.25 ? w.owner : pick(people),
        assignees: uniq(assignees),
        status, priority: String(1 + Math.floor(rng() * 3)),
        plan_date: plan, actual_date: actual, progress,
        milestone: ms.length && rng() > 0.55 ? pick(ms).id : '',
        deliverable: rng() > 0.35 ? tpl[1] : '',
        source: pick(['领导交办', '例行工作', '监管要求', '内部发起', '']),
        custom: '测试',
      })));
    }
  });
  rebuildIndex();
}

async function boot() {
  const saved = await Repo.load();
  if (saved && saved.duties) {
    DB = Object.assign(DB, saved);

    rebuildIndex();
    restoreUI();
  } else {
    seedAll();
    await Repo.persist(DB);
  }
  const p = (location.hash || '').replace(/^#\//, '');
  currentPage = PAGES.some(x => x.key === p) ? p : 'dashboard';
  goto(currentPage);

  // 备份提醒：数据只在本机浏览器，超过 7 天未备份且期间有改动就提示一次
  const bk = backupState();
  if (bk.stale && (bk.days === null || bk.days >= 7) && DB.tasks.length) {
    setTimeout(() => showSnack(bk.last
      ? `已 ${bk.days} 天未备份，且期间有改动 — 建议到「数据」页导出`
      : '数据仅存于本机浏览器，建议到「数据」页导出一份备份'), 1200);
  }
}
