let currentPage = 'dashboard';
const UI = {
  tasks: {
    view: 'all', filters: {}, search: '', sortKey: 'plan_date', sortDir: 1,
    cols: [...TASK_DEFAULT_COLS], widths: {},
    expanded: new Set(),   // 树形筛选中展开的职责编号
    sel: new Set(),        // 批量操作选中的任务 id
    lastSelIdx: -1,        // Shift 范围选择的锚点
    /* 最左边那列多选框默认不显示——平时看任务列表根本用不到，白占一列还容易误点。
       但批量改状态/牵头人/删除这些功能只能靠勾选来指定对象，整列删掉等于把它们一起废了，
       所以改成按需打开：工具栏那个「批量」按钮点一下才把这列亮出来，退出批量模式就收回去。 */
    batchMode: false,
  },
  // view: 'active' 正常清单 / 'stopped'(工作) 'deleted'(职责) 是恢复入口——
  // 停用工作会连带删除它名下的任务，没有恢复入口的话这个动作等于不可逆（见 'work-del'）
  works:  { view: 'active', filters: {}, search: '', sortKey: 'code', sortDir: 1, widths: {}, cols: schema('work').fields.map(f => f.key) },
  duties: { view: 'active', filters: {}, search: '', sortKey: 'code', sortDir: 1, widths: {}, cols: schema('duty').fields.map(f => f.key) },
  // 日志页：默认落在"今天"，翻页状态不持久化——每次进这一页都从最新看起才是常态
  logs:   { range: 'today', kind: 'all', who: '', text: '', page: 1 },
};

/* 列显示/列宽/列顺序属于个人偏好，随 settings 一起持久化 */
function persistUI() {
  // 必须存副本：直接存引用会让 settings 与 UI 变成同一个对象，
  // 之后任何列宽改动都会静默改写 settings，restore 也就成了空操作
  DB.settings.ui = {
    taskCols: [...UI.tasks.cols],
    workCols: [...UI.works.cols],
    dutyCols: [...UI.duties.cols],
    widths: {
      tasks: { ...UI.tasks.widths },
      works: { ...UI.works.widths },
      duties: { ...UI.duties.widths },
    },
  };
  return Repo.persist(DB);
}
function restoreUI() {
  const ui = DB.settings.ui;
  if (!ui) return;
  if (Array.isArray(ui.taskCols)) {
    const valid = ui.taskCols.filter(k => fieldDef('task', k));
    if (valid.length) UI.tasks.cols = valid;
  }
  if (Array.isArray(ui.workCols)) {
    const valid = ui.workCols.filter(k => fieldDef('work', k));
    if (valid.length === schema('work').fields.length) UI.works.cols = valid;
  }
  if (Array.isArray(ui.dutyCols)) {
    const valid = ui.dutyCols.filter(k => fieldDef('duty', k));
    if (valid.length === schema('duty').fields.length) UI.duties.cols = valid;
  }
  if (ui.widths) ['tasks', 'works', 'duties'].forEach(p => Object.assign(UI[p].widths, ui.widths[p] || {}));
}
schema('task').fields.forEach(f => { UI.tasks.widths[f.key] = f.width || 100; });
UI.tasks.widths.sel = 30; UI.tasks.widths.check = 32; UI.tasks.widths.action = 84;
schema('work').fields.forEach(f => { UI.works.widths[f.key] = f.width || 100; });
UI.works.widths.stat = 104; UI.works.widths.action = 44;
schema('duty').fields.forEach(f => { UI.duties.widths[f.key] = f.width || 100; });
UI.duties.widths.stat = 150; UI.duties.widths.action = 44;

// 员工进任务页默认只看自己的（跟自己关系最直接）；组长/处室领导/部门领导/管理员这些角色
// 默认看"全部待完成"（关心的是整个处室的进度，不是自己名下那一小块）
function defaultTaskView() { return myRole() === 'staff' ? 'mine' : 'open'; }
function goto(page) {
  const p = PAGES.find(x => x.key === page);
  if (!p || !canSeePage(p)) page = 'dashboard';   // 直接改地址栏 hash 也绕不过查看权限的门槛
  currentPage = page;
  if (location.hash !== '#/' + page) location.hash = '#/' + page;
  renderShell(); renderPage();
}
window.addEventListener('hashchange', () => {
  const p = (location.hash || '').replace(/^#\//, '');
  if (p && p !== currentPage) {
    if (p === 'tasks') UI.tasks.view = defaultTaskView();
    goto(p);
  }
});

/* =============================================================
   10. 外壳：导航 / 侧栏 / 工具栏
   ============================================================= */
function renderShell() {
  // 日志页上挂个红点：安全告警不能只躺在页面里等人主动去看，得在导航栏上就能看见。
  // 跟 view_logs 权限对齐，不再单独写死管理员——管理员本来就恒为真，这里只是让"被放开了
  // 日志查看权限的角色"同样看得到红点，不会出现"进得去日志页、却看不到告警提醒"的怪状态
  const alertN = hasPermission('view_logs') ? securityAlertCount() : 0;
  $('#nav').innerHTML = PAGES.filter(canSeePage).map(p =>
    `<div class="nav-item${currentPage === p.key ? ' active' : ''}" data-act="goto" data-page="${p.key}">${esc(p.label)}`
    + `${p.key === 'logs' && alertN ? `<span class="nav-badge">${alertN}</span>` : ''}</div>`).join('');

  const years = uniq(DB.works.map(w => w.year).filter(Boolean)).sort((a, b) => b - a);
  if (DB.settings.year && !years.includes(DB.settings.year)) years.unshift(DB.settings.year);
  $('#year-select').innerHTML =
    years.map(y => `<option value="${y}"${y === DB.settings.year ? ' selected' : ''}>${y} 年度</option>`).join('') +
    `<option value="0"${!DB.settings.year ? ' selected' : ''}>全部年度</option>`;

  const me = DB.settings.me, meUser = myUser();
  $('#me-tag').textContent = (me && meUser) ? `${me}（${(ROLES.find(r => r.v === meUser.role) || {}).label}）` : '未设置使用者';
  // 顶栏这个小按钮有四种形态，优先级从高到低：
  // 0) 有改动还没推上去——最严重，别人根本看不到你干的活儿，闪烁提示直到推上去为止
  // 1) 刷新页面后授权失效（最常见）——点一下就能恢复，不用重新翻文件夹，所以要跟"离线"分开说
  // 2) 真的离线（连过但这次接不回来）
  // 3) 从没连过
  const fsaOk = 'showDirectoryPicker' in window;
  $('#share-connect-hint').innerHTML =
    (DB.settings.pendingSync && !_fileHandle && fsaOk)
    ? `<span class="share-connect-btn urgent" data-act="restore-share-permission" title="你改的东西目前只存在这台电脑上，共享文件里还没有，别人看不到。点一下恢复连接就会自动补推上去">⚠ 有改动未同步·点击立即同步</span>`
    : (_needPermissionRestore && fsaOk)
    // ★ 这一条以前是普通样式的一行小字，是个真问题 ★
    // 它的含义不只是"还没连上"，而是"你现在看到的整屏数据都可能是旧的"——
    // 同事这段时间改的东西一条都不会进来，最近动态也不会有任何人的操作。
    // 长得不起眼的话，用户只会看着一屏旧数据以为大家都没干活，所以跟"有改动未同步"同等对待
    ? `<span class="share-connect-btn urgent" data-act="restore-share-permission" title="刷新页面后浏览器的文件读写授权失效了，现在看到的是本机上一次的数据，同事之后的改动都还没读进来。点一下就能恢复，不用重新选文件夹">⚠ 数据可能不是最新·点击恢复同步</span>`
    : _offlineMode
    ? `<span class="share-connect-btn urgent" data-act="connect-my-shared-folder" title="这台设备连过共享文件夹，但这次没连上，现在看到的是本机缓存的旧数据，点击可重新连接">⚠ 离线模式·数据非最新</span>`
    : (!_fileHandle && fsaOk)
    ? `<span class="share-connect-btn" data-act="connect-my-shared-folder" title="点击连接处里的共享数据文件夹">🔗 连接共享文件夹</span>`
    // 已经连上：给一个手动"立即同步"，并把数据新鲜度直接写在上面。
    // 定时同步是 5 分钟一轮，中间这几分钟里同事存的东西本来就还没到——
    // 与其让人怀疑"是不是同步坏了"，不如让他随时能自己点一下确认
    : _fileHandle
    ? `<span class="share-connect-btn calm" data-act="sync-now" title="立刻跟共享文件对一次：把同事刚存的读进来，也把我这边的推上去">🔄 立即同步${
        DB.settings.lastSyncAt ? `<span class="sync-age">（${esc(relTime(DB.settings.lastSyncAt))}）</span>` : ''}</span>` : '';
  // 还没连上共享文件夹、当前看到的还是本机演示种子数据：显著标出来，别让人误当成真实数据
  const isDemoData = !_fileHandle && DB.tasks.some(t => t.custom === '测试');
  $('#demo-data-badge').innerHTML = isDemoData
    ? `<span class="demo-data-badge" title="还没连接共享文件夹，当前看到的是本机生成的演示/测试数据，不是真实数据">⚠ 测试数据</span>` : '';

  $$('.page').forEach(el => el.classList.toggle('active', el.id === 'page-' + currentPage));
  // 侧栏交给 renderPage() 统一渲染一次（它内部按当前页判断是否需要）——
  // 这里以前重复调用了一次 renderSidebar()，任务树+分面统计在任务/工作较多时会白白算两遍，
  // 是页面切换感觉变慢的一个实际原因。
  renderToolbar();
}

// 合并后的"人员"分面：按姓名拼音排序（不是按数量），未指派/空值固定放最后
function personFacet(entity, rows) {
  const cnt = new Map();
  let empty = 0;
  rows.forEach(r => {
    const people = personUnion(entity, r);
    if (!people.length) { empty++; return; }
    people.forEach(p => cnt.set(p, (cnt.get(p) || 0) + 1));
  });
  const items = [...cnt.entries()]
    .sort((a, b) => a[0].localeCompare(b[0], 'zh'))
    .map(([v, n]) => ({ value: v, label: v, count: n }));
  items.push({ value: '__empty__', label: '（空）', count: empty, isEmpty: true });
  return items;
}
function personFacetBlock(entity, rows, filters, act) {
  const items = personFacet(entity, rows).filter(i => i.count > 0 || filters._person === i.value);
  if (!items.length) return '';
  let h = `<div class="sb-section-title">◆ 人员</div>`;
  h += `<div class="sb-item${!filters._person ? ' active' : ''}" data-act="${act}" data-field="_person" data-val=""><span class="sb-label">全部</span></div>`;
  h += items.map(i =>
    `<div class="sb-item indent${filters._person === i.value ? ' active' : ''}" data-act="${act}" data-field="_person" data-val="${esc(i.value)}">
       <span class="sb-label${i.isEmpty ? ' is-empty-val' : ''}">${esc(i.label)}</span>
       <span class="cnt">${i.count || ''}</span></div>`).join('');
  return h + '<hr class="sb-divider">';
}
function facetBlock(entity, f, rows, filters, act) {
  const items = facet(entity, f, rows).filter(i => i.count > 0 || filters[f.key] === i.value);
  if (!items.length) return '';
  let h = `<div class="sb-section-title">◆ ${esc(f.label)}</div>`;
  h += `<div class="sb-item${!filters[f.key] ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val=""><span class="sb-label">全部</span></div>`;
  // 筛选框里统一用普通文字颜色，不借用该选项在徽章/图表里的专属颜色（保持所有筛选框外观一致）
  h += items.map(i =>
    `<div class="sb-item indent${filters[f.key] === i.value ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val="${esc(i.value)}">
       <span class="sb-label${i.isEmpty ? ' is-empty-val' : ''}">${esc(i.label)}</span>
       <span class="cnt">${i.count || ''}</span></div>`).join('');
  return h + '<hr class="sb-divider">';
}

function renderSidebar() {
  const sb = $('#sidebar');
  /* 左下角只留两样：著作权信息 + 版本号。
     中间原来还有一行"存储：IndexedDB"，那是实现细节，对使用者没有任何意义，去掉；
     版本号必须留着——排查"谁还在用旧版本"就是靠这个（见 appVersionCellHTML）。 */
  const foot = `<div class="sb-copyright">&#174; 科技规划处&nbsp;徐捷<br><span style="opacity:.55">${esc(APP_VERSION)}</span></div>`;
  let html = '';

  if (currentPage === 'tasks') {
    const st = UI.tasks;
    // 每个视图的计数都用它自己的池子（「已删除」是恢复入口，取全量），
    // 否则侧栏会出现"已删除 0"、点进去却有一堆，或者反过来——见 taskPoolFor 的注释
    html += `<div class="sb-section-title">◆ 视图</div>` + TASK_VIEWS.map(v =>
      `<div class="sb-item${st.view === v.key ? ' active' : ''}" data-act="task-view" data-view="${v.key}">
         <span class="sb-label">${esc(v.label)}</span><span class="cnt">${taskPoolFor(v.key).filter(v.match).length || ''}</span></div>`).join('');
    html += '<hr class="sb-divider">';
    const rows = taskPoolFor(st.view).filter(TASK_VIEW_MAP[st.view].match);
    html += renderTaskTree(rows);
    // 职责与工作已由树承担；负责人+参与人合并成一个"人员"分面，其余分面仍平铺
    html += personFacetBlock('task', rows, st.filters, 'task-filter');
    schema('task').fields.filter(f => f.facet && f.key !== '_duty' && f.key !== 'work')
      .forEach(f => { html += facetBlock('task', f, rows, st.filters, 'task-filter'); });
  } else if (currentPage === 'works') {
    const st = UI.works, rows = workPoolFor(st.view);
    html += `<div class="sb-section-title">◆ 视图</div>`
      + [{ k: 'active', label: '全部工作' }, { k: 'stopped', label: '已停用' }].map(v =>
        `<div class="sb-item${st.view === v.k ? ' active' : ''}" data-act="work-view" data-view="${v.k}">
           <span class="sb-label">${esc(v.label)}</span><span class="cnt">${workPoolFor(v.k).length || ''}</span></div>`).join('')
      + '<hr class="sb-divider">';
    const wfacets = schema('work').fields.filter(f => f.facet);
    const dutyField = wfacets.find(f => f.key === 'duty');
    // 所属职责在上、人员在下，其余分面殿后
    if (dutyField) html += facetBlock('work', dutyField, rows, st.filters, 'work-filter');
    html += personFacetBlock('work', rows, st.filters, 'work-filter');
    wfacets.filter(f => f.key !== 'duty').forEach(f => { html += facetBlock('work', f, rows, st.filters, 'work-filter'); });
  } else if (currentPage === 'duties') {
    const st = UI.duties, rows = dutyPoolFor(st.view);
    html += `<div class="sb-section-title">◆ 视图</div>`
      + [{ k: 'active', label: '全部职责' }, { k: 'deleted', label: '已删除' }].map(v =>
        `<div class="sb-item${st.view === v.k ? ' active' : ''}" data-act="duty-view" data-view="${v.k}">
           <span class="sb-label">${esc(v.label)}</span><span class="cnt">${dutyPoolFor(v.k).length || ''}</span></div>`).join('')
      + '<hr class="sb-divider">';
    html += facetBlock('duty', fieldDef('duty', 'category'), rows, st.filters, 'duty-filter');
  } else {
    sb.classList.add('hidden'); sb.innerHTML = ''; return;
  }
  sb.classList.remove('hidden');
  sb.innerHTML = html + foot;
}

/* 两级树筛选：职责 → 工作。
   计数按当前视图统计；选中某工作时自动展开其所属职责。
   点职责 = 按职责筛选（含其下全部工作），点工作 = 按单个工作筛选。 */
function renderTaskTree(rows) {
  const st = UI.tasks;
  const byWork = new Map();
  let noWork = 0;
  rows.forEach(t => {
    if (!t.work) noWork++;
    else byWork.set(t.work, (byWork.get(t.work) || 0) + 1);
  });

  const dutyMap = new Map();
  visibleWorks().forEach(w => {
    const c = byWork.get(w.id) || 0;
    if (!dutyMap.has(w.duty)) dutyMap.set(w.duty, { count: 0, works: [] });
    const e = dutyMap.get(w.duty);
    e.count += c;
    if (c > 0 || st.filters.work === w.id) e.works.push({ w, c });
  });

  const selWork = st.filters.work && st.filters.work !== '__empty__' ? byId('work', st.filters.work) : null;
  const noneSelected = !st.filters._duty && !st.filters.work;

  let h = `<div class="sb-section-title">◆ 职责 / 工作</div>`;
  h += `<div class="sb-item${noneSelected ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="">
          <span class="sb-label">全部</span><span class="cnt">${rows.length || ''}</span></div>`;

  DB.duties.filter(d => !d.deleted_at).forEach(d => {
    const e = dutyMap.get(d.code);
    if (!e || (!e.count && st.filters._duty !== d.code)) return;
    const open = st.expanded.has(d.code) || (selWork && selWork.duty === d.code);
    h += `<div class="sb-item tree-duty${st.filters._duty === d.code ? ' active' : ''}" data-act="tree-pick" data-duty="${esc(d.code)}" data-work="" title="${esc(d.code + ' ' + d.name)}">
            <span class="sb-caret" data-act="tree-toggle" data-duty="${esc(d.code)}">${open ? '▾' : '▸'}</span>
            <span class="sb-label">${esc(d.code + ' ' + d.name)}</span>
            <span class="cnt">${e.count || ''}</span></div>`;
    if (open) h += e.works.map(({ w, c }) =>
      `<div class="sb-item indent2${st.filters.work === w.id ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="${esc(w.id)}" title="${esc(w.code + ' ' + w.name)}">
         <span class="sb-label">${esc(w.name)}</span><span class="cnt">${c || ''}</span></div>`).join('');
  });

  if (noWork || st.filters.work === '__empty__') {
    h += `<div class="sb-item${st.filters.work === '__empty__' ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="__empty__">
            <span class="sb-label is-empty-val">未归属工作</span><span class="cnt">${noWork || ''}</span></div>`;
  }
  return h + '<hr class="sb-divider">';
}

function renderToolbar() {
  const tb = $('#toolbar');
  if (currentPage === 'tasks') {
    const st = UI.tasks;
    const chips = Object.entries(st.filters).filter(([, v]) => v).map(([k, v]) => {
      if (k === '_person') {
        const txt = v === '__empty__' ? '空' : v;
        return `<span class="filter-chip" data-act="task-filter" data-field="_person" data-val="">人员:${esc(txt)} ×</span>`;
      }
      const f = fieldDef('task', k);
      if (!f) return '';
      const txt = v === '__empty__' ? '空' : label('task', f, v);
      return `<span class="filter-chip" data-act="task-filter" data-field="${k}" data-val="">${esc(f.label)}:${esc(txt)} ×</span>`;
    }).join('');
    const searchChip = st.search ? `<span class="filter-chip" data-act="clear-search" data-page="tasks">搜索:${esc(st.search)} ×</span>` : '';
    tb.innerHTML = `<span id="view-label">${esc(TASK_VIEW_MAP[st.view].label)}</span>${chips}${searchChip}` +
      `<button class="btn primary" data-act="task-new">+ 新建任务</button>` +
      // 多选框那一列默认收着，点这里才亮出来（见 UI.tasks.batchMode 的注释）
      `<button class="btn${st.batchMode ? ' primary' : ''}" data-act="batch-mode-toggle" title="${st.batchMode ? '退出批量操作，收起最左边的多选框列' : '批量改状态/牵头人/删除等，需要先勾选任务'}">☑ 批量</button>` +
      `<button class="btn" data-act="col-config" title="选择显示哪些列">▦ 列</button>` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else if (currentPage === 'works' || currentPage === 'duties') {
    const st = UI[currentPage];
    const searchChip = st.search ? `<span class="filter-chip" data-act="clear-search" data-page="${currentPage}">搜索:${esc(st.search)} ×</span>` : '';
    tb.innerHTML = `<span id="view-label">${currentPage === 'works' ? '工作管理' : '职责管理'}</span>` +
      `<button class="btn primary" data-act="${currentPage === 'works' ? 'work-new' : 'duty-new'}">+ 新建${currentPage === 'works' ? '工作' : '职责'}</button>` +
      `<span class="hint">双击单元格编辑</span>${searchChip}` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else {
    const p = PAGES.find(x => x.key === currentPage);
    tb.innerHTML = `<span id="view-label">${esc(p ? p.label : '')}</span>`;
    return;
  }
  bindToolbarInputs(currentPage);
}

/* ★ 搜索框统一走这里，中文输入法的"合成期"必须让开 ★
   拼音敲到一半、候选词还没选定的时候，浏览器照样一路触发 input 事件，
   事件里拿到的是拼音字母而不是最终的汉字。这时候就去筛选有两个后果：
   一是按字母筛出一堆无关结果；二是筛完要重绘，而重绘会把输入框这个 DOM 元素整个换掉
   （日志页尤其明显——它是整页重建），正在进行的合成于是被强行中断：
   候选框消失、已经敲进去的拼音字母被当成最终输入落在框里。
   任务页之所以看着没事，只是因为它的搜索框在工具栏上、重绘时不会被换掉，
   合成能撑到用户选完词——但按字母抢跑筛选这件事其实一样在发生。
   所以两处都改成：合成期间一概不动，等 compositionend（用户真的选定了）再按最终文本走一次。 */
function bindComposableSearch(el, apply, delay) {
  if (!el) return;
  let timer = null, composing = false;
  const fire = () => { clearTimeout(timer); timer = setTimeout(apply, delay || 150); };
  el.addEventListener('compositionstart', () => { composing = true; clearTimeout(timer); });
  el.addEventListener('compositionend', () => { composing = false; fire(); });
  el.addEventListener('input', () => { if (!composing) fire(); });
}
function bindToolbarInputs(page) {
  const si = $('#search-input');
  bindComposableSearch(si, () => { UI[page].search = si.value; renderPage(); si.focus(); });
}

/* =============================================================
   11. 页面分发 / 年度过滤
   ============================================================= */
function inYear(w) { return !DB.settings.year || !w.year || w.year === DB.settings.year; }
function visibleWorks() { return DB.works.filter(w => !w.deleted_at && inYear(w)); }
/* 工作/职责的"恢复入口"池子。跟任务的「已删除」视图同理：既然停用/删除是可逆的，
   就必须有一个地方能看见被停用的东西——而且不受年度过滤影响，否则切到别的年度就又找不着了。 */
function stoppedWorks() { return DB.works.filter(w => !!w.deleted_at); }
function deletedDuties() { return DB.duties.filter(d => !!d.deleted_at); }
function workPoolFor(view) { return view === 'stopped' ? stoppedWorks() : visibleWorks(); }
function dutyPoolFor(view) { return view === 'deleted' ? deletedDuties() : DB.duties.filter(d => !d.deleted_at); }
/* ★ 这里只按「年度」过滤，绝不按「所属工作是否已停用」过滤 ★
   以前这个函数是从 visibleWorks() 推出来的，而 visibleWorks() 已经排除了停用的工作——
   于是"所属工作被停用"的任务在全站每一个视图里凭空消失。停用工作会连带删除它名下的任务
   （见 'work-del'），这些任务因此同时满足"自己已删除"和"所属工作已停用"两个条件，
   连唯一的恢复入口「已删除」视图都进不去：数据概况按 DB.tasks 直接数，数得出 166 条，
   界面上却一条都够不到，也就永远恢复不了——记录还在文件里，人却拿它没办法。
   任务该不该出现，只由它自己的 deleted_at 决定；所属工作的状态不该替它做这个决定。
   （历史遗留的"工作已停用、任务还活着"那批，现在也能正常看到并处理了，而不是被静悄悄藏起来） */
function visibleTasks() {
  const inYearWork = new Set(DB.works.filter(inYear).map(w => w.id));
  return DB.tasks.filter(t => !t.work || inYearWork.has(t.work));
}
/* 「已删除」是唯一的恢复入口，必须无条件看到全部软删除记录——连年度过滤都要绕开：
   工作是 2025 年度的、当前切在 2026 年度，它名下被删的任务同样会消失在恢复入口之外。
   恢复入口一旦有任何过滤，就存在"数得着、够不到"的黑洞，这是上面那段注释里出过的事故。 */
function taskPoolFor(viewKey) {
  const v = TASK_VIEW_MAP[viewKey];
  return v && v.recovery ? DB.tasks : visibleTasks();
}

function renderPage() {
  switch (currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'tasks':     renderTasks();     break;
    case 'works':     renderWorks();     break;
    case 'duties':    renderDuties();    break;
    case 'charts':    renderCharts();    break;
    case 'report':    renderReport();    break;
    case 'data':      renderData();      break;
    case 'logs':      renderLogs();      break;
    case 'permissions': renderPermissions(); break;
  }
  renderSidebar();   // 非任务/工作/职责页会在内部自行隐藏侧栏
}

/* =============================================================
   12. 通用表头 / 单元格
   ============================================================= */
function renderHead(hostSel, entity, cols, st, extra) {
  const all = [...((extra && extra.lead) || []), ...cols, ...((extra && extra.tail) || [])];
  const lastKey = typeof all[all.length - 1] === 'string' ? all[all.length - 1] : all[all.length - 1].key;
  $(hostSel).innerHTML = all.map(c => {
    const isField = typeof c === 'string';
    const f = isField ? fieldDef(entity, c) : null;
    const key = isField ? c : c.key;
    const cls = [];
    const attrs = [`data-key="${key}"`, `style="width:${st.widths[key] || 90}px"`];
    let inner = esc(isField ? f.label : c.label);
    if (key === 'sel') cls.push('col-sel');
    if (!isField && c.act) { attrs.push(`data-act="${c.act}"`, 'style="cursor:pointer"', `title="${esc(c.title || '')}"`); }
    if (isField && f.sortable) {
      cls.push('sortable');
      attrs.push(`data-sort="${key}"`);
      inner += `<span class="sort-icon">${st.sortKey === key ? (st.sortDir === 1 ? '▲' : '▼') : '⇅'}</span>`;
    }
    if (isField) attrs.push('data-draggable="1"');   // 长按可拖动调整字段顺序，固定列（勾选/操作等）不参与
    if (cls.length) attrs.push(`class="${cls.join(' ')}"`);
    const handle = key !== lastKey ? `<div class="col-resize" data-resize="${key}"></div>` : '';
    return `<th ${attrs.join(' ')}>${inner}${handle}</th>`;
  }).join('');
}

function renderCellValue(entity, rec, f, editable) {
  const id = rec[schema(entity).pk];
  const can = editable && !f.readonly;
  const editAttr = can ? ` data-dblact="edit" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';

  switch (f.type) {
    case 'enum': {
      const o = (f.options || []).find(x => x.v === String(rec[f.key])) || {};
      // picker 字段走双击下拉选择（如里程碑引用），不用单击循环切换
      if (f.picker) return `<td class="cell-center"${editAttr}><span class="badge badge-plain ${o.cls || ''}">${esc(o.label || '')}</span></td>`;
      // 任务的"状态"字段改成单击直接下拉选择（跟双击的效果一样），不再是单击循环切换——
      // 状态改成"已完成"时还要检查里程碑，循环切换没法在中途插入这个确认
      const isTaskStatus = entity === 'task' && f.key === 'status';
      const clk = can ? ` data-act="${isTaskStatus ? 'edit' : 'cycle'}" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';
      return `<td class="cell-center"><span class="badge ${o.cls || ''}${clk ? '' : ' ro'}"${clk}>${esc(o.label || '')}</span></td>`;
    }
    case 'date':
      return `<td class="cell-center"${editAttr}><span class="${dateClass(rec[f.key])}">${esc(fmtDate(rec[f.key]))}</span></td>`;
    case 'num': {
      if (f.key === 'progress') {
        const n = Math.max(0, Math.min(100, Number(rec[f.key]) || 0));
        /* 有检查点时进度是按里程碑完成比例自动算的，直接改这个数没有意义（下次一算又被覆盖）。
           以前的做法是干脆不给双击——但用户双击了没反应，只会以为界面卡了，也不知道该去哪儿改。
           现在照样可以双击，只是 openEditor 会把它转到任务详情弹窗去（见那里的 progress 分支），
           在那儿勾里程碑才是真正能改动进度的地方。没有检查点的任务保持原样，双击直接改数字。 */
        const locked = entity === 'task' && hasCheckpoints(rec);
        const pAttr = locked ? editAttr + ' title="进度由里程碑完成情况自动计算，双击去任务详情里勾里程碑"' : editAttr;
        // 跟工作页"任务进度"格子下面挂"逾期 N"是一个道理：这条任务下面有没有里程碑拖期了，
        // 得在进度格子里就能看出来，不用点进详情才发现
        const overdueMs = entity === 'task'
          ? DB.milestones.filter(m => m.task === rec.id && !m.deleted_at && m.done !== '1' && m.plan_date && m.plan_date < todayStr()).length
          : 0;
        const msHint = overdueMs ? `<div style="font-size:10px;color:var(--overdue);line-height:1;margin-top:1px">里程碑逾期 ${overdueMs}</div>` : '';
        return `<td${pAttr}><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${n}%"></div></div><span class="progress-num">${n}%</span></div>${msHint}</td>`;
      }
      return `<td class="cell-center"${editAttr}>${esc(rec[f.key] === '' ? '' : rec[f.key])}</td>`;
    }
    case 'checkpoints': {
      const cps = DB.milestones.filter(m => m.task === rec.id && !m.deleted_at);
      if (!cps.length) return `<td class="cell-center"${editAttr}><span style="color:var(--text3)">—</span></td>`;
      const doneN = cps.filter(m => m.done === '1').length;
      const sorted = [...cps].sort((a, b) => (a.plan_date || '9999-99-99').localeCompare(b.plan_date || '9999-99-99'));
      const next = sorted.find(m => m.done !== '1') || sorted[sorted.length - 1];
      const tip = cps.map(m => `${m.plan_date || '无日期'} ${m.deliverable || ''}${m.report_level ? `（${(REPORT_LEVELS.find(r => r.v === m.report_level) || {}).label || ''}）` : ''}${m.done === '1' ? ' ✓' : ''}`).join('\n');
      return `<td${editAttr} title="${esc(tip)}"><span class="cp-chip">${doneN}/${cps.length}</span>${next ? `<span class="cell-sub"> ${esc(fmtDate(next.plan_date))} ${esc(next.deliverable || '')}</span>` : ''}</td>`;
    }
    case 'lines': {
      const arr = rec[f.key] || [];
      const txt = arr.map((l, i) => `${i + 1}、${l}`).join('  ');
      return `<td${editAttr} title="${esc(arr.map((l, i) => (i + 1) + '、' + l).join('\n'))}"><span class="lines-preview">${esc(txt)}</span></td>`;
    }
    case 'persons': case 'multi':
      return `<td class="cell-center"${editAttr}>${(rec[f.key] || []).map(v =>
        `<span class="tag-chip${f.type === 'persons' ? ' tag-person' : ''}">${esc(v)}</span>`).join('')}</td>`;
    case 'person':
      return `<td class="cell-center"${editAttr}>${rec[f.key] ? `<span class="tag-chip tag-person">${esc(rec[f.key])}</span>` : ''}</td>`;
    case 'ref': {
      const v = rec[f.key];
      if (!v) return `<td class="cell-center"${editAttr}></td>`;
      const r = byId(f.ref, v);
      if (!r) return `<td class="cell-center"${editAttr}><span style="color:var(--text3)">${esc(v)}?</span></td>`;
      const rs = schema(f.ref);
      const full = (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '');
      return `<td${editAttr} title="${esc(full)}"><span class="cell-title">${r.code ? `<span class="code-chip">${esc(r.code)}</span>` : ''}${esc(r[rs.titleField] || '')}</span></td>`;
    }
    default:
      if (entity === 'task' && f.key === 'code') {
        return `<td class="cell-center" data-act="task-detail" data-id="${esc(id)}" style="cursor:pointer" title="点击查看任务详情"><span class="cell-title">${esc(rec[f.key])}</span></td>`;
      }
      return `<td class="${f.align === 'center' ? 'cell-center' : ''}"${editAttr}><span class="cell-title">${esc(rec[f.key])}</span></td>`;
  }
}

/* =============================================================
   13. 任务页（虚拟滚动）
   ============================================================= */
const ROW_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--row-h')) || 36;
const VS_BUFFER = 12;
let _taskRows = [];

function renderTasks() {
  const st = UI.tasks;
  renderHead('#tasks-head', 'task', st.cols, st, {
    // 只有批量模式才有最左边那列多选框，平时整列都不渲染
    lead: st.batchMode
      ? [{ key: 'sel', label: st.sel.size && st.sel.size === _taskRows.length ? '☑' : '☐', act: 'sel-all', title: '全选 / 取消全选' }]
      : [],
    tail: [{ key: 'action', label: '✕' }],
  });
  _taskRows = query('task', {
    pool: taskPoolFor(st.view).filter(TASK_VIEW_MAP[st.view].match),
    filters: st.filters, search: st.search, sortKey: st.sortKey, sortDir: st.sortDir,
  });
  // 选中项可能因筛选/视图变化而不在当前结果里，清掉避免"看不见却被批量改"
  const visible = new Set(_taskRows.map(t => t.id));
  [...st.sel].forEach(id => { if (!visible.has(id)) st.sel.delete(id); });

  $('#status-left').textContent = `${_taskRows.length} 条任务` + (st.sel.size ? ` · 已选 ${st.sel.size}` : '');
  renderBatchBar();
  const empty = $('#empty-state');
  if (!_taskRows.length) { $('#tasks-body').innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  renderTaskViewport();
}

/* 批量操作条：选中任意行后出现 */
function renderBatchBar() {
  const st = UI.tasks, bar = $('#batch-bar');
  if (!st.sel.size) { bar.classList.remove('show'); bar.innerHTML = ''; return; }
  bar.classList.add('show');
  // 已经在「已删除」视图里了，批量操作只剩"彻底删除"这一件事有意义——
  // 再点一次普通"删除"只是给已经软删除的记录再盖一次时间戳，跟单条那行的按钮（🗑 彻底删除）不一致，容易让人以为删除没生效
  const deleteBtn = st.view === 'deleted'
    ? `<button class="btn" data-act="batch-purge" style="color:var(--overdue)">彻底删除</button>`
    : `<button class="btn" data-act="batch-delete" style="color:var(--p1)">删除</button>`;
  bar.innerHTML =
    `<span class="n">已选 ${st.sel.size} 项</span>` +
    (st.view === 'deleted' ? '' : `<button class="btn" data-act="batch" data-field="status">改状态</button>` +
    `<button class="btn" data-act="batch" data-field="owner">改牵头人</button>` +
    `<button class="btn" data-act="batch" data-field="assignees">改参与人</button>` +
    `<button class="btn" data-act="batch" data-field="work">改所属工作</button>` +
    `<button class="btn" data-act="batch" data-field="plan_date">改计划完成</button>` +
    `<button class="btn" data-act="batch" data-field="priority">改优先级</button>`) +
    deleteBtn +
    `<button class="btn" data-act="sel-clear" style="margin-left:auto">取消选择</button>`;
}

function renderTaskViewport() {
  const wrap = $('#tasks-scroll');
  const total = _taskRows.length;
  const colCount = UI.tasks.cols.length + 1 + (UI.tasks.batchMode ? 1 : 0);   // 操作列 + （批量模式下才有的）选择列
  const theadH = ($('#page-tasks thead') || {}).offsetHeight || 0;
  const top = Math.max(0, wrap.scrollTop - theadH);
  const start = Math.max(0, Math.floor(top / ROW_H) - VS_BUFFER);
  let end = Math.min(total, Math.ceil((top + wrap.clientHeight) / ROW_H) + VS_BUFFER);
  if (end <= start) end = Math.min(total, start + 1);
  const pad = h => h > 0 ? `<tr class="vs-pad" style="height:${h}px"><td colspan="${colCount}"></td></tr>` : '';
  $('#tasks-body').innerHTML =
    pad(start * ROW_H) + _taskRows.slice(start, end).map(renderTaskRow).join('') + pad((total - end) * ROW_H);
}

function renderTaskRow(t) {
  const del = !!t.deleted_at;
  const selected = UI.tasks.sel.has(t.id);
  const cls = [t.status === 'done' ? 'done-row' : '', t.status === 'hold' ? 'hold-row' : '',
               del ? 'deleted-row' : '', selected ? 'sel-row' : ''].filter(Boolean).join(' ');
  // 非批量模式下整列都不输出（连 <td> 都没有），表头那边也一样，两边列数才对得上
  const sel = UI.tasks.batchMode
    ? `<td class="col-sel"><input type="checkbox" class="cb-sel" data-act="sel-row" data-id="${t.id}"${selected ? ' checked' : ''}></td>` : '';
  // 状态字段现在可以直接点开下拉选择"已完成"，不再需要单独一列一键打勾；已删除视图的恢复按钮挪到操作列里，
  // 跟"彻底删除"放一起，不再单独占一整列
  const tail = del
    ? `<td class="cell-center"><button class="action-btn restore" data-act="task-restore" data-id="${t.id}" title="恢复">↩</button><button class="action-btn del" data-act="task-purge" data-id="${t.id}" title="彻底删除">🗑</button></td>`
    // 操作列只留删除。原来还有"详情☰"和"复制⧉"两个按钮：
    // 详情是多余的——点任务编号那一格就是打开详情（见 renderCellValue 里 code 列的处理），
    // 有里程碑的任务双击进度格也会打开它，一列里塞三个图标反而容易点错；
    // 复制功能整个撤掉了，理由见 ACTIONS 里"复制任务"那段说明
    : `<td class="cell-center"><button class="action-btn del" data-act="task-del" data-id="${t.id}" title="删除">×</button></td>`;
  const cells = UI.tasks.cols.map(k => renderCellValue('task', t, fieldDef('task', k), !del)).join('');
  return `<tr data-id="${t.id}" class="${cls}">${sel}${cells}${tail}</tr>`;
}

function refreshTaskRow(id) {
  const tr = $(`#tasks-body tr[data-id="${id}"]`);
  const t = byId('task', id);
  if (!tr || !t) { renderTasks(); return; }
  const i = _taskRows.findIndex(x => x.id === id);
  if (i >= 0) _taskRows[i] = t;
  tr.outerHTML = renderTaskRow(t);
}

/* =============================================================
   14. 工作页
   ============================================================= */
function renderWorks() {
  const st = UI.works;
  const cols = st.cols;
  renderHead('#works-head', 'work', cols, st, {
    tail: [{ key: 'stat', label: '任务进度' }, { key: 'action', label: '✕' }],
  });
  const stopped = st.view === 'stopped';
  const rows = query('work', { pool: workPoolFor(st.view), filters: st.filters, search: st.search, sortKey: st.sortKey, sortDir: st.sortDir });
  $('#status-left').textContent = `${rows.length} 项工作${stopped ? '（已停用）' : ''}`;

  $('#works-body').innerHTML = rows.map(w => {
    const cells = cols.map(k => renderCellValue('work', w, fieldDef('work', k), true)).join('');
    const ts = DB.tasks.filter(t => t.work === w.id && !t.deleted_at);
    const done = ts.filter(t => t.status === 'done').length;
    const doing = ts.filter(t => t.status === 'doing').length;
    const over = ts.filter(isOverdue).length;
    const pct = ts.length ? Math.round(done / ts.length * 100) : 0;
    /* 已停用视图里这一列没有"进度"可言（名下任务都跟着被删了，ts 恒为空），
       换成"恢复会带回来多少条"——这正是点恢复之前最想知道的那个数 */
    const statCell = stopped
      ? (() => {
          const back = DB.tasks.filter(t => t.work === w.id && t.deleted_at).length;
          return `<td class="cell-center"><span class="hint">${back ? `恢复将带回 ${back} 条任务` : '名下没有任务'}</span></td>`;
        })()
      : `<td class="cell-center" data-act="work-drill" data-id="${esc(w.id)}" style="cursor:pointer" title="查看该工作下的任务">
        <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-num">${ts.length ? done + '/' + ts.length : '—'}</span></div>
        ${over ? `<div style="font-size:10px;color:var(--overdue);line-height:1">逾期 ${over}</div>`
               : (doing ? `<div style="font-size:10px;color:var(--text3);line-height:1">进行 ${doing}</div>` : '')}</td>`;
    // 已停用视图里换成"恢复"——停用会连带删掉名下任务，没有这个入口的话这一步就是不可逆的
    const act = stopped
      ? `<td class="cell-center"><button class="action-btn restore" data-act="work-restore" data-id="${esc(w.id)}" title="恢复（连同其下被连带删除的任务）">↩</button></td>`
      : `<td class="cell-center"><button class="action-btn del" data-act="work-del" data-id="${esc(w.id)}" title="停用">×</button></td>`;
    return `<tr data-id="${esc(w.id)}">${cells}${statCell}${act}</tr>`;
  }).join('');
}

function renderDuties() {

  renderHead('#duties-head', 'duty', cols, st, {

    const stat = `<td class="cell-center" data-act="duty-drill" data-code="${esc(d.code)}" style="cursor:pointer" title="查看该职责下的工作">
       <span style="color:var(--text2)">${ws.length} 项工作</span><span class="cell-sub"> · ${ts.length ? done + '/' + ts.length + ' 任务' : '无任务'}</span></td>`;
    const act = isDel
      ? `<td class="cell-center"><button class="action-btn restore" data-act="duty-restore" data-code="${esc(d.code)}" title="恢复">↩</button></td>`
      : `<td class="cell-center"><button class="action-btn del" data-act="duty-del" data-code="${esc(d.code)}" title="删除">×</button></td>`;
    return `<tr data-id="${esc(d.code)}">${cells}${stat}${act}</tr>`;

let dashMsDutyExpanded = new Set();  // 工作台「我的里程碑时间线」树状展开：哪些职责展开了，跟图表页那份各自独立
let dashMsWorkExpanded = new Set();  // 工作台「我的里程碑时间线」树状展开：哪些工作展开了
// 工作台改版：从"处室实时快照"改成"个人为主、按周期回看进展"（周二例会照着这页念上周/本月做了什么）。
// "需要关注"（逾期/今日到期/本周到期/未指派 四个分段）那个面板连同 dashFocus 状态一起被拆掉了：
// 逾期/未指派现在挂在处室概览的统计卡片里，今日到期/本周到期被"本期未完成"这种按周期回看的
// 口径取代——原来那种"只看现在这一刻"的分段视图跟新版工作台的设计初衷（按周期回看）不是一回事。
// "我的里程碑时间线"不再需要 dashMsMineOnly 这个开关——整个"我的"区现在天生就是按查看人筛过的，
// 用不着再单独切换"只看我的"，这个概念本身已经没有存在的必要。
// dashPeriod/dashOffset 是"我的"区和"处室概览"区共用的同一份周期状态，翻期时两区一起变——
// 例会上处长把周期定在"上周"，依次切换查看的人时周期不用重选，就是靠这两个状态不随切人而重置。
let dashPeriod = 'week';
let dashOffset = 0;
// 切换查看的人：只有 view_others_dashboard 权限的人（处室/部门领导、管理员）能改这个值。
// 刻意不写进 DB.settings.me、不进 syncPayload——这纯粹是本地"借他的账号视角看一眼"，
// 不是真的切换身份，处长看着李四的工作台，能编辑的权限依然按处长自己的角色走。
// 空字符串＝看自己；页面刷新/离开工作台页不做特殊重置处理，跟 chartTab 等页面内状态一视同仁。
let dashViewAsPerson = '';
let dashConfigOpen = false;   // 工作台编排配置面板展开着没有（只影响本机，不进共享文件，跟 reportConfigOpen 同理）
// 当前工作台实际在看谁——权限被收回或者压根没这权限时，一律退回看自己，不管 dashViewAsPerson
// 里还留着什么野值（比如权限刚被处长自己关掉，但状态变量里还记着上次切的人）
function dashViewedPerson() {
  return (hasPermission('view_others_dashboard') && dashViewAsPerson) ? dashViewAsPerson : DB.settings.me;
}
// 某个人牵头或参与的全部可见任务——'我的工作台'那票面板、以及甘特图展开按钮的 ACTIONS
// 处理函数都要用同一份口径，抽出来避免各处各写一遍 personUnion('task', t).includes(person)
function dashPersonTasks(person) {
  if (!person) return [];
  return visibleTasks().filter(t => !t.deleted_at && personUnion('task', t).includes(person));
}

/* 工作台"导出季度考核目标"：把这个人当前牵头/参与的工作转换成考核用的"指标"草稿——
   指标粒度定在"工作"这一级，输出纯文本，不进 DB、不影响任何统计口径：
   · 指标名称     = 工作名称，标注这个人在这项工作下是"牵头"还是"参与"（两者都有就都标）
   · 指标详细描述 = 工作自己的"主要工作内容"（work.content）+ 这个人在这项工作下具体
                    牵头/参与了哪些任务的列举——工作本身没有描述字段，任务也没有，
                    这是唯一能拼出"这项指标具体是干什么"的两处素材
   · 当前目标     = 跟随工作台当前选中的周期（周/月/季/年皆可），这项工作下这个人相关的
                    任务里落在这个周期内的具体交付——优先用里程碑的"交付物"文字，任务
                    没挂里程碑就退回"完成XX任务"；逾期还没交的也算进"当前目标"，不然
                    一件明明还欠着的事反而因为不在周期窗口内被过滤掉、看不出来
   · 年度目标     = 同一套提取逻辑，时间窗口换成这批数据所属的那个年度（跟着
                    DB.settings.year 走，不写死"今年"——用户切到别的年度看历史数据时，
                    "年度目标"该说的是那一年，不是系统今天的日期所在的年）
   系统只负责把数据结构化拼出来，不做话术润色——任务标题、交付物文字本来就是操作性描述，
   不是标准考核用语，复制出去之后大概率还需要用户自己按考核要求再改写一遍。 */
function assessmentExtractGoalLines(taskList, rangeStart, rangeEnd, catchOverdue) {
  const lines = [];
  taskList.forEach(t => {
    const ms = DB.milestones.filter(m => !m.deleted_at && m.task === t.id);
    if (ms.length) {
      const qualified = ms.filter(m => m.plan_date && (
        (m.plan_date >= rangeStart && m.plan_date <= rangeEnd) ||
        (catchOverdue && m.done !== '1' && m.plan_date < rangeStart)
      )).sort((a, b) => (a.plan_date || '').localeCompare(b.plan_date || ''));
      if (qualified.length) lines.push(`${t.title}：${qualified.map(m => m.deliverable || '（未填写交付物）').join('、')}`);
    } else if (t.plan_date && (
      (t.plan_date >= rangeStart && t.plan_date <= rangeEnd) ||
      (catchOverdue && isOpen(t) && t.plan_date < rangeStart)
    )) {
      lines.push(`完成${t.title}`);
    }
  });
  return lines;
}
function assessmentIndicatorRole(workTasks, person) {
  const hasLead = workTasks.some(t => dashIsLeadTask(t, person));
  const hasJoin = workTasks.some(t => !dashIsLeadTask(t, person));
  return hasLead && hasJoin ? '牵头+参与' : (hasLead ? '牵头' : '参与');
}
function assessmentIndicatorDesc(work, workTasks, person) {
  const parts = [];
  if (work.content && work.content.length) parts.push(work.content.map((l, i) => `${i + 1}、${l}`).join(' '));
  const led = workTasks.filter(t => dashIsLeadTask(t, person)).map(t => t.title);
  const joined = workTasks.filter(t => !dashIsLeadTask(t, person)).map(t => t.title);
  const roleParts = [];
  if (led.length) roleParts.push(`牵头：${led.join('、')}`);
  if (joined.length) roleParts.push(`参与：${joined.join('、')}`);
  if (roleParts.length) parts.push(roleParts.join('；'));
  return parts.join('；') || '（无补充说明）';
}
const ASSESSMENT_CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十',
  '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
function buildAssessmentGoalsText(person, period, offset) {
  if (!person) return '';
  const tasks = dashPersonTasks(person);
  if (!tasks.length) return `${person} 目前没有牵头或参与任何工作，无法生成考核目标。`;

  const periodLabel = periodLabelFor(period, offset);
  const { start: curStart, end: curEnd } = periodRange(period, offset);
  const targetYear = DB.settings.year || new Date().getFullYear();
  const yearStart = `${targetYear}-01-01`, yearEnd = `${targetYear}-12-31`;

  const byWork = new Map();
  tasks.forEach(t => {
    if (!t.work) return;
    if (!byWork.has(t.work)) byWork.set(t.work, []);
    byWork.get(t.work).push(t);
  });

  const dutyGroups = new Map();
  byWork.forEach((workTasks, workId) => {
    const w = byId('work', workId);
    if (!w || w.deleted_at) return;
    const dutyCode = w.duty || '';
    if (!dutyGroups.has(dutyCode)) dutyGroups.set(dutyCode, []);
    dutyGroups.get(dutyCode).push({ work: w, workTasks });
  });
  if (!dutyGroups.size) return `${person} 目前没有牵头或参与任何工作，无法生成考核目标。`;

  const dutyCodes = [...dutyGroups.keys()].sort((a, b) => a.localeCompare(b));
  const lines = [`科技规划处 · ${person} · ${periodLabel}（${curStart} ～ ${curEnd}）考核目标`, '='.repeat(32), ''];

  dutyCodes.forEach((code, di) => {
    const duty = byId('duty', code);
    const dutyName = duty && !duty.deleted_at ? duty.name : (code || '（未归属职责）');
    lines.push(`${ASSESSMENT_CN_NUM[di] || String(di + 1)}、${dutyName}`);
    lines.push('');
    dutyGroups.get(code)
      .sort((a, b) => (a.work.code || '').localeCompare(b.work.code || ''))
      .forEach((item, wi) => {
        const { work, workTasks } = item;
        lines.push(`　${wi + 1}. ${work.name}（${assessmentIndicatorRole(workTasks, person)}）`);
        lines.push(`　　指标名称：${work.name}`);
        lines.push(`　　指标详细描述：${assessmentIndicatorDesc(work, workTasks, person)}`);
        const curGoals = assessmentExtractGoalLines(workTasks, curStart, curEnd, true);
        lines.push(`　　${periodLabel}目标：${curGoals.length ? curGoals.join('；') : `${periodLabel}内无具体交付节点`}`);
        const yearGoals = assessmentExtractGoalLines(workTasks, yearStart, yearEnd, false);
        lines.push(`　　年度目标：${yearGoals.length ? yearGoals.join('；') : '年内无具体交付节点'}`);
        lines.push('');
      });
  });

  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function daysFromToday(d) {
  return Math.round((new Date(d + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
}
// 甘特图时间轴左边界用："2 个月前"按日历月算，不是简单减 60 天——各月天数不一样，
// 减固定天数在月初/月末会有一两天的偏差，不如直接把月份减 2 交给 Date 构造函数处理
function twoMonthsAgoOffset() {
  const now = new Date();
  return daysFromToday(fmtLocal(new Date(now.getFullYear(), now.getMonth() - 2, now.getDate())));
}
function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
  if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
  return localDay(iso);
}

/* =============================================================
   16.1 工作台编排配置（P80 起）——跟报告页共用同一套"预设 + 区域 + 模块"骨架
   （DEFAULT_REPORT_SECTIONS/reportPresets/reportSections/saveReportConfig 那一套写法），
   独立存一份 DB.dashboardConfig（不跟报告页共用同一份配置——两个页面用途不一样，处室
   领导可能只想开工作台的配置权限、不想开报告页的，绑在一起会互相牵连，见 config_dashboard
   权限跟 config_report 是两个独立的权限点）。

   版式机制原样照抄报告页那一套（1/2/3 倍宽度 + "同行" + 上下移动），不再用"左栏/右栏/
   独占整行"这种工作台专属的说法——两个编排页面用同一套心智模型，会用一个就会用另一个。
   唯一真正新增的是 personScope: 'self'|'all'，受 REPORT_MODULES 里对应模块的 personAware
   约束：'onlyPerson' 的模块永远按 'self' 渲染（哪怕配置里存了别的值），'onlyAll' 的模块
   永远按 'all'，只有 'either' 的模块 admin 真能在两者之间选，见 dashNormalizePersonScope()——
   这样哪怕配置数据被手改坏了，运行时也不会渲染出没意义的组合（比如"人员负荷"被硬摆成按人筛）。
   "看谁的"这件事本身（具体是谁）不归编排管，还是运行时状态 dashViewAsPerson/
   view_others_dashboard，翻周期、切人都不影响编排本身。 */
const DEFAULT_DASHBOARD_SECTIONS = [
  { id: 'sec_mine', title: '我的',
    modules: ['dashMyCards', 'dashMyOpenTasks', 'dashMyDoneSplit', 'dashMyDoingSplit', 'dashMyOverdueSplit', 'dashMyNextPlan', 'dashMyMsTimeline'],
    // dashMyDoneSplit 跟前一个模块（我负责的工作与任务）同行、dashMyOverdueSplit 跟前一个
    // 模块（本期进行中）同行——大致还原改版前"存量+已完成产出"一列、"进行中+逾期"一列的分组感，
    // 下期计划/里程碑时间线不跟谁同行，各自单独一行
    inline: ['dashMyDoneSplit', 'dashMyOverdueSplit'],
    personScope: { dashMyCards: 'self', dashMyOpenTasks: 'self', dashMyDoneSplit: 'self', dashMyDoingSplit: 'self', dashMyOverdueSplit: 'self', dashMyNextPlan: 'self', dashMyMsTimeline: 'self' } },
  { id: 'sec_overview', title: '处室概览',
    // dashOverviewCards 下线后，原来它包的三组内容直接用 periodOverallScope/periodOverallStatus/
    // periodOverallPlan 这三个"本期处室统计"模块摆在这里，报告页那边有改动会自动同步过来。
    // dashDutyTree 本轮合并进 dutyTree（同一份定义，报告页/工作台都能用），dashPeopleLoad
    // 本轮下线（跟 personBars"各人任务量与完成率"重复），不再出现在默认编排里
    modules: ['periodOverallScope', 'periodOverallStatus', 'periodOverallPlan', 'dutyTree', 'recentActivity'],
    inline: [],
    personScope: { periodOverallScope: 'all', periodOverallStatus: 'all', periodOverallPlan: 'all', dutyTree: 'all', recentActivity: 'all' } },
];
const DASHBOARD_DEFAULT_PRESET_NAME = '默认编排';
function dashboardPresets() {
  const c = DB.dashboardConfig;
  const list = (c && Array.isArray(c.presets)) ? c.presets.filter(p => p && p.id) : [];
  return list.length ? list : [{ id: 'dashpreset_default', name: DASHBOARD_DEFAULT_PRESET_NAME, sections: clone(DEFAULT_DASHBOARD_SECTIONS) }];
}
function activeDashboardPreset() {
  const list = dashboardPresets();
  const id = DB.dashboardConfig && DB.dashboardConfig.activeId;
  return list.find(p => p.id === id) || list[0];
}
// personAware 约束下的归一化：onlyPerson 永远 self，onlyAll 永远 all，只有 either 才看
// 存的值——没存过或存了非法值（旧存档、手改坏的数据）一律落到 'all'，这是 either 这批模块
// 升级前本来就有的行为，向后兼容，不会因为升级突然把老编排渲染成一份"全是空的个人视图"
function dashNormalizePersonScope(moduleKey, stored) {
  const m = REPORT_MODULE_MAP[moduleKey];
  if (!m) return 'all';
  if (m.personAware === 'onlyPerson') return 'self';
  if (m.personAware === 'onlyAll') return 'all';
  return stored === 'self' ? 'self' : 'all';
}
// 渲染用的区域清单：写法跟 reportSections() 是同一份（把认不出来的模块 key 滤掉，按
// inline/widths 把 modules 拆成一行行的 rows），多算一份 personScope（每个模块各自
// 归一化后的口径），模块拿哪份数据渲染由 renderDashboard() 按这份 map 查
function dashboardSections() {
  const p = activeDashboardPreset();
  return (p.sections || []).filter(s => s && s.id).map(s => {
    const modules = (s.modules || []).filter(k => REPORT_MODULE_MAP[k]);
    const inline = new Set((s.inline || []).filter(k => REPORT_MODULE_MAP[k]));
    const widths = {};
    Object.entries(s.widths || {}).forEach(([k, v]) => {
      if (modules.includes(k) && (v === 2 || v === 3)) widths[k] = v;
    });
    const personScope = {};
    modules.forEach(k => { personScope[k] = dashNormalizePersonScope(k, (s.personScope || {})[k]); });
    const rows = [];
    modules.forEach((k, i) => {
      if (i > 0 && inline.has(k) && rows.length) rows[rows.length - 1].push(k);
      else rows.push([k]);
    });
    return { id: s.id, title: s.title || '（未命名区域）', modules, inline: [...inline], widths, personScope, rows };
  });
}
/* 保存编排。刻意不进撤销栈（不调 snapshot），理由跟报告页那份一样：编排是配置不是数据，
   Ctrl+Z 半路把它拨回去会让人完全搞不清自己刚才在改什么；要退回原样有"恢复默认编排"这个

async function saveDashboardConfig(mutate) {

}

function renderDashboard() {
  const canViewOthers = hasPermission('view_others_dashboard');
  if (!canViewOthers && dashViewAsPerson) dashViewAsPerson = '';   // 权限被收回时别留着野状态
  const viewedPerson = dashViewedPerson();

  const { start: rangeStart, end: rangeEnd } = periodRange(dashPeriod, dashOffset);

function bucketOf(t) {          // 任务归入哪一段
  if (isOverdue(t)) return 'late';

  if (t.status === 'doing') return 'doing';

function tally(list) {
  const c = { total: list.length, done: 0, doing: 0, late: 0, todo: 0, hold: 0 };
  list.forEach(t => { c[bucketOf(t)]++; });
  c.rate = c.total ? Math.round(c.done / c.total * 100) : 0;

}
// 每个人的"相关任务"= 牵头 ∪ 参与（同一条任务只算一次），这样条长才能反映一个人到底跟多少任务相关，
// 而不是只看他牵头了多少条；牵头数/参与数各自的原始计数额外保留，作为细分参考
function statsByPerson(tasks) {
  const rel = new Map(), leadCount = new Map(), joinCount = new Map();
  tasks.forEach(t => {
    const people = personUnion('task', t);
    const names = people.length ? people : ['（未指派）'];
    names.forEach(nm => { if (!rel.has(nm)) rel.set(nm, []); rel.get(nm).push(t); });
    const o = t.owner || '（未指派）';
    leadCount.set(o, (leadCount.get(o) || 0) + 1);
    (t.assignees || []).forEach(a => joinCount.set(a, (joinCount.get(a) || 0) + 1));
  });
  const names = [...rel.keys()];
  return names.map(nm => ({ name: nm, ...tally(rel.get(nm) || []), lead: leadCount.get(nm) || 0, join: joinCount.get(nm) || 0 }))
    .sort((a, b) => {
      if (a.name === '（未指派）') return 1;
      if (b.name === '（未指派）') return -1;
      return a.name.localeCompare(b.name, 'zh');
    });
}
function tasksOfDuty(tasks, code) {

// SPI（进度绩效指数）= 全部任务"实际进度"之和 ÷ "计划进度"之和，是一个围绕 1 的比值，不是百分比——
// 大于 1 说明整体比计划快，小于 1 说明落后于计划。图表页"按任务/按工作"总览用。
// 单条任务的"计划进度"按 创建时间→计划完成时间 这段时间里、今天已经走过的比例估算；
// 今天已经过了计划完成时间就按 100% 算；没有计划完成时间的任务没法估算"计划进度"，不参与统计。
function computeSPI(tasks) {
  const today = todayStr();
  let sumActual = 0, sumPlanned = 0;
  tasks.forEach(t => {
    if (!t.plan_date) return;
    const actual = Math.max(0, Math.min(100, Number(t.progress) || 0));
    const created = localDay(t.created_at);
    let planned;
    if (!created || t.plan_date <= created) planned = 100;
    else {
      const total = (new Date(t.plan_date + 'T00:00:00') - new Date(created + 'T00:00:00')) / 86400000;
      const elapsed = (new Date(today + 'T00:00:00') - new Date(created + 'T00:00:00')) / 86400000;
      planned = Math.max(0, Math.min(1, elapsed / total)) * 100;
    }
    sumActual += actual;
    sumPlanned += planned;
  });
  return sumPlanned ? sumActual / sumPlanned : null;
}
// 图表页"按任务"用：不分任务，把当前这批任务名下所有里程碑放一起看完成情况
// （已完成 / 未完成且已逾期 / 未完成且未逾期），是里程碑层面的统计，不是任务层面的

// 按交付物的"最高呈报层级"分类统计（跟完成情况是两个不同维度，颜色特意不跟状态色/优先级色重复，避免混淆）
const REPORT_LEVEL_COLORS = ['#c9b8e8', '#8f6bc4', '#5b3a8e'];
// 拆出不依赖 tasks 的版本：deliveredMsLevelPie（只看本期实际交付的那一小批里程碑）要复用同一套统计口径。
// order 可选：给一份层级 code 的顺序表（如 DELIVERED_MS_LEVEL_ORDER），不传就用 REPORT_LEVELS 的原始顺序。
// 颜色始终按 REPORT_LEVELS 里"这个层级本来的位置"取，不随 order 变——同一层级不管在哪张图里顺序如何，
// 颜色都得是同一个，不然容易被当成两码事。
function msReportLevelStatsOf(ms, order) {
  const levels = order ? order.map(v => REPORT_LEVELS.find(rl => rl.v === v)).filter(Boolean) : REPORT_LEVELS;
  return levels.map(rl => ({

    n: ms.filter(m => (m.report_level || 'section') === rl.v).length,
    color: REPORT_LEVEL_COLORS[REPORT_LEVELS.indexOf(rl)],
  }));
}
function msReportLevelStats(tasks) {
  const ids = new Set(tasks.map(t => t.id));
  const ms = DB.milestones.filter(m => !m.deleted_at && ids.has(m.task));
  return msReportLevelStatsOf(ms);
}
function monthKey(iso) { return (iso || '').slice(0, 7); }
/* 待办总量趋势："新增/完成"是流量，看不出积压是否在变大；这里换成存量口径——
   每个时间点"当天为止，还没完成的任务有多少条"，用同一批任务在历史各个快照点重新数一遍。
   granularity: 'month'(近12个月) / 'week'(近12周，周一到周日) / 'day'(近15个自然日)。 */
function backlogAsOf(tasks, dateStr) {
  return tasks.filter(t => {
    const created = localDay(t.created_at);
    if (created && created > dateStr) return false;   // 那天还没建这条任务
    if (t.status === 'hold') return false;   // 挂起不计入待办，跟 isOpen() 的口径保持一致
    if (t.status !== 'done') return true;
    return !t.actual_date || t.actual_date > dateStr;   // 完成日期在那天之后，那天它还算待办
  }).length;
}
function backlogSeries(tasks, granularity) {
  const today = todayStr();
  let buckets;
  if (granularity === 'day') {
    buckets = [];
    for (let i = 14; i >= 0; i--) {
      const ds = offsetDate(-i);
      buckets.push({ m: ds, label: `${+ds.slice(5, 7)}/${+ds.slice(8, 10)}`, end: ds });
    }
  } else if (granularity === 'week') {
    const dow = new Date().getDay();
    const mondayOff = dow === 0 ? -6 : 1 - dow;
    buckets = [];
    for (let i = 11; i >= 0; i--) {
      const start = offsetDate(mondayOff - i * 7), end = offsetDate(mondayOff - i * 7 + 6);
      buckets.push({ m: start, label: `${+start.slice(5, 7)}/${+start.slice(8, 10)}`, end: end < today ? end : today });
    }
  } else {
    const d = new Date();
    d.setDate(1);
    buckets = [];
    for (let i = 11; i >= 0; i--) {
      const dm = new Date(d.getFullYear(), d.getMonth() - i, 1);
      const m = `${dm.getFullYear()}-${String(dm.getMonth() + 1).padStart(2, '0')}`;
      const monthEnd = fmtLocal(new Date(dm.getFullYear(), dm.getMonth() + 1, 0));
      buckets.push({ m, label: (+m.slice(5) === 1 ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月', end: monthEnd < today ? monthEnd : today });
    }
  }
  return buckets.map(b => ({ m: b.m, label: b.label, backlog: backlogAsOf(tasks, b.end) }));
}
/* 近 n 个月，每月计划完成的任务数（按任务 plan_date）+ 每月计划完成的里程碑数（按里程碑 plan_date） */
/* 从当月开始，往后覆盖到最晚一个还有计划完成任务/里程碑的月份（按需延伸，不是固定窗口） */
function planDueSeries(tasks, milestones) {
  const d = new Date();
  d.setDate(1);
  const startM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  const futureMonths = [...tasks.map(t => t.plan_date), ...milestones.map(m => m.plan_date)]
    .map(monthKey).filter(m => m >= startM);
  const endM = futureMonths.length ? futureMonths.reduce((a, b) => a > b ? a : b) : startM;

  const months = [];
  const cur = new Date(d);
  while (true) {
    const m = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}`;
    months.push(m);
    if (m >= endM || months.length >= 120) break;   // 120 个月封顶，防止脏数据里的超远日期把这里拖成死循环
    cur.setMonth(cur.getMonth() + 1);
  }
  return months.map(m => ({
    m,
    label: (+m.slice(5) === 1 ? m.slice(0, 4) + '年' : '') + (+m.slice(5)) + '月',
    tasks: tasks.filter(t => monthKey(t.plan_date) === m).length,
    milestones: milestones.filter(ms => monthKey(ms.plan_date) === m).length,
  }));
}
/* 到期分布：已逾期 + 未来 6 周 + 更远，按周聚合比按天更好读 */
function dueBuckets(tasks) {
  const open = tasks.filter(isOpen);
  const b = [{ label: '已逾期', cls: 'bar-late', n: open.filter(isOverdue).length }];
  // isOverdue() 现在不只看任务自己的计划完成时间，任务下面有里程碑拖期了也算逾期（见 isOverdue 注释）。
  // 这意味着一条任务的 plan_date 可能明明落在"本周内"甚至"更远"，但因为里程碑拖了期，
  // isOverdue(t) 还是 true——如果下面这几个按 plan_date 分的桶不排掉这些任务，
  // 就会在"已逾期"桶和它自己 plan_date 对应的那个桶里各算一次，总数对不上未完成任务数
  for (let w = 0; w < 6; w++) {
    const from = offsetDate(w * 7), to = offsetDate(w * 7 + 6);
    b.push({
      label: w === 0 ? '本周内' : `${w * 7 + 1}-${w * 7 + 7}天`,
      cls: w === 0 ? 'bar-soon' : 'bar-norm',
      n: open.filter(t => !isOverdue(t) && t.plan_date && t.plan_date >= from && t.plan_date <= to).length,
    });
  }
  const far = offsetDate(42);
  b.push({ label: '更远', cls: 'bar-norm', n: open.filter(t => !isOverdue(t) && t.plan_date && t.plan_date > far).length });
  b.push({ label: '无日期', cls: 'bar-norm', n: open.filter(t => !isOverdue(t) && !t.plan_date).length });
  return b;
}
/* 到期分布的粗粒度占比（供饼图用，切太多小段不好看）：逾期 / 本周内 / 更远 / 无日期 */
function dueSummary(tasks) {
  const open = tasks.filter(isOpen);
  const late = open.filter(isOverdue).length;
  const soon = open.filter(t => !isOverdue(t) && t.plan_date && t.plan_date >= todayStr() && t.plan_date <= offsetDate(6)).length;
  const none = open.filter(t => !t.plan_date).length;
  const later = open.length - late - soon - none;
  return [
    { key: 'late', label: '已逾期', n: late, color: 'var(--c-late)' },
    { key: 'soon', label: '本周内', n: soon, color: 'var(--c-soon)' },
    { key: 'later', label: '更远', n: later, color: 'var(--c-doing)' },
    { key: 'none', label: '无日期', n: none, color: 'var(--c-track)' },
  ].filter(x => x.n > 0);
}

// 横向堆叠条（HTML 实现：文字是真实文本，天然响应式）
function hBar(name, c, max, attrs, muted) {

  const todoN = (c.todo || 0) + (c.hold || 0);   // 未开始和挂起视觉上合并成一段，跟图例"未开始/挂起"对应
  const segs = [

    c.doing > 0 ? `<span class="seg seg-doing" style="width:${p(c.doing)}"></span>` : '',
    c.late > 0 ? `<span class="seg seg-late" style="width:${p(c.late)}"></span>` : '',
    todoN > 0 ? `<span class="seg seg-todo" style="width:${p(todoN)}"></span>` : '',
  ].join('');
  return `<div class="bar-row${attrs ? ' clickable' : ''}${muted ? ' bar-row-muted' : ''}"${attrs || ''} title="${esc(tip)}">
    <span class="nm">${esc(name)}</span>
    <span class="track">${segs}</span>
    <span class="num">${c.done}/${c.total} · ${c.rate}%</span></div>`;
}
// 职责推进条：点箭头能展开看这个职责下面各工作各自的推进情况——工作台和报告页共用同一份渲染逻辑，
// 各自传自己的展开状态（Set）和切换用的 data-act 名字，互不影响
function dutyTreeRowsHTML(dutyStat, workStat, expandedSet, toggleAct) {

    }

/* 人员×职责/工作 热力矩阵：跟"各职责/工作推进情况"用同一套职责→工作树状展开，只是每一行
   右边不再是状态进度条，而是横向铺开每个人在这个职责/工作里的"热力度"。
   格子里的数字是这个人在这个职责/工作下牵头+参与的任务数（牵头、参与各自独立计数，
   跟"各人任务量与完成率"同一个口径，不去重"既牵头又参与"这种边界情况）。
   格子颜色深浅按"加权热力值"算——牵头意味着要对这条任务负责，参与只是搭把手，
   所以牵头的权重定成参与的 3 倍：weight = lead*3 + join。
   颜色深浅的基准是整张矩阵（职责行 + 工作行）里出现过的最大加权值，不随展开/折叠变化，
   否则一折叠一展开，同一个格子的深浅会跳来跳去，没法稳定地横向比较。 */
function personDutyWorkHeat(tasks) {
  const dutyMap = new Map(), workMap = new Map();
  const bump = (map, key, person, field) => {
    if (!map.has(key)) map.set(key, new Map());
    const pm = map.get(key);
    if (!pm.has(person)) pm.set(person, { lead: 0, join: 0 });
    pm.get(person)[field]++;
  };
  tasks.forEach(t => {
    const w = byId('work', t.work);
    if (!w) return;
    if (t.owner) { bump(dutyMap, w.duty, t.owner, 'lead'); bump(workMap, w.id, t.owner, 'lead'); }
    (t.assignees || []).forEach(a => { if (!a) return; bump(dutyMap, w.duty, a, 'join'); bump(workMap, w.id, a, 'join'); });
  });
  let maxWeight = 0;
  [...dutyMap.values(), ...workMap.values()].forEach(pm => pm.forEach(v => { maxWeight = Math.max(maxWeight, v.lead * 3 + v.join); }));
  return { dutyMap, workMap, maxWeight: maxWeight || 1 };
}
function matrixHeatCellHTML(pm, person, maxWeight, actAttrs) {
  const v = (pm && pm.get(person)) || { lead: 0, join: 0 };
  const n = v.lead + v.join;
  if (!n) return `<td class="matrix-cell matrix-cell-empty"></td>`;
  const weight = v.lead * 3 + v.join;
  const ratio = Math.min(1, weight / maxWeight);
  const alpha = (0.16 + ratio * 0.74).toFixed(2);
  const tip = `${person}：牵头 ${v.lead} · 参与 ${v.join}（加权热力 ${weight}）`;
  return `<td class="matrix-cell clickable" style="background:rgba(44,95,138,${alpha})" data-act="matrix-cell-filter"${actAttrs} title="${esc(tip)}">${n}</td>`;
}
function personMatrixHTML(dutyStat, workStat, people, heat, expandedSet, toggleAct) {
  if (!dutyStat.length) return '<div class="empty-mini">暂无数据</div>';
  if (!people.length) return '<div class="empty-mini">还没有任何人员</div>';
  /* 列宽必须靠 <colgroup> 定，不能只指望每个 <td>/<th> 自己声明 width——table-layout 默认是 auto，
     浏览器按内容自动摊算列宽，per-cell 的 width 只是个建议，长职责名照样能把列撑开；
     加了 table-layout:fixed 之后，列宽改成完全由第一次出现的宽度声明（也就是这里的 colgroup）
     决定，跟内容长短、跟哪一行的 class 是什么都没关系，这才是真正稳定的做法。 */
  const colgroup = `<colgroup><col class="col-label">${people.map(() => '<col class="col-person">').join('')}</colgroup>`;
  const head = `<tr><th class="matrix-row-label">职责 / 工作</th>${people.map(p => `<th>${esc(p)}</th>`).join('')}</tr>`;
  const rows = dutyStat.map(x => {
    const dutyWorks = workStat.filter(w => w.duty === x.code).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
    const isOpen = expandedSet.has(x.code);
    const caret = dutyWorks.length
      ? `<span class="sb-caret" data-act="${toggleAct}" data-code="${esc(x.code)}">${isOpen ? '▾' : '▸'}</span>`
      : `<span class="sb-caret"></span>`;
    const dutyPm = heat.dutyMap.get(x.code);
    const dutyRow = `<tr><td class="matrix-row-label">${caret}<span title="${esc(x.name)}">${esc(x.name)}</span></td>`
      + people.map(p => matrixHeatCellHTML(dutyPm, p, heat.maxWeight, ` data-duty="${esc(x.code)}" data-person="${esc(p)}"`)).join('')
      + `</tr>`;
    let workRows = '';
    if (isOpen && dutyWorks.length) {
      workRows = dutyWorks.map(w => {
        const workPm = heat.workMap.get(w.id);
        return `<tr><td class="matrix-row-label matrix-row-work"><span title="${esc(w.name)}">${esc(w.name)}</span></td>`
          + people.map(p => matrixHeatCellHTML(workPm, p, heat.maxWeight, ` data-work="${esc(w.id)}" data-person="${esc(p)}"`)).join('')
          + `</tr>`;
      }).join('');
    }
    return dutyRow + workRows;
  }).join('');
  return `<div class="matrix-wrap"><table class="matrix-table">${colgroup}${head}${rows}</table></div>`;
}
// 跟工作台顶部大卡片同一套 .cards/.card 样式，报告页"本期总览"也用这个，别再单独整一份数字排一行的样式
// attrs 传了就整张卡片可点（配 .card.clickable 的悬浮样式），不传就是原来的纯展示卡片
function statCard(k, v, cls, attrs) {
  return `<div class="card${attrs ? ' clickable' : ''}"${attrs || ''}><div class="k">${esc(k)}</div><div class="v ${cls || ''}">${v}</div></div>`;
}
// "本期涉及 X / 处室总数 Y"这类跨级分数卡片的取值格式，配 statCard 用（statCard 的 v 本来就不转义，
// 直接拼小标签进去）；分母部分调小、调暗，视觉上一眼分清"这期占了多少"还是"总共有多少"
function fracStr(num, den) { return `${num}<span class="frac-den">/${den}</span>`; }
// 职责总数是纯全局概念，不随"按人/按整体"变化——一个人不会"拥有"若干条职责，只会牵头/参与
// 若干条工作，所以这个数跟 buildReportData 的 person 参数无关，直接用这个小函数现查即可
function visibleDutyCount() { return DB.duties.filter(x => !x.deleted_at).length; }
// 任务状态四分（已完成/进行中/未开始/逾期，逾期优先判定、互斥、加起来等于传入任务总数）：
// 工作台"整体统计卡片"（全量口径）和报告页"本期完成进度"（periodTasks 口径）原来各写了一份
// 一模一样的 forEach，这里合并成一个函数，喂什么任务列表进去就按什么口径统计
function taskStatusBreakdown(tasks) {
  const s = { done: 0, doing: 0, todo: 0, late: 0 };
  tasks.forEach(t => {
    if (isOverdue(t)) s.late++;
    else if (t.status === 'done') s.done++;
    else if (t.status === 'doing') s.doing++;
    else s.todo++;
  });
  return s;
}
// 里程碑没有"进行中/未开始"这种连续状态，只有"完成没完成"，未完成的再拆"逾期"和"还没到期"——
// 跟任务的四态不是同一套词，所以单独一个函数，别硬凑成任务那四个桶
function msStatusBreakdown(msList) {
  const today = todayStr();
  const s = { done: 0, overdue: 0, notDue: 0 };
  msList.forEach(m => {
    if (m.done === '1') s.done++;
    else if (m.plan_date && m.plan_date < today) s.overdue++;
    else s.notDue++;
  });
  return s;
}
const statusLegend = `<div class="legend">
  <span><i style="background:var(--c-done)"></i>已完成</span>
  <span><i style="background:var(--c-doing)"></i>进行中</span>
  <span><i style="background:var(--c-late)"></i>逾期</span>
  <span><i style="background:var(--c-todo)"></i>未开始/挂起</span></div>`;

// 图表/表格切换头
function panelHead(title, id, note) {
  const isTable = chartTableView[id];
