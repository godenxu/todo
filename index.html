function openTaskDetail(id, draft) {
  const isNew = !!draft;
  const t = isNew ? draft : byId('task', id);
  if (!t) return;
  // 不是自己负责/参与的任务：得有 view_others_detail 权限才能打开详情弹窗（表格行本身仍然看得到，这条只管详情弹窗）
  if (!isNew && !isRecordOwnerOrParticipant('task', t) && !hasPermission('view_others_detail')) {
    showSnack('为了防止误操作，暂时不能查看他人任务的详情');
    return;
  }
  const canEdit = isNew || canEditRecord('task', t);   // 查看谁都能看，只有负责人/参与人或组长以上能改
  const fs = schema('task').fields.filter(f => !f.internal);
  // "work" 字段自己有专门的分支（下面 cell() 里），不走这条通用判断，这里只管其它走通用渲染的字段
  const wide = k => k === 'title';
  // 有检查点时进度由检查点完成比例自动算，这里就不给手改的控件了
  const lockProgress = f => f.key === 'progress' && hasCheckpoints(t);
  const w = byId('work', t.work);
  const existingCps = DB.milestones.filter(m => m.task === t.id && !m.deleted_at)
    .sort((a, b) => (a.plan_date || '9999-99-99').localeCompare(b.plan_date || '9999-99-99'));
  const cell = f => {
    if (f.type === 'checkpoints') {
      if (!canEdit) {
        const listHTML = existingCps.length ? `<div class="ms-list">${existingCps.map(m => {
          const levelLabel = (REPORT_LEVELS.find(r => r.v === m.report_level) || {}).label || '';
          const overdue = m.done !== '1' && m.plan_date && m.plan_date < todayStr();
          const lateDays = overdue ? -daysFromToday(m.plan_date) : 0;
          // 逾期的里程碑不能只靠文字变红——整行给个浅红底 + 左边一道红条，一眼扫过去就能看出这行不一样
          return `<div class="ms-item${overdue ? ' ms-item-overdue' : ''}">
            <span class="ms-date"${overdue ? ' style="color:var(--overdue)"' : ''}>${esc(m.plan_date || '无日期')}</span>
            <span class="ms-deliv">${esc(m.deliverable || '（未填写交付物）')}</span>
            ${levelLabel ? `<span class="ms-level">${esc(levelLabel)}</span>` : ''}
            <span class="ms-status"${m.done === '1' ? ' style="color:var(--done)"' : (overdue ? ' style="color:var(--overdue);font-weight:700"' : '')}>${m.done === '1' ? `✓ 已交付${m.actual_date ? '（' + esc(m.actual_date) + '）' : ''}` : (overdue ? `⚠ 已逾期 ${lateDays} 天` : '未交付')}</span>
          </div>`;
        }).join('')}</div>` : `<div class="hint" style="padding:4px 0">暂无里程碑</div>`;
        return `<label>${esc(f.label)}</label><div class="full">${listHTML}</div>`;
      }
      // 可编辑：里程碑行直接摆在详情表单里一起编辑，不再跳到单独的弹窗；保存按钮统一提交。
      // 每行前面的 ⠿ 可以按住上下拖动调整顺序，＋ 可以在这一行下面插入新的一条——每行都有了，
      // 就不再需要底部单独一个"添加一条"的按钮；标签本身也挪到单独一行、左对齐，摆在第一条里程碑上方
      return `<div class="full-row"><label class="cp-section-label">${esc(f.label)}</label></div>
        <div class="full-row">
          <div id="cp-list">${(existingCps.length ? existingCps : [null]).map(cpRowHTML).join('')}</div>
          <div id="cp-progress-preview" class="hint" style="margin-top:4px"></div>
        </div>`;
    }
    if (f.key === 'work' && f.type === 'ref') {
      const curDuty = w ? w.duty : '';
      if (!canEdit) {
        const dutyDisplay = w ? `${w.duty} ${(byId('duty', w.duty) || {}).name || ''}` : '未归属';
        return `<label>所属职责</label><div><span class="detail-ro">${esc(dutyDisplay)}</span></div>
          <label>${esc(f.label)}</label><div class="full"><span class="detail-ro">${esc(w ? (w.code + ' ' + w.name) : '未归属')}</span></div>`;
      }
      // 所属职责和所属工作两级联动：先选职责，工作的选项跟着只列这个职责下的（见下面给 #td-duty 绑的 change）
      const duties = DB.duties.filter(d => !d.deleted_at)
        .sort((a, b) => String(a.code || '').localeCompare(String(b.code || '')));
      return `<label for="td-duty">所属职责</label>
        <div><select id="td-duty"><option value="">（未归属）</option>${duties.map(d =>
          `<option value="${esc(d.code)}"${d.code === curDuty ? ' selected' : ''}>${esc(d.code + ' ' + d.name)}</option>`).join('')}</select></div>
        <label for="td-work">${esc(f.label)}</label>
        <div class="full"><select id="td-work">${workOptionsHTML(curDuty, t.work)}</select></div>`;
    }
    if (f.key === 'progress') {
      const locked = lockProgress(f);
      if (!canEdit) {
        return `<label>${esc(f.label)}</label>
          <div><span class="detail-ro">${esc(t.progress)}%${locked ? '（由检查点自动计算）' : ''}</span></div>`;
      }
      if (locked) {
        // 有检查点时进度不能手改，但"已完成"按钮还是有意义的——效果等同于把所有检查点都勾完，
        // 勾完之后进度自然就是 100%（跟没有检查点时点"已完成"直接把进度设成 100% 是同一个效果）
        return `<label>${esc(f.label)}</label>
          <div class="progress-edit-row"><span class="detail-ro" id="td-progress-locked">${esc(t.progress)}%（由检查点自动计算）</span>
          <button type="button" class="btn" data-act="cp-mark-all-done">已完成</button></div>`;
      }
      return `<label for="td-progress">${esc(f.label)}</label>
        <div class="progress-edit-row">${fieldControl(f, t.progress, 'td-')}<span class="unit-suffix">%</span>
        <button type="button" class="btn" data-act="progress-set-done">已完成</button></div>`;
    }
    // 状态、优先级、计划完成时间挤在同一行显示——这三项放一起看比较顺手，不用各占一行上下翻
    if (['status', 'priority', 'plan_date'].includes(f.key)) {
      if (f.key !== 'status') return '';   // 优先级、计划完成时间跟着 status 一起渲染，这里不再单独出现
      const miniCell = ff => {
        const isRo = ff.readonly || !canEdit;
        return `<div class="inline-field"><label for="td-${ff.key}">${esc(ff.label)}</label>
          <div>${isRo ? `<span class="detail-ro">${esc(t[ff.key] || '—')}</span>` : fieldControl(ff, t[ff.key], 'td-')}</div></div>`;
      };
      // 任务自己的计划完成时间可能还没到，但名下有里程碑拖期了，isOverdue(t) 一样判定这条任务逾期
      // （见 isOverdue 的注释）——这种情况必须在计划完成时间旁边说清楚"为什么"，不然会觉得莫名其妙：
      // 明明日期还没到，怎么工作台/图表页都把它算成逾期了
      const msLateOnly = isOverdue(t) && !(t.plan_date && t.plan_date < todayStr());
      return `<div class="full-row"><div class="inline-fields-row">
        ${miniCell(f)}${miniCell(fieldDef('task', 'priority'))}${miniCell(fieldDef('task', 'plan_date'))}
      </div></div>
      ${msLateOnly ? `<div class="full-row"><div class="hint" style="color:var(--overdue);font-weight:700">
        ⚠ 本任务自己的计划完成时间还没到，但下面有里程碑已经逾期，所以仍判定为逾期任务
      </div></div>` : ''}`;
    }
    const ro = f.readonly || !canEdit;
    return `<label for="td-${f.key}">${esc(f.label)}</label>
      <div class="${wide(f.key) ? 'full' : ''}">${ro
        ? `<span class="detail-ro">${esc(t[f.key] || '—')}</span>`
        : fieldControl(f, t[f.key], 'td-')}</div>`;
  };

  $('#modal-box').classList.add('wide');
  openModal(isNew ? '新建任务' : '任务详情',
    `<div class="detail-grid">${fs.map(cell).join('')}</div>
     ${peopleDatalist()}
     <div class="detail-meta">
       ${isNew
         ? '任务编号会在选定所属工作后自动生成；里程碑/交付物可以现在填，也可以创建后再补。'
         : `创建：${esc(localDay(t.created_at))}　·
            最后修改：${esc(localDay(t.updated_at))} by ${esc(t.updated_by || '—')}
            ${canEdit ? '' : '　·　<span style="color:var(--text3)">只读：不是你负责/参与的任务</span>'}`}
     </div>`,
    isNew ? '创建' : (canEdit ? '保存' : '关闭'), async () => {
      if (!canEdit) { closeModal(); return; }
      // 弹确认框会顶掉这个弹窗自己的 DOM（modal 只有一个槽位），所以要先把所有字段/里程碑的待存值读出来，
      // 而不是等确认完了再回来读——那时候 td-* 这些输入框已经不在了
      const collected = {};
      fs.forEach(f => {
        if (f.type === 'checkpoints' || f.readonly || lockProgress(f)) return;
        const v = readControl(f, 'td-');
        if (v !== undefined) collected[f.key] = v;
      });
      const cpRows = $$('#cp-list [data-cp-row]');
      const cpData = cpRows.map(r => ({
        id: (r.getAttribute && r.getAttribute('data-ms-id')) || '',   // 空字符串 = 界面上新加的一行，还没有对应记录
        // 数字文本框没有原生 date 控件那种"要么合法要么空"的保证，读的时候顺手校验/清理一遍
        plan_date: normalizeMaskedDateValue(r.querySelector('.cp-date').value),
        deliverable: r.querySelector('.cp-deliv').value.trim(),
        report_level: r.querySelector('.cp-report-level').value,
        done: r.querySelector('.cp-chk').checked ? '1' : '0',
      })).filter(d => d.plan_date || d.deliverable);
      const pendingOwner = 'owner' in collected ? collected.owner : t.owner;
      if (isNew && !(collected.title || '').trim()) { showSnack('任务标题不能为空'); return; }
      const doSave = async () => {
        snapshot();
        const before = clone(t);
        // 变更摘要用「日期+交付物」做比对（只是给人看的描述，不参与实际增删——那个按 id 走，见下面 Repo.bulk 里）
        const cpKey = c => c.plan_date + '|' + c.deliverable;
        const beforeKeys = new Set(existingCps.map(cpKey));
        const afterKeys = new Set(cpData.map(cpKey));
        const added = cpData.filter(c => !beforeKeys.has(cpKey(c))).map(c => c.deliverable || c.plan_date).filter(Boolean);
        const removed = existingCps.filter(c => !afterKeys.has(cpKey(c))).map(c => c.deliverable || c.plan_date).filter(Boolean);
        const beforeDoneN = existingCps.filter(c => c.done === '1').length;
        const afterDoneN = cpData.filter(c => c.done === '1').length;
        const cpParts = [];
        if (cpData.length !== existingCps.length) cpParts.push(`检查点数：${existingCps.length}→${cpData.length}`);
        if (afterDoneN !== beforeDoneN) cpParts.push(`已完成：${beforeDoneN}→${afterDoneN}`);
        if (added.length) cpParts.push(`新增「${added.join('、')}」`);
        if (removed.length) cpParts.push(`移除「${removed.join('、')}」`);
        let dateAdjustedMsg = '';
        await Repo.bulk(() => {
          Object.assign(t, collected);
          if (isNew) {
            // 草稿这时候才真正入库：牵头人没填的话按"谁建的任务、归在哪项工作下"给个合理默认值；
            // 编号在下面统一处理，不在这里单独判断
            if (!t.owner) t.owner = defaultTaskOwner(t.work);
            DB.tasks.push(t);
          }
          /* ★ 编号只在这两种情况下(重新)生成 ★
             1) 所属工作确实变了——不管是从没选到选了、还是换成了另一个工作，都跟网格上单独改
                "所属工作"那一格（wpCommit/批量改所属工作）保持一致的规则：工作一变，编号跟着重生成；
             2) 这是一条新任务、打开表单时工作就已经带进来了（比如从某项工作下面点"新建任务"）、
                还从没编过号——这种情况下面第 1 条判断不出"变没变"（前后都是同一个工作），
                单独补一条件兜底，覆盖"新建时按所属工作直接生成编号"这个最常见的场景。
             工作没变、也不是新任务时绝对不能重算：nextTaskCode 是按"当前已用的最大号 +1"算的，
             这条任务自己的旧编号本来就算在"已用"里，不看工作有没有变就重算，编号会一直往上跳。
             没选工作（t.work 为空）就没有编号可编，跟原来"暂不编号"的行为保持一致。 */
          if (t.work !== before.work || (isNew && !t.code)) {
            t.code = t.work ? nextTaskCode(t.work) : '';
          }
          /* ★ 按 id 就地更新，绝对不能再"整批删掉重建" ★
             重建方案会让保存变成非幂等的：同一份内容存两次就多一整套重复里程碑。
             真出过事故——保存要等一次共享文件读写，用户以为没反应就多点了几下，
             一条任务下就凭空多出好几套一模一样的里程碑（详见 cpRowHTML 里 data-ms-id 那段注释）。
             现在：界面上还在的按 id 更新，界面上被删掉的才软删除，只有真正新加的行才建新记录。 */
          const keepIds = new Set(cpData.map(c => c.id).filter(Boolean));
          existingCps.forEach(m => { if (!keepIds.has(m.id)) softDelete('milestone', m.id); });
          cpData.forEach(cd => {
            const cur = cd.id ? byId('milestone', cd.id) : null;
            if (cur) {
              cur.task = t.id;   // 新建任务时草稿 id 才最终确定，老里程碑要跟着认领过去
              cur.plan_date = cd.plan_date;
              cur.deliverable = cd.deliverable;
              cur.report_level = cd.report_level;
              cur.done = cd.done;
              // 已完成的保留原来的实际完成日期（别把历史抹成今天），从完成改回未完成就清掉
              cur.actual_date = cd.done === '1' ? (cur.actual_date || todayStr()) : '';
              if (cur.deleted_at) delete cur.deleted_at;   // 上一次误删的又被提交回来，等于撤销删除
              stampMeta(cur);
            } else {
              DB.milestones.push(stampMeta(blank('milestone', {
                task: t.id, plan_date: cd.plan_date, deliverable: cd.deliverable, report_level: cd.report_level, done: cd.done,
                actual_date: cd.done === '1' ? todayStr() : '',
              })));
            }
          });
          recalcProgress(t);
          // 里程碑的计划日期不该晚于任务自己的"计划完成时间"——这在逻辑上说不通（东西还没到，任务却已经算完成了）。
          // 出现这种情况就把任务的计划完成时间顺延到最晚那个里程碑的日期，而不是留着这个不合理的状态不管
          const latestMs = cpData.reduce((mx, c) => (c.plan_date && c.plan_date > mx) ? c.plan_date : mx, '');
          if (latestMs && (!t.plan_date || latestMs > t.plan_date)) {
            dateAdjustedMsg = `计划完成时间已顺延至 ${latestMs}（有里程碑排在了原计划之后）`;
            t.plan_date = latestMs;
          }
          // 进度和状态在这里统一对账：不管进度是刚才手改的，还是靠上面 recalcProgress
          // 从检查点完成比例算出来的，都不该出现"进度 100% 却还挂着未开始/进行中"这种矛盾状态
          reconcileStatusAndProgress(t, before);
          stampMeta(t);
          // ★ pushLog 必须挪进 Repo.bulk 的回调里，跟任务/里程碑的改动同一批持久化 ★
          // 以前它是在 await Repo.bulk(...) 之后才调用的：那时候这次保存该同步的都已经同步完了，
          // 这条"最近动态"记录反而要等到下一次保存（不管是谁、改了什么）才会顺便被推上去。
          // 管理员恰恰是靠"最近动态"确认同事有没有在动东西的，任务数据和这条记录如果不是
          // 同一次推上去的，管理员这次同步看到了任务变化、却看不到对应的动态说明是谁改的，
          // 会显得比实际情况更让人摸不着头脑
          pushLog(t.id, isNew ? `新建任务「${t.title}」` : [diffTask(before, t), cpParts.join('；')].filter(Boolean).join('；'));
        });
        closeModal();
        if (isNew && UI.tasks.view === 'deleted') UI.tasks.view = 'all';   // 新建完却停在"已删除"视图里会看不见刚建的任务
        renderShell(); renderPage();
        showSnack([isNew ? `已创建：${t.title}` : '已保存', dateAdjustedMsg].filter(Boolean).join('，'));
      };
      const proceedAfterOrderCheck = async () => {
        // 新建时不存在"把任务从别人手里转走"这回事，跳过转移确认
        if (!isNew && ownerChangeNeedsWarning(t, pendingOwner)) { confirmOwnerChange(doSave); return; }
        await doSave();
      };
      const proceedToSave = async () => {
        const orderIssue = findCpOrderIssue(cpData);
        if (orderIssue) {
          confirmModal('里程碑顺序看起来不太对', `${orderIssue}，仍然要保存吗？`, '仍然保存', proceedAfterOrderCheck, true);
          return;
        }
        await proceedAfterOrderCheck();
      };
      /* 在详情弹窗里把状态改成"已完成"（新建任务也算：草稿状态一开始就是 done 的话同样要问）：
         计划/实际完成时间缺了就自动补今天，里程碑没勾完就一并勾完（不提供只补日期、不动
         里程碑的选项，否则确认完还是会出现"任务已完成、里程碑却没完成"这种矛盾状态）——
         跟任务页列表直接改状态走的是同一套判断（doneAutoFillNeeded/openDoneAutoFillModal），
         行为保持一致。用 collected/cpData 里"即将保存"的值判断，而不是 t 上的旧值：
         用户可能刚在表单里把计划完成时间填上、或者刚把最后一个里程碑勾完，这些还没真正落库，
         但已经不该再被当成"缺了"。 */
      const finalStatus = 'status' in collected ? collected.status : t.status;
      if (finalStatus === 'done' && t.status !== 'done') {
        const planMissing = !(('plan_date' in collected) ? collected.plan_date : t.plan_date);
        const actualMissing = !(('actual_date' in collected) ? collected.actual_date : t.actual_date);
        const cpIncompleteN = cpData.filter(c => c.done !== '1').length;
        if (planMissing || actualMissing || cpIncompleteN) {
          openDoneAutoFillModal(planMissing, actualMissing, cpIncompleteN, async () => {
            if (planMissing) collected.plan_date = todayStr();
            if (actualMissing) collected.actual_date = todayStr();
            cpData.forEach(c => { c.done = '1'; });
            await proceedToSave();
          });
          return;
        }
      }
      await proceedToSave();
    });
  bindDutyWorkCascade();
  setTimeout(() => { const el = $('#td-title'); if (el) { el.focus(); el.select(); } }, 60);
  updateCpProgressPreview();
}
// 任务详情里"所属职责"一变，"所属工作"的选项就只列这个职责下的工作。
// 这个 change 只能在弹窗内容渲染完之后绑，所以单独拎出来一个函数
function bindDutyWorkCascade() {
  const ds = $('#td-duty');
  if (!ds) return;
  ds.addEventListener('change', () => {
    const ws = $('#td-work');
    if (ws) { ws.innerHTML = workOptionsHTML(ds.value, ''); ws.value = ''; }
  });
}

/* =============================================================
   21c. 年度复制 / 未归属指派 / 数据体检 / 备份
   ============================================================= */

/* ---- 复制工作到新年度 ----
   编号沿用（工作主键是随机 id，故同编号可跨年共存）；
   复制工作与其里程碑结构，任务不带过来。 */
function openYearCopy() {
  const years = uniq(DB.works.filter(w => !w.deleted_at).map(w => w.year).filter(Boolean)).sort((a, b) => b - a);
  const src = DB.settings.year || years[0] || new Date().getFullYear();
  const list = DB.works.filter(w => !w.deleted_at && w.year === src);
  if (!list.length) { showSnack(`${src} 年度没有工作可复制`); return; }

  openModal('复制到新年度', `
    <div class="form-row"><label>源年度</label>
      <select id="yc-src">${years.map(y => `<option value="${y}"${y === src ? ' selected' : ''}>${y} 年度（${DB.works.filter(w => !w.deleted_at && w.year === y).length} 项）</option>`).join('')}</select></div>
    <div class="form-row"><label>目标年度</label><input id="yc-dst" type="number" value="${src + 1}"></div>
    <div class="form-row"><label>源年度处理</label>
      <select id="yc-arch"><option value="keep">保持不变</option><option value="done">标记为已完成</option></select></div>
    <div style="margin:6px 0 4px;font-size:12px;color:var(--text2)">选择要沿用的工作
      <span class="toggle-view" id="yc-all" style="margin-left:8px">全选 / 全不选</span></div>
    <div class="col-cfg" style="grid-template-columns:1fr;max-height:240px;overflow:auto">
      ${list.map(w => `<div class="it"><input type="checkbox" class="yc-cb" id="yc-${w.id}" value="${esc(w.id)}" checked>
        <label for="yc-${w.id}">${esc(w.code)} ${esc(w.name)}${w.owner ? ` <span style="color:var(--text3)">· ${esc(w.owner)}</span>` : ''}</label></div>`).join('')}
    </div>
    <div class="hint" style="margin-top:8px">编号沿用不变（同一编号可在不同年度并存）。
    工作内容、牵头人、参与人会一并复制；<b>只带工作本身，任务和里程碑都不复制，新年度从头梳理</b>。</div>`,
    '复制', async () => {
      const dst = Number($('#yc-dst').value);
      const srcY = Number($('#yc-src').value);
      if (!dst || dst === srcY) { showSnack('目标年度不能为空或与源年度相同'); return; }
      const ids = [...document.querySelectorAll('.yc-cb:checked')].map(cb => cb.value);
      if (!ids.length) { showSnack('请至少选择一项工作'); return; }
      const arch = $('#yc-arch').value;
      closeModal();
      snapshot();
      let nw = 0;
      await Repo.bulk(() => {
        ids.forEach(id => {
          const w = byId('work', id);
          if (!w) return;
          const copy = blank('work', {
            code: w.code, duty: w.duty, name: w.name, content: [...(w.content || [])],
            owner: w.owner, collaborators: [...(w.collaborators || [])],
            year: dst, status: 'doing',
          });
          stampMeta(copy);
          DB.works.push(copy);
          nw++;
          if (arch === 'done') { w.status = 'done'; stampMeta(w); }
        });
      });
      DB.settings.year = dst;
      await Repo.persist(DB);
      renderShell(); renderPage();
      showSnack(`已复制 ${nw} 项工作到 ${dst} 年度（Ctrl+Z 可撤销）`);
    });
  setTimeout(() => {
    const all = $('#yc-all');
    if (all) all.addEventListener('click', () => {
      const cbs = [...document.querySelectorAll('.yc-cb')];
      const on = cbs.some(c => !c.checked);
      cbs.forEach(c => { c.checked = on; });
    });
  }, 40);
}
// 日期加 n 年，2/29 落到平年时退到 2/28
function shiftYear(ds, n) {
  const [y, m, d] = ds.split('-').map(Number);
  const days = new Date(y + n, m, 0).getDate();
  return `${y + n}-${String(m).padStart(2, '0')}-${String(Math.min(d, days)).padStart(2, '0')}`;
}

/* ---- 未归属工作的任务：批量指派 ---- */
function openOrphanAssign() {
  const orphans = DB.tasks.filter(t => !t.deleted_at && (!t.work || !byId('work', t.work)));

    <div class="col-cfg" style="grid-template-columns:1fr;max-height:240px;overflow:auto">
      ${orphans.map(t => `<div class="it"><input type="checkbox" class="oa-cb" id="oa-${t.id}" value="${esc(t.id)}" checked>

      cbs.forEach(c => { c.checked = on; });

/* =============================================================
   数据体检
   =============================================================
   ★ 三条铁律（这是"体检不会误删有效数据"的全部依据）★

   1) 体检本身永远只读。healthCheck() 只查不改，任何修复都必须是用户显式点一次按钮的独立动作。
   2) 体检只认【客观事实】，不做任何启发式猜测。判据全是"这条记录指向的东西存不存在"
      这种可证伪的问题，不存在"看起来像是没用了"这类主观判断——这是防误删最根本的一道防线。
   3) 用户自己删掉的东西（软删除记录）不归体检管。那是回收站的地盘（见 recycleBin），
      由用户按保留期显式清理。体检去动那些数据，就变成了"体检误删"——正是要避免的事。

   分级：
   · error 🔴 引用断裂 / 状态不一致——数据本身是坏的，该修
   · warn  🟡 重复、日期矛盾、进度与状态对不上——不一定是错，但值得看一眼
   · info  ⚪ 纯提示（未归属、缺日期），没有"修复"这一说，只是让人知道有这么回事

   undoable：这一项的修复动作能不能 Ctrl+Z 退回来。软删除/改字段类都能；
   彻底删除类不能，所以它们额外要走连接检查 + 备份检查 + 二次确认（见 purgeHealth）。 */
const HEALTH_META = {
  orphanTask:        { level: 'error', undoable: true },
  orphanMs:          { level: 'error', undoable: false },   // 彻底删除，退不回来
  taskOfDeletedWork: { level: 'error', undoable: true },
  msOfDeletedTask:   { level: 'error', undoable: true },
  badDuty:           { level: 'error', undoable: true },
  dupCode:           { level: 'error', undoable: true },
  dupTask:           { level: 'warn',  undoable: true },
  dupWork:           { level: 'warn',  undoable: true },
  dupMs:             { level: 'warn',  undoable: true },
  msLateThanTask:    { level: 'warn',  undoable: true },
  progressMismatch:  { level: 'warn',  undoable: true },
  noDateHasMs:       { level: 'warn',  undoable: true },
  noWork:            { level: 'info',  undoable: true },
  noDate:            { level: 'info',  undoable: true },
};
const HEALTH_LEVELS = {
  error: { icon: '🔴', label: '需要修复', desc: '引用断裂或状态不一致，数据本身是坏的' },
  warn:  { icon: '🟡', label: '建议查看', desc: '不一定是错，但值得核对一眼' },
  info:  { icon: '⚪', label: '仅供了解', desc: '只是告诉你有这么回事，没有"修复"一说' },
};
function healthMeta(k) { return HEALTH_META[k] || { level: 'warn', undoable: true }; }

/* ---- 数据体检：找出引用断裂与明显异常 ---- */
/* ★ 体检结果里"哪些数据有问题"要能看得到，不只是一个数字 ★
   以前每一项体检结果只有一句话 + 一个数（"12 条任务指向了不存在的工作"），要修复只能整批点下去，
   压根不知道具体是哪几条、点了会动到谁。对着一个不认识的数字按"一键修复"，出了事故也不知道该找谁核实。
   这里给每一项都挂一份 items 明细（任务/工作能定位到具体记录的，点了可以跳过去看；
   跳不到具体页面的——比如孤儿里程碑，它的任务本来就不存在了——就摆一行说明文字，好歹能核对内容对不对。 */
function taskItem(t) {
  return { id: t.id, label: `${t.code ? t.code + ' ' : ''}${t.title || '（无标题）'}`, act: 'focus-task' };
}
// 数据页里哪几项体检的"查看明细"是展开的——纯 UI 状态，不用持久化，刷新一次就该收起来
let _healthExpanded = new Set();
function healthCheck() {
  const issues = [];
  const orphanTasks = DB.tasks.filter(t => !t.deleted_at && t.work && !byId('work', t.work));
  if (orphanTasks.length) issues.push({ k: 'orphanTask', n: orphanTasks.length, msg: `${orphanTasks.length} 条任务指向了不存在的工作`, fix: '清空这些任务的所属工作',
    items: orphanTasks.map(taskItem) });

  const noWork = DB.tasks.filter(t => !t.deleted_at && !t.work);
  if (noWork.length) issues.push({ k: 'noWork', n: noWork.length, msg: `${noWork.length} 条任务未归属任何工作`, fix: null,
    items: noWork.map(taskItem) });

  /* ★ 无主里程碑：所属任务的记录已经完全不存在了（不是"被删了"，是连那条记录都查不到）★

     这一类刻意【连已经软删除的一起算进来】，而且清理方式是彻底删除，不是软删除——两个改动都有原因：

     1) 软删除对这一类毫无意义。里程碑只能从所属任务的详情弹窗里看到和恢复，而它的任务
        连记录都没有了，界面上永远打不开、永远恢复不了。给它盖一个 deleted_at，
        只是把一条谁也够不着的垃圾从"计入统计的垃圾"变成"不计入统计的垃圾"，
        它在共享文件里还是原样占着体积。
     2) 处里反映共享 JSON 越来越大、里面一堆对不上任务的里程碑，就是这么攒起来的：
        早期"删任务不连带删里程碑"（现在已经修了，见 cascadeSoftDeleteTask）留下一批，
        后来体检把它们软删除，体积一个字节没少。所以这里改成真的从文件里拿掉。

     彻底删除会留墓碑（见 recordPurge），否则还没同步的机器会把它们原样推回来——
     那才是真正的"删不干净"。 */
  const orphanMs = DB.milestones.filter(m => !m.task || !byId('task', m.task));
  if (orphanMs.length) {
    const aliveN = orphanMs.filter(m => !m.deleted_at).length;
    issues.push({ k: 'orphanMs', n: orphanMs.length,
      msg: `${orphanMs.length} 个里程碑的所属任务记录已不存在（其中 ${aliveN} 个还算在统计里，其余只占文件体积），界面上永远打不开也恢复不了`,
      fix: null, purgeFix: '彻底删除这些里程碑',
      // 所属任务本来就查不到了，没有页面能跳过去，只能摆出内容让人核对是不是真的该删
      items: orphanMs.map(m => ({ label: `${m.plan_date || '（无日期）'} · ${m.deliverable || '（未填写交付物）'}${m.deleted_at ? '（已删除）' : ''}` })) });
  }

  /* 任务本身活着，但所属工作已经被"停用"（软删除）了——这是历史遗留问题。
     orphanTask 抓不到这一类——它判断的是 byId 查不到所属工作，而软删除的工作仍然查得到
     （byId 不过滤 deleted_at，这是本系统一贯的约定：软删除的记录照样能被引用解析出来）。

     ★ 处理方式改过一次 ★ 最早"停用工作"（'work-del'）的确认文案说"该工作下的任务会变为
     未归属"，但代码其实只软删除了工作本身，没有去清空这些任务的 work 字段——这批任务因此
     变成了"名义上挂在一个已经不存在的工作下"，界面上还在正常显示那个已停用工作的名字。
     第一次修复是把这句承诺兑现掉（清空 work 字段，变成真未归属）；用户体验之后反馈：工作
     都已经不干了，任务留着"未归属"意义不大，不如直接跟着删掉——于是把 'work-del' 本身也
     一起改了（现在停用工作会直接连带软删除它名下的任务和里程碑，不会再产生这类新的历史
     遗留数据），这里的修复动作相应改成同一套处理：把这批任务连同里程碑一起软删除。 */
  const taskOfDeletedWork = DB.tasks.filter(t => {
    if (t.deleted_at || !t.work) return false;
    const w = byId('work', t.work);
    return !!(w && w.deleted_at);
  });
  if (taskOfDeletedWork.length) issues.push({ k: 'taskOfDeletedWork', n: taskOfDeletedWork.length,
    msg: `${taskOfDeletedWork.length} 条任务所属的工作已被停用，但任务还挂在它下面（历史遗留数据——现在停用工作会直接连带删除任务，不会再新产生这一类）`,
    fix: '把这些任务连同里程碑一并删除', items: taskOfDeletedWork.map(taskItem) });

  /* 所属任务已经被删掉、自己却还活着的里程碑。
     上面那条 orphanMs 抓不到这一类：它判断的是 byId 查不到所属任务，而软删除的任务仍然查得到。
     这批数据是"删任务不连带删里程碑"留下的历史遗留（现在删任务已经会连带删了，见 cascadeSoftDeleteTask）——
     它们在界面上完全点不到，却照样算进数据页的里程碑总数、也照样进甘特图和统计，属于纯粹的脏数据。

     ★ 处理方式来回改过一次，最终定在"软删除"，理由值得记下来 ★
     中间一版嫌软删除不省体积，把它改成了跟 orphanMs 一样的彻底删除。这是错的：
     orphanMs 的所属任务记录是真的没了，那些里程碑再也没有任何入口能碰到，删掉不损失什么；
     而这一类的所属任务只是被【软删除】，它还躺在「已删除任务」里、随时可以 ↩ 恢复，
     而 cascadeRestoreTask() 恢复任务时是要连带把它名下的里程碑一起恢复的——
     一旦这里彻底删掉，任务恢复回来就是个空壳，里程碑再也回不来了，这是实打实的数据损失。
     结论：里程碑的状态跟随它的所属任务。任务软删除 → 里程碑也软删除（跟着一起可恢复）；
     任务记录彻底不存在 → 才轮到 orphanMs 那条彻底删除。
     省体积不靠体检偷偷删可恢复的数据，靠回收站按保留期显式清理（见 recycleBin）。 */
  const msOfDeletedTask = DB.milestones.filter(m => {
    if (m.deleted_at || !m.task) return false;
    const t = byId('task', m.task);
    return !!(t && t.deleted_at);
  });
  if (msOfDeletedTask.length) issues.push({ k: 'msOfDeletedTask', n: msOfDeletedTask.length,
    msg: `${msOfDeletedTask.length} 个里程碑的所属任务已被删除，但它们自己还留着（界面上点不到，却仍算进统计）`,
    fix: '把这些里程碑也标记为已删除（跟随所属任务，任务恢复时会一起回来）',
    items: msOfDeletedTask.map(m => {
      const t = byId('task', m.task);
      return { label: `${m.plan_date || '（无日期）'} · ${m.deliverable || '（未填写交付物）'} · 属于「${t ? t.title : '？'}」（已删除）` };
    }) });

  /* ★ 重复的任务 / 工作 ★
     出现过一次"所有任务和工作都被复制成多条"的事故。最可能的来源是同一份线下表格被导入了两次：
     以前宽表导入在覆盖模式下只按「任务项编号」认领已有任务，而那一列经常是空的，
     一空就当成新任务建一条（这条已经修了，见 applyCSVImport 附近的宽表导入）；
     工作的 CSV 增量导入同理，每导一次就新增一批。
     修归修，已经产生的重复数据还留在共享文件里，得有地方能查出来、能一键清掉，
     所以在这里加一条体检项。
     判定"同一条"的口径刻意保守，只认几乎不可能重名的组合：
     任务 = 同一项工作下的同名任务；工作 = 同一年度下的同编号工作。
     清理时保留创建时间最早的那条（后建的才是复制品），其余软删除——
     软删除而不是抹掉，是为了万一判断错了还能在「已删除」视图里找回来。 */
  const dupTaskIds = [], dupTaskRecs = [];
  const taskSeen = new Map();
  DB.tasks.filter(t => !t.deleted_at && t.work && t.title)
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''))
    .forEach(t => {
      const key = t.work + '␀' + t.title;
      if (taskSeen.has(key)) { dupTaskIds.push(t.id); dupTaskRecs.push(t); } else taskSeen.set(key, t.id);
    });
  if (dupTaskIds.length) issues.push({ k: 'dupTask', n: dupTaskIds.length,
    msg: `${dupTaskIds.length} 条任务跟同一项工作下的另一条完全同名（多半是同一份表格导入了两次）`,
    fix: '保留最早创建的那条，其余删除', items: dupTaskRecs.map(taskItem) });

  const dupWorkIds = [], dupWorkRecs = [];
  const workSeen = new Map();
  DB.works.filter(w => !w.deleted_at && w.code)
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''))
    .forEach(w => {
      const key = w.code + '␀' + (w.year || '');
      if (workSeen.has(key)) { dupWorkIds.push(w.id); dupWorkRecs.push(w); } else workSeen.set(key, w.id);
    });
  if (dupWorkIds.length) issues.push({ k: 'dupWork', n: dupWorkIds.length,
    msg: `${dupWorkIds.length} 项工作跟同年度的另一项编号完全相同（多半是同一份表格导入了两次）`,
    fix: '保留最早创建的那项，其余删除',
    items: dupWorkRecs.map(w => ({ label: `${w.code} ${w.name || ''}（${w.year || '无年度'}）` })) });

  const badDuty = DB.works.filter(w => !w.deleted_at && (!w.duty || !byId('duty', w.duty)));
  if (badDuty.length) issues.push({ k: 'badDuty', n: badDuty.length, msg: `${badDuty.length} 项工作指向了不存在的职责`, fix: null,
    items: badDuty.map(w => ({ label: `${w.code} ${w.name || ''}` })) });

  const seen = new Map(), dup = [];
  DB.works.filter(w => !w.deleted_at).forEach(w => {
    const k = w.year + '/' + w.code;
    if (seen.has(k)) dup.push(w); else seen.set(k, w);
  });
  if (dup.length) issues.push({ k: 'dupCode', n: dup.length, msg: `${dup.length} 项工作在同一年度内编号重复`, fix: null,
    items: dup.map(w => ({ label: `${w.code} ${w.name || ''}（${w.year || '无年度'}）` })) });

  const noDate = DB.tasks.filter(t => !t.deleted_at && isOpen(t) && !t.plan_date);
  if (noDate.length) issues.push({ k: 'noDate', n: noDate.length, msg: `${noDate.length} 条未完成任务没有计划完成时间`, fix: null,
    items: noDate.map(taskItem) });

  // 没填计划完成时间、但底下已经有里程碑的任务：里程碑本身有日期，没道理任务还空着，直接拿最后一个里程碑日期补上
  const noDateHasMsMap = new Map();   // taskId -> 该任务最晚的里程碑日期
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    const t = byId('task', m.task);
    if (t && !t.deleted_at && isOpen(t) && !t.plan_date) {
      const cur = noDateHasMsMap.get(t.id);
      if (!cur || m.plan_date > cur) noDateHasMsMap.set(t.id, m.plan_date);
    }
  });
  if (noDateHasMsMap.size) issues.push({ k: 'noDateHasMs', n: noDateHasMsMap.size,
    msg: `${noDateHasMsMap.size} 条任务没填计划完成时间，但底下已经有里程碑`, fix: '用最后一个里程碑日期补全',
    items: [...noDateHasMsMap.entries()].map(([taskId, date]) => {
      const t = byId('task', taskId);
      return t ? { id: t.id, act: 'focus-task', label: `${taskItem(t).label} → 拟补为 ${date}` } : { label: `（任务已不存在）→ ${date}` };
    }) });

  // 里程碑计划日期晚于任务自己的计划完成时间，逻辑上说不通——交付物还没到，任务却已经算完成了
  const msLateMap = new Map();   // taskId -> 该任务下最晚的里程碑日期
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    const t = byId('task', m.task);
    if (t && !t.deleted_at && t.plan_date && m.plan_date > t.plan_date) {
      const cur = msLateMap.get(t.id);
      if (!cur || m.plan_date > cur) msLateMap.set(t.id, m.plan_date);
    }
  });
  if (msLateMap.size) issues.push({ k: 'msLateThanTask', n: msLateMap.size,
    msg: `${msLateMap.size} 条任务的里程碑计划日期晚于任务本身的计划完成时间`, fix: '把这些任务的计划完成时间顺延到最晚的里程碑日期',
    items: [...msLateMap.entries()].map(([taskId, date]) => {
      const t = byId('task', taskId);
      return t ? { id: t.id, act: 'focus-task', label: `${taskItem(t).label} → 拟顺延为 ${date}` } : { label: `（任务已不存在）→ ${date}` };
    }) });

  /* 同一任务下内容完全一样的重复里程碑。
     来源是一个已经修掉的 bug：任务详情保存曾经"把里程碑整批删掉再重建"，而弹窗的确定按钮又没防连点，
     于是保存慢的时候用户多点几下，一条任务下就多出好几套一模一样的里程碑（见 cpRowHTML 的 data-ms-id 注释）。
     代码已经改成按 id 就地更新，不会再产生新的重复，但已经躺在共享文件里的那些得能一键清掉。
     判定标准取得很严——任务+日期+交付物+呈报层级+完成状态全都一样才算重复，
     只留最早创建的那条。差一个字都不动，宁可漏掉也不能误删别人真填的东西。 */
  const dupMsMap = new Map();   // 保留的那条 id -> 要删掉的重复条数
  const dupMsIds = [], dupMsRecs = [];
  const msSeen = new Map();
  DB.milestones.filter(m => !m.deleted_at).slice()
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''))   // 最早建的那条留下
    .forEach(m => {
      const k = [m.task, m.plan_date, m.deliverable, m.report_level, m.done].join('␀');
      const keep = msSeen.get(k);
      if (keep) { dupMsIds.push(m.id); dupMsMap.set(keep, (dupMsMap.get(keep) || 0) + 1); dupMsRecs.push(m); }
      else msSeen.set(k, m.id);
    });
  if (dupMsIds.length) issues.push({ k: 'dupMs', n: dupMsIds.length,
    msg: `${dupMsIds.length} 个里程碑跟同一任务下的另一个完全重复（日期、交付物、呈报层级、完成状态全都一样）`,
    fix: '每组只保留最早创建的那一个，其余删除',
    items: dupMsRecs.map(m => {
      const t = byId('task', m.task);
      return { id: m.task, act: 'cp-editor', label: `${m.plan_date || '（无日期）'} · ${m.deliverable || '（未填写交付物）'} · 属于「${t ? t.title : '？'}」` };
    }) });

  /* 进度和状态对不上——多半是历史数据：以前改进度不会联动状态，日积月累就会有一批
     "进度都过半了、状态却还是未开始"或者"标了已完成、进度却没到 100%"的任务。
     判定规则跟 reconcileStatusAndProgress 保持一致（挂起的任务不算，进度为 0 也不强行打回未开始），
     一键修复直接复用同一个函数，不用另外再写一套判断逻辑，两处规则永远保持一致。 */
  const progressMismatch = DB.tasks.filter(t => {
    if (t.deleted_at || t.status === 'hold') return false;
    const p = Number(t.progress) || 0;
    if (p >= 100 && t.status !== 'done') return true;
    if (p < 100 && t.status === 'done') return true;
    if (p > 0 && t.status === 'todo') return true;
    return false;
  });
  if (progressMismatch.length) issues.push({ k: 'progressMismatch', n: progressMismatch.length,
    msg: `${progressMismatch.length} 条任务的进度和状态对不上（比如进度过半了状态还是未开始、或者标了已完成进度却没到 100%）`,
    fix: '按当前进度自动纠正状态', items: progressMismatch.map(t => ({ id: t.id, act: 'focus-task',
      label: `${taskItem(t).label}（进度 ${t.progress || 0}% · 状态 ${(TASK_STATUS.find(s => s.v === t.status) || {}).label || t.status}）` })) });

  /* 分级和"能不能撤销"在这里统一挂上，而不是让十几个 issues.push 各自去写——
     漏写一处就会出现一条没有等级、渲染时不知道该摆在哪一档的体检项。
     排序也在这里做：🔴 在最上面，人一眼先看到真正坏掉的东西，⚪ 那些垫底。 */
  const order = { error: 0, warn: 1, info: 2 };
  issues.forEach(i => {
    const m = healthMeta(i.k);
    i.level = m.level;
    i.undoable = i.purgeFix ? false : m.undoable;   // 带彻底删除的一律算不可撤销
  });
  issues.sort((a, b) => order[a.level] - order[b.level]);
  return { issues, orphanTasks, orphanMs, msLateMap, noDateHasMsMap, dupMsIds, progressMismatch, msOfDeletedTask,
    dupTaskIds, dupWorkIds, taskOfDeletedWork,
    counts: {
      error: issues.filter(i => i.level === 'error').length,
      warn: issues.filter(i => i.level === 'warn').length,
      info: issues.filter(i => i.level === 'info').length,
    } };
}

/* 干跑预览：这一次修复到底会动哪些记录、动完之后是什么样。
   批量修复最怕的就是"点下去之前不知道会发生什么"——尤其是删除类的。
   这里不改任何数据，只把 healthCheck 已经算出来的那批记录翻译成人话，
   点了"修复"先弹这个，确认之后才真的执行（见 ACTIONS['health-fix']）。 */
function fixHealthPreview(kind) {
  const r = healthCheck();
  const issue = (r.issues || []).find(i => i.k === kind);
  if (!issue) return null;
  const meta = healthMeta(kind);
  const VERB = {
    orphanTask: '把这些任务的「所属工作」清空，变成未归属',
    taskOfDeletedWork: '把这些任务连同它们名下的里程碑一起标记为已删除（进回收站，可恢复）',
    msOfDeletedTask: '把这些里程碑标记为已删除（跟随所属任务，任务恢复时会一起回来）',
    dupTask: '保留每组里创建最早的那条，其余连同里程碑一起标记为已删除（进回收站，可恢复）',
    dupWork: '保留每组里创建最早的那项，其余标记为已删除（进回收站，可恢复）',
    dupMs: '每组只保留创建最早的那个，其余标记为已删除，并重算受影响任务的进度',
    msLateThanTask: '把这些任务的「计划完成时间」顺延到它最晚的那个里程碑日期',
    noDateHasMs: '用最后一个里程碑的日期，补上这些任务空着的「计划完成时间」',
    progressMismatch: '按当前进度自动纠正状态（跟手工改进度时的联动规则完全一致）',
  };
  return {
    kind, n: issue.n, level: issue.level, undoable: meta.undoable,
    what: VERB[kind] || issue.fix || '',
    items: (issue.items || []).slice(0, HEALTH_PREVIEW_LIMIT).map(it => it.label),
    more: Math.max(0, (issue.items || []).length - HEALTH_PREVIEW_LIMIT),
  };
}
const HEALTH_PREVIEW_LIMIT = 20;

async function fixHealth(kind) {
  const r = healthCheck();
  snapshot();
  await Repo.bulk(() => {
    if (kind === 'orphanTask') r.orphanTasks.forEach(t => { t.work = ''; stampMeta(t); });
    // taskOfDeletedWork：工作停用现在会直接连带删任务（见 'work-del'），这里清理的是改动前
    // 遗留下来的历史数据，处理方式要跟新政策一致——连同里程碑一起软删除，不再是清空 work 字段
    if (kind === 'taskOfDeletedWork') r.taskOfDeletedWork.forEach(t => cascadeSoftDeleteTask(t.id));
    // 软删除，不是彻底删除——它的所属任务还能恢复，恢复时要连带把这些里程碑带回来（见 healthCheck 里那段注释）
    if (kind === 'msOfDeletedTask') r.msOfDeletedTask.forEach(m => { m.deleted_at = new Date().toISOString(); stampMeta(m); });
    // 重复的任务连它自己的里程碑一起删掉，否则会留下一堆 msOfDeletedTask 那类的孤儿里程碑
    if (kind === 'dupTask') {
      r.dupTaskIds.forEach(id => cascadeSoftDeleteTask(id));
      pushChangeLog('task', '', `数据体检：清理了 ${r.dupTaskIds.length} 条重复任务（保留最早创建的那条）`);
    }
    if (kind === 'dupWork') {
      r.dupWorkIds.forEach(id => softDelete('work', id));
      pushChangeLog('work', '', `数据体检：清理了 ${r.dupWorkIds.length} 项重复工作（保留最早创建的那项）`);
    }
    if (kind === 'msLateThanTask') r.msLateMap.forEach((newDate, taskId) => {
      const t = byId('task', taskId);
      if (t) { t.plan_date = newDate; stampMeta(t); }
    });
    if (kind === 'noDateHasMs') r.noDateHasMsMap.forEach((date, taskId) => {
      const t = byId('task', taskId);
      if (t) { t.plan_date = date; stampMeta(t); }
    });
    if (kind === 'dupMs') {
      // 用软删除（不是彻底删除）：万一判重判错了，「已删除」视图里还找得回来。
      // 删完顺手把受影响任务的进度重算一遍——进度是按里程碑完成比例算的，
      // 重复的里程碑会把分母撑大，之前显示的进度本来就是偏低的
      const touched = new Set();
      r.dupMsIds.forEach(id => {
        const m = byId('milestone', id);
        if (!m) return;
        m.deleted_at = new Date().toISOString();
        stampMeta(m);
        if (m.task) touched.add(m.task);
      });
      touched.forEach(taskId => {
        const t = byId('task', taskId);
        if (t) { recalcProgress(t); stampMeta(t); }
      });
    }
    if (kind === 'progressMismatch') {
      // 复用跟"改进度自动联动状态"完全同一个函数，规则永远只有一处，不会跟界面上实时联动的行为对不上
      r.progressMismatch.forEach(t0 => {
        const t = byId('task', t0.id); if (!t) return;
        const before = clone(t);
        reconcileStatusAndProgress(t, before);
        pushLog(t.id, diffTask(before, t, ['status', 'actual_date', 'progress']));
        stampMeta(t);
      });
    }
  });
  renderPage();
  showSnack('已修复（Ctrl+Z 可撤销）');
}

/* ★ 体检里的"彻底删除"分支 ★
   跟 fixHealth 分开写，因为它跟其它体检修复有本质区别：其它修复都是改字段或软删除，
   点错了 Ctrl+Z 能完整退回来；这个是把记录从共享文件里真的拿掉，退不回来。

   两道闸都不能省：
   1) 必须先连上共享文件夹。本机缓存看到的 DB 不一定是全处的完整数据——万一某条任务
      只存在于别人机器上还没同步过来，本机就会把它名下的里程碑误判成"无主"。
      连上之后 DB 是合并后的全量，这个误判才不成立。
   2) 必须走一次确认框，并把条数写清楚。
   彻底删除会自动留墓碑（removeHard → recordPurge），没有墓碑的话，
   任何一台还没同步的机器都会把它们原样推回来——那就成了"删了个寂寞"。 */
const PURGE_HEALTH_KINDS = {
  orphanMs: { field: 'orphanMs', entity: 'milestone', label: '无主里程碑', detail: '它们的所属任务记录已经不存在' },
  /* 这里刻意【只有】orphanMs 一项。曾经把 msOfDeletedTask 也放进来过，是个错误：
     那一类的所属任务只是软删除、还能从「已删除任务」里恢复，恢复时要连带带回里程碑，
     彻底删掉就再也带不回来了（详见 healthCheck 里 msOfDeletedTask 那段注释）。
     能进这张表的判据只有一条：这条记录已经【没有任何界面入口能触及】，删了不损失可恢复性。 */
};
async function purgeHealth(kind) {
  const cfg = PURGE_HEALTH_KINDS[kind]; if (!cfg) return;
  if (!_fileHandle) {
    showSnack('请先连接共享文件夹再做彻底清理——没连上时本机看到的不一定是全处的完整数据，可能误判', { priority: true });
    return;
  }
  const list = healthCheck()[cfg.field] || [];
  if (!list.length) { showSnack('没有需要清理的数据'); return; }
  // 跟清空回收站同一道闸：不可撤销的操作，必须先有一份能退回去的备份
  const bk = backupState();
  if (!bk.last) {
    showSnack('还从来没有导出过备份。这一步不可撤销，请先在上面「备份」里导出一份再来清理', { priority: true });
    return;
  }
  const pk = schema(cfg.entity).pk;
  const ids = list.map(r => r[pk]);
  // 干跑预览：把将要删掉的东西摆出来，别让人对着一个数字点确认
  const preview = list.slice(0, HEALTH_PREVIEW_LIMIT)
    .map(r => cfg.entity === 'milestone' ? `${r.plan_date || '（无日期）'} · ${r.deliverable || '（未填写交付物）'}` : String(r[pk]));
  confirmModal('彻底删除',
    `确认从共享数据里彻底删除这 ${ids.length} 个${cfg.label}？`
    + `${cfg.detail}，界面上打不开也恢复不了，留着只占文件体积。`
    + `这一步不可撤销（Ctrl+Z 也退不回来）——刚才检查过，你最近一次备份是 ${relTime(bk.last)}。`
    + `\n\n将要删除：\n· ${preview.join('\n· ')}${ids.length > preview.length ? `\n· …还有 ${ids.length - preview.length} 条` : ''}`,
    '彻底删除', async () => {
      snapshot();
      await Repo.bulk(() => {
        ids.forEach(id => removeHard(cfg.entity, id));
        pushChangeLog(cfg.entity, '', `数据体检：彻底删除了 ${ids.length} 个${cfg.label}（${cfg.detail}）`);
      });
      renderPage();
      showSnack(`已彻底删除 ${ids.length} 个${cfg.label}`, { undo: false });
    }, true);
}

/* =============================================================
   回收站：软删除记录的统一去处
   =============================================================
   ★ 为什么要有这个东西 ★
   处里反映"清了很多东西，数据文件还是那么大"。原因是：软删除只是给记录盖一个 deleted_at，
   记录本身原封不动留在共享文件里。这本身没错——那是"回收站"该有的行为，删错了能捞回来。
   出问题的是没有任何地方把这件事说清楚：软删除的记录散在各个实体里，看不见、数不着，
   也没有一个正规的"清空回收站"入口，于是大家只能指望数据体检去清，而体检一旦去清这些
   还能恢复的数据，就变成了"体检误删有效数据"——这正是要避免的事。

   所以把职责划分清楚：
   · 数据体检 只管【引用断裂】这类客观错误，永远不碰用户自己删掉的东西；
   · 回收空间 走这里，按保留期显式清理，用户看得见、数得着、能挑着恢复。

   保留期默认 90 天，存进共享文件（全处一套口径）；只清"删除时间早于保留期"的记录，
   最近删的一律不动——刚删错的那条永远还在。 */
const DEFAULT_RECYCLE_KEEP_DAYS = 90;
const RECYCLE_DETAIL_LIMIT = 30;   // 明细最多铺这么多条，回收站有几百条时页面才不会没法看
const RECYCLE_ENTITIES = [
  { entity: 'task',      label: '任务',   pk: 'id',   nameOf: r => `${r.code ? r.code + ' ' : ''}${r.title || '（无标题）'}` },
  { entity: 'milestone', label: '里程碑', pk: 'id',   nameOf: r => `${r.plan_date || '（无日期）'} · ${r.deliverable || '（未填写交付物）'}` },
  { entity: 'work',      label: '工作',   pk: 'id',   nameOf: r => `${r.code || ''} ${r.name || '（无名称）'}`.trim() },
  { entity: 'duty',      label: '职责',   pk: 'code', nameOf: r => `${r.code || ''} ${r.name || '（无名称）'}`.trim() },
];
// 存在 shareConfig 里随共享文件同步，全处一套口径（见 effectiveShareCfg 里那段注释）
function recycleKeepDays() { return effectiveShareCfg().recycleKeepDays; }
// 早于这个时刻删掉的，才算"过了保留期、可以清理"
function recycleCutoff(days) {
  return new Date(Date.now() - (days || recycleKeepDays()) * 86400000).toISOString();
}
/* 回收站现状。返回每类实体：总条数、已过保留期可清理的条数、占多少字节。
   字节数按 JSON 序列化长度估算——这正是它在共享文件里实际占的体积，
   给"清了到底能省多少"一个诚实的答案，而不是让人凭感觉猜。 */
function recycleBin(days) {
  const cutoff = recycleCutoff(days);
  return RECYCLE_ENTITIES.map(cfg => {
    const all = coll(cfg.entity).filter(r => r && r.deleted_at);
    const purgeable = all.filter(r => r.deleted_at < cutoff);
    const bytes = all.reduce((a, r) => a + JSON.stringify(r).length, 0);
    return { ...cfg, all, purgeable, bytes };
  });
}
function recycleTotals(days) {
  const rows = recycleBin(days);
  return {
    rows,
    total: rows.reduce((a, r) => a + r.all.length, 0),
    purgeable: rows.reduce((a, r) => a + r.purgeable.length, 0),
    bytes: rows.reduce((a, r) => a + r.bytes, 0),
  };
}
/* 清空回收站里已过保留期的记录。
   这是本系统里少数几个不可撤销的操作之一，四道闸一个都不能少：
   1) 必须已连共享文件夹——本机缓存不一定是全处的完整数据；
   2) 必须已经备份过（从没导出过就直接拦下来，这一步删掉就真没了）；
   3) 二次确认，把条数、保留期、能省多少体积写清楚；
   4) 彻底删除留墓碑，否则别人还没同步的机器会把它们原样推回来。
   任务/工作走级联，连它们名下的里程碑一起彻底删——否则清完任务会留下一堆无主里程碑，
   等于把一种垃圾换成了另一种。 */
async function purgeRecycleBin(days) {
  if (!requirePermission('system_admin')) return;
  if (!_fileHandle) {
    showSnack('请先连接共享文件夹再清空回收站——没连上时本机看到的不一定是全处的完整数据，可能误删', { priority: true });
    return;
  }
  const keep = days || recycleKeepDays();
  const { rows, purgeable, bytes } = recycleTotals(keep);
  if (!purgeable) { showSnack(`没有超过 ${keep} 天的已删除记录`); return; }
  const bk = backupState();
  if (!bk.last) {
    showSnack('还从来没有导出过备份。这一步不可撤销，请先在上面「备份」里导出一份再来清空', { priority: true });
    return;
  }
  const detail = rows.filter(r => r.purgeable.length).map(r => `${r.label} ${r.purgeable.length} 条`).join('、');
  const saveKB = (rows.reduce((a, r) => a + r.purgeable.reduce((b, x) => b + JSON.stringify(x).length, 0), 0) / 1024).toFixed(0);
  confirmModal('清空回收站',
    `确认彻底删除 ${keep} 天前删掉的这些记录？共 ${purgeable} 条（${detail}），预计减小约 ${saveKB} KB。`
    + `${keep} 天内删的一条都不会动。这一步不可撤销，Ctrl+Z 也退不回来——刚才检查过，你最近一次备份是 ${relTime(bk.last)}。`,
    '彻底删除', async () => {
      snapshot();
      await Repo.bulk(() => {
        let n = 0;
        rows.forEach(r => r.purgeable.forEach(rec => {
          // 任务/工作要连带把名下的里程碑一起彻底删，不然清完只剩一地无主里程碑
          if (r.entity === 'task') cascadeRemoveHardTask(rec[r.pk]);
          else removeHard(r.entity, rec[r.pk]);
          n++;
        }));
        pushChangeLog('task', '', `清空回收站：彻底删除了 ${n} 条超过 ${keep} 天的已删除记录（${detail}）`);
      });
      renderPage();
      // 确认框里明说了不可撤销，提示条上就不能再挂一个撤销按钮（见 showSnack 里那段注释）
      showSnack(`已彻底删除 ${purgeable} 条`, { undo: false });
    }, true);
}
// 回收站面板当前展开的是哪一类（纯 UI 状态，不持久化）
let _recycleOpen = '';
function recycleBinPanelHTML() {
  const keep = recycleKeepDays();
  const cutoff = recycleCutoff(keep);
  const { rows, total, purgeable, bytes } = recycleTotals(keep);
  const canPurge = hasPermission('system_admin');
  const bk = backupState();
  const body = total
    ? rows.filter(r => r.all.length).map(r => {
        const open = _recycleOpen === r.entity;
        // 按删除时间倒序、只铺前若干条：回收站可能有几百条，全列出来页面就没法看了
        const show = [...r.all].sort((a, b) => (b.deleted_at || '').localeCompare(a.deleted_at || '')).slice(0, RECYCLE_DETAIL_LIMIT);
        return `<div class="health-row">
          <div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12.5px">
            <span style="flex:1">${esc(r.label)}：<b>${r.all.length}</b> 条已删除
              <span class="hint">（其中 ${r.purgeable.length} 条已超过 ${keep} 天 · 约占 ${(r.bytes / 1024).toFixed(0)} KB）</span></span>
            <span class="toggle-view" data-act="recycle-toggle" data-entity="${r.entity}">${open ? '收起' : '查看明细'}</span>
          </div>
          ${open ? `<div class="health-detail">${show.map(rec => `
            <div class="health-detail-item" style="display:flex;align-items:center;gap:8px">
              <span style="flex:1">${esc(r.nameOf(rec))}
                <span class="hint">· ${rec.deleted_at ? relTime(rec.deleted_at) + '删除' : ''}${rec.deleted_at < cutoff ? ' · 已过保留期' : ''}</span></span>
              ${r.entity === 'milestone' ? '<span class="hint">到所属任务里恢复</span>'
                : `<span class="toggle-view" data-act="recycle-restore" data-entity="${r.entity}" data-id="${esc(rec[r.pk])}">恢复</span>`}
            </div>`).join('')}${r.all.length > show.length
              ? `<div class="health-detail-item hint">还有 ${r.all.length - show.length} 条没有列出</div>` : ''}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="hint">✅ 回收站是空的。</div>';

  return `<div class="panel"><div class="panel-h"><span>回收站</span>
      <span class="hint">共 ${total} 条 · 约占 ${(bytes / 1024).toFixed(0)} KB</span></div><div class="panel-b">
    ${body}
    ${canPurge ? `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
      <div class="form-row"><label>保留期（天）</label>
        <input type="number" min="1" step="1" style="width:80px" data-act="recycle-keep-change" value="${keep}">
        <span class="hint" style="margin-left:6px">删除超过这么多天的才允许被彻底清理，之内的一律不动</span></div>
      <div style="margin-top:6px">
        <button class="btn"${purgeable ? ' style="color:var(--overdue)"' : ' disabled'} data-act="recycle-purge">清空 ${keep} 天前删除的（${purgeable} 条）</button>
        ${!bk.last ? '<span class="hint" style="margin-left:8px;color:var(--overdue)">⚠ 还没导出过备份，先备份再清</span>' : ''}
      </div></div>` : ''}
    <div class="chart-note">这里装的是<b>被人删掉的记录</b>：它们不算进任何统计，但仍留在共享文件里占体积——
    这就是"删了很多、文件还是很大"的原因。留着是为了删错能捞回来，所以只有超过保留期的才允许彻底清理，
    而且这一步不可撤销，需要先连上共享文件夹、并且导出过备份。
    数据体检不会碰这里的任何东西：这些是你自己删的，该不该真清掉由你决定，不该由体检替你做主。</div>
  </div></div>`;
}

/* ---- 备份状态 ---- */
function lastChangeAt() {
  let mx = '';
  ['duty', 'work', 'milestone', 'task'].forEach(e => coll(e).forEach(r => {
    if (r.updated_at && r.updated_at > mx) mx = r.updated_at;
  }));
  return mx;
}
function backupState() {
  const last = DB.settings.lastBackupAt || '';
  const change = lastChangeAt();
  const stale = !last || (change && change > last);
  const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
  return { last, stale, days };
}

/* ---- 从 JSON 备份恢复 ---- */
function importBackup(text) {
  let d;
  try { d = JSON.parse(text); } catch (e) { showSnack('文件不是合法的 JSON'); return; }
  if (!d || !Array.isArray(d.duties) || !Array.isArray(d.tasks)) { showSnack('这不是本系统导出的备份文件'); return; }
  const cur = { 职责: DB.duties.length, 工作: DB.works.length, 里程碑: DB.milestones.length, 任务: DB.tasks.length };
  const inc = { 职责: d.duties.length, 工作: (d.works || []).length, 里程碑: (d.milestones || []).length, 任务: d.tasks.length };
  openModal('从备份恢复', `
    <p style="color:var(--p1);font-weight:600;margin-bottom:8px">这会用备份内容<b>整体替换</b>当前数据。</p>
    <table class="dtable"><thead><tr><th>实体</th><th>当前</th><th>备份</th></tr></thead><tbody>
      ${Object.keys(cur).map(k => `<tr><td>${k}</td><td>${cur[k]}</td><td>${inc[k]}</td></tr>`).join('')}
    </tbody></table>
    <div class="hint" style="margin-top:8px">恢复后可用 Ctrl+Z 撤销一次。建议先「导出全部」留一份当前数据。</div>`,
    '确认恢复', async () => {
      closeModal();
      snapshot();
      DB.duties = d.duties.map(r => normalize('duty', r));
      DB.works = (d.works || []).map(r => normalize('work', r));
      DB.milestones = (d.milestones || []).map(r => normalize('milestone', r));
      DB.tasks = d.tasks.map(r => normalize('task', r));
      DB.changelog = Array.isArray(d.changelog) ? d.changelog : [];
      // 墓碑跟着备份一起还原。老备份文件没有这个字段，按空处理即可：
      // 备份是"整体替换"，替换进来的那批记录本来就没有对应的墓碑
      DB.purged = Array.isArray(d.purged) ? d.purged : [];
      if (d.settings) DB.settings = Object.assign(DB.settings, d.settings);
      migrateWorkIds();
      rebuildIndex();
      restoreUI();
      await Repo.persist(DB);
      renderShell(); renderPage();
      showSnack('已从备份恢复');
    }, true);
}

// 编号在「同职责 + 同年度」内递增；不同年度可以重复，这正是年度复制所需
function nextWorkCode(dutyCode, year) {
  const used = DB.works.filter(w => w.duty === dutyCode && w.year === year)
    .map(w => parseInt(String(w.code).slice(2)) || 0);
  return dutyCode + String((used.length ? Math.max(...used) : 0) + 1).padStart(2, '0');
}

let modalCallback = null;
let _modalBusy = false;   // 弹窗"确定"正在执行中——防止连点把同一个保存跑好几遍（见 ACTIONS['modal-ok']）
function openModal(title, bodyHTML, okText, cb, danger) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal-ok-btn').textContent = okText || '确定';
  $('#modal-ok-btn').classList.toggle('danger', !!danger);
  modalCallback = cb;
  $('#modal-overlay').classList.add('show');
}
function confirmModal(title, msg, okText, cb, danger) {
  openModal(title, `<p>${esc(msg)}</p>`, okText, async () => { closeModal(); await cb(); }, danger);
}
/* 单行文本输入的小弹窗。不用浏览器原生 prompt()：那个在部分浏览器/内嵌环境里会被静默屏蔽，
   点了没反应还查不出原因，而且样式跟本应用其它弹窗完全不搭。
   取值必须在 closeModal() 之前——closeModal 会把 #modal-body 清空，之后再读就是空字符串了。 */
function promptModal(title, label, initial, cb) {
  openModal(title, `<div class="form-row"><label>${esc(label)}</label>
      <input id="prompt-input" type="text" value="${esc(initial || '')}" maxlength="60"></div>`,
    '确定', async () => {
      const el = $('#prompt-input');
      const val = el ? el.value : '';
      closeModal();
      await cb(val);
    });
  setTimeout(() => { const el = $('#prompt-input'); if (el && el.focus) el.focus(); }, 50);
}
function closeModal() {
  modalCallback = null;
  $('#modal-overlay').classList.remove('show');
  $('#modal-box').classList.remove('wide');
  $('#modal-body').innerHTML = '';
  syncCatchUp();   // 弹窗开着期间被跳过的那次同步，现在补上（弹窗一开一上午的情况很常见）
}
$('#modal-overlay').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

/* "导出考核目标"弹窗的复制按钮：不走 openModal 常规的"确定就关闭"流程——这里的"确定"
   就是复制本身，点了应该给个反馈但留着弹窗，方便反复复制、或者手动全选自己 Ctrl+C。
   这套应用常在非 HTTPS 的局域网共享文件夹场景下跑，navigator.clipboard 在非安全上下文里
   可能整个不存在，所以优先用它、失败了退回 execCommand('copy') 这个老写法，两个都不行
   就老实告诉用户自己复制，不装作成功了。 */
async function copyAssessmentGoalsText() {
  const ta = $('#goals-ta');
  if (!ta) return;
  ta.focus(); ta.select();
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(ta.value);
      ok = true;
    }
  } catch (e) { /* 常见于非安全上下文，退到下面的兼容写法 */ }
  if (!ok) {
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  }
  const btn = $('#modal-ok-btn');
  if (btn) {
    btn.textContent = ok ? '已复制 ✓' : '复制失败，请手动 Ctrl+C';
    setTimeout(() => { if ($('#modal-overlay').classList.contains('show') && $('#modal-ok-btn')) $('#modal-ok-btn').textContent = '📋 一键复制'; }, 1600);
  }
}

let snackTimer = null;
/* ★ 优先提示不能被"已保存"这类顺口的成功提示悄悄盖掉 ★
   起因：任务详情/里程碑保存这些地方，都是"先 await Repo.persist(...)，再 showSnack('已保存')"这个套路。
   而 Repo.persist 内部如果发现这次其实没有真正同步出去（共享文件失败、或者干脆没连上），
   会自己先 showSnack 一句警告——但函数一返回，外层紧接着的那句 showSnack('已保存') 立刻把它冲掉，
   用户实际看到的永远是"已保存"三个字，压根不知道数据根本没推出去。这正是"同事说已保存、
   我这边却看不到"的真实原因：不是没检测到，是检测到了但提示被自己人盖住了。
   修法：给 Repo.persist 那几句警告标记 priority，priority 消息独占一段"不许被顶掉"的窗口，
   窗口内任何普通 showSnack 调用直接放弃——不需要去改遍布全文件的几十处"已保存"调用点，
   这一处改完，所有调用点自动都对。 */
let _snackPriorityUntil = 0;
// 快照与提示之间隔多久还算"这条提示对应那次改动"。留 5 秒：足够覆盖 await 落盘的耗时，
// 又短到不会把几分钟前那次操作的撤销按钮，安到一条无关提示上
const SNACK_UNDO_WINDOW_MS = 5000;
function showSnack(msg, opts) {
  const now = Date.now();
  if (!(opts && opts.priority) && now < _snackPriorityUntil) return;
  if (opts && opts.priority) _snackPriorityUntil = now + 1500;
  $('#snack-msg').textContent = msg;
  /* ★ "撤销"按钮只在【这一条提示确实对应一次刚刚发生的、可撤销的改动】时才出现 ★
     以前只看撤销栈空不空，于是任何一条提示都会带上撤销按钮——改个设置、导出成功、
     "这一轮备份跳过了"这种纯告知，甚至"彻底删除完成"这种明说了不可撤销的操作，
     统统带一个撤销按钮。这比"给个点了没用的假按钮"糟得多：栈里存的是更早某次
     毫不相干的操作，点下去会真的把那次改动回退掉，用户完全预料不到。
     现在要两个条件同时成立：
     ① 栈里确实有东西；
     ② 就在刚才（SNACK_UNDO_WINDOW_MS 内）真的拍过一次快照——也就是这条提示背后
        确实跟着一次可撤销的写操作，而不是一条纯告知。
     明说不可撤销的那几处（彻底删除、清空回收站）再额外传 undo:false 兜底。 */
  const undoable = (!opts || opts.undo !== false)
    && undoStack.length > 0
    && (now - _lastSnapshotAt) < SNACK_UNDO_WINDOW_MS;
  $('#undo-btn').classList.toggle('hidden', !undoable);
  $('#snackbar').classList.add('show');
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, 3500);
}
function hideSnack() { $('#snackbar').classList.remove('show'); }

/* =============================================================
   24. CSV / JSON 导入导出
   ============================================================= */
// 多值字段用逗号拼接；值内含逗号或反斜杠时转义，保证往返无损
// 去掉用户手打的行首编号（"1、" "2." "(3)" 等），避免和显示时自动加的编号重复
function stripLineNumber(s) {
  return String(s || '').replace(/^\s*(?:[\(（]\d{1,3}[\)）]|\d{1,3}[.、,，:：)）])\s*/, '');
}
function parseLines(raw) {
  return String(raw || '').split('\n').map(s => stripLineNumber(s.trim())).filter(Boolean);
}
function joinMulti(arr) {
  return (arr || []).map(v => String(v).replace(/\\/g, '\\\\').replace(/,/g, '\\,')).join(',');
}
function splitMulti(raw) {
  if (!raw) return [];
  // 兼容手工整理的 Excel：顿号、中文逗号也当分隔符，先归一成英文逗号再按转义规则切分
  const norm = String(raw).replace(/[、，]/g, ',');
  const out = []; let cur = '', escd = false;
  for (const c of norm) {
    if (escd) { cur += c; escd = false; }
    else if (c === '\\') escd = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}
function toCSVField(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* 由 \n 收行 */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
function csvHeaders(entity) {
  const sc = schema(entity);
  const keys = sc.fields.filter(f => !f.virtual).map(f => f.key);
  return [...(sc.pk === 'id' ? ['id'] : []), ...keys, 'created_at', 'updated_at', 'updated_by', 'rev', 'deleted_at'];
}
function csvCell(entity, r, key) {
  const f = fieldDef(entity, key);
  if (!f) return r[key];
  if (f.type === 'lines') return (r[key] || []).join('\n');
  if (f.type === 'multi' || f.type === 'persons') return joinMulti(r[key]);
  return r[key];
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function stamp() { return new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 15); }

function exportCSV(entity) {
  const h = csvHeaders(entity);
  const rows = [h.join(',')];
  coll(entity).forEach(r => rows.push(h.map(k => toCSVField(csvCell(entity, r, k))).join(',')));
  download(`${entity}_${stamp()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8;');
  showSnack(`已导出 ${coll(entity).length} 条${schema(entity).label}`);
}
async function exportJSON() {
  download(`工作管理备份_${stamp()}.json`, JSON.stringify(DB, null, 1), 'application/json');
  DB.settings.lastBackupAt = new Date().toISOString();
  await Repo.persist(DB);
  if (currentPage === 'data') renderPage();
  showSnack('已导出 JSON 全量备份');
}

/* ---- 账号与角色的导入 / 导出 ----
   跟"全量备份"分开做一份单独的：换台机器重新搭一套、或者把一份名单发给另一个处室复用时，
   只想搬账号和权限配置，不想把全处的任务数据一起搬过去。

   ★ 导出内容里含 PIN 的校验信息（salt/hash/iterations）★
   不是明文口令（PBKDF2 派生值，反推不出原 PIN），但它足以离线暴力猜测弱 PIN，
   所以本质上仍然是一份口令文件。带上它是为了让导入方不用所有人重设 PIN；
   代价就是这个文件必须当口令文件保管——界面上那段说明里已经明确写了这一点。 */
const ACCOUNTS_EXPORT_KIND = 'todoapp-accounts';
function accountsExportPayload() {
  return {
    kind: ACCOUNTS_EXPORT_KIND,
    exportedAt: new Date().toISOString(),
    exportedBy: DB.settings.me || '未署名',
    app: APP_VERSION,
    users: DB.users || [],
    permissionMatrix: DB.permissionMatrix || null,
  };
}
async function exportAccounts() {
  if (!requirePermission('manage_director_accounts')) return;
  download(`账号与角色_${stamp()}.json`, JSON.stringify(accountsExportPayload(), null, 1), 'application/json');
  showSnack(`已导出 ${(DB.users || []).filter(u => !u.deleted_at).length} 个账号及权限配置`);
}
// 认一份账号导出文件；不认就返回错误原因（给用户看的整句话），认得就返回解析结果
function parseAccountsFile(text) {
  let d = null;
  try { d = JSON.parse(text); } catch (e) { return { err: '这个文件不是合法的 JSON' }; }
  if (!d || typeof d !== 'object') return { err: '这个文件内容不是本系统导出的账号文件' };
  // 兼容直接拿"全量备份"来导的情况：那份里也有 users/permissionMatrix，取出来一样能用
  if (d.kind !== ACCOUNTS_EXPORT_KIND && !Array.isArray(d.users)) {
    return { err: '这个文件里没有账号数据，不是账号导出文件、也不是本系统的全量备份' };
  }
  if (!Array.isArray(d.users)) return { err: '文件里的账号列表格式不对' };
  const users = d.users.filter(u => u && typeof u.name === 'string' && u.name.trim());
  if (!users.length) return { err: '文件里一个有效账号都没有' };
  return { users, permissionMatrix: d.permissionMatrix || null, exportedBy: d.exportedBy || '', exportedAt: d.exportedAt || '' };
}
/* 导入统一走"合并"，规则跟多人同步时那套完全一致（按姓名对应、版本号高的赢）：
   · 同名账号 → 谁的版本更新用谁的
   · 文件里独有的账号 → 新增进来
   · 本机独有的账号 → 原样保留，绝不因为"文件里没有"就删掉
   最后这条是刻意的：导入一份别处的名单，不应该把本机现有的人误删。真要删某个账号，
   在上面那张表里单独点删除，那才是一次明确的删除动作。 */
function importAccounts(text) {
  const r = parseAccountsFile(text);
  if (r.err) { showSnack('导入失败：' + r.err); return; }
  const before = new Set((DB.users || []).map(u => u.name));
  const added = r.users.filter(u => !before.has(u.name)).length;
  const updated = r.users.length - added;
  const matrixNote = r.permissionMatrix ? '，并覆盖/合并权限矩阵（按版本号取新的那份）' : '';
  confirmModal('导入账号与角色',
    `文件里共有 ${r.users.length} 个账号：新增 ${added} 个、与现有同名的 ${updated} 个（同名的按版本号取更新的那份）${matrixNote}。`
    + `本机现有但文件里没有的账号会原样保留，不会被删除。确定导入吗？`,
    '导入', async () => {
      snapshot();
      const me = DB.settings.me || '未署名';
      await Repo.bulk(() => {
        DB.users = mergeUserPresence(mergeByPk('name', DB.users || [], r.users), DB.users || [], r.users);
        /* ★ 文件里带进来的新账号要改记成"我导入的" ★
           撤销靠 updated_by 来分辨"这条是我这次操作弄出来的、还是同事的东西同步进来的"
           （见 undoRestoreList），而导入进来的记录带的是导出方那台机器写的 updated_by。
           不改的话，撤销会把它们当成同事的东西一律留下，"导入可以撤销"这句话就成了空头承诺。
           只动 updated_by、不碰 rev/updated_at：合并时比的是后两者，改了会打乱"同名账号谁的版本更新"的判断；
           而且只处理本机原本没有的那些名字，同名更新的那些仍然完整保留文件里的版本信息。 */
        DB.users.forEach(u => { if (!before.has(u.name)) u.updated_by = me; });
        if (r.permissionMatrix) DB.permissionMatrix = mergePermissionMatrix(DB.permissionMatrix, r.permissionMatrix);
        /* 导入是一次性给一批账号定角色，等价于批量提权，所以每个受影响的账号都要单独留一条凭证——
           只记一条"导入了 N 个账号"的汇总是不够的：别人的机器校验的是"某人被提成某角色有没有人批准过"，
           它按 target/roleTo 逐条找，找不到就会把这次导入判成越权改动挡下来 */
        r.users.forEach(u => {
          if (!u || !u.name) return;
          pushAdminLog(`从文件导入账号 ${u.name}，角色「${roleLabel(u.role)}」`, { target: u.name, roleTo: u.role });
        });
      });
      renderShell(); renderPage();
      showSnack(`已导入：新增 ${added} 个账号，更新 ${updated} 个（Ctrl+Z 可撤销）`);
    });
}

/* ---- 共享文件连接：把「哪个文件」记在 IndexedDB 里，下次开页面能悄悄接回去，不用每次都重新选 ---- */
let _reloadTimer = null;
const RELOAD_INTERVAL_MS = 5 * 60 * 1000;   // 没有推送机制，只能定时去看一眼别人存的新东西
// 之前用 location.reload() 整页刷新，副作用是浏览器缩放会被重置回 100%——
// 改成"软同步"：不真的导航，只是重新走一遍 Repo.persist 的合并逻辑再重绘当前页，
// 浏览器标签页本身没有被刷新，缩放、滚动位置这些浏览器级状态自然不会被打扰
function stopAutoReload() {
  if (_reloadTimer) { clearInterval(_reloadTimer); _reloadTimer = null; }
}
/* 同步现在被这几种情况挡住：弹窗开着、门禁开着、单元格正在编辑。
   挡是对的（不能把人家手上的操作打断），但原来挡完就算了——
   任务详情弹窗开着放一上午，这一上午就一次都没同步过，而且界面上完全看不出来。
   所以挡下来的那次要记账，等挡的原因消失了立刻补上（见 syncCatchUp）。 */
let _syncBlockedPending = false;
function syncBlocked() {
  return $('#modal-overlay').classList.contains('show')
    || $('#login-gate').classList.contains('show')
    || !!_activeEdit;
}
/* ★ 三条会去碰共享文件的路径——5 分钟定时器、标签页重新可见/拿到焦点、手动点"立即同步"按钮——
   共用同一把闸，同一时刻只准一条在跑 ★
   网络盘上对同一个文件句柄几乎同时发起两次读写，行为没有保证：可能一个写覆盖另一个正读到一半的内容，
   也可能其中一次直接报错。与其让这种并发悄悄发生、只在极偶然的时机才暴露出问题，
   不如干脆规定错过就错过——下一轮定时器 / 下一次切回标签页 / 用户自己再点一下按钮，自然会补上。 */
let _syncBusy = false;
async function withSyncGate(fn) {
  if (_syncBusy) return false;
  _syncBusy = true;
  try { return await fn(); } finally { _syncBusy = false; }
}
/* ★ "同步一次"只有这一份实现，谁触发的都调它 ★
   这就是"立即同步"按钮点下去发生的全部事情：读—合并—写，然后立刻把当前页面重绘一遍。
   定时器、pullOnWake、手动按钮三条路径，区别只在"什么时候调用它"，调用之后发生的事必须
   一模一样——之前定时器是自己另抄一遍"Repo.persist(DB); renderShell(); renderPage();"，
   两处代码看着一样，但两份终究是两份，以后改一处很容易忘了改另一处，
   届时又会变成"自动同步了、页面却没跟着刷新"这种让人摸不着头脑的不一致。 */
async function syncNowAndRender() {
  await Repo.persist(DB);   // 内部会读共享文件当前内容、跟本地合并、写回去
  renderShell(); renderPage();
}
function startAutoReload() {
  if (_reloadTimer) return;
  _reloadTimer = setInterval(async () => {
    if (!_fileHandle) return;
    if (syncBlocked()) { _syncBlockedPending = true; return; }
    await withSyncGate(syncNowAndRender);
  }, RELOAD_INTERVAL_MS);
}
/* ★ 定期备份必须有自己独立的定时器，不能挂在共享文件同步的定时器上 ★
   以前 maybeAutoBackup() 是从 startAutoReload() 里那个定时器顺带调用的，而那个定时器
   只有在共享文件连接成功之后才会 startAutoReload() 启动（见 tryReconnectSharedFile/connectSharedFile）；
   一旦开机时连接没成功——网盘那个小应用还没启动、共享文件夹一时半会儿挂不上，
   于是走进 _offlineMode（真离线）或者只是 _needPermissionRestore（等一次点击就能恢复）——
   这个定时器压根不会被启动，哪怕浏览器一直开着、哪怕后来手动重新连上了共享文件夹但没恰好触发
   "startAutoReload"这条路径，定期备份就会在余下的整个会话里一次都不跑，跟共享文件的连接状态
   完全绑死，而这两件事本来毫不相干——备份写的是管理员另外指定的本机文件夹，不依赖共享连接。

   所以拆成两个独立的定时器：这个只管备份，开机不管共享文件连没连上都无条件启动。 */
let _backupTimer = null;
let _backupInFlight = false;   // 避免两个定时器（或定时器+手动点击）在极小概率下同时触发写两次
/* ★ 同一台机器开着好几个标签页时，一次会写出好几份几乎一样的备份 ★
   _backupInFlight 只是同一个标签页内部的锁，管不到别的标签页。而每个标签页都有
   自己的 _backupTimer、自己内存里的那份 DB：A 标签页备份完把 autoBackupAt 写进本机存档，
   B、C 标签页内存里的 DB 还是旧的，它们各自的定时器到点后照样判定"该备份了"，
   于是同一个时间点前后写出两三份文件——各标签页定时器的起点不同，所以文件名的时间戳

const BACKUP_LOCK_KEY = 'todo_v4_backup_lock';

function backupSlotStamp() {

  const windowMs = Math.max(1, Number(hours) || 24) * 3600 * 1000;

    const raw = localStorage.getItem(BACKUP_LOCK_KEY);
    if (raw) {
      const last = Date.parse((JSON.parse(raw) || {}).at);
      // 距离"上一次有标签页备份过"还不到一个备份周期 —— 别重复写了
      if (!isNaN(last) && Date.now() - last < windowMs) return false;

    const mine = backupSlotStamp();
    localStorage.setItem(BACKUP_LOCK_KEY, mine);

  } catch (e) {
    return true;   // localStorage 不可用（隐私模式等）时退回旧行为：宁可多备一份，也不能不备
  }

function markBackupSlotUsed() {
  try { localStorage.setItem(BACKUP_LOCK_KEY, backupSlotStamp()); } catch (e) {}
}
async function backupTick() {
  if (_backupInFlight) return;
  _backupInFlight = true;
  try { await maybeAutoBackup(); } finally { _backupInFlight = false; }
}
function startAutoBackupTimer() {
  if (_backupTimer) return;
  _backupTimer = setInterval(backupTick, RELOAD_INTERVAL_MS);
}
/* 定时器被挡掉过就补一次。关弹窗、退出单元格编辑之后调用，代价很小（只读一次文件）。 */
async function syncCatchUp() {
  if (!_syncBlockedPending || !_fileHandle || syncBlocked()) return;
  _syncBlockedPending = false;
  await pullOnWake(true);
}

/* ★ 「同事改了我这边看不到」最要命的一环就在这里 ★
   在这之前，把共享文件里的新内容读进来只有两个触发点：我自己动手改了点什么，或者 5 分钟一轮的定时器。
   于是有两个很常见、但界面上完全看不出来的场景，会让人对着一屏旧数据看很久：
   1) 刚刷新完页面：浏览器的读写授权不跨刷新存活，_fileHandle 是 null，定时器等于没有，
      页面渲染的是 localStorage 里那份可能已经放了很久的旧数据。如果这时候只是看看工作台、
      不点任何东西，那个"点击恢复共享连接"就一直没人点，数据也就一直不更新；
   2) 标签页切到后台：浏览器会把后台标签的 setInterval 狠狠节流（常见是降到一分钟一次甚至更少），
      笔记本合盖休眠期间干脆一次都不跑。等你切回来，屏幕上是十几分钟甚至更早以前的数据。
   两种情况下界面都若无其事，看不出"你看到的不是最新的"——这正是"同事的改动没反映出来"的由来。
   修法：只要这个标签页重新变可见 / 窗口重新拿到焦点，就立刻拉一次（只读，很便宜）。 */
const PULL_MIN_GAP_MS = 15 * 1000;   // 防抖：切来切去时别把文件读爆
let _lastPullAt = 0;
async function pullOnWake(force) {
  if (!_fileHandle) return false;
  if (syncBlocked()) { _syncBlockedPending = true; return false; }
  const now = Date.now();
  if (!force && now - _lastPullAt < PULL_MIN_GAP_MS) return false;
  _lastPullAt = now;
  return await withSyncGate(async () => {
    try {
      if (await pullFromFile()) { renderShell(); renderPage(); return true; }
    } catch (e) {

    }
    return false;
  });
}
/* ★ 「最近连接」心跳：人打开页面就算连上了，不该非等他改点什么才记 ★

   于是"最近连接"这一列实际记的是"最近一次保存过改动"。对处里大多数人来说这两件事差很远——
   领导天天开着页面看进度、一个字不改，权限页上他就一直挂着很久以前的时间甚至"从未连接"，
   而这一列恰恰是管理员判断"谁还没接上共享文件夹"最直接的依据，等于失真了。

   写一次就是几十上百 KB 穿过网盘。十几个人一天切几十次标签页，纯粹是白耗带宽和网盘缓存。

   1) 激活时只在内存里盖个时间戳（markUserSeen 很便宜，不碰文件），并且 30 分钟内只盖一次；
   2) 真正写出去这件事搭顺风车——hasLocalContribution 现在认得心跳（见那边），

const PRESENCE_MIN_GAP_MS = 30 * 60 * 1000;   // _lastPresenceAt 声明在 markUserSeen 上面，理由见那里
function touchPresence() {

  if (!_fileHandle) return false;         // 没连共享文件，记了也传不出去，等连上再说
  const now = Date.now();
  if (now - _lastPresenceAt < PRESENCE_MIN_GAP_MS) return false;
  _lastPresenceAt = now;

document.addEventListener('visibilitychange', () => { if (!document.hidden) { touchPresence(); pullOnWake(); } });
window.addEventListener('focus', () => { touchPresence(); pullOnWake(); });
// 共享文件夹现在没有"路径模板/工号"这些讲究了——谁都可以选，只要选中处里共享的那个文件夹，
// 里面固定文件名的那个 json 就是大家共用的数据。身份认证靠姓名 + PIN，跟连的是哪个文件夹无关。
// ★ 分发前请按需修改这一行 ★
// BOOTSTRAP_ADMINS：系统里一个账号都没有时（真·bootstrap）第一次创建管理员账号，姓名必须在这个名单里才允许创建，
// 防止任何人在还没联系上真正的管理员之前，随手把自己设成管理员。名单外的人到了这一步只会看到"请联系管理员"。
const BOOTSTRAP_ADMINS = ['徐捷'];
// ★ 分发前按处里实际情况核对 ★ 管理员仍可在数据页覆盖，但不配置也能直接用
const DEFAULT_SHARE_FILE_NAME = '科技规划处工作管理.json';
function effectiveShareCfg() {
  const c = DB.shareConfig || {};
  return {
    fileName: c.fileName || DEFAULT_SHARE_FILE_NAME,
    // 开关和间隔以前存在 DB.settings 里，只留在这台电脑上——这本身没错，真正的坑是
    // 那两个输入框的 change 事件根本没接上 ACTIONS（见 CHANGE_ONLY_ACTS 那段注释），
    // 改了跟没改一样，隔一阵重渲染就打回原样，像是"自己变回去了"。事件接上之后本机已经不会再丢，
    // 这里顺手把它们挪进 shareConfig 一起同步：换台电脑、或者别的管理员来看，看到的是同一个开关状态，
    // 不用每台设备各自设一遍。备份目标文件夹的句柄没法跨设备用，那个仍然留在本机 settings 里。
    autoBackupEnabled: !!c.autoBackupEnabled,
    autoBackupHours: Math.max(BACKUP_MIN_HOURS, Number(c.autoBackupHours) || 24),

    // 不该每台电脑各设一个——甲的机器认为 30 天该清、乙的认为 180 天，同一份共享数据会互相打架
    // 先判有没有有效值、再夹取值范围。反过来写（Math.max(1, …) || 默认值）是个陷阱：

    recycleKeepDays: Number(c.recycleKeepDays) > 0 ? Math.max(1, Math.floor(Number(c.recycleKeepDays))) : DEFAULT_RECYCLE_KEEP_DAYS,

// 改共享文件夹设置的这几个动作（备份开关/间隔/文件名）共用同一条更新路径：
// 在现有配置基础上打补丁，而不是各自重新拼一个新对象——否则先改了备份间隔，
// 再去存文件名的那个动作会把间隔这种"当时没提到"的字段悄悄冲掉
function updateShareConfig(patch) {

// 选错文件夹时，那个文件夹里的同名文件很可能是别的用途的 json，内容对不上，这时候不能当成"连接成功"，

async function connectSharedFile() {
