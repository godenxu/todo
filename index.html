<!DOCTYPE html>
<html lang="zh-CN">
<head>
<!-- © 科技规划处 徐捷 版权所有 -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>科技规划处工作管理系统</title>
<style>
/* ===== RESET & VARS ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f0ede8;
  --surface: #faf8f5;
  --border: #ddd9d3;
  --border2: #ccc8c2;
  --text: #1a1815;
  --text2: #5a5550;
  --text3: #9a9590;
  --accent: #2c5f8a;
  --accent-light: #e8f0f7;
  --p1: #c0392b; --p1-bg: #fdecea; --p1-border: #f5c6c2;
  --p2: #d4600a; --p2-bg: #fef3e8; --p2-border: #f8d9b8;
  --p3: #4a7fa5; --p3-bg: #eaf2f8; --p3-border: #c0d9eb;
  --done: #27ae60;
  --overdue: #c0392b;
  --deleted-bg: #fff8f8;
  --snack-bg: #1a1815;
  --sidebar-w: 190px;
  --row-h: 36px;
  /* 图表专用色板（经 CVD / 对比度校验，最差相邻对 ΔE 17.2）。
     与徽章用的 --done/--overdue 分开：那些是文字色，标准不同。
     琥珀 --c-soon 对比度 2.43，故凡使用处必须同时有可见文字标签。 */
  --c-late:  #c0392b;
  --c-soon:  #e0900a;
  --c-doing: #1a6aa8;
  --c-done:  #1e7d45;
  --c-track: #e2ded8;
  --font: "Noto Sans CJK SC","Source Han Sans CN","Microsoft YaHei",sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); font-size: 13px; background: var(--bg); color: var(--text); display: flex; flex-direction: column; user-select: none; }

/* ===== TOPBAR ===== */
#topbar { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 42px; }
.logo { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .03em; white-space: nowrap; flex-shrink: 0; margin-right: 6px; }
#nav { display: flex; gap: 2px; height: 100%; }
.nav-item { display: flex; align-items: center; padding: 0 13px; font-size: 12.5px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav-item:hover { background: var(--bg); }
.nav-item.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
#topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
#year-select { height: 26px; border: 1px solid var(--border2); border-radius: 4px; background: var(--bg); font-family: var(--font); font-size: 12px; color: var(--text2); padding: 0 4px; }
.me-tag { font-size: 12px; color: var(--text2); background: var(--accent-light); border-radius: 10px; padding: 2px 9px; cursor: pointer; }
.me-tag:hover { background: var(--border2); }
.btn { height: 26px; padding: 0 10px; border: 1px solid var(--border2); border-radius: 4px; background: var(--surface); font-family: var(--font); font-size: 12px; color: var(--text2); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--bg); border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { opacity: .88; color: #fff; }

/* ===== LAYOUT ===== */
#main { display: flex; flex: 1; overflow: hidden; }
#sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
#sidebar::-webkit-scrollbar { width: 3px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border2); }
#sidebar.hidden { display: none; }
.sb-section-title { padding: 5px 10px 4px; font-size: 12px; font-weight: 700; color: var(--text2); letter-spacing: .05em; text-align: center; flex-shrink: 0; background: var(--border); border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); }
.sb-item { display: flex; align-items: center; justify-content: space-between; padding: 3px 10px; cursor: pointer; color: var(--text2); font-size: 12.5px; line-height: 1.25; transition: background .1s; border-left: 3px solid transparent; }
.sb-item:hover { background: var(--bg); }
.sb-item.active { background: var(--accent-light); color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.sb-item .cnt { font-size: 10px; color: var(--text3); background: var(--border); border-radius: 8px; padding: 0 5px; min-width: 18px; text-align: center; flex-shrink: 0; margin-left: 4px; }
.sb-item.active .cnt { background: var(--accent); color: #fff; }
.sb-item .sb-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .sb-label.is-empty-val { color: var(--text3); font-style: italic; }
.sb-item.indent { padding-left: 20px; font-size: 12px; }
.sb-item.indent2 { padding-left: 28px; font-size: 12px; }
.sb-divider { border: none; border-top: 1px solid var(--border); margin: 5px 0; }
/* 树形筛选：职责 → 工作 */
.sb-caret { width: 12px; flex-shrink: 0; font-size: 9px; color: var(--text3); text-align: center; cursor: pointer; }
.sb-caret:hover { color: var(--accent); }
.sb-item.tree-duty { padding-left: 4px; gap: 2px; }
.sb-copyright { padding: 10px 12px 8px; font-size: 10px; color: var(--text3); line-height: 1.6; margin-top: auto; border-top: 1px solid var(--border); }

#content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#toolbar { display: flex; align-items: center; padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; height: 34px; gap: 8px; }
#view-label { font-size: 12px; color: var(--text2); font-weight: 600; }
.filter-chip { font-size: 11px; background: var(--accent-light); color: var(--accent); border-radius: 10px; padding: 1px 8px; cursor: pointer; }
.filter-chip:hover { background: var(--border2); }
#quick-input { flex: 1; max-width: 460px; height: 26px; padding: 0 9px; border: 1px solid var(--border2); border-radius: 4px; background: var(--bg); font-family: var(--font); font-size: 12.5px; color: var(--text); outline: none; }
#quick-input:focus { border-color: var(--accent); background: #fff; }
#quick-input::placeholder { color: var(--text3); }
#search-input { margin-left: auto; width: 170px; height: 24px; padding: 0 8px; border: 1px solid var(--border2); border-radius: 3px; background: var(--bg); font-family: var(--font); font-size: 12px; color: var(--text); outline: none; }
#search-input:focus { border-color: var(--accent); }

/* ===== 页面容器 ===== */
.page { flex: 1; overflow: auto; display: none; }
.page.active { display: block; }
#page-tasks.active, #page-works.active, #page-duties.active { display: flex; flex-direction: column; overflow: hidden; }
.scroll-body { flex: 1; overflow: auto; position: relative; }
.scroll-body::-webkit-scrollbar, .page::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll-body::-webkit-scrollbar-thumb, .page::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ===== 表格 ===== */
table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 640px; }
thead tr { background: var(--surface); border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
th { padding: 5px 8px; font-size: 11px; font-weight: 600; color: var(--text3); text-align: center; letter-spacing: .04em;
     border-right: 1px solid var(--border); white-space: nowrap; overflow: hidden; position: relative; cursor: pointer; user-select: none; }
th:last-child { border-right: none; cursor: default; }
th.sortable:hover { background: var(--bg); color: var(--text2); }
th .sort-icon { margin-left: 3px; font-size: 9px; }
.col-resize { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 11; }
.col-resize:hover, .col-resize.resizing { background: var(--accent); opacity: .4; }

/* 行高必须严格等于 --row-h：虚拟滚动按固定行高换算可视区间 */
tbody tr { border-bottom: 1px solid var(--border); height: var(--row-h); transition: background .08s; }
tbody tr:hover { background: var(--surface); }
tbody tr.done-row { opacity: .6; }
tbody tr.done-row .cell-title { text-decoration: line-through; color: var(--text3); }
tbody tr.hold-row { opacity: .55; }
tbody tr.deleted-row { background: var(--deleted-bg); opacity: .7; }
tbody tr.vs-pad, tbody tr.vs-pad:hover { border: none; background: none; transition: none; }
tbody tr.vs-pad td { border: none; padding: 0; }
td { padding: 0 8px; font-size: 12.5px; color: var(--text); vertical-align: middle; border-right: 1px solid var(--border); overflow: hidden; white-space: nowrap; }
td:last-child { border-right: none; }
td.cell-center { text-align: center; }
td.col-check, th.col-check { text-align: center; padding: 0; }
.cb { width: 15px; height: 15px; cursor: pointer; accent-color: var(--done); }
.cell-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.cell-sub { color: var(--text3); font-size: 11px; }

/* 徽章 */
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 700; border: 1px solid transparent; cursor: pointer; }
.badge:hover { opacity: .75; }
.badge.ro, .badge.ro:hover { cursor: default; opacity: 1; }
.pri-1 { background: var(--p1-bg); color: var(--p1); border-color: var(--p1-border); }
.pri-2 { background: var(--p2-bg); color: var(--p2); border-color: var(--p2-border); }
.pri-3 { background: var(--p3-bg); color: var(--p3); border-color: var(--p3-border); }
.st-todo  { background: #f0eeea; color: #6b6660; border-color: #ddd9d3; }
.st-doing { background: var(--accent-light); color: var(--accent); border-color: #c0d9eb; }
.st-done  { background: #e8f5e9; color: #2e7d32; border-color: #c3e6c5; }
.st-hold  { background: #f3f1ee; color: #9a9590; border-color: #ddd9d3; }
.tag-chip { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 12px; padding: 0 5px; border-radius: 3px; margin-right: 2px; }
.tag-person { background: #eef3f8; color: #2c5f8a; }
.due-overdue { color: var(--overdue); font-weight: 600; }
.due-today { color: var(--p2); font-weight: 600; }
.code-chip { font-family: Consolas, Menlo, monospace; font-size: 11px; color: var(--text3); background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.ms-chip { display: inline-block; font-size: 11px; background: #fff5e6; color: #b5651d; border: 1px solid #f0d5b0; border-radius: 3px; padding: 0 5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.lines-preview { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.action-btn { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 2px 4px; border-radius: 3px; font-family: var(--font); }
.action-btn.del:hover { color: var(--p1); background: var(--p1-bg); }
.action-btn.restore:hover { color: var(--done); background: #e8f5e9; }
.action-btn.copy:hover, .action-btn.ms:hover { color: var(--accent); background: var(--accent-light); }
.inline-input { width: 100%; height: 26px; padding: 0 4px; border: 1px solid var(--accent); border-radius: 3px; font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.progress-wrap { display: flex; align-items: center; gap: 4px; }
.progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); }
.progress-num { font-size: 11px; color: var(--text3); width: 32px; text-align: right; flex-shrink: 0; }

/* ===== 卡片 / 仪表板 ===== */
.pad { padding: 14px 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 11px 13px; }
.card .k { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.card .v { font-size: 22px; font-weight: 700; color: var(--text); }
.card .v.warn { color: var(--overdue); }
.card .v.ok { color: var(--done); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
.panel-h { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-weight: 700; color: var(--text2); display: flex; align-items: center; justify-content: space-between; }
.panel-b { padding: 10px 12px; }
.hint { font-size: 12px; color: var(--text3); line-height: 1.8; }
.hint code { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; font-size: 11px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
.bar-row .nm { width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); flex-shrink: 0; }
/* 堆叠条：段间留 2px 表面色缝隙，避免相邻色块糊成一片 */
.bar-row .track { flex: 1; height: 14px; background: var(--c-track); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.bar-row .seg { height: 100%; }
.bar-row .seg-done  { background: var(--c-done); }
.bar-row .seg-doing { background: var(--c-doing); }
.bar-row .seg-late  { background: var(--c-late); }
.bar-row .seg-todo  { background: transparent; }
.bar-row .num { width: 82px; text-align: right; color: var(--text3); font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.bar-row.clickable { cursor: pointer; border-radius: 3px; }
.bar-row.clickable:hover { background: var(--bg); }
.legend { margin-top: 9px; font-size: 11px; color: var(--text3); display: flex; gap: 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

/* ===== 工作台布局 ===== */
.dash-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 1080px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }
.dash-col { min-width: 0; }
.card.clickable { cursor: pointer; transition: border-color .12s, background .12s; }
.card.clickable:hover { border-color: var(--accent); background: #fff; }

/* 分段控件 */
.seg-ctrl { display: flex; gap: 2px; }
.seg-ctrl .s { font-size: 11.5px; padding: 2px 9px; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); background: var(--surface); white-space: nowrap; }
.seg-ctrl .s:hover { border-color: var(--accent); color: var(--accent); }
.seg-ctrl .s.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg-ctrl .s .c { opacity: .75; margin-left: 3px; }

/* ===== 里程碑时间线（HTML/CSS 实现，文字为真实文本，天然响应式） ===== */
.tl { font-size: 12px; }
.tl-axis { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tl-axis .tl-name { color: var(--text3); font-size: 10px; }
.tl-ticks { flex: 1; position: relative; height: 14px; border-bottom: 1px solid var(--border); }
.tl-ticks .tk { position: absolute; top: 0; font-size: 10px; color: var(--text3); transform: translateX(-50%); white-space: nowrap; }
.tl-ticks .tk::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 1px; height: 4px; background: var(--border2); }
.tl-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; border-radius: 3px; }
.tl-row:hover { background: var(--bg); }
.tl-name { width: 172px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.tl-name .sub { color: var(--text3); font-size: 10.5px; }
.tl-track { flex: 1; position: relative; height: 16px; }
/* 今天基准线：贯穿所有行 */
.tl-track::before { content: ''; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--accent); opacity: .45; left: var(--today, 0%); }
.tl-dot { position: absolute; top: 4px; width: 9px; height: 9px; border-radius: 50%; transform: translateX(-50%); border: 2px solid var(--surface); box-sizing: content-box; }
.tl-dot.late  { background: var(--c-late); }
.tl-dot.soon  { background: var(--c-soon); }
.tl-dot.norm  { background: var(--c-doing); }
.tl-dot.done  { background: var(--c-done); }
.tl-date { width: 74px; flex-shrink: 0; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }

/* ===== 人员负荷 ===== */
.load-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; cursor: pointer; border-radius: 3px; }
.load-row:hover { background: var(--bg); }
.load-row .nm { width: 62px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.load-row .track { flex: 1; height: 13px; background: var(--c-track); border-radius: 3px; overflow: hidden; display: flex; gap: 2px; }
.load-row .num { width: 62px; text-align: right; font-size: 11px; color: var(--text3); flex-shrink: 0; font-variant-numeric: tabular-nums; }

/* ===== 图表页 ===== */
.chart-tabs { display: flex; gap: 2px; margin-bottom: 12px; }
.chart-tabs .t { font-size: 12.5px; padding: 5px 14px; border: 1px solid var(--border2); border-radius: 4px; cursor: pointer; color: var(--text2); background: var(--surface); }
.chart-tabs .t:hover { border-color: var(--accent); color: var(--accent); }
.chart-tabs .t.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.chart-note { font-size: 11px; color: var(--text3); margin-top: 8px; line-height: 1.7; }
.svg-wrap { position: relative; }
.svg-wrap svg { display: block; }
.ax-line { stroke: var(--border); stroke-width: 1; }
.ax-grid { stroke: var(--border); stroke-width: 1; opacity: .55; }
.ax-text { font-family: var(--font); font-size: 10px; fill: var(--text3); }
.ax-text.val { font-size: 10.5px; fill: var(--text2); }
.ln { fill: none; stroke-width: 2; }
.ln-new { stroke: var(--c-doing); }
.ln-done { stroke: var(--c-done); stroke-dasharray: 5 3; }   /* 二次编码：不靠颜色也能区分 */
.mk { stroke: var(--surface); stroke-width: 2; }
.mk-new { fill: var(--c-doing); }
.mk-done { fill: var(--c-done); }
.bar-late { fill: var(--c-late); }
.bar-norm { fill: var(--c-doing); }
.bar-soon { fill: var(--c-soon); }
.crosshair { stroke: var(--accent); stroke-width: 1; opacity: .5; }
#chart-tip { position: absolute; display: none; background: var(--snack-bg); color: #fff; font-size: 11.5px;
  padding: 5px 9px; border-radius: 4px; pointer-events: none; white-space: nowrap; z-index: 50; line-height: 1.6; }
#chart-tip.show { display: block; }
#chart-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* 图表内嵌表格（无障碍：图形之外始终有一份可读数据） */
.dtable { width: 100%; border-collapse: collapse; font-size: 12px; }
.dtable th { background: var(--bg); font-size: 11px; padding: 4px 8px; text-align: right; color: var(--text3);
  border-bottom: 1px solid var(--border); cursor: default; position: static; white-space: nowrap; }
.dtable th:first-child, .dtable td:first-child { text-align: left; }
.dtable td { padding: 3px 8px; border-bottom: 1px solid var(--border); text-align: right;
  border-right: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dtable tr:hover { background: var(--bg); }
.toggle-view { font-size: 11px; padding: 1px 8px; border: 1px solid var(--border2); border-radius: 3px;
  cursor: pointer; color: var(--text2); background: var(--surface); }
.toggle-view:hover { border-color: var(--accent); color: var(--accent); }

/* 甘特 */
.gantt-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-radius: 3px; }
.gantt-row:hover { background: var(--bg); }
.gantt-name { width: 200px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text2); cursor: pointer; }
.gantt-name .code { font-family: Consolas, monospace; font-size: 10.5px; color: var(--text3); margin-right: 4px; }
.gantt-track { flex: 1; position: relative; height: 18px; }
.gantt-track::before { content: ''; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--accent); opacity: .45; left: var(--today, 0%); }
.gantt-span { position: absolute; top: 7px; height: 4px; background: var(--c-track); border-radius: 2px; }
.gantt-pt { position: absolute; top: 4px; width: 9px; height: 9px; border-radius: 50%; transform: translateX(-50%);
  border: 2px solid var(--surface); box-sizing: content-box; cursor: pointer; }
.gantt-pt.late { background: var(--c-late); }
.gantt-pt.soon { background: var(--c-soon); }
.gantt-pt.norm { background: var(--c-doing); }
.gantt-pt.done { background: var(--c-done); }
.gantt-cnt { width: 56px; flex-shrink: 0; text-align: right; font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }

/* ===== 最近动态 ===== */
.feed .li { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 12px; align-items: baseline; cursor: pointer; }
.feed .li:last-child { border-bottom: none; }
.feed .li:hover { background: var(--bg); }
.feed .who { color: var(--accent); flex-shrink: 0; }
.feed .what { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); }
.feed .when { color: var(--text3); font-size: 10.5px; flex-shrink: 0; }
.mini-list { font-size: 12.5px; }
.mini-list .li { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); cursor: pointer; align-items: center; }
.mini-list .li:last-child { border-bottom: none; }
.mini-list .li:hover { background: var(--bg); }
.mini-list .d { width: 62px; flex-shrink: 0; font-size: 11px; }
.mini-list .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-list .p { flex-shrink: 0; color: var(--text3); font-size: 11px; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty-mini { color: var(--text3); font-size: 12px; padding: 6px 0; }

/* ===== 弹窗 ===== */
#modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 3000; align-items: center; justify-content: center; }
#modal-overlay.show { display: flex; }
#modal-box { background: var(--surface); border-radius: 6px; padding: 20px 22px; max-width: 620px; width: 92%; box-shadow: 0 8px 32px rgba(0,0,0,.22); max-height: 86vh; display: flex; flex-direction: column; }
#modal-box h3 { font-size: 14px; color: var(--text); margin-bottom: 10px; flex-shrink: 0; }
#modal-body { font-size: 12.5px; color: var(--text2); margin-bottom: 16px; line-height: 1.6; overflow-y: auto; }
#modal-body p { word-break: break-all; }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; }
.btn-cancel { height: 28px; padding: 0 14px; border: 1px solid var(--border2); border-radius: 4px; background: var(--surface); font-family: var(--font); font-size: 12px; cursor: pointer; }
.btn-confirm { height: 28px; padding: 0 14px; border: none; border-radius: 4px; background: var(--accent); color: #fff; font-family: var(--font); font-size: 12px; cursor: pointer; }
.btn-confirm.danger { background: var(--p1); }
.btn-confirm:hover { opacity: .85; }
.modal-textarea { width: 100%; min-height: 170px; padding: 7px 9px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font); font-size: 12.5px; line-height: 1.7; color: var(--text); background: #fff; outline: none; resize: vertical; }
.modal-textarea:focus { border-color: var(--accent); }
.form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.form-row label { width: 78px; flex-shrink: 0; color: var(--text2); font-size: 12px; text-align: right; }
.form-row input, .form-row select { flex: 1; height: 27px; padding: 0 7px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.form-row input:focus { border-color: var(--accent); }

/* 里程碑面板 */
.ms-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ms-table th { background: var(--bg); font-size: 11px; padding: 4px 6px; text-align: left; color: var(--text3); border-bottom: 1px solid var(--border); cursor: default; position: static; }
.ms-table td { padding: 3px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; border-right: none; }
.ms-table input { width: 100%; height: 25px; padding: 0 5px; border: 1px solid transparent; border-radius: 3px; font-family: var(--font); font-size: 12.5px; background: transparent; color: var(--text); outline: none; }
.ms-table input:hover { border-color: var(--border2); background: #fff; }
.ms-table input:focus { border-color: var(--accent); background: #fff; }
.ms-table select { height: 25px; border: 1px solid var(--border2); border-radius: 3px; font-family: var(--font); font-size: 12px; background: #fff; }

/* ===== 浮层 ===== */
#select-popup { display: none; position: fixed; z-index: 5000; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 6px; min-width: 170px; max-width: 300px; max-height: 420px; overflow-y: auto; }
#select-popup.show { display: block; }
.sp-item { display: flex; align-items: center; gap: 6px; padding: 4px 8px; cursor: pointer; border-radius: 3px; font-size: 12.5px; color: var(--text2); white-space: nowrap; overflow: hidden; }
.sp-item:hover { background: var(--accent-light); color: var(--accent); }
.sp-item.selected { color: var(--accent); font-weight: 600; background: var(--accent-light); }
.sp-item input[type=checkbox] { accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.sp-item label { cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.sp-header { padding: 3px 8px 5px; font-size: 10px; font-weight: 700; color: var(--text3); letter-spacing: .06em; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.sp-addnew { color: var(--accent); font-weight: 600; }
.sp-confirm { width: 100%; margin-top: 5px; height: 24px; border: none; border-radius: 3px; background: var(--accent); color: #fff; font-family: var(--font); font-size: 11px; cursor: pointer; }
#date-picker-wrap { display: none; position: fixed; z-index: 4000; background: var(--surface); border: 1px solid var(--border2); border-radius: 5px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 10px; width: 210px; }
#date-picker-wrap.show { display: block; }
.dp-shortcuts { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
.dp-sc { font-size: 11px; padding: 2px 7px; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); background: var(--bg); }
.dp-sc:hover { border-color: var(--accent); color: var(--accent); }
.dp-clear-sc { color: var(--text3) !important; }
.dp-clear-sc:hover { color: var(--p1) !important; border-color: var(--p1) !important; }
.dp-cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 3px 2px 5px; }
.dp-cal-nav-btn { background: none; border: 1px solid var(--border2); border-radius: 3px; cursor: pointer; color: var(--text2); font-size: 14px; line-height: 1; padding: 1px 6px; }
.dp-cal-title { font-size: 12px; font-weight: 600; color: var(--text); }
.dp-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.dp-cal-dow { text-align: center; font-size: 10px; color: var(--text3); padding: 2px 0; font-weight: 600; }
.dp-cal-day { text-align: center; font-size: 12px; padding: 3px 2px; cursor: pointer; border-radius: 3px; color: var(--text2); }
.dp-cal-day:hover { background: var(--accent-light); color: var(--accent); }
.dp-cal-day.is-today { color: var(--accent); font-weight: 700; }
.dp-cal-day.is-selected { background: var(--accent); color: #fff !important; }
.dp-cal-day.is-empty { cursor: default; pointer-events: none; }

#snackbar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--snack-bg); color: #fff; padding: 8px 16px; border-radius: 5px; font-size: 12.5px; display: flex; align-items: center; gap: 10px; z-index: 6000; transition: transform .22s ease; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.28); }
#snackbar.show { transform: translateX(-50%) translateY(0); }
.undo-btn { background: none; border: none; color: #7ec8f7; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 0; font-family: var(--font); }
#statusbar { display: flex; align-items: center; justify-content: space-between; padding: 3px 12px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; font-size: 11px; color: var(--text3); }
#empty-state { display: none; padding: 40px; text-align: center; color: var(--text3); font-size: 13px; }

/* ===== 批量操作条 ===== */
#batch-bar { display: none; align-items: center; gap: 8px; padding: 5px 12px; background: var(--accent-light); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#batch-bar.show { display: flex; }
#batch-bar .n { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
#batch-bar .btn { height: 24px; font-size: 11.5px; }
tbody tr.sel-row { background: #eaf2f8; }
tbody tr.sel-row:hover { background: #e0ecf5; }
td.col-sel, th.col-sel { text-align: center; padding: 0; }
.cb-sel { width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); }

/* ===== 任务详情表单 ===== */
.detail-grid { display: grid; grid-template-columns: 84px 1fr 84px 1fr; gap: 7px 8px; align-items: center; }
.detail-grid label { font-size: 12px; color: var(--text2); text-align: right; }
.detail-grid .full { grid-column: 2 / 5; }
.detail-grid .full-row { grid-column: 1 / 5; }
.detail-grid input, .detail-grid select, .detail-grid textarea {
  width: 100%; height: 27px; padding: 0 7px; border: 1px solid var(--border2); border-radius: 4px;
  font-family: var(--font); font-size: 12.5px; color: var(--text); background: #fff; outline: none; }
.detail-grid textarea { height: auto; min-height: 54px; padding: 5px 7px; line-height: 1.6; resize: vertical; }
.detail-grid input:focus, .detail-grid select:focus, .detail-grid textarea:focus { border-color: var(--accent); }
.detail-meta { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text3); }

/* ===== 列配置 ===== */
.col-cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; }
.col-cfg .it { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); padding: 3px 4px; border-radius: 3px; }
.col-cfg .it:hover { background: var(--bg); }
.col-cfg input { accent-color: var(--accent); cursor: pointer; }
.col-cfg label { cursor: pointer; }
</style>
</head>
<body>

    <span class="dp-sc" data-act="dp-sc" data-tok="+30">30天后</span>

<script>
'use strict';
/* =============================================================
   0. 基础工具
   ============================================================= */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ★ 可迁移性设计 1：随机串主键。
   多人各自新建记录时自增整数必然撞号，合并数据将无法区分。
   前缀便于肉眼识别实体类型，时间戳保证大致有序。 */
function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function uniq(a) { return [...new Set(a)]; }

/* =============================================================
   1. 枚举与常量
   ============================================================= */
const CATEGORIES = [
  { v: '一、前瞻研判', label: '一、前瞻研判', color: '#2c5f8a' },
  { v: '二、集团治理', label: '二、集团治理', color: '#7d5ba6' },
  { v: '三、价值共创', label: '三、价值共创', color: '#2e8b57' },
  { v: '四、其它工作', label: '四、其它工作', color: '#8a7f70' },
];
const TASK_STATUS = [
  { v: 'todo',  label: '未开始', color: '#6b6660', cls: 'st-todo' },
  { v: 'doing', label: '进行中', color: '#2c5f8a', cls: 'st-doing' },
  { v: 'done',  label: '已完成', color: '#2e7d32', cls: 'st-done' },
  { v: 'hold',  label: '已挂起', color: '#9a9590', cls: 'st-hold' },
];
const WORK_STATUS = [
  { v: 'doing', label: '进行中', color: '#2c5f8a', cls: 'st-doing' },
  { v: 'done',  label: '已完成', color: '#2e7d32', cls: 'st-done' },
  { v: 'hold',  label: '暂停',   color: '#9a9590', cls: 'st-hold' },
];
const MS_STATUS = [
  { v: 'todo',  label: '未开始', color: '#6b6660', cls: 'st-todo' },
  { v: 'doing', label: '进行中', color: '#2c5f8a', cls: 'st-doing' },
  { v: 'done',  label: '已完成', color: '#2e7d32', cls: 'st-done' },
];
const PRIORITIES = [
  { v: '1', label: '高', color: '#c0392b', cls: 'pri-1' },
  { v: '2', label: '中', color: '#e67e22', cls: 'pri-2' },
  { v: '3', label: '低', color: '#4a7fa5', cls: 'pri-3' },
];
const ROLES = [
  { v: 'member',  label: '处员' },
  { v: 'manager', label: '管理者' },
];

/* =============================================================
   2. 实体元数据（单一事实来源）
   -------------------------------------------------------------
   四个实体共用同一套渲染 / 筛选 / 排序 / 编辑 / CSV 引擎。
   字段 type：
     text  单行文本   lines 多行文本(数组)   single 单选标签   multi 多选标签
     person 单人      persons 多人           enum 固定枚举     ref 引用其它实体
     date 日期        num 数字
   ============================================================= */
const SCHEMAS = {
  duty: {
    key: 'duty', label: '职责', pk: 'code', titleField: 'name',
    fields: [
      { key: 'code',     label: '编号',     type: 'text', width: 56,  sortable: true, readonly: true, align: 'center' },
      { key: 'category', label: '职责分类', type: 'enum', width: 118, sortable: true, facet: true, options: CATEGORIES },
      { key: 'name',     label: '核心职责', type: 'text', width: 400, sortable: true },
      { key: 'ref',      label: '2025发文', type: 'text', width: 90,  sortable: true, align: 'center' },
    ],
  },
  /* 工作的主键是随机 id，code 只是业务编号：
     年度内唯一，跨年可重复（2025 与 2026 都能有 0101），
     否则「复制到新年度」无法成立。 */
  work: {
    key: 'work', label: '工作', pk: 'id', titleField: 'name',
    fields: [
      { key: 'code',          label: '工作编号',     type: 'text',    width: 78,  sortable: true, readonly: true, align: 'center' },
      { key: 'duty',          label: '所属职责',     type: 'ref',     width: 170, sortable: true, facet: true, ref: 'duty' },
      { key: 'name',          label: '工作名称',     type: 'text',    width: 210, sortable: true },
      { key: 'content',       label: '主要工作内容', type: 'lines',   width: 300 },
      { key: 'owner',         label: '牵头人',       type: 'person',  width: 82,  sortable: true, facet: true },
      { key: 'collaborators', label: '协同人员',     type: 'persons', width: 140, facet: true },
      { key: 'year',          label: '年度',         type: 'num',     width: 58,  sortable: true, align: 'center' },
      { key: 'status',        label: '状态',         type: 'enum',    width: 68,  sortable: true, facet: true, options: WORK_STATUS },
    ],
  },
  milestone: {
    key: 'milestone', label: '里程碑', pk: 'id', titleField: 'name',
    fields: [
      { key: 'work',        label: '所属工作', type: 'ref',  ref: 'work' },
      { key: 'name',        label: '里程碑',   type: 'text' },
      { key: 'plan_date',   label: '计划日期', type: 'date' },
      { key: 'actual_date', label: '实际日期', type: 'date' },
      { key: 'status',      label: '状态',     type: 'enum', options: MS_STATUS },
    ],
  },
  task: {
    key: 'task', label: '任务', pk: 'id', titleField: 'title',
    fields: [
      // 虚拟字段：任务不存职责，从所属工作推导，用于按职责筛选与统计
      { key: '_duty', label: '职责', type: 'ref', ref: 'duty', width: 150, virtual: true, facet: true,
        derive: t => { const w = byId('work', t.work); return w ? w.duty : ''; } },
      { key: 'work',        label: '所属工作', type: 'ref',     width: 175, sortable: true, facet: true, ref: 'work' },
      { key: 'title',       label: '任务',     type: 'text',    width: 230, sortable: true },
      { key: 'owner',       label: '负责人',   type: 'person',  width: 78,  sortable: true, facet: true },
      { key: 'assignees',   label: '参与人',   type: 'persons', width: 120, facet: true },
      { key: 'status',      label: '状态',     type: 'enum',    width: 68,  sortable: true, facet: true, options: TASK_STATUS },
      { key: 'priority',    label: '优先级',   type: 'enum',    width: 56,  sortable: true, facet: true, options: PRIORITIES },
      { key: 'plan_date',   label: '计划完成', type: 'date',    width: 84,  sortable: true },
      { key: 'milestone',   label: '里程碑',   type: 'ref',     width: 120, sortable: true, ref: 'milestone',
        refScope: t => DB.milestones.filter(m => m.work === t.work && !m.deleted_at) },
      { key: 'deliverable', label: '交付物',   type: 'text',    width: 120, sortable: true },
      { key: 'progress',    label: '进度',     type: 'num',     width: 84,  sortable: true },
      { key: 'actual_date', label: '实际完成', type: 'date',    width: 84,  sortable: true },
      { key: 'source',      label: '来源',     type: 'single',  width: 84,  sortable: true, facet: true },
      { key: 'custom',      label: '标签',     type: 'single',  width: 74,  sortable: true, facet: true },
    ],
  },
};
const TASK_DEFAULT_COLS = ['work', 'title', 'owner', 'assignees', 'status', 'priority', 'plan_date', 'milestone', 'deliverable', 'progress'];

function schema(e) { return SCHEMAS[e]; }
function fieldDef(e, k) { return SCHEMAS[e].fields.find(f => f.key === k); }

const TASK_VIEWS = [
  { key: 'all',     label: '全部任务', match: t => !t.deleted_at },
  { key: 'mine',    label: '我的任务', match: t => !t.deleted_at && isMine(t) },
  { key: 'overdue', label: '逾期',     match: t => !t.deleted_at && isOverdue(t) },
  { key: 'today',   label: '今日到期', match: t => !t.deleted_at && isOpen(t) && t.plan_date === todayStr() },
  { key: 'week',    label: '本周',     match: t => !t.deleted_at && isOpen(t) && t.plan_date && t.plan_date >= todayStr() && t.plan_date <= endOfWeek() },
  { key: 'doing',   label: '进行中',   match: t => !t.deleted_at && t.status === 'doing' },
  { key: 'todo',    label: '未开始',   match: t => !t.deleted_at && t.status === 'todo' },
  { key: 'done',    label: '已完成',   match: t => !t.deleted_at && t.status === 'done' },
  { key: 'hold',    label: '已挂起',   match: t => !t.deleted_at && t.status === 'hold' },
  { key: 'deleted', label: '已删除',   match: t => !!t.deleted_at },
];
const TASK_VIEW_MAP = Object.fromEntries(TASK_VIEWS.map(v => [v.key, v]));

const PAGES = [
  { key: 'dashboard', label: '工作台' },
  { key: 'tasks',     label: '任务' },
  { key: 'works',     label: '工作' },
  { key: 'duties',    label: '职责' },
  { key: 'charts',    label: '图表' },
  { key: 'data',      label: '数据' },
];

/* =============================================================
   3. 数据层
   ============================================================= */
const STORAGE_KEY = 'todo_v4';

let DB = {
  duties: [], works: [], milestones: [], tasks: [],
  settings: { me: '', role: 'manager', year: new Date().getFullYear() },
};

// 主键索引，避免每次 find 线性扫描
const IDX = { duty: new Map(), work: new Map(), milestone: new Map(), task: new Map() };
const COLL = { duty: 'duties', work: 'works', milestone: 'milestones', task: 'tasks' };
function coll(e) { return DB[COLL[e]]; }
function rebuildIndex() {
  for (const e of Object.keys(IDX)) {
    IDX[e].clear();
    coll(e).forEach(r => IDX[e].set(r[schema(e).pk], r));
  }
}
function byId(e, id) { return id ? (IDX[e].get(id) || null) : null; }

/* ★ 可迁移性设计 2：存储层抽象为异步接口。
   localStorage 只是其中一个实现；将来换成内网服务端，只需替换本对象，
   上层页面与交互代码一行不改。 */
const Repo = {
  name: 'localStorage',
  async load() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  },
  async persist(db) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); return true; }
    catch (e) { showSnack('保存失败：本地存储可能已满，请到「数据」页导出备份'); return false; }
  },
  async upsert(entity, rec) {              // 单条写入；HTTP 实现时只发这一条
    stampMeta(rec);
    const list = coll(entity), pk = schema(entity).pk;
    const i = list.findIndex(r => r[pk] === rec[pk]);
    if (i === -1) list.push(rec); else list[i] = rec;
    IDX[entity].set(rec[pk], rec);
    await this.persist(DB);
    return rec;
  },
  async removeHard(entity, id) {
    const list = coll(entity), pk = schema(entity).pk;
    const i = list.findIndex(r => r[pk] === id);
    if (i !== -1) list.splice(i, 1);
    IDX[entity].delete(id);
    await this.persist(DB);
  },
  async bulk(fn) {                          // 批量操作只持久化一次
    fn(); rebuildIndex(); await this.persist(DB);
  },
};

/* ★ 可迁移性设计 3：每条记录带 updated_by / updated_at / rev。
   rev 是冲突检测的最小前提，updated_by 支撑「谁改的」。 */
function stampMeta(rec) {
  const now = new Date().toISOString();
  if (!rec.created_at) rec.created_at = now;
  rec.updated_at = now;
  rec.updated_by = DB.settings.me || '未署名';
  rec.rev = (rec.rev || 0) + 1;
  return rec;
}

/* ★ 可迁移性设计 4：软删除保留墓碑，合并多人数据时不会"复活"已删记录 */
function softDelete(entity, id) {
  const r = byId(entity, id);
  if (r) r.deleted_at = new Date().toISOString();
  return r;
}
function undelete(entity, id) {
  const r = byId(entity, id);
  if (r) delete r.deleted_at;
  return r;
}

/* 人员池：所有 person / persons 字段的取值汇总 */
function allPeople() {
  const s = new Set();
  for (const e of Object.keys(SCHEMAS)) {
    for (const f of schema(e).fields) {
      if (f.type !== 'person' && f.type !== 'persons') continue;
      coll(e).forEach(r => {
        const v = r[f.key];
        if (Array.isArray(v)) v.forEach(x => x && s.add(x));
        else if (v) s.add(v);
      });
    }
  }
  return [...s].sort((a, b) => a.localeCompare(b, 'zh'));
}

/* =============================================================
   4. 记录归一化
   ============================================================= */
function normalize(entity, r) {
  schema(entity).fields.forEach(f => {
    if (f.virtual) return;
    const v = r[f.key];
    switch (f.type) {
      case 'lines': case 'multi': case 'persons':
        if (typeof v === 'string') r[f.key] = v ? v.split('\n').map(s => s.trim()).filter(Boolean) : [];
        else if (!Array.isArray(v)) r[f.key] = [];
        break;
      case 'num':
        r[f.key] = (v === '' || v == null) ? (f.key === 'progress' ? 0 : '') : Number(v);
        break;
      case 'enum':
        r[f.key] = (v == null || v === '') ? f.options[0].v : String(v);
        break;
      default:
        if (v == null) r[f.key] = '';
    }
  });
  if (!r.rev) r.rev = 1;
  return r;
}
/* 迁移：早期版本用 work.code 当主键，任务与里程碑也用 code 引用工作。
   现在工作主键改为随机 id（好让同一编号能跨年度共存），
   故需给老工作补 id，并把所有引用从 code 重写为 id。
   幂等：已迁移过的数据再跑一次不会有副作用。 */
function migrateWorkIds() {
  const codeToId = new Map();
  let changed = false;
  DB.works.forEach(w => {
    if (!w.id) { w.id = uid('w'); changed = true; }
    if (w.code && !codeToId.has(w.code)) codeToId.set(w.code, w.id);
  });
  if (!codeToId.size) return false;
  const remap = (rec, key) => {
    const v = rec[key];
    if (!v) return;
    if (DB.works.some(w => w.id === v)) return;      // 已经是 id
    const id = codeToId.get(v);
    if (id) { rec[key] = id; changed = true; }
  };
  DB.tasks.forEach(t => remap(t, 'work'));
  DB.milestones.forEach(m => remap(m, 'work'));
  return changed;
}

function blank(entity, over) {
  const sc = schema(entity), r = {};
  sc.fields.forEach(f => { if (!f.virtual) r[f.key] = ''; });
  Object.assign(r, over || {});
  if (sc.pk === 'id' && !r.id) r.id = uid(entity[0]);
  return normalize(entity, r);
}

/* =============================================================
   5. 日期工具
   ============================================================= */
function fmtLocal(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function todayStr() { return fmtLocal(new Date()); }
function offsetDate(n) { const d = new Date(); d.setDate(d.getDate() + n); return fmtLocal(d); }
function weekdayDate(wd) {
  const t = new Date(); let diff = wd - t.getDay(); if (diff <= 0) diff += 7;
  const d = new Date(t); d.setDate(t.getDate() + diff); return fmtLocal(d);
}
function endOfWeek() {
  const t = new Date(), day = t.getDay(), diff = day === 0 ? 0 : 7 - day;
  const d = new Date(t); d.setDate(t.getDate() + diff); return fmtLocal(d);
}
function parseDue(tok) {
  const t = String(tok || '').toLowerCase();
  if (t === 'today') return todayStr();
  if (t === 'tomorrow') return offsetDate(1);
  if (t === 'next-mon') return weekdayDate(1);
  const dm = { mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6, sun: 0 };
  if (dm[t] !== undefined) return weekdayDate(dm[t]);
  const m = t.match(/^\+(\d+)d?$/); if (m) return offsetDate(parseInt(m[1]));
  if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(t)) {
    const [y, mo, d] = t.split('-').map(Number);
    return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  return null;
}
function fmtDate(str) {
  if (!str) return '';
  const today = todayStr();
  if (str === today) return '今天';
  if (str === offsetDate(1)) return '明天';
  const d = new Date(str + 'T00:00:00');
  if (isNaN(d)) return str;
  if (str >= today && str <= endOfWeek()) return '周' + ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  return d.getFullYear() === new Date().getFullYear()
    ? `${d.getMonth() + 1}/${d.getDate()}`
    : `${String(d.getFullYear()).slice(2)}/${d.getMonth() + 1}/${d.getDate()}`;
}
function dateClass(str) {
  if (!str) return '';
  const today = todayStr();
  if (str < today) return 'due-overdue';
  if (str === today) return 'due-today';
  return '';
}

/* 任务语义 */
function isOpen(t) { return t.status === 'todo' || t.status === 'doing'; }
function isOverdue(t) { return isOpen(t) && !!t.plan_date && t.plan_date < todayStr(); }   // 挂起不计逾期
function isMine(t) {
  const me = DB.settings.me;
  return me ? (t.owner === me || (t.assignees || []).includes(me)) : false;
}

/* =============================================================
   6. 字段取值 / 展示
   ============================================================= */
function values(entity, rec, f) {
  if (f.derive) { const v = f.derive(rec); return v ? [String(v)] : []; }
  const v = rec[f.key];
  if (Array.isArray(v)) return v.filter(Boolean).map(String);
  if (v === '' || v == null) return [];
  return [String(v)];
}
function label(entity, f, v) {
  if (f.options) { const o = f.options.find(x => x.v === String(v)); return o ? o.label : String(v); }
  if (f.type === 'ref') {
    const r = byId(f.ref, v);
    if (!r) return String(v);
    const rs = schema(f.ref);
    return (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '');
  }
  return String(v);
}
function displayText(entity, rec, f) {
  return values(entity, rec, f).map(v => label(entity, f, v)).join(' / ');
}
function searchText(entity, rec) {
  return schema(entity).fields.map(f => displayText(entity, rec, f)).join(' ').toLowerCase();
}
function sortValue(entity, rec, key) {
  const f = fieldDef(entity, key);
  if (!f) return '';
  if (f.type === 'num') return Number(rec[key]) || 0;
  if (f.type === 'enum') {
    const i = f.options.findIndex(o => o.v === String(rec[key]));
    return i < 0 ? 99 : i;
  }
  if (f.type === 'date') return rec[key] || '';
  return values(entity, rec, f).map(v => label(entity, f, v)).join(',');
}

/* =============================================================
   7. 撤销：整库快照
   ============================================================= */
const UNDO_LIMIT = 20;
let undoStack = [];
function snapshot() {
  undoStack.push(JSON.stringify({ duties: DB.duties, works: DB.works, milestones: DB.milestones, tasks: DB.tasks }));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
}
async function undoLast() {
  const s = undoStack.pop();
  if (!s) { showSnack('没有可撤销的操作'); return; }
  const d = JSON.parse(s);
  DB.duties = d.duties; DB.works = d.works; DB.milestones = d.milestones; DB.tasks = d.tasks;
  rebuildIndex();
  await Repo.persist(DB);
  hideSnack();
  if ($('#modal-overlay').classList.contains('show')) closeModal();
  renderShell(); renderPage();
}

/* =============================================================
   8. 查询：过滤 / 排序 / 分面
   ============================================================= */
function matchFilters(entity, rec, filters) {
  for (const [k, sel] of Object.entries(filters || {})) {
    if (!sel) continue;
    const f = fieldDef(entity, k);
    if (!f) continue;
    const vals = values(entity, rec, f);
    if (sel === '__empty__') { if (vals.length) return false; }
    else if (!vals.includes(sel)) return false;
  }
  return true;
}
function query(entity, opt) {
  const q = (opt.search || '').trim().toLowerCase();
  const rows = (opt.pool || coll(entity)).filter(r => {
    if (!matchFilters(entity, r, opt.filters)) return false;
    if (q && !searchText(entity, r).includes(q)) return false;
    return true;
  });
  if (opt.sortKey) {
    const dir = opt.sortDir || 1;
    const f = fieldDef(entity, opt.sortKey);
    rows.sort((a, b) => {
      const va = sortValue(entity, a, opt.sortKey), vb = sortValue(entity, b, opt.sortKey);
      if (f && f.type === 'date') {           // 无日期的排最前，便于补录
        if (!va && !vb) return (b.created_at || '').localeCompare(a.created_at || '');
        if (!va) return -1;
        if (!vb) return 1;
      }
      if (va < vb) return -dir;
      if (va > vb) return dir;
      return 0;
    });
  }
  return rows;
}
/* 分面统计口径与当前视图一致，但不受其它分面影响 */
function facet(entity, f, rows) {
  const cnt = new Map();
  let empty = 0;
  rows.forEach(r => {
    const vals = values(entity, r, f);
    if (!vals.length) { empty++; return; }
    vals.forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1));
  });
  let items;
  if (f.options) items = f.options.map(o => ({ value: o.v, label: o.label, color: o.color, count: cnt.get(o.v) || 0 }));
  else items = [...cnt.entries()]
    .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh'))
    .map(([v, n]) => ({ value: v, label: label(entity, f, v), count: n }));
  items.push({ value: '__empty__', label: '（空）', count: empty, isEmpty: true });
  return items;
}
function optionsOf(entity, f, rec) {
  if (f.type === 'ref') {
    let list = f.refScope && rec ? f.refScope(rec) : coll(f.ref).filter(r => !r.deleted_at);
    if (f.ref === 'work') list = list.filter(w => inYear(w));
    const rs = schema(f.ref);
    return list.map(r => ({ v: r[rs.pk], label: (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '') }));
  }
  if (f.type === 'person' || f.type === 'persons') return allPeople().map(p => ({ v: p, label: p }));
  if (f.options) return f.options.map(o => ({ v: o.v, label: o.label }));
  const cnt = new Map();
  coll(entity).forEach(r => values(entity, r, f).forEach(v => cnt.set(v, (cnt.get(v) || 0) + 1)));
  return [...cnt.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'zh'))
    .map(([v]) => ({ v, label: v }));
}

/* =============================================================
   9. 页面状态与路由
   ============================================================= */
let currentPage = 'dashboard';
const UI = {
  tasks: {
    view: 'all', filters: {}, search: '', sortKey: 'plan_date', sortDir: 1,
    cols: [...TASK_DEFAULT_COLS], widths: {},
    expanded: new Set(),   // 树形筛选中展开的职责编号
    sel: new Set(),        // 批量操作选中的任务 id
    lastSelIdx: -1,        // Shift 范围选择的锚点
  },
  works:  { filters: {}, search: '', sortKey: 'code', sortDir: 1, widths: {} },
  duties: { filters: {}, search: '', sortKey: 'code', sortDir: 1, widths: {} },
};

/* 列显示/列宽属于个人偏好，随 settings 一起持久化 */
function persistUI() {
  // 必须存副本：直接存引用会让 settings 与 UI 变成同一个对象，
  // 之后任何列宽改动都会静默改写 settings，restore 也就成了空操作
  DB.settings.ui = {
    taskCols: [...UI.tasks.cols],
    widths: {
      tasks: { ...UI.tasks.widths },
      works: { ...UI.works.widths },
      duties: { ...UI.duties.widths },
    },
  };
  return Repo.persist(DB);
}
function restoreUI() {
  const ui = DB.settings.ui;
  if (!ui) return;
  if (Array.isArray(ui.taskCols)) {
    const valid = ui.taskCols.filter(k => fieldDef('task', k));
    if (valid.length) UI.tasks.cols = valid;
  }
  if (ui.widths) ['tasks', 'works', 'duties'].forEach(p => Object.assign(UI[p].widths, ui.widths[p] || {}));
}
schema('task').fields.forEach(f => { UI.tasks.widths[f.key] = f.width || 100; });
UI.tasks.widths.sel = 30; UI.tasks.widths.check = 32; UI.tasks.widths.action = 84;
schema('work').fields.forEach(f => { UI.works.widths[f.key] = f.width || 100; });
UI.works.widths.ms = 76; UI.works.widths.stat = 104; UI.works.widths.action = 44;
schema('duty').fields.forEach(f => { UI.duties.widths[f.key] = f.width || 100; });
UI.duties.widths.stat = 150; UI.duties.widths.action = 44;

function goto(page) {
  if (!PAGES.some(p => p.key === page)) page = 'dashboard';
  currentPage = page;
  if (location.hash !== '#/' + page) location.hash = '#/' + page;
  renderShell(); renderPage();
}
window.addEventListener('hashchange', () => {
  const p = (location.hash || '').replace(/^#\//, '');
  if (p && p !== currentPage) goto(p);
});

/* =============================================================
   10. 外壳：导航 / 侧栏 / 工具栏
   ============================================================= */
function renderShell() {
  $('#nav').innerHTML = PAGES.map(p =>
    `<div class="nav-item${currentPage === p.key ? ' active' : ''}" data-act="goto" data-page="${p.key}">${esc(p.label)}</div>`).join('');

  const years = uniq(DB.works.map(w => w.year).filter(Boolean)).sort((a, b) => b - a);
  if (DB.settings.year && !years.includes(DB.settings.year)) years.unshift(DB.settings.year);
  $('#year-select').innerHTML =
    years.map(y => `<option value="${y}"${y === DB.settings.year ? ' selected' : ''}>${y} 年度</option>`).join('') +
    `<option value="0"${!DB.settings.year ? ' selected' : ''}>全部年度</option>`;

  const me = DB.settings.me;
  $('#me-tag').textContent = me ? `${me}（${(ROLES.find(r => r.v === DB.settings.role) || {}).label}）` : '未设置使用者';

  $$('.page').forEach(el => el.classList.toggle('active', el.id === 'page-' + currentPage));
  renderSidebar();
  renderToolbar();
}

function facetBlock(entity, f, rows, filters, act) {
  const items = facet(entity, f, rows).filter(i => i.count > 0 || filters[f.key] === i.value);
  if (!items.length) return '';
  let h = `<div class="sb-section-title">◆ ${esc(f.label)}</div>`;
  h += `<div class="sb-item${!filters[f.key] ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val=""><span class="sb-label">全部</span></div>`;
  h += items.map(i =>
    `<div class="sb-item indent${filters[f.key] === i.value ? ' active' : ''}" data-act="${act}" data-field="${f.key}" data-val="${esc(i.value)}">
       <span class="sb-label${i.isEmpty ? ' is-empty-val' : ''}"${i.color ? ` style="color:${i.color}"` : ''}>${esc(i.label)}</span>
       <span class="cnt">${i.count || ''}</span></div>`).join('');
  return h + '<hr class="sb-divider">';
}

function renderSidebar() {
  const sb = $('#sidebar');
  const foot = `<div class="sb-copyright">&#174; 科技规划处&nbsp;徐捷<br><span style="opacity:.7">存储：${esc(Repo.name)}</span></div>`;
  let html = '';

  if (currentPage === 'tasks') {
    const st = UI.tasks, all = visibleTasks();
    html += `<div class="sb-section-title">◆ 视图</div>` + TASK_VIEWS.map(v =>
      `<div class="sb-item${st.view === v.key ? ' active' : ''}" data-act="task-view" data-view="${v.key}">
         <span class="sb-label">${esc(v.label)}</span><span class="cnt">${all.filter(v.match).length || ''}</span></div>`).join('');
    html += '<hr class="sb-divider">';
    const rows = all.filter(TASK_VIEW_MAP[st.view].match);
    html += renderTaskTree(rows);
    // 职责与工作已由树承担，其余分面仍平铺
    schema('task').fields.filter(f => f.facet && f.key !== '_duty' && f.key !== 'work')
      .forEach(f => { html += facetBlock('task', f, rows, st.filters, 'task-filter'); });
  } else if (currentPage === 'works') {
    const st = UI.works, rows = visibleWorks();
    schema('work').fields.filter(f => f.facet).forEach(f => { html += facetBlock('work', f, rows, st.filters, 'work-filter'); });
  } else if (currentPage === 'duties') {
    const st = UI.duties, rows = DB.duties.filter(d => !d.deleted_at);
    html += facetBlock('duty', fieldDef('duty', 'category'), rows, st.filters, 'duty-filter');
  } else {
    sb.classList.add('hidden'); sb.innerHTML = ''; return;
  }
  sb.classList.remove('hidden');
  sb.innerHTML = html + foot;
}

/* 两级树筛选：职责 → 工作。
   计数按当前视图统计；选中某工作时自动展开其所属职责。
   点职责 = 按职责筛选（含其下全部工作），点工作 = 按单个工作筛选。 */
function renderTaskTree(rows) {
  const st = UI.tasks;
  const byWork = new Map();
  let noWork = 0;
  rows.forEach(t => {
    if (!t.work) noWork++;
    else byWork.set(t.work, (byWork.get(t.work) || 0) + 1);
  });

  const dutyMap = new Map();
  visibleWorks().forEach(w => {
    const c = byWork.get(w.id) || 0;
    if (!dutyMap.has(w.duty)) dutyMap.set(w.duty, { count: 0, works: [] });
    const e = dutyMap.get(w.duty);
    e.count += c;
    if (c > 0 || st.filters.work === w.id) e.works.push({ w, c });
  });

  const selWork = st.filters.work && st.filters.work !== '__empty__' ? byId('work', st.filters.work) : null;
  const noneSelected = !st.filters._duty && !st.filters.work;

  let h = `<div class="sb-section-title">◆ 职责 / 工作</div>`;
  h += `<div class="sb-item${noneSelected ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="">
          <span class="sb-label">全部</span><span class="cnt">${rows.length || ''}</span></div>`;

  DB.duties.filter(d => !d.deleted_at).forEach(d => {
    const e = dutyMap.get(d.code);
    if (!e || (!e.count && st.filters._duty !== d.code)) return;
    const open = st.expanded.has(d.code) || (selWork && selWork.duty === d.code);
    h += `<div class="sb-item tree-duty${st.filters._duty === d.code ? ' active' : ''}" data-act="tree-pick" data-duty="${esc(d.code)}" data-work="" title="${esc(d.code + ' ' + d.name)}">
            <span class="sb-caret" data-act="tree-toggle" data-duty="${esc(d.code)}">${open ? '▾' : '▸'}</span>
            <span class="sb-label">${esc(d.code + ' ' + d.name)}</span>
            <span class="cnt">${e.count || ''}</span></div>`;
    if (open) h += e.works.map(({ w, c }) =>
      `<div class="sb-item indent2${st.filters.work === w.id ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="${esc(w.id)}" title="${esc(w.code + ' ' + w.name)}">
         <span class="sb-label">${esc(w.name)}</span><span class="cnt">${c || ''}</span></div>`).join('');
  });

  if (noWork || st.filters.work === '__empty__') {
    h += `<div class="sb-item${st.filters.work === '__empty__' ? ' active' : ''}" data-act="tree-pick" data-duty="" data-work="__empty__">
            <span class="sb-label is-empty-val">未归属工作</span><span class="cnt">${noWork || ''}</span></div>`;
  }
  return h + '<hr class="sb-divider">';
}

function renderToolbar() {

  if (currentPage === 'tasks') {
    const st = UI.tasks;
    const chips = Object.entries(st.filters).filter(([, v]) => v).map(([k, v]) => {

      return `<span class="filter-chip" data-act="task-filter" data-field="${k}" data-val="">${esc(f.label)}:${esc(txt)} ×</span>`;
    }).join('');
    tb.innerHTML = `<span id="view-label">${esc(TASK_VIEW_MAP[st.view].label)}</span>${chips}` +
      `<input id="quick-input" type="text" placeholder="新建任务… 标题 $0101 @参与人 !1 ~2026-08-31  回车提交">` +
      `<button class="btn" data-act="col-config" title="选择显示哪些列">▦ 列</button>` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else if (currentPage === 'works' || currentPage === 'duties') {
    const st = UI[currentPage];
    tb.innerHTML = `<span id="view-label">${currentPage === 'works' ? '工作管理' : '职责管理'}</span>` +
      `<button class="btn primary" data-act="${currentPage === 'works' ? 'work-new' : 'duty-new'}">+ 新建${currentPage === 'works' ? '工作' : '职责'}</button>` +
      `<span class="hint">双击单元格编辑</span>` +
      `<input id="search-input" type="text" placeholder="/ 搜索…" value="${esc(st.search)}">`;
  } else {
    const p = PAGES.find(x => x.key === currentPage);
    tb.innerHTML = `<span id="view-label">${esc(p ? p.label : '')}</span>`;
    return;
  }
  bindToolbarInputs(currentPage);
}

function bindToolbarInputs(page) {
  const si = $('#search-input');
  if (si) {
    let timer = null;
    si.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => { UI[page].search = si.value; renderPage(); si.focus(); }, 150);
    });
  }
  const qi = $('#quick-input');
  if (qi) qi.addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    e.stopPropagation();
    const raw = qi.value.trim();
    if (!raw) return;
    snapshot();
    const t = parseQuickInput(raw);
    await Repo.upsert('task', t);
    qi.value = '';
    if (UI.tasks.view === 'deleted') UI.tasks.view = 'all';
    renderShell(); renderPage();
    showSnack(`已添加：${t.title}`);
  });
}

function renderHead(hostSel, entity, cols, st, extra) {
  const all = [...((extra && extra.lead) || []), ...cols, ...((extra && extra.tail) || [])];
  const lastKey = typeof all[all.length - 1] === 'string' ? all[all.length - 1] : all[all.length - 1].key;
  $(hostSel).innerHTML = all.map(c => {
    const isField = typeof c === 'string';
    const f = isField ? fieldDef(entity, c) : null;
    const key = isField ? c : c.key;
    const cls = [];
    const attrs = [`data-key="${key}"`, `style="width:${st.widths[key] || 90}px"`];
    let inner = esc(isField ? f.label : c.label);
    if (key === 'check') cls.push('col-check');
    if (key === 'sel') cls.push('col-sel');
    if (!isField && c.act) { attrs.push(`data-act="${c.act}"`, 'style="cursor:pointer"', `title="${esc(c.title || '')}"`); }
    if (isField && f.sortable) {
      cls.push('sortable');
      attrs.push(`data-sort="${key}"`);
      inner += `<span class="sort-icon">${st.sortKey === key ? (st.sortDir === 1 ? '▲' : '▼') : '⇅'}</span>`;
    }
    if (cls.length) attrs.push(`class="${cls.join(' ')}"`);
    const handle = key !== lastKey ? `<div class="col-resize" data-resize="${key}"></div>` : '';
    return `<th ${attrs.join(' ')}>${inner}${handle}</th>`;
  }).join('');
}

function renderCellValue(entity, rec, f, editable) {
  const id = rec[schema(entity).pk];
  const can = editable && !f.readonly;
  const editAttr = can ? ` data-dblact="edit" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';

  switch (f.type) {
    case 'enum': {
      const o = (f.options || []).find(x => x.v === String(rec[f.key])) || {};
      const clk = can ? ` data-act="cycle" data-entity="${entity}" data-id="${esc(id)}" data-field="${f.key}"` : '';
      return `<td class="cell-center"><span class="badge ${o.cls || ''}${clk ? '' : ' ro'}"${clk}>${esc(o.label || '')}</span></td>`;
    }
    case 'date':
      return `<td class="cell-center"${editAttr}><span class="${dateClass(rec[f.key])}">${esc(fmtDate(rec[f.key]))}</span></td>`;
    case 'num': {
      if (f.key === 'progress') {
        const n = Math.max(0, Math.min(100, Number(rec[f.key]) || 0));
        return `<td${editAttr}><div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${n}%"></div></div><span class="progress-num">${n}%</span></div></td>`;
      }
      return `<td class="cell-center"${editAttr}>${esc(rec[f.key] === '' ? '' : rec[f.key])}</td>`;
    }
    case 'lines': {
      const arr = rec[f.key] || [];
      const txt = arr.map((l, i) => `${i + 1}、${l}`).join('  ');
      return `<td${editAttr} title="${esc(arr.map((l, i) => (i + 1) + '、' + l).join('\n'))}"><span class="lines-preview">${esc(txt)}</span></td>`;
    }
    case 'persons': case 'multi':
      return `<td class="cell-center"${editAttr}>${(rec[f.key] || []).map(v =>
        `<span class="tag-chip${f.type === 'persons' ? ' tag-person' : ''}">${esc(v)}</span>`).join('')}</td>`;
    case 'person':
      return `<td class="cell-center"${editAttr}>${rec[f.key] ? `<span class="tag-chip tag-person">${esc(rec[f.key])}</span>` : ''}</td>`;
    case 'ref': {
      const v = rec[f.key];
      if (!v) return `<td class="cell-center"${editAttr}></td>`;
      const r = byId(f.ref, v);
      if (!r) return `<td class="cell-center"${editAttr}><span style="color:var(--text3)">${esc(v)}?</span></td>`;
      const rs = schema(f.ref);
      const full = (r.code ? r.code + ' ' : '') + (r[rs.titleField] || '');
      if (f.ref === 'milestone') {
        const d = r.plan_date ? ` <span style="opacity:.75">${esc(fmtDate(r.plan_date))}</span>` : '';
        return `<td class="cell-center"${editAttr} title="${esc(r.name + (r.plan_date ? ' ' + r.plan_date : ''))}"><span class="ms-chip">${esc(r.name)}${d}</span></td>`;
      }
      return `<td${editAttr} title="${esc(full)}"><span class="cell-title">${r.code ? `<span class="code-chip">${esc(r.code)}</span>` : ''}${esc(r[rs.titleField] || '')}</span></td>`;
    }
    default:
      return `<td class="${f.align === 'center' ? 'cell-center' : ''}"${editAttr}><span class="cell-title">${esc(rec[f.key])}</span></td>`;
  }
}

function renderTasks() {

function renderTaskViewport() {
  const wrap = $('#tasks-scroll');
  const total = _taskRows.length;
  const colCount = UI.tasks.cols.length + 3;   // 选择列 + 完成列 + 操作列
  const theadH = ($('#page-tasks thead') || {}).offsetHeight || 0;
  const top = Math.max(0, wrap.scrollTop - theadH);
  const start = Math.max(0, Math.floor(top / ROW_H) - VS_BUFFER);
  let end = Math.min(total, Math.ceil((top + wrap.clientHeight) / ROW_H) + VS_BUFFER);
  if (end <= start) end = Math.min(total, start + 1);
  const pad = h => h > 0 ? `<tr class="vs-pad" style="height:${h}px"><td colspan="${colCount}"></td></tr>` : '';
  $('#tasks-body').innerHTML =
    pad(start * ROW_H) + _taskRows.slice(start, end).map(renderTaskRow).join('') + pad((total - end) * ROW_H);
}

function renderTaskRow(t) {
  const del = !!t.deleted_at;
  const selected = UI.tasks.sel.has(t.id);
  const cls = [t.status === 'done' ? 'done-row' : '', t.status === 'hold' ? 'hold-row' : '',
               del ? 'deleted-row' : '', selected ? 'sel-row' : ''].filter(Boolean).join(' ');
  const sel = `<td class="col-sel"><input type="checkbox" class="cb-sel" data-act="sel-row" data-id="${t.id}"${selected ? ' checked' : ''}></td>`;
  const lead = del
    ? `<td class="col-check"><button class="action-btn restore" data-act="task-restore" data-id="${t.id}" title="恢复">↩</button></td>`
    : `<td class="col-check"><input type="checkbox" class="cb" data-act="task-done" data-id="${t.id}"${t.status === 'done' ? ' checked' : ''}></td>`;
  const tail = del
    ? `<td class="cell-center"><button class="action-btn del" data-act="task-purge" data-id="${t.id}" title="彻底删除">🗑</button></td>`
    : `<td class="cell-center"><button class="action-btn ms" data-act="task-detail" data-id="${t.id}" title="详情（全部字段）">☰</button><button class="action-btn copy" data-act="task-dup" data-id="${t.id}" title="复制">⧉</button><button class="action-btn del" data-act="task-del" data-id="${t.id}" title="删除">×</button></td>`;
  const cells = UI.tasks.cols.map(k => renderCellValue('task', t, fieldDef('task', k), !del)).join('');
  return `<tr data-id="${t.id}" class="${cls}">${sel}${lead}${cells}${tail}</tr>`;
}

function refreshTaskRow(id) {
  const tr = $(`#tasks-body tr[data-id="${id}"]`);
  const t = byId('task', id);
  if (!tr || !t) { renderTasks(); return; }
  const i = _taskRows.findIndex(x => x.id === id);
  if (i >= 0) _taskRows[i] = t;
  tr.outerHTML = renderTaskRow(t);
}
