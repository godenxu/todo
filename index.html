     每个动作都单独把一次权限，理由跟报告页那段注释一样：动作是全局注册的，页面藏起来拦不住
     知道名字直接从控制台调用。 */
  'dash-config-toggle': () => { dashConfigOpen = !dashConfigOpen; renderDashboard(); },
  'dash-sec-add': () => {
    if (!requirePermission('config_dashboard')) return;
    promptModal('添加区域', '区域标题', '', name => {
      const title = (name || '').trim(); if (!title) return;
      saveDashboardConfig(cfg => dashboardPresetIn(cfg).sections.push({ id: uid('sec'), title, modules: [] }));
    });
  },
  'dash-sec-rename': d => {
    if (!requirePermission('config_dashboard')) return;
    const cur = dashboardSections().find(s => s.id === d.id); if (!cur) return;
    promptModal('修改区域标题', '区域标题', cur.title, name => {
      const title = (name || '').trim(); if (!title) return;
      saveDashboardConfig(cfg => {
        const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.id);
        if (s) s.title = title;
      });
    });
  },
  'dash-sec-move': d => {
    if (!requirePermission('config_dashboard')) return;
    const step = Number(d.step);
    saveDashboardConfig(cfg => {
      const list = dashboardPresetIn(cfg).sections;
      const i = list.findIndex(s => s.id === d.id), j = i + step;
      if (i < 0 || j < 0 || j >= list.length) return;
      list.splice(j, 0, list.splice(i, 1)[0]);
    });
  },
  'dash-sec-del': d => {
    if (!requirePermission('config_dashboard')) return;
    const cur = dashboardSections().find(s => s.id === d.id); if (!cur) return;
    confirmModal('删除区域', `删除区域「${cur.title}」？只是把它从工作台编排里去掉，任务/里程碑等实际数据一条都不动。`, '删除',
      () => saveDashboardConfig(cfg => {
        const p = dashboardPresetIn(cfg);
        p.sections = p.sections.filter(s => s.id !== d.id);
      }), true);
  },
  'dash-mod-add': d => {
    if (!requirePermission('config_dashboard')) return;
    saveDashboardConfig(cfg => {
      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!Array.isArray(s.modules)) s.modules = [];
      if (!s.modules.includes(d.mod)) s.modules.push(d.mod);
    });
  },
  'dash-mod-remove': d => {
    if (!requirePermission('config_dashboard')) return;
    saveDashboardConfig(cfg => {
      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      s.modules = (s.modules || []).filter(k => k !== d.mod);
      s.inline = (s.inline || []).filter(k => k !== d.mod);   // 顺手清掉它的同行标记
      if (s.widths) delete s.widths[d.mod];                   // 宽度倍数同理，不留孤儿设置
      if (s.personScope) delete s.personScope[d.mod];
    });
  },
  // 宽度倍数：select 是"只认 change"的老陷阱（见 CHANGE_ONLY_ACTS 那段注释），
  // 选 1 倍就是回到默认，直接删掉这条设置，不单独存一条"1"占位——写法跟 report-mod-width 一样
  'dash-mod-width': (d, el) => {
    if (!requirePermission('config_dashboard')) { renderDashboard(); return; }
    const val = Number(el && el.value);
    saveDashboardConfig(cfg => {
      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!s.widths) s.widths = {};
      if (val === 2 || val === 3) s.widths[d.mod] = val;
      else delete s.widths[d.mod];
    });
  },
  'dash-mod-move': d => {
    if (!requirePermission('config_dashboard')) return;
    const step = Number(d.step);
    saveDashboardConfig(cfg => {
      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      const list = s.modules || [];
      const i = list.indexOf(d.mod), j = i + step;
      if (i < 0 || j < 0 || j >= list.length) return;
      list.splice(j, 0, list.splice(i, 1)[0]);
      // 挪到第一个之后就不可能再"跟上一个同行"了，标记要跟着清掉
      if (j === 0) s.inline = (s.inline || []).filter(k => k !== d.mod);
    });
  },
  'dash-mod-inline': d => {
    if (!requirePermission('config_dashboard')) return;
    saveDashboardConfig(cfg => {
      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!Array.isArray(s.inline)) s.inline = [];
      if ((s.modules || []).indexOf(d.mod) <= 0) return;   // 第一个模块没有"上一个"可以跟
      s.inline = s.inline.includes(d.mod) ? s.inline.filter(k => k !== d.mod) : s.inline.concat(d.mod);
    });
  },
  'dash-mod-scope': (d, el) => {
    if (!requirePermission('config_dashboard')) { renderDashboard(); return; }
    const val = (el && el.value === 'self') ? 'self' : 'all';

      const s = dashboardPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!s.personScope) s.personScope = {};
      s.personScope[d.mod] = val;
    });
  },
  'dash-preset-switch': (d, el) => {

  'dash-preset-new': () => {

    const cur = activeDashboardPreset();
    confirmModal('删除存档', `删除编排存档「${cur.name || '未命名'}」？实际数据不受影响。`, '删除', () => saveDashboardConfig(cfg => {

  cycle: async d => {
    const f = fieldDef(d.entity, d.field), r = byId(d.entity, d.id);
    if (!f || !r) return;
    if (d.entity === 'duty' && !hasPermission('manage_duty_work')) { showSnack('为了防止误操作，编辑职责需要"新建/编辑/删除职责与工作"权限'); return; }
    if ((d.entity === 'task' || d.entity === 'work') && !canEditRecord(d.entity, r)) {
      showSnack(`为了防止误操作，只能改自己负责/参与的${d.entity === 'task' ? '任务' : '工作'}`); return;
    }
    snapshot();
    // 以前这里只在 entity==='task' 时才记快照/日志，工作和职责的改动一律不留痕迹
    const before = clone(r);
    // 任务优先级走专门的中→高→低→中映射；其余（职责分类、工作状态）仍按选项数组原有顺序循环
    if (d.entity === 'task' && d.field === 'priority') {
      r[d.field] = PRIORITY_CYCLE_NEXT[String(r[d.field])] || f.options[0].v;
    } else {
      const vals = f.options.map(o => o.v);
      r[d.field] = vals[(vals.indexOf(String(r[d.field])) + 1) % vals.length];
    }
    pushChangeLog(d.entity, d.id, diffRecord(d.entity, before, r, [d.field]));
    await Repo.upsert(d.entity, r);
    afterEdit(d.entity, d.id, d.field);
  },
  /* 这里原来有个「复制任务」的动作，已整体移除。

    // 员工删自己牵头的任务：恢复得靠有编辑他人任务权限的人，自己删了就再碰不到了，把这个说清楚
    const selfOwned = !hasPermission('edit_others_task') && t.owner === DB.settings.me;

  /* ★ 停用工作，连同它名下的任务一起删 ★ 以前这里的确认文案说"任务不会被删除，只会变成未归属"，
     但代码从来没真正清空过任务的 work 字段——软删除的工作 byId 仍查得到，界面上这些任务还在
     正常显示那个已经停用的工作名字，跟文案完全对不上，是数据体检里 taskOfDeletedWork 这一类
     脏数据的源头。用户反馈后决定改成"工作停用，任务跟着删"——任务和它名下的里程碑一起软删除
     （能在"已删除任务"里找回来，不是彻底没了），逻辑上更简单也更符合直觉：工作都不干了，
     挂在它名下的任务自然也不用再跟着走。 */
  'work-del': d => {
    if (!requirePermission('manage_duty_work')) return;
    const w = byId('work', d.id); if (!w) return;
    const taskIds = DB.tasks.filter(t => t.work === w.id && !t.deleted_at).map(t => t.id);
    const n = taskIds.length;
    confirmModal('停用工作', `停用「${w.code} ${w.name}」？${n ? `该工作下有 ${n} 条任务将连同它们的里程碑一并删除。` : ''}以后在工作页左侧切到「已停用」，点 ↩ 就能把它连同这些任务一起恢复。`, '停用', async () => {
      snapshot();
      await Repo.bulk(() => {
        softDelete('work', d.id);
        taskIds.forEach(id => cascadeSoftDeleteTask(id));
        pushChangeLog('work', d.id, `停用了工作「${w.code} ${w.name}」${n ? `（其下 ${n} 条任务连同里程碑一并删除）` : ''}`);
      });
      renderShell(); renderPage(); showSnack('已停用');
    }, true);
  },
  /* 恢复停用的工作，连同当初被连带删除的任务一起回来。
     没有这个入口的话，"停用工作"就是个不可逆动作——工作本身在工作页看不见了、
     它名下的任务也全被删了，人却没有任何地方能把这一步撤回来（除非当场 Ctrl+Z）。
     只带回"跟这次停用一起被删的"任务：判据是任务的 deleted_at 不早于工作的 deleted_at，
     这样在停用之前就已经单独删掉的那些任务，不会被这次恢复顺带捞回来。 */
  'work-restore': d => {
    if (!requirePermission('manage_duty_work')) return;
    const w = byId('work', d.id); if (!w || !w.deleted_at) return;
    const backIds = DB.tasks.filter(t => t.work === w.id && t.deleted_at && t.deleted_at >= w.deleted_at).map(t => t.id);
    const n = backIds.length;
    confirmModal('恢复工作', `恢复「${w.code} ${w.name}」？${n ? `其下 ${n} 条随它一起被删除的任务（含里程碑）也会一并恢复。` : ''}`, '恢复', async () => {
      snapshot();
      await Repo.bulk(() => {
        undelete('work', d.id);
        backIds.forEach(id => cascadeRestoreTask(id));
        pushChangeLog('work', d.id, `恢复了工作「${w.code} ${w.name}」${n ? `（连同其下 ${n} 条任务）` : ''}`);
      });
      renderShell(); renderPage(); showSnack('已恢复');
    });
  },
  'duty-new': () => { if (requirePermission('manage_duty_work')) openDutyForm(); },
  'duty-del': d => {
    if (!requirePermission('manage_duty_work')) return;
    const dt = byId('duty', d.code); if (!dt) return;
    const n = visibleWorks().filter(w => w.duty === dt.code).length;
    confirmModal('删除职责', `删除「${dt.code} ${dt.name}」？${n ? `其下有 ${n} 项工作，不会被删除，但会变为"未归属职责"。` : ''}（Ctrl+Z 可撤销）`, '删除', async () => {
      snapshot(); softDelete('duty', d.code);
      pushChangeLog('duty', d.code, `删除了职责「${dt.code} ${dt.name}」${n ? `（其下 ${n} 项工作变为未归属）` : ''}`);
      await Repo.upsert('duty', dt);
      renderPage(); showSnack('已删除');
    }, true);
  },
  // 删除职责只是软删除它自己（其下的工作变成"未归属职责"，并没有被删），所以恢复也只恢复它自己
  'duty-restore': async d => {
    if (!requirePermission('manage_duty_work')) return;
    const dt = byId('duty', d.code); if (!dt || !dt.deleted_at) return;
    snapshot(); undelete('duty', d.code);
    pushChangeLog('duty', d.code, `恢复了职责「${dt.code} ${dt.name}」`);
    await Repo.upsert('duty', dt);
    renderPage(); showSnack('已恢复');
  },
  // 里程碑现在直接在任务详情弹窗里编辑，不再有单独的里程碑管理弹窗——
  // 工作台时间线、报告页这些地方点里程碑，都改成打开任务详情（openTaskDetail 自己会处理只读/权限门禁）
  'cp-editor': d => openTaskDetail(d.id),
  'cp-insert-after': (d, el) => {
    const row = el.closest('[data-cp-row]');
    if (row) row.insertAdjacentHTML('afterend', cpRowHTML(null));
    updateCpProgressPreview();
  },
  'cp-remove-row': (d, el) => {
    const row = el.closest('[data-cp-row]');
    if (row) row.remove();
    updateCpProgressPreview();
  },
  'progress-set-done': () => { const el = $('#td-progress'); if (el) el.value = '100'; },
  'cp-mark-all-done': () => {
    $$('#cp-list [data-cp-row]').forEach(row => { const cb = row.querySelector('.cp-chk'); if (cb) cb.checked = true; });
    updateCpProgressPreview();
  },

  // 点右上角的名字：已经登录时给一张身份信息卡，需要时可以从这里切换成别的账号
  'switch-identity': () => {
    const me = myUser();
    if (!me) { $('#login-gate').classList.add('show'); renderLoginPick(); return; }
    openModal('当前身份', `
      <div class="form-row"><label>姓名</label><span>${esc(me.name)}</span></div>
      <div class="form-row"><label>角色</label><span>${esc((ROLES.find(r => r.v === me.role) || {}).label || me.role)}</span></div>
      <div class="form-row"><label>共享文件夹</label><span>${_fileHandle
        ? esc(DB.settings.sharedFolderName || '已连接')
        : (_needPermissionRestore ? '需要重新授权（点顶栏那个按钮）' : '未连接')}</span></div>
      <div class="form-row"><label>同步状态</label><span>${DB.settings.pendingSync && !_fileHandle
        ? '<b style="color:var(--overdue)">有改动还没同步给大家</b>'
        : (_fileHandle ? '已同步' : '未连接共享文件夹')}</span></div>
      <div class="form-row"><label>上次同步</label><span>${DB.settings.lastSyncAt
        ? esc(fmtLocalDateTime(DB.settings.lastSyncAt)) : '（还没同步过）'}</span></div>`,
      '切换身份', async () => {
        closeModal();
        DB.settings.me = '';
        await Repo.persist(DB);
        await ensureIdentity();
        renderShell(); renderPage();
        if (DB.settings.me) showSnack(`已切换为 ${DB.settings.me}`);
      });
  },
  'account-role-change': async (d, el) => {
    const u = DB.users.find(x => x.name === d.name);
    if (!u || !canManageAccount(u)) { showSnack('为了防止误操作，你暂时不能管理这个账号'); renderPage(); return; }
    const val = el.value;   // 直接用触发 change 事件的这个 select 本身的值，不再重新查询——避免选了却读到别的元素
    if (!assignableRoles().some(r => r.v === val)) { showSnack('不能改成这个角色'); renderPage(); return; }
    if (val === u.role) return;
    // 系统里最后一个管理员不能被降级（无论是本人还是别的管理员来改）——一旦降下去，
    // 以后就再没有人能进权限页把它改回来了，这是个不可逆的死锁，必须硬挡，不能只靠二次确认
    const isLastAdmin = u.role === 'admin' && val !== 'admin' && DB.users.filter(x => x.role === 'admin' && !x.deleted_at).length <= 1;
    if (isLastAdmin) {
      el.value = u.role;
      showSnack('系统里只剩这一个管理员账号了，不能把它改掉——不然以后没人能再管理权限。请先把别的账号设成管理员，再来改这个。');
      renderPage();
      return;
    }
    const applyChange = async () => {
      snapshot();
      const from = u.role;
      u.role = val;
      stampMeta(u);
      /* 这条记录既是给人看的审计日志，也是这次改动的"授权凭证"：
         别人的机器合并时要靠 target/roleTo 来确认这次提升有人批准过（见 roleUpgradeAuthorized）。
         必须写在 Repo.persist 之前，跟角色改动同一批推出去 */
      pushAdminLog(`把 ${d.name} 的角色从「${roleLabel(from)}」改为「${roleLabel(val)}」`,
        { target: d.name, roleFrom: from, roleTo: val });
      await Repo.persist(DB);
      renderShell(); renderPage();
      showSnack(`已把 ${d.name} 的角色改为 ${roleLabel(val)}`);
    };
    if (d.name === DB.settings.me) {
      // 改自己的角色会立即影响自己当下能看到、能操作的内容（比如可能因此看不到权限页），
      // 必须先问一句；先把下拉框视觉复位，真正确认后再由 applyChange 触发的整页重渲染改过来
      el.value = u.role;
      confirmModal('修改自己的角色',
        `把自己的角色从「${(ROLES.find(r => r.v === u.role) || {}).label}」改成「${(ROLES.find(r => r.v === val) || {}).label}」后，你自己能看到、能操作的内容会立即跟着变化（比如可能因此看不到权限页）。确定要继续吗？`,
        '确定改', applyChange, true);
      return;
    }
    await applyChange();
  },
  // 管理员只建姓名+角色，不代设 PIN——PIN 是这个人自己第一次登录时设的，管理员也看不到
  'admin-new-user': async () => {
    if (!requireRole('admin')) return;
    const name = $('#adm-new-name').value.trim();
    const role = $('#adm-new-role').value;
    if (!name) { showSnack('姓名不能为空'); return; }
    if (DB.users.some(u => u.name === name && !u.deleted_at)) { showSnack('这个名字已经有账号了'); return; }
    const user = { name, role };
    stampMeta(user);
    snapshot();
    DB.users.push(user);
    // 新建账号同样要留凭证：直接建一个管理员账号，和把已有账号提成管理员是等价的动作
    pushAdminLog(`新建账号 ${name}，角色「${roleLabel(role)}」`, { target: name, roleTo: role });
    await Repo.persist(DB);
    renderPage();
    showSnack(`已创建账号：${name}（${roleLabel(role)}），对方首次登录时自己设置 PIN`);
  },
  /* 重置 PIN：清掉 salt/hash/iterations 三个字段，让这个账号回到"待首次登录设置"状态，
     下次登录会走跟新账号一样的"自己设一个 PIN"流程（见 renderLoginPick 里 u.hash 的判断）。
     跟"改角色"共用同一套权限收口（canManageAccount），不单独开一个权限项——
     能管这个账号的角色，就该管得了它的 PIN 状态，没必要为这一件事再细分一层。
     不允许重置自己：登录框里没有"改 PIN"这条路，只有首次设置，所以自己没法自助改 PIN，
     这正是这个功能要解决的问题——只能靠别的有权限的人来重置。但如果连"重置自己"都放开，
     清完的瞬间自己也会被顶到"待设置"状态，当场把自己挤出登录态，没有意义。 */
  'admin-reset-pin': d => {
    const u = DB.users.find(x => x.name === d.name && !x.deleted_at);
    if (!u || !canManageAccount(u)) { showSnack('为了防止误操作，你暂时不能管理这个账号'); return; }
    if (!u.hash) { showSnack('这个账号还没设置过 PIN，不用重置'); return; }
    if (d.name === DB.settings.me) { showSnack('不能重置自己当前登录的这个账号的 PIN，请让别的有权限的人帮你重置'); return; }
    confirmModal('重置 PIN',
      `确定要清掉「${d.name}」的 PIN 吗？清掉之后他没法用原来的 PIN 登录了，下次登录会跟第一次用这个系统一样，
      要求他重新自己设一个新的 PIN。这个操作可以 Ctrl+Z 撤销。`,
      '确定重置', async () => {
        snapshot();
        delete u.salt; delete u.hash; delete u.iterations;
        stampMeta(u);
        pushAdminLog(`重置了 ${d.name} 的 PIN，对方下次登录需要重新设置`, { target: d.name });
        await Repo.persist(DB);
        renderPage();
        showSnack(`已重置 ${d.name} 的 PIN`);
      });
  },
  'admin-delete-user': d => {
    const u = DB.users.find(x => x.name === d.name && !x.deleted_at);
    if (!u || !canManageAccount(u)) { showSnack('为了防止误操作，你暂时不能管理这个账号'); return; }
    if (d.name === DB.settings.me) { showSnack('不能删除自己当前登录的这个账号，请先切换成别的身份，再让别人来删'); return; }
    // 系统里最后一个管理员不能被删掉——道理跟"最后一个管理员不能被降级"一样，删了就再没人能管权限了
    if (u.role === 'admin' && DB.users.filter(x => x.role === 'admin' && !x.deleted_at).length <= 1) {
      showSnack('系统里只剩这一个管理员账号了，不能删掉——不然以后没人能再管理权限。请先把别的账号设成管理员，再来删这个。');
      return;
    }
    confirmModal('删除账号',
      `确定要删除账号"${d.name}"吗？删除后这个人没法再用这个身份登录；他之前负责/参与过的任务、工作记录不会被删除，只是账号本身没了（可以 Ctrl+Z 撤销）。`,
      '确定删除', async () => {
        snapshot();
        u.deleted_at = new Date().toISOString();
        stampMeta(u);
        pushAdminLog(`删除账号 ${d.name}（原角色「${roleLabel(u.role)}」）`, { target: d.name });
        await Repo.persist(DB);
        renderPage();
        showSnack(`已删除账号：${d.name}`);
      }, true);
  },
  'perm-toggle': async (d, el) => {
    if (!roleAtLeast('admin')) { showSnack('为了防止误操作，只有管理员能调整权限矩阵'); renderPage(); return; }
    // 只存"管理员真正点过的那些键"（稀疏对象），不要把 getPermissionMatrix() 合并出来的整份矩阵存下去——
    // 那份合并结果里，凡是没手动改过的键都是当时的默认值；整份存死之后，以后哪天调整了某项权限的默认值，
    // 只要这个角色被点过任意一个别的开关，就会因为这份旧快照"顺带"存了旧默认值而被锁在旧默认值上，
    // 新默认值再也生效不了（就是 view_data 默认改成关闭后没生效的根因）
    const cur = DB.permissionMatrix || {};
    // 先展开 cur 本身，把 _viewDataMigratedV1 这类不属于四个角色、挂在矩阵对象顶层的元数据保留下来，
    // 再用新对象覆盖四个角色各自的浅拷贝——不然每点一次权限开关，上一次迁移打的标记就被这里重建的
    // next 对象悄悄丢掉，下次开机迁移会误以为"还没迁移过"，把管理员刚重新打开的权限又关回去
    const next = {
      ...cur,
      staff: { ...(cur.staff || {}) }, comanager: { ...(cur.comanager || {}) },
      director: { ...(cur.director || {}) }, gm: { ...(cur.gm || {}) },
    };
    next[d.role][d.key] = el.checked;   // 直接用触发 change 的这个 checkbox 本身的状态，不重新查询
    stampMeta(next);
    snapshot();
    DB.permissionMatrix = next;
    // 原来这里有个叫 roleLabel 的局部变量，现在全局有了同名函数（见 roleLabel 定义），改名避开遮蔽
    const rLabel = roleLabel(d.role);
    const permLabel = (PERMISSIONS.find(p => p.key === d.key) || {}).label;
    pushAdminLog(`权限矩阵：${el.checked ? '开启' : '关闭'}了「${rLabel}」的「${permLabel}」`);
    await Repo.persist(DB);
    renderShell(); renderPage();
    showSnack(`已${el.checked ? '开启' : '关闭'}「${rLabel}」的「${permLabel}」权限`);
  },
  // 身份门禁里的"连接共享文件夹"：全新设备本机一个账号都没有，顶栏那个连接入口被门禁盖住了点不到，
  // 只能在门禁里给一个。这里直接调 connectSharedFile，不走 confirmConnectWithHint 的提示弹窗——
  // 那个弹窗是普通 modal，会被门禁盖住看不见
  'login-connect-share': async () => {
    await connectSharedFile();
    if (_versionBlocked || _staleAppBlocked) return;   // 连上了但这份 html 太旧，界面已经换成升级提示，别再盖回登录框
    // 连上之后账号名单多半从空变成了一整份，门禁该停哪一屏也就跟着变了——重新走一遍路由
    if (_loginResolve) renderLoginGate();
  },
  // 从"请确认你的身份"输入姓名，进下一步：这个账号有没有设过 PIN，决定走验证还是首次设置
  'login-pick-next': () => {
    const name = ($('#login-pick').value || '').trim();
    if (!name) { renderLoginPick('请输入姓名'); return; }
    const u = DB.users.find(x => x.name === name && !x.deleted_at);
    if (!u) { renderLoginPick('查无此人，请确认姓名或联系管理员'); return; }
    if (u.hash) renderLoginVerify(name); else renderLoginSetPin(name);
  },
  'login-back': () => renderLoginGate(),
  'login-verify-pin': async d => {
    const user = DB.users.find(u => u.name === d.name && !u.deleted_at);
    const pin = $('#login-pin').value;
    if (!user || !(await verifyPin(pin, user))) { renderLoginVerify(d.name, 'PIN 不对，请重试'); return; }
    DB.settings.me = d.name;
    pushLoginLog(d.name, '输入 PIN 登录');
    await Repo.persist(DB);
    hideLoginGate();
    renderShell(); renderPage();
    showSnack(`已切换为 ${d.name}${personalReminderMsg()}`);
  },
  // 这个账号从来没设过 PIN（管理员建号时不代设）——第一次登录时自己设一个
  'login-set-pin': async d => {
    const user = DB.users.find(u => u.name === d.name && !u.deleted_at);
    if (!user) { renderLoginPick('这个账号不存在了，请重新选择'); return; }
    if (user.hash) { renderLoginVerify(d.name); return; }   // 万一别的设备已经先设过了，改成走验证，不能覆盖
    const pin = $('#login-new-pin').value;
    const pin2 = $('#login-new-pin2').value;
    if (pin.length < 4) { renderLoginSetPin(d.name, 'PIN 至少 4 位'); return; }
    if (pin !== pin2) { renderLoginSetPin(d.name, '两次 PIN 不一致'); return; }
    const { salt, hash, iterations } = await hashPin(pin);
    DB.settings.me = d.name;   // 先设好，stampMeta 记 updated_by 才准
    Object.assign(user, { salt, hash, iterations });
    stampMeta(user);
    pushLoginLog(d.name, '首次设置 PIN 并登录');
    await Repo.persist(DB);
    hideLoginGate();
    renderShell(); renderPage();
    showSnack(`PIN 设置成功，已登录为 ${d.name}${personalReminderMsg()}`);
  },
  // 只有系统里一个账号都没有时才会走到这里（引导创建第一个、自动就是管理员的账号）；
  // 之后所有账号都必须由管理员在权限页"新增账号"里建，不再允许自助注册
  'login-create': async () => {
    const name = $('#login-new-name').value.trim();
    const pin = $('#login-new-pin').value;
    const pin2 = $('#login-new-pin2').value;
    if (!name) { renderLoginCreate('姓名不能为空'); return; }
    if (DB.users.some(u => u.name === name && !u.deleted_at)) { renderLoginCreate('这个名字已经有账号了'); return; }
    // 真正的"系统里一个账号都没有"这一步，姓名必须在 BOOTSTRAP_ADMINS 名单里才允许创建，
    // 防止任何人连上一个空的共享文件夹（或纯本机场景）后随手把自己设成管理员
    const isTrueBootstrap = !DB.users.some(u => !u.deleted_at);
    if (isTrueBootstrap && !BOOTSTRAP_ADMINS.includes(name)) {
      renderLoginCreate('这个姓名不在管理员名单里，无法创建首个账号，请联系管理员');
      return;
    }
    if (pin.length < 4) { renderLoginCreate('PIN 至少 4 位'); return; }
    if (pin !== pin2) { renderLoginCreate('两次 PIN 不一致'); return; }
    // 正常情况下这个动作只有系统里一个账号都没有时才会被 UI 引导到（见 renderLoginPick），这时新建的一定是管理员；

  /* ---- 报告编排（区域 + 模块）----

  'report-config-toggle': () => { reportConfigOpen = !reportConfigOpen; renderReport(); },
  'report-sec-add': () => {

    });
  },
  'report-sec-rename': d => {
    if (!requirePermission('config_report')) return;
    const cur = reportSections().find(s => s.id === d.id); if (!cur) return;
    promptModal('修改区域标题', '区域标题', cur.title, name => {
      const title = (name || '').trim(); if (!title) return;
      saveReportConfig(cfg => {
        const s = reportPresetIn(cfg).sections.find(x => x.id === d.id);
        if (s) s.title = title;
      });
    });
  },
  'report-sec-move': d => {
    if (!requirePermission('config_report')) return;
    const step = Number(d.step);
    saveReportConfig(cfg => {
      const list = reportPresetIn(cfg).sections;
      const i = list.findIndex(s => s.id === d.id), j = i + step;
      if (i < 0 || j < 0 || j >= list.length) return;
      list.splice(j, 0, list.splice(i, 1)[0]);
    });
  },
  'report-sec-del': d => {
    if (!requirePermission('config_report')) return;
    const cur = reportSections().find(s => s.id === d.id); if (!cur) return;
    confirmModal('删除区域', `删除区域「${cur.title}」？只是把它从报告编排里去掉，任务/里程碑等实际数据一条都不动。`, '删除',
      () => saveReportConfig(cfg => {
        const p = reportPresetIn(cfg);
        p.sections = p.sections.filter(s => s.id !== d.id);
      }), true);
  },
  /* 模块的增 / 删 / 排序 / 设同行。都走同一个小工具：拿到那个 section，把 modules 和 inline
     两个数组一起维护好——inline 里留着一个已经不在 modules 里的 key 不会导致渲染出错
     （reportSections 会过滤），但留着就是脏数据，下次这个模块被重新加回来会莫名其妙地贴到上一行去。 */
  'report-mod-add': d => {
    if (!requirePermission('config_report')) return;
    saveReportConfig(cfg => {
      const s = reportPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!Array.isArray(s.modules)) s.modules = [];
      if (!s.modules.includes(d.mod)) s.modules.push(d.mod);
    });
  },
  'report-mod-remove': d => {
    if (!requirePermission('config_report')) return;
    saveReportConfig(cfg => {
      const s = reportPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      s.modules = (s.modules || []).filter(k => k !== d.mod);
      s.inline = (s.inline || []).filter(k => k !== d.mod);   // 顺手清掉它的同行标记
      if (s.widths) delete s.widths[d.mod];                   // 宽度倍数同理，不留孤儿设置
    });
  },
  // 宽度倍数：select 是"只认 change"的老陷阱（见 CHANGE_ONLY_ACTS 那段注释），
  // 选 1 倍就是回到默认，直接删掉这条设置，不单独存一条"1"占位
  'report-mod-width': (d, el) => {
    if (!requirePermission('config_report')) { renderReport(); return; }
    const val = Number(el && el.value);
    saveReportConfig(cfg => {
      const s = reportPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!s.widths) s.widths = {};
      if (val === 2 || val === 3) s.widths[d.mod] = val;
      else delete s.widths[d.mod];
    });
  },
  'report-mod-move': d => {
    if (!requirePermission('config_report')) return;
    const step = Number(d.step);
    saveReportConfig(cfg => {
      const s = reportPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      const list = s.modules || [];
      const i = list.indexOf(d.mod), j = i + step;
      if (i < 0 || j < 0 || j >= list.length) return;
      list.splice(j, 0, list.splice(i, 1)[0]);
      // 挪到第一个之后就不可能再"跟上一个同行"了，标记要跟着清掉，否则界面上那个按钮
      // 显示成禁用（第一个不许设同行），底下却还留着一个永远生效不了的标记
      if (j === 0) s.inline = (s.inline || []).filter(k => k !== d.mod);
    });
  },
  'report-mod-inline': d => {
    if (!requirePermission('config_report')) return;
    saveReportConfig(cfg => {
      const s = reportPresetIn(cfg).sections.find(x => x.id === d.sec); if (!s) return;
      if (!Array.isArray(s.inline)) s.inline = [];
      if ((s.modules || []).indexOf(d.mod) <= 0) return;   // 第一个模块没有"上一个"可以跟
      s.inline = s.inline.includes(d.mod) ? s.inline.filter(k => k !== d.mod) : s.inline.concat(d.mod);
    });
  },

// 这些 data-act 只认 change 事件、不认 click：
// - perm-toggle 是 checkbox——click 时 el.checked 虽已是新值，但会跟 change 重复触发一次
// - account-role-change 是 select——点开下拉框本身就会先发一个 click（这时用户还没选完！），
//   之前就是因为点击分发器把这次"打开下拉框"的 click 也当成了"确认选择"，选都没选就提交了
// - logs-who 同理是个 select，点开下拉那一下的 click 不该被当成"选好了"
// - report-preset-switch 是 select，理由跟上面两条完全一样
//   （报告模块的增删改现在是一排可点的文字按钮，走普通 click 分发，不在这张名单里）
const CHANGE_ONLY_ACTS = ['account-role-change', 'perm-toggle', 'backup-toggle', 'backup-interval-change', 'logs-who',
  'report-preset-switch', 'recycle-keep-change', 'report-mod-width', 'dash-view-as',
  'dash-preset-switch', 'dash-mod-width', 'dash-mod-scope'];
document.addEventListener('click', e => {
  if (e.target.closest('.col-resize')) return;
  const el = e.target.closest('[data-act]');
  if (el) {
    if (!CHANGE_ONLY_ACTS.includes(el.dataset.act)) {
      const fn = ACTIONS[el.dataset.act];
      if (fn) { fn(el.dataset, el, e); return; }
    } else return;
  }
  const th = e.target.closest('th[data-sort]');
  if (th && UI[currentPage]) {
    const st = UI[currentPage], key = th.dataset.sort;
    if (st.sortKey === key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
    renderPage();
  }
});
document.addEventListener('change', e => {
  const rc = e.target.closest('[data-act="account-role-change"]');
  if (rc) ACTIONS['account-role-change'](rc.dataset, rc, e);
  const pt = e.target.closest('[data-act="perm-toggle"]');
  if (pt) ACTIONS['perm-toggle'](pt.dataset, pt, e);
  // ★ 曾经的真实 bug ★ 'backup-toggle'/'backup-interval-change' 被放进了 CHANGE_ONLY_ACTS，
  // 点击分发器因此故意不理它们，但这里一直没有补上对应的 change 分支——两个动作实际上从来没被调用过。
  // 表现出来就是：勾选框/数字框自己的原生状态看着改了，但 DB.settings 里的值纹丝不动，
  // 下次随便一次重渲染（比如 5 分钟一轮的软同步）它们就会被打回原来的样子，像是"自己变回去了"
  const bt = e.target.closest('[data-act="backup-toggle"]');
  if (bt) ACTIONS['backup-toggle'](bt.dataset, bt, e);
  const bi = e.target.closest('[data-act="backup-interval-change"]');
  if (bi) ACTIONS['backup-interval-change'](bi.dataset, bi, e);
  // 回收站保留期同理：进了 CHANGE_ONLY_ACTS 就必须在这里补上 change 分支，否则又是"改了跟没改一样"
  const rk = e.target.closest('[data-act="recycle-keep-change"]');
  if (rk) ACTIONS['recycle-keep-change'](rk.dataset, rk, e);
  const lw = e.target.closest('[data-act="logs-who"]');
  if (lw) ACTIONS['logs-who'](lw.dataset, lw, e);
  const rp = e.target.closest('[data-act="report-preset-switch"]');
  if (rp) ACTIONS['report-preset-switch'](rp.dataset, rp, e);
  const rw = e.target.closest('[data-act="report-mod-width"]');
  if (rw) ACTIONS['report-mod-width'](rw.dataset, rw, e);
  const dv = e.target.closest('[data-act="dash-view-as"]');
  if (dv) ACTIONS['dash-view-as'](dv.dataset, dv, e);
  const dp = e.target.closest('[data-act="dash-preset-switch"]');
  if (dp) ACTIONS['dash-preset-switch'](dp.dataset, dp, e);
  const dc = e.target.closest('[data-act="dash-mod-width"]');
  if (dc) ACTIONS['dash-mod-width'](dc.dataset, dc, e);
  const ds = e.target.closest('[data-act="dash-mod-scope"]');
  if (ds) ACTIONS['dash-mod-scope'](ds.dataset, ds, e);
  if (e.target.classList.contains('cp-chk')) updateCpProgressPreview();   // 勾选/取消里程碑完成状态，实时刷新进度预览
});

// 里程碑行拖动排序：按住行首的 ⠿ 才能拖，拖到别的行上方/下方就把这一行搬过去，标准的可排序列表写法
let _cpDragRow = null;
document.addEventListener('dragstart', e => {
  const handle = e.target.closest('.cp-drag-handle');
  if (!handle) return;
  _cpDragRow = handle.closest('[data-cp-row]');
  if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', e => {
  if (!_cpDragRow) return;
  const overRow = e.target.closest('[data-cp-row]');
  if (!overRow || overRow === _cpDragRow || !overRow.closest('#cp-list')) return;
  e.preventDefault();
  const rect = overRow.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  overRow.parentNode.insertBefore(_cpDragRow, before ? overRow : overRow.nextSibling);
});

/* ---- 长按表头拖动，调整字段显示顺序（任务/工作/职责三张表通用） ---- */
function reorderCols(cols, key, targetKey, before) {
  const arr = [...cols];
  const from = arr.indexOf(key);
  if (from === -1) return cols;
  arr.splice(from, 1);
  let to = arr.indexOf(targetKey);
  if (to === -1) return cols;
  if (!before) to += 1;
  arr.splice(to, 0, key);
  return arr;
}
function armColDrag(e, th) {
  if (e.button !== 0) return;
  const startX = e.clientX, startY = e.clientY;
  const timer = setTimeout(() => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    beginColDrag(th);
  }, 350);
  const onMove = ev => {
    // 计时未到就移动太多：不算长按，交还给普通点击（比如排序）
    if (Math.abs(ev.clientX - startX) > 6 || Math.abs(ev.clientY - startY) > 6) {
      clearTimeout(timer);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
  };
  const onUp = () => {
    clearTimeout(timer);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}
function beginColDrag(th) {
  th.classList.add('col-dragging');
  const st = UI[currentPage];
  const key = th.dataset.key;
  const row = th.parentElement;
  let drop = null;
  // 长按拖动结束后紧跟的那次 click 要吞掉，否则会被当成表头排序点击
  const swallowClick = ev => { ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click', swallowClick, true); };
  document.addEventListener('click', swallowClick, true);

  const onMove = ev => {
    const el = document.elementFromPoint(ev.clientX, ev.clientY);
    const overTh = el && el.closest && el.closest('th[data-draggable]');
    row.querySelectorAll('th').forEach(t => t.classList.remove('col-drop-before', 'col-drop-after'));
    if (overTh && overTh !== th) {
      const r = overTh.getBoundingClientRect();
      const before = ev.clientX < r.left + r.width / 2;
      overTh.classList.add(before ? 'col-drop-before' : 'col-drop-after');
      drop = { key: overTh.dataset.key, before };
    } else drop = null;
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    th.classList.remove('col-dragging');
    row.querySelectorAll('th').forEach(t => t.classList.remove('col-drop-before', 'col-drop-after'));
    if (drop && drop.key !== key && st) {
      st.cols = reorderCols(st.cols, key, drop.key, drop.before);
      persistUI();
      renderPage();
    }
    setTimeout(() => document.removeEventListener('click', swallowClick, true), 0);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function startResize(e, key, handle) {
  e.preventDefault(); e.stopPropagation();
  const st = UI[currentPage]; if (!st) return;
  const startX = e.clientX, startW = st.widths[key] || 90;
  handle.classList.add('resizing');
  const th = handle.closest('th');
  const onMove = ev => {
    const w = Math.max(40, startW + (ev.clientX - startX));
    st.widths[key] = w;
    if (th) th.style.width = w + 'px';
  };
  const onUp = () => {
    handle.classList.remove('resizing');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    persistUI();
    renderPage();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

/* =============================================================
   21. 编辑器
   ============================================================= */
let _activeEdit = null;

function openEditor(entity, id, fieldKey, td) {
  const f = fieldDef(entity, fieldKey);
  if (!f || f.readonly) return;
  const rec = byId(entity, id);
  if (entity === 'duty' && !hasPermission('manage_duty_work')) { showSnack('为了防止误操作，编辑职责需要"新建/编辑/删除职责与工作"权限'); return; }
  if ((entity === 'task' || entity === 'work') && !canEditRecord(entity, rec)) {
    showSnack(`为了防止误操作，只能编辑自己负责或参与的${entity === 'task' ? '任务' : '工作'}`);
    return;
  }
  if (entity === 'task' && fieldKey === 'work') return openWorkPicker(entity, id, f, td);
  if (f.type === 'checkpoints') return openTaskDetail(id);
  // 有里程碑的任务，进度是算出来的，直接改数字没意义——转到任务详情让用户勾里程碑
  if (entity === 'task' && fieldKey === 'progress' && hasCheckpoints(rec)) return openTaskDetail(id);
  if (['single', 'multi', 'person', 'persons', 'enum', 'ref'].includes(f.type)) return openSelectPopup(entity, id, f, td);
  if (f.type === 'lines') return openLinesEditor(entity, id, fieldKey);
  if (f.type === 'date') return openDatePicker(entity, id, fieldKey, td);
  openInlineEdit(entity, id, f, td);
}

function openInlineEdit(entity, id, f, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const original = (r[f.key] === '' || r[f.key] == null) ? '' : String(r[f.key]);
  const input = document.createElement('input');
  input.className = 'inline-input';
  input.value = original;
  td.innerHTML = ''; td.appendChild(input);
  input.focus(); input.select();

  let done = false;
  const finish = async cancel => {
    if (done) return; done = true; _activeEdit = null;
    let val = input.value.trim();
    if (cancel || val === original) { rerenderRow(entity, id); return; }
    if (f.type === 'num') {
      val = val === '' ? '' : Math.max(0, Number(val) || 0);
      if (f.key === 'progress') val = Math.min(100, val);
    }
    snapshot();
    const before = clone(r);   // 工作/职责的编辑同样要留痕，不再只记任务
    r[f.key] = val;
    // 单独编辑进度这一格时，状态并没有被同时改动，属于"只碰了进度"的那条分支——
    // 该不该顺带跳出"未开始"/退出"已完成"，交给 reconcileStatusAndProgress 统一判断
    if (entity === 'task' && f.key === 'progress') reconcileStatusAndProgress(r, before);
    pushChangeLog(entity, id, diffRecord(entity, before, r, [f.key, 'status', 'actual_date']));
    await Repo.upsert(entity, r);
    afterEdit(entity, id, f.key);
  };
  _activeEdit = { commit: () => finish(false) };
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') { ev.preventDefault(); finish(false); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(true); }
  });
  input.addEventListener('blur', () => setTimeout(() => finish(false), 80));
}
function commitActiveEdit() { if (_activeEdit) { const c = _activeEdit; _activeEdit = null; c.commit(); } }
function rerenderRow(entity, id) {
  if (entity === 'task' && currentPage === 'tasks') refreshTaskRow(id); else renderPage();
}

/* ---- 选择弹层（single/multi/person/persons/enum/ref 通用） ---- */
let _sp = null, spCloseListener = null;

function openSelectPopup(entity, id, f, td) {
  commitActiveEdit();
  closeWorkSub();
  const r = byId(entity, id); if (!r) return;
  const multi = f.type === 'multi' || f.type === 'persons';
  const allowNew = !['enum', 'ref'].includes(f.type);

  if ((allowNew || opts.length > 8) && !f.noFilter) {

  }
  html += `<div id="sp-list">`;
  if (!multi) {
    if (allowNew) html += `<div class="sp-item sp-addnew" id="sp-addnew" data-act="sp-add" style="display:none"></div>`;
    if (!f.options && !f.required) html += `<div class="sp-item${!cur.length ? ' selected' : ''}" data-act="sp-pick" data-val="">（无）</div>`;
    opts.forEach(o => {
      html += `<div class="sp-item${cur[0] === o.v ? ' selected' : ''}" data-act="sp-pick" data-val="${esc(o.v)}" data-opt="${esc(o.label)}" title="${esc(o.label)}">${esc(o.label)}</div>`;
    });
    if (f.type === 'ref' && !opts.length) html += `<div class="sp-item" style="color:var(--text3);cursor:default">（无可选项）</div>`;
  } else {
    html += `<div class="sp-item"><input type="checkbox" id="sp-none"${!cur.length ? ' checked' : ''}><label for="sp-none">（无）</label></div>`;
    opts.forEach((o, i) => {
      html += `<div class="sp-item" data-opt="${esc(o.label)}"><input type="checkbox" class="sp-cb" id="sp-o${i}" value="${esc(o.v)}"${cur.includes(o.v) ? ' checked' : ''}><label for="sp-o${i}">${esc(o.label)}</label></div>`;
    });
  }
  html += `</div>`;
  if (multi) html += `<button class="sp-confirm" data-act="sp-commit">确定</button>`;
  popup.innerHTML = html;

  const rect = td.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.classList.add('show');
  requestAnimationFrame(() => {
    const h = popup.offsetHeight;
    if (rect.bottom + 2 + h > window.innerHeight - 8) popup.style.top = Math.max(8, rect.top - h - 2) + 'px';
  });

  const inp = $('#sp-manual-input');
  if (inp) {
    inp.addEventListener('input', () => spFilterList());
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); spAddFromInput(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeSelectPopup(); }
    });
    setTimeout(() => inp.focus(), 50);
  }
  popup.addEventListener('change', ev => {
    if (ev.target.classList.contains('sp-cb')) {
      if (ev.target.checked) {
        const n = $('#sp-none'); if (n) n.checked = false;
        if (!_sp.order.includes(ev.target.value)) _sp.order.push(ev.target.value);
      } else _sp.order = _sp.order.filter(v => v !== ev.target.value);
    } else if (ev.target.id === 'sp-none' && ev.target.checked) {
      popup.querySelectorAll('.sp-cb').forEach(cb => { cb.checked = false; });
      _sp.order = [];
    }
  });

  if (spCloseListener) document.removeEventListener('mousedown', spCloseListener);
  spCloseListener = ev => { if (!popup.contains(ev.target) && !td.contains(ev.target)) closeSelectPopup(); };
  setTimeout(() => document.addEventListener('mousedown', spCloseListener), 0);
}

function spFilterList() {
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(), q = raw.toLowerCase();
  $$('#sp-list [data-opt]').forEach(el => {
    el.style.display = (!q || (el.dataset.opt || '').toLowerCase().includes(q)) ? '' : 'none';
  });
  const add = $('#sp-addnew');
  if (add && _sp && _sp.allowNew) {
    const exists = $$('#sp-list [data-opt]').some(el => el.dataset.opt === raw);
    if (raw && !exists) { add.textContent = `+ 新增「${raw}」`; add.style.display = ''; }
    else add.style.display = 'none';
  }
}
function splitNames(raw) { return raw.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean); }

function spAddFromInput() {
  if (!_sp) return;
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(); if (!raw) return;
  if (!_sp.allowNew) {                       // enum / ref 不允许新增：回车选中首个可见项
    const first = $$('#sp-list [data-act="sp-pick"]').find(el => el.style.display !== 'none' && el.dataset.opt);
    if (first) spCommitSingle(first.dataset.val);
    return;
  }
  if (_sp.multi) {
    splitNames(raw).forEach(n => { if (!_sp.order.includes(n)) _sp.order.push(n); });
    inp.value = '';
    spCommitMulti();
  } else spCommitSingle(raw);
}

// 员工把自己牵头的任务转给别人（或删掉自己牵头的任务）之后就没法再编辑了（除非同时是参与人）——
// 这两种情况都提前问一句，别让人手滑之后才发现自己看不了、改不了了
function ownerChangeNeedsWarning(t, newOwner) {
  return !!t && !hasPermission('edit_others_task') && t.owner && t.owner === DB.settings.me && newOwner !== DB.settings.me;
}
function confirmOwnerChange(onConfirm) {
  confirmModal('转移牵头人', '把牵头人改成别人后，你将不再能编辑这个任务（除非你同时是参与人）。确定要继续吗？', '确定改', onConfirm, true);
}
async function spCommitSingle(val) {
  if (!_sp) return;
  const { entity, id, field } = _sp;
  const r = byId(entity, id);
  if (entity === 'task' && field === 'owner' && ownerChangeNeedsWarning(r, val)) {
    closeSelectPopup();
    confirmOwnerChange(() => finishSpCommitSingle(entity, id, field, val));
    return;
  }
  if (entity === 'task' && field === 'status') {
    closeSelectPopup();
    if (val === 'done') {
      const cpIncompleteN = DB.milestones.filter(m => m.task === r.id && !m.deleted_at && m.done !== '1').length;
      if (doneAutoFillNeeded(r.plan_date, r.actual_date, cpIncompleteN)) {
        openDoneAutoFillModal(!r.plan_date, !r.actual_date, cpIncompleteN,
          () => commitTaskStatus(r, 'done', true));
        return;
      }
    }
    await commitTaskStatus(r, val, false);
    return;
  }
  closeSelectPopup();
  await finishSpCommitSingle(entity, id, field, val);
}
async function finishSpCommitSingle(entity, id, field, val) {
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = clone(r);   // 工作/职责的下拉选择同样要留痕
  r[field] = val;
  pushChangeLog(entity, id, diffRecord(entity, before, r, [field]));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}
// 任务下是否还有没标完成的里程碑
function hasIncompleteCheckpoints(t) { return DB.milestones.some(m => m.task === t.id && !m.deleted_at && m.done !== '1'); }
// 真正落地"改状态"这个动作：跟原来单击循环切换时的副作用保持一致——变成已完成要顺带填计划/实际完成时间、
// 没有里程碑时进度直接设 100，有里程碑时按里程碑完成比例重算；alsoCompleteCheckpoints 为真时连里程碑一起标完成
async function commitTaskStatus(t, newStatus, alsoCompleteCheckpoints) {
  snapshot();
  const before = clone(t);
  if (alsoCompleteCheckpoints) {
    DB.milestones.filter(m => m.task === t.id && !m.deleted_at && m.done !== '1').forEach(m => {
      m.done = '1'; m.actual_date = m.actual_date || todayStr(); stampMeta(m);
    });
  }
  t.status = newStatus;
  if (newStatus === 'done') {
    // 计划完成时间、实际完成时间都补成今天——标"已完成"却缺日期，会让"本期涉及范围"
    // "本期完成进度"这类按日期归期的统计把这条任务漏掉，见 buildReportData 里的口径说明
    t.plan_date = t.plan_date || todayStr();
    t.actual_date = t.actual_date || todayStr();
    if (hasCheckpoints(t)) recalcProgress(t); else t.progress = 100;
  } else {
    t.actual_date = '';
  }
  pushLog(t.id, diffTask(before, t, ['status', 'plan_date', 'actual_date', 'progress']));
  await Repo.upsert('task', t);
  afterEdit('task', t.id, 'status');
}
/* 标记任务为"已完成"时的自动补全确认：计划完成时间、实际完成时间没填就自动填今天；
   里程碑没勾完就一并勾完——不提供"只补日期、不动里程碑"的选项，否则确认完还是会
   出现"任务已完成、里程碑却没完成"这种矛盾状态。任务页列表直接改状态、任务详情弹窗
   保存，两条路径共用这一套判断和这个弹窗，行为保持一致（以前列表那条路径只在里程碑
   没完成时才问一句，详情弹窗那条路径压根不问，日期也是悄悄自动补的——两条路径不一致，
   且都没管过计划完成时间）。onConfirm() 不带参数，调用方拿到确认后统一按"日期+里程碑
   都补齐"来处理。 */
function doneAutoFillNeeded(planDate, actualDate, cpIncompleteN) {
  return !planDate || !actualDate || cpIncompleteN > 0;
}
function openDoneAutoFillModal(planMissing, actualMissing, cpIncompleteN, onConfirm) {
  const fillParts = [];
  if (planMissing) fillParts.push('计划完成时间');
  if (actualMissing) fillParts.push('实际完成时间');
  const dateMsg = fillParts.length
    ? `<p>${fillParts.join('、')}还没填，确定后会自动填成今天（${esc(todayStr())}）。</p>` : '';
  const cpMsg = cpIncompleteN
    ? `<p>这个任务下还有 <b>${cpIncompleteN}</b> 个里程碑没有标记为完成，确定后会一并标记为已完成。</p>` : '';
  openModal('标记任务为已完成', `${dateMsg}${cpMsg}`, '确定', async () => {
    closeModal();
    await onConfirm();
  });
}

// 多选弹层里手打了姓名但没按回车就直接点"确定"：先把输入框里还没提交的内容并进选中项，
// 否则这段文字会被直接丢弃——之前正是"参与人/协同人员打了多个姓名却录不进去"的原因
function spFlushManualInput() {
  if (!_sp || !_sp.multi) return;
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(); if (!raw) return;
  splitNames(raw).forEach(n => { if (!_sp.order.includes(n)) _sp.order.push(n); });
  inp.value = '';
}
async function spCommitMulti() {
  if (!_sp) return;
  spFlushManualInput();
  const { entity, id, field, order } = _sp;
  const popup = $('#select-popup');
  const checked = new Set([...popup.querySelectorAll('.sp-cb:checked')].map(cb => cb.value));
  const inDom = new Set([...popup.querySelectorAll('.sp-cb')].map(cb => cb.value));
  // order 里既有勾选框中的项，也有刚输入新增、尚未在列表中的项，后者一律保留
  const vals = order.filter(v => checked.has(v) || !inDom.has(v));
  closeSelectPopup();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = clone(r);   // 工作的参与人、职责的多选字段同样要留痕
  r[field] = vals;
  pushChangeLog(entity, id, diffRecord(entity, before, r, [field]));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}

function closeSelectPopup() {
  const p = $('#select-popup');
  p.classList.remove('show'); p.innerHTML = ''; _sp = null;
  closeWorkSub();
  if (spCloseListener) { document.removeEventListener('mousedown', spCloseListener); spCloseListener = null; }
}

/* ---- 所属工作二级级联选择：先选职责，鼠标划过展开该职责下的工作，再点选 ---- */
let _wpHideTimer = null;
function closeWorkSub() {
  if (_wpHideTimer) { clearTimeout(_wpHideTimer); _wpHideTimer = null; }
  document.querySelectorAll('.sp-sub').forEach(el => el.remove());
}
function openWorkPicker(entity, id, f, td) {
  commitActiveEdit();
  closeWorkSub();
  const r = byId(entity, id); if (!r) return;
  const cur = r[f.key] || '';
  const opts = optionsOf(entity, f, r);
  const groups = new Map();      // 职责编号 -> 该职责下的工作选项
  opts.forEach(o => {
    const w = byId('work', o.v);
    const dc = w ? w.duty : '';
    if (!groups.has(dc)) groups.set(dc, []);
    groups.get(dc).push(o);
  });
  const duties = [...groups.keys()].map(dc => byId('duty', dc)).filter(Boolean)
    .sort((a, b) => a.code.localeCompare(b.code));

  _sp = { entity, id, field: f.key };   // 复用通用的关闭 / 清理逻辑
  const popup = $('#select-popup');
  let html = `<div class="sp-header">${esc(f.label)}</div><div id="sp-list">`;
  html += `<div class="sp-item${!cur ? ' selected' : ''}" data-act="wp-pick" data-val="">（无）</div>`;
  if (!duties.length) html += `<div class="sp-item" style="color:var(--text3);cursor:default">（无可选项，请先在工作页添加工作）</div>`;
  duties.forEach(d => {
    const active = groups.get(d.code).some(o => o.v === cur);
    html += `<div class="sp-item sp-duty${active ? ' selected' : ''}" data-duty="${esc(d.code)}">` +
            `<span>${esc(d.code + ' ' + d.name)}</span><span class="sp-arrow">▸</span></div>`;
  });
  html += `</div>`;
  popup.innerHTML = html;

  const rect = td.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.classList.add('show');
  requestAnimationFrame(() => {
    const h = popup.offsetHeight;
    if (rect.bottom + 2 + h > window.innerHeight - 8) popup.style.top = Math.max(8, rect.top - h - 2) + 'px';
  });

  const sub = document.createElement('div');
  sub.className = 'sp-sub';
  document.body.appendChild(sub);
  const cancelHide = () => { if (_wpHideTimer) { clearTimeout(_wpHideTimer); _wpHideTimer = null; } };
  const scheduleHide = () => { cancelHide(); _wpHideTimer = setTimeout(() => { sub.classList.remove('show'); sub.innerHTML = ''; }, 250); };

  popup.querySelectorAll('.sp-duty').forEach(el => {
    el.addEventListener('mouseenter', () => {
      cancelHide();
      const works = groups.get(el.dataset.duty) || [];
      sub.innerHTML = works.map(o =>
        `<div class="sp-item${o.v === cur ? ' selected' : ''}" data-act="wp-pick" data-val="${esc(o.v)}" title="${esc(o.label)}">${esc(o.label)}</div>`).join('');
      const r2 = el.getBoundingClientRect();
      sub.style.left = Math.min(r2.right + 2, window.innerWidth - 270) + 'px';
      sub.style.top = Math.max(8, r2.top) + 'px';
      sub.classList.add('show');
      requestAnimationFrame(() => {
        const h = sub.offsetHeight;
        if (r2.top + h > window.innerHeight - 8) sub.style.top = Math.max(8, window.innerHeight - 8 - h) + 'px';
      });
    });
    el.addEventListener('mouseleave', scheduleHide);
  });
  sub.addEventListener('mouseenter', cancelHide);
  sub.addEventListener('mouseleave', scheduleHide);
  sub.addEventListener('click', ev => {
    const it = ev.target.closest('[data-act="wp-pick"]');
    if (it) wpCommit(it.dataset.val);
  });
  popup.addEventListener('click', ev => {
    const it = ev.target.closest('[data-act="wp-pick"]');
    if (it) wpCommit(it.dataset.val);
  });

  if (spCloseListener) document.removeEventListener('mousedown', spCloseListener);
  spCloseListener = ev => { if (!popup.contains(ev.target) && !sub.contains(ev.target) && !td.contains(ev.target)) closeSelectPopup(); };
  setTimeout(() => document.addEventListener('mousedown', spCloseListener), 0);
}
async function wpCommit(val) {
  if (!_sp) return;
  const { entity, id, field } = _sp;
  closeSelectPopup();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = clone(r);
  r[field] = val;
  r.code = val ? nextTaskCode(val) : '';
  // 里程碑挂在任务下，不挂在工作下，换工作不会波及已有的里程碑，不用清理
  if (val && !r.owner) { const w = byId('work', val); if (w) r.owner = w.owner; }
  pushLog(id, diffTask(before, r, ['work', 'owner']));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}

/* ---- 日期选择器 ---- */
let _dp = null, dpCloseListener = null;

/* 浮层日历的定位 + "点击外面收起"，网格内联编辑和表单里嵌入的日期框共用这一份：
   前者的锚点是那个 <td>，后者的锚点是日期框自己（或者边上那个📅按钮），逻辑完全一样，
   区别只在锚点是谁，抽出来避免两处各写一遍容易走样的定位代码。 */
function openDpPopup(anchorEl) {
  const wrap = $('#date-picker-wrap');
  const rect = anchorEl.getBoundingClientRect();
  wrap.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
  wrap.style.top = (rect.bottom + 4) + 'px';
  wrap.classList.add('show');
  requestAnimationFrame(() => {
    const h = wrap.offsetHeight;
    if (rect.bottom + 4 + h > window.innerHeight - 8) wrap.style.top = Math.max(8, rect.top - h - 4) + 'px';
  });
  if (dpCloseListener) document.removeEventListener('mousedown', dpCloseListener);
  dpCloseListener = ev => { if (!wrap.contains(ev.target) && !anchorEl.contains(ev.target)) dpClose(); };
  setTimeout(() => document.addEventListener('mousedown', dpCloseListener), 0);
}
function openDatePicker(entity, id, fieldKey, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const ref = r[fieldKey] ? new Date(r[fieldKey] + 'T00:00:00') : new Date();
  _dp = { mode: 'grid', entity, id, field: fieldKey, year: ref.getFullYear(), month: ref.getMonth() };
  renderDpCalendar();
  openDpPopup(td);
}
/* ★ 日期数字文本框旁边那个📅按钮点开的就是这个 ★
   跟网格内联编辑共用同一套日历 UI，选中一天之后的"落地"方式不一样：网格那边是直接改这条记录
   并同步（见 dpCommit 里 mode==='grid' 那一支），这里只是把选中的日期写回这个输入框自己的 value，
   跟手动敲数字效果完全一致——真正的保存仍然走这个输入框所在表单本来的保存流程
   （点"保存"/"确定"按钮时统一读取），不会因为点了日历就绕开表单直接改数据库。
   这样"点选日历"和"手动敲数字"两种输入方式在同一个框里并存，互不冲突。 */
function openDatePickerForInput(inputEl) {
  if (!inputEl) return;
  commitActiveEdit();
  const cur = normalizeMaskedDateValue(inputEl.value);
  const ref = cur ? new Date(cur + 'T00:00:00') : new Date();
  _dp = { mode: 'input', target: inputEl, year: ref.getFullYear(), month: ref.getMonth() };
  renderDpCalendar();
  openDpPopup(inputEl);
}
// 日历当前应该高亮哪一天：网格模式去查对应记录的字段，表单模式直接读目标输入框自己的 value
function dpCurrentValue() {
  if (!_dp) return '';
  if (_dp.mode === 'input') return _dp.target ? normalizeMaskedDateValue(_dp.target.value) : '';
  const r = byId(_dp.entity, _dp.id);
  return r ? (r[_dp.field] || '') : '';
}
function renderDpCalendar() {
  if (!_dp) return;
  const sel = dpCurrentValue();
  const today = todayStr();
  const firstDow = new Date(_dp.year, _dp.month, 1).getDay();
  const days = new Date(_dp.year, _dp.month + 1, 0).getDate();
  let html = `<div class="dp-cal-nav">
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="-1">&#8249;</button>
      <span class="dp-cal-title">${_dp.year}年${_dp.month + 1}月</span>
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="1">&#8250;</button>
    </div><div class="dp-cal-grid">
    ${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="dp-cal-dow">${d}</div>`).join('')}`;
  for (let i = 0; i < firstDow; i++) html += '<div class="dp-cal-day is-empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${_dp.year}-${String(_dp.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    let cls = 'dp-cal-day';
    if (ds === today) cls += ' is-today';
    if (ds === sel) cls += ' is-selected';
    html += `<div class="${cls}" data-act="dp-pick" data-date="${ds}">${d}</div>`;
  }
  $('#dp-calendar').innerHTML = html + '</div>';
}
function dpNav(dir) {
  if (!_dp) return;
  _dp.month += dir;
  if (_dp.month > 11) { _dp.month = 0; _dp.year++; }
  if (_dp.month < 0) { _dp.month = 11; _dp.year--; }
  renderDpCalendar();
}
async function dpCommit(date) {
  if (!_dp) return;
  if (_dp.mode === 'input') {
    // 表单模式：只管把选中的日期写回这个输入框，不直接碰数据库——date 来自日历点选/快捷方式，
    // 已经是规整好的 YYYY-MM-DD 或空串，不需要再跑一遍敲数字那套格式化
    const target = _dp.target;
    dpClose();
    if (target) {
      target.value = date;
      if (typeof target.focus === 'function') target.focus();
    }
    return;
  }
  const { entity, id, field } = _dp;
  dpClose();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = clone(r);   // 工作/职责上的日期字段同样要留痕
  r[field] = date;
  if (entity === 'task' && field === 'actual_date' && date && r.status !== 'done') {
    r.status = 'done';
    if (!hasCheckpoints(r)) r.progress = 100;
  }
  pushChangeLog(entity, id, diffRecord(entity, before, r, [field, 'status', 'progress']));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}
function dpClose() {
  $('#date-picker-wrap').classList.remove('show'); _dp = null;
  if (dpCloseListener) { document.removeEventListener('mousedown', dpCloseListener); dpCloseListener = null; }
}
function closeFloating() { dpClose(); if ($('#select-popup').classList.contains('show')) closeSelectPopup(); }

/* ---- 多行文本编辑器 ---- */

/* ---- 里程碑/交付物：里程碑挂在任务下，一个任务可以有多条「日期 + 交付物 + 是否完成」 ---- */
// 保存前检查一遍里程碑顺序合不合理：排在前面的日期不该比排在后面的还晚（没填日期的行不参与比较，
// 只在相邻两条"都有日期"之间比较，跳过空日期的行）
function findCpOrderIssue(cpData) {
  const dated = cpData.map((c, i) => ({ ...c, i })).filter(c => c.plan_date);
  for (let k = 1; k < dated.length; k++) {
    if (dated[k].plan_date < dated[k - 1].plan_date) {
      return `第 ${dated[k - 1].i + 1} 条里程碑（${dated[k - 1].plan_date}）排在第 ${dated[k].i + 1} 条（${dated[k].plan_date}）前面，但日期反而更晚`;
    }
  }
  return '';
}
// 编辑里程碑期间实时算一遍进度给用户看，但不写回 t.progress——真正落地只在保存成功之后（见 openTaskDetail 的保存回调）
function updateCpProgressPreview() {
  const rows = $$('#cp-list [data-cp-row]');
  const preview = $('#cp-progress-preview');
  if (!rows.length) { if (preview) preview.textContent = ''; return; }
  const doneN = rows.filter(r => { const cb = r.querySelector('.cp-chk'); return cb && cb.checked; }).length;
  const pct = Math.round(doneN / rows.length * 100);
  if (preview) preview.textContent = `进度预览：${doneN}/${rows.length} 已完成（${pct}%），保存后才会真正生效`;
  const locked = $('#td-progress-locked');
  if (locked) locked.textContent = `${pct}%（由检查点自动计算）`;
}
function cpRowHTML(m) {
  const reportLevel = (m && m.report_level) || 'section';   // 新检查点默认选中"处室领导"，不是空白占位
  // 之前这里（可编辑状态，也是最常打开的状态）完全没有逾期提示——一条已经拖期的里程碑跟正常的长得一模一样，
  // 编辑的时候根本看不出哪条该催了。跟只读视图（见上面 openTaskDetail 的 !canEdit 分支）用同一套判断
  const overdue = m && m.done !== '1' && m.plan_date && m.plan_date < todayStr();
  const lateDays = overdue ? -daysFromToday(m.plan_date) : 0;
  /* ★ data-ms-id 是这一行对应的那条里程碑记录的 id，一定要带上 ★
     以前这里没有它，保存时的做法是"把原来的里程碑全部软删除，再按界面上的行重新建一批新的"。
     那样有两个严重后果：
     1) 保存不是幂等的——同一份内容存两次，就会多出一整套重复的里程碑；
     2) 每次保存所有里程碑的 id 都变了，多人同步时对不上账，历史也断了。
     实际事故就是这么来的：保存要走一次共享文件读写（网络盘上可能好几秒），
     这期间弹窗还开着、按钮还能点，用户觉得"没反应"就又点了几下，
     于是一条任务下凭空多出好几套一模一样的里程碑。
     带上 id 之后，保存变成"按 id 就地更新、界面上没有的才删、真新增的才建"，点几次都是同一个结果。 */
  // 检查点行没有稳定的字段名可以拿来当日期框的 id（一条任务下好几行，都叫 cp-date 会重复），
  // 每次渲染现生成一个：只要求"这一轮渲染里唯一"，不需要跨渲染保持不变
  const dateId = uid('cpd');
  return `<div class="cp-row${overdue ? ' cp-row-overdue' : ''}" data-cp-row data-ms-id="${esc(m && m.id ? m.id : '')}">
    <span class="cp-drag-handle" draggable="true" title="按住拖动调整顺序">⠿</span>
    <span class="date-mask-wrap"><input id="${dateId}" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="YYYY-MM-DD" class="cp-date date-mask" value="${esc(m ? m.plan_date : '')}">
      <button type="button" class="date-pick-btn" data-act="date-pick-open" data-for="${dateId}" title="从日历里选">📅</button></span>
    ${overdue ? `<span class="cp-overdue-badge" title="计划完成时间 ${esc(m.plan_date)}，已经过了 ${lateDays} 天还没完成">⚠ 逾期 ${lateDays} 天</span>` : ''}
    <input type="text" class="cp-deliv" placeholder="交付物，可自由填写" value="${esc(m ? m.deliverable : '')}">
    <select class="cp-report-level">
      ${REPORT_LEVELS.map(o => `<option value="${o.v}"${reportLevel === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
    </select>
    <label class="cp-done-lbl"><input type="checkbox" class="cp-chk"${m && m.done === '1' ? ' checked' : ''}> 已完成</label>
    <button type="button" class="action-btn" data-act="cp-insert-after" title="在这条下面插入一条">＋</button>
    <button type="button" class="action-btn del" data-act="cp-remove-row" title="删除这条">×</button>
  </div>`;
}
/* =============================================================
   21b. 批量编辑 / 列配置 / 任务详情
   ============================================================= */
// 按字段类型生成一个录入控件（批量编辑与任务详情共用）
function fieldControl(f, val, idPrefix) {
  const id = idPrefix + f.key;
  switch (f.type) {
    case 'enum':
      return `<select id="${id}">${f.options.map(o => `<option value="${o.v}"${String(val) === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    case 'ref': {
      const opts = optionsOf('task', f, null);
      return `<select id="${id}"><option value="">（无）</option>${opts.map(o =>
        `<option value="${esc(o.v)}"${val === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    case 'person':
      return `<input id="${id}" list="dl-people" value="${esc(val || '')}" placeholder="姓名，可留空">`;
    case 'persons':
      return `<input id="${id}" value="${esc((val || []).join('、'))}" placeholder="多人用顿号或逗号分隔">`;
    case 'date':
      // 跟里程碑的日期输入（cpRowHTML 里的 .cp-date）统一成同一种表示/输入方式：
      // 主体是只认连续数字、自动按 4/2/2 分段的文本框，不依赖浏览器/系统地区设置来决定分段顺序
      // （原生 <input type="date"> 在这上面并不可靠，见 date-mask 相关函数的注释）；
      // 旁边保留一个📅按钮，点了照样能弹出日历点选——两种输入方式并存，各取所需
      return `<span class="date-mask-wrap"><input id="${id}" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="YYYY-MM-DD" class="date-mask" value="${esc(val || '')}">
        <button type="button" class="date-pick-btn" data-act="date-pick-open" data-for="${id}" title="从日历里选">📅</button></span>`;
    case 'num':
      return `<input id="${id}" type="number" value="${esc(val === '' || val == null ? '' : val)}"${f.key === 'progress' ? ' min="0" max="100"' : ''}>`;
    case 'lines':
      return `<textarea id="${id}" placeholder="每行一条">${esc((val || []).join('\n'))}</textarea>`;
    default:
      return `<input id="${id}" value="${esc(val || '')}">`;
  }
}
// 从控件读回符合字段类型的值
function readControl(f, idPrefix) {
  const el = $('#' + idPrefix + f.key);
  if (!el) return undefined;
  const raw = el.value.trim();
  switch (f.type) {
    case 'persons': return splitNames(raw);
    case 'lines':   return parseLines(el.value);
    // 原生 date 控件本身能保证空串或合法的 YYYY-MM-DD；现在改成数字文本框之后就没有这层保证了，
    // 正常情况下 blur 时 normalizeMaskedDateOnBlur 已经清过一遍，这里再校验一次是双保险
    case 'date':    return normalizeMaskedDateValue(raw);
    case 'num': {
      if (raw === '') return f.key === 'progress' ? 0 : '';
      let n = Math.max(0, Number(raw) || 0);
      if (f.key === 'progress') n = Math.min(100, n);
      return n;
    }
    default: return raw;
  }
}
function peopleDatalist() {
  return `<datalist id="dl-people">${allPeople().map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
}

/* 批量修改选中任务的某一个字段 */
function openBatchEdit(fieldKey) {
  const st = UI.tasks;
  const ids = [...st.sel];
  if (!ids.length) return;
  const f = fieldDef('task', fieldKey);
  openModal(`批量修改 · ${f.label}`,
    `<div class="hint" style="margin-bottom:8px">将对选中的 <b>${ids.length}</b> 条任务统一设置「${esc(f.label)}」，其余字段不变。</div>
     <div class="form-row"><label>${esc(f.label)}</label>${fieldControl(f, f.type === 'persons' ? [] : '', 'be-')}</div>
     ${peopleDatalist()}`,
    '应用', async () => {
      const val = readControl(f, 'be-');
      closeModal();
      const doApply = async () => {
        snapshot();
        let skipped = 0;
        await Repo.bulk(() => {
          ids.forEach(id => {
            const t = byId('task', id);
            if (!t) return;
            if (!canEditRecord('task', t)) { skipped++; return; }   // 不是自己负责/参与的任务，组长以下跳过不改
            const before = clone(t);
            t[fieldKey] = val;
            if (fieldKey === 'status') {
              if (val === 'done') { t.actual_date = t.actual_date || todayStr(); if (!hasCheckpoints(t)) t.progress = 100; }
              else t.actual_date = '';
            }
            if (fieldKey === 'work') t.code = val ? nextTaskCode(val) : '';  // 编号跟着新工作重新生成；里程碑挂在任务下，换工作不受影响
            pushLog(id, diffTask(before, t, [fieldKey, 'actual_date', 'progress', 'code']));
            stampMeta(t);
          });
        });
        renderShell(); renderPage();
        showSnack(skipped
          ? `已修改 ${ids.length - skipped} 条任务的${f.label}，${skipped} 条为防误操作被跳过（不是你负责/参与的）`
          : `已修改 ${ids.length} 条任务的${f.label}`);
      };
      // 员工批量把自己牵头的任务转给别人：转移后这些任务就不归自己编辑了，先提醒一句再动手
      if (fieldKey === 'owner' && !hasPermission('edit_others_task')) {
        const affected = ids.filter(id => { const t = byId('task', id); return t && t.owner === DB.settings.me && val !== DB.settings.me; }).length;
        if (affected) {
          confirmModal('转移牵头人', `这次会把 ${affected} 条你牵头的任务转给别人，转移后你将不能再编辑它们（除非同时是参与人）。确定要继续吗？`, '确定改', doApply, true);
          return;
        }
      }
      await doApply();
    });
  setTimeout(() => { const el = $('#be-' + fieldKey); if (el) el.focus(); }, 60);
}

/* 任务详情：一次编辑全部字段（表格列放不下的都在这里） */
/* 某个职责下可选的工作（当前年度内、未删除），按编号排序。

// 新建任务：先造一份还没入库的草稿，直接用任务详情弹窗把字段填全，点"创建"才真正落库
function openNewTask() {
  const draft = blank('task', { status: 'todo', priority: '2', progress: 0 });
  /* 从任务页当前的筛选/树选中状态判断用户此刻大概率是在哪项工作下面新建——直接预填所属工作，
     省去打开详情弹窗后还要再点一次工作选择器的操作。只认"选中了具体某项工作"这一种情况

     没法确定该填哪一项工作，宁可留空让用户自己选，不瞎猜。 */
  const stw = UI.tasks.filters.work;
