  const opts = optionsOf(entity, f, r);
  const popup = $('#select-popup');
  let html = `<div class="sp-header">${esc(f.label)}${multi ? '（可多选）' : ''}</div>`;
  if ((allowNew || opts.length > 8) && !f.noFilter) {
    html += `<div style="padding:0 2px 5px"><input id="sp-manual-input" type="text" class="inline-input" style="height:24px;font-size:12px" placeholder="${allowNew ? '筛选或输入新值…' : '筛选…'}" autocomplete="off"></div>`;
  }
  html += `<div id="sp-list">`;
  if (!multi) {
    if (allowNew) html += `<div class="sp-item sp-addnew" id="sp-addnew" data-act="sp-add" style="display:none"></div>`;
    if (!f.options && !f.required) html += `<div class="sp-item${!cur.length ? ' selected' : ''}" data-act="sp-pick" data-val="">（无）</div>`;
    opts.forEach(o => {
      html += `<div class="sp-item${cur[0] === o.v ? ' selected' : ''}" data-act="sp-pick" data-val="${esc(o.v)}" data-opt="${esc(o.label)}" title="${esc(o.label)}">${esc(o.label)}</div>`;
    });
    if (f.type === 'ref' && !opts.length) html += `<div class="sp-item" style="color:var(--text3);cursor:default">（无可选项）</div>`;
  } else {
    html += `<div class="sp-item"><input type="checkbox" id="sp-none"${!cur.length ? ' checked' : ''}><label for="sp-none">（无）</label></div>`;
    opts.forEach((o, i) => {
      html += `<div class="sp-item" data-opt="${esc(o.label)}"><input type="checkbox" class="sp-cb" id="sp-o${i}" value="${esc(o.v)}"${cur.includes(o.v) ? ' checked' : ''}><label for="sp-o${i}">${esc(o.label)}</label></div>`;
    });
  }
  html += `</div>`;
  if (multi) html += `<button class="sp-confirm" data-act="sp-commit">确定</button>`;
  popup.innerHTML = html;

  const rect = td.getBoundingClientRect();
  popup.style.left = Math.min(rect.left, window.innerWidth - 310) + 'px';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.classList.add('show');
  requestAnimationFrame(() => {
    const h = popup.offsetHeight;
    if (rect.bottom + 2 + h > window.innerHeight - 8) popup.style.top = Math.max(8, rect.top - h - 2) + 'px';
  });

  const inp = $('#sp-manual-input');
  if (inp) {
    inp.addEventListener('input', () => spFilterList());
    inp.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); spAddFromInput(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeSelectPopup(); }
    });
    setTimeout(() => inp.focus(), 50);
  }
  popup.addEventListener('change', ev => {
    if (ev.target.classList.contains('sp-cb')) {
      if (ev.target.checked) {
        const n = $('#sp-none'); if (n) n.checked = false;
        if (!_sp.order.includes(ev.target.value)) _sp.order.push(ev.target.value);
      } else _sp.order = _sp.order.filter(v => v !== ev.target.value);
    } else if (ev.target.id === 'sp-none' && ev.target.checked) {
      popup.querySelectorAll('.sp-cb').forEach(cb => { cb.checked = false; });
      _sp.order = [];
    }
  });

  if (spCloseListener) document.removeEventListener('mousedown', spCloseListener);
  spCloseListener = ev => { if (!popup.contains(ev.target) && !td.contains(ev.target)) closeSelectPopup(); };
  setTimeout(() => document.addEventListener('mousedown', spCloseListener), 0);
}

function spFilterList() {
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(), q = raw.toLowerCase();
  $$('#sp-list [data-opt]').forEach(el => {
    el.style.display = (!q || (el.dataset.opt || '').toLowerCase().includes(q)) ? '' : 'none';
  });
  const add = $('#sp-addnew');
  if (add && _sp && _sp.allowNew) {
    const exists = $$('#sp-list [data-opt]').some(el => el.dataset.opt === raw);
    if (raw && !exists) { add.textContent = `+ 新增「${raw}」`; add.style.display = ''; }
    else add.style.display = 'none';
  }
}
function splitNames(raw) { return raw.split(/[,，、\s]+/).map(s => s.trim()).filter(Boolean); }

function spAddFromInput() {
  if (!_sp) return;
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(); if (!raw) return;
  if (!_sp.allowNew) {                       // enum / ref 不允许新增：回车选中首个可见项
    const first = $$('#sp-list [data-act="sp-pick"]').find(el => el.style.display !== 'none' && el.dataset.opt);
    if (first) spCommitSingle(first.dataset.val);
    return;
  }
  if (_sp.multi) {
    splitNames(raw).forEach(n => { if (!_sp.order.includes(n)) _sp.order.push(n); });
    inp.value = '';
    spCommitMulti();
  } else spCommitSingle(raw);
}

// 员工把自己牵头的任务转给别人（或删掉自己牵头的任务）之后就没法再编辑了（除非同时是参与人）——
// 这两种情况都提前问一句，别让人手滑之后才发现自己看不了、改不了了
function ownerChangeNeedsWarning(t, newOwner) {
  return !!t && !hasPermission('edit_others_task') && t.owner && t.owner === DB.settings.me && newOwner !== DB.settings.me;
}
function confirmOwnerChange(onConfirm) {
  confirmModal('转移牵头人', '把牵头人改成别人后，你将不再能编辑这个任务（除非你同时是参与人）。确定要继续吗？', '确定改', onConfirm, true);
}
async function spCommitSingle(val) {
  if (!_sp) return;
  const { entity, id, field } = _sp;
  const r = byId(entity, id);
  if (entity === 'task' && field === 'owner' && ownerChangeNeedsWarning(r, val)) {
    closeSelectPopup();
    confirmOwnerChange(() => finishSpCommitSingle(entity, id, field, val));
    return;
  }
  if (entity === 'task' && field === 'status') {
    closeSelectPopup();
    if (val === 'done' && hasIncompleteCheckpoints(r)) confirmCompleteCheckpointsThenStatus(r);
    else await commitTaskStatus(r, val, false);
    return;
  }
  closeSelectPopup();
  await finishSpCommitSingle(entity, id, field, val);
}
async function finishSpCommitSingle(entity, id, field, val) {
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = entity === 'task' ? clone(r) : null;
  r[field] = val;
  if (before) pushLog(id, diffTask(before, r, [field]));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}
// 任务下是否还有没标完成的里程碑
function hasIncompleteCheckpoints(t) { return DB.milestones.some(m => m.task === t.id && !m.deleted_at && m.done !== '1'); }
// 真正落地"改状态"这个动作：跟原来单击循环切换时的副作用保持一致——变成已完成要顺带填实际完成时间、
// 没有里程碑时进度直接设 100，有里程碑时按里程碑完成比例重算；alsoCompleteCheckpoints 为真时连里程碑一起标完成
async function commitTaskStatus(t, newStatus, alsoCompleteCheckpoints) {
  snapshot();
  const before = clone(t);
  if (alsoCompleteCheckpoints) {
    DB.milestones.filter(m => m.task === t.id && !m.deleted_at && m.done !== '1').forEach(m => {
      m.done = '1'; m.actual_date = m.actual_date || todayStr(); stampMeta(m);
    });
  }
  t.status = newStatus;
  if (newStatus === 'done') {
    t.actual_date = t.actual_date || todayStr();
    if (hasCheckpoints(t)) recalcProgress(t); else t.progress = 100;
  } else {
    t.actual_date = '';
  }
  pushLog(t.id, diffTask(before, t, ['status', 'actual_date', 'progress']));
  await Repo.upsert('task', t);
  afterEdit('task', t.id, 'status');
}
// 选"已完成"但里程碑还没全部标完成：问一句要不要一并标完成——"仅改状态"这个额外按钮嵌在弹窗正文里，
// 跟标准的"取消"（整个不改）、确定（一并标完成）区分开，是个三选一
let _statusOnlyTask = null;
function confirmCompleteCheckpointsThenStatus(t) {
  const n = DB.milestones.filter(m => m.task === t.id && !m.deleted_at && m.done !== '1').length;
  _statusOnlyTask = t;
  openModal('标记任务为已完成', `
    <p>这个任务下还有 <b>${n}</b> 个里程碑没有标记为完成。</p>
    <div style="margin-top:8px"><button type="button" class="btn" data-act="status-done-only">仅改任务状态，不动里程碑</button></div>`,
    '一并标记里程碑为已完成', async () => {
      closeModal();
      const t2 = _statusOnlyTask; _statusOnlyTask = null;
      if (t2) await commitTaskStatus(t2, 'done', true);
    });
}

// 多选弹层里手打了姓名但没按回车就直接点"确定"：先把输入框里还没提交的内容并进选中项，
// 否则这段文字会被直接丢弃——之前正是"参与人/协同人员打了多个姓名却录不进去"的原因
function spFlushManualInput() {
  if (!_sp || !_sp.multi) return;
  const inp = $('#sp-manual-input'); if (!inp) return;
  const raw = (inp.value || '').trim(); if (!raw) return;
  splitNames(raw).forEach(n => { if (!_sp.order.includes(n)) _sp.order.push(n); });
  inp.value = '';
}
async function spCommitMulti() {
  if (!_sp) return;
  spFlushManualInput();
  const { entity, id, field, order } = _sp;
  const popup = $('#select-popup');
  const checked = new Set([...popup.querySelectorAll('.sp-cb:checked')].map(cb => cb.value));
  const inDom = new Set([...popup.querySelectorAll('.sp-cb')].map(cb => cb.value));
  // order 里既有勾选框中的项，也有刚输入新增、尚未在列表中的项，后者一律保留
  const vals = order.filter(v => checked.has(v) || !inDom.has(v));
  closeSelectPopup();
  const r = byId(entity, id); if (!r) return;
  snapshot();
  const before = entity === 'task' ? clone(r) : null;
  r[field] = vals;
  if (before) pushLog(id, diffTask(before, r, [field]));
  await Repo.upsert(entity, r);
  afterEdit(entity, id, field);
}

function closeSelectPopup() {
  const p = $('#select-popup');
  p.classList.remove('show'); p.innerHTML = ''; _sp = null;

}

/* ---- 所属工作二级级联选择：先选职责，鼠标划过展开该职责下的工作，再点选 ---- */
let _wpHideTimer = null;
function closeWorkSub() {

}
function openWorkPicker(entity, id, f, td) {
  commitActiveEdit();

  const scheduleHide = () => { cancelHide(); _wpHideTimer = setTimeout(() => { sub.classList.remove('show'); sub.innerHTML = ''; }, 250); };

async function wpCommit(val) {
  if (!_sp) return;

}

/* ---- 日期选择器 ---- */
let _dp = null, dpCloseListener = null;

function openDatePicker(entity, id, fieldKey, td) {
  commitActiveEdit();
  const r = byId(entity, id); if (!r) return;
  const ref = r[fieldKey] ? new Date(r[fieldKey] + 'T00:00:00') : new Date();
  _dp = { entity, id, field: fieldKey, year: ref.getFullYear(), month: ref.getMonth() };
  renderDpCalendar();
  const wrap = $('#date-picker-wrap');
  const rect = td.getBoundingClientRect();
  wrap.style.left = Math.min(rect.left, window.innerWidth - 220) + 'px';
  wrap.style.top = (rect.bottom + 4) + 'px';

    const h = wrap.offsetHeight;
    if (rect.bottom + 4 + h > window.innerHeight - 8) wrap.style.top = Math.max(8, rect.top - h - 4) + 'px';
  });
  if (dpCloseListener) document.removeEventListener('mousedown', dpCloseListener);
  dpCloseListener = ev => { if (!wrap.contains(ev.target) && !td.contains(ev.target)) dpClose(); };
  setTimeout(() => document.addEventListener('mousedown', dpCloseListener), 0);
}
function renderDpCalendar() {
  if (!_dp) return;
  const r = byId(_dp.entity, _dp.id);
  const sel = r ? (r[_dp.field] || '') : '';
  const today = todayStr();
  const firstDow = new Date(_dp.year, _dp.month, 1).getDay();
  const days = new Date(_dp.year, _dp.month + 1, 0).getDate();
  let html = `<div class="dp-cal-nav">
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="-1">&#8249;</button>
      <span class="dp-cal-title">${_dp.year}年${_dp.month + 1}月</span>
      <button class="dp-cal-nav-btn" data-act="dp-nav" data-dir="1">&#8250;</button>
    </div><div class="dp-cal-grid">
    ${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="dp-cal-dow">${d}</div>`).join('')}`;
  for (let i = 0; i < firstDow; i++) html += '<div class="dp-cal-day is-empty"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${_dp.year}-${String(_dp.month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    let cls = 'dp-cal-day';
    if (ds === today) cls += ' is-today';
    if (ds === sel) cls += ' is-selected';
    html += `<div class="${cls}" data-act="dp-pick" data-date="${ds}">${d}</div>`;
  }
  $('#dp-calendar').innerHTML = html + '</div>';
}

/* ---- 里程碑/交付物：里程碑挂在任务下，一个任务可以有多条「日期 + 交付物 + 是否完成」 ---- */
// 保存前检查一遍里程碑顺序合不合理：排在前面的日期不该比排在后面的还晚（没填日期的行不参与比较，
// 只在相邻两条"都有日期"之间比较，跳过空日期的行）
function findCpOrderIssue(cpData) {
  const dated = cpData.map((c, i) => ({ ...c, i })).filter(c => c.plan_date);
  for (let k = 1; k < dated.length; k++) {
    if (dated[k].plan_date < dated[k - 1].plan_date) {
      return `第 ${dated[k - 1].i + 1} 条里程碑（${dated[k - 1].plan_date}）排在第 ${dated[k].i + 1} 条（${dated[k].plan_date}）前面，但日期反而更晚`;
    }
  }
  return '';
}
// 编辑里程碑期间实时算一遍进度给用户看，但不写回 t.progress——真正落地只在保存成功之后（见 openTaskDetail 的保存回调）
function updateCpProgressPreview() {
  const rows = $$('#cp-list [data-cp-row]');
  const preview = $('#cp-progress-preview');
  if (!rows.length) { if (preview) preview.textContent = ''; return; }
  const doneN = rows.filter(r => { const cb = r.querySelector('.cp-chk'); return cb && cb.checked; }).length;
  const pct = Math.round(doneN / rows.length * 100);
  if (preview) preview.textContent = `进度预览：${doneN}/${rows.length} 已完成（${pct}%），保存后才会真正生效`;
  const locked = $('#td-progress-locked');
  if (locked) locked.textContent = `${pct}%（由检查点自动计算）`;
}

   ============================================================= */
// 按字段类型生成一个录入控件（批量编辑与任务详情共用）
function fieldControl(f, val, idPrefix) {
  const id = idPrefix + f.key;
  switch (f.type) {
    case 'enum':
      return `<select id="${id}">${f.options.map(o => `<option value="${o.v}"${String(val) === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    case 'ref': {
      const opts = optionsOf('task', f, null);
      return `<select id="${id}"><option value="">（无）</option>${opts.map(o =>
        `<option value="${esc(o.v)}"${val === o.v ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
    }
    case 'person':
      return `<input id="${id}" list="dl-people" value="${esc(val || '')}" placeholder="姓名，可留空">`;
    case 'persons':
      return `<input id="${id}" value="${esc((val || []).join('、'))}" placeholder="多人用顿号或逗号分隔">`;
    case 'date':
      // 跟里程碑的日期输入（cpRowHTML 里的 .cp-date）统一成同一种表示/输入方式：原生日期选择器，
      // 不再是"YYYY-MM-DD / today / +7"这种要背关键字的自由文本框
      return `<input id="${id}" type="date" value="${esc(val || '')}">`;
    case 'num':
      return `<input id="${id}" type="number" value="${esc(val === '' || val == null ? '' : val)}"${f.key === 'progress' ? ' min="0" max="100"' : ''}>`;
    case 'lines':
      return `<textarea id="${id}" placeholder="每行一条">${esc((val || []).join('\n'))}</textarea>`;
    default:
      return `<input id="${id}" value="${esc(val || '')}">`;
  }
}
// 从控件读回符合字段类型的值
function readControl(f, idPrefix) {
  const el = $('#' + idPrefix + f.key);
  if (!el) return undefined;
  const raw = el.value.trim();
  switch (f.type) {
    case 'persons': return splitNames(raw);
    case 'lines':   return parseLines(el.value);
    case 'date':    return raw;   // 原生 date 控件本身就保证是空串或合法的 YYYY-MM-DD，不用再额外解析
    case 'num': {
      if (raw === '') return f.key === 'progress' ? 0 : '';
      let n = Math.max(0, Number(raw) || 0);
      if (f.key === 'progress') n = Math.min(100, n);
      return n;
    }
    default: return raw;
  }
}
function peopleDatalist() {
  return `<datalist id="dl-people">${allPeople().map(p => `<option value="${esc(p)}">`).join('')}</datalist>`;
}

/* 批量修改选中任务的某一个字段 */
function openBatchEdit(fieldKey) {
  const st = UI.tasks;
  const ids = [...st.sel];
  if (!ids.length) return;
  const f = fieldDef('task', fieldKey);
  openModal(`批量修改 · ${f.label}`,
    `<div class="hint" style="margin-bottom:8px">将对选中的 <b>${ids.length}</b> 条任务统一设置「${esc(f.label)}」，其余字段不变。</div>
     <div class="form-row"><label>${esc(f.label)}</label>${fieldControl(f, f.type === 'persons' ? [] : '', 'be-')}</div>
     ${peopleDatalist()}`,
    '应用', async () => {
      const val = readControl(f, 'be-');
      closeModal();
      const doApply = async () => {
        snapshot();
        let skipped = 0;
        await Repo.bulk(() => {
          ids.forEach(id => {
            const t = byId('task', id);
            if (!t) return;
            if (!canEditRecord('task', t)) { skipped++; return; }   // 不是自己负责/参与的任务，组长以下跳过不改
            const before = clone(t);
            t[fieldKey] = val;
            if (fieldKey === 'status') {
              if (val === 'done') { t.actual_date = t.actual_date || todayStr(); if (!hasCheckpoints(t)) t.progress = 100; }
              else t.actual_date = '';
            }
            if (fieldKey === 'work') t.code = val ? nextTaskCode(val) : '';  // 编号跟着新工作重新生成；里程碑挂在任务下，换工作不受影响
            pushLog(id, diffTask(before, t, [fieldKey, 'actual_date', 'progress', 'code']));
            stampMeta(t);
          });
        });
        renderShell(); renderPage();
        showSnack(skipped
          ? `已修改 ${ids.length - skipped} 条任务的${f.label}，${skipped} 条为防误操作被跳过（不是你负责/参与的）`
          : `已修改 ${ids.length} 条任务的${f.label}`);
      };
      // 员工批量把自己牵头的任务转给别人：转移后这些任务就不归自己编辑了，先提醒一句再动手
      if (fieldKey === 'owner' && !hasPermission('edit_others_task')) {
        const affected = ids.filter(id => { const t = byId('task', id); return t && t.owner === DB.settings.me && val !== DB.settings.me; }).length;
        if (affected) {
          confirmModal('转移牵头人', `这次会把 ${affected} 条你牵头的任务转给别人，转移后你将不能再编辑它们（除非同时是参与人）。确定要继续吗？`, '确定改', doApply, true);
          return;
        }
      }
      await doApply();
    });
  setTimeout(() => { const el = $('#be-' + fieldKey); if (el) el.focus(); }, 60);
}

/* 任务详情：一次编辑全部字段（表格列放不下的都在这里） */
function openTaskDetail(id) {
  const t = byId('task', id);
  if (!t) return;
  // 不是自己负责/参与的任务：得有 view_others_detail 权限才能打开详情弹窗（表格行本身仍然看得到，这条只管详情弹窗）

    showSnack('为了防止误操作，暂时不能查看他人任务的详情');

  }
  const canEdit = canEditRecord('task', t);   // 查看谁都能看，只有负责人/参与人或组长以上能改
  const fs = schema('task').fields.filter(f => !f.internal);
  // "work" 字段自己有专门的分支（下面 cell() 里），不走这条通用判断，这里只管其它走通用渲染的字段
  const wide = k => k === 'title';
  // 有检查点时进度由检查点完成比例自动算，这里就不给手改的控件了
  const lockProgress = f => f.key === 'progress' && hasCheckpoints(t);
  const w = byId('work', t.work);
  const existingCps = DB.milestones.filter(m => m.task === t.id && !m.deleted_at)
    .sort((a, b) => (a.plan_date || '9999-99-99').localeCompare(b.plan_date || '9999-99-99'));
  const cell = f => {
    if (f.type === 'checkpoints') {
      if (!canEdit) {
        const listHTML = existingCps.length ? `<div class="ms-list">${existingCps.map(m => {
          const levelLabel = (REPORT_LEVELS.find(r => r.v === m.report_level) || {}).label || '';
          const overdue = m.done !== '1' && m.plan_date && m.plan_date < todayStr();
          return `<div class="ms-item">
            <span class="ms-date"${overdue ? ' style="color:var(--overdue)"' : ''}>${esc(m.plan_date || '无日期')}</span>
            <span class="ms-deliv">${esc(m.deliverable || '（未填写交付物）')}</span>
            ${levelLabel ? `<span class="ms-level">${esc(levelLabel)}</span>` : ''}
            <span class="ms-status"${m.done === '1' ? ' style="color:var(--done)"' : (overdue ? ' style="color:var(--overdue)"' : '')}>${m.done === '1' ? `✓ 已交付${m.actual_date ? '（' + esc(m.actual_date) + '）' : ''}` : (overdue ? '已逾期' : '未交付')}</span>
          </div>`;
        }).join('')}</div>` : `<div class="hint" style="padding:4px 0">暂无里程碑</div>`;
        return `<label>${esc(f.label)}</label><div class="full">${listHTML}</div>`;
      }
      // 可编辑：里程碑行直接摆在详情表单里一起编辑，不再跳到单独的弹窗；保存按钮统一提交。
      // 每行前面的 ⠿ 可以按住上下拖动调整顺序，＋ 可以在这一行下面插入新的一条——每行都有了，
      // 就不再需要底部单独一个"添加一条"的按钮；标签本身也挪到单独一行、左对齐，摆在第一条里程碑上方
      return `<div class="full-row"><label class="cp-section-label">${esc(f.label)}</label></div>
        <div class="full-row">
          <div id="cp-list">${(existingCps.length ? existingCps : [null]).map(cpRowHTML).join('')}</div>
          <div id="cp-progress-preview" class="hint" style="margin-top:4px"></div>

    }

      const dutyCell = `<label>所属职责</label><div><span class="detail-ro">${esc(dutyDisplay)}</span></div>`;
      if (!canEdit) {

        // 勾完之后进度自然就是 100%（跟没有检查点时点"已完成"直接把进度设成 100% 是同一个效果）
        return `<label>${esc(f.label)}</label>
          <div class="progress-edit-row"><span class="detail-ro" id="td-progress-locked">${esc(t.progress)}%（由检查点自动计算）</span>
          <button type="button" class="btn" data-act="cp-mark-all-done">已完成</button></div>`;
      }
      return `<label for="td-progress">${esc(f.label)}</label>
        <div class="progress-edit-row">${fieldControl(f, t.progress, 'td-')}<span class="unit-suffix">%</span>
        <button type="button" class="btn" data-act="progress-set-done">已完成</button></div>`;
    }
    // 状态、优先级、计划完成时间挤在同一行显示——这三项放一起看比较顺手，不用各占一行上下翻
    if (['status', 'priority', 'plan_date'].includes(f.key)) {

       最后修改：${esc((t.updated_at || '').slice(0, 10))} by ${esc(t.updated_by || '—')}
       ${canEdit ? '' : '　·　<span style="color:var(--text3)">只读：不是你负责/参与的任务</span>'}
     </div>`,
    canEdit ? '保存' : '关闭', async () => {
      if (!canEdit) { closeModal(); return; }
      // 弹确认框会顶掉这个弹窗自己的 DOM（modal 只有一个槽位），所以要先把所有字段/里程碑的待存值读出来，
      // 而不是等确认完了再回来读——那时候 td-* 这些输入框已经不在了
      const collected = {};
      fs.forEach(f => {
        if (f.type === 'checkpoints' || f.readonly || lockProgress(f)) return;
        const v = readControl(f, 'td-');
        if (v !== undefined) collected[f.key] = v;
      });
      const cpRows = $$('#cp-list [data-cp-row]');
      const cpData = cpRows.map(r => ({
        plan_date: r.querySelector('.cp-date').value,
        deliverable: r.querySelector('.cp-deliv').value.trim(),
        report_level: r.querySelector('.cp-report-level').value,
        done: r.querySelector('.cp-chk').checked ? '1' : '0',
      })).filter(d => d.plan_date || d.deliverable);
      const pendingOwner = 'owner' in collected ? collected.owner : t.owner;
      const doSave = async () => {
        snapshot();
        const before = clone(t);
        // 全量替换里程碑没有稳定的逐条 id，用「日期+交付物」做粗略比对，描述新增/移除/完成数变化
        const cpKey = c => c.plan_date + '|' + c.deliverable;
        const beforeKeys = new Set(existingCps.map(cpKey));
        const afterKeys = new Set(cpData.map(cpKey));
        const added = cpData.filter(c => !beforeKeys.has(cpKey(c))).map(c => c.deliverable || c.plan_date).filter(Boolean);
        const removed = existingCps.filter(c => !afterKeys.has(cpKey(c))).map(c => c.deliverable || c.plan_date).filter(Boolean);
        const beforeDoneN = existingCps.filter(c => c.done === '1').length;
        const afterDoneN = cpData.filter(c => c.done === '1').length;
        const cpParts = [];
        if (cpData.length !== existingCps.length) cpParts.push(`检查点数：${existingCps.length}→${cpData.length}`);
        if (afterDoneN !== beforeDoneN) cpParts.push(`已完成：${beforeDoneN}→${afterDoneN}`);
        if (added.length) cpParts.push(`新增「${added.join('、')}」`);
        if (removed.length) cpParts.push(`移除「${removed.join('、')}」`);
        let dateAdjustedMsg = '';
        await Repo.bulk(() => {
          Object.assign(t, collected);
          existingCps.forEach(m => softDelete('milestone', m.id));
          cpData.forEach(cd => {
            DB.milestones.push(stampMeta(blank('milestone', {
              task: t.id, plan_date: cd.plan_date, deliverable: cd.deliverable, report_level: cd.report_level, done: cd.done,
              actual_date: cd.done === '1' ? todayStr() : '',
            })));
          });
          recalcProgress(t);
          // 里程碑的计划日期不该晚于任务自己的"计划完成时间"——这在逻辑上说不通（东西还没到，任务却已经算完成了）。
          // 出现这种情况就把任务的计划完成时间顺延到最晚那个里程碑的日期，而不是留着这个不合理的状态不管
          const latestMs = cpData.reduce((mx, c) => (c.plan_date && c.plan_date > mx) ? c.plan_date : mx, '');
          if (latestMs && (!t.plan_date || latestMs > t.plan_date)) {
            dateAdjustedMsg = `计划完成时间已顺延至 ${latestMs}（有里程碑排在了原计划之后）`;
            t.plan_date = latestMs;
          }
          if (t.status === 'done') {
            t.actual_date = t.actual_date || todayStr();
            if (!t.progress && !hasCheckpoints(t)) t.progress = 100;
          }
          stampMeta(t);
        });
        pushLog(t.id, [diffTask(before, t), cpParts.join('；')].filter(Boolean).join('；'));
        closeModal();
        renderShell(); renderPage();
        showSnack(['已保存', dateAdjustedMsg].filter(Boolean).join('，'));
      };
      const proceedAfterOrderCheck = async () => {
        if (ownerChangeNeedsWarning(t, pendingOwner)) { confirmOwnerChange(doSave); return; }
        await doSave();
      };
      const orderIssue = findCpOrderIssue(cpData);
      if (orderIssue) {
        confirmModal('里程碑顺序看起来不太对', `${orderIssue}，仍然要保存吗？`, '仍然保存', proceedAfterOrderCheck, true);
        return;
      }
      await proceedAfterOrderCheck();
    });
  setTimeout(() => { const el = $('#td-title'); if (el) { el.focus(); el.select(); } }, 60);
  updateCpProgressPreview();
}

// 日期加 n 年，2/29 落到平年时退到 2/28
function shiftYear(ds, n) {

}

/* ---- 数据体检：找出引用断裂与明显异常 ---- */
function healthCheck() {
  const issues = [];
  const orphanTasks = DB.tasks.filter(t => !t.deleted_at && t.work && !byId('work', t.work));
  if (orphanTasks.length) issues.push({ k: 'orphanTask', n: orphanTasks.length, msg: `${orphanTasks.length} 条任务指向了不存在的工作`, fix: '清空这些任务的所属工作' });

  const noWork = DB.tasks.filter(t => !t.deleted_at && !t.work);
  if (noWork.length) issues.push({ k: 'noWork', n: noWork.length, msg: `${noWork.length} 条任务未归属任何工作`, fix: null });

  const orphanMs = DB.milestones.filter(m => !m.deleted_at && (!m.task || !byId('task', m.task)));
  if (orphanMs.length) issues.push({ k: 'orphanMs', n: orphanMs.length, msg: `${orphanMs.length} 个里程碑指向了不存在的任务`, fix: '删除这些里程碑' });

  const badDuty = DB.works.filter(w => !w.deleted_at && (!w.duty || !byId('duty', w.duty)));
  if (badDuty.length) issues.push({ k: 'badDuty', n: badDuty.length, msg: `${badDuty.length} 项工作指向了不存在的职责`, fix: null });

  const seen = new Map(), dup = [];
  DB.works.filter(w => !w.deleted_at).forEach(w => {
    const k = w.year + '/' + w.code;
    if (seen.has(k)) dup.push(w); else seen.set(k, w);
  });
  if (dup.length) issues.push({ k: 'dupCode', n: dup.length, msg: `${dup.length} 项工作在同一年度内编号重复`, fix: null });

  const noDate = DB.tasks.filter(t => !t.deleted_at && isOpen(t) && !t.plan_date);
  if (noDate.length) issues.push({ k: 'noDate', n: noDate.length, msg: `${noDate.length} 条未完成任务没有计划完成时间`, fix: null });

  // 没填计划完成时间、但底下已经有里程碑的任务：里程碑本身有日期，没道理任务还空着，直接拿最后一个里程碑日期补上
  const noDateHasMsMap = new Map();   // taskId -> 该任务最晚的里程碑日期
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    const t = byId('task', m.task);
    if (t && !t.deleted_at && isOpen(t) && !t.plan_date) {
      const cur = noDateHasMsMap.get(t.id);
      if (!cur || m.plan_date > cur) noDateHasMsMap.set(t.id, m.plan_date);
    }
  });
  if (noDateHasMsMap.size) issues.push({ k: 'noDateHasMs', n: noDateHasMsMap.size,
    msg: `${noDateHasMsMap.size} 条任务没填计划完成时间，但底下已经有里程碑`, fix: '用最后一个里程碑日期补全' });

  // 里程碑计划日期晚于任务自己的计划完成时间，逻辑上说不通——交付物还没到，任务却已经算完成了
  const msLateMap = new Map();   // taskId -> 该任务下最晚的里程碑日期
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    const t = byId('task', m.task);
    if (t && !t.deleted_at && t.plan_date && m.plan_date > t.plan_date) {
      const cur = msLateMap.get(t.id);
      if (!cur || m.plan_date > cur) msLateMap.set(t.id, m.plan_date);
    }
  });
  if (msLateMap.size) issues.push({ k: 'msLateThanTask', n: msLateMap.size,
    msg: `${msLateMap.size} 条任务的里程碑计划日期晚于任务本身的计划完成时间`, fix: '把这些任务的计划完成时间顺延到最晚的里程碑日期' });

  return { issues, orphanTasks, orphanMs, msLateMap, noDateHasMsMap };
}

async function fixHealth(kind) {
  const r = healthCheck();
  snapshot();
  await Repo.bulk(() => {
    if (kind === 'orphanTask') r.orphanTasks.forEach(t => { t.work = ''; stampMeta(t); });
    if (kind === 'orphanMs') r.orphanMs.forEach(m => { m.deleted_at = new Date().toISOString(); stampMeta(m); });
    if (kind === 'msLateThanTask') r.msLateMap.forEach((newDate, taskId) => {
      const t = byId('task', taskId);
      if (t) { t.plan_date = newDate; stampMeta(t); }
    });
    if (kind === 'noDateHasMs') r.noDateHasMsMap.forEach((date, taskId) => {
      const t = byId('task', taskId);
      if (t) { t.plan_date = date; stampMeta(t); }
    });
  });
  renderPage();
  showSnack('已修复（Ctrl+Z 可撤销）');
}

function lastChangeAt() {
  let mx = '';
  ['duty', 'work', 'milestone', 'task'].forEach(e => coll(e).forEach(r => {
    if (r.updated_at && r.updated_at > mx) mx = r.updated_at;
  }));
  return mx;
}
function backupState() {
  const last = DB.settings.lastBackupAt || '';
  const change = lastChangeAt();
  const stale = !last || (change && change > last);
  const days = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
  return { last, stale, days };
}

// 多值字段用逗号拼接；值内含逗号或反斜杠时转义，保证往返无损
// 去掉用户手打的行首编号（"1、" "2." "(3)" 等），避免和显示时自动加的编号重复
function stripLineNumber(s) {
  return String(s || '').replace(/^\s*(?:[\(（]\d{1,3}[\)）]|\d{1,3}[.、,，:：)）])\s*/, '');
}
function parseLines(raw) {
  return String(raw || '').split('\n').map(s => stripLineNumber(s.trim())).filter(Boolean);
}
function joinMulti(arr) {
  return (arr || []).map(v => String(v).replace(/\\/g, '\\\\').replace(/,/g, '\\,')).join(',');
}
function splitMulti(raw) {
  if (!raw) return [];
  // 兼容手工整理的 Excel：顿号、中文逗号也当分隔符，先归一成英文逗号再按转义规则切分
  const norm = String(raw).replace(/[、，]/g, ',');
  const out = []; let cur = '', escd = false;
  for (const c of norm) {
    if (escd) { cur += c; escd = false; }
    else if (c === '\\') escd = true;
    else if (c === ',') { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim()).filter(Boolean);
}
function toCSVField(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c === '\r') { /* 由 \n 收行 */ }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => c !== ''));
}
function csvHeaders(entity) {
  const sc = schema(entity);
  const keys = sc.fields.filter(f => !f.virtual).map(f => f.key);
  return [...(sc.pk === 'id' ? ['id'] : []), ...keys, 'created_at', 'updated_at', 'updated_by', 'rev', 'deleted_at'];
}
function csvCell(entity, r, key) {
  const f = fieldDef(entity, key);
  if (!f) return r[key];
  if (f.type === 'lines') return (r[key] || []).join('\n');
  if (f.type === 'multi' || f.type === 'persons') return joinMulti(r[key]);
  return r[key];
}
function download(name, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

async function connectSharedFile() {
  if (!('showDirectoryPicker' in window)) { showSnack('这个浏览器不支持文件系统访问，换 Chrome / 360 等 Chromium 内核浏览器再试'); return; }
  try {
    // 选文件夹而不是选文件：文件夹里放哪个文件由 shareConfig.fileName 固定死，不会挑错文件。
    // 浏览器不允许代码直接把选择框定位到任意路径（这是平台级的安全限制，没有绕过的办法），

    // 只能靠调用方（见 confirmConnectWithHint）先把完整路径文字讲清楚
    const opts = {};

    const dirHandle = await window.showDirectoryPicker(opts);
    const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { showSnack('没有拿到读写权限，连接取消'); return; }
    const fileName = (DB.shareConfig && DB.shareConfig.fileName) || DEFAULT_SHARE_FILE_NAME;
    const handle = await dirHandle.getFileHandle(fileName, { create: true });
    let remote = { duties: [], works: [], milestones: [], tasks: [], changelog: [], users: [], permissionMatrix: null, shareConfig: null };
    const text = await (await handle.getFile()).text();
    if (text.trim()) {
      try { remote = JSON.parse(text); }
      catch (e) { showSnack('这个文件内容不是合法 JSON，按空数据处理，请确认选对了文件夹'); }
    }
    const merged = mergeSyncPayload(syncPayload(DB), remote);
    Object.assign(DB, merged);
    rebuildIndex();
    await idbSetHandle(dirHandle);
    _dirHandle = dirHandle;
    _fileHandle = handle;
    _lastSyncedMtime = 0;   // 强制下一次保存重新核对文件是否被动过，而不是直接覆盖
    DB.settings.sharedFileName = fileName;

    if (e && e.name === 'AbortError') return;   // 用户自己关掉了选择框，不算错误

async function tryReconnectSharedFile() {
  try {
    const handle = await idbGetHandle();
    if (!handle) return false;
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') return false;
    if (handle.kind === 'directory') {
      const fileName = (DB.shareConfig && DB.shareConfig.fileName) || DEFAULT_SHARE_FILE_NAME;
      _dirHandle = handle;
      _fileHandle = await handle.getFileHandle(fileName, { create: true });

    startAutoReload();
    return true;
  } catch (e) { return false; }
}

// 解析并写入一份 CSV 文本；entity/mode 见 openImportModal 的说明。返回实际写入的行数。
async function applyCSVImport(entity, mode, text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const sc = schema(entity);
  const rows = parseCSV(text);
  if (rows.length < 2) { showSnack('CSV 内容为空'); return 0; }
  const head = rows[0].map(s => s.trim());
  const get = (cols, k) => { const i = head.indexOf(k); return i >= 0 ? (cols[i] || '') : ''; };
  let n = 0;
  snapshot();
  await Repo.bulk(() => {
    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i], rec = {};
      sc.fields.filter(f => !f.virtual).forEach(f => {
        const raw = get(cols, f.key);
        if (f.type === 'lines') rec[f.key] = parseLines(raw);
        else if (f.type === 'multi' || f.type === 'persons') rec[f.key] = splitMulti(raw);
        else if (['code', 'work', 'duty'].includes(f.key)) rec[f.key] = padCode(raw);
        else rec[f.key] = raw;
      });
      if (sc.pk === 'id') {
        let id;
        if (mode === 'append') {
          // 增量模式：永远新增，编号无视 CSV 内容、按当前最大编号自动接续
          id = '';
          if (entity === 'work') rec.code = nextWorkCode(rec.duty, Number(rec.year) || DB.settings.year || new Date().getFullYear());
          if (entity === 'task') rec.code = rec.work ? nextTaskCode(rec.work) : '';
        } else {
          // 覆盖模式：按「编号（+年度）」认领已有记录，找不到才新建
          id = get(cols, 'id');
          if (entity === 'work' && rec.code) {
            const hit = DB.works.find(w => w.code === rec.code && String(w.year) === String(rec.year));
            if (hit) id = hit.id;
          } else if (entity === 'task' && rec.code) {
            const hit = DB.tasks.find(t => t.code === rec.code && !t.deleted_at);
            if (hit) id = hit.id;
          }
        }
        rec.id = id || uid(entity[0]);
      } else {
        // 目前只有职责的主键就是编号本身
        if (mode === 'append') {
          const used = DB.duties.map(d => parseInt(d.code) || 0);
          rec.code = String((used.length ? Math.max(...used) : 0) + 1).padStart(2, '0');
        }
        if (!rec[sc.pk]) continue;
      }
      if (entity === 'task' && !rec.code && rec.work) rec.code = nextTaskCode(rec.work);   // 兜底：仍没编号则按所属工作自动生成
      ['created_at', 'updated_at', 'updated_by', 'deleted_at'].forEach(k => { const v = get(cols, k); if (v) rec[k] = v; });
      rec.rev = Number(get(cols, 'rev')) || 1;
      normalize(entity, rec);
      const list = coll(entity);
      const j = list.findIndex(x => x[sc.pk] === rec[sc.pk]);
      if (j === -1) list.push(rec); else list[j] = rec;
      n++;
    }
  });
  return n;
}

// 返回 { taskN, msN, skipped }
async function applyWideImport(mode, text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = parseCSV(text);
  if (rows.length < 2) { showSnack('CSV 内容为空'); return null; }
  const head = rows[0].map(s => s.trim());
  const get = (cols, k) => { const i = head.indexOf(k); return i >= 0 ? (cols[i] || '').trim() : ''; };
  let taskN = 0, msN = 0, skipped = 0, badDate = 0;
  snapshot();
  await Repo.bulk(() => {
    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i];
      const workName = get(cols, '所属工作项');
      const code = get(cols, '任务项编号');
      const title = get(cols, '任务项名称');
      if (!workName && !title) continue;   // 空行跳过，不计入 skipped
      const work = DB.works.find(w => !w.deleted_at && w.name === workName) ||
                   DB.works.find(w => !w.deleted_at && w.code === padCode(workName));
      if (!work) { skipped++; continue; }
      const owner = get(cols, '任务项牵头人');
      const assignees = splitMulti(get(cols, '任务项参与人'));

      let task = mode === 'merge' && code ? DB.tasks.find(t => !t.deleted_at && t.code === code) : null;
      if (task) {
        task.work = work.id;
        if (title) task.title = title;
        if (owner) task.owner = owner;
        if (assignees.length) task.assignees = assignees;
        stampMeta(task);
        // 覆盖模式：这条任务原有的里程碑整体清空重建，跟宽表这一行的内容对齐
        DB.milestones.filter(m => m.task === task.id && !m.deleted_at).forEach(m => softDelete('milestone', m.id));
      } else {
        task = blank('task', { work: work.id, title: title || '未命名任务', owner, assignees, status: 'todo', priority: '2', progress: 0 });
        task.code = (code && mode === 'merge') ? code : nextTaskCode(work.id);
        stampMeta(task);
        DB.tasks.push(task);
      }
      taskN++;

      for (let g = 1; g <= WIDE_MS_GROUPS; g++) {
        const [hDate, hDeliv, hReport] = wideMsHeaders(g);
        const rawDate = get(cols, hDate), deliv = get(cols, hDeliv), rawReport = get(cols, hReport);
        if (!rawDate && !deliv) continue;
        const planDate = parseCSVDate(rawDate);
        if (rawDate && !planDate) badDate++;   // 有填日期但识别不出来，留空好过存一个格式错误的字符串
        const m = blank('milestone', {
          task: task.id, plan_date: planDate, deliverable: deliv,
          report_level: reportLevelFromLabel(rawReport), done: '0', actual_date: '',
        });
        stampMeta(m);
        DB.milestones.push(m);
        msN++;
      }
      recalcProgress(task);
    }
  });
  return { taskN, msN, skipped, badDate };
}

/* 可重现的伪随机：每次生成的测试数据一致，便于比对与复现问题 */
function makeRng(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}
const TASK_TPL = [
  ['编制{n}初稿', '初稿文档'], ['{n}内部评审', '评审纪要'], ['{n}数据收集与整理', '数据台账'],
  ['{n}材料报送', '报送回执'], ['{n}方案定稿与发布', '正式文本'], ['{n}进度跟踪与督办', '跟踪表'],
  ['{n}季度汇报', '汇报材料'], ['与相关部门沟通{n}事项', '会议纪要'], ['{n}问题整改', '整改清单'],
  ['{n}年度总结', '总结报告'],
];

function seedAll() {
  const year = DB.settings.year || new Date().getFullYear();
  DB.duties = SEED_DUTIES.map(([code, category, name]) => stampMeta(blank('duty', { code, category, name })));
  DB.works = SEED_WORKS.map(([code, duty, name, content, owner, collaborators]) =>
    stampMeta(blank('work', { code, duty, name, content, owner, collaborators, year, status: 'doing' })));
  DB.milestones = [];
  DB.tasks = [];
  rebuildIndex();

  const rng = makeRng(20260720);
  const pick = a => a[Math.floor(rng() * a.length)];
  const people = uniq(SEED_WORKS.flatMap(w => [w[4], ...w[5]]));
  const DELIVS = ['初稿文档', '评审纪要', '数据台账', '报送回执', '正式文本', '跟踪表', '汇报材料', '会议纪要'];

  // 任务：每项工作 4–7 条，覆盖各种状态与日期边界；里程碑挂在任务下，约一半任务各配 1–3 个
  DB.works.forEach(w => {
    const n = 4 + Math.floor(rng() * 4);
    const short = w.name.length > 12 ? w.name.slice(0, 10) + '…' : w.name;
    for (let i = 0; i < n; i++) {
      const tpl = TASK_TPL[Math.floor(rng() * TASK_TPL.length)];
      const r = rng();
      let status, plan, actual = '', progress = 0;
      if (r < 0.30)      { status = 'done';  plan = offsetDate(-150 + Math.floor(rng() * 150)); actual = plan; progress = 100; }
      else if (r < 0.48) { status = 'doing'; plan = offsetDate(2 + Math.floor(rng() * 40));   progress = 10 + Math.floor(rng() * 80); }
      else if (r < 0.62) { status = 'doing'; plan = offsetDate(-25 + Math.floor(rng() * 20)); progress = 20 + Math.floor(rng() * 50); } // 含逾期
      else if (r < 0.72) { status = 'hold';  plan = offsetDate(-20 + Math.floor(rng() * 60)); }
      else if (r < 0.80) { status = 'todo';  plan = ''; }                                        // 无计划日期
      else               { status = 'todo';  plan = offsetDate(Math.floor(rng() * 60)); }
      if (rng() > 0.88 && status !== 'done') plan = todayStr();                                   // 今日到期

      const others = people.filter(p => p !== w.owner);
      const assignees = rng() > 0.45 ? [pick(others)] : (rng() > 0.6 ? [pick(others), pick(others)] : []);
      // 创建时间铺开到过去 ~6 个月，让「按时间」的月度趋势图有真实形状
      const createdAt = new Date(Date.now() - Math.floor(rng() * 190) * 86400000).toISOString();
      const t = stampMeta(blank('task', {
        created_at: createdAt,
        work: w.id,
        code: nextTaskCode(w.id),
        title: tpl[0].replace('{n}', short),
        owner: rng() > 0.25 ? w.owner : pick(people),
        assignees: uniq(assignees),
        status, priority: String(1 + Math.floor(rng() * 3)),
        plan_date: plan, actual_date: actual, progress,
        source: pick(['领导交办', '例行工作', '监管要求', '内部发起', '']),
        custom: '测试',
      }));
      DB.tasks.push(t);

      if (rng() > 0.5) {                                 // 约一半任务挂里程碑，进度随之改为自动计算
        const n2 = 1 + Math.floor(rng() * 3);
        const delivs = uniq([tpl[1], pick(DELIVS), pick(DELIVS)]).filter(Boolean);
        for (let k = 0; k < n2; k++) {
          const off = -60 + Math.floor(rng() * 150);
          const cpPlan = offsetDate(off);
          const cpDone = status === 'done' || (off < 0 && rng() > 0.4);
          DB.milestones.push(stampMeta(blank('milestone', {
            task: t.id, plan_date: cpPlan,
            deliverable: delivs[k % delivs.length] || '交付物',
            done: cpDone ? '1' : '0',
            actual_date: cpDone ? cpPlan : '',
          })));
        }
        recalcProgress(t);
      }
    }
  });

  // 顺手造一批变更日志，让「最近动态」一开始就有内容可看（种子任务本身是直接写入的，不走会记日志的编辑路径）
  const logTasks = DB.tasks.filter(t => !t.deleted_at);
  for (let i = 0; i < 12 && logTasks.length; i++) {
    const t = pick(logTasks);
    const at = new Date(Date.now() - (i * 3 + Math.floor(rng() * 5)) * 3600000).toISOString();
    const kind = rng();
    let summary;
    if (kind < 0.25) summary = '状态：未开始→进行中';
    else if (kind < 0.45) summary = '状态：进行中→已完成';
    else if (kind < 0.65) summary = `计划完成：${offsetDate(-5)}→${offsetDate(3)}`;
    else if (kind < 0.85) summary = `完成了里程碑交付「${pick(DELIVS)}」`;
    else summary = '新建了任务';
    DB.changelog.push({ id: uid('log'), at, by: pick(people), taskId: t.id, summary });
  }
  DB.changelog.sort((a, b) => a.at.localeCompare(b.at));
  rebuildIndex();
}

/* =============================================================
   27. 启动
   ============================================================= */
async function boot() {
  const saved = await Repo.load();
  if (saved && saved.duties) {
    DB = Object.assign(DB, saved);
    DB.settings = Object.assign({ me: '', role: 'manager', year: new Date().getFullYear() }, saved.settings || {});
    ['duty', 'work', 'milestone', 'task'].forEach(e => coll(e).forEach(r => normalize(e, r)));
    rebuildIndex();   // migrateWorkIds/migrateTaskCodes 内部用 byId 查找，必须先有索引才能查到，否则全部落空
    const migrated = migrateWorkIds();
    if (migrated) rebuildIndex();   // 工作 id 变了，重建索引后 migrateTaskCodes 才能按新 id 查到工作
    const migratedMs = migrateMilestonesToTasks();
    const migratedCodes = migrateTaskCodes();
    const migratedPerm = migrateViewDataDefault();
    if (migratedMs || migratedCodes || migrated || migratedPerm) await Repo.persist(DB);
    rebuildIndex();
    restoreUI();
  } else {
    seedAll();
    await Repo.persist(DB);
  }
  if (await tryReconnectSharedFile()) await Repo.persist(DB);   // 接回上次连接的共享文件，顺带合并一次
  await ensureIdentity();   // 没有有效身份就在这里挂住，等选完/建完账号再往下走
  const p = (location.hash || '').replace(/^#\//, '');
  currentPage = PAGES.some(x => x.key === p) ? p : 'dashboard';
  goto(currentPage);

  // 备份提醒：数据只在本机浏览器，超过 7 天未备份且期间有改动就提示一次
  const bk = backupState();
  if (bk.stale && (bk.days === null || bk.days >= 7) && DB.tasks.length) {
    setTimeout(() => showSnack(bk.last
      ? `已 ${bk.days} 天未备份，且期间有改动 — 建议到「数据」页导出`
      : '数据仅存于本机浏览器，建议到「数据」页导出一份备份'), 1200);
  }
}
boot();
