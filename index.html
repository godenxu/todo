    <span class="toggle-view" data-act="chart-view" data-id="${id}">${isTable ? '看图表' : '看数据表'}</span></span></div>`;
}
/* ★ "看数据表"切换后内容溢出模块区域的根因，以及两版修法 ★
   .dtable 以前所有单元格都是 white-space:nowrap（数字列不想被换行拆断）。以前这张表
   总是铺在整页宽的面板里，nowrap 撑不出页面宽度，问题被掩盖了。报告页/图表页现在有些
   面板会挤在一行三四个并排的窄列里（.rep-col），来源/标签这类自由文本一长，nowrap 就把
   表格撑得比所在列宽，正好溢出到旁边的模块上——不是这几个模块本身的样式错了，
   是"看数据表"这条通用路径以前从没在窄列场景下测过。
   第一版修法是包一层 overflow-x:auto，让宽出来的部分自己横向滚动——不溢出了，但用户
   反馈不想要滚动条，希望列宽本身就适配窄容器。改成：.dtable 第一列（名称/标签这类自由
   文本）解除 nowrap 允许换行，配上 table-layout:fixed（列宽按表格声明宽度分配，不再
   按内容撑），窄容器里文本一长就自动换行撑高这一行，而不是把整张表撑宽。
   这层 overflow-x:auto 保留作为兜底：真遇到列数特别多（比如 personBars 那种 9 列表）、
   换行也救不回来的极端情况，还能横向滚动而不是把布局挤坏，但常规场景不会再触发它。 */
function dataTable(headers, rows) {
  return `<div style="overflow-x:auto"><table class="dtable"><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function chartWidth(fallback) {
  const el = $('#page-charts');
  const w = el ? el.clientWidth : 0;
  return Math.max(360, (w || fallback || 900) - 66);
}

/* ---------- 折线图（月度趋势） ---------- */
function lineChart(data, w, ariaLabel, keys) {
  const { aKey = 'added', bKey = 'done', aLabel = '新增', bLabel = '完成' } = keys || {};
  // bKey 传 null 表示只画一条线（比如"待办总量趋势"这种单指标图）
  const single = !bKey;
  const h = 210, padL = 34, padR = 12, padT = 12, padB = 26;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...data.map(d => single ? d[aKey] : Math.max(d[aKey], d[bKey])));
  const niceMax = Math.ceil(maxV / 5) * 5 || 5;
  const x = i => padL + (data.length === 1 ? iw / 2 : i / (data.length - 1) * iw);
  const y = v => padT + ih - v / niceMax * ih;
  const path = key => data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).join(' ');

  let g = '';
  for (let i = 0; i <= 5; i++) {
    const v = niceMax / 5 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  // 哪些点连坐标轴上的时间标签都一起标——data.length<=12 全标，再多就跟 xlab 一样隔一个标一个，
  // 免得点数一多（比如按天的粒度）挤成一团看不清
  const showAt = i => data.length <= 12 || i % 2 === 0;
  const xlab = data.map((d, i) =>
    showAt(i) ? `<text class="ax-text" x="${x(i)}" y="${h - 8}" text-anchor="middle">${esc(d.label)}</text>` : '').join('');
  // 单指标图（待办总量趋势这种）在标了时间的那些点上方顺带标出数值，不用光靠悬浮提示才看得到数字；
  // 双指标图两条线容易在标签处叠在一起，暂不加，等真有双指标场景用到这个函数再说
  const valLab = single ? data.map((d, i) => showAt(i)
    ? `<text class="ax-text val" x="${x(i).toFixed(1)}" y="${(y(d[aKey]) - 8).toFixed(1)}" text-anchor="middle">${d[aKey]}</text>` : '').join('') : '';
  // 圆点 = 第一条线，方块 = 第二条线（二次编码，蓝绿在蓝黄色盲下接近）
  const mkA = data.map((d, i) => `<circle class="mk mk-new" cx="${x(i).toFixed(1)}" cy="${y(d[aKey]).toFixed(1)}" r="3.5"><title>${esc(d.label)} ${esc(aLabel)} ${d[aKey]}</title></circle>`).join('');
  const mkB = single ? '' : data.map((d, i) => `<rect class="mk mk-done" x="${(x(i) - 3.5).toFixed(1)}" y="${(y(d[bKey]) - 3.5).toFixed(1)}" width="7" height="7"><title>${esc(d.label)} ${esc(bLabel)} ${d[bKey]}</title></rect>`).join('');
  const hit = data.map((d, i) => `<rect x="${(x(i) - iw / data.length / 2).toFixed(1)}" y="${padT}" width="${(iw / data.length).toFixed(1)}" height="${ih}" fill="transparent"
      data-tip="${esc(d.label)}|${d[aKey]}|${single ? '' : d[bKey]}" data-cx="${x(i).toFixed(1)}"/>`).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(ariaLabel || '月度新增与完成任务数趋势')}">
    ${g}
    <line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>
    ${xlab}
    <path class="ln ln-new" d="${path(aKey)}"/>
    ${single ? '' : `<path class="ln ln-done" d="${path(bKey)}"/>`}
    ${mkA}${mkB}${valLab}
    <line class="crosshair" id="ch-line" x1="0" y1="${padT}" x2="0" y2="${padT + ih}" style="display:none"/>
    <g id="ch-hits">${hit}</g>
  </svg>`;
}

/* ---------- 柱状图（到期分布） ---------- */
function barChart(buckets, w) {
  const h = 190, padL = 30, padR = 10, padT = 12, padB = 40;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...buckets.map(b => b.n));
  const niceMax = Math.ceil(maxV / 4) * 4 || 4;
  const bw = iw / buckets.length;
  const y = v => padT + ih - v / niceMax * ih;

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax / 4 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const bars = buckets.map((b, i) => {
    const bx = padL + i * bw + bw * 0.18, bwid = bw * 0.64;
    const bh = Math.max(b.n ? 2 : 0, ih - (y(b.n) - padT));
    return `<g><rect class="${b.cls}" x="${bx.toFixed(1)}" y="${(padT + ih - bh).toFixed(1)}" width="${bwid.toFixed(1)}" height="${bh.toFixed(1)}" rx="3">
        <title>${esc(b.label)}：${b.n} 条</title></rect>
      ${b.n ? `<text class="ax-text val" x="${(bx + bwid / 2).toFixed(1)}" y="${(padT + ih - bh - 4).toFixed(1)}" text-anchor="middle">${b.n}</text>` : ''}
      <text class="ax-text" x="${(bx + bwid / 2).toFixed(1)}" y="${h - 22}" text-anchor="middle">${esc(b.label)}</text></g>`;
  }).join('');

  /* ★ 这里以前用 viewBox + CSS 宽度 100% 把整张图拉伸去填满容器（治右侧留白），
     副作用是坐标轴刻度、柱子上方的数字会跟着整张图一起放大/缩小——这张图常常被
     "估" 得比真实容器窄（跟饼图并排在 flex-grow 容器里，真实宽度要等浏览器排完版
     才知道），拉伸倍数一高，字号看着就比旁边模块明显大一圈，跟全站字号不一致了。
     改成 fitFlexBarChart()（见下面）：先按估算宽度正常画一版（不做任何缩放，
     字号永远是声明的那个真实像素值），插入 DOM 之后再量一下这一列的真实宽度，
     差得多就照真实宽度重新调用这个函数画一遍换上去——图不留白，字也不变形。 */
  return `<svg width="${w}" height="${h}" role="img" aria-label="未完成任务的到期分布">
    ${g}<line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>${bars}</svg>`;
}
/* 图表跟别的东西并排（或者独占一行但容器宽度是靠 flex 撑出来）的时候用这个：先用估算宽度
   画的那版可能跟真实 flex-grow 出来的宽度对不上（留白，或者更麻烦的——裁切/出现横向滚动条），
   插入 DOM 之后调这个函数量一次真的宽度，差距明显就照实际宽度重画、换掉——柱子/折线和文字
   全程都是 1:1 真实像素，不需要靠 CSS 拉伸凑数，字号自然跟页面其它地方保持一致。
   容器如果还没量到宽度（比如 display:none 或者压根没插进 DOM）就什么也不做，
   保留原来那版"猜的"，好歹不是空白。
   redraw(actualW) 由调用方传入——不同图表类型（barChart/lineChart/groupedBarChart）画法不同，
   这个函数只管"要不要重画"和"重画完了拿什么换掉"，不关心具体怎么画。 */
function fitFlexChart(wrapEl, redraw) {
  if (!wrapEl) return;
  const svg = wrapEl.querySelector('svg');
  if (!svg) return;
  const actualW = Math.round(wrapEl.getBoundingClientRect().width);
  const declaredW = Number(svg.getAttribute('width')) || 0;
  if (!actualW || Math.abs(actualW - declaredW) < 6) return;   // 差得不多，不折腾
  wrapEl.innerHTML = redraw(actualW);
}
function fitFlexBarChart(wrapEl, buckets) { fitFlexChart(wrapEl, w => barChart(buckets, w)); }
/* 分组柱状图：每个类别并排两根柱子，用来对比两个系列（比如按月计划完成的任务数 vs 里程碑数） */
function groupedBarChart(data, w, keys) {
  const { aKey = 'a', bKey = 'b', aLabel = 'A', bLabel = 'B', aCls = 'bar-norm', bCls = 'bar-done', ariaLabel = '' } = keys || {};
  const h = 190, padL = 30, padR = 10, padT = 12, padB = 40;
  const iw = w - padL - padR, ih = h - padT - padB;
  const maxV = Math.max(1, ...data.map(d => Math.max(d[aKey], d[bKey])));
  const niceMax = Math.ceil(maxV / 4) * 4 || 4;
  const bw = iw / data.length;
  const y = v => padT + ih - v / niceMax * ih;

  let g = '';
  for (let i = 0; i <= 4; i++) {
    const v = niceMax / 4 * i;
    g += `<line class="ax-grid" x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}"/>
          <text class="ax-text" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  const groupW = bw * 0.72, barW = groupW / 2 - 2;
  const bars = data.map((d, i) => {
    const gx = padL + i * bw + (bw - groupW) / 2;
    const aH = Math.max(d[aKey] ? 2 : 0, ih - (y(d[aKey]) - padT));
    const bH = Math.max(d[bKey] ? 2 : 0, ih - (y(d[bKey]) - padT));
    const bx = gx + barW + 4;
    const lbl = (data.length <= 12 || i % 2 === 0)
      ? `<text class="ax-text" x="${(gx + groupW / 2).toFixed(1)}" y="${h - 22}" text-anchor="middle">${esc(d.label)}</text>` : '';
    return `<g>
      <rect class="${aCls}" x="${gx.toFixed(1)}" y="${(padT + ih - aH).toFixed(1)}" width="${barW.toFixed(1)}" height="${aH.toFixed(1)}" rx="2">
        <title>${esc(d.label)} ${esc(aLabel)} ${d[aKey]}</title></rect>
      ${d[aKey] ? `<text class="ax-text val" x="${(gx + barW / 2).toFixed(1)}" y="${(padT + ih - aH - 4).toFixed(1)}" text-anchor="middle">${d[aKey]}</text>` : ''}
      <rect class="${bCls}" x="${bx.toFixed(1)}" y="${(padT + ih - bH).toFixed(1)}" width="${barW.toFixed(1)}" height="${bH.toFixed(1)}" rx="2">
        <title>${esc(d.label)} ${esc(bLabel)} ${d[bKey]}</title></rect>
      ${d[bKey] ? `<text class="ax-text val" x="${(bx + barW / 2).toFixed(1)}" y="${(padT + ih - bH - 4).toFixed(1)}" text-anchor="middle">${d[bKey]}</text>` : ''}
      ${lbl}</g>`;
  }).join('');

  return `<svg width="${w}" height="${h}" role="img" aria-label="${esc(ariaLabel || '分组柱状图')}">
    ${g}<line class="ax-line" x1="${padL}" y1="${padT + ih}" x2="${w - padR}" y2="${padT + ih}"/>${bars}</svg>`;
}
// 横向列表式条形图：标签在左（太长会自动省略号截断，完整内容看 title）、条在中间、数字在右，
// 复用 .bar-row/.track/.nm/.num 这套现成样式。barChart 那种纵向柱状图标签挤在下面，
// 类别一多、名字一长就会重叠看不清，这种情况（各职责工作数量、来源/标签分布）改用这个
// b.attrs（可选）同 pieChart，传了这一行就可点击下钻
function hBarList(buckets, max) {
  if (!buckets.length) return '<div class="empty-mini">暂无数据</div>';
  const mx = max || Math.max(1, ...buckets.map(b => b.n));
  return buckets.map(b => `<div class="bar-row${b.attrs ? ' clickable' : ''}"${b.attrs || ''} title="${esc(b.label)}：${b.n}">
    <span class="nm">${esc(b.label)}</span>
    <span class="track">${b.n > 0 ? `<span class="seg seg-doing" style="width:${b.n / mx * 100}%"></span>` : ''}</span>
    <span class="num">${b.n}</span></div>`).join('');
}

/* ---------- 饼图（占比，配合柱状/横条图的绝对量互补） ---------- */
// data: [{label, n, color, attrs}]；color 可以是十六进制或 var(--x)，统一走 style 而非 fill 属性。
// attrs（可选）是调用方拼好的 data-act 属性字符串（见 taskViewAttrs/taskFilterAttrs），
// 传了这一项就在扇区和图例上都变成可点击、能下钻——两个入口都给，是因为窄扇区在饼图上
// 很难精确点中，图例文字是更容易命中的靶子。
function pieChart(data, size, ariaLabel) {
  const list = data.filter(d => d.n > 0);
  const r = size / 2 - 3, cx = size / 2, cy = size / 2;
  const total = list.reduce((a, d) => a + d.n, 0) || 1;
  let angle = -Math.PI / 2;
  const slices = list.map(d => {
    const frac = d.n / total;
    const a0 = angle, a1 = angle + frac * Math.PI * 2;
    angle = a1;
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const mid = (a0 + a1) / 2;
    const mx = cx + r * 0.66 * Math.cos(mid), my = cy + r * 0.66 * Math.sin(mid);
    const pct = Math.round(frac * 100);
    const path = frac >= 0.999
      ? `M${cx},${(cy - r).toFixed(2)} A${r},${r} 0 1 1 ${(cx - 0.01).toFixed(2)},${(cy - r).toFixed(2)} Z`
      : `M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${large} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z`;
    return { d, path, pct, mx, my };
  });

  const paths = slices.map(s =>
    `<path d="${s.path}" style="fill:${s.d.color}"${s.d.attrs ? ` class="pie-slice-clickable${s.d.active ? ' pie-slice-active' : ''}"${s.d.attrs}` : ''}><title>${esc(s.d.label)}：${s.d.n} 条（${s.pct}%）</title></path>`).join('');
  // 占比标签直接写百分比：太窄的扇区（<6%）省略，避免文字互相重叠
  const labels = slices.filter(s => s.pct >= 6).map(s =>
    `<text class="pie-label" x="${s.mx.toFixed(1)}" y="${s.my.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${s.pct}%</text>`).join('');

  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(ariaLabel || '占比饼图')}">
    ${paths}${labels}
  </svg>`;
}
function pieLegend(data) {
  return `<div class="legend pie-legend">${data.filter(d => d.n > 0).map(d =>
    `<span${d.attrs ? ` class="clickable${d.active ? ' active' : ''}"${d.attrs}` : ''}><i style="background:${d.color}"></i>${esc(d.label)} ${d.n}</span>`).join('')}</div>`;
}

/* ---------- 按里程碑：职责→工作→任务 三级树，叶子节点（任务）才是真正的甘特时间线 ----------
   里程碑本来就是挂在任务下的，之前这里按"工作"合并展示，一个工作下所有任务的里程碑全糊在一行看不出
   是哪条任务的；现在改成跟"各职责/工作推进情况"一样能逐级展开，展开到工作再展开才看到具体任务的时间线。 */
// 按 职责 -> 工作 -> 任务 分组当前这批任务名下的里程碑（只收有计划日期的）
function msTreeGroups(tasks) {
  const msByTask = new Map();
  DB.milestones.filter(m => !m.deleted_at && m.plan_date).forEach(m => {
    if (!msByTask.has(m.task)) msByTask.set(m.task, []);
    msByTask.get(m.task).push(m);
  });
  msByTask.forEach(list => list.sort((a, b) => a.plan_date.localeCompare(b.plan_date)));
  const taskIds = new Set(tasks.map(t => t.id));
  const byDutyWork = new Map();   // dutyCode -> Map(workId -> task[])
  msByTask.forEach((ms, taskId) => {
    if (!taskIds.has(taskId)) return;
    const t = byId('task', taskId);
    if (!t) return;
    const w = byId('work', t.work);
    const dutyCode = w ? w.duty : '';
    if (!byDutyWork.has(dutyCode)) byDutyWork.set(dutyCode, new Map());
    const wm = byDutyWork.get(dutyCode);
    if (!wm.has(t.work)) wm.set(t.work, []);
    wm.get(t.work).push(t);
  });
  return { msByTask, byDutyWork };
}
function milestoneTreeHTML(tasks, dutyExpandedSet, workExpandedSet, dutyToggleAct, workToggleAct) {
  dutyToggleAct = dutyToggleAct || 'ms-duty-toggle';
  workToggleAct = workToggleAct || 'ms-work-toggle';
  const { msByTask, byDutyWork } = msTreeGroups(tasks);
  if (!byDutyWork.size) return `<div class="empty-mini">还没有里程碑。到「任务」页双击某条任务的「里程碑/交付物」列即可添加。</div>`;

  const allOffs = [...msByTask.values()].flat().map(m => daysFromToday(m.plan_date));
  // 时间轴左边界不再跟着最早的历史数据无限往前延伸：往过去最多只画到 2 个月前，
  // 再早的历史里程碑不体现在时间轴上——不然一条几年前的老里程碑会把整条轴的比例尺
  // 拉得极稀，最近这两三个月反而挤成一条线，看不清真正有用的部分。
  let lo = Math.max(Math.min(0, ...allOffs) - 5, twoMonthsAgoOffset()), hi = Math.max(...allOffs) + 5;
  if (hi - lo < 60) hi = lo + 60;
  const pct = d => ((d - lo) / (hi - lo) * 100).toFixed(2) + '%';
  const ticks = [];
  for (let d = lo; d <= hi; d++) {
    const ds = offsetDate(d);
    if (ds.endsWith('-01')) ticks.push({ d, label: (+ds.slice(5, 7)) + '月' });
  }

  // 给定一组里程碑（可能是单条任务的，也可能是折叠层级下合并了多条任务的），画出跨度条+圆点。
  // 早于时间轴左边界（2 个月前）的点直接不画——轴本来就没往那么早延伸，硬画只会全部
  // 贴在最左边挤成一坨；完成数统计（gantt-cnt 的 done/total）仍按完整列表算，不受影响。
  const ganttTrackHTML = msList => {
    const visible = msList.filter(m => daysFromToday(m.plan_date) >= lo);
    if (!visible.length) return `<span class="gantt-track" style="--today:${pct(0)}"></span>`;
    const ms = [...visible].sort((a, b) => a.plan_date.localeCompare(b.plan_date));
    const a = daysFromToday(ms[0].plan_date), b = daysFromToday(ms[ms.length - 1].plan_date);
    const pts = ms.map(m => {
      const off = daysFromToday(m.plan_date);
      const cls = m.done === '1' ? 'done' : off < 0 ? 'late' : off <= 7 ? 'soon' : 'norm';
      const state = m.done === '1' ? '已完成' : off < 0 ? `逾期 ${-off} 天` : off === 0 ? '今天' : `还有 ${off} 天`;
      // 圆点自己带 data-act，点它跳去里程碑真正所属的那条任务——不能让它冒泡吃到父行的
      // duty-drill/work-drill：折叠后的职责/工作行会把好几条任务的里程碑混画在同一条时间轴里，
      // 点的是哪个点就该去哪条任务，不是笼统地钻进它所属的工作
      return `<span class="gantt-pt ${cls}" data-act="task-detail" data-id="${esc(m.task)}" style="left:${pct(off)}" title="${esc((m.deliverable || '') + ' · ' + m.plan_date + ' · ' + state)}"></span>`;
    }).join('');
    return `<span class="gantt-track" style="--today:${pct(0)}">
      <span class="gantt-span" style="left:${pct(a)};width:${(((b - a) / (hi - lo)) * 100).toFixed(2)}%"></span>${pts}</span>`;
  };

  // 叶子节点：单条任务自己的甘特时间线，名称前带任务编号
  const taskGanttRow = t => {
    const ms = msByTask.get(t.id);
    const done = ms.filter(m => m.done === '1').length;
    const label = `${t.code ? t.code + ' ' : ''}${t.title}`;
    return `<div class="gantt-row gantt-row-task" data-act="task-detail" data-id="${esc(t.id)}">
      <span class="sb-caret"></span>
      <span class="gantt-name" title="${esc(label)}">${esc(label)}</span>
      ${ganttTrackHTML(ms)}
      <span class="gantt-cnt">${done}/${ms.length}</span></div>`;
  };

  const dutyRows = [...byDutyWork.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([dutyCode, workMap]) => {
    const duty = byId('duty', dutyCode);
    const dutyName = duty ? `${duty.code} ${duty.name}` : '未归属职责';
    const tasksUnderDuty = [...workMap.values()].flat();
    const msUnderDuty = tasksUnderDuty.flatMap(t => msByTask.get(t.id));
    const totalMs = msUnderDuty.length;
    const doneMs = msUnderDuty.filter(m => m.done === '1').length;
    const dOpen = dutyExpandedSet.has(dutyCode);
    const caret = `<span class="sb-caret" data-act="${dutyToggleAct}" data-code="${esc(dutyCode)}">${dOpen ? '▾' : '▸'}</span>`;

    // 职责折叠时，这一行自己聚合展示其下所有工作/任务的里程碑甘特点；展开后交给下面的工作行各自展示
    if (!dOpen) {
      return `<div class="gantt-row gantt-row-duty" data-act="duty-drill" data-code="${esc(dutyCode)}">${caret}
        <span class="gantt-name" title="${esc(dutyName)}">${esc(dutyName)}</span>
        ${ganttTrackHTML(msUnderDuty)}
        <span class="gantt-cnt">${doneMs}/${totalMs}</span></div>`;
    }
    const headerRow = `<div class="gantt-row gantt-row-duty" data-act="duty-drill" data-code="${esc(dutyCode)}">${caret}
      <span class="gantt-name" title="${esc(dutyName)}">${esc(dutyName)}</span>
      <span class="gantt-track" style="--today:${pct(0)}"></span>
      <span class="gantt-cnt">${doneMs}/${totalMs}</span></div>`;

    const workRows = [...workMap.entries()].sort((wa, wb) => {
      const a = byId('work', wa[0]), b = byId('work', wb[0]);
      return ((a && a.code) || '').localeCompare((b && b.code) || '');
    }).map(([workId, taskList]) => {
      const w = byId('work', workId);
      const wName = w ? `${w.code} ${w.name}` : '未归属工作';
      const wOpen = workExpandedSet.has(workId);
      const msUnderWork = taskList.flatMap(t => msByTask.get(t.id));
      const wTotalMs = msUnderWork.length;
      const wDoneMs = msUnderWork.filter(m => m.done === '1').length;
      const wCaret = `<span class="sb-caret" data-act="${workToggleAct}" data-id="${esc(workId)}">${wOpen ? '▾' : '▸'}</span>`;

      // 工作折叠时，这一行自己聚合展示其下所有任务的里程碑甘特点；展开后交给各条任务行自己展示
      if (!wOpen) {
        return `<div class="gantt-row gantt-row-work" data-act="work-drill" data-id="${esc(workId)}">${wCaret}
          <span class="gantt-name" title="${esc(wName)}">${esc(wName)}</span>
          ${ganttTrackHTML(msUnderWork)}
          <span class="gantt-cnt">${wDoneMs}/${wTotalMs}</span></div>`;
      }
      const wHeaderRow = `<div class="gantt-row gantt-row-work" data-act="work-drill" data-id="${esc(workId)}">${wCaret}
        <span class="gantt-name" title="${esc(wName)}">${esc(wName)}</span>
        <span class="gantt-track" style="--today:${pct(0)}"></span>
        <span class="gantt-cnt">${wDoneMs}/${wTotalMs}</span></div>`;
      const taskRows = taskList.sort((a, b) => (a.code || '').localeCompare(b.code || '')).map(taskGanttRow).join('');
      return wHeaderRow + taskRows;
    }).join('');

    return headerRow + workRows;
  }).join('');

  return `<div class="tl">
    <div class="tl-axis"><span class="gantt-name" style="font-size:10px;color:var(--text3)">职责 / 工作 / 任务</span>
      <span class="tl-ticks">${ticks.map(t => `<span class="tk" style="left:${pct(t.d)}">${esc(t.label)}</span>`).join('')}</span>
      <span class="gantt-cnt" style="font-size:10px">完成</span></div>
    ${dutyRows}
    <div class="legend">
      <span><i style="background:var(--c-late)"></i>逾期</span>
      <span><i style="background:var(--c-soon)"></i>7天内</span>
      <span><i style="background:var(--c-doing)"></i>后续</span>
      <span><i style="background:var(--c-done)"></i>已完成</span>
      <span style="color:var(--accent)">│ 竖线为今天</span></div></div>`;
}
// 甘特图的「看数据表」备选视图：按工作展开其下所有任务的里程碑，表头可点击排序（默认按里程碑计划日期）
const GANTT_TABLE_COLS = [
  { key: 'work', label: '工作' },
  { key: 'task', label: '任务' },
  { key: 'deliverable', label: '交付物' },
  { key: 'plan_date', label: '计划日期' },
  { key: 'doneLabel', label: '状态' },
];
let ganttSort = { key: 'plan_date', dir: 1 };
function ganttTableRows() {
  return visibleWorks().flatMap(w => {
    const taskIds = new Set(DB.tasks.filter(t => t.work === w.id && !t.deleted_at).map(t => t.id));
    return DB.milestones.filter(m => taskIds.has(m.task) && !m.deleted_at && m.plan_date).map(m => ({
      work: w.code + ' ' + w.name,
      task: (byId('task', m.task) || {}).title || '',
      deliverable: m.deliverable || '',
      plan_date: m.plan_date,
      doneLabel: m.done === '1' ? '已完成' : '未完成',
    }));
  });
}
function ganttDataTable() {
  const rows = ganttTableRows();
  if (!rows.length) return '<div class="empty-mini">还没有里程碑。到「任务」页双击某条任务的「里程碑/交付物」列即可添加。</div>';
  const { key, dir } = ganttSort;
  rows.sort((a, b) => (a[key] < b[key] ? -dir : a[key] > b[key] ? dir : 0));
  const head = GANTT_TABLE_COLS.map(c => {
    const on = key === c.key;
    return `<th class="sortable" data-act="gantt-sort" data-key="${c.key}">${esc(c.label)}${on ? (dir === 1 ? ' ▲' : ' ▼') : ''}</th>`;
  }).join('');
  const body = rows.map(r => `<tr>${GANTT_TABLE_COLS.map(c => `<td>${esc(r[c.key])}</td>`).join('')}</tr>`).join('');
  return `<table class="dtable"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------- 页面 ---------- */
function renderCharts() {
  const tasks = visibleTasks().filter(t => !t.deleted_at);
  const w = chartWidth();
  const tabs = `<div class="chart-tabs">${CHART_TABS.map(t =>
    `<span class="t${chartTab === t.key ? ' on' : ''}" data-act="chart-tab" data-k="${t.key}">${esc(t.label)}</span>`).join('')}</div>`;
  let body = '';

  if (chartTab === 'person') {
    const st = statsByPerson(tasks);
    const max = Math.max(1, ...st.map(s => s.total));
    // 状态条和牵头/参与条现在合并进同一个 .bar-row（而不是分左右两栏），这样鼠标悬浮的高亮
    // 天然会盖住整行，也不需要再操心两栏行高是否对得上
    const personRow = s => {
      const p = n => (n / max * 100).toFixed(2) + '%';
      const todoN = (s.todo || 0) + (s.hold || 0);
      const statusSegs = [
        s.done > 0 ? `<span class="seg seg-done" style="width:${p(s.done)}"></span>` : '',
        s.doing > 0 ? `<span class="seg seg-doing" style="width:${p(s.doing)}"></span>` : '',
        s.late > 0 ? `<span class="seg seg-late" style="width:${p(s.late)}"></span>` : '',
        todoN > 0 ? `<span class="seg seg-todo" style="width:${p(todoN)}"></span>` : '',
      ].join('');
      const denom = Math.max(1, s.lead + s.join);
      const rp = n => (n / denom * 100).toFixed(2) + '%';
      const roleSegs = [
        s.lead > 0 ? `<span class="seg seg-lead" style="width:${rp(s.lead)}"></span>` : '',
        s.join > 0 ? `<span class="seg seg-join" style="width:${rp(s.join)}"></span>` : '',
      ].join('');
      const tip = `${s.name}：共 ${s.total} 条 · 已完成 ${s.done} · 进行中 ${s.doing} · 逾期 ${s.late} · 未开始 ${s.todo}` +
        `${s.hold ? ' · 挂起 ' + s.hold : ''} · 牵头 ${s.lead} · 参与 ${s.join}`;
      const person = s.name === '（未指派）' ? '__empty__' : s.name;
      return `<div class="bar-row bar-row-person clickable" data-act="filter-person" data-person="${esc(person)}" title="${esc(tip)}">
        <span class="nm">${esc(s.name)}</span>
        <span class="track">${statusSegs}</span>
        <span class="num">${s.done}/${s.total} · ${s.rate}%</span>
        <span class="track track-role">${roleSegs}</span>
        <span class="num num-role">${s.lead} / ${s.join}</span></div>`;
    };
    const personLegend = `<div class="legend">
      <span><i style="background:var(--c-done)"></i>已完成</span>
      <span><i style="background:var(--c-doing)"></i>进行中</span>
      <span><i style="background:var(--c-late)"></i>逾期</span>
      <span><i style="background:var(--c-todo)"></i>未开始/挂起</span>
      <span style="margin-left:14px"><i style="background:#6a4c93"></i>牵头</span>
      <span><i style="background:#c9a227"></i>参与</span></div>`;
    body = `<div class="panel">
      ${panelHead('▥ 各人相关任务量与完成率（仅指任务数，不代表工作量）', 'person', '按姓名拼音排序 · 点击下钻')}
      <div class="panel-b">${chartTableView.person
        ? dataTable(['姓名', '相关合计', '已完成', '进行中', '逾期', '未开始', '完成率', '牵头', '参与'],
            st.map(s => [s.name, s.total, s.done, s.doing, s.late, s.todo + s.hold, s.rate + '%', s.lead, s.join]))
        : (st.length ? `${st.map(personRow).join('')}${personLegend}` : '<div class="empty-mini">暂无数据</div>')}
        <div class="chart-note">条长表示该人牵头或参与的任务总量（同一条任务只算一次，同一标尺可横向比较），
        才能反映一个人到底跟多少任务相关，而不是只看他牵头了多少条；中间为「已完成/合计 · 完成率」。
        最右边是该人牵头/参与任务数的比例条，看这个人以牵头为主还是以参与为主。</div></div></div>`;

  } else if (chartTab === 'category') {
    const cat = statsByCategory(tasks), duty = statsByDuty(tasks);
    const maxC = Math.max(1, ...cat.map(s => s.total));
    const maxD = Math.max(1, ...duty.map(s => s.total));
    const catPie = cat.map(c => ({ label: c.name, n: c.total, color: c.color }));
    // 分类色安全上限约 7-8 种（超过这个数，色盲/普通视觉都开始分不清相邻色块）。
    // 15 项职责按任务量取前 6 名各给一个独立验证过的分类色，其余合并成一块「其他」灰色，而不是硬凑 15 种颜色。
    const dutySorted = [...duty].sort((a, b) => b.total - a.total);
    const DUTY_PIE_COLORS = ['#2a78d6', '#008300', '#e87ba4', '#eda100', '#1baf7a', '#eb6834'];
    const dutyTop = dutySorted.slice(0, 6);
    const dutyRest = dutySorted.slice(6);
    const dutyRestTotal = dutyRest.reduce((a, d) => a + d.total, 0);
    const dutyPie = dutyTop.map((d, i) => ({ label: d.name, n: d.total, color: DUTY_PIE_COLORS[i] }));
    if (dutyRestTotal > 0) dutyPie.push({ label: `其他 ${dutyRest.length} 项职责`, n: dutyRestTotal, color: '#a8a49c' });
    body = `<div class="panel">
      ${panelHead('▤ 职责类别', 'cat')}
      <div class="panel-b">${chartTableView.cat
        ? dataTable(['类别', '合计', '已完成', '进行中', '逾期', '未开始', '完成率'],
            cat.map(s => [s.name, s.total, s.done, s.doing, s.late, s.todo + s.hold, s.rate + '%']))
        : (cat.length ? `<div class="chart-flex">
             <div class="chart-flex-bars">${cat.map(s => hBar(s.name, s, maxC)).join('')}${statusLegend}</div>
             <div class="chart-flex-pie">${pieChart(catPie, 140, '四大类别任务占比')}${pieLegend(catPie)}</div>
           </div>` : '<div class="empty-mini">暂无数据</div>')}
        <div class="chart-note">右侧饼图是四大类别的任务量占比，与左侧横条互补（横条看绝对量与完成情况，饼图看占比）。</div></div></div>
      <div class="panel">
      ${panelHead('▤ 职责项', 'duty', '点击下钻到工作')}
      <div class="panel-b">${chartTableView.duty
        ? dataTable(['职责', '合计', '已完成', '进行中', '逾期', '未开始', '完成率'],
            duty.map(s => [s.name, s.total, s.done, s.doing, s.late, s.todo + s.hold, s.rate + '%']))
        : (duty.length ? `<div class="chart-flex">
             <div class="chart-flex-bars">${duty.map(s => hBar(s.name, s, maxD, ` data-act="duty-drill" data-code="${esc(s.code)}"`)).join('')}${statusLegend}</div>
             <div class="chart-flex-pie">${pieChart(dutyPie, 140, '职责项任务占比（前6名+其他）')}${pieLegend(dutyPie)}</div>
           </div>` : '<div class="empty-mini">暂无数据</div>')}
        <div class="chart-note">只显示已有任务的职责。条长用同一标尺，可直接横向比较任务量。饼图取任务量前 6 名职责各给独立颜色，其余合并为「其他」（分类色一旦超过 7-8 种，色盲和普通视觉都会开始分不清相邻色块，15 种独立色不满足这个前提）。</div></div></div>`;

  } else if (chartTab === 'task') {
    // 不分人、不分职责，把当前所有任务项本身的各种状态依次汇总展现
    const overall = tally(tasks);
    const overallPie = [
      { label: '已完成', n: overall.done, color: 'var(--c-done)' },
      { label: '进行中', n: overall.doing, color: 'var(--c-doing)' },
      { label: '逾期', n: overall.late, color: 'var(--c-late)' },
      { label: '未开始/挂起', n: overall.todo + overall.hold, color: 'var(--c-todo)' },
    ];
    const spi = computeSPI(tasks);
    const dueB = dueBuckets(tasks);
    const priPie = PRIORITIES.map(p => ({ label: p.label, n: tasks.filter(t => t.priority === p.v).length, color: p.color }));
    const sourceBars = taskFieldBars('source', tasks);
    const tagBars = taskFieldBars('custom', tasks);
    body = `<div class="panel">
      ${panelHead('▤ 任务状态总览', 'taskOverall')}
      <div class="panel-b">${chartTableView.taskOverall
        ? dataTable(['状态', '数量'], overallPie.map(s => [s.label, s.n]))
        : (overall.total ? `<div class="chart-flex">
             <div class="chart-flex-pie" style="margin:0">${pieChart(overallPie, 140, '全部任务状态占比')}${pieLegend(overallPie)}</div>
             <div class="cards" style="flex:1;min-width:160px;margin-bottom:0">${statCard('SPI', spi === null ? '—' : spi.toFixed(2), spi === null ? '' : (spi >= 1 ? 'ok' : 'warn'))}</div>
           </div>` : '<div class="empty-mini">暂无数据</div>')}
        <div class="chart-note">当前筛选下的全部任务，不分人也不分职责；SPI = 实际进度 ÷ 计划进度（按创建时间到计划完成时间之间"今天应该走到哪"估算），是围绕 1 的比值，不是百分比——大于 1 说明整体比计划快，小于 1 说明落后于计划；没有计划完成时间的任务不参与这项统计。</div></div></div>
      <div class="panel">
      ${panelHead('▤ 计划完成时间分布', 'taskDue')}
      <div class="panel-b">${chartTableView.taskDue
        ? dataTable(['区间', '任务数'], dueB.map(b => [b.label, b.n]))
        : barChart(dueB, w)}
        <div class="chart-note">仅统计未完成任务（未开始/进行中），按计划完成时间落在哪个区间分组；已挂起不计入逾期。</div></div></div>
      <div class="rep-row">
        <div class="panel rep-col">${panelHead('▤ 优先级分布', 'taskPri')}
          <div class="panel-b">${chartTableView.taskPri
            ? dataTable(['优先级', '数量'], priPie.map(s => [s.label, s.n]))
            : `<div class="chart-flex-pie" style="margin:0 auto">${pieChart(priPie, 110, '优先级占比')}${pieLegend(priPie)}</div>`}</div></div>
        <div class="panel rep-col">${panelHead('▤ 任务来源分布', 'taskSource')}
          <div class="panel-b">${chartTableView.taskSource
            ? dataTable(['来源', '数量'], sourceBars.map(b => [b.label, b.n]))
            : hBarList(sourceBars)}
            <div class="chart-note">自由填写字段，取值不固定，用横向列表避免文字挤在一起。</div></div></div>
        <div class="panel rep-col">${panelHead('▤ 任务标签分布', 'taskTag')}
          <div class="panel-b">${chartTableView.taskTag
            ? dataTable(['标签', '数量'], tagBars.map(b => [b.label, b.n]))
            : hBarList(tagBars)}
            <div class="chart-note">自由填写字段，取值不固定，用横向列表避免文字挤在一起。</div></div></div>
      </div>`;

  } else if (chartTab === 'work') {
    // 数的是工作项本身（状态、年度、所属职责），不是工作下面挂了多少任务
    const works = visibleWorks();
    const workPie = WORK_STATUS.map(s => ({ label: s.label, n: works.filter(x => x.status === s.v).length, color: s.color }));
    const spi = computeSPI(tasks);
    const yearBars = worksByYear();
    const dutyBars = worksByDutyCount();
    const dutyStatNow = statsByDuty(tasks).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
    const workStatNow = statsByWork(tasks);
    const dutyRowsNow = dutyTreeRowsHTML(dutyStatNow, workStatNow, chartDutyExpanded, 'chart-duty-toggle');
    body = `<div class="panel">
      ${panelHead('▤ 工作总览', 'workOverall')}
      <div class="panel-b">${chartTableView.workOverall
        ? dataTable(['状态', '数量'], workPie.map(s => [s.label, s.n]))
        : (works.length ? `<div class="chart-flex">
             <div class="chart-flex-pie" style="margin:0">${pieChart(workPie, 140, '工作状态占比')}${pieLegend(workPie)}</div>
             <div class="cards" style="flex:1;min-width:160px;margin-bottom:0">${statCard('SPI', spi === null ? '—' : spi.toFixed(2), spi === null ? '' : (spi >= 1 ? 'ok' : 'warn'))}</div>
           </div>` : '<div class="empty-mini">暂无数据</div>')}
        <div class="chart-note">当前筛选下的全部工作项，按状态汇总；SPI 统计口径是全部任务（跟"按任务"页一致的全局指标），不是工作项自己的进度。</div></div></div>
      <div class="panel"><div class="panel-h"><span>▤ 各职责/工作推进情况</span>
        <span class="hint">按编号排序 · 点击下钻 · <span class="toggle-view" data-act="chart-duty-expand-all">全部展开</span> <span class="toggle-view" data-act="chart-duty-collapse-all">全部折叠</span></span></div>
        <div class="panel-b">
          ${dutyRowsNow}
          <div class="legend">
            <span><i style="background:var(--c-done)"></i>已完成</span>
            <span><i style="background:var(--c-doing)"></i>进行中</span>
            <span><i style="background:var(--c-late)"></i>逾期</span>
            <span><i style="background:var(--c-todo)"></i>未开始</span>
          </div></div></div>
      <div class="rep-row">
        <div class="panel rep-col">${panelHead('▤ 各年度工作数量', 'workYear')}
          <div class="panel-b">${chartTableView.workYear
            ? dataTable(['年度', '工作数'], yearBars.map(b => [b.label, b.n]))
            // 这里跟"各职责工作数量"并排在同一个 .rep-row 里，实际只有半个页面宽，但柱状图
            // 传的却是整页宽的 w——声明宽度比真实容器宽一倍，柱状图自然跨出面板边界。
            // 跟到期分布同一个套路：先按估算宽度画一版，插入 DOM 后再用 fitFlexBarChart()
            // 量出真实列宽、差得多就照实际宽度重画，见 data-due-fit 那条注释
            : (yearBars.length ? `<div data-year-fit>${barChart(yearBars, w)}</div>` : '<div class="empty-mini">暂无数据</div>')}
            <div class="chart-note">按工作项的所属年度统计数量。</div></div></div>
        <div class="panel rep-col">${panelHead('▤ 各职责工作数量', 'workDuty')}
          <div class="panel-b">${chartTableView.workDuty
            ? dataTable(['职责', '工作数'], dutyBars.map(b => [b.label, b.n]))
            : hBarList(dutyBars)}
            <div class="chart-note">只显示已有工作的职责，按职责编号排序（职责名称可能较长，改用横向列表，鼠标悬停可看完整名称）。</div></div></div>
      </div>`;

  } else if (chartTab === 'time') {
    const backlog = backlogSeries(tasks, trendGranularity);
    const msIdsForPlan = new Set(tasks.map(t => t.id));
    const msForPlan = DB.milestones.filter(m => !m.deleted_at && m.plan_date && msIdsForPlan.has(m.task));
    const planSeries = planDueSeries(tasks, msForPlan);
    const buckets = dueBuckets(tasks);
    const duePie = dueSummary(tasks);
    const backlogLegend = `<div class="legend">
             <span><i style="background:var(--c-doing);border-radius:50%"></i>待办总量（未完成任务数）</span></div>`;
    const granNote = ['month', 'week', 'day'].map(g =>
      `<span class="toggle-view${trendGranularity === g ? ' on' : ''}" data-act="trend-granularity" data-g="${g}">${{ month: '月', week: '周', day: '日' }[g]}</span>`).join(' ');
    const planLegend = `<div class="legend">
             <span><i style="background:var(--c-doing)"></i>计划完成任务数</span>
             <span><i style="background:var(--c-done)"></i>计划完成里程碑数</span></div>`;
    const planKeys = { aKey: 'tasks', bKey: 'milestones', aLabel: '计划完成任务数', bLabel: '计划完成里程碑数', ariaLabel: '按月计划完成的任务数与里程碑数' };
    body = `<div class="panel">
      ${panelHead('▧ 待办任务总量趋势', 'trendBacklog', `粒度：${granNote}`)}
      <div class="panel-b">${chartTableView.trendBacklog
        ? dataTable(['时间点', '待办总量'], backlog.map(s => [s.label, s.backlog]))
        : `<div class="svg-wrap" id="trendBacklog-wrap">${lineChart(backlog, w, '待办任务总量趋势', { aKey: 'backlog', bKey: null, aLabel: '待办总量' })}<div id="chart-tip"></div></div>${backlogLegend}`}
        <div class="chart-note">看的是存量而不是流量——每个时间点"当天为止还没完成的任务有多少条"，
        比"新增 vs 完成"更直接看出待办是在堆积还是在消化。</div></div></div>
      <div class="panel">
      ${panelHead('▧ 未完成任务的到期分布', 'due')}
      <div class="panel-b">${chartTableView.due
        ? dataTable(['区间', '任务数'], buckets.map(b => [b.label, b.n]))
        // 柱状图是定宽 SVG，先按估算宽度画一版；跟饼图并排时真实列宽要等排完版才知道，
        // 渲染完之后由 fitFlexBarChart() 量出真实宽度、差得多就照实际宽度重画一遍换上去
        : (duePie.length ? `<div class="chart-flex">
             <div class="chart-flex-bars" data-due-fit>${barChart(buckets, Math.max(280, w - 190))}</div>
             <div class="chart-flex-pie">${pieChart(duePie, 130, '到期分布占比')}${pieLegend(duePie)}</div>
           </div>` : barChart(buckets, w))}
        <div class="chart-note">仅统计未开始与进行中的任务；已挂起不计入逾期。柱状图看各区间绝对量，饼图看粗粒度占比（逾期/本周内/更远/无日期）。</div></div></div>
      <div class="panel">
      ${panelHead('▧ 从本月起，各月计划完成的任务数与里程碑数', 'trendPlan')}
      <div class="panel-b">${chartTableView.trendPlan
        ? dataTable(['月份', '计划完成任务数', '计划完成里程碑数'], planSeries.map(s => [s.label, s.tasks, s.milestones]))
        : `${groupedBarChart(planSeries, w, planKeys)}${planLegend}`}
        <div class="chart-note">按任务/里程碑各自的「计划完成时间」落在哪个月统计，跟前面的"待办总量趋势"是不同的口径（那张看的是存量，这张看的是未来各月的计划分布）；
        从当月起统计到还有计划安排的最后一个月，不是固定看多少个月；任务数和里程碑数共用同一纵轴。</div></div></div>`;

  } else if (chartTab === 'gantt') {
    const msPie = msCompletionPie(tasks);
    const msLevelStats = msReportLevelStats(tasks);
    body = `<div class="rep-row">
        <div class="panel rep-col">${panelHead('▤ 里程碑完成情况分布', 'msOverall')}
          <div class="panel-b">${chartTableView.msOverall
            ? dataTable(['情况', '数量'], msPie.map(s => [s.label, s.n]))
            : (msPie.some(s => s.n > 0) ? `<div class="chart-flex-pie" style="margin:0 auto">${pieChart(msPie, 140, '里程碑完成情况')}${pieLegend(msPie)}</div>` : '<div class="empty-mini">这批任务下面还没有里程碑</div>')}
            <div class="chart-note">统计的是当前这批任务名下所有里程碑（不区分具体属于哪条任务），不是任务本身的完成情况。</div></div></div>
        <div class="panel rep-col">${panelHead('▤ 交付物呈报层级分布', 'msLevel')}
          <div class="panel-b">${chartTableView.msLevel
            ? dataTable(['呈报层级', '数量'], msLevelStats.map(s => [s.label, s.n]))
            : (msLevelStats.some(s => s.n > 0) ? `<div class="chart-flex-pie" style="margin:0 auto">${pieChart(msLevelStats, 140, '交付物呈报层级分布')}${pieLegend(msLevelStats)}</div>` : '<div class="empty-mini">这批任务下面还没有里程碑</div>')}
            <div class="chart-note">按交付物挂的"最高呈报层级"分类（处室领导/部门领导/行领导），没填的按处室领导算，跟完成情况是两个不同维度。</div></div></div>
      </div>
      <div class="panel">${panelHead('◈ 里程碑甘特图', 'gantt',
        `点箭头逐级展开职责/工作 · <span class="toggle-view" data-act="ms-expand-all">全部展开</span> <span class="toggle-view" data-act="ms-expand-to-work">展开到工作层</span> <span class="toggle-view" data-act="ms-collapse-all">全部折叠</span>`)}
      <div class="panel-b">${chartTableView.gantt ? ganttDataTable() : milestoneTreeHTML(tasks, msDutyExpanded, msWorkExpanded)}
      <div class="chart-note">里程碑本来就是挂在具体任务下的，这里按"职责→工作→任务"逐级展开；展开到工作层级再往下，
      看到的每一行就是一条任务自己的甘特时间线（灰色横条是该任务名下里程碑的首末跨度，圆点是各里程碑）。</div></div></div>`;

  } else if (chartTab === 'matrix') {
    const dutyStatNow = statsByDuty(tasks).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
    const workStatNow = statsByWork(tasks);
    const people = allPeople().slice().sort((a, b) => a.localeCompare(b, 'zh'));
    const heat = personDutyWorkHeat(tasks);
    body = `<div class="panel"><div class="panel-h"><span>▦ 人员工作矩阵</span>
        <span class="hint">按编号排序 · 点击格子下钻 · <span class="toggle-view" data-act="chart-matrix-expand-all">全部展开</span> <span class="toggle-view" data-act="chart-matrix-collapse-all">全部折叠</span></span></div>
      <div class="panel-b">
        ${personMatrixHTML(dutyStatNow, workStatNow, people, heat, chartMatrixDutyExpanded, 'chart-matrix-duty-toggle')}
        <div class="chart-note">行是职责（点箭头展开看下面的工作），列是每个人；格子里的数字是这个人在这项职责/工作下牵头 + 参与的任务总数，

        点有数字的格子可以跳到任务页，筛出这个人在这项职责/工作下的具体任务。</div></div></div>`;

  } else {

  }

  $('#page-charts').innerHTML = `<div class="pad">${tabs}${body}</div>`;
  // trendPlan 是柱状图，用原生 <title> 做提示，不需要十字准线那一套
  if (chartTab === 'time' && !chartTableView.trendBacklog) bindTrendHover('trendBacklog-wrap', '待办总量', null);
  // 到期分布的柱状图跟饼图并排，真实列宽要插入 DOM 之后才量得出来，见 fitFlexBarChart 的注释
  if (chartTab === 'time' && !chartTableView.due) {
    const dueEl = $('#page-charts').querySelector('[data-due-fit]');

  // 各年度工作数量跟各职责工作数量并排同一行，同理要按真实列宽重画，不然柱状图按整页宽画、
  // 跨出这个只有半页宽的面板
  if (chartTab === 'work' && !chartTableView.workYear) {
    const yearEl = $('#page-charts').querySelector('[data-year-fit]');
    if (yearEl) fitFlexBarChart(yearEl, worksByYear());
  }
  const sampleN = chartTab === 'work' ? visibleWorks().length : tasks.length;
  const sampleUnit = chartTab === 'work' ? '项工作' : '条任务';
  $('#status-left').textContent = `图表 · ${(CHART_TABS.find(t => t.key === chartTab) || {}).label} · 样本 ${sampleN} ${sampleUnit}`;
}

/* 折线图十字准线与浮动提示（各张线图共用同一套逻辑，各自按 wrap id 区分；
   labelA/labelB 是提示框里两条线各自的文字，默认"新增"/"完成"；labelB 传 null 表示单线图，只显示一行提示） */
function bindTrendHover(wrapId, labelA, labelB) {
  const wrap = $('#' + wrapId);
  if (!wrap) return;
  const svg = wrap.querySelector('svg'), line = wrap.querySelector('#ch-line'), tip = wrap.querySelector('#chart-tip');
  if (!svg || !line || !tip) return;
  const la = labelA || '新增', lb = labelB === null ? null : (labelB || '完成');
  svg.addEventListener('mousemove', e => {
    const hit = e.target.closest('[data-tip]');
    if (!hit) return;
    const [label, a, b] = hit.dataset.tip.split('|');
    const cx = +hit.dataset.cx;
    line.setAttribute('x1', cx); line.setAttribute('x2', cx);
    line.style.display = '';
    tip.innerHTML = `<b>${esc(label)}</b><br><i style="background:var(--c-doing);border-radius:50%"></i>${esc(la)} ${esc(a)}` +
      (lb === null ? '' : `<br><i style="background:var(--c-done)"></i>${esc(lb)} ${esc(b)}`);
    tip.classList.add('show');
    const r = wrap.getBoundingClientRect();
    tip.style.left = Math.min(cx + 10, r.width - tip.offsetWidth - 6) + 'px';
    tip.style.top = '14px';
  });
  svg.addEventListener('mouseleave', () => { line.style.display = 'none'; tip.classList.remove('show'); });
}

/* =============================================================
   17b. 报告页：把工作台已有的统计数据整理成一份可读的简报，统计周期可选
   本周/本月/本季/本年；导出支持打印成 PDF、或一键存成图片，不再是纯文本
   ============================================================= */
let reportPeriod = 'week';
/* 原来按钮上写的是"本周/本月/本季/本年"，隐含了"这四个按钮永远指向当前这一期"的假设。
   加了前后翻期之后这个假设不再成立——按钮真正切换的是"看的粒度是周/月/季/年"，
   跟"看的是哪一期"是两件事，所以按钮文字改成中性的"按周/按月/按季/按年"，
   具体是不是本期、是往前还是往后翻了几期，交给下面 periodLabelFor 生成的动态文案和
   面板里直接摆出来的起止日期去说清楚。 */
const REPORT_PERIODS = [
  { key: 'week',    label: '按周' },
  { key: 'month',   label: '按月' },
  { key: 'quarter', label: '按季' },
  { key: 'year',    label: '按年' },
];
// 在当前粒度下，相对于"现在"翻了几期：0 = 本期，负数往前，正数往后。切换粒度时会归零（见 report-period）
let reportOffset = 0;
let reportExpanded = new Set();   // 报告页里展开了哪些职责（要看它下面的工作明细）
let reportMatrixDutyExpanded = new Set();   // 报告页"人员工作矩阵"模块自己一份展开状态，跟图表页那份互不影响
let reportDeliveredMsLevelFilter = '';   // "本期已交付里程碑"模块按呈报层级筛选，点饼图/图例某一块切换，再点一次清除；空串 = 不筛
// "本期已交付里程碑"专用的呈报层级顺序：行领导 → 部门领导 → 处室领导，级别越高越靠前，
// 跟 REPORT_LEVELS 定义顺序（处室领导→部门领导→行领导）正好相反——这是汇报场景特有的排序习惯，
// 不动 REPORT_LEVELS 本身，免得连带影响里程碑编辑器下拉框、图表页其它呈报层级统计的顺序
const DELIVERED_MS_LEVEL_ORDER = ['bank', 'department', 'section'];
// period + offset → 起止日期。offset 用整期整期地挪（挪一周/一整个月/一整个季度/一整年），
// 不是简单地挪 N 天——月份天数不一样、季度更是三个月一挪，只有基于"年/月/周数"做整数偏移
// 再交给 Date 构造函数才不会挪出偏差（Date 对超范围的月份/日期会自动进位，这里刚好借力）
function periodRange(period, offset) {
  offset = offset || 0;
  const now = new Date();
  if (period === 'month') {
    const m = now.getMonth() + offset;
    return { start: fmtLocal(new Date(now.getFullYear(), m, 1)), end: fmtLocal(new Date(now.getFullYear(), m + 1, 0)) };
  }
  if (period === 'quarter') {
    const q = Math.floor(now.getMonth() / 3) + offset;
    return { start: fmtLocal(new Date(now.getFullYear(), q * 3, 1)), end: fmtLocal(new Date(now.getFullYear(), q * 3 + 3, 0)) };
  }
  if (period === 'year') {
    const y = now.getFullYear() + offset;
    return { start: fmtLocal(new Date(y, 0, 1)), end: fmtLocal(new Date(y, 11, 31)) };
  }
  // 周：先按老办法算出本周一，再整周平移
  const day = now.getDay(), diffToMon = day === 0 ? 6 : day - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - diffToMon + offset * 7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  return { start: fmtLocal(monday), end: fmtLocal(sunday) };
}
// 本期/上N期/下N期——中文习惯"上周"不说"上1周"，N≥2 才带数字
function periodLabelFor(period, offset) {
  const unit = { week: '周', month: '月', quarter: '季', year: '年' }[period] || '周';
  if (!offset) return '本' + unit;
  const n = Math.abs(offset);
  return (offset < 0 ? '上' : '下') + (n === 1 ? '' : n) + unit;
}
// person：不传/空串 = 全处口径（原样不变）；传人名 = 先用 dashPersonTasks 把任务收窄到
// "这个人牵头∪参与"的那一份，再往下走同一套统计逻辑——dutyStat/statusStat/spi/peopleStat……
// 这些计算完全不用关心"个人/整体"这回事，喂什么任务集合进来就统计什么，模块也一样不用关心。
function buildReportData(period, offset, person) {
  period = period || 'week';
  const periodLabel = periodLabelFor(period, offset || 0);
  const { start: rangeStart, end: rangeEnd } = periodRange(period, offset);
  const tasks = person ? dashPersonTasks(person) : visibleTasks().filter(t => !t.deleted_at);
  const works = person ? visibleWorks().filter(w => w.owner === person) : visibleWorks();
  const today = todayStr();
  const open = tasks.filter(isOpen);
  const overdue = tasks.filter(isOverdue).sort((a, b) => (a.plan_date || '').localeCompare(b.plan_date || ''));
  // 本期完成的任务：成果导向，落在所选周期内的实际完成日
  const doneInRange = tasks.filter(t => t.status === 'done' && t.actual_date && t.actual_date >= rangeStart && t.actual_date <= rangeEnd)
    .sort((a, b) => (b.actual_date || '').localeCompare(a.actual_date || ''));
  // 职责/工作推进情况：反映当前整体状态，不随周期变化——问的是"现在整体怎么样"，不是"这段时间怎么样"
  const dutyStat = statsByDuty(tasks).sort((a, b) => (a.code || '').localeCompare(b.code || ''));
  const workStat = statsByWork(tasks);
  const taskIds = new Set(tasks.map(t => t.id));
  // 本期已交付的里程碑：成果导向，展示这段时间实际交出的东西
  const deliveredInRange = DB.milestones.filter(m => !m.deleted_at && taskIds.has(m.task) && m.done === '1' && m.actual_date && m.actual_date >= rangeStart && m.actual_date <= rangeEnd)
    .sort((a, b) => (b.actual_date || '').localeCompare(a.actual_date || ''));
  // 本期及逾期、还没交付的里程碑：留到"需要关注"里
  const msAttention = DB.milestones.filter(m => !m.deleted_at && taskIds.has(m.task) && m.done !== '1' && m.plan_date && m.plan_date <= rangeEnd)
    .sort((a, b) => a.plan_date.localeCompare(b.plan_date));

  /* ---- 以下是"当期"口径的汇总，给报告页那几个按汇报顺序编排的模块用 ----
     "当期涉及"刻意包含三类，缺一份汇报就说不圆：
     · 计划完成日落在本期的——本期该干的；
     · 实际完成日落在本期的——本期干完的（哪怕它原计划是上期的）；
     · 还没完成、且计划完成日早于本期的——从上期欠下来带进本期的。
     只按计划日筛的话，欠账任务会凭空消失，"当期需推进"这个数字就会明显偏小。 */
  /* "推进中"（status === 'doing'）单独再补一条口径：哪怕计划完成日在本期之外
     （比如排到了下个季度）、也没有任何完成节点落进本期，只要现在正在干，就该算"当期涉及"——
     否则一个正常推进、只是还没到交付节点的任务，会在报告里彻底消失，显得当期什么都没干。 */
  const inRange = dt => !!dt && dt >= rangeStart && dt <= rangeEnd;
  const msAll = DB.milestones.filter(m => !m.deleted_at && taskIds.has(m.task));
  const doingTaskIds = new Set(tasks.filter(t => t.status === 'doing').map(t => t.id));
  /* 已完成的任务只认"实际完成日是否落在本期"，不再看计划完成日——一条任务标了"已完成"之后，
     计划日期就只是历史参考，真正决定它属于哪一期的是它究竟哪天完成的。以前只要计划日落在
     本期就会被算进"本期完成进度"的已完成数，导致"提前完成、实际完成日其实是上一期"的任务
     也被计进本期——这正是"本期完成进度（已完成）"跟"本期已完成任务"清单（只认实际完成日）
     数字对不上的原因，两边现在统一成同一个口径。 */
  const periodTasks = tasks.filter(t => {
    if (t.status === 'done') return inRange(t.actual_date);
    return inRange(t.plan_date) || inRange(t.actual_date)
      || (isOpen(t) && t.plan_date && t.plan_date < rangeStart)
      || t.status === 'doing';
  });
  const periodMs = msAll.filter(m => inRange(m.plan_date) || inRange(m.actual_date)
    || (m.done !== '1' && m.plan_date && m.plan_date < rangeStart)
    || (m.done !== '1' && doingTaskIds.has(m.task)));
  const periodOpen = periodTasks.filter(isOpen);
  const planTasks = tasks.filter(t => inRange(t.plan_date));   // 本期计划完成的任务
  const planMs = msAll.filter(m => inRange(m.plan_date));      // 本期计划完成的里程碑
  // 当期涉及到几项职责、几项工作：从当期任务往上追溯，不是数全处一共有多少
  const dutyCodes = new Set(), workIds = new Set();
  periodTasks.forEach(t => {
    const w = t.work ? byId('work', t.work) : null;
    if (!w) return;
    workIds.add(w.id);
    if (w.duty) dutyCodes.add(w.duty);
  });
  /* 状态分布的口径跟工作台"人员负荷"完全一致：逾期单独成一类、优先判定，
     不再重复计进"进行中/未开始"。四类加起来正好等于当期任务总数，汇报时不会对不上账。 */
  const statusStat = taskStatusBreakdown(periodTasks);
  const spi = computeSPI(periodTasks);
  const byPlanDate = (a, b) => (a.plan_date || '').localeCompare(b.plan_date || '');
  const highPriTasks = periodOpen.filter(t => t.priority === '1').sort(byPlanDate);
  const overdueMs = msAll.filter(m => m.done !== '1' && m.plan_date && m.plan_date < today).sort(byPlanDate);
  // "即将到期"= 今天起到本期结束之间要交的、还没完成的。不用"未来 N 天"是为了跟所选周期对齐——
  // 按月汇报时想知道的就是"这个月剩下还有什么要交"，固定 7 天会把月底的东西漏在报告外面
  const soonTasks = periodOpen.filter(t => t.plan_date && t.plan_date >= today && t.plan_date <= rangeEnd).sort(byPlanDate);
  const soonMs = msAll.filter(m => m.done !== '1' && m.plan_date && m.plan_date >= today && m.plan_date <= rangeEnd).sort(byPlanDate);
  // 人员工作情况：口径跟工作台人员负荷一致（牵头 ∪ 参与，同一条任务两边都算）
  const loadMap = new Map();
  periodTasks.forEach(t => {
    const people = personUnion('task', t);
    (people.length ? people : ['（未指派）']).forEach(who => {
      if (!loadMap.has(who)) loadMap.set(who, { done: 0, doing: 0, todo: 0, late: 0 });
      const e = loadMap.get(who);
      if (isOverdue(t)) e.late++;
      else if (t.status === 'done') e.done++;
      else if (t.status === 'doing') e.doing++;
      else e.todo++;
    });
  });
  const peopleStat = [...loadMap.entries()].map(([nm, v]) => ({ nm, ...v, total: v.done + v.doing + v.todo + v.late }))
    .sort((a, b) => {
      if (a.nm === '（未指派）') return 1;
      if (b.nm === '（未指派）') return -1;
      return a.nm.localeCompare(b.nm, 'zh');
    });

  // offset/person 跟着一起带出去：模块内部要跨期/跨人再算一遍时（比如"下期计划"要拿
  // offset+1 那份数据），照着这两个字段调 buildReportData(d.period, d.offset+1, d.person)
  // 就行，不用另外传参。msAll 也顺手带出去（d.tasks 名下全部里程碑，不筛日期/完成状态）——
  // 上面 periodMs/msAttention/overdueMs 都是从它筛出来的某个特定切面，模块要是想要"这批任务
  // 名下所有里程碑"这种更原始的集合（比如按 done/plan_date 自己再筛一遍），不用再重新扫一遍
  return { tasks, works, today, period, periodLabel, rangeStart, rangeEnd, offset: offset || 0, person: person || '', open, overdue, doneInRange, dutyStat, workStat, deliveredInRange, msAttention,
    periodTasks, periodMs, periodOpen, planTasks, planMs, dutyCodes, workIds, statusStat, spi,
    highPriTasks, overdueMs, soonTasks, soonMs, peopleStat, taskMilestones: msAll };
}
/* 一条任务"最近一个里程碑"指的是它名下按计划日期排序、排在最前面的那个还没交的里程碑
   （前面几个都已经交了，只能从"排在它前面的都完成了、它自己还没完成"这个位置关系反推出来——
   里程碑本身没有"进行中"这种中间状态，只有完成/未完成；排序用 plan_date，跟检查点编辑器、
   甘特图是同一套"里程碑没有独立排序字段，一律按计划日期升序"的隐含顺序，见 msTreeGroups
   上面的注释）。全部里程碑都已交付、或者这条任务名下压根没有里程碑的，不会出现在这个 Map 里——
   调用方自己判断"没有 = 用任务自己的计划完成时间兜底"还是"没有 = 不算数"。
   返回 Map<任务 id, 里程碑对象>，不预先按任务筛，调用方自己再跟别的过滤条件取交集。 */
function nextMilestoneMap() {
  const byTask = new Map();
  DB.milestones.filter(m => !m.deleted_at).forEach(m => {
    if (!byTask.has(m.task)) byTask.set(m.task, []);
    byTask.get(m.task).push(m);
  });
  const map = new Map();
  byTask.forEach((list, taskId) => {
    const sorted = list.slice().sort((a, b) => (a.plan_date || '9999-99-99').localeCompare(b.plan_date || '9999-99-99'));
    const next = sorted.find(m => m.done !== '1');
    if (next) map.set(taskId, next);
  });
  return map;
}
/* =============================================================
   17c. 报告页的「区域 + 模块」编排

   为什么做成可配置的：这一页的用途是照着念稿子汇报，而不同场合要念的东西不一样
   （周例会关心逾期和下周要交的，季度总结关心整体进度和人员分工）。以前是一份写死的
   固定版式，每次汇报都要在页面上翻来翻去找需要的那几块。

   两个要素，刻意分得很清楚：
   · 区域(section)：用户自己定义的标题 + 一个区块，纯粹是"讲稿的第几部分"，系统不认识它的含义；
   · 模块(module)：系统已有的那些数据块，用户只能从下面这个注册表里挑，不能凭空造。
   编排整体存一份（DB.reportConfig，随共享文件同步给全处），可以存多套"存档"随时切换。

   每个模块的字段：
   · key / label / desc      → 标识、显示名、选择器里的说明
   · group                   → 归到哪一类（模块多了以后选择器必须分类，见 REPORT_GROUPS）
   · scope: 'period'|'all'   → 这个模块认不认周期。绝大多数认（只统计当期），
                               但趋势、甘特、"最近动态"这类天生是跨期的，标成 'all'，
                               界面上会明确标出"全量"，免得有人以为翻期没生效
   · personAware: 'onlyAll'|'either'|'onlyPerson'（P80 起新增）→ 这个模块认不认"看谁的"。
                               buildReportData(period, offset, person) 传了 person 就把 d.tasks/
                               d.works 先按这个人收窄，下面统计逻辑原样不变，模块本身完全不用关心
                               "个人/整体"是怎么实现的。'onlyAll' = 天生就该看全处（人员负荷、最近动态
                               这类"看大家在干嘛"的模块，缩到一个人身上就没意义了）；'either' = 按人
                               按整体都说得通（涉及范围、完成进度、逾期/即将到期这类清单）；'onlyPerson'
                               = 只有按人筛才有意义（P80 起新增的"我的XXX"系列，比如"牵头/参与"拆分，
                               整体口径下没有"谁是牵头"这个参照系）。不写默认当 'onlyAll'，这是历史模块
                               的保守缺省——没人验证过它们在按人口径下好不好用之前，不主动开放这个选项。
                               这一版只有工作台的默认编排会用到 personScope，报告页的编排界面本轮
                               不出这个开关（配置层面的事，见 dashboardConfigPanelHTML 那段说明）。
   · html(d, ctx)            → 页面上的面板正文；ctx.width 是这一列实际能用的像素宽度
                               （模块可以并排放，宽度不再固定，见 reportSections 的 rows）
   · text(d, push)           → 纯文本简报的若干行（必填）
   · canvas(d, api)          → 可选。导出图片时用 canvas 原语画（api 见 exportReportImage）。
                               不写就自动退回"把 text() 那几行画出来"——图表类模块画不出饼图/折线，
                               但至少数字一条不少，而且不用为二十几个模块各写一遍 canvas 排版。
   · table: true             → 可选。这个模块在图表页/工作台有对应的"看图表/看数据表"切换按钮时才标，
                               标了之后 html() 自己要读 reportIsTable(key) 判断该画图还是画表
                               （见 reportIsTable）；面板头上的按钮由 reportModHead() 统一加，
                               不用在 html() 里自己拼。图表页/工作台没有这颗按钮的模块（纯统计卡片、
                               任务/里程碑清单类）就不标，跟原样保持一致，不画蛇添足。
   · note(d)                 → 可选。放在面板头右上角、"看数据表"按钮左边的一小段控件
                               （月/周/日粒度切换、全部展开/折叠这类），位置和图表页/工作台上
                               对应面板的 panelHead(title, id, note) 第三个参数完全一致。
                               不写 note 就说明图表页那边这个位置本来就是空的。 */
/* 报告里的状态图例。跟通用的 statusLegend 差一个字："未开始"而不是"未开始/挂起"——
   报告是给领导念的，挂起属于内部流程细节，摊在汇报材料里只会引出多余的追问；
   统计口径上挂起本来也是跟未开始合并计数的，所以只影响这一行文字怎么写。 */
const REPORT_STATUS_LEGEND = `<div class="legend">
  <span><i style="background:var(--c-done)"></i>已完成</span>
  <span><i style="background:var(--c-doing)"></i>进行中</span>
  <span><i style="background:var(--c-late)"></i>逾期</span>
  <span><i style="background:var(--c-todo)"></i>未开始</span></div>`;
/* 模块分类。模块从十来个涨到二十多个之后，配置面板里平铺一大片勾选框已经没法用了，
   按"这块讲的是什么"分组，找起来才有方向。顺序就是选择器里的显示顺序。 */
const REPORT_GROUPS = [
  { key: 'overallSnapshot', label: '整体统计' },
  { key: 'periodOverall', label: '本期处室统计' },
  { key: 'attention', label: '需要关注' },
  { key: 'people', label: '人员' },
  { key: 'duty', label: '职责与工作' },
  { key: 'task', label: '任务分布' },
  { key: 'milestone', label: '里程碑' },
  { key: 'trend', label: '趋势与时间' },
  { key: 'list', label: '成果清单与动态' },
  { key: 'personal', label: '工作台·我的（P80 起新增，只有按人筛才有意义）' },
];
/* 报告页里给图表用的可用宽度。图表页那个 chartWidth() 读的是 #page-charts，
   在报告页永远量不到东西；而且报告模块现在可以并排放，同一个模块在"独占一行"和
   "跟另一个模块并排"两种情况下能用的宽度差一倍，必须按实际列宽算。
   ctx.width 由 renderReport 按这一行摆了几个模块算好传进来。 */
function reportChartWidth(ctx) {
  const el = $('#page-report');
  const pageW = (el && el.clientWidth) || 900;
  const colW = (ctx && ctx.width) || pageW;
  return Math.max(300, colW - 66);
}
// 折线/柱状图是定宽 SVG（没有 viewBox，缩不了）。窄屏时与其让它撑破版面，不如让它自己横向滚动

/* 报告模块的"看数据表"状态跟图表页/工作台各自独立存一份，不共用 chartTableView 的原始 id——

function dashPersonViewAttrs(view, person) { return ` data-act="dash-drill-tasks" data-view="${esc(view)}" data-person="${esc(person)}"`; }
/* P80 起工作台"我的"系列模块专用小工具（这一批"本期已完成/进行中/逾期/下期计划"四个模块
   最初做成"牵头/参与两个小节 × 任务/里程碑两个子清单"，四层嵌套看着很碎，改成"任务和里程碑
   混排成一条条清晰的列表"；后来又发现同一条任务如果自己也符合条件，会跟它名下符合条件的
   里程碑各占一行——汇报时明明是同一件事却被念两遍。这一版改成按任务合并：
   · dashIsLeadTask/dashIsLeadMs → "牵头"判定，统一看 owner === person（里程碑看它所属任务的 owner）
   · dashMergeByTask              → 核心：同一条任务在这个模块里只留一行。任务自己符合条件的，
                                   taskQualifies=true，行的日期用任务自己的；只有里程碑符合、
                                   任务本身不符合的，taskQualifies=false，日期改用里程碑的（多个
                                   里程碑都符合时，取跟排序方向一致的那个——已完成倒序取最新，
                                   进行中/逾期/下期计划正序取最早，这样这一行冒出来的位置跟它
                                   "为什么会出现在这个模块里"是对得上的）；任务和里程碑都符合的，
                                   两部分信息都保留，渲染时拼进同一行。
   · dashItemRow                  → 一条合并后的记录拼成一行：日期 + 牵头/参与标签（.lvl 复用
                                   报告页"呈报层级"那颗小徽章的样式）+ 📌 任务标题，如果这条任务
                                   名下有符合条件的里程碑，后面再拼"· ◆里程碑：交付物A、交付物B"。
                                   整行可点，点了直接 openTaskDetail 弹任务详情（这个应用里里程碑
                                   本来就内嵌在任务详情弹窗里编辑），不像 reportTaskRows 的
                                   'focus-task' 那样跳转到任务页去。
   · dashGroupedRows/dashGroupedCount → 牵头的排一块、参与的排一块（各自内部按日期排序），
                                   两块之间没有大标题、只有一道浅分隔线；count 数的是合并去重后
                                   的行数（"实际有几条任务出了成果"），不是任务数+里程碑数的

                                   这种数字。 */
function dashIsLeadTask(t, person) { return t.owner === person; }
function dashIsLeadMs(m, person) { const mt = byId('task', m.task); return !!mt && mt.owner === person; }
function dashMergeByTask(taskList, msList, dateKey, dir) {
  const key = dateKey || 'plan_date';
  const byTask = new Map();
  taskList.forEach(t => {
    byTask.set(t.id, { task: t, taskQualifies: true, date: t[key] || '', ms: [] });
  });
  msList.forEach(m => {
    const t = byId('task', m.task);
    if (!t) return;
    let entry = byTask.get(t.id);
    if (!entry) { entry = { task: t, taskQualifies: false, date: '', ms: [] }; byTask.set(t.id, entry); }
    entry.ms.push(m);
    if (!entry.taskQualifies) {
      const md = m[key] || '';
      if (!entry.date || (dir < 0 ? md > entry.date : md < entry.date)) entry.date = md;

}
function dashItemRow(entry, role, dateColor) {

  const msNames = entry.ms.map(m => m.deliverable || '（未填写交付物）');
  const msPartHtml = msNames.length ? ` · ◆里程碑：${esc(msNames.join('、'))}` : '';
  const titleAttr = msNames.length ? `${t.title} · 里程碑：${msNames.join('、')}` : t.title;
  return `<div class="li" data-act="cp-editor" data-id="${esc(t.id)}" title="${esc(titleAttr)}">
    <span class="d"${dateColor ? ` style="color:${dateColor}"` : ''}>${esc(date)}</span>
    <span class="lvl">${esc(roleLabel)}</span>
    <span class="t">📌 ${esc(t.title)}${msPartHtml}</span>
    <span class="p">${esc(workName(t.work))}</span></div>`;
}
// lists: { ledTasks, ledMs, joinTasks, joinMs }；dir: 1=正序（早的在前，进行中/逾期/下期计划用），
// -1=倒序（新的在前，已完成用）；牵头组、参与组各自内部按合并后的日期排序
function dashGroupedRows(lists, dateKey, dateColor, dir, emptyMsg) {
  const buildGroup = (taskList, msList, role) => dashMergeByTask(taskList, msList, dateKey, dir)
    .sort((a, b) => dir * (a.date || '9999').localeCompare(b.date || '9999'))
    .map(e => dashItemRow(e, role, dateColor)).join('');
  const leadHTML = buildGroup(lists.ledTasks, lists.ledMs, 'lead');
  const joinHTML = buildGroup(lists.joinTasks, lists.joinMs, 'join');
  if (!leadHTML && !joinHTML) return `<div class="empty-mini">${esc(emptyMsg)}</div>`;
  const joinBlock = joinHTML
    ? `<div class="mini-list"${leadHTML ? ' style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"' : ''}>${joinHTML}</div>` : '';
  return (leadHTML ? `<div class="mini-list">${leadHTML}</div>` : '') + joinBlock;

// count 不关心具体日期/排序方向，随便传一个 dateKey/dir 进 dashMergeByTask 都不影响"合并出几行"这个数
function dashGroupedCount(lists) {
  return dashMergeByTask(lists.ledTasks, lists.ledMs, 'plan_date', 1).length
    + dashMergeByTask(lists.joinTasks, lists.joinMs, 'plan_date', 1).length;
}
// 跟 dashGroupedRows 是同一套合并逻辑的纯文本版，给 text()（打印/纯文本导出）用——
// 不合并的话，纯文本汇报里会重复念两遍同一条任务，跟 html() 版本要解决的问题一模一样
function dashRoleText(taskList, msList, dateKey, dir, push, roleLabel) {
  const entries = dashMergeByTask(taskList, msList, dateKey, dir).sort((a, b) => dir * (a.date || '9999').localeCompare(b.date || '9999'));
  if (!entries.length) { push(`${roleLabel}：无`); return; }
  push(`${roleLabel}：`);
  entries.forEach(e => {
    const msNames = e.ms.map(m => m.deliverable || '（未填写交付物）');
    const msPart = msNames.length ? `（里程碑：${msNames.join('、')}）` : '';
    push(`- ${fmtDate(e.date)}　${e.task.title}${msPart}`);
  });
}
/* 四个"本期已完成/进行中/逾期/下期计划"模块各自的牵头/参与拆分，从各自的 html()/titleCount()
   两处调用点抽出来，避免同一份筛选逻辑写两遍、慢慢改出两份不一致的口径。都返回
   { ledTasks, ledMs, joinTasks, joinMs }（没设置使用者时返回 null，调用方自己判断）。 */
function dashMyDoneSplitLists(d) {
  if (!d.person) return null;
  return {
    ledTasks: d.doneInRange.filter(t => dashIsLeadTask(t, d.person)), joinTasks: d.doneInRange.filter(t => !dashIsLeadTask(t, d.person)),
    ledMs: d.deliveredInRange.filter(m => dashIsLeadMs(m, d.person)), joinMs: d.deliveredInRange.filter(m => !dashIsLeadMs(m, d.person)),
  };
}
/* "本期进行中"该包含哪些任务/里程碑：计划完成日不晚于本期末、还没完成的——"进行中"这个词
   在这里同时指"还没启动"（todo）和"启动了但没做完"（doing）两种状态，不能只看计划完成日是不是
   精确落在本期区间内（原来 dueOpen/msDueOpen 多加了一条 plan_date >= rangeStart 下限，会把
   "计划完成日在本期之前、但至今还没做完"的欠账任务漏掉）。这条不设下限跟 buildReportData 里
   periodTasks 的"逾期任务带进本期"是同一个道理。"我的统计卡片"和"⏳ 本期进行中"列表原来
   各写了一份一模一样的筛选、只是没设成共享函数，这里合并，以后不会再各自改出两个口径。 */
function dashDueOpen(d) {
  const tasks = d.tasks.filter(t => isOpen(t) && t.plan_date && t.plan_date <= d.rangeEnd);
  const ms = d.taskMilestones.filter(m => m.done !== '1' && m.plan_date && m.plan_date <= d.rangeEnd);
  return { tasks, ms };
}
function dashMyDoingSplitLists(d) {
  if (!d.person) return null;
  const { tasks: dueOpen, ms: msDueOpen } = dashDueOpen(d);
  return {
    ledTasks: dueOpen.filter(t => dashIsLeadTask(t, d.person)), joinTasks: dueOpen.filter(t => !dashIsLeadTask(t, d.person)),
    ledMs: msDueOpen.filter(m => dashIsLeadMs(m, d.person)), joinMs: msDueOpen.filter(m => !dashIsLeadMs(m, d.person)),
  };
}
function dashMyOverdueSplitLists(d) {
  if (!d.person) return null;
  return {
    ledTasks: d.overdue.filter(t => dashIsLeadTask(t, d.person)), joinTasks: d.overdue.filter(t => !dashIsLeadTask(t, d.person)),
    ledMs: d.overdueMs.filter(m => dashIsLeadMs(m, d.person)), joinMs: d.overdueMs.filter(m => !dashIsLeadMs(m, d.person)),
  };
}
/* "下期计划"该看哪个日期、算不算数：一条任务如果名下有还没交的里程碑，真正决定"下一期要交
   什么"的是它最近一个里程碑的计划完成时间，不是任务自己那个经常一开始就定好、很少跟着改的
   计划完成时间——所以这两件事用同一个判断：有里程碑的任务只走 nextMs 那条线（日期用里程碑
   的），没有里程碑（或名下里程碑已经全部交完）的任务才走 nextTasks 那条线（日期退回用任务
   自己的）。两条线互斥，靠 dashMergeByTask 按 msList 优先于纯任务日期的规则自动合并成一行，
   不用另外写合并逻辑。
   这一版收紧了口径：以前"状态是进行中"的任务/"当前排在最前面"的里程碑不管计划日期是否落在
   下一期都会被拉进来，现在去掉这条兜底——下期计划要回答的是"下一期真有什么要交"，不是"手上
   还有什么没做完"（那是"本期进行中"要回答的问题），所以必须完成节点确实落在下一期区间内才算数。 */
function dashMyNextPlanLists(d) {
  if (!d.person) return null;
  const nextLabel = periodLabelFor(d.period, d.offset + 1);
  const { start: nextStart, end: nextEnd } = periodRange(d.period, d.offset + 1);
  const nextMsByTask = nextMilestoneMap();
  const inNextPeriod = date => !!date && date >= nextStart && date <= nextEnd;
  const nextTasks = d.tasks.filter(t => isOpen(t) && !nextMsByTask.has(t.id) && inNextPeriod(t.plan_date));
  const nextMs = d.taskMilestones.filter(m => nextMsByTask.get(m.task) === m && inNextPeriod(m.plan_date));
  return {
    nextLabel,
    ledTasks: nextTasks.filter(t => dashIsLeadTask(t, d.person)), joinTasks: nextTasks.filter(t => !dashIsLeadTask(t, d.person)),
    ledMs: nextMs.filter(m => dashIsLeadMs(m, d.person)), joinMs: nextMs.filter(m => !dashIsLeadMs(m, d.person)),
  };
}
/* "本期涉及范围/本期工作计划量/本期完成进度"三个报告页模块，跟工作台"处室概览统计卡片"

const REPORT_MODULES = [

  { key: 'personBars', label: '各人任务量与完成率', desc: '横条：每人相关任务量、完成率，以及牵头/参与比例（跟图表页-按人完全一致）',
    group: 'people', scope: 'period', personAware: 'onlyAll', table: true,
    html: d => {
      const st = statsByPerson(d.periodTasks);

      if (reportIsTable('personBars')) return dataTable(['姓名', '相关合计', '已完成', '进行中', '逾期', '未开始', '完成率', '牵头', '参与'],

      const max = Math.max(1, ...st.map(s => s.total));

  { key: 'personMatrix', label: '人员工作矩阵', desc: '职责/工作 × 人员的热力矩阵（牵头权重 3 倍于参与），跟图表页-人员工作矩阵完全一致',

    html: d => {
      const dutyStat = statsByDuty(d.tasks).sort((a, b) => (a.code || '').localeCompare(b.code || ''));

    },
    text: (d, push) => {

      const heat = personDutyWorkHeat(d.tasks);
      dutyStat.forEach(x => {
        const pm = heat.dutyMap.get(x.code);

/* 默认编排：就是处里汇报时实际要念的那四段。
   老数据（DB.reportConfig 为 null）和任何一套自定义存档被删光之后，都回落到这一份，
   所以升级上来的用户什么都不用配就能直接用。 */
const DEFAULT_REPORT_SECTIONS = [
  // 家底快照放最前面：先看现在整体有多少职责/工作/任务/里程碑，后面"本期涉及"的跨级分数
  // （涉及职责 X/处室职责总数 Y 这种）才有分母可对照，顺着往下读逻辑连得上
  { id: 'sec_overall', title: '一、处室工作整体统计', modules: ['overallDuty', 'overallWork', 'overallTask', 'overallMs'] },
  { id: 'sec_goal',   title: '二、本期处室工作目标', modules: ['periodOverallScope', 'periodOverallPlan'] },
  { id: 'sec_state',  title: '三、本期处室工作进展', modules: ['periodStatus', 'dutyTree'] },
  { id: 'sec_focus',  title: '四、本期需要关注的工作', modules: ['highPriority', 'overdueTasks', 'overdueMs', 'soonTasks', 'soonMs'] },
  // "人员工作情况"模块已经被功能更完整的 personBars（各人任务量与完成率）取代，见 REPORT_MODULES 里那段注释
  { id: 'sec_people', title: '五、人员工作情况', modules: ['personBars'] },
];
const DEFAULT_PRESET_NAME = '默认编排';
function reportPresets() {
  const c = DB.reportConfig;
  const list = (c && Array.isArray(c.presets)) ? c.presets.filter(p => p && p.id) : [];
  return list.length ? list : [{ id: 'preset_default', name: DEFAULT_PRESET_NAME, sections: clone(DEFAULT_REPORT_SECTIONS) }];
}
function activeReportPreset() {
  const list = reportPresets();
  const id = DB.reportConfig && DB.reportConfig.activeId;
  return list.find(p => p.id === id) || list[0];
}
/* 渲染用的区域清单。做两件事：
   1) 把认不出来的模块 key 滤掉——存档可能是更新的版本写的，里面引用了本机这份 html
      还没有的模块，遇到就当它不存在，绝不让整页报告因此渲染不出来；
   2) 把"哪些模块并排"这件事从 inline 展开成 rows（每行一个模块数组）。

   ★ 为什么并排信息存成 section.inline（"跟上一个同行"的模块 key 列表），
      而不是直接把 modules 改成二维的 rows ★
   modules 这个扁平数组是老版本唯一认得的字段。存成二维数组的话，处里那些还没换新版
   html 的同事一打开，报告页就是空的——而共享文件是所有人共用的一份，编排一改就影响到全处。
   现在这样：老版本读到 inline 这个它不认识的字段直接忽略，照旧按 modules 的顺序纵向排，
   内容一条不少，只是没有并排效果；新版本读到老数据没有 inline，就是全部各占一行。
   两个方向都不会出事，这是在一个"没法要求所有人同时升级"的分发方式下必须付的代价。 */
function reportSections() {
  const p = activeReportPreset();
  return (p.sections || []).filter(s => s && s.id).map(s => {
    const modules = (s.modules || []).filter(k => REPORT_MODULE_MAP[k]);
    const inline = new Set((s.inline || []).filter(k => REPORT_MODULE_MAP[k]));
    // 宽度倍数：只认 2 或 3，缺省（含没写、写了 1、写了别的乱七八糟的值）一律当 1 倍，
    // 不单独存"1"这个占位值——跟 inline 一样，没设置就是最基本的默认状态
    const widths = {};
    Object.entries(s.widths || {}).forEach(([k, v]) => {
      if (modules.includes(k) && (v === 2 || v === 3)) widths[k] = v;
    });
    const rows = [];
    modules.forEach((k, i) => {
      // 第一个模块永远另起一行——它没有"上一个"可以跟
      if (i > 0 && inline.has(k) && rows.length) rows[rows.length - 1].push(k);
      else rows.push([k]);
    });
    return { id: s.id, title: s.title || '（未命名区域）', modules, inline: [...inline], widths, rows };
  });
}
/* 保存编排。刻意不进撤销栈（不调 snapshot）：编排是配置不是数据，
   Ctrl+Z 半路把它拨回去，人会完全搞不清自己刚才在改什么；
   要退回原样有"恢复默认编排"这个明确的按钮。 */
async function saveReportConfig(mutate) {
  const cur = DB.reportConfig || {};
  const next = {
    presets: clone(reportPresets()),
    activeId: activeReportPreset().id,
    rev: (cur.rev || 0) + 1,
    updated_at: new Date().toISOString(),
    updated_by: DB.settings.me || '未署名',
  };
  mutate(next);
  DB.reportConfig = next;
  await Repo.persist(DB);
  renderReport();
}
function reportPresetIn(cfg) { return cfg.presets.find(p => p.id === cfg.activeId) || cfg.presets[0]; }

let reportConfigOpen = false;   // 配置面板展开着没有（只影响本机，不进共享文件）
// 配置面板：区域可增删改名、可上下移，每个区域里勾选要包含哪些模块；另外可以存多套编排随时切换
function reportConfigPanelHTML() {
  const cfg = DB.reportConfig;
  const presets = reportPresets(), active = activeReportPreset(), sections = reportSections();
  const presetOpts = presets.map(p => `<option value="${esc(p.id)}"${p.id === active.id ? ' selected' : ''}>${esc(p.name || '未命名')}</option>`).join('');
  /* 模块从十来个涨到二十多个之后，原来那种"把所有模块平铺成一片勾选框"的配置方式已经不能用了：
     找不到目标模块，也完全看不出选中的那几个是什么顺序、哪几个并排。
     改成上下两块——上面是"这个区域现在有什么"（按实际顺序，能排序/设同行/移除），
     下面是"还能加什么"（按分类折叠，只列没被选进来的）。 */
  // 同一份报表里，一个模块只该出现一次——不然同一块数字在两个区域里各念一遍，汇报时会很怪。
  // 这里先把"整份报表已经用掉的模块"汇总成一个集合，下面每个区域的候选列表都拿这份集合去减，
  // 而不是只减自己区域已选的那几个，这样别的区域用过的模块就不会再冒出来当候选。
  const usedElsewhere = new Set(sections.flatMap(sec => sec.modules));
  const secRows = sections.map((s, i) => {
    const chosen = s.modules.map((k, j) => {
      const m = REPORT_MODULE_MAP[k];
      const inline = s.inline.includes(k);
