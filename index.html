    const fileName = effectiveShareCfg().fileName;
    const handle = await dirHandle.getFileHandle(fileName, { create: true });
    const text = await (await handle.getFile()).text();
    let remote = { duties: [], works: [], milestones: [], tasks: [], changelog: [], users: [], permissionMatrix: null, shareConfig: null };
    if (text.trim()) {
      let parsed;
      try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
      if (!isValidShareData(parsed)) {
        showSnack('这个文件夹里的文件不是本应用的数据格式，连接失败，请确认选对了共享文件夹');
        return;   // 不算连接成功：不设置 _fileHandle，也不记这台设备"连过"
      }
      remote = parsed;
    }
    // 文件是更新版本的 html 写的：不连了，直接挡住要求先换新版；否则一编辑就会把新版本的字段抹掉
    if (!checkDataVersion(remote)) return;
    if (!checkAppVersion(remote)) return;   // 同理：本机这份 html 落后于共享文件里见过的版本，先别连
    // 这台设备第一次真正连上共享文件夹：本机之前可能一直在用演示数据，也可能有人趁着还没连上时
    // 自己建过账号——这些都不能拿去跟共享文件"合并"，直接以共享文件为准，避免测试数据/自建账号
    // 污染大家的真实数据。shareConfig/permissionMatrix 是管理员在本机配置、可能还没来得及连接就
    // 已经存在的设置，继续用原来"谁的版本更新听谁的"规则，不能被一个全新空文件的 null 值冲掉
    const firstEverConnect = !(await hasEverConnectedShare());
    if (firstEverConnect) {
      DB.duties = remote.duties || [];
      DB.works = remote.works || [];
      DB.milestones = remote.milestones || [];
      DB.tasks = remote.tasks || [];
      DB.changelog = remote.changelog || [];
      DB.users = remote.users || [];
      DB.purged = remote.purged || [];   // 墓碑也整体听共享文件的，本机那些只针对演示数据的墓碑没有意义
      DB.permissionMatrix = mergePermissionMatrix(DB.permissionMatrix, remote.permissionMatrix);
      DB.shareConfig = mergePermissionMatrix(DB.shareConfig, remote.shareConfig);
      DB.reportConfig = mergePermissionMatrix(DB.reportConfig, remote.reportConfig);
      if (!DB.users.some(u => u.name === DB.settings.me && !u.deleted_at)) DB.settings.me = '';
    } else {
      const merged = mergeSyncPayload(syncPayload(DB), remote);
      Object.assign(DB, merged);
    }
    rebuildIndex();
    await idbSetHandle(dirHandle);
    _dirHandle = dirHandle;
    _fileHandle = handle;
    _everConnected = true;   // 以后这台设备再没连上就得报警了（见 Repo.persist）
    _offlineMode = false;   // 手动连上了，离线警告可以撤掉了
    _needPermissionRestore = false;
    _lastSyncedMtime = 0;   // 强制下一次保存重新核对文件是否被动过，而不是直接覆盖
    DB.settings.sharedFileName = fileName;
    DB.settings.sharedFolderName = dirHandle.name;
    await Repo.persist(DB);
    renderShell(); renderPage();
    showSnack('已连接共享文件夹：' + dirHandle.name);
    startAutoReload();
    // 首次真连接会清掉本机身份（本机自建的身份不算数）——这时候没法自动认出是谁，
    // 只能重新弹一次门禁，让这台设备的使用者从共享文件里的真实账号名单里选自己、走一遍姓名+PIN
    if (!DB.settings.me) await ensureIdentity();
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // 用户自己关掉了选择框，不算错误
    showSnack('连接失败：' + (e && e.message ? e.message : e));
  }
}
// 手动点"连接共享文件夹"（顶栏提示/数据页按钮）：先提醒一句要选哪个文件夹，
// 点"继续连接"之后才真的弹系统选择框——这一步不是权限门槛，只是把话说清楚
function confirmConnectWithHint(afterConfirm) {
  const fileName = effectiveShareCfg().fileName;
  openModal('连接共享文件夹', `
    <p>接下来会弹出系统自带的文件夹选择框，请选中处里共享的那个数据文件夹
      （里面应该有一个叫 <code>${esc(fileName)}</code> 的文件，没有的话程序会自动新建一个空的）。</p>`,
    '继续连接', async () => { closeModal(); await afterConfirm(); });
}
// 登录/建号成功后调用：这时候是真的用户点击（"确认"/"创建"按钮）触发的，浏览器允许在这个手势范围内弹文件夹选择框；
// 只有"这台设备还没连"才会弹，不会每次登录都莫名其妙弹一个选择框。
async function maybeAutoConnectSharedFolder() {
  if (_fileHandle) return;
  if (!('showDirectoryPicker' in window)) return;
  showSnack('即将弹出系统的文件夹选择框，请选中处里共享的那个数据文件夹');
  await connectSharedFile();
}
/* ---- 管理员定期自动备份 ----
   共享文件夹里那一个 json 是全处唯一的一份数据，被误删/被写坏就全没了。所以让管理员挂一个定期快照：
   每隔 N 小时把当前完整数据另存一份到他自己指定的文件夹里，文件名带时间戳，只增不覆盖。

   为什么这些设置只存在管理员本机（DB.settings 不进共享文件）：备份是"这台电脑往这个文件夹存"，
   换台电脑、换个人，目标文件夹根本不存在；而且文件夹句柄本身也没法同步给别人。 */
const BACKUP_MIN_HOURS = 1;
function backupCfg() {
  const s = DB.settings || {};
  // 开关/间隔现在存在 DB.shareConfig 里、随共享文件同步；备份目标文件夹的句柄没法跨设备用，
  // 那两项（dirName/lastAt）继续留在本机 settings
  const cfg = effectiveShareCfg();
  return {
    enabled: cfg.autoBackupEnabled,
    hours: cfg.autoBackupHours,
    dirName: s.autoBackupDirName || '',
    lastAt: s.autoBackupAt || '',
  };
}
// 距离上次备份是否已经够久了。从没备份过就算"该备份"
function backupDue() {
  const c = backupCfg();
  if (!c.enabled) return false;
  if (!c.lastAt) return true;
  const last = Date.parse(c.lastAt);
  if (isNaN(last)) return true;
  return (Date.now() - last) >= c.hours * 3600 * 1000;
}
/* 真正写一份备份出去。manual=true 是管理员点"立即备份一次"，这时候有用户手势，
   授权失效可以当场要回来；自动触发时没有手势，只能悄悄跳过，同时挂上"下次随便点一下页面
   就静默要回授权"这个监听（armBackupPermAutoRestore），不用非得等管理员想起来去点那个按钮。
   返回是否真的写成功了。 */
async function runBackup(manual) {
  if (!roleAtLeast('admin')) { if (manual) showSnack('只有管理员能做这个备份'); return false; }
  let dir = null;
  try { dir = await idbGetBackupDir(); } catch (e) {}
  if (!dir) { if (manual) showSnack('还没有指定备份文件夹，请先点"选择备份文件夹"'); return false; }
  let perm = 'denied';
  try { perm = await dir.queryPermission({ mode: 'readwrite' }); } catch (e) {}
  if (perm !== 'granted') {
    if (!manual) {
      // 没有用户手势，requestPermission 调不了，只能先跳过这一轮；同时挂上一次性的点击监听，
      // 管理员接下来在页面上随便点一下（不用特意去点"立即备份一次"）就会顺势把授权静默要回来，
      // 下一轮定时器再跑的时候就不会再跳过了——见 armBackupPermAutoRestore。
      // 以前这里是纯静默 return，跳过的事实完全没人知道，配合过去"备份定时器可能压根没启动"的
      // bug，会让人以为定期备份在正常跑、实际上已经很久没写过——所以现在至少弹一句节流过的提示，
      // 不刷屏（20 分钟内最多提一次），但不会再彻底沉默
      _backupPermLapsed = true;
      armBackupPermAutoRestore();
      const now = Date.now();
      if (now - _lastBackupAuthWarnAt > 1200000) {
        _lastBackupAuthWarnAt = now;
        showSnack('⚠ 定期备份这一轮跳过了：备份文件夹的写入授权已失效，之后随便点一下页面就会自动要回授权');
      }
      return false;
    }
    try { perm = await dir.requestPermission({ mode: 'readwrite' }); } catch (e) {}
    if (perm !== 'granted') { showSnack('没有拿到备份文件夹的写入授权'); return false; }
  }
  _backupPermLapsed = false;   // 走到这说明授权是好的（本来就有，或者刚要回来了），别再挂着等点击了
  try {
    const name = `工作管理备份_${stamp()}.json`;
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(DB, null, 1));
    await w.close();
    DB.settings.autoBackupAt = new Date().toISOString();
    DB.settings.lastBackupAt = DB.settings.autoBackupAt;   // 顺便消掉"很久没备份了"的提醒
    markBackupSlotUsed();   // 占掉这个备份周期，别的标签页的定时器就不会再写一份
    await Repo.persist(DB);
    if (manual) { renderPage(); showSnack('已备份：' + name); }
    return true;
  } catch (e) {
    if (manual) showSnack('备份失败：' + (e && e.message ? e.message : e));
    return false;
  }
}
// 开机和每轮定时同步时都问一句：到点了就顺手备份一次
async function maybeAutoBackup() {
  if (!backupDue()) return;
  // 再问一句"这个备份周期是不是已经有别的标签页做过了"——backupDue 看的是本标签页
  // 内存里的 DB，看不到隔壁标签页刚写完的那一份（见 claimBackupSlot 的注释）
  if (!claimBackupSlot(backupCfg().hours)) return;
  await runBackup(false);
}
/* 开机时就先把备份文件夹的授权状态摸一遍底，不用等到备份真正到期那一刻才发现授权早就失效了——
   到期时定时器没有用户手势、只能干跳过，之前反反复复出问题就是这个：管理员开着页面一整天，
   中间点了无数次别的东西，但因为授权失效这件事要等真到点了才会被发现，早就错过了能顺手把
   授权要回来的时间窗口。开机就查一遍、发现失效就立刻挂监听，之后随便一次点击都能把它捡回来，
   真正到点时授权大概率已经是好的了。跟共享文件那条 armPermissionAutoRestore 是同一个思路，
   两者互不干扰（分别管各自的文件句柄）。 */
async function checkBackupPermOnBoot() {
  if (!roleAtLeast('admin')) return;
  let dir = null;
  try { dir = await idbGetBackupDir(); } catch (e) {}
  if (!dir) return;
  let perm = 'denied';
  try { perm = await dir.queryPermission({ mode: 'readwrite' }); } catch (e) {}
  if (perm !== 'granted') { _backupPermLapsed = true; armBackupPermAutoRestore(); }
}
// 用户在页面上第一次点击时顺势把备份文件夹的授权要回来（一次性，成功与否都不再重复挂，
// 避免同一次刷新里反复弹出浏览器原生授权框骚扰管理员）。要回来之后，如果这次备份本来就该
// 到期了却因为授权问题跳过了，顺手就地补上这一次，不用干等下一轮定时器。
function armBackupPermAutoRestore() {
  if (!_backupPermLapsed) return;
  const once = async () => {
    document.removeEventListener('click', once, true);
    if (!_backupPermLapsed || _backupPermRestoring) return;
    _backupPermRestoring = true;
    try {
      let dir = null;
      try { dir = await idbGetBackupDir(); } catch (e) { return; }
      if (!dir) { _backupPermLapsed = false; return; }
      let perm = 'denied';
      try { perm = await dir.requestPermission({ mode: 'readwrite' }); } catch (e) { return; }
      if (perm !== 'granted') return;
      _backupPermLapsed = false;
      if (backupDue()) await runBackup(false);
    } finally { _backupPermRestoring = false; }
  };
  document.addEventListener('click', once, true);
}

/* ---- 刷新页面后把读写授权要回来 ----
   浏览器的文件系统访问授权默认不跨页面存活：重新打开页面时 queryPermission 一般返回 'prompt'。
   这不是"连不上"，但 requestPermission 必须在用户手势里调用，代码没法自己偷偷恢复——这是平台规则。
   所以做两手：顶栏给一个明确的按钮；同时挂一个一次性监听，用户在页面上第一次点任何地方就顺势把授权要回来，
   多数情况下用户根本不用去找那个按钮，点一下"允许"就继续用了。 */
let _restoringPermission = false;
/* ★ "任何正式保存都要真正触发一次同步尝试"就是靠这个函数兑现的 ★
   刷新页面后授权失效是"看着保存成功、其实没同步出去"最常见的原因：_fileHandle 是 null，
   Repo.persist 只能把这次改动记成"待同步"，指望用户自己另外去点一下顶栏那个红色按钮，
   或者随便点一下页面（armPermissionAutoRestore 的一次性监听）。问题是，如果同事刷新页面之后
   第一个动作就是打开任务详情改点东西、然后点保存——在这之前他完全没有"随便点别处"的机会，
   授权自然一直没恢复，这次保存也就注定进"待同步"，而不是真的推给大家。
   但"点保存"这个动作本身，跟"点页面任意位置"一样，都是一次真实的用户手势——
   请求文件读写授权必须发生在用户手势里，这两者是等价的。与其干等用户之后去点别的地方，
   不如就地把这次点击的手势用掉，在真正开始保存之前，先试着把授权要回来：
   成功了这次保存就能如实同步出去，失败了也没有任何损失，照常按原来的"待同步"逻辑处理。
   跟 armPermissionAutoRestore 共用 _restoringPermission 这把锁，避免两边同时各发一次
   requestPermission 请求。 */
async function ensureFileHandleFresh() {
  if (_fileHandle || !_needPermissionRestore || _versionBlocked || _staleAppBlocked || _restoringPermission) return;
  _restoringPermission = true;
  try {
    let handle = null;
    try { handle = await idbGetHandle(); } catch (e) { return; }
    if (!handle) return;
    let perm = 'denied';
    try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { return; }
    if (perm !== 'granted') return;
    await tryReconnectSharedFile();
  } finally { _restoringPermission = false; }
}
async function doRestoreSharePermission() {
  let handle = null;
  try { handle = await idbGetHandle(); } catch (e) {}
  if (!handle) { showSnack('本机没有存过共享文件夹，请重新连接一次'); await confirmConnectWithHint(connectSharedFile); return; }
  let perm = 'denied';
  try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) {}
  if (perm !== 'granted') { showSnack('没有拿到读写授权，暂时按离线用；点顶栏那个按钮可以再试一次'); return; }
  if (await tryReconnectSharedFile()) {
    _offlineMode = false;
    _needPermissionRestore = false;
    const hadPending = !!DB.settings.pendingSync;
    await Repo.persist(DB);          // 跟共享文件合并一次；积压在本机的改动也在这一步整批推上去
    // ★ 门禁开着的时候绝对不能重画它 ★
    // 这个函数多半是被"用户第一次点页面"那个一次性监听触发的，而用户第一次点页面
    // 往往正是在登录门禁里（点输入框、点"下一步"）。以前这里无条件调 ensureIdentity() + renderPage()，
    // 会把人家刚输了一半的姓名/PIN 整个清掉、退回第一步——同事因此反复被打断，
    // 很可能干脆把浏览器的授权框点掉了，于是整个会话都是断开的，改什么都同步不出去
    if (!_loginResolve) {
      if (!DB.settings.me) await ensureIdentity();
      renderShell(); renderPage();
    }
    showSnack(hadPending ? '已恢复共享连接，本机积压的改动已经同步给大家了' : '已恢复共享文件夹连接');
  } else {
    showSnack('恢复失败，请点「连接共享文件夹」重新选一次');
  }
}
// 用户在页面上第一次点击时顺势恢复授权（一次性，成功与否都不再重复挂）。
// 用捕获阶段是为了抢在正常的点击处理之前拿到这次用户手势，但不阻断它——原来的点击照常生效
function armPermissionAutoRestore() {
  if (!_needPermissionRestore) return;
  const once = async () => {
    document.removeEventListener('click', once, true);
    if (!_needPermissionRestore || _restoringPermission) return;
    _restoringPermission = true;
    try { await doRestoreSharePermission(); } finally { _restoringPermission = false; }
  };
  document.addEventListener('click', once, true);
}
async function disconnectSharedFile() {
  _fileHandle = null;
  _dirHandle = null;
  stopAutoReload();
  try { await idbClearHandle(); } catch (e) {}
  DB.settings.sharedFileName = '';
  DB.settings.sharedFolderName = '';
  // 主动断开是用户自己的决定，不算"该同步却没同步"，别再红着提示了
  _everConnected = false;
  DB.settings.pendingSync = false;
  await Repo.persist(DB);
  renderShell(); renderPage();
  showSnack('已断开，改回本机存储');
}
// 开机时悄悄尝试接回上次连接的文件夹；权限失效时不硬闯，留给用户在数据页手动点"重新连接"
async function tryReconnectSharedFile() {
  try {
    const handle = await idbGetHandle();
    if (!handle) return false;   // 这台设备从没连过
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      // ★ 刷新页面后最常见的就是这一条 ★
      // 文件系统访问权限默认不跨页面存活，重新打开页面时 queryPermission 通常返回 'prompt' 而不是 'granted'。
      // 这不是"连不上"，只是需要用户点一下重新授权（requestPermission 必须在用户手势里调，代码没法自己偷偷调）。
      // 所以这里跟真的离线区分开：标记成"等着授权"，顶栏给一个点一下就能恢复的按钮，
      // 不再一律显示"离线模式"，也不用再重新走一遍选文件夹。
      _needPermissionRestore = true;
      return false;
    }
    _needPermissionRestore = false;
    _everConnected = true;
    if (handle.kind === 'directory') {
      const fileName = effectiveShareCfg().fileName;
      _dirHandle = handle;
      _fileHandle = await handle.getFileHandle(fileName, { create: true });
    } else {
      _fileHandle = handle;   // 兼容升级前连的是文件句柄（还没重新连接过），先照旧用，下次点"重新连接"就会升级成文件夹句柄
    }
    // 开机接回来之后先看一眼版本：文件要是被更新版本的 html 写过，这里就直接挡住，
    // 不能等到用户改了点东西、第一次保存时才发现——那时候界面上的编辑动作已经做完了
    const cur = await readSharedFile();
    if (cur) cacheRemoteWriteInfo(cur.remote);
    if (cur && !checkDataVersion(cur.remote)) return true;
    // 开机接回来就先查一次版本：要拦就在用户动手改东西之前拦，不能等他改了半天第一次保存才说不行
    if (cur && !checkAppVersion(cur.remote)) return true;
    // 开机接上共享文件夹本身就是一次"人来了"，先把心跳盖上，
    // 等 5 分钟那一轮定时同步顺路推上去（见 touchPresence）
    touchPresence();
    startAutoReload();
    return true;
  } catch (e) { return false; }
}

let _importEntity = 'task', _importMode = 'merge';
// 导入前先问清楚：覆盖模式按编号认领已有记录，增量模式一律当新增、编号自动接续
function openImportModal(entity) {
  const label = schema(entity).label;
  const byCode = ['duty', 'work', 'task'].includes(entity);
  openModal(`导入${label} CSV`, `
    <div class="form-row"><label>导入模式</label>
      <select id="imp-mode">
        <option value="merge">覆盖模式</option>
        <option value="append">增量模式</option>
      </select>
    </div>
    <div class="hint" style="margin-top:6px">${byCode
      ? `覆盖模式：按${label}编号匹配已有记录，存在则覆盖，不存在则新增。<br>增量模式：不管 CSV 里写的编号是什么，一律当作新增项，编号自动接续现有的最大编号。`
      : '里程碑没有独立编号：两种模式都按 id 匹配，有 id 且能找到对应记录时覆盖，否则新增；增量模式会忽略 id 一律新增。'}</div>`,
    '选择文件', () => {

}
// 解析并写入一份 CSV 文本；entity/mode 见 openImportModal 的说明。返回实际写入的行数。
async function applyCSVImport(entity, mode, text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const sc = schema(entity);
  const rows = parseCSV(text);
  if (rows.length < 2) { showSnack('CSV 内容为空'); return 0; }
  const head = rows[0].map(s => s.trim());
  const get = (cols, k) => { const i = head.indexOf(k); return i >= 0 ? (cols[i] || '') : ''; };
  let n = 0;
  snapshot();
  await Repo.bulk(() => {
    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i], rec = {};
      sc.fields.filter(f => !f.virtual).forEach(f => {
        const raw = get(cols, f.key);
        if (f.type === 'lines') rec[f.key] = parseLines(raw);
        else if (f.type === 'multi' || f.type === 'persons') rec[f.key] = splitMulti(raw);
        else if (['code', 'work', 'duty'].includes(f.key)) rec[f.key] = padCode(raw);
        else rec[f.key] = raw;
      });
      if (sc.pk === 'id') {
        let id;
        if (mode === 'append') {
          // 增量模式：永远新增，编号无视 CSV 内容、按当前最大编号自动接续
          id = '';
          if (entity === 'work') rec.code = nextWorkCode(rec.duty, Number(rec.year) || DB.settings.year || new Date().getFullYear());
          if (entity === 'task') rec.code = rec.work ? nextTaskCode(rec.work) : '';
        } else {
          // 覆盖模式：按「编号（+年度）」认领已有记录，找不到才新建
          id = get(cols, 'id');
          if (entity === 'work' && rec.code) {
            const hit = DB.works.find(w => w.code === rec.code && String(w.year) === String(rec.year));
            if (hit) id = hit.id;
          } else if (entity === 'task' && rec.code) {
            const hit = DB.tasks.find(t => t.code === rec.code && !t.deleted_at);
            if (hit) id = hit.id;
          }
        }
        rec.id = id || uid(entity[0]);
      } else {
        // 目前只有职责的主键就是编号本身
        if (mode === 'append') {
          const used = DB.duties.map(d => parseInt(d.code) || 0);
          rec.code = String((used.length ? Math.max(...used) : 0) + 1).padStart(2, '0');
        }
        if (!rec[sc.pk]) continue;
      }
      if (entity === 'task' && !rec.code && rec.work) rec.code = nextTaskCode(rec.work);   // 兜底：仍没编号则按所属工作自动生成
      ['created_at', 'updated_at', 'updated_by', 'deleted_at'].forEach(k => { const v = get(cols, k); if (v) rec[k] = v; });
      rec.rev = Number(get(cols, 'rev')) || 1;
      normalize(entity, rec);
      const list = coll(entity);
      const j = list.findIndex(x => x[sc.pk] === rec[sc.pk]);
      if (j === -1) list.push(rec); else list[j] = rec;
      n++;
    }
  });
  return n;
}

// 返回 { taskN, msN, skipped }
async function applyWideImport(mode, text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = parseCSV(text);
  if (rows.length < 2) { showSnack('CSV 内容为空'); return null; }
  const head = rows[0].map(s => s.trim());
  const get = (cols, k) => { const i = head.indexOf(k); return i >= 0 ? (cols[i] || '').trim() : ''; };
  let taskN = 0, msN = 0, skipped = 0, badDate = 0;
  snapshot();
  await Repo.bulk(() => {
    for (let i = 1; i < rows.length; i++) {
      const cols = rows[i];
      const workName = get(cols, '所属工作项');
      const code = get(cols, '任务项编号');
      const title = get(cols, '任务项名称');
      if (!workName && !title) continue;   // 空行跳过，不计入 skipped
      const work = DB.works.find(w => !w.deleted_at && w.name === workName) ||
                   DB.works.find(w => !w.deleted_at && w.code === padCode(workName));
      if (!work) { skipped++; continue; }
      const owner = get(cols, '任务项牵头人');
      const assignees = splitMulti(get(cols, '任务项参与人'));

      /* ★ 覆盖模式下认领已有任务的规则 ★
         原来只按「任务项编号」找。但线下整理的表里这一列经常是空的（新任务本来就还没有编号），
         一空就走到 else 分支新建一条——于是同一份表导第二次，编号为空的那些任务会被整批再建一遍，
         看起来就是"所有任务都被复制了"。这正是这次事故最可能的来源。
         补一条兜底：编号为空时，按「同一项工作下的同名任务」认领。名字和所属工作都一样，
         在这个系统里就是同一条任务，不该再新建。 */
      let task = null;
      if (mode === 'merge') {
        if (code) task = DB.tasks.find(t => !t.deleted_at && t.code === code);
        if (!task && title) task = DB.tasks.find(t => !t.deleted_at && t.work === work.id && t.title === title);
      }
      if (task) {
        task.work = work.id;
        if (title) task.title = title;
        if (owner) task.owner = owner;
        if (assignees.length) task.assignees = assignees;
        stampMeta(task);
        // 覆盖模式：这条任务原有的里程碑整体清空重建，跟宽表这一行的内容对齐
        DB.milestones.filter(m => m.task === task.id && !m.deleted_at).forEach(m => softDelete('milestone', m.id));
      } else {
        task = blank('task', { work: work.id, title: title || '未命名任务', owner, assignees, status: 'todo', priority: '2', progress: 0 });
        task.code = (code && mode === 'merge') ? code : nextTaskCode(work.id);
        stampMeta(task);
        DB.tasks.push(task);
      }
      taskN++;

      for (let g = 1; g <= WIDE_MS_GROUPS; g++) {
        const [hDate, hDeliv, hReport] = wideMsHeaders(g);
        const rawDate = get(cols, hDate), deliv = get(cols, hDeliv), rawReport = get(cols, hReport);
        if (!rawDate && !deliv) continue;
        const planDate = parseCSVDate(rawDate);
        if (rawDate && !planDate) badDate++;   // 有填日期但识别不出来，留空好过存一个格式错误的字符串
        const m = blank('milestone', {
          task: task.id, plan_date: planDate, deliverable: deliv,
          report_level: reportLevelFromLabel(rawReport), done: '0', actual_date: '',
        });
        stampMeta(m);
        DB.milestones.push(m);
        msN++;
      }
      recalcProgress(task);
    }
  });
  return { taskN, msN, skipped, badDate };
}

function makeRng(seed) {
  let s = seed;

}

  const rng = makeRng(20260720);
  const pick = a => a[Math.floor(rng() * a.length)];
  const people = uniq(SEED_WORKS.flatMap(w => [w[4], ...w[5]]));
  const DELIVS = ['初稿文档', '评审纪要', '数据台账', '报送回执', '正式文本', '跟踪表', '汇报材料', '会议纪要'];

    const short = w.name.length > 12 ? w.name.slice(0, 10) + '…' : w.name;
    for (let i = 0; i < n; i++) {

      if (r < 0.30)      { status = 'done';  plan = offsetDate(-150 + Math.floor(rng() * 150)); actual = plan; progress = 100; }
      else if (r < 0.48) { status = 'doing'; plan = offsetDate(2 + Math.floor(rng() * 40));   progress = 10 + Math.floor(rng() * 80); }
      else if (r < 0.62) { status = 'doing'; plan = offsetDate(-25 + Math.floor(rng() * 20)); progress = 20 + Math.floor(rng() * 50); } // 含逾期
      else if (r < 0.72) { status = 'hold';  plan = offsetDate(-20 + Math.floor(rng() * 60)); }
      else if (r < 0.80) { status = 'todo';  plan = ''; }                                        // 无计划日期
      else               { status = 'todo';  plan = offsetDate(Math.floor(rng() * 60)); }
      if (rng() > 0.88 && status !== 'done') plan = todayStr();                                   // 今日到期

      const others = people.filter(p => p !== w.owner);
      const assignees = rng() > 0.45 ? [pick(others)] : (rng() > 0.6 ? [pick(others), pick(others)] : []);
      // 创建时间铺开到过去 ~6 个月，让「按时间」的月度趋势图有真实形状
      const createdAt = new Date(Date.now() - Math.floor(rng() * 190) * 86400000).toISOString();
      const t = stampMeta(blank('task', {
        created_at: createdAt,
        work: w.id,
        code: nextTaskCode(w.id),
        title: tpl[0].replace('{n}', short),
        owner: rng() > 0.25 ? w.owner : pick(people),
        assignees: uniq(assignees),
        status, priority: String(1 + Math.floor(rng() * 3)),
        plan_date: plan, actual_date: actual, progress,
        source: pick(['领导交办', '例行工作', '监管要求', '内部发起', '']),
        custom: '测试',
      }));
      DB.tasks.push(t);

      if (rng() > 0.5) {                                 // 约一半任务挂里程碑，进度随之改为自动计算
        const n2 = 1 + Math.floor(rng() * 3);
        const delivs = uniq([tpl[1], pick(DELIVS), pick(DELIVS)]).filter(Boolean);
        for (let k = 0; k < n2; k++) {
          const off = -60 + Math.floor(rng() * 150);
          const cpPlan = offsetDate(off);
          const cpDone = status === 'done' || (off < 0 && rng() > 0.4);
          DB.milestones.push(stampMeta(blank('milestone', {
            task: t.id, plan_date: cpPlan,
            deliverable: delivs[k % delivs.length] || '交付物',
            done: cpDone ? '1' : '0',
            actual_date: cpDone ? cpPlan : '',
          })));
        }
        recalcProgress(t);
      }
    }
  });

  // 顺手造一批变更日志，让「最近动态」一开始就有内容可看（种子任务本身是直接写入的，不走会记日志的编辑路径）
  const logTasks = DB.tasks.filter(t => !t.deleted_at);
  for (let i = 0; i < 12 && logTasks.length; i++) {
    const t = pick(logTasks);
    const at = new Date(Date.now() - (i * 3 + Math.floor(rng() * 5)) * 3600000).toISOString();
    const kind = rng();
    let summary;
    if (kind < 0.25) summary = '状态：未开始→进行中';
    else if (kind < 0.45) summary = '状态：进行中→已完成';
    else if (kind < 0.65) summary = `计划完成：${offsetDate(-5)}→${offsetDate(3)}`;
    else if (kind < 0.85) summary = `完成了里程碑交付「${pick(DELIVS)}」`;
    else summary = '新建了任务';
    DB.changelog.push({ id: uid('log'), at, by: pick(people), taskId: t.id, summary });
  }
  DB.changelog.sort((a, b) => a.at.localeCompare(b.at));
  rebuildIndex();
}

/* =============================================================
   27. 启动
   ============================================================= */
async function boot() {
  // 先问一句"这台设备连过共享文件夹没有"，再往下走。
  // 必须放在最前面：下面的数据迁移、身份门禁都会调 Repo.persist，而 persist 要靠 _everConnected
  // 判断"这次保存没推上共享文件到底该不该报警"。晚一步问，开机头几次保存就会漏报
  if ('showDirectoryPicker' in window) {
    try { _everConnected = await hasEverConnectedShare(); } catch (e) { _everConnected = false; }
  }
  const saved = await Repo.load();
  if (saved && saved.duties) {
    /* 这份本机缓存是不是别的版本的 html 写的（见 Repo.persist 里的 localAppVersion）。
       只记下来，不擅自清空——本机缓存有可能正是唯一一份还没推上去的改动，
       二话不说清掉是会真丢数据的。判断和处置交给管理员，在数据页给入口。
       没有这个字段的是这次改动之前写的老缓存，同样算"来路不明"。 */
    _localCacheAppVersion = (saved.settings && saved.settings.localAppVersion) || '';
    _localCacheStale = _localCacheAppVersion !== APP_VERSION;
    // 换了版本 = 这份缓存跟共享文件之间隔了一段时间，接下来那次合并是"追平"而不是事故，
    // 放行一次熔断告警，免得每次发版全处都被同一句吓一跳（见 noteMergeAlerts）
    _skipDamageAlertOnce = _localCacheStale;
    DB = Object.assign(DB, saved);
    DB.settings = Object.assign({ me: '', role: 'manager', year: new Date().getFullYear() }, saved.settings || {});
    ['duty', 'work', 'milestone', 'task'].forEach(e => coll(e).forEach(r => normalize(e, r)));
    rebuildIndex();   // migrateWorkIds/migrateTaskCodes 内部用 byId 查找，必须先有索引才能查到，否则全部落空
    const migrated = migrateWorkIds();
    if (migrated) rebuildIndex();   // 工作 id 变了，重建索引后 migrateTaskCodes 才能按新 id 查到工作
    const migratedMs = migrateMilestonesToTasks();
    const migratedCodes = migrateTaskCodes();
    const migratedPerm = migrateViewDataDefault();
    if (migratedMs || migratedCodes || migrated || migratedPerm) await Repo.persist(DB);
    rebuildIndex();
    restoreUI();
  }
  // 首次打开、本机没有任何存档：什么都不做，就是一份空系统。
  // 这个 html 不自带任何演示/测试数据——它是发给全处同事的正式工具，一打开就摆一堆假任务，
  // 既容易被当成真数据，也可能被谁一不小心同步进共享文件里。数据只有两个来源：连共享文件夹，或者管理员导入。
  if ('showDirectoryPicker' in window) {
    const reconnected = await tryReconnectSharedFile();
    if (reconnected) {
      await Repo.persist(DB);   // 接回上次连接的共享文件，顺带合并一次
    } else if (_needPermissionRestore) {
      // 句柄还在，只是刷新页面后读写授权失效了——这不算离线。顶栏会给一个"点击恢复共享连接"，
      // 同时挂上"第一次点页面任何地方就自动恢复"，用户基本无感（见 armPermissionAutoRestore）
      armPermissionAutoRestore();
    } else if (_everConnected) {
      _offlineMode = true;   // 连过、这次真接不回来（文件夹挪了/网盘没挂上）：先用本机缓存离线进入，不阻塞使用
    }
    // 从没连过：不强制阻塞，身份门禁上会带一个"连接共享文件夹"的按钮（见 renderLoginPick/renderLoginCreate）
  }
  if (_versionBlocked || _staleAppBlocked) return;   // 版本太旧已经被挡住了，后面的身份门禁/页面渲染都不用走了
  await ensureIdentity();   // 没有有效身份就在这里挂住，等选完/建完账号再往下走
  const p = (location.hash || '').replace(/^#\//, '');
  currentPage = PAGES.some(x => x.key === p) ? p : 'dashboard';
  goto(currentPage);

  maybeAutoBackup();   // 管理员开了定期备份、且距上次够久了，开机就顺手存一份（不阻塞界面）
  checkBackupPermOnBoot();   // 不等到真正到期才发现授权失效——开机就先摸一遍底，尽早挂上点击监听
  // ★ 不管共享文件这次开机连没连上，备份定时器都要启动 ★ 见 startAutoBackupTimer 的注释：
  // 这两件事本来就毫不相干，绑在一起是之前"到点没自动备份"的真正原因
  startAutoBackupTimer();

  // 备份提醒：数据只在本机浏览器，超过 7 天未备份且期间有改动就提示一次
  const bk = backupState();
  if (bk.stale && (bk.days === null || bk.days >= 7) && DB.tasks.length) {
    setTimeout(() => showSnack(bk.last
      ? `已 ${bk.days} 天未备份，且期间有改动 — 建议到「数据」页导出`
      : '数据仅存于本机浏览器，建议到「数据」页导出一份备份'), 1200);
  }
}
boot();
</script>
